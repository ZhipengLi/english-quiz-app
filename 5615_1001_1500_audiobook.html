s before a gilded (aureole) studded with smaller Buddhas. Pagodas rise in tiers to a bronze (spire), and at Horyu-ji, also near Nara, a cloistered (quadrangle) holds what are thought to be the world's oldest wooden buildings; Ms Takaichi took South Korea's president there in January. Zen, which prizes (discipline) and the direct transmission of insight from master to (disciple), gave Japan its tea ceremony and the raked-gravel gardens, (serene) and austere, of temples such as Kyoto's Ryoan-ji.", "zh": "日本约有7.7万座佛寺。在东京的浅草寺，参拜者把（香）烟扇到自己身上，祈求身体健康。奈良东大寺的青铜大佛铸于8世纪，坐在一个镶嵌着众多小佛像的镀金（背光）之前。佛塔层层叠起，顶端是青铜（尖顶）；同样在奈良附近的法隆寺，一座回廊环绕的（四方院落）中矗立着据认为是世界上最古老的木结构建筑；今年1月，高市女士曾带韩国总统前去参观。禅宗注重（修行）以及从师父到（弟子）的以心传心，它为日本带来了茶道，以及京都龙安寺等寺院里那些（宁静）而简朴的枯山水庭园。"}, {"en": "Most Japanese say they are not religious, yet they happily mix faiths. They are said to be born Shinto, marry Christian and die Buddhist. Although fewer than 1% of Japanese are Christians, many couples marry in wedding chapels topped with a (steeple), where the \"priest\" is sometimes a foreigner without holy orders hired for his looks: a harmless (imposture) that few guests mind. Christmas Eve is a romantic occasion for couples, and many families eat fried chicken from KFC at Christmas, thanks to a marketing campaign launched in 1974. The sacred and the (profane) sit easily together.", "zh": "大多数日本人说自己不信教，但他们乐于把各种信仰混在一起。据说日本人出生时信神道，结婚时信基督教，死时信佛教。虽然基督徒在日本人中不到1%，许多新人却在顶上有（教堂尖塔）的婚礼教堂举行婚礼，而“牧师”有时是一位没有圣职、因长相而被雇来的外国人：这是一种无伤大雅的（冒名顶替），宾客们也很少在意。平安夜是情侣们的浪漫时刻，许多家庭在圣诞节吃肯德基炸鸡，这要归功于1974年发起的一场营销活动。神圣与（世俗）相安无事。"}, {"en": "The traditional performing arts survive with state help. Gagaku, the music of the imperial court, is often described as the oldest orchestral (ensemble) tradition still played anywhere, dating back more than 1,000 years. Noh, codified by Zeami in the 14th and 15th centuries, unfolds at a glacial pace behind wooden masks. Kabuki's (repertoire) of revenge tragedies and domestic dramas is performed by all-male casts, in which specialist actors called onnagata play women with (lissome) grace. The shamisen, a three-stringed lute, gives much of this music its twanging (timbre).", "zh": "传统表演艺术靠国家扶持得以延续。雅乐是日本皇室的宫廷音乐，常被称为世界上仍在演奏的最古老的管弦乐（合奏）传统，可追溯到一千多年前。能乐由世阿弥在14至15世纪定型，在木制面具之后以冰川般缓慢的节奏展开。歌舞伎的（保留剧目）包括复仇悲剧和家庭剧，全部由男性演员演出，其中被称为“女形”的专职演员以（婀娜轻盈的）姿态扮演女性。三味线是一种三弦琴，这类音乐那种铮铮作响的（音色）大多来自于它。"}, {"en": "Crafts are a national obsession. Bonsai is (horticulture) in (miniature), with trees trained for decades, even centuries, to stay knee-high. Netsuke, toggles carved from ivory or boxwood, were made for their owners to (fondle); carvers would (incise) details as delicate as a cat's whiskers. Traditional rooms are measured in tatami mats, each a (rectangle) roughly twice as long as it is wide. Their shoji are translucent sliding paper screens that admit daylight without a glass (pane). Modern artists keep the obsession with detail. Yayoi Kusama, now in her 90s, has spent decades covering canvases, pumpkins and entire rooms with dots, as if to (stipple) the world itself.", "zh": "手工艺是一种全民痴迷。盆栽是（微缩）的（园艺），树木经过数十年乃至数百年的修剪，始终只有齐膝高。根付是用象牙或黄杨木雕刻的坠饰，制作出来就是供主人（把玩）的；雕刻师会（刻）出细如猫须的细节。传统房间以榻榻米计算面积，每张榻榻米都是长约为宽两倍的（长方形）。屋内的障子是透光的纸质推拉屏风，无须安装玻璃（窗格），也能让日光透进来。现代艺术家延续了对细节的执着。如今已九十多岁的草间弥生数十年来用圆点覆盖画布、南瓜乃至整个房间，仿佛要把整个世界都（点画）一遍。"}, {"en": "Literature thrives. Natsume Soseki's \"I Am a Cat\", published in 1905-06, is narrated by a nameless (feline) who observes his owner's household with the disdain of a (misanthrope). Yasunari Kawabata and Kenzaburo Oe won Nobel prizes for literature; Haruki Murakami, who ran a jazz bar before turning to fiction, is a perennial contender. Millions of amateurs still (compose) haiku, which (condense) a moment into 17 Japanese sound units, or morae, conventionally arranged 5-7-5, and (juxtapose) two images rather than draw an explicit (simile). Manga sells in staggering quantities. Commuters used to (riffle) through weekly anthologies in convenience stores, and the secondhand bookshops of Jimbocho in Tokyo, well over 100 of them, are a (bibliophile)'s paradise.", "zh": "文学蓬勃发展。夏目漱石出版于1905至1906年的《我是猫》，由一只无名的（猫）讲述，它带着一个（厌恶人类者）般的轻蔑观察主人一家。川端康成和大江健三郎获得了诺贝尔文学奖；村上春树在转向小说创作之前开过一家爵士酒吧，是诺奖的常年热门人选。数以百万计的业余爱好者仍在（创作）俳句，传统俳句把一个瞬间（浓缩）进17个日语音拍，通常按5-7-5排列，再（并置）两个意象，而不用直白的（明喻）。漫画销量惊人。通勤者过去常在便利店里（翻阅）漫画周刊，而东京神保町的旧书店多达一百多家，是（爱书人）的天堂。"}, {"en": "On screen Japan's reach is global. \"Godzilla\", a monster spawned by nuclear tests, had its (premiere) in 1954; \"Godzilla Minus One\" won an Oscar for visual effects in 2024. Studio Ghibli's films, (wholesome) and strange, have won two Oscars for best animated feature. Anime was long dismissed abroad as (infantile), but \"Demon Slayer: Infinity Castle\", released in 2025, took more than ¥100bn at the global box office, a record for a Japanese film. Studios (transpose) hit manga to the screen; animators may (tousle) a hero's hair in a fight scene and give him a gravity-defying sword, while fans buy a plastic (figurine) of a favourite character in Akihabara. The appetite seems (irrepressible).", "zh": "在银幕上，日本的影响力遍及全球。《哥斯拉》讲述了一头因核试验而诞生的怪兽，于1954年（首映）；《哥斯拉-1.0》于2024年获得奥斯卡最佳视觉效果奖。吉卜力工作室的电影（健康向上）而又奇特，两度获得奥斯卡最佳动画长片奖。动画在国外长期被视为（幼稚）的东西，但2025年上映的《鬼灭之刃：无限城篇》全球票房超过1000亿日元，创下日本电影的纪录。制片厂将热门漫画（改编）搬上银幕；动画师可能在打斗场景中把英雄的头发（弄得蓬乱），再让他挥舞仿佛不受重力影响的巨剑；粉丝则会在秋叶原买一尊心爱角色的塑料（手办）。这股热潮似乎（势不可挡）。"}, {"en": "Nintendo, which began in 1889 as a maker of playing cards, remains the world's most beloved games company. The Switch 2 sold 23.7m units in its first 13 months, making it the fastest-selling (console) in the firm's history. Shigeru Miyamoto's (inimitable) creations, Mario and Zelda among them, have entertained three generations. Pokémon, the highest-grossing media empire on earth, seems (inexhaustible); in 2016 \"Pokémon Go\" used phone cameras to (superimpose) cartoon monsters on real streets, sending millions wandering about in search of them.", "zh": "任天堂于1889年以生产纸牌起家，至今仍是世界上最受喜爱的游戏公司。Switch 2在头13个月售出2370万台，成为该公司史上销售最快的（游戏机）。宫本茂（无可模仿的）作品——马里奥和塞尔达等——已经陪伴了三代人。宝可梦是全球收入最高的媒体帝国，似乎（取之不尽）；2016年，《宝可梦GO》利用手机摄像头把卡通怪兽（叠加）在真实的街道上，让数以百万计的人四处游荡寻找它们。"}, {"en": "Then there is kawaii, the cult of cuteness. Hello Kitty, a (winsome) cat with no mouth, has been a global brand since 1974. Almost every prefecture has a mascot; Kumamon, a blushing black bear, has helped to (advertise) Kumamoto so successfully that goods bearing his face sell billions of yen a year. Customers pay by the hour to (cuddle) cats in cat cafés; teenagers encrust their phones with one glittering (rhinestone) after another, and nail artists decorate every finger from (cuticle) to tip. Fans (adore) it all, without a trace of irony.", "zh": "还有“卡哇伊”，即对可爱的崇拜。凯蒂猫是一只没有嘴巴、（惹人喜爱的）猫，自1974年以来一直是全球品牌。几乎每个县都有吉祥物；熊本熊是一只脸颊泛红的黑熊，它为熊本县所做的（宣传）如此成功，以至于印有它头像的商品每年销售额达数十亿日元。顾客按小时付费，在猫咖啡馆里（搂抱）猫咪；青少年给手机一颗接一颗地贴上闪亮的（水钻），美甲师则把每根手指从（指甲表皮）到指尖都装饰一番。粉丝们（热爱）这一切，没有丝毫反讽之意。"}, {"en": "Music is everywhere. Karaoke, invented in Japan in the early 1970s, is sung in soundproofed booths where a (tambourine) and maracas are standard issue. Idol groups churn out (saccharine) pop; older listeners prefer enka, (lachrymose) ballads of lost love and distant hometowns. Jazz arrived in the 1920s, starting with (ragtime), and the country still has hundreds of jazz cafés where patrons sit in rapt silence and a whispered remark is (audible) across the room. Children learn to read music early; the black symbols of sheet music are known in Japanese as \"otamajakushi\", a word meaning (tadpole).", "zh": "音乐无处不在。卡拉OK于20世纪70年代初在日本发明，人们在隔音包厢里唱歌，（铃鼓）和沙锤是标准配置。偶像团体批量生产（甜腻的）流行歌曲；年长的听众则偏爱演歌，那是一种吟唱逝去爱情和遥远故乡的（伤感）民谣。爵士乐于20世纪20年代传入日本，始于（拉格泰姆），如今日本仍有数百家爵士咖啡馆，顾客们屏息静听，一句耳语在房间另一头都（听得见）。孩子们很早就学习识谱；乐谱上那些黑色符号在日语里被称为“御玉杓子”，其字面意思是（蝌蚪）。"}, {"en": "Laughter is big business. Yoshimoto Kogyo, an Osaka agency, manages thousands of comics. In manzai, a double act, one partner says something absurd and the other whacks him on the head, a (jape) repeated endlessly on television. Variety shows (tease) their guests mercilessly. Naomi Watanabe, a (comedienne) famous for her Beyoncé routines, became a fashion icon with millions of followers on Instagram. Political (satire), by contrast, is rare on mainstream television, which is wary of offending the powerful.", "zh": "搞笑是一门大生意。大阪的吉本兴业旗下有数千名喜剧艺人。在漫才这种双人表演中，一人说出荒唐话，另一人就敲他的脑袋，这种（玩笑）在电视上没完没了地重复。综艺节目毫不留情地（取笑）嘉宾。渡边直美是一位以模仿碧昂丝闻名的（女喜剧演员），她成了时尚偶像，在照片社交平台上拥有数百万粉丝。相比之下，政治（讽刺）在主流电视上很少见，因为电视台不愿得罪权贵。"}, {"en": "Japan's sporting heroes are its best ambassadors. Shohei Ohtani, a (versatile) star who both pitches and hits for the Los Angeles Dodgers, has won four most-valuable-player awards and is the (cynosure) of all eyes at every ballpark he visits; his genius is (indubitable). The Dodgers won the 2025 World Series with Yoshinobu Yamamoto, another Japanese pitcher, named its most valuable player, and Ichiro Suzuki became the first Japanese player inducted into the Hall of Fame at Cooperstown. At home, high-school players at the Koshien tournament bow to the (umpire) before every game, and the (score) matters less than the effort. Sumo, the national sport, pits wrestlers of vast (stature) against each other inside a circular ring marked out on a raised clay (square), which they ritually purify by tossing handfuls of (coarse) salt.", "zh": "日本的体育英雄是它最好的使节。大谷翔平是一位（多才多艺）的球星，在洛杉矶道奇队既投球又击球，已四度获得最有价值球员奖，走到哪个球场都是（众人瞩目的焦点）；他的天赋（毋庸置疑）。道奇队赢得了2025年世界大赛，另一位日本投手山本由伸被评为最有价值球员；铃木一朗则成为首位入选库珀斯敦名人堂的日本球员。在国内，参加甲子园大赛的高中球员每场比赛前都要向（裁判）鞠躬，（比分）不如拼搏精神重要。相扑是日本的国技，（身材）魁梧的力士在高起的黏土（方台）上、由稻草俵围成的圆形土俵内角力；他们抛撒大把（粗）盐来净化赛场。"}, {"en": "Japanese (equine) breeding has become world-class. Almond Eye, a (mare), won nine top-level races, including the Japan Cup twice. In November 2025 Forever Young, a (mettlesome) colt with a Japanese jockey in the (saddle), became the first Japanese-trained horse to win the Breeders' Cup Classic in America. At the rugby World Cup it hosted in 2019, Japan beat Ireland and Scotland with relentless defense, every (tackle) cheered by a country new to the game. In football, Japan reached the round of 32 at this summer's World Cup in the western (hemisphere) before losing 2-1 to Brazil; the (pinnacle) remains out of reach.", "zh": "日本的（马匹）育种已达到世界一流水平。（母马）杏仁眼赢得了九场顶级赛事，其中包括两次日本杯。2025年11月，（勇猛的）赛驹“永远年轻”由一位日本骑师（执鞍），成为首匹赢得美国育马者杯经典赛的日本调教马。在2019年主办的橄榄球世界杯上，日本队以顽强的防守击败了爱尔兰和苏格兰，每一次（擒抱）都赢得了这个刚接触这项运动的国家的欢呼。足球方面，日本在今年夏天于西（半球）举行的世界杯上打进32强，随后以1比2负于巴西；（巅峰）依然遥不可及。"}, {"en": "Its diplomats and soldiers face harder contests. Article 9 bans armed forces, yet Japan has fielded the Self-Defense Forces since 1954; pacifists argue that they (contravene) the constitution, and the Supreme Court has avoided ruling on the matter. Shinzo Abe reinterpreted the constitution in 2014 to allow Japan to come to the aid of allies under attack. Ms Takaichi has gone further. Defense spending, including related outlays, reached about 2% of GDP in the fiscal year to March 2026, two years ahead of schedule, and the defense ministry has requested a record ¥8.9trn for next year, with money for long-range drones and missiles that can be launched from under the sea. By the end of this year she intends to (revise) the country's three main strategy documents and adopt a more muscular (posture). America, which keeps some 54,000 troops in Japan, many stationed at a military (base), wants it to spend 3.5% of GDP. Planners fret about the (maritime) threat from China and about the possibility that China, Russia and North Korea might (conspire) against Japan; the aim is to (secure) the sea lanes on which the country depends.", "zh": "日本的外交官和士兵面临着更艰难的较量。宪法第九条禁止拥有武装力量，然而日本自1954年起就组建了自卫队；和平主义者认为自卫队（违反）宪法，而最高法院一直回避就此作出裁决。安倍晋三在2014年重新解释宪法，允许日本援助遭受攻击的盟友。高市女士走得更远。包括相关支出在内的防卫开支在截至2026年3月的财年中达到GDP的约2%，比计划提前两年；防卫省为下一财年申请了创纪录的8.9万亿日元，用于远程无人机和可从水下发射的导弹。她打算在今年年底前（修订）国家三份主要战略文件，采取更强硬的（姿态）。美国在日本部署约5.4万名士兵，其中不少驻扎在军事（基地）；美方希望日本把防卫开支提高到GDP的3.5%。规划者们担心来自中国的（海上）威胁，也担心中国、俄罗斯和朝鲜可能联手（密谋）对付日本；目标是（确保）国家赖以生存的海上通道的安全。"}, {"en": "China is the biggest worry, and Ms Takaichi has made relations worse. On November 7th 2025 she told parliament that a Chinese attack on Taiwan involving naval forces could constitute a \"survival-threatening situation\" that would let Japan fight alongside America. Previous leaders had kept such scenarios deliberately vague. Beijing was quick to (bridle). China's consul-general in Osaka posted on X that \"that dirty neck\" should be cut off, a piece of (bellicose) (hyperbole) that he later took down. Beijing went on to (chastise) Tokyo through every channel: it advised Chinese citizens not to visit Japan, restored its ban on Japanese seafood, canceled films and concerts and, in January, began to (impose) curbs on exports of rare earths and dual-use goods to Japan.", "zh": "中国是最大的隐忧，而高市女士让两国关系变得更糟。2025年11月7日，她在国会表示，如果中国动用海军力量攻打台湾，可能构成“存亡危机事态”，使日本可以与美国并肩作战。前几任领导人都刻意对这类情形含糊其辞。北京很快就（勃然大怒）。中国驻大阪总领事在社交平台上发帖称，应该把“那肮脏的脖子”砍掉，这番（好战的）（夸张言辞）后来被他撤下。北京随后通过各种渠道（训斥）东京：建议中国公民不要前往日本，恢复对日本海产品的禁令，取消电影上映和演唱会，并在1月开始对日本（实施）稀土和军民两用物项出口管制。"}, {"en": "The costs are real. Chinese tourist arrivals have roughly halved, the pandas at Ueno Zoo were sent back to China in January, and in December Chinese fighter jets locked their fire-control radar onto Japanese planes. Ms Takaichi refuses to retract her remarks; to (appease) Beijing now would (enflame) her nationalist supporters. China's foreign minister, Wang Yi, suggested earlier this month that she find a way to end the row, a hint that Beijing, too, may want a way out. Chinese diplomacy is not short of (wile), and the Taiwan question is (intractable). But trade between the two countries is worth around $300bn a year, which gives both sides reason to think the relationship is (reparable), if (fragile).", "zh": "代价是实实在在的。中国游客人数大约减少了一半，上野动物园的大熊猫于今年1月被送回中国，去年12月中国战斗机还用火控雷达锁定了日本飞机。高市女士拒绝收回她的言论；现在去（安抚）北京会（激怒）她的民族主义支持者。本月早些时候，中国外长王毅建议她想办法平息这场争端，这暗示北京或许也想找个台阶下。中国外交从不缺少（计谋），台湾问题则（难以解决）。但两国贸易额每年约3000亿美元，这让双方都有理由认为两国关系虽然（脆弱），却（可以修复）。"}, {"en": "America remains Japan's essential ally, if a more transactional one. When Donald Trump visited Tokyo in October 2025, Ms Takaichi heaped (fulsome) praise on him. A trade deal struck that year capped American tariffs on most Japanese goods at 15% in return for a promise of $550bn in Japanese-backed financing for projects in America, and this summer the American Treasury joined Japan in buying yen. Officials in Washington regularly (assure) Tokyo that the alliance is solid, and Japan casts itself as a (counterpoise) to China in Asia. But nobody can be certain that a future American president would (interpose) American forces between Japan and an attacker.", "zh": "美国仍是日本不可或缺的盟友，尽管这个盟友变得更讲究交易。2025年10月唐纳德·特朗普访问东京时，高市女士对他极尽（溢美）之词。那年达成的贸易协议把美国对大多数日本商品征收的关税上限定为15%，换取日本承诺为美国的项目提供5500亿美元的融资；今年夏天，美国财政部还与日本一起买入日元。华盛顿的官员经常向东京（保证）同盟关系牢不可破，日本也把自己定位为亚洲制衡中国的（砝码）。但谁也无法确定，未来的美国总统是否会把美军（介入）于日本与进攻者之间。"}, {"en": "Relations with South Korea have improved. Lee Jae-myung, a left-wing president who once railed against Japan, has embraced (shuttle) diplomacy; when he visited Nara in January, he and Ms Takaichi ended their summit by drumming together to K-pop hits, an (overture) that seemed (genuine). History still has the power to (rankle). Quarrels over (recompense) for Koreans forced to work for Japanese firms in wartime, and over the \"comfort women\", flare up periodically, and the two countries have yet to (reconcile) their accounts of the past. Each summit helps to (suture) old wounds; none has yet healed them.", "zh": "日本与韩国的关系有所改善。李在明是一位曾经抨击日本的左翼总统，如今却欣然接受（穿梭）外交；今年1月他访问奈良时，与高市女士以随着韩国流行歌曲一起打鼓结束了峰会，这一（友好姿态）看起来是（真诚的）。历史仍有能力（激起怨恨）。围绕战时被强征为日本企业劳动的韩国人的（赔偿）问题以及“慰安妇”问题的争吵不时爆发，两国对过去的叙述仍未能（调和）。每一次峰会都有助于（缝合）旧伤口；但还没有哪一次能让伤口愈合。"}, {"en": "Japan's problems are daunting but not (insuperable). It has shown its (mettle) before: after the Meiji upheaval, after defeat in 1945, after the tsunami of 2011. Its experience with a shrinking, aging population will be a (touchstone) for the many countries that follow, and in Japan the world can (glimpse) its own future. There is no point in nostalgia, and the Japanese do not (repine) for the bubble years. A better guide is kintsugi, the old craft of mending broken pottery with lacquer and gold, so that each (fracture) becomes part of an object's beauty rather than a flaw to hide. The bears may be coming down from the hills. The country they are wandering into is still worth watching.", "zh": "日本的问题令人生畏，但并非（不可逾越）。它以前就展现过自己的（勇气）：明治剧变之后，1945年战败之后，2011年海啸之后。它在人口萎缩和老龄化方面的经验，将成为众多后来者的（试金石），世界可以在日本（瞥见）自己的未来。怀旧毫无意义，日本人也并不（惋惜）泡沫年代。更好的指引是金缮——一种用漆和金修补破碎陶器的古老工艺，让每一道（裂缝）都成为器物之美的一部分，而不是需要掩藏的瑕疵。熊或许正从山上下来。它们闯入的这个国家，仍然值得关注。"}];
const HAS_TITLE = true;
const SUBTITLE_EN = "";
const SUBTITLE_ZH = "";

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  if (typeof SUBTITLE_EN !== 'undefined' && SUBTITLE_EN) {
    const sub = document.createElement('div');
    sub.className = 'book-subtitle';
    sub.textContent = SUBTITLE_EN;
    div.appendChild(sub);
  }
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  if (typeof SUBTITLE_ZH !== 'undefined' && SUBTITLE_ZH) {
    const subZh = document.createElement('div');
    subZh.className = 'zh-subtitle';
    subZh.textContent = SUBTITLE_ZH;
    div.appendChild(subZh);
  }
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-the-land-of-the-rising-yield-v1';
const LS_OLD_KEY = 'audiobook-the-land-of-the-rising-yield-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
