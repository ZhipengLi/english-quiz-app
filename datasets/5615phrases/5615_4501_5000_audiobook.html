<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The long way home — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  .book-subtitle {
    font-size: 1.02rem;
    color: var(--muted);
    font-style: italic;
    margin: 0 0 10px;
  }
  .zh-subtitle {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 0.92rem;
    margin-top: 6px;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>The long way home</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "The long way home", "zh": "回家的漫漫长路"}, {"en": "Sixteen years after its first bailout, Greece has become one of Europe's unlikeliest success stories. Can it last?", "zh": "第一次纾困过去十六年后，希腊已成为欧洲最出人意料的成功故事之一。它能持续下去吗？"}, {"en": "On June 15th Greece did something that would have seemed fanciful a decade ago: it repaid €6.94bn of loans from its first bailout, which were not due until 2029-35. It was the country's eighth early repayment since 2019; on October 1st a further early (installment) of €2.5bn went to the European Financial Stability Facility, funded by proceeds from the reprivatisation of Greek banks. For a (convalescent) economy, such (provident) behavior is a (significant) achievement and a (testament) to how far it has come since 2010, when it became the first euro-zone country to need a rescue. The mood in Athens is (buoyant). It is worth pausing on the (moment), because Greece's recovery is both real and fragile.", "zh": "6月15日，希腊做了一件十年前看来还像天方夜谭的事：它偿还了第一轮纾困中的69.4亿欧元贷款，而这些贷款原本要到2029年至2035年才到期。这是该国自2019年以来第八次提前还款；10月1日，希腊又利用银行重新私有化的收益，向欧洲金融稳定基金提前偿还了25亿欧元的另一笔（分期款项）。对于一个（正在康复的）经济体而言，这种（审慎而有远见的）做法是一项（重要的）成就，也是一份有力的（证明），表明希腊自2010年成为首个需要救助的欧元区国家以来已走出多远。雅典的气氛（高涨乐观）。这一（时刻）值得驻足细品，因为希腊的复苏既真实又脆弱。"}, {"en": "Public debt, which reached an (apex) of 209% of GDP in 2020 when the pandemic shut down the tourist economy, fell to 146% in 2025. The European Commission expects 141% this year, and the government hopes to push the ratio below Italy's, so that Greece is no longer the euro area's most indebted member. Once the biggest (recipient) of rescue money in history, nearly €290bn from euro-zone governments and the IMF, Greece now pursues a (consistent) strategy of paying it down, and last year it ran an overall budget surplus of 1.7% of GDP, a rarity in Europe. That (prudent) policy, (compliant) with (stringent) European rules, won back investment-grade credit ratings in 2023, the year The Economist named Greece its country of the year, a (compliment) few would have predicted in 2015; Moody's followed in 2025. Growth has settled on a (plateau) of about 2% a year, and the economy remains a (minnow), less than 2% of the euro area's output. The danger is that fiscal (restraint) fades and that future governments (revert) to old habits.", "zh": "公共债务在2020年疫情让旅游经济停摆时达到占GDP 209%的（顶峰），2025年降至146%。欧盟委员会预计今年将降至141%，政府则希望把这一比率压到意大利之下，从而使希腊不再是欧元区负债最重的成员国。希腊曾是史上最大的救助资金（接受者），从欧元区各国政府和国际货币基金组织获得了近2900亿欧元，如今则奉行（始终如一的）偿债策略，去年整体预算盈余达到GDP的1.7%，这在欧洲十分罕见。这种（审慎的）政策（符合）欧洲（严格的）规则，使希腊在2023年重新获得投资级信用评级；同年，《经济学人》将希腊评为年度国家，这一（赞誉）在2015年几乎无人能够预料；穆迪则在2025年跟进。经济增长已稳定在每年约2%的（平台期），而这个经济体仍是条（小鱼），产出不到欧元区的2%。危险在于财政（克制）逐渐松懈，未来的政府（重回）老路。"}, {"en": "The crisis began with a confession. In October 2009 a new Socialist government revealed that the budget deficit for that year would be about 12.5% of GDP, more than three times what its predecessor had projected; the figure was later revised to 15.4%. It was not the first time Greek statistics had proved (aberrant): an audit in 2004 found that officials had repeatedly sought to (misrepresent) the deficits reported when Greece qualified for the euro. Years of (improvident) borrowing, an (imprudent) expansion of the public payroll and a boom fueled by cheap credit ended in a (bust). The revelation of Greece's true deficit was the immediate (precipitant) of a wider debt crisis that soon engulfed Ireland, Portugal, Spain and Cyprus.", "zh": "危机始于一次坦白。2009年10月，新上台的社会党政府披露，当年的预算赤字将达到GDP的约12.5%，是前任政府预测数字的三倍多；这一数字后来又被修正为15.4%。这已不是希腊统计数据第一次被证明（失常）：2004年的一次审计发现，有关官员曾屡次试图（歪曲）希腊申请加入欧元区时提交的赤字数据。多年（挥霍无度的）借贷、公共部门工资名册（不明智的）扩张，以及廉价信贷推动的繁荣，最终以（崩溃）收场。希腊真实赤字的曝光成为更广泛债务危机的直接（诱因），危机很快席卷爱尔兰、葡萄牙、西班牙和塞浦路斯。"}, {"en": "The (retrenchment) that followed was brutal. Between 2008 and 2013 output shrank by about a quarter, a slump comparable to America's Great Depression, and unemployment approached 28%, with more than half of young people out of work. Pensions and public wages were cut again and again, and higher value-added tax acted as a further (depressant) on demand. Church soup kitchens fed the (indigent), and (mendicant) figures became a common sight in central Athens. The poor and the young bore the (brunt): many families had to (subsist) on a grandparent's shrinking pension. A (despondent) nation also became the (butt) of foreign jokes. German tabloids sneered at supposedly (indolent) Greeks, though OECD data show that Greeks work some of the longest hours in Europe.", "zh": "随之而来的（紧缩）十分残酷。2008年至2013年间，经济产出萎缩了约四分之一，下滑幅度堪比美国大萧条，失业率接近28%，超过一半的年轻人没有工作。养老金和公共部门工资一再被削减，提高的增值税对需求起到了进一步的（抑制作用）。教会的施粥所为（赤贫者）提供食物，（乞讨的）身影在雅典市中心随处可见。穷人和年轻人承受了（主要冲击）：许多家庭只能靠祖父母不断缩水的养老金（勉强维生）。一个（沮丧绝望的）国家还成了外国笑话的（笑柄）。德国小报嘲讽所谓（懒惰的）希腊人，尽管经合组织的数据显示，希腊人的工作时间在欧洲名列前茅。"}, {"en": "In January 2015 voters turned to an (upstart). Syriza, a coalition of radical leftists led by Alexis Tsipras, then 40, won on a promise to tear up the bailout terms. Its finance minister, Yanis Varoufakis, was a (flamboyant) economist and game-theory specialist who rode a motorbike to meetings and drew praise from more than one foreign (correspondent), who hailed him as an economic (guru). His (trenchant) critique of austerity won admirers abroad. Euro-zone finance ministers found him (petulant) and (intransigent); his exchanges with Germany's Wolfgang Schäuble were famously (curt), and critics called him an (egotist). He, in turn, was (blunt) about them.", "zh": "2015年1月，选民转向了一个（新贵）。激进左翼联盟党是一个由激进左派组成的联盟，由时年40岁的阿莱克西斯·齐普拉斯领导，它承诺撕毁纾困条款，并因此赢得大选。该党的财政部长亚尼斯·瓦鲁法基斯是一位（张扬炫目的）经济学家和博弈论专家，他骑摩托车去开会，赢得了不止一位外国（记者）的赞许，被他们奉为经济学（大师）。他对紧缩政策（犀利的）批判在国外赢得了不少拥趸。欧元区各国财长却觉得他（任性易怒）、（不肯妥协）；他与德国财长沃尔夫冈·朔伊布勒之间的交流以（简短生硬）著称，批评者称他是个（自大狂）。他对他们也毫不客气，说话（直言不讳）。"}, {"en": "By June talks had collapsed. Depositors had been pulling money out of Greek banks for months, preferring a mattress or a foreign account to a domestic (deposit) of uncertain value; the government shut the banks and imposed capital controls that let Greeks (withdraw) just €60 a day from cash machines. To keep the lenders (solvent), the European Central Bank kept them on an emergency drip-feed while the cash in each bank (vault) dwindled. On July 5th Greeks rejected the creditors' terms by 61% to 39% in a referendum. A week later Mr Tsipras, back in Brussels as a (supplicant), accepted a third bailout worth up to €86bn on even harsher terms. To many of his supporters it was (tantamount) to betrayal; he was forced to (recant) almost everything he had campaigned on, an act of political (self-abasement) that split his party. Mr Varoufakis had resigned the day after the vote.", "zh": "到6月，谈判破裂。几个月来，储户一直在从希腊银行取钱，宁愿把钱藏在床垫下或存到国外账户，也不愿把它作为价值不明的国内（存款）；政府关闭了银行并实施资本管制，每人每天只能从取款机（提取）60欧元。为了让银行保持（有偿付能力），欧洲央行通过紧急输血维持它们的运转，而各家银行（金库）里的现金则日渐减少。7月5日，希腊人在全民公投中以61%对39%拒绝了债权人的条件。一周后，齐普拉斯以（乞求者）的身份回到布鲁塞尔，接受了条件更苛刻、规模最高达860亿欧元的第三轮纾困。在许多支持者看来，这（等同于）背叛；他被迫（收回）几乎所有竞选承诺，这种政治上的（自我贬低）导致他的政党分裂。瓦鲁法基斯已在公投次日辞职。"}, {"en": "The crisis also bred Golden Dawn, a neo-Nazi party whose (extremist) platform won 7% of the vote in 2012 and later made it the third-largest force in parliament. Its thugs beat migrants, and in 2013 one of its members stabbed to death Pavlos Fyssas, an anti-fascist rapper. In October 2020 a (court) in Athens ruled that the party was a criminal organization and jailed its leaders, as thousands celebrated outside. More than one (defendant) remained (unrepentant). To most Greeks, the ideology of a neo-Nazi (bigot) was (repugnant), but a (deviant) strain of nationalism lives on in smaller parties.", "zh": "危机还催生了金色黎明党，这个新纳粹政党凭借其（极端主义的）纲领取得了2012年7%的选票，后来成为议会第三大势力。该党的暴徒殴打移民，2013年，一名党员刺死了反法西斯说唱歌手帕夫洛斯·菲萨斯。2020年10月，雅典一家（法院）裁定该党为犯罪组织，并将其领导人投入监狱，数千人在法院外欢庆。不止一名（被告）仍（毫无悔意）。对大多数希腊人而言，新纳粹（偏执狂）的意识形态（令人厌恶）；然而，一股（偏离主流的）民族主义思潮仍在一些较小的政党中延续。"}, {"en": "Since 2019 Greece has been run by Kyriakos Mitsotakis of New Democracy, a center-right party. He is a (descendant) of one of the country's political dynasties: his father, Konstantinos, was prime minister in 1990-93, and his sister, Dora Bakoyannis, has been mayor of Athens and foreign minister. A Harvard-educated former management consultant, he has (recast) his party as a pro-business, pro-European (juggernaut). New Democracy won two elections in 2023, the second with nearly 41% of the vote, and has been the (dominant) force in Greek politics ever since. The typical party (stalwart), accustomed to rewarding a loyal (constituent) with a state job, has had to change course.", "zh": "自2019年以来，希腊一直由中右翼政党新民主党的基里亚科斯·米佐塔基斯执政。他是该国一个政治世家的（后裔）：他的父亲康斯坦丁诺斯在1990年至1993年任总理，姐姐多拉·巴科扬尼斯曾任雅典市长和外交部长。这位毕业于哈佛、曾任管理顾问的政治家，把他的政党（重塑）成一台亲商业、亲欧洲的（巨无霸）。新民主党在2023年两次赢得选举，第二次得票率接近41%，此后一直是希腊政坛的（主导）力量。典型的党内老（中坚分子）过去习惯于以公职回报忠诚的（选民），如今也不得不改变做法。"}, {"en": "His government's boast is a more competent state. During the pandemic much of the state's paperwork moved onto a single portal, gov.gr, sparing Greeks hours in queues. For many a civil servant, an (emolument) once depended more on seniority than performance; now evaluations are required, and the government says promotion should reward (merit). Reformers want to stamp out clientelism, the (malignant) habit of parties that (appoint) loyalists to public jobs. A bureaucracy long (inert), and often (truant) from its duties, is slowly changing.", "zh": "他的政府引以为傲的是一个更有能力的国家机器。疫情期间，国家的大量文书工作被转移到一个统一的门户网站gov.gr上，让希腊人免去了数小时的排队之苦。过去，对不少公务员来说，一笔（职务报酬）的高低更多取决于资历，而非表现；如今公务员必须接受考核，政府表示晋升应依据（才干）。改革者希望根除裙带关系，即政党（任命）亲信担任公职这一（恶性的）习惯。一个长期（惰怠）、常常（擅离职守）的官僚机构正在慢慢改变。"}, {"en": "So is tax collection. Evasion was once (rampant): doctors, lawyers and plumbers routinely asked for cash, and even a (skinflint) could bargain for a discount when paying in banknotes. Shops must now accept cards, and taxpayers must spend at least 30% of their income electronically or pay a penalty. Since 2024 the self-employed have been taxed on a presumed minimum income, however little they declare. The government is (bent) on tightening the (screw) on (delinquent) taxpayers, and digital receipts have made it harder to (circumvent) the rules.", "zh": "税收征管也在改变。逃税曾经（猖獗）：医生、律师和水管工惯常要求现金支付，就连一个（吝啬鬼），也可能在拿现金付款时讨价还价，要求打折。如今商店必须接受刷卡，纳税人必须将至少30%的收入以电子方式支出，否则就要缴纳罚款。自2024年起，自雇人士无论申报多少收入，都按一个推定的最低收入纳税。政府（一心要）对（拖欠税款的）纳税人拧紧（螺丝），电子收据也让人更难（规避）规则。"}, {"en": "Investment is reviving, from a very low base. The EU's pandemic-recovery fund has provided billions in assistance, sometimes as a (grant) and sometimes as a cheap loan; the Commission expects record inflows this year. Pfizer has opened a digital hub in Thessaloniki and Microsoft is building data centers near Athens. A (nascent) tech scene is growing, and the former Athens airport at Ellinikon is being redeveloped, helping transform the (renascent) Athens waterfront into one of Europe's biggest urban-regeneration zones. The state has continued to (divest) itself of stakes in ports, the main airport and other assets, helping to (augment) investment and (cement) the recovery. Yet progress is (modest): Greece's income per head at purchasing-power parity remains among the lowest in the EU, and achieving a (convergent) path towards the richer north will take decades.", "zh": "投资正在从极低的基数上复苏。欧盟的疫后复苏基金提供了数以十亿计的援助，有的以（无偿拨款）形式发放，有的则是低息贷款；欧盟委员会预计今年资金流入将创纪录。辉瑞在塞萨洛尼基开设了一个数字中心，微软正在雅典附近建设数据中心。一个（新兴的）科技圈正在成长，雅典旧机场埃利尼孔正在重新开发，推动雅典（重新焕发生机的）滨海地带转型，形成欧洲最大的城市更新区域之一。国家持续（出售）所持港口、主要机场及其他资产的股份，这有助于（增加）投资并（巩固）复苏。然而进展（有限）：按购买力平价计算，希腊的人均收入仍是欧盟最低之列，要走上一条在收入水平上逐步向富裕北欧国家（趋同的）发展道路，还需要几十年。"}, {"en": "Wages are the sore point. The minimum wage rose in April to €920 a month, from €880. That latest (increment), paid 14 times a year, is the (equivalent) of nearly €12,900 annually, yet the average Greek still earns less in real terms than before the crisis, and productivity has been (stagnant) for years. Many workers take a second job to (supplement) their pay. An (incipient) labor shortage is pushing up wages in tourism and construction, and the government has pressed supermarkets to (discount) a basket of staple goods. But wages have been slow to (adjust) to rising prices, housing costs are the biggest (constraint) on family budgets, and inflation, which the Commission expects to reach 3.7% this year as energy prices climb, threatens to (undercut) the gains.", "zh": "工资是痛点。最低工资在4月从每月880欧元提高到920欧元。经过这次最新的（增幅），最低工资每年发放14次，（相当于）每年近12900欧元，但希腊人的平均实际收入仍低于危机前，生产率多年来也一直（停滞不前）。许多劳动者兼职第二份工作来（补贴）收入。（初现的）劳动力短缺正在推高旅游业和建筑业的工资，政府也施压超市对一篮子基本商品（打折）。但工资（调整）跟不上物价上涨，住房成本是家庭预算的最大（制约），而欧盟委员会预计，随着能源价格攀升，今年通胀将达到3.7%，这可能（削弱）已取得的成果。"}, {"en": "Tourism has been the engine. In 2025 Greece welcomed a record 38m foreign visitors, not counting cruise passengers, more than three for every Greek, and receipts rose by 9.4% to €23.6bn. Germans and Britons lead the way, and Americans, who spent €1.7bn, are (frequent) and free-spending guests. The islands still (enchant). Visitors (disport) themselves on beaches, (acquaint) themselves with ancient ruins and gather in Oia to watch Santorini's (effulgent) sunsets, whose (evanescent) (glow) is photographed by thousands every evening. Post-pandemic (wanderlust) has kept the boom going, and tourism has become a (determinant) of growth. Yet the industry depends on a (transient) seasonal workforce, and a (glut) of visitors in high summer leaves many places empty for the rest of the year.", "zh": "旅游业一直是增长引擎。2025年，希腊接待了创纪录的3800万外国游客，不包括邮轮乘客，相当于每个希腊人对应三名以上游客，旅游收入增长9.4%，达到236亿欧元。德国人和英国人是主力，消费17亿欧元的美国人则是（常来的）、出手大方的客人。这些海岛依然令人（着迷）。游客们在海滩上（嬉戏），（熟悉）古代遗迹，聚集在伊亚观赏圣托里尼（灿烂夺目的）日落，每天傍晚，成千上万的人拍下那（转瞬即逝的）（余晖）。疫情后的（旅行热）让繁荣得以延续，旅游业已成为经济增长的（决定因素）。然而，这个行业依赖（流动的）季节性劳动力，盛夏游客（过剩），一年中其余时间许多地方却空空荡荡。"}, {"en": "Some places are buckling. Since July 2025 cruise passengers landing on Santorini or Mykonos in high season have paid a €20 fee, against €5 at most other ports, and visits to the Acropolis are capped at 20,000 a day. The (concomitant) problems are familiar: islands that (exhaust) their water supplies in summer, traffic on roads built for donkeys, and the (befuddlement) of locals who no longer recognize their own villages. A restaurant (tout) may (accost) passers-by in Plaka; a drunken (lout) may roam the party strips of Laganas and Malia; (impudent) visitors clamber over ancient walls for selfies, and (incogitant) ones leave litter at sacred sites. To anyone who has fought for a sunbed in high summer, an (advert) promising empty beaches can be (repellent) rather than inviting.", "zh": "一些地方已不堪重负。自2025年7月起，旺季在圣托里尼或米科诺斯岛登岸的邮轮乘客须缴纳20欧元的费用，而大多数其他港口只收5欧元；卫城每天的参观人数也被限制在两万人。（随之而来的）问题人所共知：夏天会（耗尽）淡水供应的海岛，为驴子修建的道路上的交通拥堵，以及当地人的（困惑），他们已经认不出自己的村庄。在普拉卡，一名餐馆（揽客者）可能会主动（拦住招揽）路人；在拉加纳斯和马利亚的派对街上，则可能有醉酒的（粗野之徒）游荡；（厚颜无耻的）游客爬上古代城墙自拍，（不动脑筋的）游客则在圣地乱扔垃圾。对于盛夏时曾为争一张日光浴床费尽力气的人来说，一则承诺海滩空旷的（广告）并不诱人，反而（令人反感）。"}, {"en": "Housing is the sorest issue for young Greeks. Construction almost stopped during the crisis, and rents have since climbed steeply as investors and holiday lets have swallowed up apartments. A (tenant) in central Athens can pay an (exorbitant) share of a typical salary for a one-bedroom flat. The government has banned new short-term-rental registrations in the three central districts of Athens, a freeze extended to the end of 2026, and is rolling out similar curbs in Thessaloniki, Santorini, Chania, Paros and Halkidiki. It has also made its \"golden visa\", the (blandishment) that offers residency to foreigners who buy property, more expensive: since 2024 an (applicant) has had to invest at least €800,000 (upfront) in Attica, Thessaloniki and the most popular islands, up from €250,000. Many a (resident) of the old neighborhoods has been priced out all the same.", "zh": "住房是希腊年轻人最痛心的问题。危机期间建筑业几乎停摆，此后随着投资者和度假出租房吞噬公寓，租金一路飙升。在雅典市中心，一名（租户）可能要把一份普通工资中（高得离谱的）一部分花在一套一居室公寓上。政府已禁止在雅典三个中心城区登记新的短租房源，这一冻结措施延长至2026年底，并正在塞萨洛尼基、圣托里尼、干尼亚、帕罗斯和哈尔基季基推行类似限制。它还提高了“黄金签证”的门槛，这项为购房外国人提供居留权的（诱惑）如今更加昂贵：自2024年起，在阿提卡、塞萨洛尼基和最热门的海岛，（申请人）必须（预先）投资至少80万欧元，此前的门槛是25万欧元。尽管如此，许多老街区的（居民）仍因房价过高而被迫迁出。"}, {"en": "Behind it all lies a demographic (predicament). Just 65,594 babies were born in 2025, 4.2% fewer than in 2024 and less than half the number born in 1980. Fewer women become (pregnant) before their thirties, and the biggest falls in births last year were among women aged 25 to 34. Perhaps half a million young Greeks left during the crisis, many for a (stint) abroad that turned into a new life. Each (adolescent) cohort is smaller than the last, village schools are closing and demographic change continues to (skew) the population toward older people. Greeks' educational (attainment) is high, but jobs that match it are (scant). Greece has about 10.4m people, but the typical (inhabitant) is growing older as the population shrinks.", "zh": "这一切的背后，是人口结构的（困境）。2025年希腊仅出生65594名婴儿，比2024年少4.2%，不到1980年出生人数的一半。三十岁前（怀孕）的女性越来越少，去年出生人数降幅最大的是25至34岁的女性。危机期间或许有50万年轻希腊人离开，许多人原本只想在国外（待一段时间），结果却在那里开始了新生活。每一代（青少年）都比上一代人数更少，乡村学校纷纷关闭，人口变化持续使年龄结构向老年群体（倾斜）。希腊人的教育（程度）很高，但与之匹配的工作却（很少）。希腊人口约为1040万，而且总人数正在减少，典型（居民）的年龄也越来越大。"}, {"en": "Emigration is an old Greek story. Millions of people of Greek (descent) live abroad, from Chicago to Melbourne, which has one of the largest Greek communities anywhere outside Greece. An (anthropologist) could map the waves that carried them to such (distant) shores, from the rural poverty of the early 1900s to the crisis of the 2010s. Since 2024 Greeks abroad have been able to vote by post, and the government offers an eligible returning (compatriot) a 50% income-tax break.", "zh": "移民是一个古老的希腊故事。数百万具有希腊（血统）的人生活在海外，从芝加哥到墨尔本，后者拥有希腊以外最大的希腊人社区之一。一位（人类学家）可以描绘出把他们带到如此（遥远的）海岸的一波波移民潮，从20世纪初的农村贫困到2010年代的危机。自2024年起，海外希腊人可以通过邮寄投票，符合条件的海外（同胞）若回国定居，政府可给予50%的所得税减免。"}, {"en": "The health system is creaky. Greece has more doctors per head than almost any other EU country but strikingly few nurses, and patients in public hospitals often rely on relatives to look after them. Waiting lists push the better-off toward private clinics, where a (cardiologist), a (dermatologist) or a (podiatrist) will see them quickly for cash. The pandemic exposed the gaps. Greece contained the first wave well in 2020, but a later, more (virulent) surge overwhelmed hospitals in the north, and crews in protective suits sprayed (disinfectant) on streets and squares.", "zh": "医疗体系摇摇欲坠。希腊人均医生数量几乎居欧盟之首，护士却少得惊人，公立医院的病人往往要靠亲属照料。漫长的候诊名单把较富裕的人推向私人诊所，在那里，（心脏病专家）、（皮肤科医生）或（足科医生）会很快为他们看诊，只收现金。疫情暴露了这些漏洞。希腊在2020年很好地控制住了第一波疫情，但后来一波更（凶猛的）疫情让北部的医院不堪重负，身穿防护服的工作人员在街道和广场上喷洒（消毒剂）。"}, {"en": "Nothing has hurt the government more than a railway disaster. Late on February 28th 2023 a passenger train carrying many students home after a holiday weekend and a freight train collided head-on near Tempi, in central Greece, killing 57 people. A stationmaster had sent the trains onto the same track, and the remote signaling system that should have caught the error was (obsolescent) and partly out of action; the wider railway infrastructure was (decrepit), years after promised upgrades should have been completed. A passenger trapped in a front (compartment) had little chance. Relatives accuse officials of trying to (pervert) the course of justice, pointing out that the crash site was hastily covered with gravel within days. The (inept) response of a state that had promised to be less (incompetent) turned grief into fury. On the second anniversary, in 2025, hundreds of thousands of Greeks joined a general strike and marches in a (poignant) display of anger.", "zh": "没有什么比一场铁路灾难对政府的伤害更大。2023年2月28日深夜，一列载有许多假期结束后返校学生的客运列车与一列货运列车在希腊中部的滕比附近迎头相撞，造成57人死亡。一名站长把两列火车调到了同一条轨道上，而本应发现这一错误的远程信号系统已（陈旧过时）、部分失效；更广泛的铁路基础设施也（破败不堪），本应多年前就完成的升级迟迟没有实现。困在前部某节（车厢）里的乘客几乎没有生还机会。遇难者亲属指责官员试图（歪曲）司法进程，并指出事故现场在几天内就被匆忙铺上了碎石。一个曾承诺不再那么（无能的）国家，却做出了如此（拙劣的）反应，这让悲痛变成了愤怒。2025年事故两周年时，数十万希腊人参加了总罢工和游行，以（令人心酸的）方式表达愤怒。"}, {"en": "Out of that anger has come a new party. In May Maria Karystianou, a pediatrician whose 20-year-old daughter died in the crash, launched Hope for Democracy, saying the powerful should no longer \"feel untouchable\". The established parties (disenchant) many voters, and the field of protest outfits is crowded. Greek Solution, a nationalist party whose leader once sold \"letters of Jesus\" on a television shopping channel, thrives on (bombast) and the occasional publicity (stunt); Course of Freedom, led by a former speaker of parliament, is known for its (strident) style. Ms Karystianou's admirers see a (nonconformist) who cuts through the (cant) and (magniloquent) speeches of career politicians in a system that rewards the (conformist). Critics point to remarks on abortion that she says were distorted, and warn that a movement born of grief can become a vehicle for every online (rant). Those in power who were (flippant) about the protests have come to regret it.", "zh": "这股愤怒催生了一个新政党。5月，儿科医生玛丽亚·卡里斯蒂亚努创立了“民主希望”党，她20岁的女儿在事故中遇难；她说，有权势的人不应再“觉得自己不可触碰”。传统政党让许多选民（失望幻灭），抗议性政党的阵营十分拥挤。民族主义政党“希腊解决方案”的党首曾在电视购物频道上兜售“耶稣书信”，该党靠（浮夸言辞）和偶尔为博眼球设计的宣传（噱头）吸引关注；由一位前议长领导的“自由之路”党则以（尖锐刺耳的）风格著称。卡里斯蒂亚努的崇拜者认为，她是一位（不随波逐流的人），能够在一个奖励（随大流者）的体制中，戳穿职业政客的（虚伪套话）和（华而不实的）演说。批评者则提到她关于堕胎的言论，她说这些言论遭到歪曲，并警告说，一场源于悲痛的运动可能沦为一切网络（谩骂）的载体。那些曾对抗议活动（轻率无礼）的当权者，已经后悔了。"}, {"en": "Another scandal concerns farm subsidies. OPEKEPE, the agency that pays out EU agricultural aid, was for years milked by people with little or no link to farming, who used (fraudulent) declarations to claim pastures that did not exist, lay on bare mountainsides or sat inside archaeological sites and military bases. A sworn (affidavit) making the same false claim would carry additional legal consequences. Some claimants were DJs and waiters. European prosecutors say at least 324 people received about €19.6m in suspect payments, and police, acting with a judicial (warrant) where needed, carried out a (slew) of raids. One (arrest) involved an alleged ringleader in Crete; the charges across the cases range from fraud to (embezzlement) and money laundering. In June 2025 the European Commission imposed a record €392m penalty on Greece, and a cabinet minister who had previously run the agriculture ministry resigned, denying wrongdoing. The fraud was so (blatant) that genuine farmers reacted with (disgust).", "zh": "另一桩丑闻涉及农业补贴。负责发放欧盟农业援助的机构OPEKEPE，多年来被一些与农业几乎毫无关系的人薅羊毛，他们通过（欺诈性的）申报领取补贴，把根本不存在的牧场、荒山坡地乃至考古遗址和军事基地说成合格牧场。如果以经宣誓的（宣誓书）作出同样的虚假陈述，还会产生额外法律后果。有些申领者是DJ和服务员。欧洲检察官表示，至少有324人领取了约1960万欧元的可疑款项，警方在需要时持司法（令状）开展了（大量）突击搜查。其中一次（逮捕）涉及克里特岛的一名涉嫌主谋；各案指控罪名从欺诈到（侵吞公款）和洗钱不等。2025年6月，欧盟委员会对希腊处以创纪录的3.92亿欧元罚款，一位曾主管农业部的内阁部长辞职，但否认有任何不当行为。这起欺诈如此（明目张胆），以至于真正的农民都感到（厌恶）。"}, {"en": "Those farmers, squeezed by rising costs and by payments delayed while the agency was cleaned up, took to the roads. In late 2025 convoys of tractors blocked main highways, and some protesters clashed with police. The (recalcitrant) protesters distrusted the government's offers of talks, and their (resentment) of officials who had let fraudsters prosper is widely shared. Such blockades (disrupt) trade and travel, but they let a (malcontent) countryside (vent) its frustration.", "zh": "这些农民受到成本上涨以及该机构整顿期间付款延误的双重挤压，纷纷走上街头。2025年底，拖拉机车队封锁了主要公路，一些抗议者与警察发生冲突。（不肯就范的）抗议者不信任政府提出的谈判，他们对纵容欺诈者发财的官员的（怨恨）得到了广泛共鸣。这种封锁（扰乱）了贸易和交通，却让（心怀不满的）农村得以（发泄）不满。"}, {"en": "Questions about the rule of law go further. In 2022 it emerged that the national intelligence service had monitored the phones of Nikos Androulakis, the leader of PASOK, the Socialist opposition, and of journalists, some of whom were also targeted with Predator, a commercial spyware. The intelligence chief and the prime minister's nephew and (confidant), Grigoris Dimitriadis, who oversaw the service, both resigned; Mr Mitsotakis said he had not known about the surveillance and called it a mistake. Critics saw a (plot) to (cow) opponents and (subvert) democratic checks; the government's defenders (disavow) any such aim and accuse the opposition of trying to (foment) a crisis. Spyware of this kind can be used to (extort) or blackmail its victims. Press-freedom groups have ranked Greece at or near the bottom of the EU for several years, citing a (complaisant), government-friendly media and the unsolved murder of a crime reporter in 2021. The government has remained largely (impenitent), insisting that the matter has been dealt with.", "zh": "法治问题还不止于此。2022年曝光的消息显示，国家情报局曾监控社会党反对派泛希腊社会主义运动党领袖尼科斯·安德鲁拉基斯以及一些记者的手机，其中一些人还遭到商业间谍软件“捕食者”的攻击。情报局局长和负责监管该机构的总理侄子兼（心腹）格里戈里斯·季米特里亚季斯双双辞职；米佐塔基斯说他对监控一事并不知情，并称之为一个错误。批评者认为这是一场（阴谋），意在（恐吓）反对者、（颠覆）民主制衡；政府的辩护者（否认）有任何此类意图，并指责反对派试图（煽动）一场危机。这类间谍软件可以被用来（敲诈）或要挟受害者。多年来，新闻自由组织一直把希腊列为欧盟中垫底或接近垫底的国家，理由包括（逢迎讨好的）亲政府媒体，以及2021年一名犯罪新闻记者遇害一案至今未破。政府基本上（毫无悔改之意），坚称此事已经处理完毕。"}, {"en": "The judiciary is part of the problem. Greek justice is among the slowest in the EU: a (litigant) in a commercial dispute can wait years for a ruling, and even after obtaining a (writ) may face months of delays before it is enforced. Judgments are often (prolix). The (salient) (flaw) is delay, itself an (impediment) to investment that foreign firms routinely cite. Critics also complain that sentences for the well-connected are (lenient), and the European Commission's annual rule-of-law reports have raised (pertinent) concerns about the independence and efficiency of the judiciary.", "zh": "司法系统也是问题的一部分。希腊的司法效率在欧盟最低之列：商业纠纷中的一名（诉讼当事人）可能要等上好几年才能等到判决；即使拿到法院（令状），执行时也可能再拖上数月。判决书往往（冗长啰嗦）。最（突出的）（缺陷）是拖延，这本身就是投资的（障碍），外国企业经常提及这一点。批评者还抱怨说，对有权有势者的判罚过于（宽大），欧盟委员会的年度法治报告也就司法独立和效率提出了（中肯的）关切。"}, {"en": "Mr Mitsotakis also wants to rewrite parts of the constitution. Proposals include loosening the job security of civil servants, whose posts are now (permanent); allowing private, non-profit universities; and changing Article 86, which lets parliament, and thus the ruling majority, decide whether ministers face prosecution. Every (amendment) must follow a (roundabout) process: two votes in the current parliament, then the (assent) of the next. The first vote in July was followed by a second on September 16th; in neither did any proposal win 180 votes, the three-fifths majority that would have eased its passage. Without broader (consent), the next parliament will need a three-fifths majority to approve the changes. The opposition parties, whose views on the details are (divergent), refuse to be (pliant), though their own plans for Article 86 are hardly more (coherent). After so much fanfare, the whole exercise may end in (anticlimax).", "zh": "米佐塔基斯还想修改宪法的部分内容。提议包括放松公务员的职位保障，他们的职位目前是（终身的）；允许私立的非营利大学；以及修改第86条，该条款让议会、也就是执政多数，决定部长是否受到起诉。每一项（修正案）都必须经过一套（迂回曲折的）程序：本届议会先进行两轮表决，再由下届议会（同意）。7月第一轮表决之后，9月16日又举行了第二轮；两次表决中，没有一项提案得到180票的五分之三多数，本来达到这个门槛可使后续通过更加容易。如果得不到更广泛的（赞同），下届议会就需要以五分之三多数批准修订。各反对党在细节上的看法（分歧很大），拒绝表现得（顺从），尽管它们自己关于第86条的方案也谈不上更（连贯）。经过如此大张旗鼓的宣传，整个修宪过程最终可能以（虎头蛇尾）收场。"}, {"en": "An election is due by 2027, and Athenian café-goers endlessly (bruit) rumours of an early election. New Democracy leads but has slipped: a survey by Opinion Poll in September put it on 25.7%, ahead of ELAS, a left-wing party launched in May by Mr Tsipras, on 13.2%, and PASOK on 10.1%. Mr Tsipras, who gave up his parliamentary seat in October 2025, presents himself as wiser than the (callow) radical of 2015; an (adherent) of his new party hopes that ELAS's (debut) marks the start of a comeback, and the (aspirant) prime minister is expected to lure defectors from Syriza. Almost one (respondent) in four said that none of the leaders was suited to be prime minister, and many voters remain (reticent) or (diffident) about all the options. With eight parties projected to enter parliament, New Democracy would win about 126 of the 300 seats, short of a majority, which would turn coalition-building into a (jigsaw). Mr Mitsotakis, who is seeking a third term, likes to (avow) that only his party offers stability, and some suspect he will call an early election to (preempt) his rivals. The squabbles among the smaller parties are, for now, a (sideshow).", "zh": "大选最迟将在2027年举行，雅典咖啡馆的常客没完没了地（传播）有关提前大选的传言。新民主党虽然领先，但支持率有所下滑：民调机构Opinion Poll在9月的一项调查显示，新民主党的支持率为25.7%，领先于齐普拉斯在5月创立的左翼政党ELAS的13.2%，以及泛希腊社会主义运动党的10.1%。齐普拉斯已于2025年10月放弃议席，他把自己塑造成比2015年那个（稚嫩的）激进分子更明智的人；他新政党的一名（拥护者）希望ELAS的（首次亮相）标志着东山再起的开始，而这位（有志问鼎的）总理人选预计将从激进左翼联盟党拉走一批倒戈者。这项民调中，几乎每四名（受访者）就有一人认为，没有哪位领导人适合担任总理，许多选民对所有选项仍然（缄默）或（缺乏信心）。由于预计有八个政党进入议会，新民主党将在300个议席中获得约126席，达不到多数，这将使组建联合政府变成一场（拼图游戏）。正在寻求第三个任期的米佐塔基斯喜欢（宣称）只有他的政党能带来稳定，一些人怀疑他会提前举行大选，以（先发制人）对付对手。眼下，小党之间的争吵不过是一段（插曲）。"}, {"en": "Migration is another perennial test. In 2015 more than 850,000 people, many of them Syrians, crossed from Turkey to Greek islands such as Lesbos, overwhelming a state in the middle of its own crisis. In June 2023 an overcrowded fishing boat sank off Pylos, drowning hundreds. Last year the route shifted south, to Crete, where about 10,000 people arrived from Libya in the first half of the year. Facing (exigent) circumstances, the government suspended asylum applications from people arriving by sea from North Africa for three months in July 2025, a step human-rights groups said breached international law; arrivals fell sharply. The coastguard tries to (intercept) boats and remains (vigilant), but critics see a (manifest) shift from humane to (expedient) policy. Greeks know the dilemma of old: Aeschylus wrote a tragedy about (suppliant) women fleeing Egypt and the king of Argos who must decide whether to shelter them. The fear of an (overflow) from Libya has not gone away.", "zh": "移民问题是另一项长期考验。2015年，超过85万人从土耳其进入莱斯沃斯等希腊岛屿，其中许多是叙利亚人，这让一个正深陷自身危机的国家不堪重负。2023年6月，一艘超载的渔船在皮洛斯外海沉没，数百人溺亡。去年，偷渡路线向南转移到克里特岛，上半年约有一万人从利比亚抵达那里。面对（紧迫的）局势，政府于2025年7月暂停受理经海路从北非抵达者的庇护申请，为期三个月，人权组织称此举违反国际法；此后抵达人数大幅下降。海岸警卫队设法（拦截）船只，并保持（警惕），但批评者看到了一种从人道转向（权宜）政策的（明显）转变。希腊人自古就熟知这一两难：埃斯库罗斯写过一部悲剧，讲述一群逃离埃及的（乞求庇护的）女子，以及必须决定是否收留她们的阿尔戈斯国王。对来自利比亚的人潮（泛滥）的担忧并未消失。"}, {"en": "Relations with Turkey, Greece's often (truculent) neighbor and NATO ally, have improved. In December 2023 Mr Mitsotakis and Recep Tayyip Erdogan signed an \"Athens Declaration\" on friendly relations, sealing a (rapprochement) that began when Greek rescuers rushed to help after Turkey's devastating earthquake that February. The (thaw) has held: Mr Mitsotakis and his Turkish (counterpart) have built a working (rapport), and incursions by Turkish jets into Greek airspace have dwindled. But the disputes that (vex) the two countries, over airspace, the continental shelf and the waters around Greek islands that (abut) the Turkish coast, remain unresolved, and Turkey still says it would regard an extension of Greek territorial waters in the Aegean to 12 nautical miles as a cause for war. Greece has hedged with a strategic (tilt) toward America, France and Israel, with which it has deepened military ties, and tries to (orient) European policy toward the eastern Mediterranean.", "zh": "与土耳其的关系有所改善。土耳其是希腊常常（好斗的）邻国，也是北约盟友。2023年12月，米佐塔基斯与雷杰普·塔伊普·埃尔多安签署了关于友好关系的《雅典宣言》，巩固了一场（和解）；这一和解始于当年2月土耳其发生毁灭性地震后希腊救援人员的火速驰援。这次（解冻）得以维持：米佐塔基斯与他的土耳其（同级领导人）建立了良好的工作（关系），土耳其战机侵入希腊领空的次数也已减少。但（困扰）两国的争端，包括领空、大陆架以及（毗邻）土耳其海岸的希腊岛屿周边水域问题，仍未解决；土耳其仍表示，如果希腊把爱琴海领海扩大到12海里，它将视之为宣战理由。希腊则通过战略上（倾向）美国、法国和以色列来对冲风险，并与它们深化了军事联系，同时努力把欧洲的政策（引向）东地中海。"}, {"en": "Greece takes defense seriously, traditionally spending at least 2% of GDP on it. In April 2025 Mr Mitsotakis unveiled a €25bn plan running to 2036, \"the most drastic transformation of the armed forces in the country's modern history\". Its (paramount) element is \"Achilles Shield\", a dome of anti-missile, anti-aircraft and anti-drone defenses. Greece has already ordered 20 American F-35 jets as well as French Rafale fighters and frigates, and the (procurement) bill is huge. Officials are (cognizant) of Turkey's far larger army and booming drone industry; their stated (intent) is deterrence. Every able-bodied man must serve as a (conscript), usually for a year, yet the army struggles to (recruit) enough professionals, and the defense minister wants to (regiment) a sprawling force into a leaner, more technological one. A Greek naval (contingent), meanwhile, helps protect shipping in the Red Sea as part of an EU mission headquartered in Larissa.", "zh": "希腊对国防十分重视，传统上将至少2%的GDP用于国防。2025年4月，米佐塔基斯公布了一项至2036年、耗资250亿欧元的计划，称之为“该国现代史上武装部队最彻底的变革”。其（最重要的）组成部分是“阿喀琉斯之盾”，一个集反导、防空和反无人机于一体的防御穹顶。希腊已经订购了20架美国F-35战机以及法国的“阵风”战斗机和护卫舰，（采购）费用十分庞大。官员们（清楚意识到）土耳其拥有规模大得多的军队和蓬勃发展的无人机产业；他们宣称的（意图）是威慑。每个身体健全的男子都必须作为（义务兵）服役，通常为期一年，但军队仍难以（招募）足够的职业军人，国防部长希望把一支庞杂的部队（整编）成一支更精干、技术含量更高的军队。与此同时，一支希腊海军（分遣队）参与了总部设在拉里萨的欧盟行动，协助保护红海航运。"}, {"en": "Energy is a brighter story. Sunshine is (abundant) and almost (constant) for much of the year, and solar panels now generate more than a fifth of Greece's electricity, the third-highest share in the EU after Hungary and Cyprus; electronic converters (invert) their direct current into the alternating kind the grid uses. Islands that once relied on diesel generators, an expensive and (inexpedient) arrangement, are being wired into the mainland grid; each undersea (circuit) across the Cyclades reduces reliance on diesel. Greece is also becoming a (conduit) for gas: tankers bring liquefied natural gas, much of it American, to terminals at Revithoussa and Alexandroupolis, from where it flows north through a \"vertical corridor\" toward the Balkans and Ukraine.", "zh": "能源则是一个更亮眼的故事。阳光（充沛），一年中大部分时间几乎（持续不断），太阳能电池板如今发出的电力占希腊总发电量的五分之一以上，在欧盟中仅次于匈牙利和塞浦路斯，位列第三；电子变流器把太阳能板产生的直流电（逆变）为电网所用的交流电。曾经依赖柴油发电机的海岛，这是一种昂贵且（不合算的）安排，如今正接入大陆电网；每条连接基克拉泽斯群岛的海底电力（回路）都能减少它们对柴油的依赖。希腊还正在成为天然气的（通道）：油轮把液化天然气运到雷维图萨和亚历山德鲁波利斯的接收站，其中很多来自美国，天然气再从那里经由一条“垂直走廊”向北输往巴尔干和乌克兰。"}, {"en": "Then there is shipping, the industry that never needed a bailout. According to the Union of Greek Shipowners, Greek owners control nearly 5,800 vessels, over 19% of the world's tonnage and 61% of the EU-controlled fleet, which makes Greece the (preeminent) shipping nation. Their (preponderant) position rests on generations of (know-how). Families from Chios, Andros and Kefalonia, whose forebears navigated by (sextant), have proved (adept) at buying ships cheaply in slumps and selling them in booms. Their tankers and bulk carriers often fly the national ensign of Liberia or the Marshall Islands rather than the Greek flag; a company (pennant) may flutter above the deck as the ship sails in (ballast) to its next cargo. The industry accounts for 7-8% of GDP and supports some 200,000 jobs, and its (puissant) owners pay a tonnage tax, protected by the constitution, rather than ordinary corporate tax.", "zh": "此外还有航运业，一个从不需要纾困的行业。据希腊船东联合会的数据，希腊船东控制着近5800艘船，占全球吨位的19%以上、欧盟控制船队的61%，这使希腊成为（首屈一指的）航运国家。他们（占压倒性优势的）地位建立在世代相传的（专业知识）之上。来自希俄斯、安德罗斯和凯法利尼亚等岛屿的家族，祖辈靠（六分仪）导航，他们（擅长）在低迷时廉价买船、在繁荣时卖出。他们的油轮和散货船常常悬挂利比里亚或马绍尔群岛的船籍国旗，而非希腊国旗；船在（压载）空驶、前往下一批货物装载地时，甲板上还可能飘着公司的（三角旗）。航运业占GDP的7%至8%，支撑着约20万个就业岗位，而（势力强大的）船东缴纳的是受宪法保护的吨位税，而非普通的企业所得税。"}, {"en": "Shipping fortunes are (opulent), and some owners (flaunt) them with yachts and villas in the northern suburbs of Athens. But the richest have also been (benevolent). The foundations of Aristotle Onassis and Stavros Niarchos, two rival tycoons, draw on wealth left by their founders. A founder's (bequest) can help to (endow) hospitals and scholarships; the Niarchos foundation also funded its cultural center, a building by Renzo Piano that houses the national library and opera. Meanwhile the old wooden boatyards, where the smell of (sawdust) hung over the slipways, are disappearing. A few craftsmen still build caïques with a single (mast), which (yaw) in the summer meltemi.", "zh": "航运业的财富（极其丰厚），一些船东在雅典北郊用游艇和别墅（炫耀）这些财富。但最富有的人也一直（乐善好施）。亚里士多德·奥纳西斯和斯塔夫罗斯·尼阿科斯这两位互为对手的大亨，都留下了以其财富为依托的基金会。创始人的一笔（遗赠）可以用来（捐资设立）医院或奖学金；尼阿科斯基金会还资助兴建了由伦佐·皮亚诺设计的文化中心，内设国家图书馆和国家歌剧院。与此同时，那些曾在滑道上方弥漫着（锯末）气味的老木船厂正在消失。少数工匠仍在建造只有一根（桅杆）的卡伊克木船，这些船在夏季的梅尔特米风中（左右偏航）。"}, {"en": "Greece's most famous grievance is cultural. The Parthenon, built in 447-432BC, survived largely intact for two millennia, until a Venetian (bombardment) in 1687 ignited gunpowder that the Ottoman garrison had stored inside. Between 1801 and 1812 agents of Lord Elgin, Britain's ambassador in Constantinople, removed about half of the surviving sculptures, which have been in the British Museum since 1816. Whether Elgin had valid Ottoman permission is hard to prove or (controvert), since the document survives only in an Italian translation. The (magnificent) Acropolis Museum, which opened in 2009 (adjacent) to the ancient citadel, displays the frieze with plaster casts standing in for the pieces in London, to (attest) to what is missing; Greeks want every (fragment) reunited. The (august) British Museum, whose chairman, George Osborne, has called the marbles its \"most intractable problem\", floated a long-term loan. But according to the Telegraph, talks under way since 2021 collapsed in September: Greece rejects any deal that recognizes British ownership, and British law bars the museum from disposing of its collection.", "zh": "希腊最著名的不满是文化方面的。建于公元前447年至前432年的帕特农神庙，两千年来基本完好无损，直到1687年威尼斯人的一次（炮轰）引爆了奥斯曼守军储存在神庙内的火药。1801年至1812年间，英国驻君士坦丁堡大使埃尔金勋爵的手下拆走了约一半幸存的雕塑，这些雕塑自1816年起一直存放在大英博物馆。埃尔金是否获得了奥斯曼帝国的有效许可，很难证实，也很难（反驳），因为那份文件只以意大利文译本的形式留存。（宏伟壮丽的）卫城博物馆于2009年开放，（紧邻）古卫城，它展出的饰带用石膏复制品代替了存放在伦敦的部分，以（见证）缺失之物；希腊人希望每一块（碎片）都能重聚。（威严的）大英博物馆的主席乔治·奥斯本曾称这批大理石雕塑是该馆“最棘手的问题”，博物馆曾提出长期出借的方案。但据《每日电讯报》报道，自2021年开始的谈判已于9月破裂：希腊拒绝任何承认英国所有权的协议，而英国法律禁止博物馆处置其藏品。"}, {"en": "The Acropolis is so popular that visitors must now book an hourly (slot). What they see is not what ancient Athenians saw. The sculptors who worked under Phidias could (sculpt) marble so that it seemed to ripple like cloth, but temples and statues were not the pristine white of neoclassical imagination. Using ultraviolet light, X-ray analysis and the occasional chemical (reagent), scientists have found traces of (pigment), including Egyptian blue, showing that friezes and figures were once brightly painted.", "zh": "卫城如此受欢迎，以至于游客现在必须预订按小时划分的参观（时段）。他们看到的并非古代雅典人所见的景象。在菲狄亚斯指导下工作的雕刻家能把大理石（雕刻）得仿佛布料般起伏，但神庙和雕像并不像新古典主义想象中那样洁白无瑕。科学家借助紫外线、X射线分析以及偶尔使用的化学（试剂），发现了（颜料）的痕迹，其中包括埃及蓝，表明饰带和人像曾经色彩鲜艳。"}, {"en": "Athens gave the world democracy. After rule by a (tyrant) such as Peisistratos, reforms by Cleisthenes in 508BC created a system in which adult male citizens voted directly on laws, the (antecedent) of every modern democracy. Once a year they could exile a politician for ten years by scratching his name on a potsherd, a primitive (ballot); thousands survive. Women, slaves and foreigners were excluded, and Greek women won the right to vote in national elections only in 1952, after decades of campaigning by the (suffragist) movement. Athens's golden age was financed by silver from the mines of Laurion, which the city used to (mint) its \"owl\" coins, prized by every (numismatist) today, and, in 483BC, to build the fleet that beat the Persians at Salamis.", "zh": "雅典给了世界民主。在庇西特拉图这样的（僭主）统治之后，克里斯提尼于公元前508年推行改革，建立了成年男性公民直接就法律投票的制度，这是一切现代民主的（前身）。他们每年可以把一位政治人物的名字刻在陶片上，将其放逐十年，这便是一种原始的（选票）；数以千计的这类陶片留存至今。妇女、奴隶和外国人被排除在外；在（妇女选举权运动者）群体数十年的奔走之后，希腊妇女直到1952年才赢得全国选举的投票权。雅典的黄金时代靠劳里昂矿山的白银支撑，这座城市用这些白银（铸造）了著名的“猫头鹰”硬币，如今为每一位（钱币收藏家）所珍视；公元前483年，雅典还用这些白银建造了一支舰队，后来在萨拉米斯击败了波斯人。"}, {"en": "Sparta offered a grimmer model. Its citizens trained for war from boyhood, while a (helot), a serf in all but name, worked the land for them. At Thermopylae in 480BC a (valiant) band of 300 Spartans and their allies held off a vast Persian army for three days; ten years earlier the Athenians had put the Persians to (rout) at Marathon. The (stout) resistance of the city-states preserved their independence, and a century and a half later Alexander the Great, a Macedonian, carried Greek culture by (conquest) as far as India.", "zh": "斯巴达提供了一个更严酷的模式。它的公民从小接受战争训练，而一名（希洛人），实际上就是农奴，负责替他们耕种土地。公元前480年，在温泉关，一支由300名斯巴达人及其盟友组成的（英勇的）队伍，抵挡了庞大的波斯军队整整三天；十年前，雅典人已在马拉松（击溃）了波斯人。城邦的（顽强）抵抗保住了它们的独立；一个半世纪后，马其顿人亚历山大大帝通过（征服）把希腊文化一直传播到印度。"}, {"en": "For guidance, the ancients went to Delphi, where the Pythia, a priestess of Apollo, delivered oracles for which cities and kings paid handsomely; to believers her pronouncements were (clairvoyant). The temple bore the (precept) \"Know thyself\". Other cults were more (occult): initiates into the Mysteries of Eleusis swore never to reveal what they had seen, and the secret was kept so well that historians still argue about what surviving accounts of the rites (purport) to reveal.", "zh": "古人寻求指引时会前往德尔斐，阿波罗的女祭司皮提亚在那里传达神谕，城邦和国王都为此付出高昂代价；在信徒眼中，她的预言是（能预见未来的）。神庙上刻着“认识你自己”这条（箴言）。其他崇拜则更加（神秘玄奥）：厄琉息斯秘仪的入会者发誓永不透露他们所见之事，这一秘密保守得如此之好，以至于历史学家至今仍在争论，流传下来的仪式记载究竟（声称）揭示了什么。"}, {"en": "Sport, too, has Greek roots. The Olympic games, traditionally dated to 776BC, began with a single (sprint), the stadion, of about 192 meters. Boxers bound each (wrist) and hand in leather thongs, and a (pugilist) might fight a (bout) without rounds until one man gave up. Athletes rubbed their bodies with an olive-oil (unguent) and competed naked, every (sinew) on display, before (rapt) crowds, and a sacred truce helped (hallow) the games; the javelin was, in effect, an outsized (dart). Today the flame for every Olympics is lit at Olympia with a parabolic mirror in a (pageant) performed by actresses dressed as priestesses, before the (commencement) of the torch relay. The modern games were revived in Athens in 1896 as the (embodiment) of an ancient ideal.", "zh": "体育同样源于希腊。传统上认为始于公元前776年的奥林匹克运动会，起初只有一项（短跑），即约192米的“斯塔迪昂”赛跑。拳手们用皮带缠绕每只（手腕）和手，一名（拳击手）可能要打一场不分回合的（比赛），直到一方认输。运动员把橄榄油（油膏）涂满全身，赤身参赛，在（全神贯注的）观众面前展示每一块（肌腱），一项神圣的休战协定有助于（使神圣）赛会；标枪实际上就是一支加大号的（飞镖）。如今，每届奥运会的火种都是在奥林匹亚用抛物面镜点燃的，在火炬传递（开始）之前，由装扮成女祭司的女演员们表演一场（盛装仪式）。1896年，现代奥运会在雅典复兴，成为一种古老理想的（化身）。"}, {"en": "Philosophy was another Athenian export. Socrates, executed in 399BC for impiety and corrupting the young, would (posit) a definition and then demolish it through questioning. Plato, his pupil, founded the Academy, and his \"Symposium\" depicts guests, (recumbent) on couches at a drinking party, debating love. Pythagoras taught that souls migrate between bodies, so that eating a (sentient) animal might mean eating a former friend, whereas Aristotle credited animals with feeling but not reason, and gave plants a soul that was wholly (insentient). Epicurus, often caricatured as a (hedonist), in fact taught that the highest pleasure is freedom from pain and fear. These thinkers sought to (impart) wisdom rather than information. The most (sapient) of them, Aristotle, tutored the young Alexander, and every later (exponent) of Western philosophy has had to wrestle with their ideas.", "zh": "哲学是雅典的另一项输出品。公元前399年，苏格拉底以不敬神和腐蚀青年的罪名被处死，他常常先（提出）一个定义，然后通过追问把它推翻。他的学生柏拉图创办了学园，其《会饮篇》描绘了在酒会上（斜倚）在卧榻上辩论爱情的宾客。毕达哥拉斯教导说，灵魂会在不同躯体间转世，因此吃一只（有知觉的）动物可能就是吃掉一位故友；而亚里士多德认为动物有感觉但没有理性，并认为植物的灵魂是完全（无知觉的）。伊壁鸠鲁常被讽刺为（享乐主义者），实际上他教导的是，最高的快乐是免于痛苦和恐惧。这些思想家力求（传授）智慧而非信息。其中最（睿智的）亚里士多德曾教导少年亚历山大，此后西方哲学的每一位（倡导者）都不得不与他们的思想角力。"}, {"en": "Greek science was just as bold. Euclid's geometry, built from the point, the line and the (vertex), was taught for more than two thousand years. Archimedes, the (savant) of Syracuse, showed how the volume of a sphere, the most perfectly (convex) of solids, relates to that of a cylinder, and helped defend his city against the Romans with war machines; the (catapult) itself had been invented in Syracuse around 399BC, under its ruler Dionysius. Aristotle, the first great (taxonomist), classified hundreds of animal species. And in 1901 sponge divers found in the (sediment) of a shipwreck off Antikythera a corroded lump of bronze gears, the world's oldest known analog computer, which modeled the motions of the sun, moon and planets; scholars have devoted decades to decoding it, a task demanding complete (engrossment).", "zh": "希腊的科学同样大胆。欧几里得的几何学由点、线和（顶点）构建而成，被传授了两千多年。叙拉古的（博学之士）阿基米德证明了球体这种最完美的（凸的）立体的体积与圆柱体体积之间的关系，并用战争机械帮助家乡抵御罗马人；（投石机）本身就是约公元前399年在叙拉古、由其统治者狄奥尼修斯治下发明的。亚里士多德是第一位伟大的（分类学家），他为数百种动物分了类。1901年，采集海绵的潜水员在安提基西拉岛外一艘沉船的（沉积物）中发现了一团锈蚀的青铜齿轮，这是已知世界上最古老的模拟计算机，能够模拟太阳、月亮和行星的运动；此后学者们花费数十年破解它；这是一项需要研究者（全神贯注）的工作。"}, {"en": "Medicine owes much to Hippocrates of Kos, who taught that diseases have natural causes rather than divine ones. The Hippocratic writings explain how to dress a wound with an (ointment) and distinguish (intermittent) fevers, which come and go, from (remittent) ones, which ebb without ever quite breaking. Doctors still swear an oath that bears his name. Greek medicine was powerless, though, against the (pestilent) plague that struck Athens in 430BC, killing perhaps a quarter of its people, including Pericles; Thucydides, who caught the (ailment) and survived, described its symptoms in grim detail.", "zh": "医学在很大程度上要归功于科斯岛的希波克拉底，他教导说，疾病有自然原因，而非神灵所致。希波克拉底文集解释了如何用（药膏）包扎伤口，并区分时有时无的（间歇性）发热和起伏消退却始终不完全退烧的（弛张性）发热。医生们至今仍宣读以他的名字命名的誓言。然而，面对公元前430年袭击雅典的（致命的）瘟疫，希腊医学束手无策，这场瘟疫可能夺去了雅典四分之一人口的生命，其中包括伯里克利；感染了这种（疾病）却活了下来的修昔底德，详细描述了它的可怕症状。"}, {"en": "The theater was born in Athens too, at festivals for Dionysus. In tragedy the (protagonist), the leading actor, moves through a (climax) to a (denouement) that is usually catastrophic: in Euripides's \"Bacchae\" a king, Pentheus, is torn apart by women in a state of divine (derangement), among them his own mother. Comedy was earthier. Aristophanes's actors wore padded costumes to look (corpulent), and his (wit) was (mordant): in \"Lysistrata\" the women of Greece go on a sex strike to end the Peloponnesian war, which makes him an early (pacifist) of sorts. Later comedy gave the West the stock figure of the (braggart) soldier. Plays that now seem (highbrow) were popular entertainment, and actors' masks, which might grin, scowl or (pout), carried expressions to the back rows of theaters such as Epidaurus, whose acoustics still astonish visitors.", "zh": "戏剧也诞生于雅典，源自酒神狄俄尼索斯的节庆。在悲剧中，（主角），即领衔演员，经历（高潮）走向通常是灾难性的（结局）：在欧里庇得斯的《酒神的女信徒》中，国王彭透斯被一群陷入神圣（癫狂）的女人撕成碎片，其中就有他自己的母亲。喜剧则更为粗俗。阿里斯托芬的演员穿着填充过的戏服，让自己看起来（肥胖臃肿），而他的（机智）（尖刻辛辣）：在《吕西斯特拉忒》中，希腊妇女发起性罢工以结束伯罗奔尼撒战争，这使他在某种意义上成为一位早期的（和平主义者）。后来的喜剧为西方贡献了（吹牛的）士兵这一定型角色。如今看来（阳春白雪的）戏剧在当时是大众娱乐，演员的面具可以咧嘴笑、皱眉或（噘嘴），把表情传达到埃皮达鲁斯等剧场的最后几排，那里的音响效果至今仍令游客惊叹。"}, {"en": "The myths are still everywhere. Zeus, who hurled the lightning (bolt), was neither (omniscient) nor quite (omnipotent), and his (lust) got him into endless trouble: disguised as a bull, he carried off Europa, a Phoenician princess who gave her name to a (continent). Narcissus, who fell in love with his own reflection, lent his to the (narcissist). The wicked were cast into Tartarus, the (nethermost) pit of the underworld, and the gods themselves could be as (maleficent) as they were kind.", "zh": "神话依然无处不在。投掷（霹雳）的宙斯既非（无所不知），也不完全（无所不能），他的（情欲）给他惹来无尽的麻烦：他化身为一头公牛，掳走了腓尼基公主欧罗巴，后者把自己的名字给了一个（大洲）。爱上自己倒影的那喀索斯，则把自己的名字给了（自恋者）。恶人被投入塔尔塔罗斯，那是冥界（最深处）的深渊，而众神本身既可能仁慈，也可能（恶毒）。"}, {"en": "Greece's human story began long before Homer. In the Franchthi Cave in the Peloponnese, Stone Age hunters knapped (flint), and the obsidian later ferried there from Milos is among the earliest evidence of seafaring in the Mediterranean. The \"Iliad\" and the \"Odyssey\", composed around the eighth century BC and recited by (itinerant) bards, remain the foundation of Western literature. One (excerpt) from the \"Iliad\" captures the cruelty of war in miniature: the infant Astyanax shrinks in terror from the horsehair (crest) on the helmet of his father, Hector. In the \"Odyssey\" Odysseus's ten-year (quest) to get home is wrecked by a (tempest) that Poseidon sends against him. Greeks sought their gods' favor with sacrifices; an offering to the powers of the underworld was often a (holocaust), an animal burned whole, which is what the word originally meant. The oldest (extant) complete copy of the \"Iliad\", the Venetus A, dates from the tenth century AD.", "zh": "希腊的人类历史远早于荷马。在伯罗奔尼撒的弗兰克西洞穴，石器时代的猎人打制（燧石），而后来从米洛斯岛渡海运来的黑曜石，是地中海航海活动最早的证据之一。约创作于公元前8世纪、由（四处漂泊的）吟游诗人传唱的《伊利亚特》和《奥德赛》，至今仍是西方文学的基石。《伊利亚特》中的一个（片段）以小见大地展现了战争的残酷：婴儿阿斯蒂阿纳克斯被父亲赫克托耳头盔上的马鬃（盔饰）吓得往后缩。在《奥德赛》中，奥德修斯长达十年的归乡（征程）被波塞冬掀起的（暴风雨）摧毁。希腊人用献祭求取神灵的眷顾；献给冥界神祇的祭品往往是一场（燔祭），即把一头牲畜整个焚烧，这正是这个词的本义。（现存）最古老的《伊利亚特》完整抄本，即“威尼斯A抄本”，可追溯到公元10世纪。"}, {"en": "Greek itself is a marvel of continuity. It has been written for some 3,400 years, from the Linear B tablets of Mycenaean palaces, deciphered in 1952, to today's text messages. In about the eighth century BC the Greeks took the Phoenician script, which had a sign for each (consonant) but none for vowels, and began to (adapt) it into the first true alphabet, complete with the (sibilant) sigma, before passing it on to the Etruscans and the Romans. For much of the 20th century a linguistic (pedant) might insist on katharevousa, a stilted \"purified\" Greek; in 1976 demotic, the spoken language, became official. Modern Greeks are a (polyglot) people, many of them (proficient) in English and (conversant) in a third language, and a well-read Greek can grasp the (gist) of the Gospels in the original.", "zh": "希腊语本身就是延续性的奇迹。从迈锡尼宫殿里于1952年被破译的线形文字B泥板，到今天的手机短信，希腊语已有约3400年的书写历史。约公元前8世纪，希腊人借用了腓尼基文字，这种文字每个（辅音）都有符号，却没有元音符号，希腊人开始将其（改造）为第一套真正的字母表，其中包括发（咝音）的西格玛，随后又传给了伊特鲁里亚人和罗马人。20世纪的大部分时间里，一个拘泥传统语法的（迂腐学究）可能会坚持使用生硬的“净化”希腊语；1976年，口语化的通俗希腊语成为官方语言。现代希腊人是一个（通晓多种语言的）民族，许多人（精通）英语，并（熟悉）第三种语言；一个博览群书的希腊人能读懂福音书原文的（大意）。"}, {"en": "English is full of Greek. A (sycophant) was originally, it seems, a \"fig-revealer\", perhaps an informer who denounced illegal fig exports; in Athens the word came to mean a malicious accuser. An (amethyst) was thought to keep its wearer sober, hence a name meaning \"not intoxicated\". \"Not one (jot)\" comes from iota, the smallest Greek letter, and (gamut) from the medieval musical term gamma ut: gamma named the lowest note and ut was the solmisation syllable later replaced by do. A (philatelist) owes the name to a French collector who in 1864 coined \"philately\" from Greek words for \"love\" and \"tax exemption\". And when Jewish scholars in Alexandria translated the Hebrew scriptures into Greek, they rendered the word for (covenant) as diatheke.", "zh": "英语中充满了希腊语。（谄媚者）一词原本似乎意为“揭发无花果的人”，可能指告发非法出口无花果者的线人；在雅典，这个词后来指恶意的诬告者。人们认为（紫水晶）能让佩戴者保持清醒，因此它的名字意为“不醉”。英语里表示“丝毫不”的说法中的（一点点）一词，来自希腊最小的字母约塔，而（音域全范围）一词源自中世纪音乐术语“gamma ut”：gamma表示音阶的最低音，ut则是后来由do取代的唱名音节。（集邮家）这一名称要归功于一位法国收藏家，他在1864年用希腊语中表示“爱”和“免税”的词造出了“集邮”一词。当亚历山大的犹太学者把希伯来经文译成希腊语时，他们把表示（盟约）的词译作“diatheke”。"}, {"en": "The (advent) of Christianity transformed the Greek world. For a thousand years after Rome fell in the west, the Byzantine empire, Greek-speaking and Orthodox, endured in Constantinople. Greek came to (supplant) Latin as its official language in the seventh century, and Byzantine missionaries helped (implant) Christianity among the Slavs: Cyril and Methodius, brothers from Thessaloniki, devised an alphabet for them in the ninth century. In 726-843 the empire was convulsed by a struggle over images, in which the (iconoclast) faction sought to destroy sacred images; its defeat left a lasting (imprint) on Orthodox worship. Emperors ruled by edict and (rescript); the navy used \"Greek fire\", an incendiary mixture whose composition remains uncertain, down to the identity of each (reactant); and the Theodosian land walls, a triple (rampart), were not breached until 1453, when Ottoman cannon pounded them.", "zh": "基督教的（到来）改变了希腊世界。罗马在西方覆灭后的一千年里，讲希腊语、信奉东正教的拜占庭帝国在君士坦丁堡延续下来。到了7世纪，希腊语逐渐（取代）拉丁语，成为帝国的官方语言，拜占庭传教士还帮助在斯拉夫人中（植入）基督教：来自塞萨洛尼基的西里尔和美多德兄弟在9世纪为他们创制了一套字母。726年至843年间，帝国因一场关于圣像的斗争而动荡不安，（圣像破坏派）试图摧毁神圣画像；该派的失败在东正教的礼拜中留下了持久的（印记）。皇帝通过敕令和（批复）进行统治；海军使用“希腊火”，这种燃烧混合物的具体配方仍不确定，甚至每种（反应物）的身份都未能完全查明；狄奥多西陆墙这道三重（壁垒），直到1453年遭奥斯曼大炮轰击时才被攻破。"}, {"en": "The Orthodox Church remains (predominant): about nine in ten Greeks identify with it, and its priests are paid by the state. Black-robed clerics with (luxuriant) beards are a common sight, and on feast days a priest dons a gold-embroidered (vestment). Churches flicker with candles and (pendent) oil lamps, and beneath some lies an ancient (crypt), such as that of the basilica of Saint Demetrius in Thessaloniki. Many (devout) grandmothers fast during Lent, (abstinent) from meat and dairy, and sermons from the (pulpit) still carry weight in villages, where confession, a (sacrament) at which the (penitent) are urged to (repent), remains common. Even Greeks who rarely attend church are (steadfast) in keeping the great feasts.", "zh": "东正教会仍占（优势）地位：约十分之九的希腊人认同它，其神职人员由国家支付薪水。身着黑袍、蓄着（浓密）胡须的神职人员随处可见，节日时，一位神父会穿上金线刺绣的（法衣）。教堂里烛光摇曳，（悬挂着的）油灯闪烁，有些教堂地下还有古老的（地下墓室），比如塞萨洛尼基圣德米特里大教堂的地下墓室。许多（虔诚的）老奶奶在大斋期间守斋，（戒绝）肉类和奶制品；在乡村，（讲坛）上的布道依然颇具分量，忏悔这一（圣礼）仍很普遍，（忏悔者）在其中被劝诫（悔改）。即使是很少上教堂的希腊人，也会（坚定地）过好各大宗教节日。"}, {"en": "Easter is the year's great festival. Shortly before midnight on Holy Saturday the (resplendent) churches go dark; then the \"Holy Light\", flown in from Jerusalem, passes from candle to candle until whole congregations are (refulgent). Hymns (exalt) the risen Christ, and families feast on lamb and tsoureki, a sweet braided bread raised with (yeast). On Mount Athos, a self-governing monastic republic of 20 monasteries that has barred women for more than a thousand years, some 2,000 monks keep the old ways. Their libraries guard many a priceless (manuscript), and hermits live in a (hut) clinging to the cliffs. Visitors must (comport) themselves with care, and the monks' (deportment) is that of men who believe God to be both (transcendent) and (immanent).", "zh": "复活节是一年中最盛大的节日。圣周六午夜前不久，（金碧辉煌的）教堂熄灭灯火；随后，从耶路撒冷空运而来的“圣火”在蜡烛间传递，直到整个会众都（光芒四射）。赞美诗（颂扬）复活的基督，家家户户享用羊肉和一种用（酵母）发酵的甜味辫子面包“措雷基”。在阿索斯山，一个由20座修道院组成的自治修道共和国，一千多年来一直禁止女性进入，约2000名修士坚守着古老的生活方式。他们的图书馆珍藏着许多无价的（手稿），隐修士住在依附于悬崖的（小屋）里。访客必须小心（约束言行），修士们的（仪态）体现出他们相信上帝既（超越万物）又（内在于万物）。"}, {"en": "Modern Greece was born in (revolt). In March 1821, after nearly four centuries of Ottoman rule, Greeks rose up; tradition holds that Bishop Germanos of Patras raised the flag of revolution at a monastery in the Peloponnese to (exhort) them. The typical (insurgent) was often a klepht, a mountain brigand turned (patriot); the struggle lasted nearly a decade, and foreign volunteers came to (enlist): Lord Byron died of fever at Missolonghi in 1824. Britain, France and Russia destroyed an Ottoman-Egyptian fleet at Navarino in 1827 and then chose to (bestow) a king on the new state. He was Otto, a 17-year-old Bavarian prince, for whom a Bavarian count, Joseph von Armansperg, served as chief (regent). The first capital was Nafplio, overlooked by Palamidi, a Venetian (fort) on a crag; Ioannis Kapodistrias, the country's first governor, was assassinated there in 1831.", "zh": "现代希腊诞生于一场（起义）。1821年3月，在奥斯曼帝国统治了近四个世纪之后，希腊人揭竿而起；据传，帕特雷主教耶尔马诺斯在伯罗奔尼撒的一座修道院升起革命旗帜，（激励）民众。典型的（起义者）往往是克勒夫特人，即转而成为（爱国者）的山地绿林好汉；这场斗争持续了近十年，外国志愿者也纷纷前来（参军）：拜伦勋爵1824年在迈索隆吉翁死于热病。1827年，英国、法国和俄国在纳瓦里诺摧毁了奥斯曼—埃及联合舰队，随后决定为这个新国家（赐予）一位国王。他就是17岁的巴伐利亚王子奥托，由巴伐利亚伯爵约瑟夫·冯·阿曼斯佩格担任首席（摄政）。第一个首都是纳夫普利翁，俯瞰全城的是建在山崖上的威尼斯（要塞）帕拉米迪；该国首任总督扬尼斯·卡波迪斯特里亚斯于1831年在那里遇刺。"}, {"en": "The 20th century was (turbulent). Greece's dream of reclaiming Constantinople and Asia Minor ended in 1922, when Turkish forces drove the Greek army into the sea and Smyrna burned; the (subsequent) population exchange sent about 1.2m Orthodox Christians to Greece and some 400,000 Muslims to Turkey. On October 28th 1940 Greece rejected Mussolini's ultimatum and pushed the Italian invaders back into Albania, only to be overrun by Germany in 1941. The occupation was (abhorrent): tens of thousands starved in Athens in the winter of 1941-42, and in 1943 the Nazis began to (deport) almost all of Thessaloniki's 50,000 Jews to Auschwitz, where most were murdered. A. Tassos, an (eminent) engraver who joined the resistance, was seized by the Germans after exhibiting a (woodcut) that they read as a symbol of Greek suffering. Liberation in 1944 did not bring peace: a civil war between communists and the government, which lasted until 1949, chilled the country to its (marrow) and would (foreshadow) decades of bitter division.", "zh": "20世纪（动荡不安）。1922年，希腊收复君士坦丁堡和小亚细亚的梦想破灭，土耳其军队把希腊军队赶入大海，士麦那陷入火海；（随后的）人口交换把约120万东正教徒送往希腊，约40万穆斯林送往土耳其。1940年10月28日，希腊拒绝了墨索里尼的最后通牒，把入侵的意大利军队赶回阿尔巴尼亚，却在1941年被德国占领。占领时期（令人憎恶）：1941年至1942年冬天，雅典有数万人饿死；1943年，纳粹开始将塞萨洛尼基约五万名犹太人中的绝大多数（强制遣送）到奥斯维辛，其中大多数人遇害。加入抵抗运动的（著名的）版画家A.塔索斯，因展出一幅被占领者解读为希腊苦难象征的（木刻画）而遭德国人逮捕。1944年的解放并未带来和平：共产党人与政府之间的内战一直持续到1949年，让这个国家寒彻（骨髓），并（预示）了数十年的严重分裂。"}, {"en": "In April 1967 a cabal of army colonels staged a coup to (overthrow) the democratic order. They imposed martial law, with a (curfew) and censorship, and many a (dissident) was jailed, tortured or exiled. George Papadopoulos, the junta's leader, was a (despot) with a taste for moralizing: long hair for men and miniskirts were banned, and so was the music of Mikis Theodorakis. The regime crushed (dissent) until November 17th 1973, when a tank smashed through the gates of the Athens Polytechnic, which students had occupied in protest. The colonels fell in 1974, after a botched coup in Cyprus provoked a Turkish invasion of the island, and in December that year Greeks voted in a referendum to (oust) the monarchy for good.", "zh": "1967年4月，一群陆军上校发动政变，（推翻）了民主秩序。他们实施戒严，实行（宵禁）和新闻审查，许多（异见人士）遭到监禁、酷刑或流放。军政府领导人乔治·帕帕佐普洛斯是个热衷于道德说教的（暴君）：男人留长发和女人穿迷你裙都被禁止，米基斯·提奥多拉基斯的音乐也遭禁。政权一直镇压（异议），直到1973年11月17日，一辆坦克撞开了被学生占领以示抗议的雅典理工学院的大门。1974年，在塞浦路斯策划的一场政变失败并招致土耳其入侵该岛之后，上校们倒台；同年12月，希腊人通过全民公投（废黜）了君主制，永不恢复。"}, {"en": "Greek music carries that history. Rebetiko, often called the Greek blues, grew in the 1920s and 1930s in the ports and hashish dens where refugees from Asia Minor settled; its lyrics are full of underworld (argot), and its (plangent) songs of exile, poverty and love were added to UNESCO's list of intangible cultural heritage in 2017. The (resonant) metal strings of the bouzouki dominate its sound, while the polyphonic songs of Epirus, with their (dissonant) clashes, can sound strange to foreign ears. At a taverna a (vocalist) may be joined by an (instrumentalist) on bouzouki and a (percussionist) on a goblet drum, and diners break into (impromptu) dances. A (musicologist) would note that the zeibekiko, a brooding solo dance, follows an irregular nine-beat rhythm.", "zh": "希腊音乐承载着这段历史。常被称为“希腊蓝调”的雷贝蒂卡，于20世纪20年代和30年代在小亚细亚难民定居的港口和大麻馆中发展起来；它的歌词充满了黑社会的（行话），那些关于流亡、贫穷和爱情的（哀婉动人的）歌曲于2017年被列入联合国教科文组织的非物质文化遗产名录。布祖基琴（共鸣洪亮的）金属弦主导了它的声音，而伊庇鲁斯的复调歌曲带着（不和谐的）音程碰撞，在外国人听来可能有些奇特。在小酒馆里，一位（歌手）可能会与一位弹布祖基琴的（器乐演奏者）和一位敲高脚鼓的（打击乐手）同台，食客们则会跳起（即兴的）舞蹈。（音乐学家）会指出，泽贝基科这种沉郁的独舞遵循一种不规则的九拍节奏。"}, {"en": "Greeks have a (penchant) for long, loud meals. The cuisine is simple but (redolent) of the land: oregano and thyme from the hills, lemons, garlic in a (pungent) skordalia, and thyme honey so (fragrant) that a spoonful perfumes a whole pot of tea. Olive oil, vegetables and pulses are central to the diet, each (ingredient) contributing a different (nutrient) or other benefit, and a (piquant) dip such as tirokafteri, made with feta and chili, is a favorite (condiment). Retsina, a white wine flavored with pine resin, has an (astringent) tang; better wines, such as Santorini's assyrtiko, are worth the trouble to (decant). Greeks (eschew) eating alone, and to (ingest) a meal in a hurry is almost a sin.", "zh": "希腊人对漫长而热闹的饭局有一种（偏好）。这里的菜肴简单，却（洋溢着）土地的气息：山上的牛至和百里香、柠檬、（辛辣刺鼻的）蒜泥酱里的大蒜，还有（芬芳的）百里香蜂蜜，一勺就能让整壶茶香气四溢。橄榄油、蔬菜和豆类构成这种饮食的核心，每种（食材）都提供不同的（营养素）或其他益处，而用羊乳酪和辣椒做成的（辛辣开胃的）蘸酱“提洛卡夫特里”是一种很受欢迎的（调味品）。用松脂调味的白葡萄酒“松香酒”带有一种（涩口的）味道；更好的葡萄酒，比如圣托里尼的阿瑟提可，值得花工夫（醒酒）。希腊人（避免）独自用餐，匆匆（吃下）一顿饭几乎是一种罪过。"}, {"en": "Olive oil is the national lifeblood, and Greeks consume more of it per head than almost anyone. In antiquity it was food, fuel for lamps, an (emollient) for the skin and a (lubricant) for tools. Feta, protected as a Greek product by the EU since 2002, must be made mainly from sheep's milk, with no more than 30% from goats. Either animal is a grazing (ruminant) suited to stony hillsides; rennet, a (coagulant), makes the milk (clot) into curds, which are salted and aged in brine.", "zh": "橄榄油是这个国家的命脉，希腊人的人均橄榄油消费量几乎居世界之首。在古代，橄榄油既是食物和灯油，也是护肤的（润肤剂）和工具的（润滑剂）。羊乳酪自2002年起被欧盟列为受保护的希腊产品，必须以绵羊奶为主要原料，山羊奶比例不得超过30%。无论绵羊还是山羊，都是适合多石山坡放牧的（反刍动物）；凝乳酶是一种（凝固剂），能让奶（凝结）成凝乳，再经过盐渍并在盐水中熟成。"}, {"en": "Farming remains part of national life, even as farmers age. Fields lie (fallow) in rotation; farmers (harrow) the soil and (sow) wheat and cotton, of which Greece is the EU's biggest producer, and on family farms pigs still (farrow) in the spring. Kitchen scraps go onto the (compost) heap. The hills are dotted with circular stone threshing floors, where farmers once relied on the wind to (winnow) their grain, and dowry chests were once filled with linen woven from (flax), each (garment) and sheet embroidered by hand. In Soufli, a town in Thrace, families reared silkworms and reeled their (filament) into silk, a craft now remembered in a museum. Crete's carob trees yield the (locust) bean, once famine food and now sold in health shops.", "zh": "即使农民日渐老去，农业仍是国民生活的一部分。田地轮流（休耕）；农民（耙）地，（播种）小麦和棉花，希腊是欧盟最大的棉花生产国，在家庭农场里，母猪仍在春天（产仔）。厨房残渣被扔进（堆肥）堆。山坡上点缀着圆形的石砌打谷场，农民们曾借助风力在那里（扬谷），嫁妆箱里曾装满用（亚麻）织成的布，每一件（衣物）和床单都是手工刺绣的。在色雷斯的小镇苏夫利，人们曾饲养蚕，把蚕吐出的（丝线）缫成丝绸，这门手艺如今在一座博物馆里被追忆。克里特岛的角豆树结出被称为（刺槐豆）的豆荚，它曾是饥荒时的食物，如今在保健品店里出售。"}, {"en": "The landscape is the country's greatest asset. Greece has some 6,000 islands and islets and one of Europe's longest coastlines; countless bays and inlets (indent) its shores, so that few places are far from the sea, which takes on an (iridescent) turquoise (tint) over white sand. In the north, the (verdant) forests of Epirus and the Prespa lakes, home to the world's biggest breeding colony of Dalmatian pelicans, delight every (ornithologist), while a (herpetologist) might head for Milos, home to an endemic viper. On Zakynthos loggerhead turtles nest on protected beaches, though any (ecologist) will complain that tour boats still (molest) them. Greeks began to (deforest) their hills early: Plato compared the eroded slopes of Attica to the skeleton of a sick man.", "zh": "风景是这个国家最大的财富。希腊约有6000个大小岛屿，海岸线位居欧洲最长之列；无数海湾与海岬将海岸（切割出深深的凹口），因此几乎没有哪个地方远离大海；在白沙之上，海水泛着（虹彩般的）绿松石（色调）。在北方，伊庇鲁斯（郁郁葱葱的）森林和普雷斯帕湖令每一位（鸟类学家）着迷，那里是世界上最大的卷羽鹈鹕繁殖地；一位（爬虫学家）则可能前往米洛斯岛，那里有一种特有的蝰蛇。在扎金索斯岛，红海龟在受保护的海滩上筑巢，不过任何一位（生态学家）都会抱怨游船仍在（骚扰）它们。希腊人很早就开始（砍伐森林）：柏拉图把阿提卡被侵蚀的山坡比作病人的骨架。"}, {"en": "Climate change is making nature less (clement). Summers are hotter and drier, and wildfires break out every year, fanned by the meltemi wind, in which a single (gust) can carry embers across a valley. In 2018 a fire at Mati, near Athens, killed more than 100 people; in 2023 a blaze in Evros became the largest recorded in the EU, and in 2025 Chios burned twice. Charred hillsides look as if they had been sprayed with (defoliant), and (containment) is hard where villages lack a working (hydrant) and the (blast) of a heatwave dries everything to tinder. Autumn can bring (inclement) weather of another kind. In September 2023 Storm Daniel unleashed a (cloudburst) of historic proportions, dumping more rain on parts of Thessaly in a day than Athens gets in a year; a (torrent) of water breached many an (embankment), flooding the plain and killing 17 people.", "zh": "气候变化让大自然变得不那么（温和）。夏天越来越炎热干燥，每年都会爆发野火，在梅尔特米风的吹拂下，一阵（狂风）就能把余烬吹过山谷。2018年，雅典附近马蒂的一场大火造成100多人死亡；2023年，埃夫罗斯的一场大火成为欧盟有记录以来最大的山火；2025年，希俄斯岛两度起火。烧焦的山坡看上去就像被喷了（落叶剂），在缺少可用（消防栓）的村庄，热浪的（冲击）把一切烤成易燃物，（控制）火势十分困难。秋天则可能带来另一种（恶劣的）天气。2023年9月，风暴“丹尼尔”带来了一场历史罕见的（暴雨），色萨利部分地区一天的降雨量超过雅典一年的降雨量；（洪流）冲垮了许多（堤岸），淹没了平原，造成17人死亡。"}, {"en": "The ground is no steadier. Greece sits where the African plate dives beneath the Eurasian one, and it is the most earthquake-prone country in Europe: along every (fault), the (thrust) of colliding plates strains the Earth's (crust). In February 2025 an (incessant) swarm of undersea tremors, the strongest of magnitude 5.2, shook Santorini; the government declared a state of emergency, schools closed and thousands of people left by ferry and plane, a (prompt) response to a (presentiment) of disaster. Seismologists said the swarm was unrelated to the island's volcano, which has been (quiescent) since its last eruption in 1950 but is (dormant) rather than dead: about 3,600 years ago it blew the island apart in one of the largest eruptions in human history. Here the landscape is (impermanent), and a danger that is (latent) can become (imminent) without warning.", "zh": "大地也并不安稳。希腊位于非洲板块俯冲到欧亚板块之下的地方，是欧洲地震最频繁的国家：沿着每一条（断层），板块碰撞产生的（推挤力）让地球的（地壳）承受着压力。2025年2月，一连串（接连不断的）海底地震震撼了圣托里尼，最强的一次为5.2级；政府宣布进入紧急状态，学校停课，数千人乘渡轮和飞机离开，这是对灾难（预感）的（迅速）反应。地震学家说，这次震群与岛上的火山无关，这座火山自1950年最后一次喷发以来一直（静止），但它是（休眠的）而非死火山：约3600年前，它把这座岛炸得四分五裂，那是人类历史上规模最大的火山喷发之一。在这里，地貌是（无常的），一种（潜伏的）危险可能毫无预警地变得（迫在眉睫）。"}, {"en": "Athens, home to more than a third of all Greeks, is (vibrant) once more. Its young people are (insouciant) about the crisis years and (nonchalant) about the chaos, and the city's (extrovert) culture spills onto pavements and rooftop bars with infectious (zest). As is their (wont), Athenians dine late, often after ten at night; in summer the city turns (somnolent) in the afternoon heat, when the law prescribes quiet hours. Kiosks lit by (fluorescent) tubes, selling everything from cigarettes to bus tickets, are (omnipresent), and so are stray cats.", "zh": "占全国人口三分之一以上的雅典，再次变得（充满活力）。这里的年轻人对危机岁月（漫不经心），对城市的混乱（满不在乎），这座城市（外向开朗的）文化带着富有感染力的（热情），溢满人行道和屋顶酒吧。按照他们的（习惯），雅典人吃晚饭很晚，常常在晚上十点以后；夏天的午后，城市在酷热中变得（昏昏欲睡），法律规定这段时间为安静时段。报亭用（荧光）灯管照明，从香烟到公交车票什么都卖，它们（无处不在），流浪猫也一样。"}, {"en": "Exarchia, a bohemian district near the Polytechnic, has long been a haunt of the (anarchist) left, though the police have cleared its squats and a metro station is being dug beneath its main square, to the fury of many locals. Graffiti covers walls in the (purlieu) around the Polytechnic, and gleaming new hotels can look (incongruent) beside (unkempt) streets around Omonia. Cars still (congest) the roads, though the metro, opened in 2000, has helped, and Thessaloniki finally opened its own metro in November 2024 after works were delayed for years by the discovery of Byzantine antiquities.", "zh": "埃克萨基亚是理工学院附近的一个波西米亚风格街区，长期以来一直是（无政府主义）左派的聚集地，不过警方已清理了那里被占用的空置建筑，一座地铁站也正在其主广场下方开挖，令许多当地人愤怒不已。理工学院周边（邻近街区）的墙面布满涂鸦，崭新闪亮的酒店与奥莫尼亚周边（脏乱不堪的）街道相比显得（格格不入）。汽车仍然让道路（拥堵），不过2000年开通的地铁有所帮助；塞萨洛尼基也终于在2024年11月开通了自己的地铁，此前工程因发现拜占庭时期的古迹而拖延多年。"}, {"en": "Modern sport has produced its own legends. In 2004 Greece, a 150-1 outsider, won the European football championship, beating Portugal 1-0 in the final in Lisbon; (jubilant) crowds filled the squares of Athens, and the country had reason to (exult) again that summer when it hosted the Olympics. In 2024 Olympiacos became the first Greek club to win a European football (tournament), the Conference League, and Panathinaikos won basketball's EuroLeague. Basketball fans are especially (ardent), and they idolize Giannis Antetokounmpo, the son of Nigerian immigrants, who sold trinkets on the streets of Athens as a boy before learning to (elbow) his way to two NBA most-valuable-player awards and a championship.", "zh": "现代体育也造就了自己的传奇。2004年，赔率为150比1的冷门球队希腊赢得了欧洲足球锦标赛，在里斯本的决赛中以1比0击败葡萄牙；（欢欣鼓舞的）人群涌上雅典的广场，同年夏天希腊主办奥运会时，这个国家又有理由（狂欢庆祝）了。2024年，奥林匹亚科斯成为第一支赢得欧洲足球（锦标赛），即欧洲协会联赛冠军的希腊俱乐部，帕纳辛奈科斯则赢得了篮球欧洲联赛冠军。篮球迷尤其（狂热），他们崇拜扬尼斯·阿德托昆博；这位尼日利亚移民的儿子，小时候曾在雅典街头叫卖小饰品，后来一路（用肘挤开）对手，赢得了两座NBA最有价值球员奖和一个总冠军。"}, {"en": "Greeks' feelings about Europe remain (ambivalent). They resent the humiliations of the bailout years, yet even at the height of the crisis polls showed large majorities wanting to keep the euro. Their interests are not always (congruent) with those of richer northern members, especially on migration, where Greece wants others to share the burden, and on Turkey. But public (sentiment) has shifted from despair to cautious pride, and Greece is trying to keep (abreast) of the euro area's best performers. The country that was once Europe's problem child is in (earnest) about being taken seriously.", "zh": "希腊人对欧洲的感情依然（矛盾）。他们对纾困年代的屈辱心怀不满，但即便在危机最严重的时候，民调也显示大多数人希望保留欧元。他们的利益与较富裕的北方成员国并不总是（一致），尤其是在移民问题上，希腊希望其他国家分担负担，在土耳其问题上也是如此。但公众（情绪）已从绝望转为谨慎的自豪，希腊正努力与欧元区表现最好的国家（并驾齐驱）。这个曾是欧洲问题儿童的国家，正（认真地）希望被人严肃对待。"}, {"en": "Can the recovery last? The (defeatist) view is that Greece has simply ridden a tourism boom and a flood of European money, and that shrinking cohorts, weak productivity and fragile institutions will (overshadow) the gains. The (optimist) case is more (cogent) than it was a decade ago: debt is falling fast, the budget is in surplus and voters have rewarded competence. Greece has proved (resilient) before, surviving occupation, civil war, dictatorship and near-bankruptcy. To (surmount) its next set of problems it will need to clean up its institutions as well as its accounts. The (apt) comparison is with Odysseus, whose real trials began only when he finally reached home. In a fitting (postscript) to the crisis years, Mr Tsipras called his memoir \"Ithaca\".", "zh": "复苏能持续吗？（失败主义的）观点认为，希腊只是搭上了旅游热潮和欧洲资金洪流的便车，不断缩小的人口队列、疲弱的生产率和脆弱的制度将（掩盖）这些成就。（乐观主义者）的理由则比十年前更有（说服力）：债务迅速下降，预算出现盈余，选民奖励了能干的治理。希腊此前已证明自己（坚韧），挺过了占领、内战、独裁和濒临破产。要（克服）下一系列问题，它需要清理的不仅是账目，还有制度。（恰当的）比喻是奥德修斯，他真正的考验在终于回到家乡时才开始。作为危机岁月的一个恰如其分的（后记），齐普拉斯把他的回忆录命名为《伊萨卡》。"}];
const HAS_TITLE = true;
const SUBTITLE_EN = "";
const SUBTITLE_ZH = "";

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  if (typeof SUBTITLE_EN !== 'undefined' && SUBTITLE_EN) {
    const sub = document.createElement('div');
    sub.className = 'book-subtitle';
    sub.textContent = SUBTITLE_EN;
    div.appendChild(sub);
  }
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  if (typeof SUBTITLE_ZH !== 'undefined' && SUBTITLE_ZH) {
    const subZh = document.createElement('div');
    subZh.className = 'zh-subtitle';
    subZh.textContent = SUBTITLE_ZH;
    div.appendChild(subZh);
  }
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
