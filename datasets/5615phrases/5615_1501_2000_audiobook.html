<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Price of Progress: Innovation, Speculation and Social Change — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  .book-subtitle {
    font-size: 1.02rem;
    color: var(--muted);
    font-style: italic;
    margin: 0 0 10px;
  }
  .zh-subtitle {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 0.92rem;
    margin-top: 6px;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>The Price of Progress: Innovation, Speculation and Social Change</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "The Price of Progress: Innovation, Speculation and Social Change", "zh": "进步的代价：创新、投机与社会变迁"}, {"en": "In the Netherlands, engineers spent centuries trying to (reverse) the advance of the sea. Storm surges could (inundate) settlements, and merchants had to (traverse) waterways despite (adverse) weather. A (floodgate) could protect a polder, while a medieval (fosse) served a different defensive purpose. Disasters sometimes left villages (desolate), forcing officials to (evacuate) families and sailors to (rescue) neighbors. Such events could (precipitate) political change. The Dutch response was not a victory over nature but a long history of bargaining with it.", "zh": "在荷兰，工程师花费数百年努力（扭转）海水侵入的趋势。风暴潮可能（淹没）聚落，商人仍须在（恶劣的）天气下（穿越）水道。（防洪闸）可以保护圩田，而中世纪的（护城壕沟）则承担另一种防御任务。灾害有时使村庄变得（荒凉），迫使官员组织家庭（撤离），水手则（营救）邻居。这类事件也可能（促成）政治变革。荷兰的应对并非战胜自然，而是长期与自然周旋的历史。"}, {"en": "Geography set the conditions of industrialization. A (concave) coastline provided shelter in some places; (granite) furnished building stone, while (bauxite) and (graphite) later served very different industries. Intense sunlight can (insolate) a slope and (desiccate) exposed soil. A (xerophyte) can survive where less hardy plants cannot; canals can (irrigate) fields, insects (pollinate) crops, and flowering plants (variegate) a landscape. Industrial history is therefore also a history of soils, minerals, plants and water.", "zh": "地理条件塑造了工业化的基础。某些（内凹的）海岸线提供避风港；（花岗岩）可用作建筑石材，（铝土矿）和（石墨）后来则服务于不同产业。强烈日光会（曝晒）山坡，并使裸露土壤（干燥枯竭）。（旱生植物）能在不耐旱植物无法生存的地方生长；运河可以（灌溉）田地，昆虫为作物（授粉），开花植物使景观（呈现斑斓色彩）。因此，工业史也是土壤、矿物、植物和水的历史。"}, {"en": "During the railway age, a commercial (magnate) could persuade a government to (designate) land for new tracks. A surveyor began with a blank (slate) and tried to (delineate) the route. Workers had to (excavate) cuttings, pour (concrete) in later construction and (corrugate) metal sheets for roofs. Engineers learned to (laminate) materials, (perforate) plates and calculate the (torque) acting on machinery. The railway was a financial promise, but its success also depended on these unromantic physical details.", "zh": "在铁路时代，商业（巨头）可能说服政府将土地（指定）为新线路用地。测量员从一张空白（板面）开始，努力（勾画）路线。工人须（开挖）路堑；在后来的工程中浇筑（混凝土），并把屋面金属板（压成波纹状）。工程师逐渐学会（层压）材料、为金属板（打孔），并计算机械受到的（扭矩）。铁路是金融承诺，但成功也依赖这些不浪漫的物理细节。"}, {"en": "Urban growth is neither automatic nor simple. Firms (aggregate) around transport hubs; wealth may (accrete) slowly, new industrial clusters can (nucleate), and neighborhoods (agglomerate) into a metropolis. A diversified (conglomerate) is not the same thing as a healthy city. Infrastructure is (intricate): pipes (aerate) water, fans (ventilate) buildings, walls (insulate) interiors, and controls (modulate) electricity demand. The benefits of growth depend on maintaining systems that stock-market charts barely depict.", "zh": "城市增长既非自动，也不简单。企业在交通枢纽周围（汇集）；财富可能缓慢（积聚），新的产业集群可以（成核形成），社区逐渐（聚合）为大都市。多元化（企业集团）并不等于健康的城市。基础设施（错综复杂）：管道为水（充气），风扇为建筑物（通风），墙体为室内（隔热），控制系统则（调节）电力需求。增长的收益取决于维护那些股价图表几乎不展示的系统。"}, {"en": "Infrastructure required access to the public (purse). Governments could (disburse) railway grants, (reimburse) eligible expenses or (underwrite) risky ventures. Critics called this (largesse); supporters described it as investment. A tax (rebate) might attract factories, while contracts (remunerate) advisers and compensation funds (compensate) displaced residents. Authorities tried to (consolidate) debts, but interest could still (accrue). Across countries and centuries, the argument was less about whether to spend than about who received the benefits and bore the risks.", "zh": "基础设施需要动用公共（财政资金）。政府可以（发放）铁路补助、（报销）合资格支出，或为高风险企业（承保）。批评者称之为（慷慨拨款），支持者则称其为投资。税收（退还）可能吸引工厂，合同（支付报酬）给顾问，补偿基金则（补偿）搬迁居民。政府试图（合并）债务，但利息仍会（累积）。跨越国家与世纪，争论的重点往往不是该不该花钱，而是谁受益、谁担风险。"}, {"en": "Representative government gave these choices a public arena. Every (candidate) could (nominate) a favored project; the (electorate) could listen to (debate), though genuine (discourse) required more than slogans. A budget (impasse) might delay construction. Even a strong electoral (mandate) did not abolish the need to (legislate) carefully: a single (clause) in a (statute) could redirect enormous sums. Legal language mattered because it translated political enthusiasm into enforceable duties.", "zh": "代议制政府为这些抉择提供公共舞台。每位（候选人）都可以（提名提出）偏爱的工程；（选民）可以聆听（辩论），但真正的（公共讨论）不能只有口号。预算（僵局）可能推迟施工。即使拥有强大的选举（授权），仍须谨慎（立法）：一部（成文法）中的单个（条款）便可能改变巨额资金的流向。法律语言至关重要，因为它把政治热情转化为可执行的义务。"}, {"en": "Industrial cities organized everyday life around supply. A (warehouse) held a (crate) of machine parts or grain; railways (distribute) goods, while workers (commute) from expanding suburbs. Housing had to (accommodate) migrants, money had to (circulate), and reformers liked to (perambulate) crowded districts to inspect conditions. A busy port resembled a (hive) of activity. Telegraph wires began to (concatenate) distant messages into a more connected economy. Efficiency expanded, although comfort and safety did not improve equally for everyone.", "zh": "工业城市围绕供应组织日常生活。（仓库）存放装有零件或谷物的（木箱）；铁路（配送）货物，工人从不断扩展的郊区（通勤）。住房须（容纳）移民，货币须（流通），改革者喜欢（徒步巡查）拥挤街区，了解居住条件。繁忙港口仿佛一个活动密集的（蜂巢）。电报线路开始把远方消息（串接）进联系更紧密的经济体系。效率提高了，但舒适与安全并未让所有人平等受益。"}, {"en": "The nineteenth-century railway boom showed how quickly confidence could turn into a desire to (speculate). Promoters would (extrapolate) recent traffic growth and (interpolate) estimates where records were thin. Optimism helped (inflate) valuations. A supposed (inverse) relationship between risk and public enthusiasm was no reliable rule. A commemorative medal might bear a locomotive on its (obverse), yet even impressive railways possessed (finite) capital and (definite) liabilities. Careful investors tried to (differentiate) earnings from projections; excited prospectuses tended to (understate) uncertainty.", "zh": "十九世纪的铁路热潮显示，信心会多么迅速地转为（投机）欲望。推销者（外推）近期客运增长，并在记录不足时（插入估计）数字。乐观情绪推高了估值，使其（膨胀）。风险与公众热情之间所谓（反向的）关系，并非可靠规律。纪念章的（正面）可能刻着火车头，但再宏伟的铁路也拥有（有限的）资金与（明确的）负债。谨慎投资者尝试（区分）收益与预测；热情洋溢的招股书则倾向于（淡化）不确定性。"}, {"en": "The rise of corporate research transformed invention. Universities helped (incubate) ideas; founders learned to (incorporate) firms, (initiate) experiments and (affiliate) with laboratories. Competitors tried to (emulate) successful designs. Patents and enterprises began to (proliferate), while a few large companies came to (predominate) in certain industries. They could (accumulate) capital, (concentrate) expertise and (propagate) technical standards. Scale brought efficiencies, but it also raised enduring questions about monopoly and access.", "zh": "企业研究的发展改变了发明方式。大学帮助（孵化）创意；创办者学会（注册成立）企业、（启动）实验，并与实验室（建立合作联系）。竞争者试图（效仿）成功设计。专利与企业开始（激增），少数大公司逐渐在某些行业（占据主导）。它们可以（积累）资本、（集中）专业知识，并（推广传播）技术标准。规模带来效率，也引发有关垄断与准入的长期问题。"}, {"en": "Financial manias have always carried a social attraction. Shares can (captivate) the public, charismatic promoters (fascinate) journalists, and sudden riches (infatuate) inexperienced buyers. Success can (intoxicate) even a cautious investor, just as champagne can (inebriate) guests who (carouse) after a listing. The extravagant (sybarite) makes a tempting magazine subject. Some commentators (adulate) winners, while speculators (dote) on stories of effortless wealth and overlook (profligate) expenditure. The spectacle is familiar from railway shares to internet stocks.", "zh": "金融狂热始终具有社交吸引力。股票可以（迷住）公众，富有魅力的推销者会令记者（着迷），骤然暴富的故事使缺乏经验的买家（迷恋）。成功可能让谨慎的投资者也（陶醉），就像香槟会令上市庆功宴上（狂欢）的宾客（酩酊大醉）。奢华的（享乐主义者）很容易成为杂志人物。有些评论员（吹捧）赢家，投机者则（偏爱）轻松致富的故事，忽视（挥霍无度的）开支。从铁路股票到互联网股票，这幅景象屡见不鲜。"}, {"en": "Education slowly widened participation in economic life. More students could (matriculate) at universities, and an inspiring (pedagogue) might welcome a (neophyte) rather than reserve attention for an established (acolyte). Campaigns to make adults (literate) confronted societies with long (preliterate) traditions. Teachers hoped to (inculcate) curiosity, while immigrant children often faced pressure to (assimilate). Examiners had to (invigilate) tests, but success could not be measured merely by learning facts by (rote). The central question was whether schools produced independent judgment.", "zh": "教育逐渐扩大了人们参与经济生活的机会。更多学生能够（正式入学）大学，优秀（教育家）可能欢迎（新手），而非只关照资深（追随者）。成人（识字）运动面对的是拥有悠久（文字出现以前的）传统的社会。教师希望（培养）好奇心，移民子女却常常承受（同化融入）的压力。考官必须（监考），但教育成果不能只凭（死记硬背）事实来衡量。核心问题在于学校能否培养独立判断。"}, {"en": "Art offered another record of industrial change. A poet wrote a (verse) about smoke and steam, perhaps making neighboring words (alliterate). An (eclogue) might celebrate the countryside threatened by factories; an opera's (prologue) and (epilogue) could frame the same conflict. A worker's (monologue) revealed experience absent from official reports. Music halls performed a (revue) or a (burlesque), while architects borrowed (baroque) ornament and an (arabesque) motif. The arts did not speak with one voice: they could celebrate machinery and mourn what it displaced.", "zh": "艺术提供了工业变革的另一种记录。诗人写下一段描写烟尘与蒸汽的（诗句），或让相邻词语形成（头韵）。一首（田园诗）可能赞颂受到工厂威胁的乡村；歌剧的（序幕）与（尾声）也可能围绕同样的冲突展开。工人的（独白）揭示官方报告里缺席的体验。音乐厅表演（歌舞杂演）或（滑稽讽刺剧），建筑师借用（巴洛克式）装饰和（蔓藤纹样）。艺术并非只有一种声音：它既能歌颂机器，也能哀悼被机器取代的事物。"}, {"en": "Museums preserve evidence that official celebrations omit. An (archive) can hold a worker's letter beside a director's (anecdote); an (aesthete) studies design, while a (cineaste) examines early film. An (antique) instrument may stand beneath a small (plaque). Each artifact is (unique), but uniqueness is not immunity from (critique). A (dilettante) may merely (decorate) a gallery with fashionable objects; a careful curator asks whose labor, wealth and suffering made the objects possible.", "zh": "博物馆保存着官方庆典常常遗漏的证据。（档案馆）可以把工人来信与主管的（轶事）并置；（审美家）研究设计，（电影鉴赏家）研究早期影片。一件（古董）仪器可能陈列在小小的（说明牌）下。每件文物都（独一无二），但独特并不能使它免受（批评）。（浅尝辄止的爱好者）也许只用时髦物件（装饰）展厅；认真的策展人则追问物件背后的劳动、财富与苦难。"}, {"en": "Religious life also changed as populations moved. A (mosque) could stand near churches and synagogues in an industrial port. Religious leaders might meet in (conclave), debate a public (rite), or defend a (celibate) and (chaste) vocation. An (apostate) might reject established teachings; communities would (consecrate) new buildings and protest plans that would (desecrate) graves. To (venerate) an ancestor is not necessarily to (propitiate) a deity. Religious history resists easy simplification because public worship, personal conscience and political power intersect.", "zh": "随着人口迁移，宗教生活也发生变化。工业港口中的（清真寺）可能与教堂、犹太会堂相邻。宗教领袖可能举行（秘密会议），讨论公共（仪式），或维护（独身）与（贞洁的）修行道路。（背教者）可能拒绝既定教义；社群会为新建筑（祝圣），也会反对（亵渎）墓地的计划。（敬奉）祖先不一定等于（安抚取悦）神明。宗教史难以简单概括，因为公共礼拜、个人良知和政治权力彼此交织。"}, {"en": "Public medicine changed survival itself. A premature (neonate) now receives care that earlier generations could scarcely imagine. A fetus must (gestate), but after birth clinicians can (inoculate) against some diseases, (vaccinate) populations and (medicate) patients. Viruses (mutate), and experiments on a (primate) raise distinct ethical questions. A microscopic (ciliate) is not a virus; radiation can (irradiate) tissue, and physicians sometimes (transfuse) blood. The vocabulary is technical because the biological distinctions matter.", "zh": "公共医学改变了人类生存的可能性。早产（新生儿）如今获得的护理，是以往世代难以想象的。胎儿需要在子宫中（孕育），出生后临床人员可以为某些疾病（接种预防）、对人群（接种疫苗），并为患者（用药治疗）。病毒会（变异），对（灵长类动物）的实验则产生不同的伦理问题。显微镜下的（纤毛虫）不是病毒；辐射可以（照射）组织，医生有时还须（输血）。这些术语之所以精细，是因为生物学差异确实重要。"}, {"en": "Genetics raised questions beyond treatment. Humans (procreate), but reproduction does not make every trait inevitable. Two (cognate) words may share an origin, just as relatives share ancestry, yet language and genes follow different rules. Some abilities appear (innate); others emerge from an (inchoate) process of learning. Religious traditions describe the divine as (incarnate) or discuss being (reincarnate), beliefs distinct from laboratory claims. It is (intimate) family life that reproductive law seeks to protect, distinguishing (legitimate) arrangements from practices judged (illegitimate). Good policy requires (dispassionate) analysis without denying emotion.", "zh": "遗传学提出了超越治疗的问题。人类会（繁衍后代），但生殖并不意味着每种性状都不可避免。两个（同源的）词可能共享词源，如同亲属共享祖先，但语言与基因遵循不同规则。有些能力似乎是（天生的），其他能力则源于尚未定型的（初始发展）学习过程。宗教传统可能描写神灵（化身为人）或讨论（转世），这些信仰不同于实验室主张。生殖法所试图保护的是（私密的）家庭生活，并区分（合法的）安排和被认定为（不合法的）做法。良好政策需要（不偏不倚的）分析，但不应否认情感。"}, {"en": "Agriculture shows both the achievement and cost of intervention. Farmers learned to (domesticate) species, encourage seeds to (germinate) and (cultivate) larger harvests. They might (fumigate) storage rooms or (defoliate) plants, attempting to (eradicate) disease and (exterminate) pests. Yet organisms can (pullulate) after their predators disappear. When land becomes unproductive, families may be left to (vegetate) in poverty. Modern agronomy therefore asks not only what chemicals kill, but what ecosystems require to recover.", "zh": "农业展示了人为干预的成就与代价。农民学会（驯化）物种、促进种子（萌发），并（栽培）更多收成。他们可能（熏蒸消毒）仓房或让植物（落叶处理），试图（根除）疾病并（消灭）害虫。然而，捕食者消失后，某些生物可能（大量滋生）。当土地失去产出能力，家庭可能只能在贫困中（无所事事地苟活）。因此，现代农学不仅追问哪些化学品能杀灭害虫，也追问生态系统如何恢复。"}, {"en": "Water science connects city and countryside. Rain can (percolate) through gravel and (permeate) porous rock. Irrigation helps (hydrate) crops but excessive pumping can (dehydrate) soils. Plants make (carbohydrate) compounds, glands (secrete) fluids, and animals (excrete) wastes. Floods can (saturate) fields, while proteins in blood can (coagulate); sediments may (striate) a rock surface. Such processes operate at different scales, yet each reminds engineers that natural systems seldom follow a tidy financial spreadsheet.", "zh": "水科学连接城市与乡村。雨水可以穿过砾石（渗滤），也可以（渗透）多孔岩石。灌溉帮助作物（补水），但过量抽水会使土壤（脱水）。植物制造（碳水化合物）类物质，腺体（分泌）液体，动物则（排泄）废物。洪水会让田地（水分饱和），血液中的蛋白质可以（凝固），沉积物可能在岩面（形成条纹）。这些过程发生在不同尺度，却都提醒工程师：自然系统很少遵循整洁的财务表格。"}, {"en": "The scientific method is also a discipline of explanation. Researchers try to (elucidate) a mechanism and (explicate) a difficult paper; editors (annotate) datasets. Experiments must (iterate), and scientists may (reiterate) a warning when findings are misunderstood. A theorist can (postulate) a cause, but evidence must (substantiate) it. Specialists must (articulate) uncertainties, (recapitulate) their conclusions and (communicate) with the public. Progress requires more than brilliant results: it requires a way for others to inspect them.", "zh": "科学方法也是解释的纪律。研究者努力（阐明）机制、（详尽解释）难懂的论文，编辑为数据集（添加注释）。实验必须（反复迭代）；当发现被误解时，科学家可能（重申）警告。理论家可以（假定提出）原因，但证据必须（证实）它。专家须（清晰表达）不确定性、（概述重述）结论，并与公众（沟通）。进步不只需要出色成果，还需要让他人检验成果的方法。"}, {"en": "Artificial intelligence has made old problems of evidence newly urgent. Software can (impersonate) a person, simulate how people (emote), and seem to (relate) to a user. A model may (equivocate) rather than admit ignorance, or (obfuscate) an error with fluent prose. People can (misperceive) confidence as accuracy and (conflate) prediction with understanding. A chart may (indicate) a trend without allowing anyone to (prognosticate) reliably. Whether safeguards are (adequate) is therefore a question for public scrutiny, not advertising alone.", "zh": "人工智能令古老的证据问题再次紧迫。软件可以（冒充）他人，模拟人类如何（表达情绪），并看起来能够与用户（建立联系）。模型可能（含糊其词）而不承认无知，或用流畅文字（掩盖）错误。人们可能（误认为）自信就是准确，也可能（混为一谈）预测与理解。图表可以（显示）趋势，却不一定让人可靠地（预测未来）。因此，保障措施是否（充分），需要接受公众审查，而不能只听广告宣传。"}, {"en": "Skeptics are not invariably (averse) to progress. In (diverse) societies people must (converse), even when incentives create (perverse) outcomes. Courts provide (recourse), while negotiators need (finesse). Some reformers (espouse) public ownership; others (muse) about private experimentation. Technical arguments may be (abstruse), but the (hypotenuse) of a right triangle is no more mysterious because the term is specialized. The real test of expertise is whether it makes complex choices clearer to those who will live with the consequences.", "zh": "怀疑者并不总是（反对）进步。在（多元的）社会，人们必须（交谈），即使激励机制产生（反常的）后果。法院提供（法律救济），谈判者则需要（圆熟技巧）。一些改革者（拥护）公有制，另一些人（沉思）私人试验的可能性。技术争论可能（晦涩难懂），但直角三角形的（斜边）并不会因为术语专业就变得更加神秘。专业能力的真正考验，是能否让承担后果的人更清楚地理解复杂抉择。"}, {"en": "The history of protest includes ordinary complaints as well as famous speeches. Residents (grouse) about prices; a solitary (recluse) can still (browse) public records and uncover wrongdoing. Witnesses may offer (profuse) detail; reports (diffuse) through a neighborhood and (infuse) debate with evidence. A polite critic may (deprecate) extravagant promises, hoping to (disabuse) listeners of false certainty. Other campaigners openly (advocate) reform and (demonstrate) in the street. Disagreement is not a failure of modern society but one of its means of correction.", "zh": "抗议史既包括日常抱怨，也包括著名演讲。居民会对物价（发牢骚）；一位独处的（隐士）仍能（查阅浏览）公共记录，揭露不当行为。证人可能提供（大量的）细节；报道在社区（传播），为辩论（注入）证据。温和的批评者可能（委婉批评）夸张承诺，希望（纠正）听众错误的确信。其他活动人士公开（主张）改革，并上街（示威）。分歧不是现代社会的失败，而是它自我纠错的方法之一。"}, {"en": "Scandals reveal how trust can break down. A (posse) of investigators might (accuse) a contractor of fraud, while officials try to (defuse) public anger. A clever (ruse) can hide missing funds; a witness may (prevaricate), and documents may (implicate) senior managers. To (defalcate) is to misappropriate entrusted money; to (peculate) is to steal public funds. A suspect may (dissimulate) innocence while allies (insinuate) that critics are politically motivated. None of these allegations should substitute for proof.", "zh": "丑闻揭示信任如何瓦解。一队（调查人员）可能（指控）承包商欺诈，官员则试图（缓和）公众愤怒。狡猾的（诡计）能够掩盖资金缺口；证人可能（闪烁其词），文件也可能（牵连）高级管理者。（侵吞受托资金）指挪用受托保管的款项；（侵吞公款）特指窃取公共资金。嫌疑人可能（掩饰）真实意图，盟友则（暗示）批评者出于政治动机。这些指控都不能取代证据。"}, {"en": "Courts must (adjudicate) charges rather than simply (arbitrate) public passions. Evidence can (inculpate) a defendant or (exculpate) one; a judgment may (exonerate) the wrongly accused. To (calumniate) a person is to slander them, while independent testimony may (corroborate) a claim and (vindicate) a whistleblower. A prosecutor may (denunciate) corruption in a public address, but even a notorious (reprobate) deserves due process. Legal restraint protects the innocent precisely when public anger is strongest.", "zh": "法院必须（裁决）指控，而不能只（仲裁）公众情绪。证据可以（证明有罪）或（证明无罪）；判决可能（洗清）遭误控者的罪名。（恶意诽谤）一个人意味着污蔑，而独立证词可能（佐证）主张，并（证明）举报者是正确的。检察官可以在公开讲话中（严厉谴责）腐败，但即使声名狼藉的（无赖）也应得到正当程序保障。法律克制在公众最愤怒时尤其能保护无辜者。"}, {"en": "Political history repeatedly warns against leaders who (arrogate) authority while institutions (abdicate) oversight. Imperial systems could (subjugate) populations; factions might (instigate) unrest and (castigate) opponents. Protesters could (fulminate) against abuses, governments (repudiate) promises, and security forces (retaliate). Legislatures sometimes (abrogate) old laws or (derogate) from ordinary protections during emergencies. Such verbs describe distinct actions, not interchangeable accusations. A sound account asks which action actually occurred, where, and under whose authority.", "zh": "政治史反复警示：领导人可能（僭取）权力，而制度机构却（放弃）监督。帝国体系可能（征服压制）人口；派系可能（煽动）骚乱并（严厉斥责）对手。抗议者可能（猛烈抨击）滥权，政府可能（否认并抛弃）承诺，安全部队可能（报复）。立法机关有时（废止）旧法，或在紧急状态下（减损）通常的保障。这些动词描述不同的行为，不能互作指控。严谨的历史叙述须追问究竟发生了什么、在何处发生、由谁授权。"}, {"en": "Public debate can become theatre. Commentators (pontificate), statesmen (enunciate) principles, and a (demagogue) may (harangue) a crowd. A parliament may (prorogue) a session, (instate) a new procedure or allow an executive to (dictate) policy. Administrators must (demarcate) jurisdictions and decide which questions to (relegate) to agencies. Yet (inordinate) personal ambition can overwhelm careful constitutional design. Institutional details matter more than the volume of applause.", "zh": "公共辩论可能变成戏剧。评论员（居高临下地说教），政治家（清楚阐述）原则，而（煽动家）可能向人群（长篇激烈训斥）。议会可能（休会）、（确立实施）新程序，或允许行政机关（强令决定）政策。行政管理者必须（划定）管辖边界，并决定将哪些事项（移交降级处理）给机构。然而，（过度的）个人野心可能压倒精心设计的宪政制度。制度细节比掌声大小更重要。"}, {"en": "Reform works through compromises that are rarely dramatic. Authorities (promulgate) rules and (stipulate) reporting duties; supervisors (regulate) lenders while independent figures (mediate) disagreements. Governments try to (conciliate) rivals, asking both sides to (reciprocate) concessions. A critic may (expostulate) against weak safeguards, and policymakers must (mitigate) foreseeable harm. No rule can (obviate) every crisis, nor does public service require complete (abnegate) of private interest. It does require open acknowledgment of trade-offs.", "zh": "改革依赖往往并不戏剧化的妥协。当局（颁布）规则并（明确规定）报告义务；监管者（监管）贷款机构，独立人士则（调解）分歧。政府试图（安抚调和）对立方，要求双方（相互回报）让步。批评者可能（严词规劝反对）薄弱保障，决策者必须（减轻）可预见的伤害。任何规则都不能（消除）所有危机，公共服务也不要求彻底（舍弃）私人利益，但要求公开承认取舍。"}, {"en": "The crises of 1929 and 2008 revealed the speed of financial contagion. Investors rushed to (liquidate) holdings; assets (depreciate), courts could (sequestrate) disputed property, and crimes might lead courts to (incarcerate) officials—though punishment was uneven. Critics went on to (excoriate) regulators; inflammatory rhetoric could (incite) panic. Bad debts began to (infiltrate) balance sheets, prices continued to (fluctuate), defaults could (decimate) industries, and confidence continued to (deteriorate). No single verb captures the whole process: liquidity, solvency, fear and political choice interacted.", "zh": "1929年与2008年的危机揭示了金融传染的速度。投资者争相（清算）资产；资产会（贬值），法院可以（扣押保管）争议财产，犯罪有时导致官员被（监禁），尽管惩罚并不均衡。批评者（严厉抨击）监管者；煽动性言辞可能（激起）恐慌。坏账（渗入）资产负债表，价格继续（波动），行业遭到（重创），信心不断（恶化）。单一动词无法概括整个过程：流动性、偿付能力、恐惧与政治选择相互作用。"}, {"en": "After a crash, the battle over language begins. Executives may (expurgate) records, political organizations can (indoctrinate) followers, and competing factions (denigrate) opponents. Columnists (vituperate) or (lambaste) those they blame. Officials may (overstate) the recovery and (extenuate) their own errors, while investigators (impute) responsibility or (attribute) losses to a particular decision. Television guests sometimes merely (prate). A historian's task is to distinguish evidence from self-protection, not to reward whoever uses the strongest adjective.", "zh": "崩盘之后，语言之争随即开始。高管可能（删去）记录中的不利内容，政治组织可能（灌输教条）给追随者，敌对派系则（贬损）对手。专栏作者（恶言痛斥）或（猛烈批评）他们认定的责任人。官员可能（夸大）复苏成果，并（减轻解释）自身错误；调查者则（归责）责任或将损失（归因）于特定决定。电视嘉宾有时只是（空谈）。历史学家的职责是把证据与自我辩护区分开，而不是奖励形容词最激烈的一方。"}, {"en": "Governments confronting emergencies often (oscillate) between intervention and restraint. Ministers (vacillate), parties (bifurcate) over budgets, and supply shocks (dislocate) markets. Overlapping institutions (complicate) a response; delays (exacerbate) suffering. Graphic reports may (nauseate) viewers, contradictory instructions (discombobulate) households, and failures (infuriate) survivors. Fear can make a witness's heart (palpitate). Good emergency management cannot abolish uncertainty, but clear decisions and honest communication can reduce avoidable confusion.", "zh": "面对紧急情况，政府常在干预与克制之间（摇摆）。部长可能（犹豫不决），政党可能因预算而（分裂为两派），供应冲击使市场（错位失序）。机构职权重叠会（增加复杂性）；拖延会（加剧）苦难。触目惊心的报道可能令观众（恶心），相互矛盾的指示令家庭（不知所措），失败则使幸存者（愤怒）。恐惧会让证人的心脏（怦怦跳动）。良好的应急管理不能消除不确定性，但明确决策和诚实沟通可以减少可避免的混乱。"}, {"en": "Medicine during disasters requires (delicate) judgment. Clinicians may (sedate) a frightened patient or treat someone whose illness threatens to (emaciate) them so severely that even routine procedures become dangerous. Injuries can (excruciate) the sufferer; care sometimes aims to (palliate) pain with an (opiate) and (alleviate) distress rather than cure disease. Smoke can (asphyxiate) victims, crush injuries may require surgeons to (amputate), and emergency teams attempt to (resuscitate) people whose hearts have stopped. These decisions are practical and ethical, not merely technical.", "zh": "灾害中的医疗需要（审慎细致的）判断。临床人员可能给惊恐患者（镇静），或治疗（极度消瘦的）病人，以至于常规操作也可能危险。损伤可能使患者（痛苦万分）；护理有时旨在用（阿片类镇痛药）（缓解性治疗）疼痛并（减轻）不适，而非治愈疾病。烟雾可能使受害者（窒息），挤压伤可能需要外科医生（截肢），急救人员则尝试（复苏）心脏骤停者。这些决策既实际又涉及伦理，并非纯粹技术问题。"}, {"en": "Catastrophe can (bereave) families who continue to (grieve) for decades. Neighbors (commiserate), volunteers act from (passionate) conviction, and caregivers show (compassionate) patience. Some survivors seek to (expiate) perceived mistakes; others (renunciate) old loyalties or (supplicate) authorities for answers. History records people who (immolate) themselves in political protest, but such deaths should never be romanticized. To (execrate) injustice is understandable; to make suffering into spectacle is another injury.", "zh": "灾难可能使家庭（失去亲人），让他们此后数十年仍（悲伤）。邻居（表达同情），志愿者出于（热切的）信念行动，照护者展现（富有同情心的）耐心。有些幸存者试图（赎偿）自己认定的错误，另一些人（公开放弃）旧有忠诚，或（恳求）当局给出答案。历史记录了以（自焚）进行政治抗议的人，但绝不应将这种死亡浪漫化。（痛恨诅咒）不公可以理解；把苦难变成景观则是另一种伤害。"}, {"en": "Rebuilding depends on materials science as much as moral resolve. Crews (lubricate) bearings; arcs can (coruscate) when electrical contacts fail; corrosion may (maculate) a surface. Technicians (serrate) an edge for cutting, move (inanimate) objects, and use heat to (sublimate) certain substances. Sensors (actuate) valves, insulation can (attenuate) noise, switches (deactivate) damaged machinery, and public agencies (renovate) old structures. The ordinary verbs of maintenance describe the labor that makes ambitious plans durable.", "zh": "重建既依赖道德决心，也依赖材料科学。工人给轴承（润滑）；电接触不良时，电弧可能（闪烁）；腐蚀会（弄脏斑驳）表面。技术人员把边缘（加工成锯齿状）以便切割，搬运（无生命的）物件，并利用热使某些物质（升华）。传感器（驱动）阀门，隔音层可以（减弱）噪音，开关（关闭停用）受损机器，公共机构则（翻新）旧建筑。维护工作中的普通动词，描述了让宏伟计划得以持久的劳动。"}, {"en": "Migration has accompanied every industrial transition. States sometimes (repatriate) citizens, while an (expatriate) may choose to (emigrate) permanently. Forced removal can (deracinate) a family and (alienate) its children. Borders (separate) communities whose experiences remain (disparate); new arrivals (associate) with neighbors, or (dissociate) themselves from earlier ties. It may take years to (acclimate) to a new language and labor market. Statistics count movement more easily than they measure the loss of belonging.", "zh": "人口迁移伴随每次工业转型。国家有时（遣返）本国公民，（侨居国外者）也可能选择永久（移居国外）。强制搬迁能够（连根拔起）一个家庭的生活，使其子女感到（疏离）。国界（分隔）经历依旧（迥异的）社群；新来者与邻居（交往结社），或（脱离）旧有联系。人们可能需要多年才能（适应）新语言和就业市场。统计更容易记录移动人数，却难以衡量归属感的丧失。"}, {"en": "Land reform poses hard questions about rights. Officials may (appropriate) funds for public works or (expropriate) property under law. Reformers aim to (emancipate) disadvantaged groups and ask businesses to (cooperate). A (corporate) charter does not replace the need to (institute) fair procedures. Citizens (constitute) a political community and may (reconstitute) public bodies after a crisis; leaders can (depute) responsibilities to specialists, but people still (dispute) outcomes. Legality and legitimacy are related, not identical.", "zh": "土地改革提出艰难的权利问题。官员可能为公共工程（拨用）资金，或依法（征收）财产。改革者致力于（解放）弱势群体，并要求企业（合作）。（公司制的）章程不能取代（建立）公平程序的必要性。公民（构成）政治共同体，也可能在危机后（重新组建）公共机构；领导人可以将职责（委派）给专家，但民众仍会（质疑争论）结果。合法性与正当性相关，却并不相同。"}, {"en": "Successful reform must (encapsulate) lessons without treating the past as a blueprint. Agencies may (amalgamate) divisions, (integrate) services or watch fragile institutions (disintegrate). Investment can (rejuvenate) a district, workers (recuperate) after injury, and clinics (rehabilitate) patients. Education may (invigorate) a region and sanitation (ameliorate) living conditions. Yet corruption can (vitiate) even an admirable program. Institutions succeed not through slogans but through repeated, observable improvements.", "zh": "成功的改革必须（概括凝练）教训，而不是把过去当成施工蓝图。机构可以（合并）部门、（整合）服务，也可能眼看脆弱制度（瓦解）。投资能够（使地区恢复活力），工人在受伤后（康复休养），诊所则（帮助患者康复）。教育可能（振兴）一个地区，卫生设施可以（改善）生活条件。然而腐败可以（败坏）再值得称赞的项目。制度的成功依靠反复可观察的改进，而非口号。"}, {"en": "The vocabulary of prejudice deserves scrutiny. A worker called (insubordinate) may simply be reporting danger; dismissing courage as (effeminate) reproduces an old stereotype. Schools can (disseminate) knowledge or (discriminate) against pupils. Rules should (eliminate) abuses, not merely (denominate) them differently. When powerful interests (dominate), (insensate) cruelty and (obdurate) resistance can leave the public (irate). Choosing accurate words is part of describing unequal power honestly.", "zh": "偏见的词汇值得仔细审视。被称为（不服从命令的）工人，可能只是在报告危险；把勇气贬为（女性化而软弱的）行为，则复制旧有刻板印象。学校能够（传播）知识，也可能（歧视）学生。规则应当（消除）滥用，而非仅仅换一种说法（命名）它。当强大利益集团（支配）局面，（麻木无情的）残酷和（顽固不化的）抵抗会使公众（愤怒）。准确选词是诚实描绘权力不平等的一部分。"}, {"en": "Investigations often turn on chronology. A document may (antedate) a contract; conspirators could (connive) to conceal a transfer. An (intestate) estate raises questions about inheritance, and lawyers may (indite) formal accusations. A court can grant a (reprieve), regulators sometimes (waive) requirements, and a permit may be (requisite) even when a prior inspection is a (prerequisite). Powerful officials may enjoy a (perquisite) unavailable to others. Justice that arrives years (overdue) still matters, but delay changes what can be repaired.", "zh": "调查往往取决于时间顺序。一份文件的日期可能（早于）合同；共谋者可能（暗中串通）掩盖转账。（未留遗嘱而去世的）人的遗产引发继承问题，律师可能（拟写）正式指控。法院可以给予（缓刑暂缓执行），监管者有时（豁免）要求；某种许可可能是（必需的），而先行检查又是（先决条件）。权势人物可能享有旁人得不到的（职务额外待遇）。迟来多年的（早该到来的）正义仍有意义，但延误改变了可以弥补的范围。"}, {"en": "Scholars continue to (lucubrate) over the Industrial Revolution, (meditate) on its costs and (ruminate) on alternatives. Economists (cogitate) about incentives and sometimes (excogitate) new models. Legislators (deliberate) over evidence; historians (expatiate) on disputed episodes and occasionally (divagate) into colorful detail. Archives (illuminate) known events and (adumbrate) larger patterns. Such inquiry does not produce one final verdict. Its virtue is the ability to revise conclusions when new evidence appears.", "zh": "学者不断（埋头钻研）工业革命，（深思）其代价，并（反复思索）其他可能路径。经济学家（认真考虑）激励机制，有时（构思创造）新模型。立法者围绕证据（审议）；历史学家（详谈）有争议的事件，偶尔也（离题漫谈）生动细节。档案既（照亮阐明）已知事件，也（勾勒暗示）更大的模式。这种研究不会产生唯一终局判决，其价值在于新证据出现时能够修改结论。"}, {"en": "Measurement can (negate) a popular claim or (potentiate) a neglected warning. One factor may (preponderate) in a specific case, but analysts should not (equate) correlation with causation. They (approximate) missing values and identify the (proximate) cause rather than assume the last, (penultimate) warning explains everything. A (consummate) analyst admits when an effect remains (indeterminate). The precision of a forecast should be (commensurate) with the quality of its evidence. Exact-looking figures are not automatically exact knowledge.", "zh": "测量结果可以（否定）流行主张，也可以（增强）遭忽视的警告。某个因素可能在特定案例中（占据主导），但分析者不应把相关性（等同于）因果性。他们（估算）缺失值，识别（最直接的）原因，而不是认定倒数第二次、也就是（倒数第二的）警告解释了一切。（技艺精湛的）分析师承认有些效应仍（无法确定）。预测的精确程度应与证据质量（相称）。看起来精确的数字并不自动等于确切知识。"}, {"en": "Modern energy infrastructure creates new dangers. An overheated cell may (detonate) or (ignite) nearby material; a fire can (incinerate) equipment and (lacerate) those exposed to flying debris. Toxic exposure can (ulcerate) tissue, and an explosion may (eviscerate) a building's interior. An (acute) shortage of power can (deplete) emergency reserves, leaving hazardous (residue) after the flames (dissipate). These risks do not invalidate electrification; they explain why engineering standards and emergency planning must evolve with it.", "zh": "现代能源基础设施带来新的危险。过热电池可能（爆炸）或（点燃）附近材料；火灾可能（烧毁）设备，飞溅碎片则可能（撕裂伤害）人员。有毒物质接触可能使组织（溃烂），爆炸可能（掏空摧毁）建筑内部。（严重急性的）电力短缺会（耗尽）应急储备，火焰（消散）后仍留下有害（残留物）。这些风险并不否定电气化，却说明工程标准与应急规划必须同步演进。"}, {"en": "Corporate failure invites competing strategies. Excessive caution may (emasculate) a management team, while a distressed company may (capitulate) to creditors. Negotiations can reach a (stalemate). Directors may (deviate) from plans, seek an (alternate) lender, or (procrastinate) over restructuring. An (inveterate) gambler is unlikely to become prudent merely because a warning is issued; an (unregenerate) promoter may still speak like a (potentate). Public rescues should not (perpetuate) incentives that encouraged reckless behavior in the first place.", "zh": "企业失败会引发不同的应对策略。过度谨慎可能（削弱）管理团队，困境公司可能向债权人（屈服）。谈判可能陷入（僵局）。董事可能（偏离）计划、寻找（替代的）贷款机构，或在重组问题上（拖延）。（积习难改的）赌徒不太可能仅因警告便谨慎起来；（不知悔改的）推销者仍可能像（权贵统治者）一样讲话。公共救助不应（使之永久延续）最初鼓励冒险行为的激励机制。"}, {"en": "The poor often experience crises through basic routines. Relief kitchens may (souse) stale bread in broth so that patients can (masticate) it. Society sometimes chooses to (flagellate) people who become (destitute), although unemployment and illness have structural causes that are easy to (underrate). Hunger can (enervate) workers and disease (debilitate) children. Officials may (placate) anger with promises, but durable support must (endue) families with real capacity to recover. A (hirsute) face or worn coat tells nothing about a person's worth.", "zh": "穷人往往通过基本生活习惯体验危机。救济厨房可能把干面包（浸泡）在肉汤里，方便病人（咀嚼）。社会有时（严厉鞭挞责难）变得（赤贫的）人，尽管失业与疾病具有容易被（低估）的结构性原因。饥饿会使工人（精疲力竭），疾病会（削弱）儿童体力。官员可能以承诺（安抚）愤怒，但持久援助必须（赋予）家庭真正恢复生活的能力。（多毛的）面孔或破旧外套都不能说明一个人的价值。"}, {"en": "Social divisions can outlive a crisis. A rigid (caste) hierarchy may preserve inherited privilege, while an (effete) ruling class clings to (obsolete) rituals. The homes of elites remain (replete) with luxuries: (svelte) fashions, (exquisite) porcelain and elaborate (etiquette). Public festivals may be less exclusive. At a neighborhood (barbecue), cooks (baste) food, speakers pay (tribute) to volunteers, and families (commemorate) those who were lost. Common rituals do not erase inequality, but they can express obligations beyond wealth.", "zh": "社会分层可能比危机存续更久。僵硬的（种姓等级）结构可能保留世袭特权，而（衰弱颓靡的）统治阶层仍坚持（过时的）仪式。精英住宅里依旧（充满）奢侈品：（苗条优雅的）时尚、（精美的）瓷器与繁复的（礼仪）。公共节庆可能没那么排他。在社区（烧烤聚会）中，厨师为食物（涂抹酱汁），演讲者向志愿者（致敬），家庭则（纪念）逝者。共同仪式无法消除不平等，但能表达超越财富的义务。"}, {"en": "Governments like to (inaugurate) projects and (felicitate) their builders. Ceremonies (elaborate) on success, while residents may (remonstrate) about costs. Repeated disputes can (indurate) positions and (accentuate) differences. A leader who begins to (fixate) on applause may miss an (apposite) objection. Ribbon-cutting does not (denote) a working railway or hospital; reliable maintenance is often an engineer's true (forte). History has room for celebrations, but it ought to reserve its deepest admiration for results that endure.", "zh": "政府喜欢为项目（举行落成典礼），并（祝贺）建设者。仪式上人们（详尽陈述）成功，居民却可能（严正抗议）成本。反复争论会使立场（变得僵硬），并（加剧突出）分歧。领导人若（过度关注）掌声，可能忽视（切中要害的）反对意见。剪彩并不（意味着）铁路或医院真正运作；可靠维护往往才是工程师真正的（强项）。历史容得下庆典，但最深的敬意应留给经得起时间检验的成果。"}, {"en": "The history of technology includes the nearly invisible. A (mote) of dust can ruin a semiconductor; a (recondite) equation may become useful when an (erudite) specialist explains it without a (trite) slogan. Engineers distinguish (discrete) signals, measure how rotors (gyrate), and study how mechanisms (slue) sideways under load. Chemistry can (transmute) materials into useful products, but not every industrial by-product ceases to be (waste). A good laboratory knows when to remain (mute) about results it has not established.", "zh": "技术史也包括几乎看不见的事物。一粒（微尘）可以毁掉半导体；一条（深奥难解的）方程式，可能在（博学的）专家不用（陈词滥调）解释它之后才显得有用。工程师区分（离散的）信号，测量转子如何（旋转），研究机械在负载下如何向侧面（转动偏移）。化学能把材料（转化）成有用产品，但并非每种工业副产物都不再是（废弃物）。好的实验室知道何时应对尚未证实的结果保持（沉默）。"}, {"en": "Moral judgment after an upheaval is rarely simple. Citizens may (abominate) corruption while a beneficiary is denounced as an (ingrate) or a (hypocrite). Some perpetrators are (contrite) and try to (requite) those they harmed; others act from (spite) or personal (pique). A (brusque) apology may deepen resentment, and officials later (rue) their (vague) promises. Accountability demands specific deeds and evidence, not a permanent division of society into saints and villains.", "zh": "动荡之后的道德判断很少简单。公民可能（深恶痛绝）腐败，而受益者可能被指为（忘恩负义者）或（伪君子）。一些加害者（真诚悔过），试图（回报补偿）受害者；另一些人出于（恶意）或个人（恼怒）行事。（生硬唐突的）道歉可能加深怨恨，官员后来也可能（懊悔）自己（含糊不清的）承诺。问责需要具体行为与证据，而不是把社会永久分成圣人与恶人。"}, {"en": "International law adds further complexity. A country may ask another to (extradite) a suspect; a court must then (execute) lawful orders, not grant (absolute) discretion. A (dissolute) executive can still hire an (astute) defense lawyer. Judges may (substitute) one remedy for another when evidence shows someone tried to (adulterate) a product. Prosecutors must distinguish an error from an offense someone took time to (premeditate). The costs of a lost life and a financial loss are (incommensurate), even if both appear in a legal settlement. Transparency matters most where records are (opaque).", "zh": "国际法带来进一步的复杂性。一国可能请求另一国（引渡）嫌疑人；法院则必须（执行）合法命令，而不能赋予（绝对的）自由裁量。（放荡无度的）高管依然可以聘请（精明的）辩护律师。证据显示产品遭（掺假）时，法官可能（替换）救济措施。检察官必须区分失误与（蓄意预谋的）犯罪。生命损失与金钱损失（无法用同一尺度衡量），即使二者都出现在法律和解中。记录越（不透明），透明度就越重要。"}, {"en": "Public justice should (mete) out proportionate penalties without letting a (clique) and its (retinue) control the process. It has become (vogue) to present each boom as unprecedented, but observers should (construe) economic narratives cautiously. When losses (ensue), governments (pursue) remedies and social divisions may (rive) communities. Some industries nevertheless (thrive), while reforms must confront uncomfortable realities rather than offer (oblique) reassurances. History does not prove that every innovation is a bubble; it shows that progress and speculation often arrive together.", "zh": "公共司法应（给予实施）相称惩罚，不应让小（派系）及其（随从班底）控制程序。把每次繁荣都说成史无前例已成为一种（时尚），但观察者应谨慎（理解诠释）经济叙事。当损失（接踵发生），政府（寻求）救济，社会分歧可能（撕裂）社区。有些产业依然（繁荣发展），而改革必须直面令人不安的现实，而非提供（拐弯抹角的）安慰。历史并不能证明所有创新都是泡沫；它表明进步与投机常常相伴而来。"}, {"en": "Over the long run, technological systems (interweave) with institutions. Rivers (lave) industrial shores, but convenient transport can also (enslave) communities to a single employer. A minor (peeve) about regulation may conceal a larger struggle over power. An open society should be (conducive) to experimentation without allowing promoters to (contrive) false promises. Historians (strive) to (enumerate) benefits and costs without (exaggerate) either. Citizens eventually (habituate) themselves to technologies once regarded as miracles. The lasting lesson is the (cue) history gives to investors and voters alike: ask what is real, who pays, and who decides.", "zh": "从长时段看，技术系统与制度（交织）。河流（冲刷）工业海岸，但便利交通也可能让社区被单一雇主（束缚奴役）。对监管的小小（不满）可能掩盖更大的权力斗争。开放社会应当（有利于）试验，同时不允许推销者（设计编造）虚假承诺。历史学家（努力）去（逐项列举）利益与成本，而不（夸大）任何一方。公民最终会（逐渐习惯）那些曾被视为奇迹的技术。历史留给投资者与选民的持久（提示）是：什么是真的，谁来付钱，又由谁作决定？"}];
const HAS_TITLE = true;
const SUBTITLE_EN = "A nonfiction account of the technologies, institutions and choices that shaped the modern world.";
const SUBTITLE_ZH = "一篇探讨塑造现代世界的技术、制度与抉择的非虚构文章。";

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  if (typeof SUBTITLE_EN !== 'undefined' && SUBTITLE_EN) {
    const sub = document.createElement('div');
    sub.className = 'book-subtitle';
    sub.textContent = SUBTITLE_EN;
    div.appendChild(sub);
  }
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  if (typeof SUBTITLE_ZH !== 'undefined' && SUBTITLE_ZH) {
    const subZh = document.createElement('div');
    subZh.className = 'zh-subtitle';
    subZh.textContent = SUBTITLE_ZH;
    div.appendChild(subZh);
  }
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-the-price-of-progress-innovation-speculation-and-social-chan-v1';
const LS_OLD_KEY = 'audiobook-the-price-of-progress-innovation-speculation-and-social-chan-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
