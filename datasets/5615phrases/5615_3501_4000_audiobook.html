<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silver linings — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  .book-subtitle {
    font-size: 1.02rem;
    color: var(--muted);
    font-style: italic;
    margin: 0 0 10px;
  }
  .zh-subtitle {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 0.92rem;
    margin-top: 6px;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>Silver linings</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "Silver linings", "zh": "乌云的银边"}, {"en": "Argentina has tried almost every economic cure except patience. Javier Milei's experiment is the boldest yet, and it is wobbling", "zh": "阿根廷几乎试遍了所有经济药方，唯独缺乏耐心。哈维尔·米莱的实验是迄今最大胆的一次，而它正在摇摆不定"}, {"en": "For two hours on July 19th Argentina held its breath. At MetLife Stadium in New Jersey, before more than 80,000 (spectator)s, the national team's defense of its World Cup (championship) ended in extra time, when Ferran Torres scored the only goal of the final for Spain against an Argentine side reduced to ten men. Lionel Messi, 39 and almost certainly playing his last World Cup match, had a (stellar) tournament, scoring eight goals, but his team could not muster a single shot on target in 120 (minutes) of the final. Back home, where crowds had watched in bars and plazas with almost religious (fervor), there was a (tear) on many a cheek and a (lump) in many throats as Spain's players set off on their (lap) of honor. Four years earlier victory in Qatar had brought a national (catharsis); this time Lionel Scaloni's (roster), which had won two Copas América and a World Cup since 2021, could offer only consolation. Argentines know the feeling. Their history is full of brilliant runs that end in heartbreak.", "zh": "7月19日，阿根廷屏息了整整两个小时。在新泽西州的大都会人寿体育场，超过8万名（观众/spectator）目睹了阿根廷国家队卫冕世界杯（冠军/championship）的征程在加时赛中画上句号：费兰·托雷斯为西班牙打进了决赛唯一的进球，而当时阿根廷队已只剩十人。39岁的莱昂内尔·梅西几乎可以肯定是在踢他的最后一场世界杯比赛，他在本届赛事中表现（出色/stellar），打进8球，但他的球队在决赛的120（分钟/minutes）里连一脚射正都没有。在国内，人们聚集在酒吧和广场上，怀着近乎宗教般的（狂热/fervor）观看比赛；当西班牙球员开始绕场一（圈/lap）致意时，许多人脸颊上挂着（泪水/tear），喉头像被一个（硬块/lump）堵住。四年前，卡塔尔世界杯夺冠曾带来一场全民的（情感宣泄/catharsis）；这一次，利昂内尔·斯卡洛尼麾下这套自2021年以来已赢得两座美洲杯和一座世界杯的（阵容/roster），只能带来些许安慰。阿根廷人对这种感觉并不陌生。他们的历史中满是以心碎告终的辉煌征程。"}, {"en": "Economic disappointment is a more familiar story still. A century ago Argentina was among the richest countries in the world; since then it has defaulted on its sovereign debt nine times, endured six military coups and suffered more bouts of high inflation than almost anywhere else. Against that (backdrop), Javier Milei, a libertarian economist who took office in December 2023 promising to take a chainsaw to the state, has run the boldest experiment in decades. This special report tests a simple (hypothesis): that Argentina's problems are not cultural destiny but the product of (particular) policies, and that they can be reversed. The evidence so far is mixed. Inflation has fallen sharply and the budget is in surplus, but growth has stalled, poverty is rising again and the president's popularity is slipping a year before he seeks re-election. Anyone who spends time in Argentina will (encounter) a nation of extraordinary talent and recurring self-sabotage. Its history is anything but (linear).", "zh": "经济上的失望则是一个更为熟悉的故事。一个世纪前，阿根廷跻身世界最富裕国家之列；此后，它九次主权债务违约，经历了六次军事政变，遭受的高通胀发作次数几乎比任何地方都多。在这样的（背景/backdrop）下，2023年12月上任、承诺要拿电锯砍向国家机器的自由意志主义经济学家哈维尔·米莱，开展了几十年来最大胆的一场实验。本特别报道要检验一个简单的（假说/hypothesis）：阿根廷的问题并非文化宿命，而是（特定的/particular）政策的产物，因而可以扭转。迄今为止的证据好坏参半。通胀大幅回落，预算实现盈余，但增长陷入停滞，贫困再度上升，总统的支持率在他寻求连任的前一年正在下滑。任何在阿根廷待过一段时间的人，都会（遇到/encounter）一个才华非凡却又屡屡自毁前程的民族。它的历史绝不是（直线式的/linear）。"}, {"en": "The land was not always so promising. Long before the Spanish arrived, the peoples of the northwest built irrigated terraces and left (ceramics) of striking sophistication, while in the south Tehuelche hunters stalked guanaco with bow and bolas, the (archer) gradually giving way to the mounted hunter once horses arrived from Europe. For most of the colonial era Buenos Aires was a smugglers' (backwater) on the far edge of Spain's empire, its trade throttled by rules that routed goods through Lima; a (slaver) could land enslaved Africans more easily than a merchant could land legal cloth, and by the late 18th century perhaps a third of the city's people were of African descent. After independence in 1816 the new republic set out to (conquer) the south. In the \"Conquest of the Desert\" of 1878-85, General Julio Roca's Remington rifles overwhelmed Mapuche and Tehuelche warriors armed with the (spear), a campaign of dispossession that the (annals) of the republic long celebrated as a triumph.", "zh": "这片土地并非一直如此充满希望。早在西班牙人到来之前，西北部的民族就修建了灌溉梯田，留下了工艺精湛的（陶器/ceramics），而在南方，特维尔切猎人用弓箭和流星索追猎原驼；马匹从欧洲传入后，（弓箭手/archer）逐渐让位于骑马的猎人。在殖民时代的大部分时间里，布宜诺斯艾利斯都是西班牙帝国边缘一个走私者盘踞的（穷乡僻壤/backwater），其贸易受制于必须经由利马转运货物的规定；一个（奴隶贩子/slaver）运来被奴役的非洲人，比一个商人运来合法的布匹还要容易，到18世纪末，该城也许有三分之一的人口是非洲裔。1816年独立后，新生的共和国着手（征服/conquer）南方。在1878年至1885年的“荒漠征服”中，胡利奥·罗卡将军的雷明顿步枪压倒了手持（长矛/spear）的马普切和特维尔切战士，这场剥夺原住民土地的战役长期被共和国的（史册/annals）颂扬为一场胜利。"}, {"en": "Then came the boom. Between 1880 and 1914 Argentina grew faster than almost any economy on earth. Millions of immigrants, mostly from Italy and Spain, poured in; most Argentines today can trace a (forebear) to a ship that docked in Buenos Aires in those years. British capital built a railway network that fanned out across the pampas, its (flatcar)s hauling wheat to the ports, and refrigerated shipping turned beef into a global commodity: carcasses from the meatpacking plants, where cattle went to (slaughter) by the million, sailed for London as frozen (cargo), and steamships displaced the old sailing (clipper). In the north, the British-owned La Forestal felled quebracho forests for (timber) and tannin. Argentina became the world's (larder), and by 1913 its income per head was among the ten highest anywhere, above that of France and Germany. \"Rich as an Argentine\" was a Parisian compliment. What followed was a (secular) decline almost without parallel among rich countries.", "zh": "随后迎来了繁荣。1880年至1914年间，阿根廷的增长速度几乎超过地球上任何一个经济体。数以百万计的移民涌入，大多来自意大利和西班牙；如今大多数阿根廷人都能找到一位当年乘船在布宜诺斯艾利斯靠岸的（祖先/forebear）。英国资本修建了一张在潘帕斯草原上呈扇形展开的铁路网，（平板货车/flatcar）把小麦运往港口；冷藏航运则把牛肉变成了全球性商品：肉类加工厂里数以百万计的牛被（屠宰/slaughter），胴体作为冷冻（货物/cargo）运往伦敦，蒸汽船取代了昔日的（快速帆船/clipper）。在北方，英国人拥有的拉福雷斯塔尔公司砍伐白坚木森林，获取（木材/timber）和单宁。阿根廷成了世界的（粮仓/larder），到1913年，其人均收入已跻身世界前十，高于法国和德国。“富得像个阿根廷人”曾是巴黎人的恭维话。随之而来的，是一场在富裕国家中几乎绝无仅有的（长期/secular）衰落。"}, {"en": "Buenos Aires still bears the marks of that gilded age. The capital, now a (metropolis) of some 15m people, was laid out to rival Paris, with Beaux-Arts palaces, French mansard roofs and the (grandeur) of the Avenida de Mayo, which runs (perpendicular) to the Avenida 9 de Julio, a 140-meter-wide boulevard that porteños, as the city's inhabitants are known, insist is the widest in the world. At one end of the Avenida de Mayo stands the Congress, whose copper dome has weathered to the green of (verdigris); at the other, the pink Casa Rosada, seat of the presidency. Much of the old (splendor) has faded, and the city's (perimeter), marked by the General Paz ring road, now encloses barely a fifth of the people who live in the capital and its sprawling (environs), where many of the poorest Argentines are to be found.", "zh": "布宜诺斯艾利斯至今仍留有那个镀金时代的印记。这座如今拥有约1500万人口的（大都市/metropolis）当年是照着巴黎的样子规划的，有布杂艺术风格的宫殿、法式孟萨尔屋顶，还有气势（恢宏/grandeur）的五月大道；五月大道与七月九日大道（垂直/perpendicular）相交，后者是一条宽140米的林荫大道，波特诺人，也就是这座城市的居民，坚称它是世界上最宽的大道。五月大道的一端是国会大厦，其铜质穹顶已风化成（铜绿/verdigris）色；另一端是粉红色的玫瑰宫，即总统府所在地。昔日的（辉煌/splendor）已大多褪色，以帕斯将军环城大道为界的城市（周界/perimeter）之内，如今只住着首都及其不断蔓延的（周边地区/environs）总人口的五分之一，而许多最贫穷的阿根廷人就生活在这些周边地区。"}, {"en": "The rot set in with politics. In 1930 the army toppled an elected president, Hipólito Yrigoyen, the first of six military coups; the soldiers who would (usurp) power again in 1943, 1955, 1962, 1966 and 1976 each promised to restore order and each left the economy weaker. The most consequential figure of that era was Juan Perón, a colonel who rose through the military government of 1943 and won the presidency in 1946. Perón, a (forerunner) of modern populism, nationalized the railways and utilities, expanded welfare and made the trade unions the (pillar) of a movement that still dominates Argentine politics. In 1949 he rewrote the constitutional (charter) to permit his own re-election. Critics say he taught politicians to (pander) to voters with subsidies the state could not afford; admirers credit him with giving workers dignity. Peronism became the (thesis) and anti-Peronism its (antithesis), and Argentina has spent 80 years failing to find a (synthesis). The army's (coup) of 1955, which drove Perón into exile, was meant to end the movement; instead it would (engender) two decades of instability.", "zh": "腐朽始于政治。1930年，军队推翻了民选总统伊波利托·伊里戈延，这是六次军事政变中的第一次；此后在1943年、1955年、1962年、1966年和1976年再度（篡夺/usurp）权力的军人，每次都承诺恢复秩序，每次都让经济更加虚弱。那个时代影响最深远的人物是胡安·庇隆，这位上校在1943年的军政府中崛起，并于1946年赢得总统选举。庇隆是现代民粹主义的（先驱/forerunner），他将铁路和公用事业收归国有，扩大福利，并使工会成为一场至今仍主导阿根廷政治的运动的（支柱/pillar）。1949年，他改写了（宪章/charter），以允许自己连任。批评者说，他教会了政客们用国家负担不起的补贴来（迎合/pander）选民；崇拜者则称赞他给了工人尊严。庇隆主义成了（正题/thesis），反庇隆主义则成了它的（反题/antithesis），而阿根廷花了80年也没能找到一个（合题/synthesis）。1955年将庇隆逐出国门的军事（政变/coup）本意是终结这场运动，结果却（引发/engender）了长达二十年的动荡。"}, {"en": "His second wife, Eva Duarte, a radio actress with dyed blonde (tresses), became the movement's icon. As \"Evita\" she ran a foundation that handed out sewing machines, houses and (alms) to the poor, and she cast herself as their (benefactor) against an oligarchy that loathed her; the (bourgeois) matrons of Buenos Aires sneered at her humble birth. When she died of cancer in 1952, aged 33, Peronists treated her as a (martyr), and the national mourning amounted to an (apotheosis). Perón commissioned an Italian (sculptor), Leone Tommasi, to design a monument to her taller than the Statue of Liberty; it was never built. Her embalmed (cadaver) had an afterlife worthy of a novel: after Perón's overthrow the army spirited it away and secretly buried it in Milan under a false name, returning it to the exiled Perón in Spain only in 1971. She now lies in her family's tomb in Recoleta, a (necropolis) of marble and (alabaster) angels where tourists queue to leave flowers. To the world she is best known through \"Evita\", a musical whose (libretto) by Tim Rice gave her an anthem she never sang: \"Don't Cry for Me, Argentina\".", "zh": "他的第二任妻子埃娃·杜阿尔特是一位把（长发/tresses）染成金色的电台女演员，后来成了这场运动的偶像。作为“埃薇塔”，她主持一个基金会，向穷人分发缝纫机、住房和（施舍物/alms），并把自己塑造成穷人的（恩人/benefactor），对抗憎恶她的寡头集团；布宜诺斯艾利斯的（资产阶级/bourgeois）贵妇们则讥笑她出身卑微。1952年她因癌症去世，年仅33岁，庇隆主义者将她奉为（殉道者/martyr），举国哀悼几乎等同于一场（神化/apotheosis）。庇隆委托意大利（雕塑家/sculptor）莱昂内·托马西为她设计一座比自由女神像还高的纪念碑，但它始终没有建成。她那经过防腐处理的（遗体/cadaver）有着一段堪比小说的身后经历：庇隆被推翻后，军方秘密转移了遗体，以假名将其葬在米兰，直到1971年才归还给流亡西班牙的庇隆。如今她长眠于雷科莱塔的家族墓穴中，那是一座满是大理石和（雪花石膏/alabaster）天使雕像的（墓园之城/necropolis），游客们排队前来献花。在世人眼中，她最为人熟知的形象来自音乐剧《埃薇塔》，蒂姆·赖斯为其撰写的（歌词剧本/libretto）给了她一首她从未唱过的颂歌：《阿根廷，别为我哭泣》。"}, {"en": "The worst was yet to come. Perón returned from exile in 1973 and died the following year, leaving the presidency to his third wife, Isabel, amid leftist guerrilla attacks and right-wing death squads. In March 1976 the armed forces seized power and launched what they called the \"Process of National Reorganization\". The phrase \"dirty war\", often used for what followed, is a (misnomer): it was state terrorism. Anyone the junta branded a subversive or a (saboteur), from guerrillas to trade unionists, journalists and students, risked being kidnapped, often by men in unmarked green Ford Falcons. Neighbors served as (informer)s, and a military (censor) vetted newspapers and songs. Detainees were taken to hundreds of secret prisons, the most (sinister) of them at the navy's engineering school in Buenos Aires, known by its Spanish initials as ESMA, where they were tortured; many were drugged and thrown alive from aircraft to (scatter) their bodies across the River Plate and the Atlantic. Human-rights groups put the number of the \"disappeared\" at 30,000. Only in its final (throes), after defeat in the Falklands, did the regime give up power.", "zh": "最糟糕的还在后头。庇隆于1973年结束流亡回国，次年去世，把总统职位留给了第三任妻子伊莎贝尔，彼时左翼游击队袭击不断，右翼敢死队横行。1976年3月，武装部队夺取政权，发动了他们所谓的“国家重组进程”。人们常用“肮脏战争”来形容随后发生的一切，但这是一个（误称/misnomer）：那是国家恐怖主义。任何被军政府打上颠覆分子或（破坏分子/saboteur）标签的人，从游击队员到工会成员、记者和学生，都可能遭到绑架，绑匪往往开着没有标识的绿色福特猎鹰汽车。邻居充当（告密者/informer），军方的（审查官/censor）审查报纸和歌曲。被拘押者被带往数以百计的秘密监狱，其中最（阴森邪恶的/sinister）一处位于布宜诺斯艾利斯的海军工程学校，其西班牙文缩写为ESMA，他们在那里遭受酷刑；许多人被注射麻药后从飞机上活活抛下，尸体（散落/scatter）在拉普拉塔河和大西洋中。人权组织估计“失踪者”人数达3万。直到在马岛战败、陷入最后的（垂死挣扎/throes）之时，这个政权才交出权力。"}, {"en": "Some victims were pregnant. Their babies were born in captivity and handed to military or police families to (foster) as their own. The Grandmothers of the Plaza de Mayo, who began searching for them in 1977, pioneered the use of (genetics) to prove kinship when parents were dead: working with American scientists, they developed an index that could link a child to a grandparent even when no (progenitor) of the middle generation survived, and in 1987 Argentina created a national genetic data bank to hold their samples. By 2025 some 140 stolen grandchildren had recovered their identities; several learned in middle age that the parents who had raised them were (impostor)s complicit in their real parents' deaths. Meanwhile the Argentine Forensic Anthropology Team, founded in 1984, has trained investigators to (disinter) bodies from unmarked graves, identify the (remains) from bones, DNA and dental records, a (molar) here, an (incisor) there, and return them to relatives to (inter) with dignity. Its methods have since been used from Guatemala to the Balkans.", "zh": "一些受害者当时怀有身孕。她们的婴儿在囚禁中出生，被交给军警家庭当作亲生子女（抚养/foster）。“五月广场祖母”组织自1977年起开始寻找这些孩子，在父母已经遇害的情况下，她们率先利用（遗传学/genetics）来证明亲缘关系：她们与美国科学家合作，开发出一种指数，即使中间一代没有任何（亲代/progenitor）存活，也能把孩子与祖父母联系起来；1987年，阿根廷建立了国家遗传数据库来保存她们的样本。到2025年，约有140名被偷走的孙辈找回了身份；其中几人人到中年才得知，抚养自己长大的父母是（冒名顶替者/impostor），与亲生父母的遇害脱不了干系。与此同时，成立于1984年的阿根廷法医人类学小组培训调查人员从无名墓穴中（掘出/disinter）尸体，依据骨骼、DNA和牙科记录，这里一颗（臼齿/molar），那里一颗（门牙/incisor），辨认（遗骸/remains）的身份，再交还亲属体面地（安葬/inter）。其方法后来从危地马拉到巴尔干地区都得到了运用。"}, {"en": "Argentina was the first country in the region to try its dictators. In 1985 a civilian court convicted the leaders of the juntas, a trial dramatized in \"Argentina, 1985\", a film nominated for an Oscar in 2023. But justice proved fragile. Army (mutineer)s with blackened faces, the carapintadas, rose against President Raúl Alfonsín in 1987, Congress passed laws that halted most prosecutions, and Carlos Menem pardoned the convicted commanders in 1990. Only after those laws were struck down in the 2000s did trials resume; more than 1,100 people have since been convicted. The ESMA is now a museum and a UNESCO World Heritage site, a (memento) of what happened there and a (reminder) of how fragile democracy can be. Yet memory is contested. Victoria Villarruel, Milei's vice-president and the daughter of an army officer, has long argued that the guerrillas' victims deserve equal remembrance, and Milei himself disputed the figure of 30,000 in a campaign debate, putting the toll at under 9,000. Human-rights groups accuse the government of trying to (alter) the official story of the dictatorship, and of choosing to (palter) over the numbers rather than confront the crimes.", "zh": "阿根廷是该地区第一个审判本国独裁者的国家。1985年，一个民事法庭判处历届军政府领导人有罪，这场审判被改编成电影《阿根廷，1985》，并于2023年获得奥斯卡提名。但正义被证明是脆弱的。1987年，涂黑了脸的陆军（哗变者/mutineer），即所谓“涂脸派”，起兵反抗劳尔·阿方辛总统，国会通过法律叫停了大部分起诉，卡洛斯·梅内姆又在1990年赦免了被定罪的指挥官。直到这些法律在21世纪头十年被废除，审判才得以恢复；此后已有1100多人被定罪。ESMA如今是一座博物馆，也是联合国教科文组织世界遗产，既是那里所发生之事的（纪念物/memento），也是一个（警示/reminder），提醒人们民主可以多么脆弱。然而，记忆仍有争议。米莱的副总统、一名陆军军官之女比多利亚·比利亚鲁埃尔长期主张，游击队的受害者也应得到同等的纪念；米莱本人在一场竞选辩论中也对3万这一数字提出异议，称死亡人数不到9000。人权组织指责政府企图（篡改/alter）关于独裁统治的官方叙事，并选择在数字上（支吾搪塞/palter），而不是直面罪行。"}, {"en": "The junta's last gamble was the Falklands. On April 2nd 1982, with the economy collapsing and protests growing, General Leopoldo Galtieri sent troops to seize the British-ruled (archipelago), which Argentines call the Malvinas and regard as having been taken from them in 1833 by an (interloper). Britain, cast as the (aggressor) in Buenos Aires and as the victim in London, sent a task force 8,000 miles south. The war lasted 74 days. Argentine pilots, flying Skyhawks, Mirages and (propeller)-driven Pucarás, showed undoubted (valor) and sank several British ships, but many of the defenders were poorly trained conscripts, used as cannon (fodder) in the freezing peat. British special forces landed early to (reconnoiter) the islands, and it emerged decades later that the Swiss company which made the machines the junta used to (encipher) its messages had been secretly owned by American and West German intelligence. The Argentine (surrender) at Stanley on June 14th doomed the dictatorship. Some 650 Argentines and 255 Britons died. Jorge Luis Borges summed it up with a famous (quip): the war, he said, was \"a fight between two bald men over a comb\".", "zh": "军政府的最后一搏是马尔维纳斯群岛。1982年4月2日，在经济崩溃、抗议日增之际，莱奥波尔多·加尔铁里将军派兵夺取了英国治下的这片（群岛/archipelago），阿根廷人称之为马尔维纳斯群岛，认为它在1833年被一个（闯入者/interloper）夺走。在布宜诺斯艾利斯，英国被塑造成（侵略者/aggressor），在伦敦则被视为受害者；英国派出一支特混舰队南下8000英里。战争持续了74天。驾驶“天鹰”、“幻影”和（螺旋桨/propeller）驱动的“普卡拉”战机的阿根廷飞行员表现出毋庸置疑的（英勇/valor），击沉了数艘英国舰船，但许多守军是训练不足的应征士兵，在冰冷的泥炭地里沦为（炮灰/fodder）。英国特种部队早早登岛进行（侦察/reconnoiter）；几十年后人们才得知，为军政府制造（加密/encipher）通信所用机器的那家瑞士公司，竟然暗中归美国和西德情报机构所有。6月14日阿根廷军队在斯坦利（投降/surrender），注定了独裁政权的覆灭。约650名阿根廷人和255名英国人丧生。豪尔赫·路易斯·博尔赫斯用一句著名的（妙语/quip）作了总结：他说，这场战争是“两个秃子在争一把梳子”。"}, {"en": "The islands still haunt Argentine politics. The constitution claims them, official maps must show them, and any (gazetteer) published in Buenos Aires lists Puerto Argentino rather than Stanley. Politicians have often used the claim as a bargaining (chip) at home rather than abroad. The islanders, who voted by 99.8% to remain British in a referendum in 2013, (harbor) no wish to change hands, and they bristle at what they see as the (hauteur) of Buenos Aires. Milei, who has praised Margaret Thatcher as one of history's great leaders, has angered some veterans, and his admiration for the woman who sent the task force can still (embitter) old soldiers. Each April 2nd they march in memory of the dead, among them 323 sailors of the cruiser General Belgrano, sunk by a British submarine, and every (mariner) lost in the cold waters of the South Atlantic.", "zh": "这些岛屿至今仍萦绕在阿根廷政治中。宪法宣示对其拥有主权，官方地图必须标出它们，在布宜诺斯艾利斯出版的任何（地名词典/gazetteer）都写“阿根廷港”而非“斯坦利”。政客们常常把这一主权要求当作在国内而非国外使用的谈判（筹码/chip）。岛民们在2013年的公投中以99.8%的票数选择继续归属英国，他们并不（怀有/harbor）易主的意愿，并对他们眼中布宜诺斯艾利斯的（傲慢/hauteur）十分反感。米莱曾称赞玛格丽特·撒切尔是史上伟大的领导人之一，这激怒了一些老兵；他对那位派出特混舰队的女人的钦佩，仍会让老兵们心生（怨恨/embitter）。每年4月2日，他们都会游行纪念阵亡者，其中包括被英国潜艇击沉的“贝尔格拉诺将军”号巡洋舰上的323名水兵，以及每一位葬身南大西洋冰冷海水的（水手/mariner）。"}, {"en": "Democracy returned in 1983, but sound money did not. Inflation, chronic since the 1940s, turned into an (inferno): in 1989 prices rose by more than 3,000%, enough to (devour) a month's wages in days and (sap) what little faith remained in the currency; supermarkets were looted, and Alfonsín handed power to his successor, Carlos Menem, months early. Menem's economy minister, Domingo Cavallo, the (designer) of the \"convertibility\" plan of 1991, pegged the peso one-to-one to the dollar by law and stopped the central bank from printing money to fund the (exchequer). It worked like an (elixir). Inflation vanished, privatization brought in foreign capital and the dollar peg became the (anchor) of a decade of stability. But the stability was a (veneer). The provinces and the federal government kept borrowing, the peso grew overvalued and, when Brazil devalued in 1999, Argentine exporters could not compete. The (specter) of a run on the banks loomed, and unemployment turned many a middle-class family into a (pauper).", "zh": "1983年民主得以恢复，但稳健的货币却没有随之而来。自20世纪40年代以来就成为痼疾的通胀演变成一场（炼狱/inferno）：1989年物价上涨超过3000%，足以在几天之内（吞噬/devour）一个月的工资，并（消磨/sap）人们对货币仅存的一点信心；超市遭到洗劫，阿方辛提前几个月把权力交给了继任者卡洛斯·梅内姆。梅内姆的经济部长多明戈·卡瓦略是1991年“兑换计划”的（设计者/designer），他以法律形式将比索与美元一比一挂钩，并禁止中央银行为（国库/exchequer）印钞融资。它像（灵丹妙药/elixir）一样奏效。通胀消失了，私有化引来了外国资本，美元挂钩成为十年稳定的（锚/anchor）。但这种稳定只是一层（虚饰/veneer）。各省和联邦政府继续举债，比索日益高估，1999年巴西货币贬值后，阿根廷出口商无力竞争。银行挤兑的（阴影/specter）若隐若现，失业让许多中产家庭沦为（赤贫者/pauper）。"}, {"en": "The crash came in 2001. As depositors fled, the government froze bank accounts in the so-called corralito, a measure that let banks (sequester) the savings of millions. Furious citizens took to the streets banging pots, pans and the odd (colander) in protests known as cacerolazos; shopkeepers pulled down their (blinds) as rioters looted supermarkets, and 39 people were killed. President Fernando de la Rúa fled the Casa Rosada by helicopter, and Argentina got through five presidents in two weeks before defaulting on some $100bn of debt, the biggest sovereign default in history at the time. The peso was devalued and lost about two-thirds of its value. The economy was a (shambles); by 2002 more than half the population was poor. At the (nadir), families sold their (belongings) at barter markets, and an army of cartoneros, urban (forager)s who sift rubbish for cardboard and metal, appeared on the streets of the capital each night.", "zh": "崩溃在2001年到来。随着储户纷纷出逃，政府冻结了银行账户，即所谓的“小围栏”政策，这一措施让银行得以（扣押/sequester）数百万人的储蓄。愤怒的市民走上街头，敲打着锅碗瓢盆，偶尔还有（滤锅/colander），这种抗议被称为“敲锅运动”；暴徒洗劫超市时，店主们纷纷拉下（百叶窗/blinds），共有39人丧生。总统费尔南多·德拉鲁阿乘直升机逃离玫瑰宫，阿根廷在两周内换了五位总统，随后对约1000亿美元的债务违约，这是当时史上最大规模的主权违约。比索贬值，失去了约三分之二的价值。经济一片（狼藉/shambles）；到2002年，一半以上的人口陷入贫困。在（最低谷/nadir），家家户户在以物易物的集市上变卖（家当/belongings），一支由“纸板拾荒者”组成的大军每晚出现在首都街头，这些城市（觅食者/forager）在垃圾中翻找纸板和金属。"}, {"en": "Recovery came quickly, helped by a soaring price for soybeans. Néstor Kirchner, president from 2003 to 2007, and his wife, Cristina Fernández de Kirchner, who succeeded him until 2015, presided over a commodity boom and used it to expand subsidies, pensions and public employment. Critics say they chose to (squander) the windfall. When inflation returned they blamed speculators and every (profiteer) in sight, imposed price controls that (warp) incentives and, from 2007, manipulated the national statistics office, INDEC, whose inflation figures were not even (verisimilar): private estimates ran at roughly double. In 2012 The Economist stopped publishing them, and skeptics treated each monthly release as the work of a (forger). From 2011 the government imposed currency controls known as the cepo, literally a (clamp) or set of stocks, and export taxes and import licenses that would (enfetter) trade for a decade. A (cavalier) attitude to contracts, from the seizure of private pension funds in 2008 to the nationalization of the oil company YPF in 2012, scared off investors. Debts and liabilities piled up to (cumber) every government that followed, and the economy sank into a (morass) of stagflation.", "zh": "复苏来得很快，这得益于大豆价格飙升。2003年至2007年任总统的内斯托尔·基什内尔，以及接替他执政至2015年的妻子克里斯蒂娜·费尔南德斯·德基什内尔，主政于一场大宗商品繁荣之中，并借此扩大补贴、养老金和公共部门就业。批评者说，他们选择了（挥霍/squander）这笔意外之财。通胀卷土重来时，他们归咎于投机者和眼前的每一个（奸商/profiteer），实施了（扭曲/warp）激励的价格管制，并从2007年起操纵国家统计局即INDEC，其公布的通胀数据甚至算不上（逼真可信/verisimilar）：私人机构的估计大约是官方数字的两倍。2012年，《经济学人》停止刊登这些数据，怀疑者把每月公布的数字都视为（伪造者/forger）的作品。从2011年起，政府实施了被称为“cepo”的外汇管制，这个词字面意思是（夹钳/clamp）或枷锁，再加上出口税和进口许可证，将在此后十年里（束缚/enfetter）贸易。对合同的（漫不经心/cavalier）态度，从2008年没收私人养老基金到2012年将石油公司YPF收归国有，吓跑了投资者。债务和负债不断累积，（拖累/cumber）此后的每一届政府，经济陷入滞胀的（泥潭/morass）。"}, {"en": "Creditors who had refused the debt restructurings of 2005 and 2010 chased Argentina through the courts. In 2012 a hedge fund persuaded a court in Ghana to detain the Libertad, the navy's training frigate, which spent more than ten weeks tied by its (hawser)s to a (pier) in the port of Tema before an international tribunal ordered its release. Litigation is a growth industry still. London (barrister)s won a ruling in 2023 that Argentina must pay €1.3bn over GDP-linked warrants, and (filings) in a New York court over the nationalization of YPF produced a $16bn judgment against the state that same year, which an appeals court threw out in March 2026. Darker mysteries endure. In 1994 a bomb reduced the AMIA Jewish community center in Buenos Aires to (debris), killing 85 people; Iran is widely blamed. In January 2015 Alberto Nisman, a prosecutor who had compiled a (dossier), based partly on (wiretap)s, accusing Fernández de Kirchner of covering up Iran's role, was found shot dead in his apartment the day before he was due to present it to Congress. Investigators later concluded that he had been murdered; nobody has been convicted.", "zh": "拒绝接受2005年和2010年债务重组的债权人在法庭上对阿根廷穷追不舍。2012年，一家对冲基金说服加纳的一家法院扣押了阿根廷海军的训练护卫舰“自由”号，该舰被（缆绳/hawser）系在特马港的一处（码头/pier）上长达十多周，直到一个国际法庭下令将其放行。诉讼至今仍是一门兴旺的生意。2023年，伦敦的（出庭律师/barrister）们赢得一项裁决，要求阿根廷就与GDP挂钩的权证支付13亿欧元；同年，在纽约一家法院就YPF国有化一事提交的（诉讼文件/filings）促成了一项针对阿根廷政府的160亿美元判决，该判决于2026年3月被上诉法院推翻。更黑暗的谜团依然存在。1994年，一枚炸弹把布宜诺斯艾利斯的阿根廷以色列互助协会犹太社区中心炸成一片（瓦砾/debris），造成85人死亡；人们普遍认为伊朗是幕后黑手。2015年1月，检察官阿尔韦托·尼斯曼被发现中枪死于自己的公寓，他曾整理了一份部分基于（窃听/wiretap）录音的（卷宗/dossier），指控费尔南德斯·德基什内尔掩盖伊朗的作用，而他原定第二天向国会提交这份材料。调查人员后来断定他死于谋杀；至今无人被定罪。"}, {"en": "Voters (flip) between Peronists and their opponents, and the economy follows a (circular) path: spend, borrow, crash, repeat. In 2015 they elected Mauricio Macri, a former president of the Boca Juniors football club and the son of an Italian-born construction (impresario). He lifted the cepo and settled with the holdouts, but his gradualism failed; in 2018 he turned to the IMF for a $57bn loan, the largest in the fund's history. When Macri lost the primary election of 2019 by a margin no (pollster) had predicted, the peso collapsed and capital controls returned. His successor, Alberto Fernández, was widely seen as a (cipher) for his running-mate and vice-president, Cristina Fernández de Kirchner. During one of the world's longest COVID-19 lockdowns, when Argentines were (coop)ed up for months, photographs emerged of a birthday party held for the first lady at the presidential residence; what he presented as a (peccadillo) became a scandal. The economy stayed in the (doldrums), the government drifted like a ship without a (rudder), and in 2023 inflation reached 211%. Argentina seemed trapped in a doom (loop).", "zh": "选民在庇隆主义者与其对手之间来回（摇摆/flip），经济则沿着一条（周而复始的/circular）路径运行：花钱、借债、崩溃、再来一遍。2015年，他们选出了毛里西奥·马克里，他曾任博卡青年足球俱乐部主席，是一位出生于意大利的建筑业（大亨/impresario）之子。他取消了外汇管制，与拒绝重组的债权人达成和解，但他的渐进主义失败了；2018年，他向国际货币基金组织求助，获得570亿美元贷款，这是该组织历史上规模最大的一笔。2019年马克里在初选中以任何（民调专家/pollster）都没有预料到的差距落败，比索随之暴跌，资本管制卷土重来。他的继任者阿尔韦托·费尔南德斯被普遍视为其竞选搭档兼副总统克里斯蒂娜·费尔南德斯·德基什内尔的（傀儡/cipher）。在全球持续时间最长的新冠封锁之一期间，阿根廷人被（圈/coop）在家里长达数月，而一组在总统官邸为第一夫人举办生日派对的照片随后曝光；他把这说成是（小过失/peccadillo），结果却酿成了一桩丑闻。经济持续（低迷/doldrums），政府像一艘没有（舵/rudder）的船一样随波逐流，2023年通胀率高达211%。阿根廷似乎陷入了一个厄运（循环/loop）。"}, {"en": "Into this mess stepped Javier Milei. A former youth-team goalkeeper for Chacarita Juniors, a one-time (dabbler) in rock music who sang in a Rolling Stones tribute band, and an economist who spent years working for a billionaire's conglomerate, he became famous in the late 2010s as a guest on television panel shows, where pundits (jabber) over one another and where his wild hair and tirades against the political \"caste\" made him a ratings hit. He entered Congress in 2021 as a political (tyro), at the head of a party he had founded himself. His (motto), \"Long live freedom, damn it!\", became a rallying cry for young men above all. His style mixes (braggadocio) with insults: he has called Congress \"a nest of rats\", once described the pope as the representative of evil on earth, and his language can be (vulgar) and (crass). He likes to (hector) his critics on social media, posting and reposting late into the night.", "zh": "哈维尔·米莱就在这片混乱中登场。他曾是查卡里塔青年队青训梯队的门将，一度是摇滚乐的（票友/dabbler），在一支滚石乐队致敬乐团里当过主唱，还是一名在某亿万富翁旗下企业集团工作多年的经济学家；21世纪10年代后期，他作为电视谈话节目的嘉宾成名，在那些节目里，评论员们（叽里呱啦/jabber）地互相抢话，而他那一头乱发和对政治“特权阶层”的激烈抨击让他成了收视率保证。2021年，他以政治（新手/tyro）的身份进入国会，率领的是他自己创建的政党。他的（座右铭/motto）“自由万岁，该死的！”成了一句口号，尤其在年轻男性中一呼百应。他的风格将（吹嘘/braggadocio）与辱骂混为一体：他称国会是“老鼠窝”，曾把教宗形容为邪恶在人间的代表，他的语言有时（粗俗/vulgar）而（鄙陋/crass）。他喜欢在社交媒体上（威吓/hector）批评者，深夜里不停地发帖和转帖。"}, {"en": "He is not an ordinary politician. Milei lives with five English mastiffs cloned in 2018 from his late dog, Conan, at a cost of $50,000; one is also called Conan, and each other (whelp) was named after a free-market economist: Milton, Murray, Robert and Lucas. He calls them his \"four-legged children\" and has spoken with startling (candor) about his spiritual life; he is reported to have received counsel from the original Conan through a medium, and has not denied it. Fans online have turned the cloned (doggo) into a mascot, but critics find such (oracular) mysticism unsettling in a head of state. His intellectual (mentor)s are the economists of the Austrian school, Friedrich Hayek and Murray Rothbard above all. He likes to (harp) on the evils of central banks and taxation, and says he has come to (abhor) the state, which he has called \"a criminal organization\".", "zh": "他不是一个普通的政客。米莱和五只英国獒犬生活在一起，它们是2018年花费5万美元从他已故的爱犬康南身上克隆出来的；其中一只也叫康南，其余每只（幼崽/whelp）都以一位自由市场经济学家命名：米尔顿、默里、罗伯特和卢卡斯。他称它们为“四条腿的孩子”，并以惊人的（坦率/candor）谈论自己的精神生活；据报道，他曾通过灵媒接受原版康南的指点，而他对此并未否认。网上的粉丝把这些克隆（狗狗/doggo）变成了吉祥物，但批评者认为，一国元首有这种（神谕般的/oracular）神秘主义令人不安。他的思想（导师/mentor）是奥地利学派的经济学家，尤其是弗里德里希·哈耶克和默里·罗斯巴德。他喜欢（反复唠叨/harp）中央银行和税收的罪恶，并说自己已开始（憎恶/abhor）国家，他曾称国家为“犯罪组织”。"}, {"en": "In 2023 inflation and fury did the rest. Milei campaigned with a chainsaw, which he brandished at rallies, and a (manifesto) that promised to abolish the central bank, slash public spending and make the dollar legal (tender) in place of the peso. Every (naysayer) predicted that he would scare off moderate voters; instead, in the run-off that November, he beat Sergio Massa, the economy minister of the outgoing government, by 56% to 44%. His supporters saw a (matador) taking on the caste; his (faultfinder)s saw a (poseur) and a (boor) with a volcanic (temper). Milei would (aver) that he is simply honest. He has since quietly dropped dollarization and the plan to close the central bank, but not the chainsaw.", "zh": "2023年，通胀和民愤成就了其余的一切。米莱在竞选中挥舞着一把电锯，在集会上高高举起，还提出了一份（宣言/manifesto），承诺废除中央银行、大幅削减公共开支，并让美元取代比索成为（法定货币/tender）。每一个（唱反调的人/naysayer）都预言他会吓跑温和派选民；结果，在那年11月的决选中，他以56%对44%击败了即将卸任的政府的经济部长塞尔吉奥·马萨。支持者眼中的他是一位向特权阶层宣战的（斗牛士/matador）；（挑剔者/faultfinder）们眼中的他则是一个（装腔作势的人/poseur），一个（脾气/temper）火爆如火山的（粗人/boor）。米莱则会（断言/aver）自己只是诚实而已。此后，他悄悄放弃了美元化和关闭中央银行的计划，但没有放下电锯。"}, {"en": "The shock therapy began at once. In December 2023 the government devalued the peso by 54%, a (steep) fall that briefly pushed monthly inflation above 25%. Milei halved the number of ministries, merging education, labor and social development into a single \"human capital\" (portfolio), and froze public works. Tens of thousands of public-sector jobs went, many of them held by a (temp) on a renewable contract; the government took special aim at the \"ñoquis\", ghost employees said to (malinger) all month and turn up only on the 29th, the day Argentines traditionally eat gnocchi, to collect their pay. Transfers to the provinces were cut, and pensions, eroded by inflation, became more (meager) still. It was a (sledgehammer), not a scalpel. Luis Caputo, the economy minister and a former bond trader, behaves like a hawkish (treasurer) and a (stickler) for the rule that the state must not spend more than it collects, and no previous president has been so happy to play the (miser) with public money. In 2024 the national (coffer)s posted the first full-year fiscal surplus in more than a decade.", "zh": "休克疗法随即展开。2023年12月，政府将比索贬值54%，这一（陡峭的/steep）跌幅一度使月通胀率超过25%。米莱将部委数量减半，把教育、劳工和社会发展部门合并为一个统一的“人力资本”（部长职位/portfolio），并冻结了公共工程。数以万计的公共部门岗位被裁撤，其中许多由签订可续期合同的（临时工/temp）担任；政府特别针对被称为“团子”的挂名员工，据说他们整月（装病偷懒/malinger），只在每月29日露面领工资，而这一天恰是阿根廷人传统上吃意大利团子的日子。对各省的转移支付被削减，被通胀侵蚀的养老金变得更加（微薄/meager）。这是一把（大锤/sledgehammer），而不是一把手术刀。经济部长路易斯·卡普托曾是债券交易员，他行事像一位鹰派的（司库/treasurer），是国家支出不得超过收入这一规则的（死守者/stickler）；此前从没有哪位总统像米莱这样乐于在公帑上扮演（守财奴/miser）。2024年，国家（金库/coffer）实现了十多年来首个全年财政盈余。"}, {"en": "Deregulation followed. Federico Sturzenegger, an MIT-trained economist given a ministry of his own for the purpose, set out to (scrap) the (welter) of rules that (encumber) Argentine business: rent controls were abolished, the skies were opened to new airlines, and hundreds of regulations that forced firms to jump through (hoop)s were simply deleted. His ministry publicizes each deletion and seems determined to (snip) a rule or two almost every day. Rules that used to (bewilder) foreign investors, such as the requirement that exporters sell their dollars to the central bank at an artificial rate, have been eased, though not entirely removed. In June 2024 Congress passed a sweeping reform package, the Bases law, which also created an incentive regime for big investments, known as RIGI. The government wants to (rip) up the old model of state enterprise too: it plans to sell stakes in state firms, and the (proceeds) are meant to pay down debt. Aerolíneas Argentinas, the loss-making flag carrier, has been declared open to privatization, though selling it has proved harder than announcing it; for now its planes still return each night to the state's (hangar)s.", "zh": "放松管制紧随其后。毕业于麻省理工学院的经济学家费德里科·斯图尔津格专门为此获得了一个部，他着手（废除/scrap）那些（妨碍/encumber）阿根廷企业的（一大堆/welter）规章：租金管制被取消，天空向新航空公司开放，数以百计迫使企业跳过一个又一个（火圈/hoop）的规定被直接删除。他的部门对每一项删减都大肆宣传，似乎决心几乎每天都要（剪掉/snip）一两条规定。过去令外国投资者（困惑/bewilder）的规定，例如要求出口商按人为汇率把美元卖给中央银行，已有所放宽，但尚未完全取消。2024年6月，国会通过了一揽子全面改革法案，即《基础法》，该法还设立了一项针对大型投资的激励机制，称为RIGI。政府还想（撕毁/rip）国有企业的旧模式：它计划出售国有企业的股份，所得（收益/proceeds）将用于偿还债务。亏损的国家航空公司阿根廷航空已被宣布可以私有化，但事实证明出售比宣布要难；目前，它的飞机每晚仍然飞回国家的（机库/hangar）。"}, {"en": "The results won (kudos) even from skeptics. Monthly inflation fell from 25.5% in December 2023 to around 2% by mid-2025, and annual inflation from 211% in 2023 to 118% in 2024 and 31.5% in 2025, the lowest in eight years. Poverty, which peaked above 50% in early 2024, fell to 28.2% in the second half of 2025, its lowest since 2018. The economy, after shrinking in 2024, grew by 4.4% in 2025. Unlike his (predecessor)s, Milei did not (prop) up the state by printing money; Caputo, a (dour) presence beside his flamboyant boss, used the budget surplus as his main (lever) against inflation. A tax amnesty in 2024 coaxed (scads) of dollars, long hidden under mattresses and in safe-deposit boxes, into the banks; Argentines are thought to hold more than $200bn outside the financial system, the legacy of decades in which devaluation was the national (bugaboo). Economists who (concur) on little else agree that the fiscal (rigor) was real, and it has done more to (bolster) the government's credibility than any speech.", "zh": "这些成果甚至赢得了怀疑者的（赞誉/kudos）。月通胀率从2023年12月的25.5%降至2025年年中的2%左右，年通胀率从2023年的211%降至2024年的118%和2025年的31.5%，为八年来最低。贫困率在2024年初一度超过50%，到2025年下半年降至28.2%，为2018年以来最低。经济在2024年萎缩之后，于2025年增长了4.4%。与他的（前任/predecessor）们不同，米莱没有靠印钞来（支撑/prop）国家；在张扬的老板身边显得（不苟言笑/dour）的卡普托，把预算盈余当作对抗通胀的主要（杠杆/lever）。2024年的一次税收特赦把（大量/scads）长期藏在床垫下和保险箱里的美元吸引进了银行；据认为，阿根廷人在金融体系之外持有逾2000亿美元，这是几十年来货币贬值一直是全民（梦魇/bugaboo）所留下的遗产。在其他问题上难得（意见一致/concur）的经济学家们都认同，财政上的（严格/rigor）是实实在在的，它对（增强/bolster）政府公信力的作用超过任何演讲。"}, {"en": "The IMF came back on board. In April 2025 the fund, already Argentina's biggest creditor, approved a new $20bn loan, its 23rd program with the country and among the largest of all its lending (facilities). Under its (aegis) the government lifted most currency controls on individuals and let the peso float within a band. Every (parameter) of the program, from reserve targets to the budget balance, is checked at regular reviews, and the government has repeatedly missed its goals for accumulating reserves, the (buffer) of dollars meant to protect the peso. To meet payments to foreign creditors Argentina has had to (incur) fresh debts and (defer) others, rolling over peso (securities) at high interest rates and borrowing from international banks against its bonds.", "zh": "国际货币基金组织重新登场。2025年4月，这个早已是阿根廷最大债权人的组织批准了一笔200亿美元的新贷款，这是它与阿根廷的第23个项目，也是它所有（贷款工具/facilities）中规模最大的之一。在其（庇护/aegis）下，政府取消了对个人的大部分外汇管制，并让比索在一个区间内浮动。该项目的每一项（参数/parameter），从储备目标到预算收支，都要在定期审查中接受检验，而政府一再未能实现积累储备的目标，这些储备是保护比索的美元（缓冲/buffer）。为了向外国债权人付款，阿根廷不得不（举借/incur）新债并（推迟/defer）偿还其他债务，以高利率展期比索（证券/securities），并以本国债券为抵押向国际银行借款。"}, {"en": "Then came a scare. In September 2025 the Peronists, led by Axel Kicillof, the governor of Buenos Aires province, crushed Milei's party in a provincial election by 47% to 33%. Markets treated the vote as a (bellwether): the peso plunged, bonds sold off and the central bank burned through reserves defending the band, a bout of (vertigo) that some saw as the (harbinger) of another Argentine crash. As the (jitter)s spread, help came from an unusual quarter. Donald Trump, who regards Milei as an ideological soulmate, offered (succor): the American Treasury agreed a $20bn currency swap with Argentina's central bank and even bought pesos, despite the (qualms) of lawmakers in both parties who asked why American money should rescue a foreign currency. Trump made his support conditional: \"If he loses, we are not going to be generous with Argentina.\" On October 26th Milei's party won 41% of the national vote in the midterm elections, against 34% for the Peronists, giving it more than a third of the lower house, enough to uphold presidential vetoes. Scott Bessent, the treasury secretary who had helped (broker) the rescue, was jubilant.", "zh": "接着是一场虚惊。2025年9月，由布宜诺斯艾利斯省省长阿克塞尔·基西洛夫领导的庇隆主义者在一次省级选举中以47%对33%大胜米莱的政党。市场把这次投票视为（风向标/bellwether）：比索暴跌，债券遭抛售，中央银行为守住汇率区间耗费了大量储备，这阵（眩晕/vertigo）在一些人看来是阿根廷又一次崩溃的（预兆/harbinger）。正当（紧张不安/jitter）的情绪蔓延之际，救兵来自一个不寻常的方向。视米莱为意识形态知己的唐纳德·特朗普伸出了（援手/succor）：美国财政部与阿根廷中央银行达成了一项200亿美元的货币互换协议，甚至还买入了比索，尽管两党议员都心存（疑虑/qualms），质问为什么要用美国的钱去拯救一种外国货币。特朗普为他的支持设定了条件：“如果他输了，我们就不会对阿根廷慷慨了。”10月26日，米莱的政党在中期选举中赢得41%的全国选票，庇隆主义者得票34%，这使其在众议院中的席位超过三分之一，足以维持总统的否决。帮助（促成/broker）这次救助的美国财政部长斯科特·贝森特欣喜若狂。"}, {"en": "The brightest part of the economy lies underground. Vaca Muerta, a shale formation in Neuquén province the size of Belgium, has become the country's (dynamo). Its wells are drilled sideways through the rock rather than with an old-fashioned (auger), but the effect has been that of a (gusher): oil output has hit records, a country that imported energy a few years ago posted an energy trade surplus of $7.8bn in 2025, and in the first half of 2026 crude oil came to (surpass) corn and soy products as Argentina's biggest export, earning $4.7bn. New pipelines and an export terminal at Punta Colorada on the Atlantic coast, where steel (girder)s are rising over the beach, should roughly double export capacity by 2027. Mining is booming too, with exports of gold, silver and lithium reaching a record $6bn in 2025, and RIGI's tax and customs guarantees are meant to (woo) tens of billions more. In April 2026 Congress loosened a law protecting glaciers, letting provinces approve mines in periglacial zones; the government says this will (spur) copper projects in the Andes, while environmentalists warn of damage to the (aquifer)s and rivers that supply arid provinces. More gas from Vaca Muerta should also ease the winter shortages that have forced factories to fall back on a diesel (generator).", "zh": "经济中最亮眼的部分藏在地下。内乌肯省的瓦卡穆尔塔页岩层面积与比利时相当，已成为这个国家的（发动机/dynamo）。那里的油井是在岩层中横向钻出的，而不是用老式的（螺旋钻/auger）打的，但效果却如同一口（自喷油井/gusher）：石油产量屡创纪录，一个几年前还在进口能源的国家在2025年实现了78亿美元的能源贸易顺差；2026年上半年，原油（超过/surpass）玉米和大豆产品，成为阿根廷最大的出口商品，创汇47亿美元。新的输油管道和位于大西洋沿岸蓬塔科洛拉达的出口码头应能在2027年前使出口能力大致翻番，那里的钢（梁/girder）正在海滩上拔地而起。采矿业也在蓬勃发展，2025年金、银和锂的出口额创下60亿美元的纪录，而RIGI提供的税收和海关保障旨在（吸引/woo）数百亿美元的更多投资。2026年4月，国会放宽了一部保护冰川的法律，允许各省批准在冰缘地带开矿；政府称此举将（刺激/spur）安第斯山区的铜矿项目，环保人士则警告，这会损害为干旱省份供水的（含水层/aquifer）和河流。来自瓦卡穆尔塔的更多天然气，也应能缓解冬季的短缺，过去这种短缺迫使工厂退而求助于柴油（发电机/generator）。"}, {"en": "The rest of the economy is not firing on every (cylinder). Output shrank by 0.6% in the second quarter of 2026 compared with the first, the first quarterly contraction since 2024, and the government has cut its growth forecast for the year from 5% to 3%; private economists expect closer to 2%. Energy, mining and farming are booming, but they employ relatively few people. Manufacturing, retail and construction, which employ many more, are struggling: a strong peso and a flood of cheaper imports (hamper) local producers, and factories that grew up behind the walls of one of the world's most (insular) economies now (lumber) along well below capacity. Blue-(collar) jobs are vanishing. A (bricklayer) laid off from a stalled public-works project may now earn his living as a delivery rider, or as a (hawker) selling socks and phone chargers on commuter trains. Unemployment reached 7.9% in the second quarter, the highest since 2021. Expensive credit puts a further (damper) on consumption, investment outside the favored sectors has been (lackluster), and much of industry continues to (limp).", "zh": "经济的其余部分并没有开足每一个（汽缸/cylinder）。2026年第二季度产出环比萎缩0.6%，为2024年以来首次季度收缩，政府已将全年增长预测从5%下调至3%；私营部门经济学家预计更接近2%。能源、采矿和农业蓬勃发展，但雇用的人相对较少。雇用人数多得多的制造业、零售业和建筑业则举步维艰：强势比索和大量涌入的廉价进口商品（阻碍/hamper）着本地生产商，那些在全球最（封闭/insular）的经济体之一的高墙后成长起来的工厂，如今在远低于产能的状态下（步履蹒跚/lumber）。蓝（领/collar）工作岗位正在消失。一名因公共工程停摆而被解雇的（砌砖工/bricklayer），如今可能靠送外卖谋生，或者在通勤列车上当（小贩/hawker），兜售袜子和手机充电器。第二季度失业率升至7.9%，为2021年以来最高。昂贵的信贷给消费进一步（泼了冷水/damper），受青睐行业之外的投资（乏善可陈/lackluster），大部分工业仍在（艰难跛行/limp）。"}, {"en": "Farming is the old engine of growth. The pampas have some of the most fertile soils on earth, and Argentine farmers, early adopters of no-till cultivation and genetically modified seeds, turn sunshine into soybeans with ruthless efficiency, (photosynthesis) on an industrial scale. Each autumn fleets of combine harvesters, the modern (reaper), roll across the plains. Pests are a constant threat. The fall armyworm, a (caterpillar) that chews maize leaves to shreds, is the most destructive (defoliator); swarms of locusts, which grow through a series of molts, a process known as (ecdysis), periodically darken the skies of the north; and in 2024 a plague of leafhoppers spread a disease that devastated the maize crop. In the Andean northwest farmers still grow hundreds of varieties of potato and other native (tuber)s. Cattle ranching has a romance all its own, from the (wrangler) on horseback to the (rustler) who steals livestock by night, an old crime that still costs ranchers dearly. Under Milei export taxes on grains have been cut, letting farmers (reap) more of the value of their harvests.", "zh": "农业是古老的增长引擎。潘帕斯草原拥有地球上最肥沃的一些土壤，阿根廷农民率先采用免耕栽培和转基因种子，以冷酷的效率把阳光变成大豆，堪称工业规模的（光合作用/photosynthesis）。每到秋天，成群的联合收割机，也就是现代的（收割机/reaper），在平原上隆隆驶过。害虫是持续的威胁。草地贪夜蛾是一种把玉米叶啃成碎片的（毛虫/caterpillar），是破坏力最强的（食叶害虫/defoliator）；蝗虫要经过一系列被称为（蜕皮/ecdysis）的过程才能长大，成群的蝗虫不时遮蔽北方的天空；2024年，叶蝉肆虐，传播的一种病害重创了玉米收成。在安第斯西北部，农民们仍在种植数百个品种的马铃薯和其他本土（块茎作物/tuber）。牧牛业有着独特的浪漫色彩，从马背上的（牧马人/wrangler）到夜里偷牲口的（盗牛贼/rustler），这种古老的罪行至今仍让牧场主损失惨重。在米莱治下，粮食出口税已被削减，让农民能从收成中（收获/reap）更多价值。"}, {"en": "The services economy is more dynamic than its reputation. MercadoLibre, founded in 1999 by Marcos Galperin, a graduate of Stanford's business school, as an online auction site, has grown into Latin America's biggest digital (bazaar) and one of its most valuable companies, with a fintech arm and a (logistics) network that outpaces the region's postal services; it has squeezed bricks-and-(mortar) retailers across the continent. Argentina has produced a string of tech \"unicorns\", including Globant, a software firm, and Ualá, a digital bank, and the Buenos Aires tech (cluster) is a magnet for any young (entrepreneur) with an idea and an (incubator) willing to back it. Tens of thousands of Argentines work as a (freelancer) for foreign clients, paid in dollars or crypto, while delivery riders on (scooter)s and bicycles keep the city fed. But talent has a habit of leaving: whenever a crisis strikes, programmers, doctors and scientists (decamp) to Madrid, Miami or Barcelona.", "zh": "服务业经济比其名声更有活力。美客多由马科斯·加尔佩林于1999年作为一个在线拍卖网站创立，加尔佩林毕业于斯坦福大学商学院；如今它已成长为拉丁美洲最大的数字（集市/bazaar），也是该地区最有价值的公司之一，拥有金融科技业务和一张效率胜过该地区邮政服务的（物流/logistics）网络；它挤压了整个南美大陆的传统零售商，即所谓砖头加（灰浆/mortar）的实体店。阿根廷已涌现出一连串科技“独角兽”，包括软件公司Globant和数字银行Ualá，布宜诺斯艾利斯的科技（集群/cluster）对任何有想法、又有（孵化器/incubator）愿意支持的年轻（创业者/entrepreneur）都有吸引力。数以万计的阿根廷人以（自由职业者/freelancer）身份为外国客户工作，收取美元或加密货币报酬，而骑着（小型摩托车/scooter）和自行车的外卖骑手则让这座城市吃饱肚子。但人才有一种离开的习惯：每当危机来袭，程序员、医生和科学家就会（远走他乡/decamp），前往马德里、迈阿密或巴塞罗那。"}, {"en": "Argentine ingenuity has a long pedigree. The country has produced five Nobel laureates, three of them in science: Bernardo Houssay, who won in 1947 for showing that the pituitary gland, not just the (pancreas), helps to regulate blood sugar; Luis Leloir, who won the chemistry prize in 1970 and is also credited with inventing salsa golf, a pink sauce of ketchup and mayonnaise; and César Milstein, who left Argentina amid political purges in 1963 and shared the 1984 prize for developing monoclonal antibodies, the basis of modern cancer drugs such as checkpoint (inhibitor)s. Juan Vucetich, a police official in La Plata, pioneered fingerprint identification in the 1890s, the (genesis) of modern forensics. László Bíró patented the ballpoint pen in Argentina in 1943; René Favaloro, a heart surgeon, pioneered the coronary bypass operation; and Julio Palmaz, another Argentine, invented the balloon-expandable stent, transforming (vascular) medicine. INVAP, a state-owned company in Bariloche, builds satellites, a rare feat of (aeronautics) for a middle-income country, as well as research reactors for export; one of them, OPAL, produces medical isotopes in the land of the (kangaroo).", "zh": "阿根廷人的聪明才智由来已久。这个国家产生过五位诺贝尔奖得主，其中三位获得的是科学奖：贝尔纳多·奥赛于1947年获奖，因为他证明了不只是（胰腺/pancreas），脑垂体也参与调节血糖；路易斯·莱洛伊尔于1970年获得化学奖，还被认为发明了“高尔夫酱”，一种由番茄酱和蛋黄酱调成的粉红色酱汁；塞萨尔·米尔斯坦在1963年的政治清洗中离开阿根廷，因研制出单克隆抗体而分享了1984年的诺贝尔奖，单克隆抗体是检查点（抑制剂/inhibitor）等现代抗癌药物的基础。拉普拉塔的警官胡安·布塞蒂奇在19世纪90年代开创了指纹识别技术，这是现代法医学的（起源/genesis）。拉斯洛·比罗于1943年在阿根廷为圆珠笔申请了专利；心脏外科医生勒内·法瓦洛罗开创了冠状动脉搭桥手术；另一位阿根廷人胡利奥·帕尔马斯发明了球囊扩张式支架，改变了（血管/vascular）医学。位于巴里洛切的国有企业INVAP制造卫星，这对一个中等收入国家来说是（航空航天/aeronautics）领域的罕见成就；它还制造用于出口的研究型反应堆，其中一座名为OPAL，在（袋鼠/kangaroo）之乡生产医用同位素。"}, {"en": "Ingenuity is also a matter of necessity. Argentines speak proudly of \"lo atamos con alambre\", fixing things with a bit of wire, a habit born of decades of import restrictions and scarce spare parts. Backstreet (mechanics) in Buenos Aires can keep a 1970s Ford Falcon running with little more than (pliers), (pincers), a (screwdriver) and a (hammer), beating out a dented (fender) and patching the wiring with a soldering iron and a dab of (solder); many such cars have an (odometer) that has gone round more than once. The same model, once the junta's vehicle of choice for kidnappings, is now a collector's item.", "zh": "聪明才智也是出于必要。阿根廷人常自豪地说“用铁丝绑一绑就行”，意思是用一根铁丝就能把东西修好，这一习惯源于几十年的进口限制和零配件匮乏。布宜诺斯艾利斯小巷里的（机修工/mechanics）只需一把（老虎钳/pliers）、一把（夹钳/pincers）、一把（螺丝刀/screwdriver）和一把（锤子/hammer），就能让一辆上世纪70年代的福特猎鹰继续跑下去：他们敲平凹陷的（挡泥板/fender），用电烙铁和一点（焊锡/solder）修补线路；许多这样的车，（里程表/odometer）已经转了不止一圈。同款车曾是军政府绑架时的首选车辆，如今已成为收藏品。"}, {"en": "Craftsmanship survives in other trades too. In San Telmo a (carpenter) restoring antique furniture works ankle-deep in (shavings), and a (cobbler) hand-stitches dancing shoes for the milongas; bandoneon makers measure reeds with (calipers) and trim wire with (nippers), keeping alive an instrument invented in Germany that is no longer mass-produced there. In the countryside, estancias that once bred cattle for export now host tourists, who sleep in a (four-poster) bed, ride out past the (palings) of the corral and dine on the ranch's own beef.", "zh": "手艺在其他行当中也得以延续。在圣特尔莫，一位修复古董家具的（木匠/carpenter）在没过脚踝的（刨花/shavings）中工作，一位（鞋匠/cobbler）为探戈舞会手工缝制舞鞋；班多钮手风琴的制作者用（卡尺/calipers）测量簧片，用（剪钳/nippers）修剪金属丝，让这种发明于德国、如今在那里已不再大规模生产的乐器得以延续。在乡间，曾经为出口而养牛的庄园如今接待游客，游客们睡在（四柱床/four-poster）上，骑马经过畜栏的（木栅/palings），享用庄园自产的牛肉。"}, {"en": "Social progress has stalled. After falling sharply, the poverty rate rose again to 32.3% in the first half of 2026, from 28.2% six months earlier, and extreme poverty climbed to 7.5%. Household incomes rose by 11.5% over the period while the cost of the basic basket of goods rose by nearly 20%, and real wages are still below where they were when Milei took office. Disinflation, which did so much for the poor in 2024 and 2025, has given way to (stasis): monthly inflation ran at between 2% and 3.4% for most of 2026 before easing to 1.7% in August, when prices were still 33.5% higher than a year earlier. To call the setback a blip would be a (gloss-over). In the villas, the informal settlements that ring the capital, (squalor) persists; pensioners and the young unemployed (shoulder) much of the burden, and resentment is beginning to (fester).", "zh": "社会进步陷入停滞。在大幅下降之后，2026年上半年贫困率再度升至32.3%，而六个月前为28.2%，赤贫率升至7.5%。在此期间，家庭收入增长了11.5%，而基本生活品篮子的成本上涨了近20%，实际工资仍低于米莱上任时的水平。在2024年和2025年让穷人大为受益的通胀回落，已让位于（停滞/stasis）：2026年大部分时间里月通胀率在2%至3.4%之间，直到8月才降至1.7%，而当时物价仍比一年前高出33.5%。把这次倒退称为一时波动，就是一种（粉饰/gloss-over）。在环绕首都的非正规定居点“贫民村”里，（脏乱贫困/squalor）依旧；领养老金者和年轻失业者（承担/shoulder）了大部分重负，怨气开始（滋生溃烂/fester）。"}, {"en": "Public health has its own battles. In 2024 Argentina suffered its worst dengue epidemic on record, with more than half a million cases; the virus is spread by the Aedes aegypti (mosquito), whose (proboscis) pierces the skin as it feeds, and warmer summers have carried it south to Buenos Aires. In the north, vampire bats spread (rabies) among cattle, and the kissing bug transmits Chagas disease. Argentina's public hospitals long treated anyone who walked in, including foreigners who crossed from neighboring countries for free care for chronic conditions such as (hepatitis), (arthritis) or (nephritis), or for something as mundane as (gastritis). In 2025 the government decreed that non-resident foreigners must pay. Medical tourism has flowed the other way too: a cheap peso long drew foreigners to Buenos Aires for cosmetic surgery, dental implants and (orthodontics), though the stronger peso has made the city far less of a bargain.", "zh": "公共卫生也有它自己的战役。2024年，阿根廷遭遇了有记录以来最严重的登革热疫情，病例超过50万；这种病毒由埃及伊蚊这种（蚊子/mosquito）传播，它吸血时用（口器/proboscis）刺穿皮肤，而日益炎热的夏季已把它带到了南方的布宜诺斯艾利斯。在北方，吸血蝠在牛群中传播（狂犬病/rabies），锥蝽则传播恰加斯病。阿根廷的公立医院长期以来接诊任何上门的人，包括从邻国过来免费治疗（肝炎/hepatitis）、（关节炎/arthritis）或（肾炎/nephritis）等慢性病的外国人，甚至有人只是来治疗（胃炎/gastritis）这样的寻常小病。2025年，政府颁布法令，规定非居民外国人必须付费。医疗旅游也有反向的流动：廉价的比索长期吸引外国人到布宜诺斯艾利斯做整容手术、种植牙和（牙齿矫正/orthodontics），不过比索走强已让这座城市远没有那么划算了。"}, {"en": "Education and health spending have become battlegrounds. Argentina's public universities charge no tuition and admit almost anyone who applies; for many families a degree obtained (gratis) is the main route into the middle class. When the government froze their budgets as inflation raged, hundreds of thousands of people marched in protest in 2024 and 2025. Congress passed laws to raise funding for the universities and for (pediatrics) at the Garrahan, the country's leading children's hospital, and in 2025 it overrode the president's vetoes of both. Doctors and academics complain that the money has been slow to arrive and that the government continues to (skimp), warning that low pay will (impair) research and patient care; many junior lecturers, who (proctor) exams and grade papers for a pittance, hold two or three jobs. The government retorts that free universities mostly benefit the middle class, and that the surest way to (empower) the poor is to beat inflation.", "zh": "教育和卫生开支已成为战场。阿根廷的公立大学不收学费，几乎来者不拒；对许多家庭来说，（免费/gratis）获得的学位是跻身中产阶级的主要途径。当政府在通胀肆虐之际冻结大学预算时，2024年和2025年有数十万人上街游行抗议。国会通过法律，为大学以及全国顶尖儿童医院加拉汉医院的（儿科/pediatrics）增加拨款，并于2025年推翻了总统对这两项法律的否决。医生和学者抱怨说，资金迟迟不到位，政府仍在（克扣/skimp），并警告低薪将（损害/impair）研究和病人护理；许多青年讲师为微薄的报酬（监考/proctor）、批改试卷，同时身兼两三份工作。政府则反驳说，免费大学的受益者主要是中产阶级，而为穷人（赋权/empower）最可靠的办法是战胜通胀。"}, {"en": "Emboldened by the midterms, Milei has pushed his agenda through Congress. In February 2026 the Senate approved a labor reform, by 42 votes to 28, that makes it easier and cheaper to hire and fire, lets employers stretch the working day to as much as 12 hours, permits wages to be paid in foreign currency and requires essential services to keep running during strikes. The (specifics) were fiercely contested: unions called general strikes, and police were accused of using force to (harass) protesters outside Congress. Lacking a majority in either chamber, the government must (garner) votes from provincial governors by trading favors and funds; it has learned to (maneuver) and sometimes to (outmaneuver) a fragmented opposition, which has no (filibuster) to fall back on. With more than a third of the lower house, the president can now make his (veto) stick. Yet every (deserter) from his coalition hurts, and street protests (beleaguer) his ministers. Not a (peep) of dissent is tolerated inside his party, La Libertad Avanza, but that has not been enough to (deter) defections.", "zh": "中期选举后底气大增的米莱，在国会推进了他的议程。2026年2月，参议院以42票对28票通过了一项劳动改革，使雇用和解雇更容易、成本更低，允许雇主把工作日延长至最多12小时，允许以外币支付工资，并要求基本服务在罢工期间维持运转。其（具体条款/specifics）争议激烈：工会发动了总罢工，警方被指控在国会外动用武力（骚扰/harass）抗议者。由于在两院均未占多数，政府必须通过交换人情和资金来向各省省长（争取/garner）选票；它已学会（周旋/maneuver），有时还能（智胜/outmaneuver）一个四分五裂的反对派，而后者也没有（冗长发言阻挠议事/filibuster）的手段可以依靠。凭借在众议院超过三分之一的席位，总统如今能让自己的（否决/veto）站得住脚。然而，执政联盟中每一个（倒戈者/deserter）都会造成伤害，街头抗议也让他的部长们（疲于应付/beleaguer）。在他的政党“自由前进党”内部，连一点（异议之声/peep）都不被容忍，但这仍不足以（阻止/deter）党员出走。"}, {"en": "Scandal has dented the president's image as the scourge of the caste. In February 2025 Milei promoted a cryptocurrency called $LIBRA on social media; its price soared and then collapsed within hours, wiping out small investors while insiders cashed out. Critics likened it to a (huckster)'s pump-and-dump scheme; the president deleted his post and issued a (disclaimer), saying he had merely spread the word about a private venture. In August 2025 leaked recordings in which the former head of the national disability agency spoke of alleged kickbacks on drug purchases, implicating Karina Milei, the president's sister and chief of staff, caused a (fracas); the government called them an operation by its enemies. And in June 2026 Manuel Adorni, the cabinet chief, resigned after admitting that he had left some $500,000 out of his asset declarations; he denies wrongdoing. Such episodes (embarrass) a government that campaigned on (ethics), and opponents say corruption is a (canker) that no chainsaw has cut out. None of those accused has been convicted, and it would be unfair to cast any of them as a (malefactor); but the affairs (mar) the government's claim to be different, and ministers now (utter) the word \"caste\" a little less often.", "zh": "丑闻损害了总统作为特权阶层克星的形象。2025年2月，米莱在社交媒体上推广一种名为$LIBRA的加密货币；其价格先是飙升，随后在几小时内崩盘，散户投资者血本无归，内部人士却已套现离场。批评者将其比作（骗子/huckster）的拉高出货骗局；总统删除了帖子，并发表了一份（免责声明/disclaimer），称自己只是帮一个私人项目传播了消息。2025年8月，泄露的录音中，国家残疾人管理局前局长谈到了药品采购中涉嫌的回扣，牵涉到总统的妹妹兼幕僚长卡琳娜·米莱，引发了一场（风波/fracas）；政府称这是对手策划的行动。2026年6月，内阁首席部长曼努埃尔·阿多尔尼承认在财产申报中漏报了约50万美元，随后辞职；他否认有任何不当行为。这些事件令一个以（道德操守/ethics）为竞选旗号的政府（难堪/embarrass），反对者说，腐败是一个电锯也锯不掉的（毒瘤/canker）。被指控者中无人被定罪，把他们中的任何人说成（恶人/malefactor）都有失公允；但这些事件（玷污/mar）了政府自诩与众不同的说法，部长们如今（说出/utter）“特权阶层”这个词的次数也少了一些。"}, {"en": "The opposition has troubles of its own. Cristina Fernández de Kirchner, twice president and the dominant figure in Peronism for two decades, is serving a six-year sentence for fraud in the awarding of public-works contracts in Santa Cruz province; in June 2025 the Supreme Court put its final (stamp) on the conviction. She lives under house arrest in her apartment in Buenos Aires, wearing an electronic ankle monitor, and the ruling will (debar) her from public office for life. Her enemies have long cast her as a (virago); her followers call her a political prisoner. She is still the (titular) president of the Peronist party, and she is on trial again, alongside some 80 other defendants, in the \"notebooks\" case, which grew out of the (ledger)-like diaries in which a government chauffeur recorded years of alleged bribe deliveries, now part of a court (folder) many thousands of pages thick. The Kirchner years left other indelible images, such as that of José López, a former public-works official, caught at dawn in 2016 hurling bags stuffed with nearly $9m in cash over the wall of a (cloister) on the outskirts of the capital. Each side accuses the other of turning the courts into weapons, and every (petitioner) at Comodoro Py, the federal courthouse, knows that the calendars of justice and politics tend to (overlap). Reformers want judges who can be removed for misconduct and bar associations willing to (disbar) crooked lawyers.", "zh": "反对派也有自己的麻烦。两度出任总统、二十年来一直主导庇隆主义的克里斯蒂娜·费尔南德斯·德基什内尔，正因在圣克鲁斯省公共工程合同授予中的欺诈行为服刑六年；2025年6月，最高法院为这一定罪盖上了最终的（印章/stamp）。她在布宜诺斯艾利斯的公寓里被软禁，戴着电子脚镣，这一裁决将终身（禁止/debar）她担任公职。她的敌人长期把她描绘成（悍妇/virago）；她的追随者则称她为政治犯。她仍是庇隆主义政党的（名义上的/titular）主席，并且再次受审，与约80名被告一起卷入“笔记本”案；此案源于一名政府司机多年来记录涉嫌行贿送款情况的（账本/ledger）式日记，这些日记如今已成为一份厚达数千页的法庭（卷宗夹/folder）的一部分。基什内尔时代还留下了其他令人难忘的画面，比如前公共工程官员何塞·洛佩斯：2016年的一个黎明，他被人撞见把塞满近900万美元现金的袋子扔过首都郊外一座（修道院/cloister）的围墙。双方都指责对方把法院变成武器，每一位来到联邦法院所在地科莫多罗·皮的（诉愿人/petitioner）都知道，司法与政治的日程往往（重叠/overlap）。改革者希望法官能因不当行为被罢免，也希望律师协会愿意（取消/disbar）不法律师的执业资格。"}, {"en": "All eyes are now on the presidential election of October 2027. Milei's approval rating, which recovered to about 40% in May 2026, has sagged since; among poorer voters disapproval approaches 70%, according to AtlasIntel, a polling firm. His likely (nemesis) is Kicillof, an economist who served as Fernández de Kirchner's economy minister and now governs the province where nearly two-fifths of Argentines live. Peronists are trying to reunite, though the former president's camp and the governor's often (carp) at each other. Those who try to (decipher) the polls agree that the most likely (scenario) is a tight race, and that the (odds) of Milei's re-election depend largely on whether growth returns before the campaign begins. Voters who backed him out of desperation in 2023 may (plump) for continuity if inflation keeps falling, or punish him if their wallets stay thin. Party workers have already begun to (canvass) the vast suburbs of Buenos Aires. For the (remainder) of his term, Milei's task is to show that the pain was worth it. Few would dare to (augur) the result.", "zh": "如今所有人的目光都投向2027年10月的总统选举。米莱的支持率在2026年5月回升至40%左右，此后又有所下滑；据民调机构AtlasIntel统计，在较贫穷的选民中，不支持率已接近70%。他最可能的（克星/nemesis）是基西洛夫，这位经济学家曾任费尔南德斯·德基什内尔的经济部长，如今治理着近五分之二阿根廷人居住的省份。庇隆主义者正设法重新团结，但前总统的阵营与这位省长的阵营之间常常互相（挑剔抱怨/carp）。那些试图（解读/decipher）民调的人一致认为，最可能的（情景/scenario）是一场势均力敌的选战，而米莱连任的（胜算/odds）在很大程度上取决于竞选开始前经济能否恢复增长。2023年出于绝望而支持他的选民，如果通胀继续下降，可能会（选择/plump）延续现状；如果钱包依然干瘪，则可能惩罚他。党务工作者已经开始在布宜诺斯艾利斯广袤的郊区（拉票/canvass）。在任期的（剩余时间/remainder）里，米莱的任务是证明这番痛苦是值得的。很少有人敢（预言/augur）结果。"}, {"en": "Whatever happens at the ballot box, Argentina's culture will keep its grip on the world's imagination. The (tango) was born in the late 19th century in the port neighborhoods of Buenos Aires and Montevideo, among immigrants, sailors and the poor, and was long thought indecent by the city's elite until Paris embraced it in the 1910s. Its early heroes were swaggering compadritos, each a slum (fop) in a slouch hat. Today dozens of milongas, as dance halls are called, fill with dancers every night. They (primp) in front of the mirror, (limber) up their ankles, then (saunter) onto the floor; the best combine melancholy (languor) with fierce (gusto). It is tempting to treat the national dance as a (metaphor) for the nation's politics: passionate, improvised and always on the verge of a fall.", "zh": "无论投票结果如何，阿根廷的文化都将继续牢牢吸引着世人的想象。（探戈/tango）诞生于19世纪末布宜诺斯艾利斯和蒙得维的亚的港口街区，诞生于移民、水手和穷人之中，长期被城中精英视为有伤风化，直到20世纪10年代巴黎接纳了它。它早期的英雄是大摇大摆的街头混混，个个都是头戴垂边软帽的贫民窟（花花公子/fop）。如今，每晚都有数十家被称为“米隆加”的舞厅挤满舞者。他们在镜子前（梳妆打扮/primp），（活动/limber）脚踝，然后（款款踱步/saunter）走进舞池；最出色的舞者将忧郁的（慵懒/languor）与炽烈的（热情/gusto）融为一体。人们不免想把这种国舞当作这个国家政治的（隐喻/metaphor）：充满激情，即兴发挥，而且总在跌倒的边缘。"}, {"en": "The music has its own saints. Carlos Gardel, the (dapper) singer whose (debonair) smile and slicked-back hair still adorn café walls, died in a plane crash in Colombia in 1935 at the height of his fame; Argentines say that he \"sings better every day\", and his recordings are steeped in (pathos). Astor Piazzolla, a bandoneon player who studied composition in Paris with Nadia Boulanger, transformed the genre in the 1950s and 1960s, quickening its (tempo), adding jazz harmonies and fugues and the sharp (staccato) accents of his \"nuevo\" style. Traditionalists accused him of killing the music they loved; concert halls embraced him. He wrote a (concerto) for bandoneon and orchestra, \"Aconcagua\", and a duo for (cello) and piano dedicated to Mstislav Rostropovich.", "zh": "这种音乐有它自己的圣徒。衣着（考究/dapper）的歌手卡洛斯·加德尔那（温文尔雅/debonair）的笑容和油亮的背头至今仍装点着咖啡馆的墙壁，他于1935年在声名最盛之时死于哥伦比亚的一场空难；阿根廷人说他“一天比一天唱得好”，他的录音充满了（悲怆/pathos）。班多钮手风琴演奏家阿斯托尔·皮亚佐拉曾在巴黎师从娜迪亚·布朗热学习作曲，他在20世纪50和60年代改造了这一音乐类型，加快了它的（节奏/tempo），加入了爵士和声与赋格，以及他“新”风格中尖锐的（断奏/staccato）重音。传统派指责他扼杀了他们热爱的音乐；音乐厅却接纳了他。他为班多钮手风琴与管弦乐队写了一部（协奏曲/concerto）《阿空加瓜》，还为（大提琴/cello）与钢琴写了一首献给姆斯季斯拉夫·罗斯特罗波维奇的二重奏。"}, {"en": "Buenos Aires takes high culture just as seriously. The Teatro Colón, which opened in 1908, is regularly ranked among the world's finest opera houses for its acoustics; visitors pass through a marble (foyer) into a horseshoe-shaped auditorium beneath a vast (chandelier), amid the (glitter) of gilt and red velvet. Enrico Caruso sang there, and many a young (tenor) from the provinces dreams of doing the same. The city has also produced classical stars. Daniel Barenboim, a pianist and conductor born in Buenos Aires in 1942, became one of the most celebrated (maestro)s of his age, and Martha Argerich, born a year earlier, is widely considered one of the greatest piano (virtuoso)s alive. Folk and sacred traditions meet in Ariel Ramírez's \"Misa Criolla\" of 1964, a mass set to Andean and pampas rhythms that is often performed in concert halls like an (oratorio).", "zh": "布宜诺斯艾利斯对高雅文化同样认真。1908年开幕的科隆剧院因其音响效果，经常跻身世界最佳歌剧院之列；观众穿过大理石（门厅/foyer），进入一座马蹄形观众厅，头顶是一盏巨大的（枝形吊灯/chandelier），四周是镀金与红色天鹅绒的（璀璨光芒/glitter）。恩里科·卡鲁索曾在这里演唱，许多来自外省的年轻（男高音/tenor）都梦想着有朝一日也能如此。这座城市还培养出了古典音乐明星。1942年生于布宜诺斯艾利斯的钢琴家兼指挥家丹尼尔·巴伦博伊姆成为他那个时代最著名的（大师/maestro）之一，比他早一年出生的玛尔塔·阿格里奇则被普遍认为是当今在世的最伟大的钢琴（演奏大师/virtuoso）之一。民间传统与宗教传统在阿列尔·拉米雷斯1964年创作的《克里奥尔弥撒》中交汇，这部配以安第斯和潘帕斯节奏的弥撒曲常常像一部（清唱剧/oratorio）那样在音乐厅上演。"}, {"en": "The countryside has its own myths. The gaucho, the cowboy of the pampas, is a national icon: in a woolen (poncho), with a knife tucked into his sash rather than a pistol in a (holster), he was so at home on horseback that writers compared him to a (centaur). José Hernández's epic poem \"Martín Fierro\", published in 1872, tells the story of a gaucho persecuted by the state in a series of sections, each a (canto) written in the meter of popular song, and Argentines celebrate a national Day of Tradition on Hernández's birthday. The poem draws on the payada, a duel between improvising singers with guitars, in which each verse is a (rejoinder) to the last and the (banter) can be (jocular) or cutting. Folk festivals still offer a (sampler) of rural rhythms, from the chacarera to the zamba.", "zh": "乡间也有它自己的神话。高乔人，即潘帕斯草原上的牛仔，是一个民族象征：他身披羊毛（斗篷/poncho），把刀插在腰带里，而不是把手枪别在（枪套/holster）中，他在马背上如此自在，以至于作家们把他比作（半人马/centaur）。何塞·埃尔南德斯1872年出版的史诗《马丁·菲耶罗》讲述了一个遭国家迫害的高乔人的故事，全诗分为若干章节，每一（诗章/canto）都按民歌的格律写成；阿根廷人在埃尔南德斯生日那天庆祝全国传统日。这首诗借鉴了“帕亚达”，即弹着吉他即兴对唱的歌手之间的较量，每一节都是对上一节的（反驳/rejoinder），（斗嘴/banter）可以是（诙谐的/jocular），也可以尖刻犀利。民俗节庆至今仍在呈现乡村节奏的（集锦/sampler），从查卡雷拉到赞巴。"}, {"en": "Argentina's literature punches far above its weight. Jorge Luis Borges, who was almost blind from a hereditary (ocular) condition by the time he became director of the national library in 1955, wrote stories that turned (metaphysics) into puzzles: a library containing every possible book; a man named Funes whose perfect memory needs no (mnemonics) and leaves him unable to think; and, in a one-paragraph fable, an empire whose (cartographer)s draw a map as large as the empire itself. His prose prizes compression, and an (ellipsis) often says more than a page. In an essay on Kafka he argued that every writer creates his own (precursor)s. He never won the Nobel prize. When he died in Geneva in 1986, the (testator) left his estate to his widow, María Kodama.", "zh": "阿根廷文学的分量远超其国力。豪尔赫·路易斯·博尔赫斯在1955年出任国家图书馆馆长时，已因遗传性（眼部/ocular）疾病几近失明，他写的故事把（形而上学/metaphysics）变成了谜题：一座收藏了一切可能之书的图书馆；一个名叫富内斯的人，他完美的记忆根本无需（记忆术/mnemonics），却也让他无法思考；还有一则仅有一段的寓言，讲一个帝国的（制图师/cartographer）们画出了一幅与帝国本身一样大的地图。他的文字崇尚凝练，一个（省略号/ellipsis）往往胜过一整页。他在一篇关于卡夫卡的随笔中提出，每位作家都创造了自己的（先驱/precursor）。他从未获得诺贝尔奖。1986年他在日内瓦去世，这位（立遗嘱人/testator）把遗产留给了遗孀玛丽亚·儿玉。"}, {"en": "Borges is not alone. Domingo Faustino Sarmiento, a 19th-century president who saw himself as the nation's schoolmaster and (tutor), recruited American teachers to found schools and wrote \"Facundo\", a polemic that cast Argentina's history as a struggle between civilization and barbarism. Julio Cortázar's \"Hopscotch\" invited readers to choose their own order of chapters, and Quino's comic strip \"Mafalda\", about a precocious girl who hates soup and frets about world peace, is admired for its (draftsmanship) as much as its wit. Every era has had its (potboiler) novelists and the odd (versemonger) too. In a nation of talkers the (raconteur) is a respected figure, and a (synopsis) of a novel offered at a dinner party is seldom a mere (précis).", "zh": "博尔赫斯并非孤例。19世纪的总统多明戈·福斯蒂诺·萨缅托自视为国家的校长和（导师/tutor），他招募美国教师来创办学校，还写下了论战之作《法昆多》，把阿根廷的历史描绘成文明与野蛮之间的斗争。胡利奥·科塔萨尔的《跳房子》邀请读者自己选择章节的阅读顺序；季诺的连环漫画《玛法达》讲述了一个讨厌喝汤、为世界和平忧心忡忡的早慧女孩，它的（绘画功力/draftsmanship）与它的机智同样受人推崇。每个时代也都有它的（粗制滥造的通俗小说/potboiler）作者和偶尔冒出的（蹩脚诗人/versemonger）。在一个健谈者的国度，（善于讲故事的人/raconteur）备受尊敬；在晚宴上讲述一部小说的（梗概/synopsis），很少会只是一份（摘要/précis）。"}, {"en": "Porteños also speak a language of their own. Lunfardo, the city's (vernacular), was born in the (gutter), among thieves and immigrants, and absorbed Italian words by (osmosis): Argentines say \"laburo\" for work, from the Italian \"lavoro\", and \"fiaca\" for idleness. A (lexicographer) at the Academia Porteña del Lunfardo, founded in 1962, catalogues thousands of such terms, and scholars of (linguistics) note that the Spanish of Buenos Aires is spoken with an Italian lilt. The city's other great passion is talking about itself. Argentina has more psychologists per head than any other country, and psychoanalysis, Freudian and Lacanian, is so widespread that a (practitioner) can be found on almost every block of a leafy corner of Palermo nicknamed \"Villa Freud\". An economy that delivers a crisis every decade gives citizens plenty to discuss on the couch; whether it causes the odd (neurosis) or merely an (ulcer) is a matter for debate.", "zh": "波特诺人还说着一种自己的语言。这座城市的（方言/vernacular）隆法多诞生于（社会底层/gutter），诞生于小偷和移民之中，并通过（潜移默化/osmosis）吸收了意大利语词汇：阿根廷人把工作叫作“laburo”，来自意大利语的“lavoro”，把懒散叫作“fiaca”。成立于1962年的布宜诺斯艾利斯隆法多学院有一位（词典编纂者/lexicographer），收录了数千个这样的词语，（语言学/linguistics）学者们指出，布宜诺斯艾利斯的西班牙语带着意大利语的抑扬顿挫。这座城市的另一大爱好是谈论自己。阿根廷人均心理学家数量居世界之首，弗洛伊德派和拉康派的精神分析如此盛行，以至于在巴勒莫一个绿树成荫、绰号“弗洛伊德村”的角落，几乎每个街区都能找到一位（执业医师/practitioner）。一个每十年就来一场危机的经济，给了公民们在躺椅上倾诉的大量话题；至于它究竟会导致偶发的（神经官能症/neurosis），还是仅仅引起（溃疡/ulcer），则见仁见智。"}, {"en": "Football is the national religion, and Diego Maradona its most revered saint. An (imp) of a player from a shantytown on the edge of Buenos Aires, he scored both the \"hand of God\" goal and a slalom through the English defense, later voted the goal of the century, at the World Cup of 1986, four years after the Falklands war. His (flair) on the pitch was matched by chaos off it, from cocaine addiction to feuds recounted in his (memoir), \"Yo Soy El Diego\". The Maradonian Church, founded by fans in 1998, counts its years from his birth, and each (idolater) recites a version of the Lord's Prayer in his honor. His death in 2020, aged 60, weeks after brain surgery, led to the prosecution of seven members of his medical team, accused of leaving him to die at home in poor conditions. The first trial collapsed in an (imbroglio) in 2025 after it emerged that one of the judges had taken part in a documentary about the case, a (cameo) that cost her her job; a new trial began in April 2026.", "zh": "足球是这个国家的宗教，迭戈·马拉多纳则是其中最受尊崇的圣人。这位出身布宜诺斯艾利斯边缘一处棚户区的（顽童/imp）式球员，在1986年世界杯上既打进了“上帝之手”进球，又上演了一次穿越英格兰防线的连过数人，这个进球后来被评为“世纪进球”，而那时距马岛战争仅仅过去四年。他在球场上的（天赋灵气/flair）与场外的混乱不相上下，从可卡因成瘾到他在（回忆录/memoir）《我是迭戈》中讲述的种种恩怨。球迷们于1998年创立的“马拉多纳教会”从他出生那年开始纪年，每一位（偶像崇拜者/idolater）都会诵读一段献给他的改编版主祷文。他在2020年去世，享年60岁，距他接受脑部手术仅几周，此事导致他医疗团队的七名成员遭到起诉，他们被指控让他在恶劣条件下死在家中。2025年，第一次审判在一场（混乱纠葛/imbroglio）中流产，原因是有人发现其中一名法官参与拍摄了一部关于此案的纪录片，这次（客串/cameo）让她丢了饭碗；新的审判于2026年4月开始。"}, {"en": "Club football is a darker world. Boca Juniors and River Plate draw fanatical crowds, but the \"barras bravas\", organized gangs of fans who control the (bleachers), make money from parking, merchandise and tickets, and some of their leaders behave like a (racketeer); since 2013 most league matches have been played without away fans because of violence. There is an old (symbiosis) between clubs and politicians, who have used the barras as muscle at rallies, though a politician who turns up at a match risks a chorus of (boo)s. The game's (ethos) is ferociously competitive: any result short of victory is treated as (inferior), and players routinely play through injury, keeping physiotherapists busy with the (anterior) cruciate ligament at the front of the knee and its (posterior) twin at the back, and with prescriptions for (painkiller)s. Other sports struggle for money and attention, although Argentina has fielded world-class teams in rugby, hockey and basketball, and (athletics) produces the occasional Olympic finalist.", "zh": "俱乐部足球则是一个更黑暗的世界。博卡青年和河床吸引着狂热的观众，但被称为“巴拉布拉瓦”的有组织球迷团伙控制着（看台/bleachers），从停车、周边商品和门票中牟利，其中一些头目的行径活像（敲诈勒索者/racketeer）；由于暴力事件，自2013年以来大多数联赛比赛都禁止客队球迷入场。俱乐部与政客之间有着由来已久的（共生关系/symbiosis），政客们曾把这些球迷团伙当作集会上的打手，不过，现身球场的政客也可能招来一片（嘘声/boo）。这项运动的（精神气质/ethos）竞争激烈到了极点：凡是没赢的结果都被视为（低人一等/inferior），球员们常常带伤上阵，让理疗师们忙于处理膝盖前方的（前/anterior）十字韧带和后方的（后/posterior）十字韧带，还要开出（止痛药/painkiller）。其他运动则难以争取到资金和关注，尽管阿根廷在橄榄球、曲棍球和篮球方面都拥有世界级的队伍，（田径/athletics）也偶尔能产生奥运会决赛选手。"}, {"en": "Argentina also gave the world a pope. Jorge Mario Bergoglio, the archbishop of Buenos Aires, was elected in 2013 as Francis, the first pontiff from the Americas. A (pastor) who preferred buses to limousines, he brought the plain style of his ministry in the slums to the Vatican; his sermons made the arcane art of (homiletics) look simple, being short and full of everyday images, and his manner was warm, even (avuncular). He urged priests to treat (auricular) confession as an act of mercy rather than an interrogation. Milei once called him the representative of evil on earth, then embraced him at the Vatican in 2024. Francis never made the (detour) home as pope, to the disappointment of his compatriots. When he died in April 2025, Buenos Aires mourned a son it had not seen for 12 years, and his face still adorns many a (souvenir) in the city's markets.", "zh": "阿根廷还为世界贡献了一位教宗。布宜诺斯艾利斯总主教豪尔赫·马里奥·贝尔格里奥于2013年当选教宗方济各，成为第一位来自美洲的教宗。这位宁坐公交车也不坐豪华轿车的（牧者/pastor），把他在贫民窟传教时的朴素作风带到了梵蒂冈；他的讲道简短，充满日常意象，让深奥的（讲道学/homiletics）显得简单易懂，他的举止亲切温暖，甚至像一位（慈祥的长辈/avuncular）。他敦促神父们把（私下/auricular）告解当作施行慈悲之举，而不是一场审讯。米莱曾称他为邪恶在人间的代表，后来又在2024年于梵蒂冈与他拥抱。方济各当上教宗后从未（绕道/detour）回国，令同胞们大失所望。2025年4月他去世时，布宜诺斯艾利斯为这位12年未曾见过的儿子哀悼，他的面容至今仍装点着城中市场里的许多（纪念品/souvenir）。"}, {"en": "Then there is the food. The asado, a ritual of grilled meat that can last all afternoon, is the center of Argentine social life. The asador, almost always a man, cooks over embers of hardwood rather than flames, so that the meat takes on a smoky (char) without burning; sausages and sweetbreads go on first, then ribs and flank, turned with (tongs), while a whole lamb may be roasted beside the fire on an iron cross or a (skewer). The cuts are prepared with a (cleaver) and a sharp knife, and the (viands) arrive in waves, each a (sizzler) fresh from the grill. Argentines eat around 50kg of beef per head a year, among the highest rates in the world, although chicken and pork have been gaining ground; cattle once fattened on the grass of the pampas, but these days much of their (provender) is grain in feedlots. Practitioners of (dietetics) despair. Argentines are unbothered.", "zh": "然后是食物。烤肉宴“阿萨多”是一种可以持续整个下午的烤肉仪式，是阿根廷社交生活的中心。掌火的烤肉师几乎总是男人，他用硬木的炭火而非明火烤肉，让肉带上烟熏的（焦香/char）而不至烤糊；香肠和胸腺先上架，然后是肋排和腹排，用（夹子/tongs）翻面，而整只羊羔可能被架在火边的铁十字架或（烤叉/skewer）上烤制。肉块用（剁肉刀/cleaver）和一把锋利的刀切好，（佳肴/viands）一波接一波地端上来，每一道都是刚离开烤架、滋滋作响的（烤物/sizzler）。阿根廷人每年人均吃掉约50公斤牛肉，位居世界前列，尽管鸡肉和猪肉一直在抢占份额；牛群过去在潘帕斯草原上吃草长膘，如今它们的（饲料/provender）多半是育肥场里的谷物。（营养学/dietetics）专家们对此无可奈何。阿根廷人却毫不在意。"}, {"en": "Drinks have their own rituals. Mate, a bitter herbal infusion, is shared from a gourd passed around a circle of friends, each taking a (sip) through a metal straw before handing it back to the server, who refills it with hot water until only the (dregs) of the leaves are left; its bitterness makes newcomers (pucker). Wine is the other national drink. Malbec, a grape from south-west France, found its true home in the high vineyards of Mendoz
