a, where a (vintner) can grow grapes more than 1,500 meters above sea level and any (connoisseur) can find bottles in a Mendoza (cellar) to rival French wines at a fraction of the price; admirers describe the best as a dark (nectar) of plum and violet. At home Argentines have long diluted cheap red with soda water from a siphon, poured from a (pitcher) shaped like a penguin. For dessert there is ice cream, Italian in origin and Argentine in excess, and dulce de leche is the favorite (scoop).", "zh": "饮品也有它们的仪式。马黛茶是一种苦味的草本饮料，盛在葫芦里，在一圈朋友之间传递，每个人用金属吸管（啜饮/sip）一口，再把它递回给负责泡茶的人，后者不断续上热水，直到只剩下茶叶的（残渣/dregs）；它的苦味让新手（皱起嘴/pucker）。葡萄酒是另一种国饮。原产于法国西南部的马尔贝克葡萄在门多萨的高海拔葡萄园里找到了真正的归宿，那里的（酿酒师/vintner）能在海拔1500米以上的地方种植葡萄，任何（行家/connoisseur）都能在门多萨的（酒窖/cellar）里找到可与法国葡萄酒媲美、价格却只是零头的酒；爱好者把其中的佳酿形容为带有李子和紫罗兰香气的深色（琼浆/nectar）。在家里，阿根廷人长期以来习惯用虹吸瓶里的苏打水兑廉价红酒，再用企鹅形状的（酒壶/pitcher）斟酒。饭后甜点是冰淇淋，源于意大利，却被阿根廷人吃到了极致，而焦糖牛奶酱口味是最受欢迎的那（一勺/scoop）。"}, {"en": "The social (mores) of Buenos Aires are more liberal than its Catholic heritage might suggest. In 2010 Argentina became the first country in Latin America to legalize same-sex marriage, and in 2012 it passed one of the world's most permissive gender-identity laws; the city's (queer) nightlife is among the liveliest on the continent. Porteños dine at ten at night and (roister) until dawn; (slumber) is for the weekend. The city's appetite for cosmetic surgery is famous, and a discreet (nip) and tuck raises few eyebrows. Television is ruled by long-running talk shows: one (presenter), Mirtha Legrand, began hosting celebrity lunches on air in 1968 and was still appearing in her late 90s. And Argentines love a good (caper). In 2006 a gang tunneled into a bank in the suburb of Acassuso, took hostages, emptied the safe-deposit boxes and escaped through the storm drains, leaving a note: \"In a neighborhood of rich folk, without weapons or (rancor), it's only money, not love.\" The story became a hit film and a national rib-(tickler). Che Guevara, born in Rosario, gazes from many a (poster) in the city's markets, though few Argentines share his politics.", "zh": "布宜诺斯艾利斯的社会（风俗/mores）比其天主教传统所暗示的更为开放。2010年，阿根廷成为拉丁美洲第一个承认同性婚姻合法的国家，2012年又通过了全球最宽松的性别认同法之一；这座城市的（酷儿/queer）夜生活是南美大陆最热闹的之一。波特诺人晚上十点才吃晚饭，然后（狂欢/roister）到天亮；（酣睡/slumber）是留给周末的。这座城市对整容手术的热衷是出了名的，悄悄做个（拉皮/nip）紧致之类的小手术，没人会大惊小怪。电视由长寿的谈话节目主宰：一位（主持人/presenter）米尔塔·莱格朗于1968年开始在电视上主持名人午餐节目，年近百岁时仍在出镜。阿根廷人还喜爱精彩的（大劫案/caper）故事。2006年，一伙人挖地道进入阿卡苏索郊区的一家银行，劫持人质，洗劫了保险箱，然后经由雨水排水道逃之夭夭，留下一张字条：“在富人区，不带武器，不怀（怨恨/rancor），只为钱财，无关爱情。”这个故事被拍成了一部卖座电影，成了全国人民的（笑料/tickler）。出生于罗萨里奥的切·格瓦拉在城中市场的许多（海报/poster）上凝视着人们，尽管很少有阿根廷人认同他的政治主张。"}, {"en": "Tourists, who flock to Buenos Aires when the peso is cheap and stay away when it is dear, cannot see it properly on a single (layover). In La Boca, the old port district, the corrugated-iron houses of the Caminito are painted in colors so garish that they might be the work of a (daubster), though the custom is said to have begun when dockworkers used leftover ship paint. Cafés and steakhouses (cater) to visitors, street dancers perform for tips and idle young men (loiter) on corners. In San Telmo, the oldest neighborhood, crumbling (plaster) peels from colonial façades, while in Palermo a (curator) at MALBA, a museum of Latin American art founded by a businessman-collector, can show visitors Frida Kahlo's self-portrait with a monkey and a parrot. The city also has a place in the history of cinema: in 1917 Quirino Cristiani, an Italian-born cartoonist, made \"El Apóstol\", the world's first animated feature film, a satire of the president of the day. No copy survives, but it once flickered from a (projector) in a Buenos Aires picture house.", "zh": "游客们在比索便宜时蜂拥而至，比索昂贵时则避而远之，但仅凭一次（中途停留/layover）是无法好好领略布宜诺斯艾利斯的。在老港区拉博卡，卡米尼托街上的波纹铁皮房屋被漆成艳丽俗气的颜色，简直像是出自某个（拙劣画匠/daubster）之手，不过据说这一习俗始于码头工人用剩余的船漆粉刷房子。咖啡馆和牛排馆（迎合/cater）游客的口味，街头舞者表演讨赏，无所事事的年轻人在街角（闲荡/loiter）。在最古老的街区圣特尔莫，殖民时期建筑的立面上，破败的（灰泥/plaster）片片剥落；而在巴勒莫，由一位商人收藏家创办的拉丁美洲艺术博物馆MALBA的一位（策展人/curator），可以向参观者展示弗里达·卡罗与猴子和鹦鹉的自画像。这座城市在电影史上也占有一席之地：1917年，意大利裔漫画家基里诺·克里斯蒂亚尼制作了世界上第一部动画长片《使徒》，讽刺当时的总统。如今已没有拷贝存世，但它曾在布宜诺斯艾利斯的一家影院里从（放映机/projector）中闪烁投出。"}, {"en": "Beyond the cities lies some of the wildest country in the Americas. In Patagonia the Andean (condor), with a wingspan of up to three meters, soars over the (angular) granite spires of Mount Fitz Roy, and the (cougar), known locally as the puma, hunts guanacos in the (crepuscular) hours of dusk and dawn; hikers in its national parks are more likely to see the cat's (spoor) than the animal itself. East of the Andes the land descends toward the Atlantic in a series of plateaus, each ending in a wind-scoured (scarp). Ranchers once hunted pumas with the dogo argentino, a powerful white dog bred in Córdoba in the 1920s for big game; despite its snowy coat, it is no (albino).", "zh": "城市之外，是美洲最荒野的一些土地。在巴塔哥尼亚，翼展可达三米的安第斯（神鹫/condor）翱翔于菲茨罗伊峰（棱角分明的/angular）花岗岩尖峰之上，而当地人称为“普马”的（美洲狮/cougar）在黄昏和黎明这些（晨昏/crepuscular）时分捕猎原驼；在该地区的国家公园里，徒步者更有可能看到这种猫科动物的（足迹/spoor）而不是它本身。在安第斯山以东，大地以一级级台地的形式向大西洋下降，每级台地都以一道被风侵蚀的（陡崖/scarp）作结。牧场主们曾用阿根廷杜高犬猎捕美洲狮，这是一种20世纪20年代在科尔多瓦培育的强壮白色猎犬，专门用于猎捕大型猎物；尽管毛色雪白，它却并非（白化动物/albino）。"}, {"en": "Patagonia was settled late and sparsely. Welsh immigrants arrived in Chubut in 1865, and their descendants still sing in a (choir) at the annual eisteddfod in Trelew. British and Spanish ranchers followed, and sheep farming is still a mainstay of the region, with gangs of shearers who can (shear) hundreds of sheep a day. The Perito Moreno glacier is named after Francisco Moreno, an explorer and (surveyor) who served as the government's expert, or \"perito\", in its border dispute with Chile. In the (damp) forests on the Andean slopes grows the alerce, a (conifer) that can live for more than 3,000 years. Climate change is taking its toll: summers of drought turn the forests into (tinder), and wildfires have repeatedly ravaged the Andean lakes district, while in the far south a seasonal thinning of the ozone layer over Antarctica exposes the human (epidermis) to fierce ultraviolet light.", "zh": "巴塔哥尼亚的开发来得晚，人烟也稀少。威尔士移民于1865年抵达丘布特，他们的后代至今仍在特雷利乌一年一度的威尔士诗歌音乐节上组成（合唱团/choir）歌唱。英国和西班牙的牧场主随后到来，养羊至今仍是该地区的支柱产业，熟练的剪毛工每天能（剪/shear）数百只羊的羊毛。佩里托·莫雷诺冰川以弗朗西斯科·莫雷诺的名字命名，这位探险家和（勘测员/surveyor）曾在与智利的边界争端中担任政府的专家，即“佩里托”。在安第斯山坡（潮湿的/damp）森林里，生长着智利肖柏，这种（针叶树/conifer）能活3000多年。气候变化正在造成损害：干旱的夏季把森林变成（引火物/tinder），野火一再肆虐安第斯湖区，而在遥远的南方，南极上空臭氧层的季节性变薄，使人的（表皮/epidermis）暴露在强烈的紫外线之下。"}, {"en": "Argentina's ambitions stretch farther south still. The country claims a slice of Antarctica, and its official maps (encompass) a wedge of the (polar) continent that clashes with British and Chilean claims; in 1978 the government flew a pregnant woman to its Esperanza base so that the first person born on the continent, Emilio Palma, would be Argentine. The country is some 3,700km long, and a traveler heading south by (compass) from the subtropical north passes through almost every climate on earth before reaching Ushuaia, which lies closer to the South Pole than to the (equator). The Atlantic coast is gentler. Each summer millions of porteños head for the Atlantic resorts of Buenos Aires province, where a (bather) braves water that is rarely much warmer than 20°C and a sea (zephyr) cools the evenings; farther south, at Puerto Madryn, a (diver) can swim with sea lions, and southern right whales come to calve in the sheltered gulfs of the Valdés peninsula.", "zh": "阿根廷的雄心还延伸到更南的地方。这个国家对南极洲的一块地方提出主权要求，其官方地图（涵盖/encompass）了这片（极地/polar）大陆上的一块楔形区域，与英国和智利的主张相冲突；1978年，政府把一名孕妇空运到其埃斯佩兰萨基地，好让第一个在这片大陆上出生的人埃米利奥·帕尔马成为阿根廷人。这个国家南北长约3700公里，一位旅行者从亚热带的北方按（罗盘/compass）一路南行，几乎会穿越地球上所有的气候带，最后抵达乌斯怀亚，那里距南极点比距（赤道/equator）还近。大西洋沿岸则较为温和。每年夏天，数百万波特诺人涌向布宜诺斯艾利斯省的大西洋度假胜地，那里的（海水浴者/bather）要勇敢面对很少超过20°C的海水，傍晚则有海上的（和风/zephyr）带来凉意；再往南，在马德林港，（潜水员/diver）可以与海狮同游，南露脊鲸则来到瓦尔德斯半岛避风的海湾里产仔。"}, {"en": "The northeast is wetter and wilder. The Iberá wetlands in Corrientes province, a vast mosaic of lagoons, floating islands and (swamp), have become a laboratory for rewilding. Hunting had wiped out the jaguar, the Americas' only (panther), from the province by the mid-20th century; since 2021 a conservation group founded with money from Douglas and Kristine Tompkins, two American philanthropists, has released jaguars bred in captivity, and wild-born cubs from more than one (litter) now roam free. The giant (otter), absent from Argentina for decades, has been brought back too, and the marshes are home to the maned wolf, a long-legged canid with a (ginger) coat. Capybaras, the world's largest rodents, (scutter) into the water at the approach of a boat, and many a park (ranger) is a former hunter turned guardian.", "zh": "东北部更湿润，也更荒野。科连特斯省的伊贝拉湿地由潟湖、浮岛和（沼泽/swamp）组成，宛如一幅巨大的马赛克，已成为野化实验的试验场。到20世纪中叶，狩猎已让美洲豹，也就是美洲唯一的（豹属猛兽/panther），在该省绝迹；自2021年以来，一个由美国慈善家道格拉斯·汤普金斯和克里斯蒂娜·汤普金斯出资创办的保护组织放归了人工繁育的美洲豹，如今已有不止一（窝/litter）在野外出生的幼崽自由漫游。在阿根廷绝迹几十年的巨型（水獭/otter）也被重新引入，沼泽里还生活着鬃狼，一种长腿的犬科动物，长着一身（姜黄色/ginger）的毛。世界上最大的啮齿动物水豚一见有船靠近，就（匆匆窜/scutter）入水中，而许多公园（护林员/ranger）都是由猎人转变而来的守护者。"}, {"en": "Farther north, the Iguazú river plunges over some 275 waterfalls on the border with Brazil, a (spectacular) wall of water nearly 3km wide; above the falls the river churns through (rapids), and in the surrounding forest the call of the (howler) monkey carries for miles. The great Paraná river, which drains much of the continent, winds south in a slow (meander) to the delta at Tigre, where weekend rowers dip an (oar) among the islands. The capital's own waterways are less idyllic. The Riachuelo, which marks the city's southern edge, has been notorious for its (malodor) since tanneries and salting plants dumped waste into it in the 19th century, and a heavy (downpour) can still flood whole neighborhoods, because streams such as the Maldonado (arroyo), buried beneath the streets in the 1930s, overflow their culverts. In spring the purple blossom of the jacaranda turns many a street into a (bower), and the (sheer) beauty of the city on a November evening is hard to resist.", "zh": "再往北，伊瓜苏河在与巴西接壤的边境上从约275道瀑布倾泻而下，形成一道宽近3公里、（壮观的/spectacular）水墙；瀑布上游的河水在（急流/rapids）中翻腾，周围森林里（吼猴/howler）的叫声可以传出数英里。流经南美大陆大片地区的巴拉那河以缓慢的（蜿蜒/meander）之势南流，直到蒂格雷三角洲，周末划船的人们在岛屿之间划动（船桨/oar）。首都自己的水道就没那么田园诗意了。构成城市南缘的里亚丘埃洛河，自19世纪制革厂和腌肉厂向河中倾倒废物以来，就以其（恶臭/malodor）臭名昭著；一场（倾盆大雨/downpour）至今仍能淹没整片街区，因为像马尔多纳多（溪/arroyo）这样在20世纪30年代被埋入街道之下的溪流，会漫出它们的涵管。春天，蓝花楹的紫色花朵把许多街道变成（凉亭/bower）般的花廊，11月傍晚这座城市那（纯粹的/sheer）美丽令人难以抗拒。"}, {"en": "Argentina's geology is a treasure trove. Some 4,000 years ago a shower of iron meteorites struck what is now Chaco province, leaving a field of craters known as Campo del Cielo, the largest about 100 meters in (diameter); the biggest surviving fragment, a (boulder) of iron weighing around 30 metric tons, is among the heaviest meteorites ever found, and each (crater) still draws scientists and treasure-hunters. Patagonia is a graveyard of giants. Patagotitan, a titanosaur discovered in Chubut in 2012, was among the largest animals ever to walk the earth, a beast whose (torso) rested on thigh bones taller than a man, and Giganotosaurus, found in Neuquén, was a (predator) that rivaled Tyrannosaurus rex in size. Volcanic heat still bubbles near the surface: on the flanks of Domuyo, the highest peak in Patagonia, hot springs steam and the occasional (geyser) erupts.", "zh": "阿根廷的地质是一座宝库。约4000年前，一阵铁陨石雨落在今天的查科省，留下了一片名为“天空之野”的陨石坑群，其中最大的一个（直径/diameter）约100米；现存最大的碎块是一块重约30吨的铁质（巨石/boulder），跻身有史以来发现的最重陨石之列，每一个（陨石坑/crater）至今仍吸引着科学家和寻宝者。巴塔哥尼亚是巨兽的墓场。2012年在丘布特发现的巴塔哥巨龙是一种泰坦巨龙，属于曾在地球上行走过的最大动物之列，它的（躯干/torso）由比人还高的大腿骨支撑；在内乌肯发现的南方巨兽龙则是一种体型堪与霸王龙匹敌的（掠食者/predator）。火山热量至今仍在地表附近涌动：在巴塔哥尼亚最高峰多穆约山的山坡上，温泉蒸汽袅袅，偶尔还有（间歇泉/geyser）喷发。"}, {"en": "Relations with the neighbors have been stormy. In 1978 Argentina and Chile came close to war over three small islands at the mouth of the Beagle Channel, after Argentina rejected the ruling of an (arbiter), a panel of international judges whose award had been ratified by the British crown under a treaty of 1902. War was averted only when Pope John Paul II agreed to act as (intercessor), and under papal (auspices) the two countries signed a peace treaty in 1984. A quarrel with Uruguay over a (pulp) mill on the river the two countries share led residents of the town of Gualeguaychú to blockade the bridge between them for more than three years, until the International Court of Justice ruled on the dispute in 2010. Mercosur, the trade bloc Argentina founded with Brazil, Paraguay and Uruguay in 1991, has disappointed; Milei, who has called Brazil's president, Luiz Inácio Lula da Silva, a \"communist\", likes to (pester) its members to let him strike trade deals of his own.", "zh": "与邻国的关系一直风波不断。1978年，阿根廷和智利因比格尔海峡入口处的三个小岛几乎兵戎相见，起因是阿根廷拒绝接受一位（仲裁者/arbiter）的裁决，那是一个由国际法官组成的仲裁庭，其裁决已依照1902年的一项条约由英国王室批准。直到教宗若望·保禄二世同意充当（调停人/intercessor），战争才得以避免；两国在教廷的（主持/auspices）下于1984年签署了和平条约。与乌拉圭围绕两国界河上一座（纸浆/pulp）厂的争执，导致瓜莱瓜伊丘镇的居民封锁两国之间的大桥长达三年多，直到2010年国际法院就此争端作出裁决。阿根廷于1991年与巴西、巴拉圭和乌拉圭共同创立的贸易集团南方共同市场令人失望；米莱曾称巴西总统路易斯·伊纳西奥·卢拉·达席尔瓦为“共产主义者”，他喜欢（缠着/pester）其他成员国，要求允许他自行签订贸易协定。"}, {"en": "Milei's foreign policy rests on a Washington-Buenos Aires (axis). He has visited Donald Trump repeatedly, aligned Argentina with America and Israel at the UN, and in 2025 agreed a framework trade deal with the United States. His government keeps Washington lobbyists on (retainer) and treats the White House as its most important (interlocutor) abroad; its foreign minister, whose title in Spanish translates as (chancellor), is a former banker chosen as much for his contacts on Wall Street as for diplomatic experience. China, Argentina's second-biggest trading partner, is a trickier matter. American officials suspect (ulterior) motives behind a Chinese-run space station in Neuquén province, built under an agreement with Fernández de Kirchner's government, and Washington continues to (badger) Buenos Aires to wind down its currency swap with Beijing. Milei's views (apropos) China have mellowed: having vowed as a candidate not to deal with \"communists\", he has found that Chinese money and Chinese buyers of soybeans are hard to do without.", "zh": "米莱的外交政策以华盛顿—布宜诺斯艾利斯（轴心/axis）为基础。他多次拜访唐纳德·特朗普，在联合国与美国和以色列保持一致，并于2025年与美国达成了一项框架贸易协议。他的政府付（聘用费/retainer）雇着华盛顿的游说者，并把白宫视为其在国外最重要的（对话者/interlocutor）；外交部长的西班牙语头衔直译过来是（大臣/chancellor），现任者是一名前银行家，他获选既是因为华尔街的人脉，也是因为外交经验。中国是阿根廷的第二大贸易伙伴，关系更为棘手。美国官员怀疑，中国在内乌肯省运营的一座太空站背后有（别有用心的/ulterior）动机，该站是根据与费尔南德斯·德基什内尔政府达成的协议建造的；华盛顿还在不断（纠缠/badger）布宜诺斯艾利斯，要求其逐步终止与北京的货币互换。米莱（关于/apropos）中国的看法已经缓和：作为候选人时他曾发誓不与“共产主义者”打交道，如今却发现，中国的资金和购买大豆的中国买家都不可或缺。"}, {"en": "So what is the (prognosis)? A (sober) assessment must give Milei credit. He has done what many thought impossible: balanced the budget, broken the momentum of runaway inflation and persuaded a majority of voters, at least in 2025, that austerity was the price of normality. But beauty is in the eye of the (beholder), and to the many Argentines whose wages have not recovered, the miracle looks thin. Economies, like bodies, seek (homeostasis), and Argentina's has been knocked off balance so often that recovery takes time. Three things could (hinder) it: a peso kept too strong for too long, which hurts exporters outside energy and farming and could end, as so often before, in a disorderly devaluation; political fatigue; and (hubris), the belief that a midterm victory licenses the government to ignore Congress, the governors and its critics. The challenge for the coming year is to (steer) between these hazards. There is no need to (belabor) the point: every previous stabilization in Argentina has ultimately failed.", "zh": "那么，（预后/prognosis）如何？（冷静的/sober）评估必须给米莱记上一功。他做到了许多人认为不可能的事：平衡了预算，打破了失控通胀的势头，并且至少在2025年说服了多数选民，紧缩是回归正常的代价。但美不美全在（观者/beholder）眼中，对于许多工资尚未恢复的阿根廷人来说，这个奇迹显得单薄。经济就像人体一样，会寻求（内稳态/homeostasis），而阿根廷的经济屡屡失衡，复苏需要时间。有三件事可能（阻碍/hinder）复苏：比索长期过强，伤害能源和农业以外的出口商，并可能像以往多次那样，以一场无序贬值告终；政治疲劳；以及（傲慢自大/hubris），即认为中期选举的胜利赋予了政府无视国会、省长和批评者的许可。未来一年的挑战在于在这些风险之间（掌舵前行/steer）。无需（赘述/belabor）：阿根廷以往的每一次稳定计划最终都失败了。"}, {"en": "Yet history need not repeat itself. Argentina's problems are institutional rather than cultural: governments that change the rules whenever it suits them, courts that bend to power and a political class that prefers (palaver) to reform. Because electoral districts follow provincial borders, politicians have no need to (gerrymander); they rewrite electoral calendars and budgets instead. What would (render) the current reforms lasting is a broad consensus that outlives any single president, a rare thing in a country where each new government tends to undo the work of the last. Take a (gander) at the fundamentals, energy, minerals, farmland and talent, and it is hard not to (infer) that Argentina could be rich again. Every past bonanza, though, has ended with a (bump). In a country named after silver, silver linings have a way of tarnishing. The task for Milei, and for whoever follows him, is to keep this one bright.", "zh": "然而，历史未必会重演。阿根廷的问题是制度性的，而非文化性的：政府只要对自己有利就改变规则，法院屈从于权力，政治阶层宁愿（空谈/palaver）也不愿改革。由于选区与省界重合，政客们无需（不公正地划分选区/gerrymander）；他们改写的是选举日程和预算。能（使/render）当前改革持久的，是一种比任何一位总统都更长久的广泛共识，而在一个每届新政府往往都要推翻上一届成果的国家，这种共识实属罕见。（瞧一瞧/gander）那些基本面，能源、矿产、农田和人才，就很难不（推断/infer）阿根廷可以再度富裕。然而，以往的每一轮繁荣都以一次（颠簸/bump）告终。在一个以白银命名的国家，乌云的银边总是容易失去光泽。米莱以及他的继任者的任务，就是让这一次的银边保持闪亮。"}];
const HAS_TITLE = true;
const SUBTITLE_EN = "";
const SUBTITLE_ZH = "";

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  if (typeof SUBTITLE_EN !== 'undefined' && SUBTITLE_EN) {
    const sub = document.createElement('div');
    sub.className = 'book-subtitle';
    sub.textContent = SUBTITLE_EN;
    div.appendChild(sub);
  }
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  if (typeof SUBTITLE_ZH !== 'undefined' && SUBTITLE_ZH) {
    const subZh = document.createElement('div');
    subZh.className = 'zh-subtitle';
    subZh.textContent = SUBTITLE_ZH;
    div.appendChild(subZh);
  }
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-silver-linings-v1';
const LS_OLD_KEY = 'audiobook-silver-linings-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
</body>
</html>
