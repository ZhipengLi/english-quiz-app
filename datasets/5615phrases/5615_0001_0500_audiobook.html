<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blooms, booms and busts — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>Blooms, booms and busts</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "Blooms, booms and busts", "zh": "繁花、繁荣与崩盘"}, {"en": "Four centuries of speculative frenzies, from Dutch tulips to artificial intelligence, hold uncomfortable lessons for today's investors", "zh": "从荷兰郁金香到人工智能，四个世纪的投机狂热给今天的投资者留下令人不安的教训"}, {"en": "In the first week of February 1637 an auctioneer in a Haarlem tavern held up a lot of tulip bulbs and waited for a bid that never came. Within days the trade that the Dutch had nicknamed windhandel, or “dealing in wind”, had seized up, and contracts struck at fantastical prices, scratched with a (nib) in (crabbed) handwriting, were worth little more than the paper they were written on. The object of all this passion was an (exotic) import from the Ottoman empire, a flower prized at the sultan's court long before it was (cultivated) in Dutch gardens. It was a strange foundation for a fortune. Unlike the (gardenia), whose heavy (aroma) can fill a room, most tulips are all but (unscented); anyone seeking an (aromatic) obsession could have chosen another flower. What made a tulip (celebrated) was its looks, and above all the (striated) petals of the so-called “broken” varieties, flamed with (magenta), purple or crimson on a white ground as if painted by hand.", "zh": "1637年2月的第一周，哈勒姆一家酒馆的拍卖师举起一批郁金香球茎，等候竞价，却始终无人出价。几天之内，荷兰人称为windhandel、意即“风中交易”的买卖便陷入停滞。那些以惊人高价订立、用（笔尖）和（潦草的）字迹写下的合同，几乎只剩下纸张本身的价值。引发这一切狂热的，是从奥斯曼帝国传来的（异国）花卉；在荷兰花园开始（栽培）它之前，它早已受到苏丹宫廷的珍视。拿这种花来押上全部身家，实在有些奇怪。与浓烈（香气）能充满整个房间的（栀子花）不同，多数郁金香几乎（没有香味）；如果人们追求的是（芳香的）迷恋对象，本来大有更好的选择。让郁金香（备受赞美）的其实是外观，尤其是所谓“碎色”品种的（条纹状）花瓣：白色底色上燃烧般交错着（洋红色）、紫色或深红色，仿佛由画笔亲手绘成。"}, {"en": "Only in the 1920s did botanists work out what caused those flames: a virus, spread by aphids, that broke the pigment into a (mosaic) of streaks and sapped the bulb's strength. The most coveted tulips, in other words, were sick. Their beauty was a symptom, and their weakness, a kind of botanical (anemia), meant that they multiplied slowly, keeping supply scarce and allowing prices to become (bloated). The rarest of them all, the Semper Augustus, white flamed with red, was reputedly valued as highly as a (majestic) canal-side house in Amsterdam. Some 240 years later Gerard Manley Hopkins would give thanks for (dappled) things, for skies two-toned like a (brindled) cow; the tulip fanciers of Haarlem, who paid most for blooms that were (piebald) and (maculated), had got there first. It is hard to imagine a better emblem of a bubble: an asset whose (characteristic) allure was inseparable from a hidden disease, admired for an (aesthetic) whose cause nobody understood.", "zh": "直到20世纪20年代，植物学家才弄清这些火焰般的纹路从何而来：蚜虫传播的病毒把花瓣色素打散成条纹（镶嵌图案），同时削弱球茎的活力。换言之，最受追捧的郁金香其实生了病。它们的美丽是疾病的症状，而这种类似植物（贫血）的虚弱又使它们繁殖缓慢，供应始终稀少，价格因而（虚高膨胀）。最珍贵的“永恒的奥古斯都”，花瓣白底带红焰，据说价格堪比阿姆斯特丹运河边的一座（宏伟的）宅邸。约240年后，诗人杰拉德·曼利·霍普金斯会为（斑驳的）万物献上赞歌，赞美像（杂色条纹的）母牛一样呈双色的天空；而哈勒姆那些愿意为（杂色斑驳）和（布满斑点）花朵支付最高价的爱好者，早就领略了这种美。很难找到比它更贴切的泡沫象征：一种资产，其（典型的）魅力与隐藏的病害密不可分，人们沉迷于一种（审美效果），却根本不懂它的成因。"}, {"en": "Most of what the world thinks it knows about tulip (mania) comes from Charles Mackay, a Scottish journalist whose “Extraordinary Popular Delusions and the Madness of Crowds” first appeared in 1841. The book is an (encyclopedia) of folly with an (eclectic) range, in which alchemists, fortune-tellers, crusaders and haunted houses jostle with financial bubbles, and its stories have taken on the (patina) of age. Mackay tells of a sailor who mistook a precious bulb for an onion and ate it with his herring: surely the costliest breakfast in history and, given what tulip bulbs do to the (gastric) lining, not a pleasant one. He tells of (stolid) burghers ruined and a nation (possessed). The sailor story survives as pub (trivia); much of the larger tale belongs to the (apocrypha) of finance. Historians who have since combed the Dutch archives, notably Anne Goldgar, find scant evidence of the ruin Mackay described. He leaned heavily on (moralistic) pamphlets published after the crash by authors with a (didactic) purpose and a weakness for (melodrama). The true (saga) was smaller and more (prosaic): a (sporadic) trade, confined largely to merchants and prosperous artisans, that barely dented the Dutch economy.", "zh": "世人对郁金香（狂热）的认识，多数来自苏格兰记者查尔斯·麦凯1841年出版的《非同寻常的大众幻想与群众性癫狂》。这本书堪称愚行的（百科全书），题材（包罗万象）：炼金术士、算命师、十字军与闹鬼的房屋，与金融泡沫交织在一起；书中的故事如今还蒙上了岁月留下的（古旧光泽）。麦凯讲述一个水手把珍贵球茎误当洋葱，配着鲱鱼吃掉：这大概是史上最昂贵的早餐，而且鉴于郁金香球茎对（胃部）黏膜的影响，滋味恐怕也不好受。他又讲述（稳重的）市民破产、整个国家仿佛（着了魔）。水手早餐如今成了酒馆里的（冷知识），而更大一部分故事则属于金融史中未经证实的（传说轶闻）。包括安妮·戈德加尔在内的历史学家重新查阅荷兰档案，几乎找不到麦凯所说全国性毁灭的证据。他严重依赖崩盘后出版的（道德说教式）小册子；作者意在（训诫）世人，也爱渲染（夸张的戏剧性）。真实的（故事）规模更小，也更（平淡无奇）：交易只是（零星的），主要局限在商人和富裕工匠之间，几乎没有撼动荷兰经济。"}, {"en": "Yet the myth has outlived the facts, because it is useful. Every boom needs a cautionary tale, and every (cynic) needs a (barb) to hurl at the bulls. Mackay adopts a (pharisaic) tone, as though greed were always someone else's failing. That attitude can seem (anachronistic) today. His central insight does not: that men, as he put it, go mad in herds and recover their senses only slowly, one by one.", "zh": "尽管如此，这个神话的寿命远长于事实，因为人们用得着它。每一次繁荣都需要警世故事，每一个（愤世嫉俗者）都需要一根朝看多者掷去的（尖刺）。麦凯那种（自命清高的）笔调，仿佛贪婪总是别人的缺点，今天读来可能显得（不合时宜）。但他的核心见解并未过时：正如他所说，人们成群发疯，却只能一个接一个地缓慢恢复理智。"}, {"en": "Eighty-three years after Haarlem the madness crossed the North Sea. In 1720 London went wild for the South Sea Company, which had swapped a large chunk of the national debt for a monopoly on trade with Spain's American colonies, a trade that the Spanish crown kept on a tight leash. Its shares rose roughly eightfold in the first half of the year, and an (armada) of imitation schemes followed. Even the (phlegmatic) English began to (succumb) to the fever. In the coffee houses of Exchange Alley a clerk leaning against a door (jamb) could make a fortune before lunch, and (unprincipled) promoters raised money for everything from perpetual-motion wheels to, legend has it, “an undertaking of great advantage, but nobody to know what it is”. The South Sea Company itself lobbied for the Bubble Act of June 1720, which sought to (forbid) joint-stock companies without a royal charter: less a blow against speculation than an attempt to (shield) its own share price from rivals.", "zh": "哈勒姆事件过去83年后，疯狂越过北海。1720年，伦敦为南海公司陷入狂热。这家公司用接手大批国债换取与西班牙美洲殖民地贸易的垄断权，尽管西班牙王室严加限制这项贸易。上半年股价约上涨八倍，一支模仿它的投机计划（舰队）也随之出航。连向来（冷静持重的）英国人也开始（屈从于）投机热。在交易巷的咖啡馆里，一个倚靠门（框侧柱）的职员，午饭之前就可能发一笔横财；（不择手段的）推销人从永动机到据传“好处极大、却不告诉任何人具体做什么”的项目，无所不包地筹资。南海公司自己则游说通过1720年6月的《泡沫法案》，企图（禁止）未经王室特许成立的股份公司：这与其说是遏制投机，不如说是为了（保护）自己的股价免受对手冲击。"}, {"en": "Isaac Newton, master of the Royal Mint and no (untutored) investor, sold early at a profit, bought back near the top and lost a fortune, reckoned at some £20,000. His (purported) lament, that he could calculate the motions of the heavenly bodies but not the madness of people, may be legend; the losses were real. By the end of the year the shares had (shed) most of their gains. A parliamentary inquiry uncovered a (sordid) trail of bribes to ministers, and the chancellor of the exchequer was sent to the Tower. It became fashionable to (upbraid) the (lowbred) stockjobbers who had grown rich overnight, though plenty of dukes had joined the scramble. Street hawkers sold (ribald) verses, and pamphleteers with (vinegared) prose portrayed Exchange Alley as a (depraved) den of thieves. William Hogarth produced a crowded, (panoramic) engraving, as (emblematic) of its age as any image of the century, in which a (diabolic) figure hacks Fortune to pieces and flings the chunks to the mob while citizens of every rank ride a merry-go-round.", "zh": "牛顿身为皇家铸币厂厂长，绝非对投资（毫无知识的）外行，却在早期获利卖出后又于接近顶点时买回，最终损失巨款，据估计约两万英镑。他那句（据称的）感叹——能计算天体运行，却无法计算人类的疯狂——或许只是传说；亏损却确有其事。年底前南海公司股票已（失去）大部分涨幅。议会调查揭露一连串（肮脏的）部长受贿事件，财政大臣甚至被关进伦敦塔。人们时兴（痛斥）那些一夜暴富的（出身卑微的）股票掮客，却忘记不少公爵也曾参与争抢。街头小贩叫卖（粗俗戏谑的）诗句，（尖酸刻薄的）宣传册作者把交易巷描绘为（堕落的）盗贼窝。威廉·霍加斯创作了一幅拥挤的（全景式）版画，堪称那个世纪最有（象征意义的）图像之一：其中一个（魔鬼般的）人物把幸运女神砍成碎片抛向人群，各阶层市民则在旋转木马上兜圈。"}, {"en": "Across the Channel, France was in the grip of something stranger still. John Law, a (peripatetic) Scottish gambler with a (checkered) past, who had killed a man in a duel in London and escaped from prison, talked his way into control of French finances. His schemes had a whiff of (megalomania): a national bank issuing paper money, a single company to monopolize colonial trade and swallow the national debt, and the promise of riches from Louisiana, where his Mississippi Company founded New Orleans in 1718 on the river's swampy (delta). Colonists, some of them convicts shipped out against their will, died in their hundreds in the (fetid) (miasma) of the swamps. In the rue Quincampoix, the narrow Paris street where shares changed hands, a hunchback reputedly rented out his back as a writing desk. When a decree in May 1720 set out to halve the value of shares and banknotes, the fury was such that the government had to (countermand) it within a week. Confidence was never (restored), and Law fled France in disgrace. He died in poverty in Venice in 1729 and is buried a short walk from the (piazza) of San Marco.", "zh": "英吉利海峡另一侧，法国正陷入更奇异的局面。约翰·劳是个（四处漂泊的）苏格兰赌徒，有过（劣迹斑斑的）经历：他曾在伦敦决斗杀人，又越狱逃跑，却最终凭口才取得法国财政控制权。他的方案颇有（自大狂）的味道：国家银行发行纸币，一家公司垄断殖民贸易、吸收国债，并承诺从路易斯安那获得财富。1718年，他的密西西比公司在河流沼泽（河口三角洲）建立新奥尔良。一些被强行遣送的囚犯移民，在沼泽（恶臭的）（瘴气）中成百上千地死去。巴黎狭窄的坎康普瓦街成了股票交易中心，据说一个驼背者出租自己的背供人写字。1720年5月，一道政令试图将股票与纸币价值减半，众怒迫使政府一周内（撤销）命令。信心却再未（恢复），劳身败名裂地逃离法国，1729年贫困地死于威尼斯，葬在离圣马可（广场）不远处。"}, {"en": "Britain's Victorians, so (staid) in the popular imagination, were in fact (prolific) speculators. In the 1840s they poured their savings into railways, and Parliament authorized thousands of miles of new track, much of it duplicating lines already built. George Hudson, the “Railway King”, was hailed as a genius, and the press hung a (garland) of superlatives around his neck until it emerged that his (underhanded) accounting had paid dividends out of capital. His admirers (deserted) him, and he spent years abroad dodging creditors. The boom was hardly an (unqualified) success for investors, and the (dilapidated) stations of redundant lines that never paid their way still dot the countryside. Yet it left something valuable behind: the skeleton of Britain's railway network, built with money that its backers never got back. The (sequela) of this speculative fever was, paradoxically, something useful.", "zh": "大众印象中（循规蹈矩的）维多利亚时代英国人，实际上是（热衷投机的）投资者。19世纪40年代，他们把积蓄投入铁路，议会批准了数千英里的新轨道，许多与已有线路重复。“铁路大王”乔治·哈德逊被奉为天才，媒体给他挂上由最高级赞美织成的（花环），直到人们发现他通过（不正当的）账务操作，用本金而非利润支付股息。仰慕者（抛弃了）他，他多年流亡国外躲债。这场繁荣对投资者绝非（毫无保留的）成功；那些无法盈利的冗余线路留下的（破败）车站，至今仍散落乡间。但它也留下了有价值的东西：英国铁路网络的骨架，靠投资者再也收不回的资金建成。这场狂热的（后遗影响），少见地竟然是健康的。"}, {"en": "The same decades produced pteridomania, a craze for ferns and their (serrated) fronds that was named by the novelist Charles Kingsley, and “orchidelirium”, in which collectors paid fortunes for specimens of tropical (flora) and sent (intrepid) hunters to Colombia and Borneo, some of whom died of fever in pursuit of a single (orchid). Others fell for phrenology, which claimed to read character from the (cephalic) bumps beneath the scalp, or for mesmerism, whose (hypnotic) performers drew (packed) halls. Francis Galton, Darwin's half-cousin, gave the world the (eugenic) dream that would curdle into something (horrific) in the century that followed. Gilbert and Sullivan, who knew their audience, wrote an (operetta) in which a South Seas island kingdom converts itself into a limited-liability company, so that should it fail, nobody need pay. It remains the most (comic) explanation of the corporate form, and among the most (pellucid).", "zh": "同一时期出现了“蕨类狂热”：人们痴迷于蕨类植物（锯齿状）的叶片，小说家查尔斯·金斯利为其命名。还有“兰花狂热”，收藏家不惜重金购入热带（植物群）中的珍品，并派出（勇敢无畏的）猎寻者深入哥伦比亚和婆罗洲；有些人为一株（兰花）死于热病。另一些人迷上颅相学，声称可通过头皮下（头部的）隆起来判断性格；催眠术也让（催眠的）表演者吸引（座无虚席的）观众。达尔文的表亲弗朗西斯·高尔顿提出（优生学的）梦想，它将在下个世纪演变成（骇人听闻的）灾难。深知观众喜好的吉尔伯特与沙利文写了一部（轻歌剧）：南太平洋岛国把整个国家改成有限责任公司，这样失败也不必偿债。这仍是关于公司制度最（滑稽的）、也最（清晰透彻的）解释之一。"}, {"en": "America's turn came in the 1920s. Radio was the miracle technology of the age, every rooftop seemed to sprout an (antenna), and the Radio Corporation of America was the market's darling. Small investors bought on margin, sometimes putting down a tenth of the price, and the riskiest stocks traded on an exchange whose brokers had done business outdoors, on the (curb) of Broad Street, until 1921. Pools of speculators drove prices up and down at will; the bear (raid) was a favorite (tactic). In Florida, (humid) swampland changed hands as fast as it could be surveyed, often between buyers who never saw a (deed), until a hurricane in 1926 finished the boom off. When the stockmarket crashed in October 1929, RCA began a slide that would wipe out almost all of its value. John Kenneth Galbraith, whose history of the crash remains the most (acerbic), later wrote a short history of financial (euphoria) in which he blamed, above all, the brevity of the financial memory: a collective (amnesia) that lets each generation discover for itself the joys of leverage.", "zh": "20世纪20年代轮到美国。无线电是当时的奇迹技术，仿佛每个屋顶都长出一根（天线），美国无线电公司RCA成了市场宠儿。小投资者融资买股，有时只付十分之一首款；风险最高的股票在一个交易所买卖，其经纪人直到1921年前都还在宽街的（路缘）露天做生意。投机团伙随意推高压低股价，空头（突袭）是惯用（手法）。在佛罗里达，（潮湿的）沼泽地还没测绘完就被转手，买家往往连（地契）都没见过；直到1926年的飓风终结泡沫。1929年10月股灾后，RCA开始长期下滑，几乎抹去全部价值。写过最（尖刻的）股灾史之一的约翰·肯尼斯·加尔布雷思，后来又写了一部关于金融（狂喜）的短史，把祸根首先归于金融记忆短暂：集体（失忆）使每代人都重新发现杠杆的快乐。"}, {"en": "After the war the pattern recurred with (kaleidoscopic) variety. The “go-go” fund managers of the 1960s piled into conglomerates that promised to (weld) unrelated businesses into (synergic) wholes; the savings seldom materialized. In the early 1970s the “Nifty Fifty”, blue chips deemed so safe that they need never be sold, were savaged in the bear market of 1973-74. On a single day in October 1987 the Dow Jones Industrial Average fell by 22.6%, and the Federal Reserve's (improvised) promise of liquidity taught investors a lesson they have never forgotten. A decade later Long-Term Capital Management, whose partners included two Nobel laureates and whose models drew on an option-pricing (formula) that had helped win them the prize, lost $4.6bn in a few months and had to be rescued by its creditors.", "zh": "战后同一模式以（千变万化的）形式重现。20世纪60年代的“冲冲冲”基金经理追捧企业集团，希望把互不相关的企业（焊接）成（协同的）整体；节省成本的希望往往落空。70年代初，“漂亮五十”蓝筹股被视为永远无需卖出，却在1973—74年熊市遭受重创。1987年10月某一天，道琼斯工业平均指数下跌22.6%；美联储（临时作出的）流动性承诺教会投资者一条从此难忘的经验。十年后，长期资本管理公司遭遇危机：合伙人中有两位诺贝尔奖得主，模型借鉴了使他们获奖的期权定价（公式）；短短几个月亏损46亿美元，最后不得不由债权人救助。"}, {"en": "In Tokyo at the end of the 1980s, it was said, the grounds of the Imperial Palace were worth more than all the land in California, a calculation widely repeated and never properly (verified). When Japan's bubble (deflated), it did so slowly and painfully. Banks kept (indebted) zombie firms alive, savers endured what economists call financial repression: their returns were (repressed) by near-zero interest rates, and an economy (blighted) by bad debts and falling prices became a byword for stagnation. The Nikkei took 34 years to regain its 1989 peak.", "zh": "20世纪80年代末的东京，盛传皇居土地价值超过整个加利福尼亚州；这个数字虽然广为流传，却始终未被恰当（核实）。日本泡沫（消退）得缓慢而痛苦。银行继续供养（负债累累的）僵尸企业；近零利率使储户的收益受到（金融压抑）；坏账和物价下跌令经济（饱受损害），日本成为长期停滞的代名词。日经指数用了34年才重返1989年的高点。"}, {"en": "The dotcom boom of the late 1990s supplied the modern template. Pets.com, an online pet-supply shop with a (sarcastic) sock puppet as its (figurehead), went public in February 2000 and was liquidated nine months later; a more (bathetic) mascot for an era would be hard to invent, though the puppet is now an object of (nostalgia). AOL and Time Warner announced a (star-crossed) merger in January 2000 that turned into an (unmitigated) disaster. Alan Greenspan, chairman of the Federal Reserve, had warned of “irrational exuberance” in 1996, in typically (gnomic) fashion, and then watched shares rise for more than three years. Telecoms firms laid enough fiber-optic cable to circle the globe many times over; after the bust much of it lay dark, (underutilized) for years, while the industry limped along in a (ragged) state until a new generation of internet firms snapped up the capacity at knock-down prices. There followed years of corporate (anorexia), in which chastened firms cut investment to the bone and hoarded cash.", "zh": "20世纪90年代末的互联网泡沫提供了现代范本。线上宠物用品商Pets.com请来一只带着（讽刺口吻）的袜子玩偶当品牌（代言形象），2000年2月上市，九个月后便清算；很难想象一个更具（滑稽反高潮感）的时代吉祥物，虽然那只玩偶如今反倒成了（怀旧）对象。美国在线与时代华纳2000年1月宣布（命运多舛的）合并，最终成为一场（彻头彻尾的）灾难。美联储主席格林斯潘1996年就以典型的（谜语般晦涩的）方式警告“非理性繁荣”，但之后股市仍涨了三年多。电信企业铺设的光纤足以绕地球许多圈，泡沫破裂后，大量光缆多年不亮，长期（利用不足）；行业在（破败不振的）状态中蹒跚前进，直到新一代互联网企业低价购买这些产能。接下来是多年的企业式（厌食症）：被吓坏的公司把投资削减到骨头，囤积现金。"}, {"en": "The bubble that burst in 2007-08 was different in kind, because it was built on debt. American mortgages were sliced, pooled and repackaged into securities so (convoluted) that even (sophisticated) buyers could not say what they held, and the prospectuses for (esoteric) creations such as the CDO-squared ran to hundreds of pages of (hieroglyphic) legalese. Triple-A ratings made the paper look (ironclad). The risks were (calculated), modeled and, as it turned out, (underestimated) by orders of magnitude, thanks to an (astigmatic), badly distorted view of correlation which assumed that house prices could not fall everywhere at once. In July 2007 the boss of Citigroup remarked that as long as the music was playing, bankers had to get up and dance. Two months later depositors were queuing beneath the (fascia) of Northern Rock's branches in Britain's first bank run in well over a century.", "zh": "2007—08年破灭的泡沫性质不同，因为它建立在债务之上。美国住房贷款被切割、汇集、再包装成极其（错综复杂的）证券，连（经验老到的）买家也不知道自己持有什么；诸如CDO平方等（冷僻复杂的）产品，其发行说明书充斥（象形文字般难懂的）法律术语，动辄数百页。AAA评级让这些纸面资产看上去（坚不可摧）。风险被（计算）、建模，却被严重（低估），甚至差了数量级；根源在于对相关性的理解（散光般失真）——假设房价不会全国同时下跌，甚至差了数量级。2007年7月花旗集团负责人说，只要音乐还在播放，银行家就得起身跳舞。两个月后，英国北岩银行分支机构的（店面招牌）下，储户排起长队，引发英国一个多世纪来首次银行挤兑。"}, {"en": "A financial system stuffed with leverage behaves like a body with (hemophilia): a small cut bleeds and bleeds. When Lehman Brothers collapsed in September 2008, credit markets froze, and firms that relied on short-term funding faced something close to (asphyxia). Subprime loans that had looked like a scratch turned (septic). Regulators, who had (assured) the world that risk had been safely dispersed, had been (myopic) beforehand and were (flustered) afterwards; they proved a broken (reed). Teams of (forensic) accountants spent years picking through the wreckage, and prosecutors served many a (subpoena), but few senior bankers went to jail. Each generation, it seems, must pick at the (scab) for itself.", "zh": "塞满杠杆的金融体系，就像患上（血友病）的身体：小伤口也流血不止。2008年9月雷曼兄弟倒闭后，信贷市场冻结，依赖短期资金的企业几乎（窒息）。看上去只是一道划痕的次级贷款，转眼变得（感染化脓）。监管机构先前曾向世界（保证）风险已安全分散，事前却（目光短浅），事后又（惊慌失措），证明自己不过是（靠不住的拐杖）。成队的（法务鉴证）会计师花费多年梳理残骸，检察官也发出了大量（传票），但真正入狱的银行高管寥寥无几。似乎每代人都得亲手揭开这块（伤痂）。"}, {"en": "Cheap money and the (pandemic) of 2020, which confined millions of bored people at home with stimulus checks and trading apps, produced a carnival. Blank-check companies raised record sums. Retail traders who called themselves “apes” organized online like a (militia) and squeezed hedge funds that had bet against GameStop, an ailing video-game retailer. Cryptocurrencies multiplied into a (plethora) of tokens, many of them jokes that became serious money, launched with white papers as (runic) as a Viking gravestone and (cryptic) to the (uninitiated). Bitcoin's most (fanatic) holders prize it for its scarcity, much as collectors prize a rare coin; its appeal is partly (numismatic). Cartoon apes sold as digital collectibles for millions of dollars. Back in 2017 a maker of iced tea had renamed itself Long Blockchain and watched its shares soar: blockchain was the (fad) of the moment. In 2022 a crypto exchange whose founder had presented himself as an (altruistic) billionaire collapsed; its success turned out to rest on the (barefaced) misuse of customers' money, and he was convicted the following year. The jargon of investment banking gave way to the (demotic) slang of Reddit, and deception, as in every boom, proved (endemic).", "zh": "廉价资金和2020年的（大流行病），把数百万拿着刺激支票、困在家中、使用交易软件的无聊人群带进投机嘉年华。空白支票公司募资创纪录；自称“猿人”的散户像（民兵组织）一样在网上集结，逼空押注GameStop下跌的对冲基金。加密货币繁衍出（大量）代币，其中许多起初是笑话，却成了真金白银。项目白皮书像维京墓碑的（符文）一样（晦涩），令（外行人）难以理解。比特币最（狂热的）持有者像珍藏稀有硬币那样珍惜其稀缺性，部分魅力来自（钱币收藏价值）。卡通猿猴数字藏品卖出数百万美元。2017年，一家冰茶公司改名Long Blockchain，股价随即飙升，“区块链”是当时的（流行风尚）。2022年，一家由自称（利他主义）亿万富翁者创立的加密交易所倒闭：所谓成功建立在（明目张胆的）挪用客户资金上，他次年被定罪。投资银行行话让位于Reddit的（大众口语）俚语，但欺骗在每轮繁荣中依旧（普遍存在）。"}, {"en": "Economists have spent decades trying to classify these (phenomena). Charles Kindleberger, building on the work of Hyman Minsky, described a sequence in which a “displacement”, such as a new technology, a war or a financial innovation, kindles a boom; credit expands, prices rise and the boom feeds on itself until it turns (frenetic). Insiders take their profits and outsiders pile in; then something, often trivial, pricks the bubble and the sequence runs in reverse, through distress and panic to what Kindleberger called “revulsion”. Minsky's insight was that stability is itself destabilizing: long periods of calm breed complacency, and complacency breeds leverage. Keynes likened professional investment to a newspaper beauty contest in which the aim is to pick not the prettiest face but the one the other judges will pick, and saw markets as (animated) less by cold arithmetic than by “animal spirits”. An (epidemic) of speculation, on this view, is (episodic) but never cured.", "zh": "经济学家花了几十年试图将这些（现象）分类。查尔斯·金德尔伯格承接海曼·明斯基的思想，提出一个循环：“外部冲击”——新技术、战争或金融创新——点燃繁荣；信贷扩张，价格上涨，涨势自我强化直到变得（狂热失控）。内部人士获利退出，外部人争相涌入；随后某个通常微不足道的事件戳破泡沫，过程便反向推进，经历困境、恐慌，最后到金德尔伯格所谓的“厌恶”。明斯基洞察到，稳定本身会破坏稳定：漫长的平静培养自满，自满催生杠杆。凯恩斯把专业投资比作报纸选美比赛，关键不是选自己眼中最美的面孔，而是猜其他评委会选谁；他认为市场（受驱动）更多靠“动物精神”而非冷冰冰的算术。以此看来，投机的（传染病）只是（周期性发作），从未根治。"}, {"en": "Sociologists and behavioral economists have filled in the picture. David Riesman described the (other-directed) personality, who steers by radar, watching what the neighbors are doing, rather than by an inner gyroscope. Harvey Leibenstein contrasted the bandwagon effect, in which people want something because others have it, with the (snob) effect, in which they want it because others do not; tulips, like the hottest private shares today, managed to excite both. Jack Guttentag and Richard Herring coined the term “disaster (myopia)” for the tendency to underweight rare catastrophes the longer it has been since the last one. Investors, like a shoal of (scad) wheeling as one, find safety in numbers right up to the moment when numbers become the danger, and then follow the (pied) piper of the day out of the market as eagerly as they followed him in. Carmen Reinhart and Kenneth Rogoff gave their (encyclopedic) study of eight centuries of financial crises a title that could serve as an epitaph for all of them: “This Time Is Different”.", "zh": "社会学家和行为经济学家补充了这幅图景。戴维·里斯曼描述（他人导向型）人格：他们像雷达一样观察邻居在做什么，而不遵从内心的陀螺仪。哈维·莱本斯坦区分了从众效应——因为别人拥有才想要——和（势利）效应——因为别人没有才想要；郁金香和当下最热门的私募股票都能同时激发两者。杰克·古滕塔格与理查德·赫林创造“灾难（短视）”一词，指越久没有灾难，人们越低估罕见灾难的风险。投资者如同一群同步转向的（竹荚鱼），在数字规模本身成为危险以前，都觉得随大流安全；之后又像追随（花衣）吹笛人那样，急切地跟随当代领头人逃离市场，正如入场时一样。卡门·莱因哈特与肯尼斯·罗格夫把八世纪金融危机的（百科全书式）研究命名为《这次不一样》，这个书名足以成为一切泡沫的墓志铭。"}, {"en": "Which brings us to artificial intelligence. The launch of ChatGPT in November 2022 was a (watershed), and investors have since poured money into anything connected with AI with an enthusiasm that recalls every episode above. It is (chic) for any company to have an AI strategy, and AI now tops every boardroom (agenda). Yet the bulls have a strong case, and an (evenhanded) assessment must begin with it. Unlike Pets.com, the firms at the center of the boom are among the most profitable in history. Nvidia, the 800-pound (gorilla) of the chip world, has enjoyed a (meteoric) rise, becoming in 2025 the first company to be valued at $4trn and then $5trn, and its quarterly results have become a (bravura) performance that markets await like the opening night of an opera. Microsoft, Alphabet, Amazon and Meta earn (superb) profits from older businesses and can afford to spend them. P.T. Barnum once exhibited a Feejee (mermaid), the torso of a monkey stitched to the tail of a fish, to crowds who paid to be fooled. Nobody seriously thinks AI is that kind of (hybrid): the technology is (authentic), and its uses are real.", "zh": "于是轮到人工智能。2022年11月ChatGPT推出，是一个（分水岭）。投资者随后满腔热情地向所有AI相关领域投钱，令人想起上述每一次狂潮。任何企业拥有AI战略都变得（时髦），AI也占据了几乎所有董事会议（议程）的首位。但看多者确有有力论据，（公允的）评估必须先承认这一点。与Pets.com不同，这轮繁荣中心的企业位列历史上最赚钱的公司之中。芯片界的“800磅（大猩猩）”英伟达经历了（流星般迅猛的）崛起，2025年成为首家市值先后达到4万亿美元和5万亿美元的公司；每一季财报都像市场翘首以盼的歌剧首演，是一场（炫技式的）演出。微软、Alphabet、亚马逊与Meta靠老业务赚取（丰厚的）利润，有能力将其投入AI。马戏商人巴纳姆曾向付费观众展示“斐济（美人鱼）”：猴子的躯干缝上鱼尾。没人真以为AI是这样的（拼接怪物）：技术是（真实的），用途也是实在的。"}, {"en": "Models write code, summarize contracts and help people with (dyslexia) read and write. An AI system that predicts the shapes of proteins won its creators a share of the Nobel prize in chemistry in 2024; others help chemists design antibiotics against drug-resistant (bacteria), sift (genetic) data, detect (somatic) mutations in tumors and flag (arrhythmic) heartbeats in electrocardiograms. Millions of people confide in chatbots for something close to (therapeutic) conversation, not always wisely. The (linguistic) fluency of large language models would have astonished computer scientists a decade ago, and speech-recognition systems that once stumbled over (phonetic) ambiguities now cope with thick regional accents. Voice-cloning tools can produce a convincing (replica) of anyone's voice from a few seconds of audio. The (disembodied) voices of AI assistants are acquiring bodies, too: startups promise (anthropoid), or human-shaped, robots that stride about like any other (biped) and lift like a stevedore, while (quadruped) robot dogs already inspect oil rigs. A robot arm with a (spatula) flips burgers in a few American kitchens; in warehouses, driverless forklifts slide their (tined) arms under pallets without a human in sight.", "zh": "模型能写代码、概括合同，帮助有（阅读障碍）的人读写。预测蛋白质结构的AI系统让其开发者分享了2024年诺贝尔化学奖；另一些系统协助化学家设计针对耐药（细菌）的抗生素、筛查（遗传）数据、发现肿瘤的（体细胞）突变，并标记心电图上的（心律不齐的）心跳。数百万人向聊天机器人倾诉，寻求接近（心理疗愈的）对话，尽管这未必明智。大语言模型的（语言）流利程度足以令十年前的计算机科学家震惊；曾被（语音）歧义难住的识别系统，如今能听懂浓重的地方口音。语音克隆只需几秒录音，就能生成任何人声音的逼真（复制品）。AI助手（没有身体的）声音也开始拥有躯体：初创企业许诺（人形）机器人，能像（双足行走者）一样大步行走，又能像码头装卸工一样举重；（四足）机器狗已在检查石油平台。美国少数厨房里，机械臂用（锅铲）翻汉堡；仓库中，无人叉车把带（叉齿的）货叉伸入托盘，不见人类操作。"}, {"en": "Creative work is not spared. Image generators have alarmed (graphic) designers, and in 2024 record labels sued two AI music startups, alleging that they had trained their models on copyrighted recordings. Machines have (composed) passable pastiches of a Mozart (sonata) and a Bach (cantata); they can sing an (aria) in a (full-bodied) baritone without the expense of an (orchestra), knock out a pop (ballad) over (acoustic) guitar, or write a poem one (stanza) at a time. Video models can conjure a (ballerina) pirouetting on a frozen lake. Some of the business plans built on all this read like a (fantasia) on a theme by Silicon Valley.", "zh": "创意工作也未能幸免。图像生成器让（平面）设计师不安。2024年唱片公司起诉两家AI音乐初创企业，指控它们用受版权保护的录音训练模型。机器已（创作）出尚算过得去的莫扎特（奏鸣曲）和巴赫（康塔塔）仿作；它们能唱出（咏叹调），用（浑厚的）男中音发声，而无需（管弦乐队），还能伴着（原声）吉他迅速写出流行（抒情歌），或者一（节）接一节写诗。视频模型则能凭空生成在结冰湖面旋转的（芭蕾舞演员）。围绕这些能力建立的某些商业计划，简直像以硅谷为主题的（幻想曲）。"}, {"en": "The scale of the build-out is (titanic). The biggest tech firms are spending several hundred billion dollars a year on data centers and the (specialized) chips that fill them, an investment boom that by some estimates accounted for much of America's economic growth in 2025. Investors' appetite has been (catholic): chipmakers, utilities, cooling specialists, even uranium miners have been swept up. William Blake's dark (satanic) mills have found a successor in the data center, a (drab), windowless box in which (serried) ranks of servers hum on a concrete (slab) the size of several football fields, while a steel (scaffold) for the next one rises alongside. Tax breaks have lured them deep into the (rustic) (hinterland) of (landlocked) states such as Iowa, where (unspoiled) farmland now sprouts substations; the ethanol craze of 2006, when every (cob) in the state seemed destined for a fuel tank, looks quaint by comparison. Others cluster where the climate helps: in Sweden's far north, where (arctic) air cools the halls and engineers swap the fleece vest for a (parka), or on Iceland's Reykjanes (peninsula), where (lava) has burst through the ground repeatedly in recent years and geothermal plants supply the power. Microsoft once sank a capsule full of servers off the Orkney islands to see whether computers could thrive in an (aquatic) habitat; they did, though the project was quietly shelved. Elsewhere they are rising on a sun-baked (mesa) in the American south-west, where cooling systems compete with farmers for water in (arid) country.", "zh": "建设规模堪称（巨大的）。大型科技企业每年投入数千亿美元建设数据中心、购买其中的（专用）芯片；据一些估算，这场投资潮贡献了2025年美国经济增长的很大一部分。投资者的胃口（广泛而不挑剔）：芯片厂商、公用事业、冷却技术企业甚至铀矿商都被卷入。威廉·布莱克笔下黑暗的（撒旦式）工厂，在数据中心找到了继承者：这种（单调灰暗）、没有窗户的巨大方盒里，（密密排列的）服务器在几座足球场大小的混凝土（地板）上嗡嗡作响，一旁为下一座设施搭建的钢（脚手架）还在升起。税收优惠把它们吸引到爱荷华等（内陆）州的（乡村）（偏远腹地），那里（未经破坏的）农田如今竖起变电站；相比之下，2006年的乙醇热——当时仿佛每根玉米（棒）都注定要进入油箱——显得温和。另一些数据中心聚集在气候有利的地方：瑞典极北地区以（北极般的）冷空气为机房降温，工程师把抓绒背心换成（派克大衣）；或在冰岛雷克雅内斯（半岛），近年（熔岩）多次冲破地表，地热发电站供应电力。微软曾把装满服务器的舱体沉到奥克尼群岛附近海底，测试计算机能否在（水下）环境生存；测试成功，项目却悄悄停止。别处的数据中心建在美国西南部烈日炙烤的（平顶山）上，冷却系统与农民在（干旱的）土地上争水。"}, {"en": "The chip factories that feed them are more (aseptic) than any operating room, because a speck of dust can ruin a wafer of (microscopic) transistors. Taiwan, which makes the bulk of the world's most advanced chips, is the (aorta) of the whole enterprise, and it sits within easy range of Chinese missiles. America's export controls have spawned a lively trade in (contraband) chips smuggled to China through third countries, and a plan to ration exports with a country-by-country (quota), unveiled in January 2025, was scrapped within months. Supply remains (constrained), and (demand) for electricity is such that power companies are scrambling for gas turbines and even working to restart a shuttered reactor at Three Mile Island. In Memphis, turbines installed to power one AI supercomputer drew protests from neighborhoods already burdened with high rates of (asthma). And three centuries after John Law sold shares in the riches of Louisiana, one of the world's largest AI data centers is rising on former farmland in a (bucolic) corner of the same state, financed in large part with debt held in a special-purpose vehicle off its owner's balance-sheet. History, it seems, has a sense of humor.", "zh": "供应芯片的工厂比任何手术室都更加（无菌洁净），一粒灰尘就能毁掉刻有（微观尺度）晶体管的晶圆。制造全球大部分最先进芯片的台湾，是这项事业的（主动脉），却处在中国导弹容易到达的范围。美国出口管制催生了活跃的（走私）市场：芯片经第三国流向中国；2025年1月推出的逐国出口（配额）计划，数月后又遭废止。供应依旧（受限），而电力（需求）大到电力企业四处寻找燃气轮机，甚至设法重启三里岛一座已关闭的反应堆。孟菲斯一台AI超级计算机使用的涡轮机引来邻区抗议，当地原本就有较高的（哮喘）发病率。约翰·劳兜售路易斯安那财富的三个世纪后，全球最大的AI数据中心之一，正在该州（田园风光的）旧农田上拔地而起，主要靠业主资产负债表外特殊目的载体持有的债务融资。历史似乎很有幽默感。"}, {"en": "The bears' worry is less the technology than the money. Revenues from AI are growing fast but remain (anemic) relative to spending; by one widely cited reckoning from a venture-capital firm, the industry needs hundreds of billions of dollars a year in new revenue to justify its outlays, and is nowhere near that. Chips that are cutting-edge today may become (superannuated)—outdated—within a few years, and skeptics who pore over every (minutia) of the tech giants' accounts argue that generous depreciation schedules flatter profits in ways that are (unjustified). In 2025 a web of deals, with chipmakers investing in AI labs that then buy their chips and cloud providers taking stakes in their own customers, drew comparisons with the vendor financing that inflated the telecoms bubble. Drawing a (schematic) of who owes what to whom would challenge even an (arachnid) trying to navigate a web of obligations, and the risks are (manifold). The AI economy is arranged in (concentric) circles, with chipmakers at the core, cloud giants around them and a (penumbra) of startups at the edge, and a shock at the edge would travel inward.", "zh": "看空者担心的与其说是技术，不如说是钱。AI收入高速增长，却相对支出仍然（疲弱）。一家风投机构广受引用的估算认为，要让投资合理，整个行业每年还需要新增数千亿美元收入，如今远远不够。今天最尖端的芯片几年后就会（老旧过时）；盯着科技巨头账户每个（细枝末节）的怀疑者认为，宽松的折旧期限让盈利看起来比实际更好，且（缺乏正当理由）。2025年出现一张交易关系网：芯片厂商投资AI实验室，实验室反过来购买其芯片；云服务商入股自己的客户；这让人想起当年推高电信泡沫的供应商融资。要绘出谁欠谁多少钱的（示意图），恐怕连试图理清蛛网的（蜘蛛）也会耗尽耐心，风险可谓（多种多样）。AI经济呈（同心圆）结构：芯片商居于核心，云巨头环绕其外，初创企业构成边缘的（半影地带）；外围冲击可以逐层向内传导。"}, {"en": "Increasingly the build-out is financed with borrowing, through bonds, private credit and leases, and that matters, because the most destructive bubbles are those built on debt. An equity bubble that bursts leaves shareholders (numb) and poorer; a debt bubble can leave the banking system in a (coma). Pension funds and insurers have (committed) billions to private-credit funds, which are lightly regulated, and many still hold (uncommitted) capital looking for a home. Risks tend to accumulate (unnoticed) in the (unregulated) corners of finance, which is where much of this lending now sits. The tech giants, (drenched) in cash, could survive a bust; the same cannot be said of some of the developers that build data centers on borrowed money for tenants who may one day walk away.", "zh": "越来越多基础设施通过债券、私人信贷与租赁借债筹资。这一点至关重要，因为破坏力最大的泡沫往往建立在债务之上。股权泡沫破灭，股东会（麻木）且贫穷；债务泡沫破灭，却可能让银行系统陷入（昏迷）。养老基金和保险公司已向私人信贷基金（承诺投入）数十亿美元；这些基金监管相对宽松，不少还持有（尚未承诺投入）的资金，等待投资机会。风险往往在金融业（未被察觉的）、（监管不足的）角落积累，如今许多贷款正发生在那里。现金（极其充裕的）科技巨头也许能够挺过崩盘，但靠借款为随时可能退租的客户修建数据中心的开发商，则未必如此。"}, {"en": "Prices, meanwhile, have become (detached) from earnings in places. Charts of some AI-linked stocks trace a near-perfect (parabola), and valuations have become (tumid) even for companies with barely an (iota) of revenue. A handful of tech giants now account for a share of America's stockmarket that is (unprecedented) in modern times, and the concentration is so (pronounced) that a portfolio which simply tracks the index is close to (monochromatic): a single bet on a single theme in a (lopsided) market. Index funds buy whatever is big, so (inertia) pushes ever more money into the giants. Investors who want still more exposure can buy (thematic) exchange-traded funds; investors who want less find little shelter.", "zh": "与此同时，部分股票价格已与盈利（脱离）。一些AI相关股票走势接近完美（抛物线）；有些企业收入几乎连（一丁点）都没有，估值却异常（臃肿膨胀）。少数科技巨头占据美国股市的比重，在现代史上（前所未有）；集中度如此（显著），以至于简单跟踪指数的投资组合越来越（单一色调）：在这个（失衡的）市场中，近乎押注同一个主题。指数基金只买权重大的公司，于是资金流动的（惯性）让巨头吸收越来越多资金。想进一步加码的投资者可以购买（主题型）ETF；想减少敞口的人却难寻避风港。"}, {"en": "The fear of missing out, a very modern (phobia), has been (institutionalized). A fund manager who shuns AI stocks and lags the index risks losing her job, which makes the index a (despotic) master. In boardrooms, (paranoia) about being left behind, a creed that Intel's Andy Grove once preached, drives ever larger capital budgets. It has become (impolitic) in Silicon Valley to say the word “bubble” aloud; the (heretic) who does so is told that he does not understand exponential curves, and bulls dismiss doubters as (unenlightened). Executives greet the question with (studied) indifference or (emphatic) denials, and their (feigned) humility rarely conceals their (unfeigned) enthusiasm. Investors who suffer from (acrophobia) have had a miserable few years.", "zh": "“害怕错过机会”这种十分现代的（恐惧症），如今已被（制度化）。回避AI股票、业绩跑输指数的基金经理可能丢掉工作，使指数成了（专横的）主人。董事会对落后的（恐慌）——英特尔的安迪·格鲁夫曾宣扬这种信条——推动越来越庞大的资本预算。在硅谷，公开说“泡沫”已成了（不得体）的事；敢说的人被当作（异端分子），被告知不懂指数曲线，看多者则把怀疑者斥为（未开化的）人。高管面对质疑，或报以（刻意表现的）冷淡，或作出（坚决的）否认；（假装的）谦逊很少能掩盖他们（毫不掩饰的）热情。患有（恐高症）的投资者这些年可不好过。"}, {"en": "The (rhetoric) of the boom would be familiar to John Law. AI bosses with ample (charisma) issue (bombastic) forecasts: that superintelligence is a few years away, that AI will cure most diseases, that a (cornucopia) of cheap goods and services awaits, a (vista) of growth without end. Doomers issue (apocalyptic) warnings about the same machines, which, as a (caustic) observer might note, is another way of saying that they are extraordinarily powerful and therefore worth a great deal of money. Artificial general intelligence is offered as a (panacea) for sluggish productivity and a road to (utopia); it may yet prove a (chimera). The pursuit has a whiff of Captain Ahab's (monomania), and the (cosmic) ambitions of some founders are matched only by their (egocentric) habits. The industry's (dogma) is that scale is all you need, that bigger models trained on more data with more computing power will keep getting smarter, though that is hardly (settled) science, and AI's capabilities form a (jagged) frontier, superhuman at some tasks and hopeless at others. Selling AI shares has become (anathema) to fund managers who remember what happened to those who sold internet stocks in 1998.", "zh": "这轮繁荣的（话术）会让约翰·劳感到熟悉。颇有（个人魅力）的AI领导者发表（夸张自负的）预测：超级智能数年内到来，AI将治好大多数疾病，大量廉价产品与服务将像（丰饶之角）一样涌现，增长的（广阔前景）永无止境。末日论者则对同一类机器提出（世界末日般的）警告；一位（尖酸的）观察者或许会说，这不过是换个方式证明机器极其强大，因而非常值钱。通用人工智能被当作治愈生产率低迷的（万灵药）、通往（乌托邦）的道路；它也许终究只是（虚幻怪物）。追逐它的执念有点像亚哈船长的（偏执狂热），一些创始人（宇宙级的）野心，只有他们（以自我为中心的）习惯能与之匹敌。行业（教条）是“规模就是一切”：更大模型、更多数据和算力将不断提升智能；但这绝非已经（尘埃落定的）科学定论。AI能力构成一条（参差不齐的）前沿：某些任务超越人类，另一些却束手无策。对记得1998年过早卖出互联网股票之痛的基金经理来说，出售AI股票已成（绝对不可接受的禁忌）。"}, {"en": "AI has been here before. Twice, in the 1970s and again in the late 1980s, the field went through “AI winters”, when funding froze and research became a (tundra) of abandoned projects; a bust now would bring an (antarctic) chill to the startups at its edge. Boosters like to compare today's advances to the (neolithic) revolution, when farming transformed human life. The biologist E.O. Wilson put the danger more soberly: humanity, he said, combines (paleolithic) emotions, medieval institutions and godlike technology.", "zh": "AI曾经历过这样的时刻：20世纪70年代和80年代末先后出现“AI寒冬”，资金冻结，研究变成布满废弃项目的（苔原）；如今的崩盘也会给边缘初创公司带来（南极般的）严寒。鼓吹者喜欢把今天的进步与（新石器时代的）农业革命比较，那次革命改变了人类生活。生物学家E.O.威尔逊更为冷静地提醒：人类结合了（旧石器时代的）情绪、中世纪的制度，以及神一般的技术。"}, {"en": "The culture that produces all this is (hermetic) and more than a little (self-absorbed). A lab's (insignia) on a hoodie has become one of the most coveted status symbols in San Francisco. Founders with (cherubic) faces and (beatific) smiles speak with (seraphic) calm of building machines cleverer than themselves, while (disheveled) engineers in their twenties field pay offers that would make a footballer blush. Talent has become (nomadic), hopping between labs in a (demented) bidding war; capital is a (nomad) too, moving to wherever the next story is. Some founders follow (ascetic) regimes, fasting for days to optimize their bodies; their conferences, by contrast, have become (sybaritic) affairs. Co-founders who fall out become (estranged) and then litigious. Their (philanthropic) pledges are generous, their (devoted) followers online are legion and their (rabid) fans are intolerant of doubt.", "zh": "孕育这一切的文化相当（封闭神秘），也颇为（自我迷恋）。实验室的（徽标）印在连帽衫上，成了旧金山最令人眼热的身份象征之一。面容（天使般稚气）、笑容（幸福安详）的创始人，以（天使般宁静的）口吻谈论创造比自己聪明的机器；（不修边幅的）二十多岁工程师拿到足以让足球明星脸红的薪酬报价。人才越来越（四处流动），在实验室之间跳槽，卷入（疯狂的）竞价战；资本也是（游牧者），不断奔向下一个热门故事。一些创始人奉行（苦行主义的）生活，连续多日禁食以优化身体；他们参加的会议却是（纵情享乐的）盛会。闹翻的联合创始人（关系疏远），继而对簿公堂。他们的（慈善）承诺慷慨，网上（忠实的）追随者不计其数，而（狂热失控的）粉丝无法容忍质疑。"}, {"en": "Venture capitalists, whose returns are (asymmetric), since one winner can compensate for a hundred failures, are (disposed) to back long shots, and the AI labs they fund burn cash with something close to (pyromania). A startup's early life is an (anaerobic) sprint, spending faster than it can breathe in revenue until the (lactic) burn sets in. Each is a (larva) that may or may not turn into something with wings; most will (fold), as most always do. Much of the paper wealth of AI startups is, like the value of an out-of-the-money option, entirely (extrinsic): hope with a price tag. In the (prehistoric) era of computing, the late 1990s, a business plan on a napkin could raise millions; today a slide deck with “agent” on the cover can raise billions, though AI agents remain (embryonic). There are (myriad) such firms, and their valuations offer a (platonic) ideal of the growth stock: all future, no present.", "zh": "风险投资的回报是（不对称的）：一个成功项目可以弥补一百个失败，因此投资者（倾向于）押注小概率的巨大成功。他们资助的AI实验室烧钱的劲头近乎（纵火狂）。初创企业早期是一场（无氧）冲刺：烧钱速度远超收入增长，直到感到（乳酸）灼烧。每家企业都是可能长出翅膀、也可能永远长不大的（幼虫）；大多数最终将（倒闭），向来如此。AI初创公司的账面财富，很大程度上类似价外期权的（外在价值）：给希望标了价。在计算机史上仿佛（史前）时代的90年代末，一份餐巾纸上的商业计划就能募集数百万美元；如今一份封面写着“智能体”的幻灯片就能募集数十亿，尽管AI智能体仍处于（胚胎期）。这样的公司（不计其数），估值构成了成长股的（柏拉图式）理想：只有未来，没有现在。"}, {"en": "Competition may be a bigger threat than any shortage of customers. In January 2025 DeepSeek, an (iconoclastic) Chinese lab, released a model that rivaled American ones at a fraction of the cost, and Nvidia lost nearly $600bn of market value in a day, a (seismic) shock by any standard. Investors greeted it with remarkable (sangfroid) and in time bought back in, treating the episode as a bear (cub) of a correction rather than the real thing. But it was a reminder that models may become (generic) commodities, and that Chinese labs, which routinely (underbid) American rivals on price, have made an (inroad) into markets that Silicon Valley assumed were its own. Talk of an AI arms race has grown (chauvinistic) on both sides of the Pacific, and (diplomatic) wrangling over chips has become a fixture of summits. Calling Nvidia the new Cisco, the darling of 2000 that lost most of its value in the bust, is a (backhanded) compliment, and investors treat a merely good quarter from the company as a personal (snub).", "zh": "竞争也许比客户不足更危险。2025年1月，中国一家（打破传统的）实验室DeepSeek发布了成本远低于美国同行、性能却能匹敌的模型，英伟达单日市值蒸发近6000亿美元，按任何标准都是（地震般的）冲击。投资者却表现得非常（镇定自若），最终重新买入，把那次调整看成一只熊市（小熊），而非真正的大熊。但它提醒人们：模型可能变成（同质化的）商品；习惯于以更低价格（压价竞争）的中国实验室，已经（打入）硅谷自以为独占的市场。太平洋两岸的AI军备竞赛论调都越来越（狭隘民族主义的），围绕芯片的（外交）争执成了峰会常态。把英伟达称为新思科——后者在2000年风光无两，崩盘后失去大部分市值——是一种（明褒暗贬的）赞美；投资者甚至把英伟达一个仅仅“不错”的季度当作针对自己的（轻慢）。"}, {"en": "Silicon Valley's strength has always rested on its networks. AnnaLee Saxenian, a scholar of the region, showed how (ethnic) networks of Chinese and Indian engineers carried capital and know-how back and forth between California and Asia; those ties now run into the teeth of geopolitics. Plenty of investors claim to be (agnostic) about which model will win, buying the picks and shovels instead, while others hold an almost (mystic) faith in exponential curves. Warren Buffett's (laconic) advice, to be fearful when others are greedy, is quoted far more often than it is followed, and every (critic) of the boom is reminded that the skeptics of 1996 were more than three years early.", "zh": "硅谷的力量一直建立在关系网络上。研究该地区的安娜莉·萨克塞尼安指出，华人和印度工程师的（族裔）网络如何在加州与亚洲之间传递资本和知识；如今这些纽带迎面撞上地缘政治。许多投资者声称对哪种模型获胜抱（不押注特定赢家的）态度，转而购买“卖铲子”的企业；另一些人则对指数曲线怀着近乎（神秘主义的）信仰。沃伦·巴菲特（言简意赅的）建议——别人贪婪时要恐惧——被引用的次数远多于被遵循的次数；每一个繁荣的（批评者）都会被提醒，1996年的怀疑者提前了三年多。"}, {"en": "The boom has generated a literature of its own: founders' biographies that read as one long (panegyric), (eulogistic) magazine profiles, the occasional (vitriolic) (polemic) and the odd doorstopper of a (screed) whose back-cover (blurb) promises to explain everything. Mentions of AI on earnings calls have soared, and the calls themselves have become (long-winded), the language (florid) and (turgid) with jargon, the press releases written in (antiseptic) corporate-speak. Machines now write much of that prose, and it shows. AI-generated text is accused of being (bland) and (insipid): (hackneyed) phrases, (pleonastic) filler such as “end result”, (periphrastic) hedging and (labored) metaphors, strung together in sentences that are (mannered) or (stilted) where they should be (understated). In fairness, a model can (proofread) a prospectus in seconds and catch a missing (comma) of the kind that once cost a Maine dairy $5m in an overtime dispute. It still produces (garbled) citations and invents facts with complete (aplomb).", "zh": "繁荣也孕育了自己的文学：创始人的传记读起来像一篇没完没了的（颂词），杂志人物特写（歌功颂德），偶尔有（恶毒的）（论战文章），也有厚得像门挡的长篇（檄文），其封底（宣传短评）承诺解释一切。财报电话会中提到AI的次数飙升，通话本身越来越（冗长），措辞（辞藻华丽）且充斥（晦涩臃肿的）行话，新闻稿则由（消毒般毫无个性的）企业套话写成。如今许多文字是机器写的，痕迹明显。AI生成文本常被批评（平淡）而（乏味）：使用（陈腐）的惯用语、如“最终结果”这样的（冗赘）填充词、（迂回绕弯的）保留措辞、（费力生硬的）比喻，串成长句；本该（克制含蓄）的地方，却显得（矫揉造作）或（僵硬）。公平地说，模型能在几秒内（校对）招股说明书，发现一个漏掉的（逗号）；美国缅因州一家乳制品企业曾因为类似标点争议在加班费官司中损失500万美元。可它仍会生成（混乱错误的）引用，且以十足（从容自信）的姿态编造事实。"}, {"en": "There is no shortage of (opinionated) commentary. Television pundits are (histrionic), podcasters (glib), the occasional executive refreshingly (candid). The (disinterested) observer, with no position to talk up, is a rare creature. An (unguarded) remark by a chief executive, or an (adlib) aside at a conference, can move a stock by billions of dollars. On trading floors the mood swings from (agitated) to (contented) and back within a morning, and markets have a (sadistic) habit of rallying just after the bears capitulate, leaving them (discomfited).", "zh": "发表看法的人从来不缺（主观强烈的）评论。电视评论员表现（歇斯底里的），播客主持人（油嘴滑舌），偶尔有高管令人耳目一新地（坦率）。没有仓位需要吹捧的（公正无私的）观察者倒属稀有物种。首席执行官一句（不设防的）失言，或会议上（即兴的）插话，就能令股票市值变化数十亿美元。交易厅里，早晨之内心情可能从（焦躁的）变成（满足的）又转回去；市场常常（残酷地戏弄）空头：他们一投降，股价就涨，把他们弄得（狼狈不堪）。"}, {"en": "The signs of froth are there for those who look. Companies that add “AI” to their names or earnings calls see their shares jump, much as Long Blockchain's did; in 2024 American regulators fined two investment advisers for “AI washing”, overstating their use of the technology, an early (reprimand) to an industry that has been (infatuated) with the label. Quantum-computing stocks, many with scant revenue, soared on the promise of machines that must be chilled to (cryogenic) temperatures, and a decade or so earlier (quixotic) startups that planned to mine an (asteroid) for platinum attracted serious money before running out of it. Regulating AI is a (wicked) problem. Laws written for an earlier age look (antiquated), governments are (halfhearted), and labs that set up safety teams have been known to (disband) them. Some officials have made a (stab) at rules, but the (belated) reforms of one cycle tend to be fought by the lobbyists of the next.", "zh": "肯留意的人不难发现泡沫迹象。企业只要在名称或财报电话会里加上“AI”，股价就会像Long Blockchain当年一样上涨；2024年美国监管机构因夸大AI应用，处罚两家投资顾问公司，给这个（迷恋）标签的行业一次早期（训诫）。量子计算股票在营收微薄时暴涨，押注的是必须冷却到（极低温度）的机器；十来年前，一些打算去（小行星）采铂金的（异想天开的）初创企业，也曾吸引真正的资金，直到钱耗尽。监管AI是个（棘手而复杂的）难题。为旧时代制定的法律显得（过时），政府做事（敷衍），有的实验室建立安全团队后又将其（解散）。一些官员（尝试）立规矩，但某轮周期中（迟来的）改革，往往会遭到下一轮周期游说者的抵抗。"}, {"en": "Cheap money has fueled almost every episode. Walter Bagehot, the great Victorian editor of The Economist, whose (limpid) prose remains worth reading, observed that John Bull could stand many things but not two per cent: when safe assets yield little, savers reach for riskier ones. A long era of near-zero interest rates acted as an (anesthetic) on investors' judgment. Rising prices are a powerful form of (analgesia), dulling the pain of doubt, and when they stop rising the market's favorite (analgesic) is a rate cut. Easy credit is a (narcotic); a (hypodermic) injection of central-bank liquidity, administered after almost every wobble since 1987, has taught markets to expect the next one. William McChesney Martin, a former chairman of the Federal Reserve, said that the central bank's job was to take away the punch bowl just as the party gets going; a market in the grip of (dipsomania) never thanks it for doing so. Today's central bankers, (even-tempered) by profession and (measured) in their language, have good reason for (insomnia). Their (graduated) approach to raising and cutting rates has (damped) volatility in the past, but it cannot repeal the cycle.", "zh": "廉价资金助燃了几乎所有投机事件。《经济学人》维多利亚时代的伟大主编沃尔特·白芝浩，以至今值得阅读的（清晰流畅的）文章写道：约翰牛什么都忍得了，就是忍不了2%的利率；安全资产收益太低时，储户就转向高风险资产。长期接近零的利率成了投资者判断力的（麻醉剂）。股价上涨本身也是强效（镇痛），能麻痹疑虑之痛；一旦价格停止上涨，市场最喜欢的（止痛药）就是降息。宽松信贷像（麻醉毒品）；自1987年以来几乎每次波动后，央行都打一针流动性的（皮下注射），教会了市场期待下一针。前美联储主席威廉·麦克切斯尼·马丁说，央行的任务是在派对刚开始热闹时撤走酒碗；陷入（嗜酒成癖）的市场对此绝不会感谢。今天的央行行长职业上（性情平和），讲话（谨慎克制），却有充分理由（失眠）。他们（循序渐进的）加减息方式曾（抑制）波动，却无法废除周期。"}, {"en": "Markets that are (liquid) in good times become (viscid)—almost impossible to trade—in bad ones, as buyers vanish just when sellers need them most. A (placid), even (languid) summer can give way to (hectic) autumn trading, and a (torrid) rally to a (frigid) reception for every new share issue. Valuation models assume a (static) world, but the (kinetic) energy of a market in motion is hard to stop, and when it reverses, rallies become (spasmodic), volumes (tepid), prices (depressed) and the mood (subdued). Overconfidence is (chronic) among fund managers, (choleric) traders nurse (peptic) ulcers, and the spectacle of a once-feted founder pleading with creditors is as (pathetic) as it is familiar. A (marked) slowdown in AI spending would wreak (havoc) on the suppliers that depend on it, and a business model too (rigid) to adapt would not survive; even a (muted) response from customers to a new model can do damage.", "zh": "市场在好时候（流动性充足），坏时候却变得（黏滞难交易），因为买家恰好在卖家最需要他们时消失。（平静的）、甚至（慵懒的）夏季之后，可能接踵而来（忙乱的）秋季交易；（火热的）涨势之后，则可能是市场对每次新股发行（冷若冰霜的）反应。估值模型假设一个（静态的）世界，但运动中市场的（动能）难以制止；一旦逆转，反弹就变得（阵发性的），成交量（清淡），价格（低迷），情绪（沉闷）。基金经理的过度自信是（长期顽固的）问题；（暴躁的）交易员忍着（胃部的）溃疡；昔日备受吹捧的创始人向债权人乞求的景象既（可悲）又似曾相识。AI开支若（显著）放缓，会给依赖它的供应商造成严重（破坏）；过于（僵化）而无法适应的商业模式难以生存，即使客户对新模型反应（冷淡），也足以造成伤害。"}, {"en": "Where does this leave a (levelheaded) investor? The (dilemma) is old. Bubbles are rarely (premeditated) conspiracies; they are (unpremeditated) collective acts in which millions of outwardly respectable, (well-groomed), (informed), otherwise (hardheaded) people persuade one another. The (wizened) veterans of 2000 and 2008 view the boom with a (jaundiced) eye; younger traders, (enamored) of the technology and (inured) to drawdowns that the central bank always seemed to reverse, are (unmoved). Both camps can be (closed-minded). The (dyspeptic) bears of the late 1990s were right in the end, but their (mistimed) bets cost them dearly in the meantime; a line usually credited to Keynes, that markets can stay irrational longer than you can stay solvent, makes the point, though the attribution is itself (unsubstantiated). Even (jaded) analysts concede that going out on a (limb) against a (full-fledged) bubble is not for the (fainthearted), and the (stouthearted) bulls, for now, have had the better of the argument.", "zh": "这让（头脑冷静的）投资者怎么办？（两难处境）由来已久。泡沫很少是（事先预谋）的阴谋，更多是数百万（衣着体面）、（消息灵通）且平时（务实精明）的人共同参与的（未经预谋的）集体行动。经历过2000年和2008年的（饱经风霜）老手以（怀疑而不满的）眼光看待这轮繁荣；年轻交易员则（迷恋）技术，对那些央行似乎总会扭转的回撤早已（习以为常），因此（无动于衷）。两派都可能（思想封闭）。90年代末（心情烦躁的）空头最后是对的，但（时机不对的）押注让他们提前付出惨重代价。那句通常归功于凯恩斯的名言——市场保持非理性的时间，可能长于你保持偿付能力的时间——恰好说明问题，尽管出处本身（缺乏证据）。即使（厌倦了市场的）分析师也承认，冒险（走到树枝末梢）对抗一个（充分形成的）泡沫，并非（胆小者）所能承受；至少现在，（勇敢坚定的）多头占了上风。"}, {"en": "That argument divides (distinguished) economists and (accomplished) engineers alike. On one side stand (impassioned) defenders of the boom, (kindred) spirits of the railway promoters, who treat the opportunity as (sacred) and the doubters as (deranged). On the other stand (seasoned) investors offering an (unimpassioned) reading of the numbers, (dogged) in their skepticism and (unreserved) in their warnings. Most people in between are (engaged) but (distracted), (impressed) by the demonstrations, (acquainted) with the history and (resigned) to riding the wave. The (gnarled) old hands of the trading floor, (henpecked), as they would put it, by risk committees, keep their own counsel. Some (tightfisted) investors, (relieved) to have missed earlier fads, stay on the sidelines; others, (discombobulated) by a market that shrugs off every warning, have grown (dejected).", "zh": "这场争论同样分裂（杰出的）经济学家与（成就卓著的）工程师。一边是（热情激昂的）繁荣维护者，他们和当年铁路推销者是（志同道合的）人，把机会当成（神圣不可侵犯的）东西，把质疑者视作（疯狂失常的）。另一边则是（经验丰富的）投资者，对数字作出（不带激情的）解读，怀疑态度（坚定不移），警告也（毫不保留）。中间的大多数人虽然（参与其中），却注意力（分散）；他们对展示效果（印象深刻），对历史（有所了解），又（无奈接受）继续搭乘浪潮的现实。交易厅中（饱经风霜的）老手，受风险委员会（反复唠叨约束），宁可保持沉默。有些（吝啬谨慎的）投资者因为错过旧泡沫而（松了口气），继续旁观；另一些人则被无视所有警告的市场弄得（困惑失措），逐渐（沮丧）。"}, {"en": "Is the bulls' optimism (warranted)? Even if AI raises productivity, the gains may be hard to see in official statistics: the (hedonic) adjustments statisticians use to account for better computers struggle with a product whose quality changes monthly. Some of the gloom may prove (unfounded), and some of the hype (unwarranted). Optimism (grounded) in rising profits differs from optimism built on (contrived) metrics, and bulls who argue that price-to-earnings ratios are (outmoded) are repeating a line heard in 1929 and 1999. A (synoptic) view of the past four centuries suggests that the technology usually lives up to the promise while the share prices do not. A (pragmatic) investor might therefore (withhold) judgment on the technology while staying skeptical of the price, which is easier said than done. Optimism lends every prospect a (chromatic) richness; what investors need is an (achromatic) lens, one that corrects for the color a good story adds.", "zh": "多头的乐观有（根据）吗？即使AI提高生产率，收益也未必容易显现在官方统计里：统计学家用来反映电脑质量改善的（享乐质量）调整，很难衡量每个月质量都在变化的产品。有些悲观也许（毫无根据），有些炒作则（缺乏合理依据）。建立在利润上升（事实基础上）的乐观，不同于建立在（人为编造的）指标上的乐观；声称市盈率已经（过时）的多头，正重复1929年和1999年的老话。从四世纪历史作（全景式）观察可以看出：技术最终往往兑现承诺，股价却不一定。一个（务实的）投资者或许应该对技术前景（暂缓）判断，同时对价格保持怀疑；说来容易做来难。乐观给每一种前景涂上（色彩丰富的）光泽，而投资者需要的是（无色的）镜头，能校正好故事带来的色偏。"}, {"en": "History offers some comfort. Carlota Perez, an economist, argues that technological revolutions typically pass through a speculative “installation” phase, in which financial capital overbuilds the new infrastructure, followed by a crash and then a “deployment” phase in which the technology at last spreads through the economy. Railways and fiber both fit the pattern: the investors were (shattered), but the tracks and cables remained and the economy benefited. If AI follows the same course, today's spending may be (merited) in the long run even if it proves ruinous for those who did the spending, and the (untapped) markets the bulls describe may eventually materialize, if not on their timetable. The appetite for chips will one day be (satiated) and some markets (saturated); the resulting glut, like the fiber glut after 2001, may then be absorbed by uses nobody has yet imagined. The question is not whether a technology is real, since railways and the internet were real, but whether the price is right, and who will bear the losses if it is not.", "zh": "历史也带来一点慰藉。经济学家卡洛塔·佩雷斯认为，技术革命通常经历投机性的“安装”阶段：金融资本过度建设新设施；随后发生崩盘，再进入技术真正普及的“部署”阶段。铁路和光纤都符合模式：投资者（受到重创），轨道与电缆却留了下来，经济最终受益。如果AI也如此，今天的开支或许从长远看是（值得的），即使掏钱者因此破产；看多者描绘的（尚未开发的）市场最终也可能出现，只是不会遵循他们的时间表。芯片需求总有一天会得到（满足），部分市场也会（饱和）；由此产生的过剩，就像2001年后光纤过剩一样，最终可能被尚未想到的用途吸收。问题不是技术是否真实——铁路和互联网都真实存在——而是价格是否合适，以及价格不合适时由谁承担亏损。"}, {"en": "Every boom is (defined) by the same ingredients: a real innovation, (unbridled) credit, (inflamed) imaginations and warnings (muffled) by the noise of rising prices. The habits are (ingrained). Investors persuade themselves that growth can be (sustained) indefinitely, that today's champions will (wield) their market power forever and (meld) technology and finance into a perpetual-motion machine, and that any firm with a (foothold) in AI will keep it. Each boom claims to break the (mold); lo and (behold), the same assumptions were made about railways, radio and the internet. The (hallowed) names of one boom, from the Railway King to the Nifty Fifty, often end it with reputations (marred) or worse; few emerge (unspotted), and much of the praise turns out to have been (undeserved). Investors' love for a hot stock is often (unrequited), and the (unwonted) caution that follows a crash rarely lasts. There is a (morbid) fascination in reading about the (squalid) ends of (assorted) promoters, from Hudson's flight from his creditors to the (wretched) final years of John Law, yet the (perfervid) boosters and (fervid) believers of each era rarely suppose that they will join the list. The most (collected) investors are usually those who (acquired) their skepticism the hard way, and money (undirected) by any analysis is always the first to flee.", "zh": "每次繁荣都（由）相同要素（界定）：真实创新、（不受约束的）信贷、（受到煽动的）想象，以及被上涨价格的喧嚣（压低声音的）警告。这些习惯（根深蒂固）。投资者说服自己增长能够无限（持续），今日的赢家会永远（运用）市场力量，并把技术与金融（融合）成永动机；任何已在AI领域拥有（立足点）的公司都能守住优势。每轮繁荣都声称打破（旧模具），但（瞧啊），人们当年对铁路、无线电和互联网也是这样想的。铁路大王、“漂亮五十”等昔日（备受尊崇的）名字，常常以名誉（受损）甚至更糟的结局谢幕；很少有人能（毫无污点）地脱身，大部分赞誉后来证明（名不副实）。投资者对热门股的爱往往（得不到回报），崩盘后（罕见的）谨慎也不会持续太久。读那些各色推销者（悲惨而令人不安的）末路，从哈德逊躲债到约翰·劳（穷困潦倒的）晚年，令人产生（病态的）兴趣；但各时代（狂热激昂的）鼓吹者和（热情高涨的）信徒，很少认为自己会列入其中。最（镇定自若的）投资者，往往靠惨痛经历才（获得）怀疑精神；而没有任何分析（指引）的资金，总是最先逃走。"}, {"en": "A bubble can behave like a (nova), flaring brightly and then subsiding while the star survives, or like a (supernova), which destroys its star. The railway boom was the first kind; the Mississippi scheme was the second. Which kind AI turns out to be will depend less on the technology than on how much debt is piled on top of it, and on who holds that debt when sentiment turns. Somewhere in an (attic) there are still share certificates from 1720, 1929 and 2000, souvenirs of fortunes that were real until they were not.", "zh": "泡沫可以像（新星）一样，短暂耀眼地爆发后消退，而恒星幸存；也可能像（超新星），连恒星本身都被毁灭。铁路繁荣属于前一种，密西西比计划属于后一种。AI最终是哪一种，取决于压在技术上的债务有多少，以及情绪转向时债务握在谁手中。某个（阁楼）里，也许仍留着1720年、1929年和2000年的股票凭证，纪念那些曾经真实、最终又消失的财富。"}, {"en": "A (coda) from the Netherlands. In the hunger winter of 1944-45, under German occupation, starving Dutch families ate tulip bulbs in earnest; the luxury of 1637 had become a famine food. Today the tulip is a national symbol, Delft (ceramic) tulip vases fetch handsome sums at auction, and the flower auction at Aalsmeer is among the largest in the world. The Netherlands still dominates the global trade in flowers and bulbs, a lasting dividend from a craze that Mackay treated as pure folly. Investors' appetite for the next big thing is never (sated) for long, and the whole (panorama) of financial history suggests it never will be. Bubbles are not merely episodes of madness; they are also one way in which societies pay for the future, at a price borne by whoever is holding the asset when the music stops. The trick is not to be that person. The evidence of four centuries is that almost everyone believes they will not be.", "zh": "再以荷兰的故事作（尾声）。1944—45年德国占领下的“饥饿之冬”，饥饿的荷兰家庭真的靠吃郁金香球茎活命；1637年的奢侈品变成了饥荒食品。今天郁金香是国家象征，代尔夫特（陶瓷）郁金香花瓶在拍卖会上价格不菲，阿尔斯梅尔的鲜花拍卖市场是世界上最大的市场之一。荷兰依然主导全球花卉与球茎贸易，这是那场被麦凯视为纯粹愚行的狂热留下的持久红利。投资者追逐下一个大机会的胃口，不会长久得到（满足）；金融历史的整幅（全景图）表明，以后也不会。泡沫不仅是疯狂的插曲，还是社会为未来筹资的一种方式；代价由音乐停止时仍持有资产的人承担。诀窍是不成为那个人。四个世纪的证据表明，几乎每个人都相信自己不会是。"}];
const HAS_TITLE = true;

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-blooms-booms-and-busts-v1';
const LS_OLD_KEY = 'audiobook-blooms-booms-and-busts-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
</body>
</html>
