n and grandchildren grow up in the banlieues, suburban housing estates where unemployment is high and where riots erupted in 2005 and again in 2023, after police shot a teenager. Drug trafficking has become a (scourge) in parts of Marseille, and jihadist terrorism, which killed more than 230 people in 2015-16, remains a (menace). The hard right argues that Europe's borders are far too (permeable).", "zh": "移民问题助长了强硬右翼的崛起。超过十分之一的人口出生在国外，其中许多人来自北非和西非的前殖民地，他们定期汇回的一笔（汇款），就可能帮助家乡的一户人家维持生计。他们的许多子孙在“banlieues”长大，即失业率高企的郊区住宅区；2005年那里曾爆发骚乱，2023年警察枪杀一名少年后骚乱再起。毒品走私已成为马赛部分地区的（祸害），2015年至2016年间造成230多人死亡的圣战恐怖主义仍是一大（威胁）。强硬右翼认为，欧洲的边界太容易（渗透）了。"}, {"en": "Some French attitudes surprise outsiders. Politicians' private lives have long been treated as private: François Mitterrand's second family was an open secret among journalists for years, and when a magazine exposed François Hollande's (dalliance) with an actress in 2014, many voters shrugged. Few French voters wish to play the (prude), and the state is reluctant to (obtrude) into the bedroom. Yet French manners are more formal than Anglo-Saxon ones: strangers are greeted with \"bonjour\" and addressed as vous. The French can seem reserved at first, but they are (sociable) and (amiable) once the ice is broken.", "zh": "法国人的一些态度令外人吃惊。政客的私生活长期以来被视为私事：弗朗索瓦·密特朗的第二个家庭多年来在记者圈里是公开的秘密；2014年一家杂志曝光弗朗索瓦·奥朗德与一名女演员的（私情）时，许多选民只是耸耸肩。很少有法国选民愿意扮演（拘谨守旧者），国家也不愿（干涉）私人卧室里的事。不过，法国人的礼节比盎格鲁-撒克逊人更正式：对陌生人要说“bonjour”问好，并以“vous”相称。法国人起初可能显得拘谨，但一旦打破僵局，他们就既（爱交际）又（友善）。"}, {"en": "In foreign affairs France punches above its weight. Since Brexit it has been the EU's only nuclear power and its only permanent member of the UN Security Council, and in 2025 Mr Macron offered to discuss how its nuclear deterrent might (extend) protection to European allies. Russian (belligerence) has made higher military spending politically (justifiable), even amid budget cuts. France has taken a hawkish (stance) on Ukraine, helping to (forge), with Britain, a group of willing countries ready to back any ceasefire, and it has invested in (reconnaissance) satellites and drones. It also accuses Russia of (interference) in its elections and of spreading disinformation in Africa.", "zh": "在外交事务上，法国的影响力超出了它的分量。英国脱欧后，法国成为欧盟唯一的核大国，也是欧盟唯一的联合国安理会常任理事国；2025年，马克龙先生提出可以讨论法国的核威慑如何把保护（延伸）到欧洲盟友。俄罗斯的（好战）使提高军费开支在政治上变得（合情合理），即便是在预算削减之际。法国在乌克兰问题上采取了鹰派（立场），与英国一道帮助（缔造）了一个准备支持任何停火的“意愿联盟”，并投资于（侦察）卫星和无人机。它还指责俄罗斯（干预）其选举，并在非洲散布虚假信息。"}, {"en": "France likes to think of its role in the world as a matter of (prestige) as much as power. The Paris climate (accord) of 2015, negotiated under French leadership and hailed as an (auspice) of greater international co-operation, remains its proudest diplomatic achievement, and in September 2025 Mr Macron recognized a Palestinian state at the UN. France has begun returning looted African treasures, examining the (provenance) of objects in its museums; in 2021 it handed 26 royal artifacts back to Benin. But French diplomats know that their country's (puissance) has limits. In the Sahel its influence has collapsed, and in the Middle East its voice carries less weight than it once did. Critics see in the constant summitry a (pretence) of great-power status that masks growing (impuissance). Mr Macron's admirers retort that France's (relevance) comes from its ideas, not its size.", "zh": "法国喜欢把自己在世界上的角色视为一个关乎（威望）也关乎实力的问题。2015年在法国推动下达成的巴黎气候（协定），曾被誉为国际合作前景向好的一个（吉兆），至今仍是法国最引以为傲的外交成就；2025年9月，马克龙先生在联合国承认了巴勒斯坦国。法国已开始归还被掠夺的非洲珍宝，审查其博物馆中藏品的（来源）；2021年，它将26件王室文物归还贝宁。但法国外交官们知道，他们国家的（实力）是有限的。在萨赫勒地区，法国的影响力已经崩塌；在中东，它的声音也不如从前那样有分量。批评者认为，频繁举行的峰会不过是大国地位的（假象），掩盖了日益加剧的（无力）。马克龙先生的崇拜者则反驳说，法国的（重要性）来自它的思想，而不是它的体量。"}, {"en": "The presidential election next April will (hinge) on whether the mainstream can unite behind a single candidate. Édouard Philippe, a former prime minister, is the (presumable) beneficiary of any agreement to unite the center, and polls above 20%, but he faces rivals from his own camp, and the right and left are split. Much is at (stake). A victory for the hard right would be a (consequence) of decades of disappointment, and its program, which promises to curb immigration and lower the retirement age, does not (bode) well for the public finances. Those tensions (forebode) a clash with Brussels and the markets, some say; others think the party would moderate in office, as Giorgia Meloni's did in Italy. For many voters the (choice) may come down to the lesser of two evils. Predicting French politics even six months out is a fool's (errand).", "zh": "明年4月的总统选举将（取决于）主流政党能否团结在一位候选人身后。如果中间派就共同候选人达成协议，前总理爱德华·菲利普可以被视为（有理由推定的）受益者；他的民调支持率超过20%，但他面临来自本阵营的对手，而左右两翼也都四分五裂。此次选举（利害）重大。强硬右翼若获胜，将是数十年失望的（结果），而它的纲领承诺限制移民、降低退休年龄，这对公共财政而言并不（预示）着什么好事。有人认为，这些紧张局势（预示）着法国将与布鲁塞尔及金融市场发生冲突；另一些人则认为该党执政后会变得温和，就像焦尔吉娅·梅洛尼的政党在意大利那样。对许多选民来说，这一（选择）可能归结为两害相权取其轻。哪怕只提前半年预测法国政局，也是一桩徒劳的（差事）。"}, {"en": "It would take the (clairvoyance) of Nostradamus, whose prophecies were published in 1555, to say how it all ends. Nobody has (foreknowledge) of what a hard-right presidency would bring, and it is hard to (envisage) a new leader able to unite a fractured country. Yet the present mood need not (presage) decline. France has survived every (vicissitude), from the Hundred Years' War to the Occupation, and has a habit of reinventing itself, from the Fifth Republic to the rebuilt Notre-Dame. The old (adage) still holds: the more things change, the more they stay the same. None of its problems is (irremediable). In the closing scene of Edmond Rostand's \"Cyrano de Bergerac\", the dying hero declares that one thing at least will go with him to heaven unstained: his (panache). France still has plenty of it.", "zh": "要说清这一切将如何收场，恐怕需要诺查丹玛斯那样的（预知未来的能力），他的预言集出版于1555年。至于强硬右翼总统上台后会带来什么，谁也没有（确切的预知），也很难（设想）出一位能够团结这个四分五裂的国家的新领导人。然而，眼下的情绪未必（预兆）着衰落。从百年战争到德占时期，法国挺过了每一次（变迁沧桑），而且它有自我重塑的习惯，从第五共和国到重建的巴黎圣母院皆是如此。那句古老的（格言）依然适用：万变不离其宗。它的问题没有一个是（无可挽回的）。在埃德蒙·罗斯丹的《西哈诺·德·贝热拉克》的最后一幕中，垂死的主人公宣称，至少有一样东西将洁白无瑕地随他升入天堂：他的（潇洒气概）。法国依然不乏这种豪迈而独特的风采。"}];
const HAS_TITLE = true;
const SUBTITLE_EN = "";
const SUBTITLE_ZH = "";

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  if (typeof SUBTITLE_EN !== 'undefined' && SUBTITLE_EN) {
    const sub = document.createElement('div');
    sub.className = 'book-subtitle';
    sub.textContent = SUBTITLE_EN;
    div.appendChild(sub);
  }
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  if (typeof SUBTITLE_ZH !== 'undefined' && SUBTITLE_ZH) {
    const subZh = document.createElement('div');
    subZh.className = 'zh-subtitle';
    subZh.textContent = SUBTITLE_ZH;
    div.appendChild(subZh);
  }
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-grandeur-and-gloom-v1';
const LS_OLD_KEY = 'audiobook-grandeur-and-gloom-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
</body>
</html>
