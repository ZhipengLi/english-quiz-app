 the city's cultural brand flourished: the Biennale had been founded in 1895, and in 1932 it added a film festival on the Lido, the oldest in the world.", "zh": "20世纪把威尼斯拉向了大陆。从1917年起，潟湖对岸的马格拉发展起一个工业港，有造船厂、化工厂和一座（炼油厂），1933年，一座公路桥首次把这座城市与大陆连接起来。在望得见圣马可的地方烟囱冒着烟，这种（不协调）并没有困扰规划者，他们看到的是就业机会。一代又一代威尼斯人搬到了梅斯特雷和马格拉，那里有现代化的公寓，而不是潮湿的宫殿，（沉闷单调的）卧城郊区不断蔓延。20世纪80年代起重工业衰落，数以千计的工人随之遭到（裁员）。与此同时，这座城市的文化品牌蓬勃发展：双年展早在1895年就已创办，1932年又在利多岛增设了一个电影节，那是世界上最古老的电影节。"}, {"en": "Then came the flood. On November 4th 1966 a storm surge driven by the scirocco pushed the tide to 194cm above the reference level, the highest on record, and the sea broke through the defensive walls on the Lido. For more than a day much of the city was cut off and without power, and the (emergency) revealed how exposed it was to the (fury) of the Adriatic. On the same day the Arno flooded Florence. The double (calamity) stirred the world's (magnanimity): UNESCO launched an international campaign, and private committees in Britain, America and elsewhere raised money, a (generosity) that has paid for the restoration of hundreds of churches and works of art. The shock was (salutary), and the committees' work has often been (exemplary). Italy's own response was (dilatory): a special law for Venice was passed in 1973, but construction of mobile flood barriers did not begin until 2003.", "zh": "接着，洪水来了。1966年11月4日，西洛可风驱动的风暴潮把潮位推高到基准面以上194厘米，创下有记录以来的最高值，海水冲破了利多岛上的防波堤。一天多的时间里，城市大部分地区与外界隔绝、断电，这场（紧急状况）暴露出它在亚得里亚海的（狂暴）面前是多么不堪一击。同一天，阿尔诺河淹没了佛罗伦萨。这场双重（灾难）激起了全世界的（宽宏大度）：联合国教科文组织发起了一场国际运动，英国、美国等地的民间委员会纷纷筹款，这份（慷慨）资助了数以百计的教堂和艺术品的修复。这次冲击是（有益的），这些委员会的工作也常常堪称（典范）。意大利自己的反应却（拖拖拉拉）：1973年通过了一部威尼斯特别法，但可移动防洪闸直到2003年才开工建设。"}, {"en": "The quieter crisis is one of (demography). The historic city's population has fallen almost every year since the 1950s, on a (trajectory) of roughly 1,000 fewer residents a year in recent times. Those who remain are old: Venice could serve as a case study in (gerontology), with far more funerals than christenings and a (paucity) of children that has closed schools. Each family that leaves weakens the (viability) of the shops, doctors and services that make daily life possible. When the last baker or hardware store goes, every (amenity) has to be fetched from the mainland, and the (vibrancy) of a neighborhood drains away.", "zh": "更无声的危机是（人口结构）的危机。自20世纪50年代以来，历史城区的人口几乎年年减少，近年来的（轨迹）是每年大约减少1000名居民。留下来的人都上了年纪：威尼斯可以作为（老年学）的研究案例，葬礼远多于洗礼，儿童的（稀少）已导致学校关闭。每离开一个家庭，就削弱了那些维持日常生活的商店、医生和服务的（生存能力）。当最后一家面包店或五金店关门时，每一样（生活便利设施）都得去大陆上获取，一个街区的（活力）也随之流失。"}, {"en": "Residents have turned (advocacy) into an art. In 2009 a group of them staged a mock funeral for the city, carrying a coffin through the canals and delivering a (eulogy) for a Venice they said was dying. An electronic counter in a pharmacy window near the Rialto tracks the shrinking population. Activists organize protests, run housing campaigns and show (solidarity) with neighbors facing eviction. Many are (weary) of being told that their city is a museum, and some are frankly (grumpy) about the crowds.", "zh": "居民们把（维权倡导）变成了一门艺术。2009年，一群居民为这座城市举行了一场模拟葬礼，抬着一口棺材穿过运河，为他们所说的正在死去的威尼斯致（悼词）。里亚尔托附近一家药店的橱窗里，有一个电子计数器记录着不断减少的人口。社会活动人士组织抗议、开展住房运动，并与面临被驱逐的邻居们（团结一致）。许多人（厌倦）了别人说他们的城市是一座博物馆，有些人对拥挤的人群更是毫不掩饰地表现得（脾气暴躁）。"}, {"en": "The main culprit is housing. Venice cannot grow: there is no new land, and the (inelasticity) of supply means that every flat turned into a holiday let is a flat lost to residents. In 2023 the number of tourist beds in the historic center overtook the number of residents for the first time. The (voracity) of the short-let market, which pays owners far more than a local tenant could, has created a (scarcity) of long-term rentals and a widening (disparity) between rents and local wages. Young Venetians call it an (inequity) that pushes them across the bridge to Mestre.", "zh": "罪魁祸首是住房。威尼斯无法扩张：没有新的土地，供给的（缺乏弹性）意味着，每一套被改成度假出租屋的公寓，都是居民失去的一套公寓。2023年，历史城区的游客床位数首次超过居民人数。短租市场的（贪婪）让房东赚到的钱远远超过本地租客所能支付的，这造成了长期租房的（短缺），以及房租与本地工资之间不断扩大的（差距）。威尼斯年轻人称之为一种（不公），正把他们推过大桥，赶到梅斯特雷。"}, {"en": "Regulation has been weak. In 2022 parliament gave Venice the power to limit short-term lets in the historic center, but the city was slow to use it; critics blame (leniency) toward landlords, many of whom vote, and an (allergy) to anything that might deter visitors. Policy has often been (contradictory): the city welcomed new hotels even as it lamented the loss of residents. OCIO, a residents' group that acts as a (gadfly) on housing, has documented how many homes sit empty or serve only tourists. The issue is (thorny) because many Venetians who have moved away still own flats in the city and let them out, so politicians' (timidity) is not hard to understand.", "zh": "监管一直软弱无力。2022年，议会授权威尼斯限制历史城区的短期出租，但市政府迟迟没有动用这一权力；批评者指责它对房东过于（宽大），而许多房东都有选票，还指责它对任何可能吓跑游客的举措都有（过敏般的抵触）。政策常常（自相矛盾）：市政府一边哀叹居民流失，一边又欢迎新酒店进驻。居民团体OCIO在住房问题上扮演着（牛虻）的角色，它记录了有多少住房空置或只供游客使用。这个问题很（棘手），因为许多已经搬走的威尼斯人在城里仍有公寓并把它们出租，所以政客们的（畏首畏尾）也就不难理解了。"}, {"en": "Then there are the visitors. Estimates of their number vary wildly, from about 20m a year to 30m or more, since day-trippers were not counted until recently, but all agree that the total grew (exponentially) once cheap flights, cruise ships and short lets arrived. Most follow the same (itinerary): the train or bus to the edge of town, the walk to the Rialto, the (obligatory) selfie on the bridge, a (cursory) look at St Mark's, perhaps a gondola ride, then back. Few (stray) far from the main routes. Monuments are photographed (perfunctorily), and the summer (hyperactivity) around the Rialto, with its (pesky) touts and selfie sticks, is a world away from quiet backwaters a few hundred meters off.", "zh": "然后是游客。对游客人数的估计相差悬殊，从每年约2000万到3000万甚至更多，因为直到最近才开始统计一日游游客，但所有人都同意，随着廉价航班、邮轮和短租的出现，游客总数呈（指数级）增长。大多数人走的是同一条（路线）：乘火车或巴士到城边，步行到里亚尔托，在桥上拍一张（必不可少的）自拍，（匆匆）看一眼圣马可，或许再坐一趟贡多拉，然后返回。很少有人（偏离）主要路线走得很远。名胜古迹只被（敷衍地）拍几张照片，夏天里亚尔托周边的（过度喧闹），还有（讨厌的）揽客者和自拍杆，与几百米外宁静的僻静水巷判若两个世界。"}, {"en": "Tourism pays the bills: hotels, restaurants, gondolas and countless (ancillary) businesses depend on it. But it also threatens to (stultify) the city. Shops that once sold bread, shoes or hardware now sell masks, magnets and (tawdry) trinkets, and the (homogeneity) of the busiest lanes, lined with stall after (tatty) stall, breeds a kind of (monotony). Crowds (annoy) residents trying to get to work, and the (antipathy) runs both ways. Graffiti telling tourists to go home reveal a growing (animosity), though most Venetians know that without visitors their city would be broke.", "zh": "旅游业支付着账单：酒店、餐馆、贡多拉以及无数（附属）行业都依赖它。但它也可能让这座城市（变得呆滞无生气）。曾经卖面包、鞋子或五金的商店，如今卖的是面具、冰箱贴和（俗气的）小饰品；最繁忙的街巷两旁一个接一个都是（破旧）的货摊，这种（千篇一律）造成了一种（单调乏味）。人群（惹恼）了赶着上班的居民，而这种（反感）是双向的。叫游客回家的涂鸦，显示出日益增长的（敌意），尽管大多数威尼斯人知道，没有游客，他们的城市就会破产。"}, {"en": "Nothing symbolized the strain better than cruise ships. For years vessels of 100,000 tons or more sailed with apparent (impunity) up the Giudecca canal, in the (vicinity) of St Mark's, towering over the domes and sending thousands of passengers down the (gangway) for a few hours ashore. Residents would (decry) fumes that (sully) the air and the destructive wakes created by the vessels' (velocity) through narrow channels. After years of protests, and many an (entreaty) from UNESCO, which threatened to put Venice on its list of endangered sites, the government banned large ships from the Giudecca canal and St Mark's basin from August 2021 and set aside (compensatory) aid for firms that lost business. Many cruise lines now call at Trieste or Ravenna, or at the industrial docks of Marghera.", "zh": "没有什么比邮轮更能象征这种压力了。多年来，10万吨以上的巨轮显然可以（不受惩罚）地驶入朱代卡运河，在圣马可的（附近）航行，高耸于教堂穹顶之上，把成千上万的乘客经（舷梯）送上岸游玩几个小时。居民们（谴责）巨轮排放的废气（污染）空气，也指责船只以一定（航速）驶过狭窄水道时掀起的尾浪会破坏堤岸。经过多年抗议，加上联合国教科文组织的多次（恳求），它曾威胁要把威尼斯列入濒危遗产名录，政府终于从2021年8月起禁止大型船只驶入朱代卡运河和圣马可湾，并拨出（补偿性）援助，用于帮助因此失去生意的企业。许多邮轮公司如今停靠的里雅斯特或拉文纳，或者马格拉的工业码头。"}, {"en": "The city has also tried to legislate manners. Its police regulations (expressly) forbid swimming in the canals, cycling, picnicking on monuments and wandering around bare-chested, and offenders face fines that can run to hundreds of euros. Officials frame the rules as matters of (decency) and (propriety); critics call them (petty), and some, such as bans on sitting on bridges and steps, seem aimed as much at (vagrancy) as at tourist (delinquency). Some behavior is undeniably (unseemly): visitors have been caught diving off bridges and riding motorized surfboards down the Grand Canal. The (fatuity) of such stunts tests the (civility) of even patient Venetians.", "zh": "这座城市还试图为礼仪立法。它的治安条例（明确）禁止在运河里游泳、骑自行车、在古迹上野餐以及光着膀子四处闲逛，违者可被处以高达数百欧元的罚款。官员们把这些规定说成是关乎（体面）和（得体）的问题；批评者则说它们（小题大做），其中一些规定，比如禁止坐在桥上和台阶上，似乎既针对游客的（不法行为），也同样针对（流浪）。有些行为无疑（有失体统）：曾有游客被抓到从桥上跳水，或者踩着电动冲浪板在大运河上飞驰。这类噱头的（愚蠢）考验着即便是最有耐心的威尼斯人的（礼貌）。"}, {"en": "Since August 2024 tour groups have been capped at 25 people, and the guides who (accompany) them may no longer use loudspeakers; those who fail to (comply) risk fines of up to €500. A (snappy) campaign, #EnjoyRespectVenezia, urges visitors to behave. Feeding the (mangy) pigeons of St Mark's Square has been banned since 2008, partly because (veterinary) experts warn that the birds spread disease and partly because their droppings eat into stone. Some visitors find all this (prissy), and the city a (killjoy). Most Venetians simply wish there were fewer people to apply the rules to.", "zh": "自2024年8月起，旅游团人数上限为25人，（陪同）他们的导游不得再使用扩音器；不（遵守）规定者可被罚款最高500欧元。一项名为“#EnjoyRespectVenezia”的（简洁醒目的）宣传活动敦促游客守规矩。自2008年起，在圣马可广场喂那些（脏兮兮生癞的）鸽子已被禁止，部分原因是（兽医）专家警告这些鸟会传播疾病，部分原因是它们的粪便会腐蚀石头。一些游客觉得这一切（过分拘谨），觉得这座城市是个（扫兴的人）。大多数威尼斯人只是希望需要遵守这些规定的人能少一些。"}, {"en": "The boldest experiment is the day-tripper fee. Introduced as a trial on 29 days in 2024, when it raised €2.2m from about 450,000 visitors, the (levy) was extended to 54 days in 2025 and to 60 this year, between April 3rd and July 26th, from 8:30am to 4pm. Booking is (compulsory) for day visitors to the historic center, who must show a QR pass at checkpoints; residents of the Veneto, overnight guests, students, workers and children under 14 are exempt. This year's (tally) was more than 650,000 paid vouchers and over €5m in revenue, money that supporters say can help (defray) the cost of cleaning and policing a city built for far fewer people. Officials say (preliminary) data show less crowding on the busiest days than in previous years. The price of (entry) is €5 for those who book at least four days ahead and €10 for later bookings.", "zh": "最大胆的试验是一日游游客费。这项（收费）于2024年在29天里试行，从约45万名游客那里筹得220万欧元，2025年扩大到54天，今年又扩大到60天，时间为4月3日至7月26日之间，每天上午8点半至下午4点。前往历史城区的一日游游客必须预约，这是（强制性的），并须在检查站出示二维码通行证；威尼托大区居民、过夜游客、学生、上班族和14岁以下儿童可获豁免。今年的（统计数字）是超过65万张付费凭证、逾500万欧元收入，支持者说，这笔钱可以帮助（支付）一座为少得多的人口而建的城市的清洁和治安费用。官员们说，（初步）数据显示，最繁忙日子的拥挤程度低于往年。（入城）价格为：提前至少四天预约者5欧元，较晚预约者10欧元。"}, {"en": "Critics say the effect has been (nugatory). A (measly) €5 or €10 is unlikely to deter someone who has already paid for a flight; in the first 42 days of this year about 268,000 tickets were sold at the €10 rate and 245,000 at €5, and there is no cap on how many may come. Some suspect the motive is chiefly (pecuniary). Mr Venturini wants to raise the price to between €30 and €50 on peak days, which would require Rome to lift the (statutory) ceiling set by national law. A (balky) coalition government may not agree.", "zh": "批评者说，这项收费的效果（微不足道）。（区区）5欧元或10欧元，不太可能吓退已经买了机票的人；今年头42天，按10欧元价格售出的门票约26.8万张，按5欧元售出的约24.5万张，而且对来访人数没有上限。有人怀疑，其动机主要是（金钱上的）。文图里尼先生希望在高峰日把价格提高到30至50欧元，这需要罗马方面取消国家法律规定的（法定）上限。一个（不愿配合的）联合政府未必会同意。"}, {"en": "Tourism of the most (splashy) kind arrived in June 2025, when Jeff Bezos, the founder of Amazon, married Lauren Sánchez in Venice in front of some 200 guests, among them Oprah Winfrey, Kim Kardashian and Tom Brady. The couple were (coy) about the venues, while (peery) photographers scanned each arriving water taxi for celebrities. The media (frenzy), the (flaunty) display of wealth and the parade of (celebrity) guests angered activists, who formed a group called No Space for Bezos and held a protest (rally); Greenpeace unfurled a banner in St Mark's Square reading \"If you can rent Venice for your wedding you can pay more tax\". The couple asked guests not to bring gifts and promised donations to Venetian (charity) instead, and the mayor welcomed them. Whether such events are an asset or a (liability) for a fragile city is something Venetians still argue about.", "zh": "最（招摇）的一类旅游在2025年6月到来：亚马逊创始人杰夫·贝索斯在威尼斯迎娶劳伦·桑切斯，约200名宾客到场，其中包括奥普拉·温弗瑞、金·卡戴珊和汤姆·布雷迪。新人对婚礼场地（讳莫如深），（好奇窥探的）摄影师则紧盯每一艘驶来的水上出租车，搜寻名流的身影。媒体的（狂热）、（炫耀的）财富排场以及（名流）宾客的阵仗，激怒了社会活动人士，他们组成了一个名为“贝索斯没有立足之地”的团体，并举行了抗议（集会）；绿色和平组织在圣马可广场展开一条横幅，上面写着：“如果你能租下威尼斯办婚礼，你就能多交点税。”这对新人请宾客不要带礼物，并承诺向威尼斯的（慈善事业）捐款，市长也对他们表示欢迎。这类活动对一座脆弱的城市究竟是资产还是（负担），威尼斯人至今仍在争论。"}, {"en": "The sea remains the biggest threat, and Venice's answer is MOSE, a system of 78 hollow steel gates set into the seabed at the lagoon's three inlets. Normally the gates lie (stationary), filled with water, on the floor of the channels; when a high tide is forecast, compressed air is pumped in and they rise to seal off the lagoon from the Adriatic. The (enormity) of the project is matched by its cost, about €5.5bn, some €1.3bn more than first planned. It was (tardy), too: begun in 2003, it was first raised in October 2020, and critics inclined to (naysay) any engineering fix had long dismissed it as a (folly). Since then it has done its job. By early 2025 it had been raised nearly 100 times, sparing St Mark's and much of the city from repeated flooding, which has gone some way to (allay) fears.", "zh": "大海仍是最大的威胁，而威尼斯的应对之策是“摩西”系统，即在潟湖三个入海口的海床上安装的78道空心钢闸门。平时，闸门灌满海水，（静止）地躺在水道底部；一旦预报有高潮，就向闸门内泵入压缩空气，闸门随之升起，把潟湖与亚得里亚海隔开。这项工程的（浩大）与其造价相当，约55亿欧元，比最初计划多出约13亿欧元。它也（姗姗来迟）：2003年动工，直到2020年10月才首次升起；那些倾向于对任何工程方案都（唱反调）的批评者，长期以来一直斥之为（愚蠢之举）。此后，它发挥了作用。到2025年初，闸门已升起近100次，使圣马可广场和城市大部分地区免于一再被淹，这在一定程度上（缓解）了人们的担忧。"}, {"en": "Its history is less inspiring. In 2014 prosecutors uncovered a web of bribes around the consortium building the barrier, and 35 people were arrested, among them politicians, businessmen and officials; investigators alleged that millions of euros of public money had been diverted, some of it to political parties. The (skullduggery) took years to unravel in the courts, and the (complicity) of officials who were supposed to be supervising the project made the (sleazy) affair all the more shocking. The state put the consortium under special administration in an attempt to (rectify) matters.", "zh": "它的历史就没那么鼓舞人心了。2014年，检察官揭露了围绕承建这道屏障的财团的一张贿赂网，35人被捕，其中有政客、商人和官员；调查人员指控，数以百万计的欧元公款被挪用，其中一部分流向了政党。法院花了好几年才理清这些（阴谋诡计），而本应监督该项目的官员们的（同谋），让这桩（肮脏的）丑闻更加令人震惊。国家对该财团实行了特别管理，试图（纠正）局面。"}, {"en": "Nor is MOSE a permanent solution. It is normally raised only for tides forecast to exceed about 110cm, so lesser floods still lap St Mark's Square, the lowest part of the city; a glass barrier now shields the basilica's porch. Officials (downplay) the problem, but the system has yet to reach (maturity): its operating rules remain (provisory), subject to revision as experience accumulates, and the (fallibility) of forecasts forces (anticipatory) decisions hours ahead, sometimes for tides that never arrive. Every closure also shuts the port, a (quandary) for a city that needs both trade and protection. As seas rise, closures will become more frequent; one hydrologist reckons the gates may one day need raising on 260 days a year. A lagoon cut off from the sea that often would begin to (putrefy), putting its ecology in (jeopardy).", "zh": "“摩西”也不是一劳永逸的解决方案。通常只有预报潮位超过约110厘米时才会升起闸门，因此较小的洪水仍会漫上城中地势最低的圣马可广场；如今，一道玻璃屏障保护着大教堂的门廊。官员们（轻描淡写）这一问题，但该系统尚未（成熟）：其操作规程仍属可根据经验修订的（暂行规定），而预报本身的（不完全可靠）又迫使人们提前数小时作出（预判性的）决定，有时预报的高潮根本没有来。每次关闭闸门还会封闭港口，这让一座既需要贸易又需要保护的城市陷入（两难）。随着海平面上升，关闭将越来越频繁；一位水文学家估计，有朝一日闸门可能每年需要升起260天。潟湖如果如此频繁地与大海隔绝，就会开始（腐败发臭），使其生态陷入（危险）。"}, {"en": "The (meteorology) is moving against Venice. Average sea levels at the city are the highest on record, and tides above 80cm, enough to wet the lowest pavements, have risen from about 75 a year in the early 2000s to around 125. Warmer seas may (intensify) the storms that drive water up the Adriatic. Extremes cut both ways: in a cold spell in February 2012 parts of the lagoon froze, a rare (frigidity), while droughts have left some canals almost dry at low tide. Even allowing for the (generality) of long-range climate models, which cannot predict every local tide, the city's (propensity) to flood is likely to grow; the one (certainty) is that the sea will rise. Venetians meet each acqua alta with practiced (equanimity), pulling on rubber boots and walking along raised boardwalks. But they know the (futility) of resisting the Adriatic forever, and how (puny) human defenses can look against it.", "zh": "（气象）形势正朝着不利于威尼斯的方向发展。威尼斯的平均海平面处于有记录以来的最高水平；足以打湿最低处路面的80厘米以上潮位，已从21世纪初的每年约75次增加到约125次。变暖的海洋可能会（加剧）把海水推向亚得里亚海北端的风暴。极端天气两头都有：2012年2月的一次寒潮中，潟湖部分水面结冰，这是罕见的（严寒）；而干旱则使一些运河在低潮时几乎干涸。即便考虑到长期气候模型具有一定的（概括性）、无法预测每次局部潮汐，这座城市的（洪涝倾向）也很可能日益加重；唯一（确定无疑的事）是海平面会上升。威尼斯人以惯常的（泰然自若）面对每一次“高水位”，穿上胶靴，走在架高的木板道上。但他们知道，永远抵御亚得里亚海是（徒劳）的，也知道人类的防御工事在它面前会显得多么（渺小）。"}, {"en": "Politics will decide how Venice responds. In May Mr Venturini won 51.02% of the vote in the first round, against 39.20% for Andrea Martella of the center-left Democratic Party, extending the (ascendancy) of the center-right after 11 years under Luigi Brugnaro, a businessman whose right-hand man he had been. His (candidacy) rested on continuity and security, promising more police patrols and more cameras. His (oratory) is brisk rather than soaring, and his stated (priority) is to control tourism and keep residents. Critics, (leery) of a man who handled tourism and housing for his predecessor, doubt that he will break with the past. Venice's political (polarity), though, is less left versus right than island versus mainland.", "zh": "威尼斯如何应对，将由政治来决定。2026年5月，文图里尼先生在第一轮投票中以51.02%的得票率胜出，中左翼民主党的安德烈亚·马尔泰拉获得39.20%；这延续了中右翼的（优势地位），此前商人路易吉·布鲁尼亚罗已执政11年，而文图里尼曾是他的得力助手。他的（竞选）主打延续性和治安，承诺增加警察巡逻和监控摄像头。他的（演说）干脆利落而非慷慨激昂，他宣称的（首要任务）是控制旅游业、留住居民。批评者对这位曾为前任主管旅游和住房事务的人（心存疑虑），怀疑他不会与过去决裂。不过，威尼斯政治的（两极分化）与其说是左与右之争，不如说是岛屿与大陆之争。"}, {"en": "The (municipality) of Venice includes Mestre, its (dowdy) mainland twin, where most voters live, and islanders complain that their concerns are outvoted. Five referendums have been held on splitting the two: three were rejected outright, and two, in 2003 and 2019, failed for lack of turnout. The question of (autonomy) remains (touchy). Mainlanders accuse islanders of (insularity); islanders accuse City Hall of paying only (desultory) attention to their problems.", "zh": "威尼斯（市）包括其大陆上（土里土气的）孪生城市梅斯特雷，大多数选民住在那里，岛上居民抱怨他们的诉求总是在投票中被压倒。关于将两地分开的公投已经举行过五次：三次被直接否决，另外两次，即2003年和2019年的公投，因投票率不足而无效。（自治）问题至今仍很（敏感）。大陆居民指责岛民（狭隘封闭）；岛民则指责市政厅对他们的问题（漫不经心）。"}, {"en": "Culture has had its own dramas. In September 2025 La Fenice named Beatrice Venezi, a young conductor with a (savvy) media presence and a former adviser to the culture ministry, as its music director from October 2026. Many of the theater's musicians questioned her experience and accused the management of political (partiality); the (acrimony) lasted for months, with protests at concerts, including the New Year's gala. In April 2026, after she told an Argentine newspaper that orchestra posts were handed down \"practically from father to son\", the theater's superintendent canceled all future collaborations with her. The unions met her remark with (contumely), calling it untrue and offensive; she asked the theater to (clarify) its reasons and complained that she had been defamed. Commentators continued to (pillory) both sides, and her supporters saw a campaign to (vilify) her. A single (infelicity) cost her the post before she had started, and La Fenice now needs, in effect, an (understudy) on the podium.", "zh": "文化界也有自己的戏剧。2025年9月，凤凰剧院任命年轻指挥家贝娅特丽丝·韦内齐为音乐总监，任期自2026年10月起；她在媒体上的形象（精明老练），曾担任文化部顾问。剧院的许多乐师质疑她的经验，指责管理层带有政治（偏袒）；这场（激烈争执）持续了数月，音乐会上抗议不断，包括新年音乐会。2026年4月，她对一家阿根廷报纸说，乐团的职位“几乎是父传子”，此后剧院总监取消了今后与她的一切合作。工会以（轻蔑辱骂）回应她的言论，称其不实且具有冒犯性；她则要求剧院（澄清）理由，并抱怨自己遭到了诋毁。评论人士继续（抨击）双方，她的支持者则认为有人在发动一场（中伤）她的运动。一次（措辞不当）让她在上任之前就丢掉了职位，凤凰剧院如今实际上需要一位登上指挥台的（替补）。"}, {"en": "The Biennale has had a rougher year. Koyo Kouoh, the first African woman chosen to curate its main art exhibition, died in May 2025, an (untimely) loss a year before the opening; five co-curators completed her show, \"In Minor Keys\", with some 110 participants. Then, days before it opened in May 2026, the jury resigned amid a row over the participation of Russia and Israel, whose leaders face arrest warrants from the International Criminal Court. With no jury, the prizes will be decided by a public vote, Eurovision-style, and protesters clashed with police on the eve of the opening. The air of (anarchy) strained the Biennale's tradition of (comity) among nations.", "zh": "双年展的这一年则更为坎坷。科约·库奥是首位被选中策划其主题艺术展的非洲女性，她于2025年5月去世，距开幕只有一年，实属（过早）离世；五位联合策展人完成了她的展览《小调之中》，参展者约110位。随后，在2026年5月开幕前几天，评审团因俄罗斯和以色列参展引发的争议而集体辞职，这两国的领导人都面临国际刑事法院的逮捕令。由于没有评审团，奖项将仿照欧洲歌唱大赛的方式由公众投票决定；开幕前夕，抗议者与警察发生了冲突。这种（无政府状态）般的气氛，令双年展各国之间（相互礼让）的传统承受了压力。"}, {"en": "The film festival on the Lido had a calmer time of it. Amid the usual (puffery), (glossy) premieres and (brassy) publicity, Hollywood (royalty) and (willowy) models paraded along the red carpet before photographers in a state of high (excitability). The Golden Lion, awarded in September by a jury led by Maggie Gyllenhaal, went to \"Woman Unknown\", May el-Toukhy's (timely) drama about a young Danish woman who marries her wealthy employer while hiding a wartime affair with a German soldier.", "zh": "利多岛上的电影节则平静得多。在惯常的（吹捧）、（光鲜亮丽的）首映和（张扬喧闹的）宣传之中，好莱坞（皇族般的巨星）和（身材修长的）模特们走过红毯，摄影师们则处于高度（兴奋）状态。9月，由玛吉·吉伦哈尔领衔的评审团把金狮奖颁给了梅·埃尔-图希的《无名女子》，这部（适逢其时的）剧情片讲述一位年轻的丹麦女子嫁给富有的雇主，同时隐瞒了自己战时与一名德国士兵的恋情。"}, {"en": "What would save Venice? It is a (fallacy) to think tourism can simply be switched off: its (indispensability) to the local economy makes any such hope (illusory). But the (prophecy) of a city without residents need not come true. Ideas abound: a (subsidy) for young families who rent or buy in the historic center; firm caps on short-term lets; incentives for universities, research institutes and remote workers to settle on the islands. Some have begun to (fructify): Ca' Foscari and IUAV, the city's universities, bring thousands of students into town, and a scheme called Venywhere has courted remote workers. The most (visionary) proposals treat Venice as a laboratory for adapting cities to rising seas, an (analogy) that draws scientists and engineers to many a (colloquy) on the lagoon.", "zh": "什么能拯救威尼斯？认为可以简单地把旅游业“关掉”是一种（谬论）：旅游业对当地经济的（不可或缺），使任何此类希望都成了（虚幻的）泡影。但一座没有居民的城市这一（预言）不一定会成真。各种设想层出不穷：为在历史城区租房或买房的年轻家庭提供（补贴）；严格限制短期出租；鼓励大学、研究机构和远程工作者到岛上定居。其中一些已开始（结出成果）：该市的大学威尼斯大学和威尼斯建筑大学把数以千计的学生带进城里，一个名为“Venywhere”的计划也一直在吸引远程工作者。最（富有远见的）提议把威尼斯视为让城市适应海平面上升的实验室，这一（类比）吸引着科学家和工程师们前来潟湖参加一场又一场（学术研讨会）。"}, {"en": "Venice has long been a (canary) in the coal mine: for the perils of mass tourism, for the threat of rising seas, for what happens when a city turns into a stage set. Its (obituary) has been written many times, by poets, travelers and countless journalists, and each (valedictory) has proved premature. The lesson of its history is not despair but (humility): a city built on wooden piles in a lagoon has survived for 1,600 years by adapting, and it can adapt again. If it fails, it will be a (cautionary) tale for every place that is loved to death. If it succeeds, La Fenice will not be the only thing in Venice to have risen from the ashes.", "zh": "长期以来，威尼斯一直是煤矿里的（金丝雀）：它预警着大众旅游的危害、海平面上升的威胁，以及一座城市变成舞台布景后会发生什么。它的（讣告）已被诗人、旅行者和无数记者写过许多次，而每一篇（告别辞）都被证明为时过早。它的历史给人的教训不是绝望，而是（谦卑）：一座建在潟湖木桩上的城市靠着适应变化存续了1600年，它还能再次适应。如果失败，它将成为每一个被爱到窒息的地方的（警世）故事。如果成功，凤凰剧院就不会是威尼斯唯一一个浴火重生的事物。"}];
const HAS_TITLE = true;
const SUBTITLE_EN = "";
const SUBTITLE_ZH = "";

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  if (typeof SUBTITLE_EN !== 'undefined' && SUBTITLE_EN) {
    const sub = document.createElement('div');
    sub.className = 'book-subtitle';
    sub.textContent = SUBTITLE_EN;
    div.appendChild(sub);
  }
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  if (typeof SUBTITLE_ZH !== 'undefined' && SUBTITLE_ZH) {
    const subZh = document.createElement('div');
    subZh.className = 'zh-subtitle';
    subZh.textContent = SUBTITLE_ZH;
    div.appendChild(subZh);
  }
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-sink-or-swim-v1';
const LS_OLD_KEY = 'audiobook-sink-or-swim-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
</body>
</html>
