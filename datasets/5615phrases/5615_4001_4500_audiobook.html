n Mr Adams's sweeps of homeless encampments, and the mayor must also stop contractors who (exploit) the shelter system's vast spending.", "zh": "这座城市最（无休无止的）问题是无家可归。1981年的一项法院和解协议赋予任何有需要的人获得庇护的法定权利，这一保障在美国大城市中独一无二。自2022年春天起，超过23万名移民经由这座城市的收容体系，其中许多人是从得克萨斯州坐大巴来的，他们住满了酒店和应急帐篷，花费了数十亿美元。这股（变化无常的）人潮此后已经退去，但每晚仍有数万人睡在收容所里，还有（众多的）人露宿街头和地铁。倡导者（恳求）市长建造更多支持性住房；把无家可归者说成（懒散无能）的批评者，无视了（折磨）着他们中许多人的精神疾病和成瘾问题。一些列车上（无精打采的）身影瘫倒在座位上，这样的景象令乘客难以释怀。社会活动人士希望采取比亚当斯清理露宿营地更（体贴关怀的）做法，市长也必须制止那些（利用）收容系统巨额开支牟利的承包商。"}, {"en": "New Yorkers themselves are part of the story. They are famously (cantankerous) and (querulous): the city's 311 hotline fields millions of calls a year, and noise is the most common complaint. A (garrulous) cab driver or a (loquacious) neighbor on a stoop will offer opinions on everything, and the city's sports-radio callers can be downright (obnoxious) and (captious) about every managerial decision. Yet beneath the bluster lies a (forthright) decency. Strangers help a mother carry a stroller up the subway stairs, and in emergencies, from blackouts to blizzards, (chivalrous) acts abound. A (restless) energy, a certain (gregariousness) and an impatience with pretension form a shared (trait) that newcomers acquire within a few years.", "zh": "纽约人自己也是这个故事的一部分。他们是出了名的（脾气古怪）、（爱发牢骚）：这座城市的311热线每年接到数百万个电话，最常见的投诉是噪音。一个（喋喋不休的）出租车司机或一位坐在门廊台阶上的（健谈的）邻居，会对任何事情发表意见；而本市体育电台的来电听众，对每一个教练决策都可能极其（讨人嫌）、（吹毛求疵）。然而，在吵嚷之下，有一种（直率的）善良。陌生人会帮一位母亲把婴儿车抬上地铁楼梯；在紧急情况下，从停电到暴风雪，（侠义的）举动比比皆是。一种（不安分的）活力、某种（合群）以及对矫饰的不耐烦，构成了一种共同的（特质），新来者几年之内就会染上。"}, {"en": "Sport supplies its own heroes. Aaron Judge's 62 home runs for the Yankees in 2022, an American League record, was a (feat) to rank with the club's legends; Mickey Mantle, perhaps the greatest switch-hitter of all, was (ambidextrous) at the plate. On the first Sunday in November more than 50,000 runners will strain the (tendinous) tissues around their knees and ankles on the marathon's route through all five boroughs, cheered on by a million or so spectators.", "zh": "体育也有它自己的英雄。亚伦·贾吉2022年为扬基队打出62支本垒打，创下美国联盟纪录，这一（壮举）足以与球队的传奇人物比肩；米基·曼托或许是史上最伟大的左右开弓打者，在击球区上（左右手皆能）。11月的第一个星期日，超过5万名跑者将在贯穿五个行政区的马拉松路线上，让膝盖和脚踝周围的（肌腱组织）经受考验，约百万名观众将为他们加油。"}, {"en": "Nationally, Democrats are still arguing over what Mr Mamdani means. To the left, his victory showed that voters reward boldness, and that the (feckless), (spineless) caution of party leaders, so (timorous) in the face of Mr Trump, is a losing strategy; insurgents elsewhere hope for (analogous) victories. Centrists counter that a (sequacious) party that follows every fashionable cause will (disaffect) the swing voters it needs in the midterms on November 3rd. Mr Trump, for his part, once predicted that the mayor \"will prove to be one of the best things to ever happen to our great Republican Party\", and many Republicans would happily make him the face of the Democrats. The mayor's own creed rests on a simple (tenet): that government should make life affordable. His critics call it (ingenuous) to think a city can tax and spend its way there; his admirers call those critics (duplicitous) for pretending that doing nothing is free. Few Democrats want to look (obsequious) before Mr Trump, (pusillanimous) before their own left wing or (gutless) before anyone.", "zh": "在全国范围内，民主党人仍在争论曼达尼意味着什么。在左派看来，他的胜利表明选民奖励的是勇气，而党内领导人那种（软弱无能的）、（没有骨气的）谨慎，面对特朗普时如此（胆怯），是一种必败的策略；其他地方的反建制派希望取得（类似的）胜利。中间派则反驳说，一个（盲从的）、追随每一个时髦议题的政党，将（疏远）它在11月3日中期选举中所需要的摇摆选民。至于特朗普，他曾预言这位市长“将被证明是我们伟大的共和党有史以来遇到的最好的事情之一”，许多共和党人也乐于把他塑造成民主党的代言人。市长自己的信条基于一条简单的（原则）：政府应当让生活变得负担得起。批评者说，以为一座城市能靠征税和花钱实现这一点是（天真轻信的）；他的拥护者则说，那些批评者假装无所作为不需要代价，是（虚伪狡诈的）。很少有民主党人愿意在特朗普面前显得（卑躬屈膝），在本党左翼面前显得（懦弱），或在任何人面前显得（没胆量）。"}, {"en": "So how to (assess) his first nine months? The omens were hardly (auspicious): a hostile president, a fragile fiscal position and a business elite braced for disaster. Yet conditions have proved more (propitious) than feared, thanks to falling crime, a booming Wall Street and an accommodating governor. In Marist's poll at the end of March, 48% of New Yorkers approved of his performance and 30% disapproved, a weaker start than Mr Adams's 61%; but 56% said the city was heading in the right direction, up from 31% before the election. Some moments have been (infelicitous): the Post gleefully noted that his plunge into a public pool in a suit broke the rule requiring swimwear. The (positiveness) he projects is infectious, but (sagacious) investors watch the numbers, not the videos, and the out-year gaps in the city's finances look (portentous). It would be churlish to (detract) from what he has achieved, a rent freeze and the first free child care for two-year-olds, or from a (felicitous) partnership with the governor. Yet not a (whit) of it settles whether his agenda is (congruous) with the city's arithmetic. The (verdict), for now, is (ambiguous). New Yorkers chose to (toss) the old establishment aside and take a gamble. That most still seem to like what they got, at least a (bit), may (reflect) a honeymoon rather than lasting success. The next three years will tell.", "zh": "那么，该如何（评估）他上任的头九个月？开局的兆头算不上（吉利）：一位怀有敌意的总统，脆弱的财政状况，以及严阵以待、准备迎接灾难的商界精英。然而，由于犯罪率下降、华尔街繁荣以及一位通融的州长，形势比人们担心的更为（有利）。在马里斯特3月底的民调中，48%的纽约人认可他的表现，30%不认可，开局不如亚当斯的61%；但56%的人说这座城市正朝着正确的方向前进，而选举前这一比例只有31%。有些时刻显得（不合时宜）：《纽约邮报》幸灾乐祸地指出，他穿着西装跳进公共泳池，违反了必须穿泳装的规定。他所展现的（积极乐观）很有感染力，但（精明的）投资者看的是数字，而不是视频，而城市财政未来几年的缺口看起来（不祥）。要（贬低）他已取得的成就，即租金冻结和首批面向两岁幼儿的免费托育，或是他与州长（融洽的）合作关系，未免小家子气。然而，这些成就没有（一丝一毫）能说明他的议程是否与城市的算术（相符）。目前的（结论）还（模棱两可）。纽约人选择把旧的建制派（抛）到一边，赌上一把。大多数人似乎仍然至少有（一点）喜欢他们所得到的，但这也许只（反映）了蜜月期，而非持久的成功。未来三年自有分晓。"}];
const HAS_TITLE = true;
const SUBTITLE_EN = "";
const SUBTITLE_ZH = "";

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  if (typeof SUBTITLE_EN !== 'undefined' && SUBTITLE_EN) {
    const sub = document.createElement('div');
    sub.className = 'book-subtitle';
    sub.textContent = SUBTITLE_EN;
    div.appendChild(sub);
  }
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  if (typeof SUBTITLE_ZH !== 'undefined' && SUBTITLE_ZH) {
    const subZh = document.createElement('div');
    subZh.className = 'zh-subtitle';
    subZh.textContent = SUBTITLE_ZH;
    div.appendChild(subZh);
  }
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-gotham-s-gamble-v1';
const LS_OLD_KEY = 'audiobook-gotham-s-gamble-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
</body>
</html>
