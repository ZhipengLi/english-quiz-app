<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gotham's gamble — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  .book-subtitle {
    font-size: 1.02rem;
    color: var(--muted);
    font-style: italic;
    margin: 0 0 10px;
  }
  .zh-subtitle {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 0.92rem;
    margin-top: 6px;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>Gotham's gamble</h1>

    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>

        <option value="0.75">0.75&times;</option>

  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "Gotham's gamble", "zh": "哥谭的豪赌"}, {"en": "Nine months into Zohran Mamdani's mayoralty, New York is testing whether a democratic socialist can run the capital of capitalism", "zh": "佐赫兰·曼达尼就任纽约市长九个月，这座城市正在检验一位民主社会主义者能否治理资本主义之都"}, {"en": "As 2026 began, Zohran Mamdani descended beneath City Hall into a (defunct) subway station to take the oath as New York's 112th mayor. Old City Hall station opened in 1904 as the southern (terminus) of the city's first subway line and closed to passengers at the end of 1945, its curved platform too short for longer trains. Beneath its tiled vaults, leaded skylights let a (diaphanous) light filter down from the park above, lending the place an almost (numinous) air; the new mayor called it \"a physical monument to a city that dared to be both beautiful and build great things\". He swore on two Korans, his grandfather's and a pocket-sized copy from the late 18th or early 19th century lent by the New York Public Library's Schomburg Center, the first time a mayor of New York had taken the oath on the Islamic scripture. The (ceremonious) public version followed on the steps of City Hall, where Bernie Sanders, the senator from Vermont and a fellow democratic socialist, swore him in again before a cheering crowd.", "zh": "2026年伊始，佐赫兰·曼达尼走到市政厅地下，进入一座（废弃的）地铁站，宣誓就任纽约第112任市长。老市政厅站于1904年启用，是纽约第一条地铁线路的南端（终点站），1945年底停止载客，因为它弯曲的站台太短，容不下更长的列车。在瓷砖拱顶之下，铅框天窗让一缕（薄纱般透明的）光线从上方的公园洒落，使这里几乎带有一种（神秘而令人敬畏的）气息；新市长称它是“一座实体纪念碑，纪念一座敢于既美丽又建造伟大事物的城市”。他手按两本《古兰经》宣誓，一本是他祖父的，另一本是纽约公共图书馆朔姆堡中心借出的、18世纪末或19世纪初的袖珍本，这是纽约市长首次手按这部伊斯兰经典宣誓就职。（隆重的）公开就职仪式随后在市政厅台阶上举行，佛蒙特州参议员、同为民主社会主义者的伯尼·桑德斯在欢呼的人群面前再次为他主持宣誓。"}, {"en": "A year earlier the idea would have seemed (preposterous). Mr Mamdani, a 34-year-old democratic socialist who had spent five years as an obscure state assemblyman from Astoria, in Queens, now runs a city of more than 8m people whose (status) as the (nexus) of global finance depends on the very bankers and landlords he campaigned against. His platform was (audacious): freeze the rent on about 1m rent-stabilized apartments, make city buses free, open city-owned grocery stores, provide free child care for every child from six weeks to five years old, and pay for it all by taxing millionaires and corporations. The (prospect) appalled much of Wall Street and thrilled the left. Nine months on, his mayoralty already looks (momentous), whatever its outcome. The (caveat) is that it is too early to judge. The (obvious) gains, a rent freeze and the first free child care for two-year-olds, have been banked; the bill for almost every other (aspect) of his agenda will come due later.", "zh": "一年前，这种想法还会显得（荒谬可笑）。曼达尼现年34岁，是一位民主社会主义者，此前在皇后区阿斯托利亚当了五年默默无闻的州众议员；如今他治理着一座人口超过800万的城市，而这座城市作为全球金融（枢纽）的（地位），恰恰依赖于他在竞选中所反对的银行家和房东。他的政纲十分（大胆）：冻结约100万套租金稳定公寓的租金，让市内公交免费，开设市营杂货店，为六周至五岁的每个孩子提供免费托育，并通过向百万富翁和企业征税来支付这一切。这一（前景）让华尔街的许多人惊骇，也让左派为之振奋。九个月过去了，无论结局如何，他的任期都已显得（意义重大）。需要（提醒的是），现在下结论还为时过早。（显而易见的）成果，即租金冻结和首批面向两岁幼儿的免费托育，已经到手；而他议程中几乎所有其他（方面）的账单，都要等到以后才会到期。"}, {"en": "His rise owed much to style. The son of two (illustrious) figures, Mira Nair, the director of \"Monsoon Wedding\", and Mahmood Mamdani, a Columbia University scholar of colonialism, he was born in Kampala, Uganda, moved to New York at the age of seven and attended the Bronx High School of Science. In a (previous) life he worked as a housing counselor, helping homeowners in Queens avoid foreclosure, and dabbled in rap under the name Mr Cardamom. His campaign ran on (offbeat) videos: he plunged into the wintry sea at Coney Island to promise a rent freeze, and quizzed halal-cart vendors about why a plate of chicken and rice now cost $10. A (gregarious) and (unpretentious) campaigner, at ease in the (extemporaneous) street interview, he struck many voters as (guileless) where his rivals seemed scripted. The (spontaneous) streak survives in office: in June he jumped, in suit, socks and shoes, into the Thomas Jefferson Pool in East Harlem to open the summer swimming season, reviving a mayoral stunt last performed by Michael Bloomberg.", "zh": "他的崛起很大程度上靠的是风格。他的父母都是（杰出的）人物：母亲米拉·奈尔是电影《季风婚宴》的导演，父亲马哈茂德·曼达尼是哥伦比亚大学研究殖民主义的学者。他生于乌干达坎帕拉，七岁移居纽约，就读于布朗克斯科学高中。在（先前的）人生阶段，他当过住房顾问，帮助皇后区的房主避免房屋被收回，还曾以“豆蔻先生”为艺名玩过说唱。他的竞选靠的是一系列（别出心裁的）视频：他跳进科尼岛冬日的海水里，承诺冻结租金；他还向清真餐车摊主追问，为什么一份鸡肉饭如今要卖10美元。作为一名（爱交际的）、（朴实无华的）竞选者，他擅长（即兴的）街头采访，在许多选民看来，他（真诚坦率），而对手们则显得照本宣科。这种（随性而为的）作风延续到了任内：6月，他穿着西装、袜子和鞋子跳进东哈莱姆的托马斯·杰斐逊泳池，为夏季游泳季揭幕，重拾了迈克尔·布隆伯格之后再无市长表演过的这一噱头。"}, {"en": "The Democratic primary in June 2025 was supposed to belong to Andrew Cuomo, a former governor who had resigned in 2021 amid accusations of sexual harassment, which he denies. He had the backing of much of the party establishment and a reputation for (ruthlessness). Mr Mamdani's (artless) charm and a (tenacious) army of tens of thousands of volunteers beat him soundly: under ranked-choice voting he won the final round by 56% to 44%. Mr Cuomo stayed in the general election as an independent. With Curtis Sliwa, the Republican, also running, and Eric Adams, the incumbent, campaigning as an independent until late September, the opposition was (split). On the eve of the vote Donald Trump all but told Republicans to (defect) from their own nominee by endorsing Mr Cuomo.", "zh": "2025年6月的民主党初选本应属于安德鲁·科莫。这位前州长2021年在性骚扰指控声中辞职，但他否认这些指控。他得到了党内大部分建制派的支持，并以（冷酷无情）著称。曼达尼（纯真自然的）魅力和一支由数万名志愿者组成的（顽强的）大军让他大败科莫：在排序复选制下，曼达尼在最后一轮以56%对44%获胜。科莫随后以独立候选人身份继续参加大选。由于共和党人柯蒂斯·斯利瓦也参选，现任市长埃里克·亚当斯则以独立候选人身份一直竞选到9月下旬，反对派因此（分裂）。投票前夕，唐纳德·特朗普通过为科莫背书，几乎等于叫共和党人（背弃）本党的提名人。"}, {"en": "In 2024 a federal grand jury voted to (indict) Mr Adams over allegations of bribery and illegal campaign donations linked to Turkish officials, making him the first sitting New York mayor in modern times to face federal criminal charges. When Mr Trump's Justice Department moved to drop the case early in 2025, critics saw a quid pro quo; a judge dismissed it for good that April, but the whiff of (shiftiness) clung to him. Mr Cuomo ran a (pugnacious) race, casting his rival as a dangerous radical, and Mr Mamdani denounced what he called (slanderous) and Islamophobic attacks. On November 4th he won 50.8% of the vote, to Mr Cuomo's 41.3% and Mr Sliwa's 7%. Turnout topped 2m for the first time since 1969, and he became the first candidate since then to win more than 1m votes. His (delirious) supporters packed a Brooklyn theater to celebrate. He became the city's first Muslim mayor, its first of South Asian descent and its youngest since 1892.", "zh": "2024年，联邦大陪审团决定（起诉）亚当斯，指控他涉及与土耳其官员有关的受贿和非法竞选捐款，使他成为现代纽约史上首位在任内面临联邦刑事指控的市长。2025年初，特朗普的司法部提出撤销此案，批评者认为其中存在利益交换；同年4月，一名法官永久驳回了此案，但（狡诈）的气息始终萦绕着他。科莫打了一场（好斗的）选战，把对手描绘成危险的激进分子，而曼达尼则谴责他所称的（诽谤性的）、带有伊斯兰恐惧症色彩的攻击。11月4日，他赢得50.8%的选票，科莫得票41.3%，斯利瓦得票7%。投票人数自1969年以来首次突破200万，他也成为自那以来首位获得超过100万张选票的候选人。他（欣喜若狂的）支持者挤满了布鲁克林的一家剧院庆祝胜利。他成为纽约首位穆斯林市长、首位南亚裔市长，也是自1892年以来最年轻的市长。"}, {"en": "Mr Trump had spent the campaign trying to (browbeat) the city. He called Mr Mamdani a \"100% Communist Lunatic\", an (epithet) he would repeat in various forms, and floated arresting him, questioning his citizenship and cutting federal funds if he won. Some business leaders predicted an (exodus) of the rich. Yet when the two men met in the Oval Office on November 21st, the president was startlingly (magnanimous). \"I met with a man who really wants to see New York be great again,\" he said, adding that he would feel comfortable living in the city \"especially after the meeting\". When a reporter asked Mr Mamdani whether he still considered the president a fascist, Mr Trump cut in: \"That's OK. You can just say yes.\" The thaw was (instantaneous), and shallow. Both men are (desirous) of a foil: the president wants a villain for the midterms, and the mayor gains by standing up to him. Their (tacit) bargain, civility in person and sniping online, frayed in April, when Mr Trump wrote that the mayor was \"DESTROYING New York\" with \"TAX, TAX, TAX Policies\". That (spat) blew over, and in September the two spent an hour together at Gracie Mansion during the UN General Assembly. But the (implicit) (threat) of federal reprisals never quite goes away.", "zh": "特朗普在整个竞选期间都试图（恫吓）这座城市。他称曼达尼是“百分之百的共产主义疯子”，此后又以各种形式重复这一（蔑称）；他还放话说，如果曼达尼胜选，就逮捕他、质疑他的公民身份并削减联邦拨款。一些商界领袖预言富人将（大批出走）。然而，当两人于11月21日在椭圆形办公室会面时，总统却出人意料地（宽宏大量）。他说：“我见到的是一个真心希望看到纽约再次伟大的人。”他还补充说，他住在这座城市会感到很自在，“尤其是在这次会面之后”。当一名记者问曼达尼是否仍认为总统是法西斯分子时，特朗普插话说：“没关系，你直接说是就行。”这种缓和来得（瞬间），却很肤浅。两人都（渴望）有一个陪衬：总统需要一个反派来打中期选举，而市长则通过与他对抗而获益。他们之间（心照不宣的）默契，即当面客气、网上互呛，在4月出现裂痕，当时特朗普写道，市长正用“税、税、税的政策”“摧毁纽约”。那场（口角）很快平息，9月联合国大会期间，两人在格雷西公馆共处了一个小时。但联邦报复的（隐含的）（威胁）从未真正消失。"}, {"en": "On housing he has delivered. In June the Rent Guidelines Board, to which Mr Mamdani had named six new members, voted 7-1 to freeze rents on both one- and two-year leases for about 1m stabilized apartments, the first time it has frozen both. The mayor hailed \"a historic victory for NYC tenants\", and one tenants' association offered him a particularly enthusiastic (plaudit). Rents rose by a total of 6% during Bill de Blasio's eight years, which included several one-year freezes, and by 12% under Mr Adams, according to tenant advocates. Landlords are livid. One of their representatives on the board quit hours before the vote, complaining that it had \"started with an answer\"; a small-landlord group called the decision \"an absolute farce\". Owners of older buildings say many are already in financial (distress) and that the freeze will make their position more (precarious), with (pernicious) results: deferred repairs (beget) decay. Many economists argue that rent control can (cosset) sitting tenants at the expense of newcomers. Tenant groups retort that (unscrupulous) landlords have long gamed the rules to push rents up, and that Mr Mamdani made an (explicit) promise that voters endorsed.", "zh": "在住房问题上，他兑现了承诺。6月，租金指导委员会以7比1的投票结果，决定冻结约100万套租金稳定公寓的一年期和两年期租约租金，这是该委员会首次同时冻结两种租约；此前曼达尼已为该委员会任命了六名新成员。市长称之为“纽约租户的历史性胜利”，一家租户协会还给予他格外热烈的（赞誉）。据租户权益倡导者称，在比尔·白思豪执政的八年里，租金总共上涨了6%，其间有数次一年期租约冻结；而在亚当斯任内，租金上涨了12%。房东们则怒不可遏。委员会中的一名房东代表在投票前几小时辞职，抱怨说委员会“先有答案”；一个小房东团体称这一决定是“彻头彻尾的闹剧”。老旧楼宇的业主说，许多楼宇已陷入财务（困境），冻租将使其处境更加（岌岌可危），并带来（有害的）后果：维修延误会（招致）楼宇破败。不少经济学家认为，租金管制可能会（过度保护）现有租户，却让后来者付出代价。租户团体反驳说，（不择手段的）房东长期以来钻规则的空子推高租金，而且曼达尼做出过（明确的）承诺，并得到了选民的认可。"}, {"en": "Elsewhere the record is patchier. Free buses, perhaps his most (contentious) promise, suffered an early (backset) when Kathy Hochul, the governor, said in January that they were not in her plans \"at this time\". Fares are set by the Metropolitan Transportation Authority, a state agency, and the cost is large: Mr Mamdani's team puts it at about $700m a year, the MTA's chairman at nearer $1bn. A pilot on five routes lapsed in 2024 when the legislature declined to extend it. On child care, by contrast, Ms Hochul has shown real (largess). She promised to pay for the first two years of free care for two-year-olds in the city, beginning this fall with about 2,000 children in high-need areas, and declared: \"Today, we are fulfilling the promise to make free universal child care a reality.\" That is an (exiguous) start in a city with roughly 100,000 two-year-olds, and after two years the city must find the money itself. Even critics who accuse Albany of (stinginess) must (confess) that the governor, who faces the voters in November, has made the cause her own, (albeit) with the (impetus) coming from the mayor. A new surcharge on luxury second homes will (offset) part of the cost.", "zh": "其他方面的成绩则参差不齐。免费公交或许是他最具（争议的）承诺，却早早遭遇（挫折）：1月，州长凯西·霍楚尔表示，此事“目前”不在她的计划之中。票价由州属机构大都会运输署制定，而且成本不菲：曼达尼团队估计每年约7亿美元，大都会运输署主席则认为接近10亿美元。一项在五条线路上试行的免费公交项目，因州议会拒绝延期而于2024年终止。相比之下，在托育问题上，霍楚尔表现出真正的（慷慨）。她承诺为纽约市两岁幼儿的免费托育支付头两年的费用，今年秋季先在需求最迫切的地区覆盖约2000名儿童，并宣布：“今天，我们正在兑现让免费普及托育成为现实的承诺。”在一座约有10万名两岁幼儿的城市里，这只是一个（微不足道的）开端，而且两年后市政府必须自己筹钱。即便是指责奥尔巴尼（吝啬）的批评者也必须（承认），即将在11月面对选民的州长已把这项事业当成了自己的事业，（尽管）（推动力）来自市长。一项针对豪华第二套住房的新附加税将（抵消）部分成本。"}, {"en": "The city's finances are where ambition meets arithmetic. Mr Mamdani said on taking office that he faced a gap of more than $12bn over two years; a bumper year on Wall Street shrank it by about $5bn. In February he floated a 9.5% property-tax rise as a \"last resort\" if Albany refused to tax the rich, a gambit that Julie Menin, the speaker of the City Council, said should not be \"on the table whatsoever\". He dropped it in May. The (budget) adopted in June spends $125.8bn and balances the books for the fiscal year that began in July, thanks to up to $8bn in state aid over two years and a new surcharge, expected to raise $500m a year, on second homes worth more than $5m. But the comptroller, Mark Levine, projects an annual (deficit) of about $7bn from 2028 onward, and the cushion looks (tenuous): the general reserve stands at just $450m. Critics call the mayor a (spendthrift); his allies say the (onus) lies with Albany, which controls the city's taxing powers. Either way a (ponderous) (incubus) of pension, health and debt costs looms, and the claim that growth alone will close the gap is (specious). A city (beset) by such shortfalls cannot yet know the (exact) price of its promises.", "zh": "纽约市的财政状况，是雄心与算术相遇的地方。曼达尼上任时说，他面临两年超过120亿美元的缺口；华尔街的丰收年让缺口缩小了约50亿美元。2月，他抛出将房产税提高9.5%的方案，称之为奥尔巴尼拒绝向富人征税时的“最后手段”，市议会议长朱莉·梅宁则表示，这一招“根本不该摆上桌面”。5月，他放弃了这一方案。6月通过的（预算）支出1258亿美元，并使始于7月的本财年收支平衡，这要归功于州政府两年内最多80亿美元的援助，以及一项针对价值超过500万美元的第二套住房、预计每年可带来5亿美元收入的新附加税。但市审计长马克·莱文预计，从2028年起每年的（赤字）约为70亿美元，而且缓冲显得（薄弱）：一般储备金只有4.5亿美元。批评者称市长是个（挥霍无度的人）；他的盟友则说，（责任）在于掌控本市征税权的奥尔巴尼。无论如何，养老金、医疗和债务成本构成的（沉重的）（负担）正迫在眉睫，而仅靠增长就能弥合缺口的说法是（似是而非的）。一座被如此缺口（困扰的）城市，还无法知道其承诺的（确切）代价。"}, {"en": "In appointments he has shown more (judiciousness) than his critics expected. He kept Jessica Tisch, a (technocrat) and heiress to a family fortune who, as sanitation commissioner, had declared that \"the rats don't run the city, we do\", on as police commissioner, to the dismay of some on the left. His first deputy mayor, Dean Fuleihan, ran the city's finances under Mr de Blasio, and much of the rest of his (cabinet) pairs seasoned managers with movement activists. The most (nebulous) part of his agenda is a Department of Community Safety, a promised $1bn-a-year agency that would send mental-health workers rather than police to many 911 calls. What exists so far is an Office of Community Safety, created by executive order in March with a (remit) to expand B-HEARD, a crisis-response program, and to house violence-interruption and hate-crime units. It started with two staff. Ms Tisch says only about 2% of calls could move out of the police's hands. An (assiduous) mayor could build something real from it; an (amorphous) office will not. For now, most New Yorkers in crisis still have their first (contact) with a uniformed officer.", "zh": "在人事任命上，他表现出的（审慎）超出了批评者的预期。他留任杰西卡·蒂施担任警察局长，令部分左派人士失望。蒂施是一位（技术官僚），也是一个家族财富的继承人，她在担任环卫局长时曾宣称“不是老鼠管这座城市，是我们管”。他的第一副市长迪恩·富莱汉曾在白思豪手下掌管城市财政，他（内阁）的其余成员也多是经验丰富的管理者与社会运动活动人士的搭配。他议程中最（模糊不清的）部分，是一个社区安全部：这是他承诺设立、每年投入10亿美元的机构，将派心理健康工作者而非警察去处理许多911报警电话。目前存在的只是一个社区安全办公室，于3月根据行政命令设立，其（职权范围）是扩大名为B-HEARD的危机应对项目，并纳入暴力干预和仇恨犯罪部门。它成立时只有两名工作人员。蒂施说，只有大约2%的报警电话可以不由警察处理。一位（勤勉的）市长可以把它打造成真正有用的机构；一个（无定形的）办公室则做不到。目前，大多数陷入危机的纽约人首先（接触）到的，仍是一名身穿制服的警察。"}, {"en": "Crime, the issue his opponents expected to sink him, has instead been kind. In the first half of 2026 New York recorded 322 shooting incidents and 122 murders, the fewest for that period in its recorded history; murders fell by a quarter from a year earlier, robberies by 12% and burglaries by 16%. Major crime on the subway showed only a (slight) decline. The timing is (fortuitous): the decline began under Mr Adams and owes much to Ms Tisch's (vigorous) pursuit of gangs and guns, more than 2,500 of which were seized in those six months, many of them carried up the \"iron pipeline\" of Interstate 95 from southern states, a flow the police try to (interdict). The tabloids still find plenty of (heinous) crimes to splash across their front pages, and disorder on trains remains (conspicuous). But conservative predictions that a socialist mayor would make the city (regress) to the 1970s have proved (fallacious), as has the leftish claim that the policing (apparatus) does nothing to curb violence. Skeptics (suspect) the mayor of claiming credit for a trend he inherited. He praises Ms Tisch's (oversight), which he says has cracked down on corruption in the department's upper echelons, and credits \"our whole-of-government approach\".", "zh": "犯罪问题，这个对手们原以为会让他翻船的议题，反而对他颇为友好。2026年上半年，纽约记录了322起枪击事件和122起谋杀案，为有记录以来同期最少；谋杀案比上年同期减少四分之一，抢劫案减少12%，入室盗窃案减少16%。地铁上的重大犯罪只出现了（轻微的）下降。时机（恰巧很幸运）：犯罪下降始于亚当斯任内，在很大程度上要归功于蒂施对帮派和枪支的（大力）打击。在这六个月里，警方缴获了超过2500支枪，其中许多是经95号州际公路这条“铁管道”从南方各州运来的，警方正设法（拦截）这股流入。小报上仍不乏可供大肆渲染的（令人发指的）罪行，列车上的混乱也依然（显眼）。但保守派关于社会主义市长会让城市（倒退）回20世纪70年代的预言已被证明是（错误的），左派关于警务（机构）对遏制暴力毫无作用的说法也是如此。怀疑者（怀疑）市长是在把自己继承来的趋势据为己功。他称赞蒂施的（监督），称其打击了警局高层的腐败，并把功劳归于“我们全政府协同的做法”。"}, {"en": "His first real test came from the sky. On February 22nd a (tempestuous) blizzard swept in, leaving 19.7 inches of snow in Central Park by the next afternoon and just over two feet on parts of Staten Island, with gusts of 47mph in Midtown. Mr Mamdani imposed a citywide travel ban and closed the schools for a day. More than 5,000 plows and salt spreaders went out, and by Monday afternoon the city's online tracker showed most streets had been plowed at least once. Shopkeepers scattered (copious) quantities of rock salt and calcium chloride, a de-icer often sold in (anhydrous) form, which keeps working when temperatures plunge. Even so, (mountainous) piles of plowed snow blocked crosswalks, as they do after every big storm, and many a parked car vanished beneath a (snowdrift). But the cleanup was (expeditious) enough to win praise: in a Marist poll at the end of March, 65% of New Yorkers approved of his handling of the storm. Mayors are often judged by how they handle the (onset) of a crisis. He passed.", "zh": "他的第一次真正考验来自天空。2月22日，一场（狂暴的）暴风雪袭来，到次日下午，中央公园积雪达19.7英寸，史泰登岛部分地区的积雪略超过两英尺，中城阵风风速达每小时47英里。曼达尼下令全市禁止车辆通行，学校停课一天。超过5000辆扫雪车和撒盐车出动，到周一下午，市政府的在线追踪系统显示，大部分街道至少已被清扫过一遍。店主们撒下（大量的）岩盐和氯化钙；氯化钙是一种除冰剂，常以（无水的）形态出售，气温骤降时仍能发挥作用。即便如此，就像每场大风暴过后一样，清扫出的（山一般的）雪堆堵住了人行横道，许多停放的汽车消失在（雪堆）之下。但清理工作（迅速高效），足以赢得赞誉：在3月底的一项马里斯特民调中，65%的纽约人认可他对这场暴风雪的处理。人们常常根据市长如何应对危机的（开端）来评判他们。他过关了。"}, {"en": "Washington remains the biggest risk. Congestion pricing, a $9 toll on most cars entering Manhattan below 60th Street, began in January 2025, and Mr Trump promptly tried to kill it by (fiat). \"CONGESTION PRICING IS DEAD,\" he posted that February, adding \"LONG LIVE THE KING!\", an (imperious) (edict) that his transportation secretary, Sean Duffy, followed by revoking federal approval; Mr Duffy then tried to (extract) compliance by warning that federal money for other projects could be withheld. The effort proved (bootless). In March 2026 a federal judge, Lewis Liman, ruled that Mr Duffy's move had been unlawful, \"arbitrary and (capricious)\". The toll, which some drivers resent as a (mulct), raised about $550m in its first year, while traffic in the zone fell by 11% and crashes by 7%. Mr Trump's (animus) toward the city of his birth persists. In July his administration, which had already put Amtrak in charge of an $8bn federally led redesign of Penn Station, asked senators for money to build it and urged that it be renamed; Mr Duffy has said that \"Trump Station\" has \"a nice ring to it\". Jerry Nadler, a Manhattan congressman, called the renaming idea \"ridiculous\". To many New Yorkers it is merely (fatuous).", "zh": "华盛顿仍是最大的风险。拥堵费是对大多数驶入曼哈顿60街以南的汽车收取的9美元通行费，于2025年1月开始实施，特朗普随即试图以（命令）扼杀它。当年2月，他发帖称“拥堵费已死”，还加上一句“国王万岁！”。这道（专横的）（敕令）发布后，他的交通部长肖恩·达菲随即撤销了联邦批准；达菲接着又警告可能扣留其他项目的联邦资金，试图借此（强行索取）对方的服从。这番努力（徒劳无功）。2026年3月，联邦法官刘易斯·利曼裁定，达菲的举动违法，“武断且（反复无常）”。这项被一些司机怨为（变相罚款）的通行费，在第一年筹集了约5.5亿美元，同时收费区内的交通流量下降了11%，交通事故减少了7%。特朗普对其出生城市的（敌意）依然存在。7月，他的政府致信参议员，要求拨款建设宾夕法尼亚车站，并敦促为其改名；此前，政府已让美国国家铁路客运公司主导这座车站耗资80亿美元、由联邦牵头的重新设计。达菲曾说，“特朗普车站”这个名字“听起来不错”。曼哈顿的国会众议员杰里·纳德勒称改名的想法“荒唐可笑”。在许多纽约人看来，这不过是（愚蠢的）念头。"}, {"en": "Immigration enforcement is more (fraught) still. On October 8th, in Marble Hill, on Manhattan's northern (outskirts), plain-clothes federal officers approached a man as he pulled into a parking space with a five-year-old in his car. As he began to move forward, at least one officer fired seven rounds, hitting him below the left ear. He survived; the child was unhurt. The Department of Homeland Security said it had been arresting a 28-year-old Dominican national with a criminal record, and an official said the officers believed they were in danger. What began as an apparently (innocuous) parking manoeuvre has become a dispute about the officers' actions: surveillance video does not show the gunfire, and the driver's lawyers contest the official account. Mr Mamdani called the shooting \"unconscionable\", phoned Mr Trump to demand an end to Immigration and Customs Enforcement operations in the city and said ICE \"must be abolished\"; Ms Hochul asked the president to halt them too. Activists accuse ICE, whose officers often work masked and (anonymous), of (heavy-handedness), and of using (surreptitious) stakeouts at courthouses and on street corners to (abduct) people. The agency says its officers are removing dangerous criminals. After federal agents shot dead two American citizens in Minneapolis in January, many New Yorkers fear that the next (callous) encounter could be fatal.", "zh": "移民执法问题则更加（棘手）。10月8日，在曼哈顿北部（边缘地带）的马布尔希尔，几名便衣联邦执法人员在一名男子把车停进车位时走近了他，当时他车里还有一个五岁的孩子。当他开始向前挪车时，至少一名执法人员开了七枪，击中他左耳下方。他活了下来；孩子没有受伤。国土安全部说，当时执法人员正在逮捕一名有犯罪记录的28岁多米尼加籍男子，一名官员说，执法人员认为自己身处危险之中。原本看似（无害的）停车动作，如今成了围绕执法人员行为的争议焦点：监控录像并未拍到开枪瞬间，司机的律师也对官方叙述提出异议。曼达尼称这起枪击事件“不可原谅”，他打电话给特朗普，要求停止移民和海关执法局在本市的行动，并表示该机构“必须被废除”；霍楚尔也请求总统叫停这些行动。活动人士指责移民和海关执法局采取（高压手段），其人员常常蒙面、（匿名）执法，并在法院和街角进行（秘密的）蹲守，以（绑架）民众。该机构则说，其人员是在清除危险的罪犯。今年1月，联邦探员在明尼阿波利斯开枪打死了两名美国公民，此后许多纽约人担心，下一次（冷酷无情的）遭遇可能会致人死亡。"}, {"en": "The rich, meanwhile, have had a (prosperous) year. Wall Street's profits rose by more than 30% in 2025, to $65.1bn, and the average bonus hit a record $246,900, from a pool of $49.2bn, according to the state comptroller. That (bounteous) haul fattened tax receipts too; the city expects to collect about $88.7bn in taxes this fiscal year. Mr Mamdani wanted far more. He proposed a 2% levy on incomes above $1m and a rise in the state's corporate tax rate to 11.5%, which his team reckoned would raise about $9bn a year. Ms Hochul refused, and the state's final spending plan spared top earners. To the mayor's base, wealthy taxpayers in the city's highest income-tax (bracket) are (avaricious) and undertaxed. To those in it, he is a (villainous) figure who would (deduct) a (prodigious) slice of their (gross) income on top of already hefty federal, state and city levies. The industry's (tremendous) concentration in Manhattan, with its deep pools of talent and capital, acts as a (moat): for all the talk of decamping to Florida, most firms have stayed.", "zh": "与此同时，富人们度过了（富足兴旺的）一年。据州审计长称，华尔街2025年的利润增长超过30%，达到651亿美元；平均奖金创下24.69万美元的纪录，奖金池总额为492亿美元。这笔（丰厚的）收获也充实了税收；本市预计本财年将征收约887亿美元的税款。曼达尼想要的远不止这些。他提议对年收入超过100万美元的人征收2%的附加税，并将州企业税率提高到11.5%，他的团队估计这每年可带来约90亿美元的收入。霍楚尔拒绝了，州政府最终的开支计划也放过了高收入者。在市长的支持者看来，处于纽约最高所得税（税档）的富裕纳税人（贪婪）且缴税太少。而在这些人看来，他是一个（邪恶的）人物，要在本已沉重的联邦、州和市税之外，再从他们的（总）收入中（扣除）（巨大的）一块。金融业在曼哈顿（极高的）集中度，连同那里深厚的人才和资本池，构成了一道（护城河）：尽管很多人嚷着要迁往佛罗里达，但大多数公司都留了下来。"}, {"en": "Housing lies at the heart of the affordability crisis that elected him. The pandemic left Manhattan with a (surplus) of offices, and developers are turning old towers into apartments with the help of a state tax break and \"City of Yes\", a rezoning passed in late 2024 that the city says will allow about 80,000 extra homes over 15 years. The (capacious) floor plates of post-war office blocks make for gloomy homes, with windows far from the core; older, narrower buildings convert into (commodious) apartments more easily. A (loft) in SoHo, where artists once lived illegally in former factories, now sells for millions. At the top of the market, towers with (vitreous) facades line \"Billionaires' Row\" south of Central Park; one reaches 1,550 feet, and the buildings house some of the world's richest people. Builders argue that adding supply at every level will set off a (virtuous) circle of slower rent rises.", "zh": "住房问题是让他当选的负担能力危机的核心。疫情让曼哈顿出现了写字楼（过剩），开发商正借助一项州税收减免政策和2024年底通过的“是的城市”区划改革，把旧大楼改造成公寓；市政府说，这项改革将在15年内允许新增约8万套住房。战后写字楼（宽大的）楼层平面改造成住宅后往往昏暗，窗户离楼层核心很远；较老、较窄的楼宇则更容易改造成（宽敞舒适的）公寓。苏荷区曾有艺术家非法住在旧厂房里，如今那里的一套（阁楼公寓）售价高达数百万美元。在市场顶端，中央公园以南“亿万富翁街”林立着外立面（玻璃般光亮的）高楼；其中一座高达1550英尺，这些建筑住着全球最富有的一批人。建筑商认为，在各个价位增加供应，将引发租金涨幅放缓的（良性）循环。"}, {"en": "For ordinary renters the market is brutal. A city survey in 2023 found a rental vacancy rate of 1.4%, the lowest since 1968. Strangers (cohabit) in shared apartments; a bedroom may be a (closet) with a window, or a (garret) under the roof of a walk-up. Prewar buildings offer handsome (parquet) floors and a dripping (faucet) in roughly equal measure. Demand is so (voracious) that good apartments go within days, often to be furnished with (oddments) rescued from the sidewalk. Renters (covet) a rent-stabilized lease above almost anything, and those who have one rarely move, which further reduces turnover. At the other extreme, the city has experimented with \"micro-units\": Carmel Place in Kips Bay, which opened in 2016, offers studios of 260 to 360 square feet, cozy enough for a (hermit). Since June 2025 a new law, the FARE Act, has made landlords who hire brokers pay their fees, rather than passing them on to tenants.", "zh": "对普通租房者来说，市场十分残酷。2023年的一项市政调查发现，出租房空置率仅为1.4%，是1968年以来的最低水平。陌生人在合租公寓里（同住）；一间卧室可能只是一个带窗的（小储藏室），或是无电梯公寓楼顶层屋檐下的（顶层狭小居室）。战前建筑既有漂亮的（镶木）地板，也有滴水的（水龙头），二者大致同样常见。需求如此（如饥似渴），好房子几天之内就会被租走，房里的家具常常是从人行道上捡回来的（零碎旧物）。租房者（垂涎）租金稳定公寓的租约胜过几乎一切，有幸拿到的人很少搬家，这进一步减少了房源周转。在另一个极端，市政府尝试推出“微型公寓”：位于基普斯湾、2016年启用的卡梅尔广场提供260至360平方英尺的单间公寓，小巧得足以容纳一位（隐士）。自2025年6月起，一项名为《FARE法》的新法律规定，雇用中介的房东须自行支付中介费，而不得将其转嫁给租户。"}, {"en": "Buying is no easier. Many of Manhattan's older apartment buildings are co-ops whose boards can reject buyers without giving a reason, and whose scrutiny of applicants' finances can be (officious) in the extreme. A (discreet) doorman and a Park Avenue address still confer (cachet). Farther downtown, tenement facades are laced with fire escapes of (wrought) iron, and steam radiators run so hot in winter that residents fling open their windows; a (cactus) on the sill is often the only plant that survives. Newer buildings, with (airtight) windows and heat pumps, are more efficient, and far pricier.", "zh": "买房也不容易。曼哈顿许多老公寓楼都是合作公寓，其董事会可以不说明理由就拒绝买家，对申请人财务状况的审查也可能（多管闲事）到极点。一位（谨慎低调的）门卫和一个公园大道的地址依然代表着（声望）。在更靠南的下城，廉租公寓楼的外墙上布满（锻造的）铁制消防梯，冬天暖气片烧得太热，住户们只好把窗户大开；窗台上的一盆（仙人掌）往往是唯一能活下来的植物。新建楼宇配有（密封的）窗户和热泵，能效更高，价格也贵得多。"}, {"en": "Times Square shows the city's two faces. In the 1970s and 1980s it was the (scabrous) heart of the sex trade; a clean-up in the 1990s, crowned by Disney's restoration of the New Amsterdam Theatre, brought families back. Its (tackiness) today is of a different kind: (meretricious) digital billboards, chain restaurants and costumed cartoon characters who (solicit) tips for photos, confined since 2016 to \"designated activity zones\" painted on its pedestrian plazas. Locals avoid it, cursing the (oafishness) of tourists who stop dead on the sidewalk to film. Yet the (glamorous) theaters around it, and the (gloss) of New Year's Eve, when the ball drops before an estimated 1m revelers, keep drawing visitors from around the world.", "zh": "时报广场展现了这座城市的两副面孔。在20世纪70和80年代，它是色情业（污秽不堪的）中心；90年代的一场整治以迪士尼修复新阿姆斯特丹剧院为标志，让家庭游客重新回来。如今它的（俗气）是另一种类型：（华而不实的）数字广告牌、连锁餐厅，以及扮成卡通人物、为合影（索要）小费的人；自2016年起，这些人被限定在步行广场上画出的“指定活动区”内。本地人避开这里，咒骂那些在人行道上突然停下来拍视频的游客的（粗鲁笨拙）。然而，周围（光鲜迷人的）剧院，以及跨年夜的（光彩），即估计有100万狂欢者看着水晶球降下的时刻，依然吸引着世界各地的游客。"}, {"en": "A few blocks away, on West 47th Street, the Diamond District handles, by some estimates, most of the diamonds that enter America. Its dealers, many of them Orthodox Jews, have long sealed deals worth thousands of dollars a (carat) with a handshake and the word \"mazal\". Windows glitter with everything from a diamond tennis (bracelet) to the humblest (trinket). Most of the trade is (licit), but the district's cash-heavy, trust-based culture has occasionally drawn (illicit) business, from money laundering to fencing stolen jewelry. Farther south, Canal Street was for decades the capital of (counterfeit) handbags and watches, sold from back rooms; police raids have thinned the trade but not ended it. Three-card monte hustlers, masters of (sleight) of hand, still fleece the (credulous) in Midtown now and then. The (bogus) designer goods and (spurious) bargains belong to one of the city's oldest traditions: parting visitors from their money with a little (deceit).", "zh": "几个街区之外，在西47街，据一些估计，进入美国的钻石大多要经过钻石区。这里的商人许多是正统派犹太人，长期以来，他们只需握手并说一声“mazal”，就能敲定每（克拉）价值数千美元的交易。橱窗里琳琅满目，从钻石网球（手链）到最不起眼的（小饰品），应有尽有。这里的大部分交易是（合法的），但该区以现金为主、以信任为基础的文化偶尔也会招来（非法的）生意，从洗钱到销赃珠宝不一而足。再往南，坚尼街几十年来一直是（仿冒的）手袋和手表之都，这些货品在店铺后屋出售；警方的突击搜查让这门生意有所收敛，但并未将其根除。三张牌赌局的骗子们是玩弄（障眼手法）的高手，仍不时在中城诓骗那些（轻信的）人。（假冒的）名牌商品和（虚假的）便宜货，属于这座城市最古老的传统之一：用一点（欺骗）让游客掏空腰包。"}, {"en": "Commerce made the city. Its deep, sheltered harbor was an (adventitious) gift of geology, and the opening of the Erie Canal in 1825 made it the gateway to the Midwest. Today the Port of New York and New Jersey is the busiest on the East Coast, handling (freight) for a hinterland of tens of millions; to accommodate the bigger ships that began using the widened Panama Canal across the (isthmus) in 2016, the Bayonne Bridge's roadway was raised. Shipbuilding is long gone. In 1862 the Union's first ironclad, the Monitor, with its revolving gun (turret), was launched in Greenpoint, a (ferrous) marvel of the age, and the Brooklyn Navy Yard, where a (shipwright) might have worked on the USS Arizona or the USS Missouri, closed in 1966; it is now an industrial park. The skyscrapers were raised by ironworkers, many of them Mohawks from Kahnawake, near Montreal, who drove one steel (rivet) after another to help (construct) the Empire State Building and the George Washington Bridge. The orange (fleet) of the Staten Island Ferry, free since 1997, still crosses the harbor around the clock.", "zh": "商业成就了这座城市。它那深邃而有遮蔽的港湾是地质带来的一份（偶然的）礼物，1825年伊利运河的开通又使它成为通往中西部的门户。如今，纽约新泽西港是东海岸最繁忙的港口，为数千万人口的腹地处理（货运）；为了容纳2016年起开始通过横穿（地峡）、已拓宽的巴拿马运河的更大船只，贝永大桥的桥面被抬高。造船业早已消失。1862年，北方联邦的第一艘铁甲舰“莫尼特”号在绿点下水，它配有可旋转的（炮塔），是那个时代的（铁质的）奇迹；布鲁克林海军造船厂于1966年关闭，如今是一个工业园区，当年那里的（造船工）可能参与建造过“亚利桑那”号或“密苏里”号战舰。城中的摩天大楼由钢铁工人建起，其中许多是来自蒙特利尔附近卡纳瓦克的莫霍克人，他们将一枚又一枚钢制（铆钉）铆进钢架，帮助（建造）了帝国大厦和乔治·华盛顿大桥。史泰登岛渡轮自1997年起免费，其橙色的（船队）至今仍昼夜不停地穿梭于港湾之间。"}, {"en": "Long before all that, the island was Mannahatta, a hilly, forested home of the Lenape, its (indigenous) people. In 1626 Peter Minuit of the Dutch West India Company is said to have bought it for goods worth 60 guilders. The only contemporary record, a letter by a Dutch official, Pieter Schaghen, sits in the national archives in The Hague, among the (muniments) of the colonial age. The Lenape probably understood the deal as an agreement to share the land rather than to surrender the (tract) for good. In Inwood Hill Park, at Manhattan's northern tip, the island's last natural forest survives, along with rock shelters the Lenape once used, a final (fastness) amid the grid. New Amsterdam was (heterogeneous) from the start: a French Jesuit, Isaac Jogues, counted 18 languages spoken there in the 1640s, a contrast with the (homogeneous) Puritan towns of New England.", "zh": "在那一切之前很久，这座岛名叫“曼纳哈塔”，丘陵起伏，森林茂密，是其（土著）居民莱纳佩人的家园。据说，1626年，荷兰西印度公司的彼得·米努伊特用价值60荷兰盾的货物买下了这座岛。唯一的同时代记录是荷兰官员彼得·沙根写的一封信，如今保存在海牙的国家档案馆里，与殖民时代的其他（契据文书）放在一起。莱纳佩人很可能把这笔交易理解为共享土地的协议，而不是永久让出这片（土地）。在曼哈顿北端的因伍德山公园，岛上最后一片天然森林得以幸存，还有莱纳佩人曾经使用过的岩洞，这是棋盘式街道之间最后的一处（隐秘据点）。新阿姆斯特丹从一开始就是（多元混杂的）：法国耶稣会士伊萨克·饶格在17世纪40年代统计出那里使用的语言多达18种，这与新英格兰（同质单一的）清教徒城镇形成了鲜明对比。"}, {"en": "Slavery was woven into the colony from the start. The Dutch West India Company imported enslaved Africans to build its fort and roads; in 1644 it granted \"half-freedom\" to 11 men who petitioned for it, stopping short of a decision to (manumit) them fully. Under English rule the system grew harsher. In 1991 excavations for a federal office building in Lower Manhattan uncovered the African Burial Ground, where an estimated 15,000 people had been buried in the 17th and 18th centuries. Archaeologists recovered the (osseous) remains of 419 people, which bore the marks of crushing labor, and began to (sift) the soil for (artifacts) such as beads and coins. The site became a national monument in 2006, a belated act of (redress). New York's laws had long been used to (oppress) Black residents, and the state did not finally end its (iniquitous) system of slavery until 1827.", "zh": "奴隶制从一开始就交织在这块殖民地的历史中。荷兰西印度公司输入被奴役的非洲人，让他们修建堡垒和道路；1644年，公司给予11名提出请愿的男子“半自由”身份，但没有决定将他们彻底（解放）。在英国统治下，这一制度变得更加严酷。1991年，在曼哈顿下城为一座联邦办公楼进行的挖掘工程中，人们发现了非洲人墓地，据估计，17和18世纪约有1.5万人葬于此地。考古学家发掘出419人的（骨质）遗骸，上面留有繁重劳作的痕迹，他们还着手（筛查）泥土，寻找珠子、硬币等（文物）。该遗址于2006年成为国家纪念地，这是一次迟来的（补偿）。纽约的法律长期被用来（压迫）黑人居民，直到1827年，纽约州才最终废除了（罪恶的）奴隶制。"}, {"en": "During the Revolution the city was a prize. In August 1776 the British routed George Washington's army in the Battle of Brooklyn, the largest of the war; a (valorous) rearguard of Marylanders, firing (musket) volleys near the Old Stone House, bought time, and on the night of August 29th Washington's (adroit) (retreat) across the East River, helped by a morning fog, saved his army. In early September a one-man (midget) submarine, the Turtle, tried and failed to fix a bomb to the hull of a British flagship in the harbor. Later that month Nathan Hale, a young captain caught behind British lines, went to the (gallows) as a spy. The British held the city until 1783, treating (suspicious) civilians as (seditious) rebels and packing captives onto prison ships in Wallabout Bay, where more Americans died than in all the war's battles combined.", "zh": "独立战争期间，这座城市是兵家必争之地。1776年8月，英军在布鲁克林战役中击溃了乔治·华盛顿的军队，这是整场战争中规模最大的一役；一支由马里兰士兵组成的（英勇的）后卫部队在老石屋附近用（火枪）齐射，为大军赢得了时间。8月29日夜，华盛顿率军渡过东河，完成了一次（巧妙的）（撤退），清晨的雾气助了一臂之力，他的军队得以保全。9月初，一艘名为“海龟”号的单人（微型）潜艇试图把炸弹固定在港内一艘英国旗舰的船体上，但未能成功。当月晚些时候，年轻的上尉内森·黑尔在英军防线后方被抓获，作为间谍被送上（绞刑架）。英军占领这座城市直到1783年，他们把（可疑的）平民当作（煽动叛乱的）叛军对待，并把俘虏塞进沃拉鲍特湾的监狱船，那里死去的美国人比整场战争所有战役中阵亡的还要多。"}, {"en": "Up the Hudson, the war produced America's most famous (turncoat). In 1780 Benedict Arnold, commander of the fort at West Point, struck a (perfidious) bargain to hand it to the British. The (double-cross) unraveled when militiamen near Tarrytown stopped Major John André, a British officer, and found incriminating papers on him. Arnold escaped; André was hanged. West Point later became home to the United States Military Academy, where every (cadet) learns the story, and Arnold's name became a byword for (nefarious) betrayal. Peace brought pageantry. Washington, who had hung up his military uniform with its fringed (epaulet) after resigning his commission in 1783, returned to take the oath as the first president on April 30th 1789, on the balcony of Federal Hall on Wall Street, in a brown suit of American-made cloth. At the inaugural ball a week later, among gentlemen in silk stockings and formal dress, including the occasional lace (cravat), he danced with the city's leading ladies, in an age when the stately (minuet) still opened formal balls.", "zh": "在哈德逊河上游，这场战争造就了美国最著名的（叛徒）。1780年，西点要塞指挥官本尼迪克特·阿诺德达成了一笔（背信弃义的）交易，要把要塞交给英军。当塔里敦附近的民兵拦下英军军官约翰·安德烈少校，并在他身上搜出罪证文件时，这场（出卖）便败露了。阿诺德逃脱；安德烈被处以绞刑。西点后来成为美国陆军军官学校的所在地，每一名（军校学员）都会学到这个故事，而阿诺德的名字也成了（卑鄙）背叛的代名词。和平带来了盛大的典礼。1783年辞去军职、收起带流苏（肩章）的军服的华盛顿，于1789年4月30日重返纽约，身穿一套美国制造的棕色布料西装，在华尔街联邦大厅的阳台上宣誓就任第一任总统。一周后的就职舞会上，在一群身穿丝袜、衣着讲究的绅士中间，偶尔还能见到一条蕾丝（领巾）；他与城中名媛共舞；在那个年代，庄重的（小步舞）仍是正式舞会的开场舞。"}, {"en": "In the 19th century the city was run by Tammany Hall, the Democratic machine, and above all by William \"Boss\" Tweed, whose ring stole somewhere between $25m and $200m, by various estimates. The courthouse behind City Hall that bears his name cost about $13m, nearly twice what America paid Russia for Alaska; one plasterer was paid more than $133,000 for two days' work, one of countless (factitious) invoices. In Harper's Weekly, Thomas Nast used cartoons to (depict) Tweed and his cronies as a flock of (rapacious) vultures; Tweed reputedly complained that his constituents could not read but could see \"them damned pictures\". The (unscrupulousness) of the ring was laid bare when the New York Times published its secret accounts in 1871, and prosecutors managed to (convict) Tweed in 1873. Ever (devious), he escaped from custody and fled to Spain, where he was recognized and sent back; he died in jail in 1878. Tammany's brand of (graft) became a model for urban machines across America.", "zh": "19世纪，这座城市由民主党政治机器坦慕尼协会把持，尤其是由威廉·“老大”·特威德把持；据各种估计，他的集团窃取了2500万至2亿美元不等。市政厅后面那座以他的名字命名的法院大楼耗资约1300万美元，几乎是美国从俄国购买阿拉斯加所花费用的两倍；一名泥水匠两天的活就拿到了超过13.3万美元，这只是无数（虚报的）账单之一。托马斯·纳斯特在《哈珀周刊》上用漫画把特威德及其党羽（描绘）成一群（贪婪的）秃鹫；据说特威德抱怨，他的选民虽然不识字，却能看懂“那些该死的图画”。1871年，《纽约时报》公布了该集团的秘密账目，其（肆无忌惮）由此大白于天下，检察官终于在1873年将特威德（定罪）。向来（诡计多端的）他从羁押中逃脱，逃往西班牙，在那里被人认出并遣送回国；1878年，他死在狱中。坦慕尼式的（贪腐）成了全美各地城市政治机器效仿的样板。"}, {"en": "The Civil War exposed the city's darkest side. In July 1863 the Union's new (draft) set off four days of (riotous) violence. Many of the rioters were poor Irish immigrants, enraged by an (odious) rule that let richer men buy their way out of service for $300. Their fury turned into (barbarous) racial terror: mobs lynched Black men in the streets and burned the Colored Orphan Asylum on Fifth Avenue, though its more than 200 children escaped. At least 119 people died before troops sent from Gettysburg restored order. It remains the largest civil insurrection in American history apart from the Civil War itself, an (atrocious) episode whose (vicious) racism drove many Black New Yorkers to leave Manhattan, some of them for Brooklyn.", "zh": "内战暴露了这座城市最黑暗的一面。1863年7月，北方联邦新实行的（征兵）引发了四天（狂乱的）暴力。许多暴乱者是贫穷的爱尔兰移民，他们被一条（可憎的）规定激怒：较富裕的人只需花300美元就能免服兵役。他们的怒火演变成（野蛮的）种族恐怖：暴徒在街头对黑人男子处以私刑，并焚烧了第五大道上的有色人种孤儿院，所幸院中200多名儿童得以逃生。在从葛底斯堡调来的军队恢复秩序之前，至少有119人死亡。除内战本身外，这至今仍是美国历史上规模最大的民间暴乱，这一（残暴的）事件中（恶毒的）种族主义迫使许多黑人纽约客离开曼哈顿，其中一些人去了布鲁克林。"}, {"en": "Industrial fortunes then brought the Gilded Age. Caroline Astor ruled society, and her adviser, Ward McAllister, claimed that only about 400 people mattered in fashionable New York, reputedly the number who could fit into her ballroom. Old-money families such as the Astors embraced the manners of the European (aristocrat), but in 1883, when Alva Vanderbilt threw a costume ball in her (spacious) Fifth Avenue mansion, Mrs Astor had to pay her a call before her daughter could be invited. In 1897 Bradley and Cornelia Martin spent hundreds of thousands of dollars on a ball at the Waldorf hotel in the middle of a depression; the (gratuitous) display provoked such outrage that the couple soon moved to Britain. In 1903 C.K.G. Billings, a tycoon who loved horses, gave a (banquet) at Sherry's restaurant at which his guests dined on horseback. Such (pompous) (excess) helped to inspire the Progressive reformers who followed.", "zh": "工业财富随后带来了镀金时代。卡罗琳·阿斯特主宰着上流社会，她的顾问沃德·麦卡利斯特声称，时髦的纽约社交圈里只有大约400人真正重要，据说这正是她的舞厅能容纳的人数。阿斯特家族这样的老钱家族推崇欧洲（贵族）的礼仪，但在1883年，当阿尔瓦·范德比尔特在她第五大道（宽敞的）宅邸里举办化装舞会时，阿斯特夫人不得不先登门拜访，她的女儿才能获得邀请。1897年，布拉德利·马丁和科妮莉亚·马丁夫妇在经济萧条之际，于华尔道夫酒店花费数十万美元举办舞会；这番（毫无必要的）炫耀激起了公愤，这对夫妇不久便移居英国。1903年，热爱马匹的富豪C.K.G.比林斯在雪莉餐厅举行（宴会），宾客们骑在马背上用餐。这种（浮夸的）（过度挥霍），激励了随后兴起的进步主义改革者。"}, {"en": "Then came the immigrants. Between 1892 and 1954 some 12m people passed through Ellis Island, greeted by the copper (colossus) in the harbor, celebrated in Emma Lazarus's (sonnet) of 1883, which welcomes the world's \"huddled masses yearning to breathe free\". The (necessitous) newcomers crammed into tenements on the Lower East Side, making it, for its size, perhaps the most (populous) neighborhood on earth. The pattern endures. The 2020 (census) counted a record 8.8m New Yorkers, and more than a third of those who (inhabit) the city were born abroad. In a country where most people drive and live in suburbs, New York is (anomalous): most of its households do not own a car.", "zh": "接着到来的是移民。1892年至1954年间，约1200万人经由埃利斯岛入境，迎接他们的是港口那尊铜铸的（巨像）；埃玛·拉扎勒斯1883年的（十四行诗）歌颂了它，诗中欢迎世界各地“渴望自由呼吸的挤作一团的大众”。这些（贫困的）新来者挤进下东区的廉租公寓，按面积计算，那里的（人口众多）程度或许居世界街区之首。这种格局延续至今。2020年的（人口普查）统计出创纪录的880万纽约人，而在（居住）于这座城市的人当中，超过三分之一出生在国外。在一个大多数人开车、住在郊区的国家里，纽约是（反常的）：这里的大多数家庭没有汽车。"}, {"en": "The 20th century's master builder was Robert Moses, an unelected (autocrat) who at his peak held a dozen posts at once and built bridges, parks, beaches and hundreds of miles of highways. Robert Caro's 1974 (opus), \"The Power Broker\", recounts how Moses would (evict) whole neighborhoods to drive expressways through them; the Cross Bronx Expressway alone displaced thousands of people. He was (impervious) to criticism and (pertinacious) in pursuit of his schemes. His comeuppance came from Jane Jacobs, a (contumacious) writer and activist who rallied Greenwich Village against his plans for a road through Washington Square Park and an expressway across Lower Manhattan, where it would (intersect) SoHo and Little Italy. Both schemes died. Moses's power faded after 1968, when the state folded his Triborough Bridge and Tunnel Authority into the new MTA.", "zh": "20世纪的建设大师是罗伯特·摩西，一位非民选的（独裁者）；他在权力巅峰时同时身兼十几个职位，修建了桥梁、公园、海滩和数百英里的公路。罗伯特·卡罗1974年的（巨著）《权力掮客》讲述了摩西如何（驱逐）整片街区的居民，让高速公路从中穿过；仅跨布朗克斯高速公路一项就迫使数千人搬迁。他对批评（无动于衷），推行自己的计划时（固执己见）。让他栽跟头的是简·雅各布斯，一位（桀骜不驯的）作家和活动人士，她发动格林威治村居民反对他修路穿过华盛顿广场公园的计划，以及修建一条横贯曼哈顿下城、将与苏荷区和小意大利（交叉）的高速公路的计划。两项计划都流产了。1968年，州政府把他的三区大桥和隧道管理局并入新成立的大都会运输署，此后摩西的权力日渐式微。"}, {"en": "By the 1970s the city was in (parlous) shape. Factory jobs vanished, the middle class fled to the suburbs and the population fell by more than 800,000 in a decade. Arson and abandonment left swathes of the South Bronx (bereft) of housing, and urban (blight) became the city's image abroad. In 1975 an (impecunious) New York teetered on the edge of bankruptcy, and when President Gerald Ford refused a federal bailout the Daily News ran its (opprobrious) headline: \"FORD TO CITY: DROP DEAD\". He never said those words, and later relented with federal loans, but the line stuck.", "zh": "到20世纪70年代，这座城市陷入了（危险的）境地。工厂工作消失，中产阶级逃往郊区，人口在十年间减少了80多万。纵火和弃置让南布朗克斯大片地区（失去）了住房，城市（衰败）成了这座城市在外界眼中的形象。1975年，（身无分文的）纽约濒临破产，当杰拉尔德·福特总统拒绝联邦救助时，《每日新闻报》刊出了那条（侮辱性的）标题：“福特对纽约说：去死吧”。他从未说过这些话，后来也松口提供了联邦贷款，但这句话却流传了下来。"}, {"en": "The city's resilience has become legend. In 1974 Philippe Petit, a French high-wire (acrobat), walked back and forth eight times between the twin towers of the World Trade Center. On September 11th 2001 the towers fell in an (onslaught) that killed 2,753 people in New York. The memorial's two pools trace the (lineaments) of their footprints, and One World Trade Center, 1,776 feet tall, rose nearby to (resurrect) the skyline. In 2009 the city witnessed a (miraculous) escape when a US Airways captain, Chesley Sullenberger, glided his crippled Airbus onto the Hudson; all 155 people aboard survived.", "zh": "这座城市的韧性已成为传奇。1974年，法国高空走钢丝（杂技演员）菲利普·珀蒂在世界贸易中心双子塔之间来回走了八趟。2001年9月11日，双塔在一场（猛烈袭击）中倒塌，这场袭击在纽约造成2753人死亡。纪念馆的两座水池勾勒出双塔地基的（轮廓），高1776英尺的世界贸易中心一号楼在附近拔地而起，（重振）了城市天际线。2009年，这座城市见证了一次（奇迹般的）脱险：全美航空的机长切斯利·萨伦伯格驾驶受损的空客客机滑降在哈德逊河上，机上155人全部生还。"}, {"en": "In the spring of 2020 New York became the first American epicenter of Covid-19; more than 40,000 New Yorkers have since died of it. The subway, which had run around the clock since 1904, shut nightly for the first time so that crews could (disinfect) its trains. Wealthier residents decamped to second homes, and their (flight) prompted premature obituaries for the city. Federal (stimulus) money and a (contagious) revival of urban life proved the doomsayers wrong, and the population has been growing again. Climate change is the next test. Hurricane Sandy in 2012 flooded subway tunnels and killed dozens of New Yorkers; the city is now raising East River Park by eight to ten feet to (buttress) the Lower East Side against storm surges.", "zh": "2020年春天，纽约成为美国第一个新冠疫情中心；此后已有超过4万名纽约人死于新冠。自1904年以来全天候运营的地铁，首次在夜间停运，以便工作人员为列车（消毒）。较富裕的居民纷纷躲到第二套住房里，他们的（出逃）引来了为这座城市提前撰写的讣告。联邦（刺激）资金和城市生活（富有感染力的）复苏证明唱衰者错了，人口也重新开始增长。气候变化是下一场考验。2012年的飓风“桑迪”淹没了地铁隧道，造成数十名纽约人死亡；如今市政府正把东河公园抬高8到10英尺，以（加固）下东区，抵御风暴潮。"}, {"en": "Culture is the city's other great export. Broadway's 41 big theaters went dark in March 2020, and most did not reopen until September 2021, the longest (hiatus) in their history; audiences have since returned. A single number from a well-drilled (chorus) can (elicit) a standing ovation, and a well-sung (duet) can stop a show. At Radio City Music Hall the Rockettes have performed their (synchronous) eye-high kicks since 1932. Carnegie Hall has hosted many a celebrated string (quartet); the Metropolitan Opera's (sonorous) voices fill Lincoln Center; and on summer evenings free concerts and plays in different parks make for (simultaneous) open-air feasts.", "zh": "文化是这座城市的另一大输出品。百老汇的41家大剧院于2020年3月关门，大多数直到2021年9月才重新开放，这是它们历史上最长的一次（中断）；此后观众已经回归。一支训练有素的（合唱队）演唱的一首歌就能（引发）全场起立鼓掌，一段唱得好的（二重唱）也能让演出暂停。在无线电城音乐厅，火箭女郎舞蹈团自1932年起就在表演她们（整齐同步的）齐眼高踢腿。卡内基音乐厅接待过许多著名的弦乐（四重奏）组合；大都会歌剧院（洪亮的）歌声回荡在林肯中心；夏日傍晚，各个公园里的免费音乐会和戏剧演出构成一场场（同时进行的）露天盛宴。"}, {"en": "Its music has been just as influential. Louis Armstrong, who switched from the (cornet) to the (trumpet) in the 1920s, spent his last 28 years in a modest house in Corona, Queens, now a museum. Duke Ellington's (mellifluous) orchestra made its name at Harlem's Cotton Club, and the thump of an (upright) bass still sounds nightly at the Village Vanguard, open since 1935. In 1973, at a back-to-school party at 1520 Sedgwick Avenue in the Bronx, DJ Kool Herc used two turntables to extend the instrumental breaks of funk records, an (ingenious) trick from which hip-hop grew; (dexterous) successors such as Grandmaster Flash turned the (stylus) itself into an instrument. Not every New York sound is (euphonious) or (dulcet): drill, a darker, menacing strain of rap, has flourished in Brooklyn.", "zh": "它的音乐同样影响深远。路易斯·阿姆斯特朗在20世纪20年代从（短号）改吹（小号），他人生的最后28年住在皇后区科罗纳一座朴素的房子里，如今那里已成为博物馆。艾灵顿公爵（悦耳动听的）管弦乐队在哈莱姆的棉花俱乐部声名鹊起，而在1935年开业的先锋村爵士俱乐部，（立式）贝斯的砰砰声至今仍每晚响起。1973年，在布朗克斯塞奇威克大道1520号的一场返校派对上，DJ酷海尔克用两台唱机延长放克唱片中的器乐间奏，这一（巧妙的）技巧催生了嘻哈音乐；闪耀大师等（手法灵巧的）后继者把（唱针）本身变成了一件乐器。并非纽约的每一种声音都（和谐悦耳）或（甜美动听）：钻头说唱，一种更阴暗、更具威胁感的说唱流派，已在布鲁克林兴起。"}, {"en": "To (digress) for a moment: one of the city's most visited musical shrines is Strawberry Fields in Central Park, across the street from the Dakota, where John Lennon lived from 1973. The man who had once sung that he was the (walrus) settled into life as an (uxorious) househusband, devoted to Yoko Ono and their son, Sean. He was shot dead outside the building in December 1980. Every year fans gather around the \"Imagine\" mosaic for a (dolorous) singalong on the anniversary.", "zh": "稍微（离题）一下：这座城市参观人数最多的音乐圣地之一，是中央公园里的草莓园，它与约翰·列侬自1973年起居住的达科他公寓隔街相望。这个曾唱过自己是（海象）的人，后来安心过起了（极其宠爱妻子的）家庭主夫生活，全心照顾小野洋子和他们的儿子西恩。1980年12月，他在这栋楼外被枪杀。每年忌日，歌迷们都会聚集在“想象”马赛克图案周围，进行一场（哀伤的）合唱。"}, {"en": "New York's museums are (peerless). The Metropolitan Museum of Art's unofficial mascot is \"William\", a small blue faience (hippopotamus) made in Egypt nearly 4,000 years ago. The New York Academy of Medicine holds the Edwin Smith (papyrus), the oldest known surgical treatise. Frank Lloyd Wright's Guggenheim coils upward around a single (sinuous) ramp. And the (voluminous) collections of the New York Public Library, whose Fifth Avenue headquarters is guarded by two stone lions named Patience and Fortitude, offer a (conspectus) of human knowledge.", "zh": "纽约的博物馆（无与伦比）。大都会艺术博物馆的非官方吉祥物是“威廉”，一只近4000年前在埃及制作的蓝色小釉陶（河马）。纽约医学会收藏着埃德温·史密斯（纸莎草文献），这是已知最古老的外科论著。弗兰克·劳埃德·赖特设计的古根海姆博物馆围绕一条（蜿蜒的）坡道盘旋而上。纽约公共图书馆位于第五大道的总馆由两尊名为“耐心”和“坚毅”的石狮守护，其（浩繁的）馆藏提供了人类知识的（概览）。"}, {"en": "The city is also the capital of the American (press). Alexander Hamilton founded the New York Post in 1801; its tabloid headlines, such as \"Headless Body in Topless Bar\" in 1983, are models of (pithiness), if not always of restraint. The New York Times prides itself on (veracious) reporting, and its landmark case before the Supreme Court in 1964, New York Times v. Sullivan, made it much harder for public officials to win damages over (libelous) claims by requiring them to prove \"actual malice\". The city's columnists range from the (perspicacious) to the (bilious), and its cable-news studios in Midtown turn out (overwrought) segments around the clock. Good editors strip out (extraneous) words, and the (sententious) editorial remains a local specialty. Even the grandest (outlet) must occasionally (retract) a story.", "zh": "这座城市也是美国（新闻界）的中心。亚历山大·汉密尔顿于1801年创办了《纽约邮报》；它的小报标题，比如1983年的“无头尸体现身无上装酒吧”，堪称（简洁精炼）的典范，尽管并不总是有所节制。《纽约时报》以（真实可信的）报道自豪，它1964年在最高法院的里程碑式案件“《纽约时报》诉沙利文案”，要求公职人员证明对方存在“实际恶意”，从而使他们更难就（诽谤性的）言论获得赔偿。这座城市的专栏作家从（目光敏锐的）到（脾气暴躁的），应有尽有；中城的有线新闻演播室昼夜不停地制作（过度激动的）节目。好编辑会删去（多余的）字句，而（说教式的）社论仍是本地特色。即便是最显赫的（媒体机构），也难免偶尔（撤回）一篇报道。"}, {"en": "Words are a local industry in other ways too. The New Yorker, founded in 1925, set a standard for (perspicuous) prose, and the Times crossword, published since 1942, tests solvers on Thursdays with (rebus) squares that cram several letters into one box. America's biggest publishing houses are headquartered in Manhattan, where editors winnow the nation's literary (corpus), separating gems from (dross). The city has housed many a (fictitious) hero: Spider-Man's alter ego, Peter Parker, grew up in Forest Hills, Queens. Gossip pages such as the Post's Page Six trade in the (scurrilous), and the (conceit) at the heart of countless novels, from \"The Great Gatsby\" to \"Breakfast at Tiffany's\", is that newcomers can reinvent themselves here.", "zh": "在其他方面，文字也是这里的一门本地产业。1925年创刊的《纽约客》为（清晰明了的）文风树立了标准；自1942年起刊登的《纽约时报》填字游戏，每逢周四就用把几个字母塞进一个方格的（字谜）方格考验解谜者。美国最大的几家出版社都把总部设在曼哈顿，编辑们在那里筛选全国的文学（作品总集），去（糟粕）而存精华。这座城市孕育过许多（虚构的）英雄：蜘蛛侠的另一个身份彼得·帕克，就是在皇后区森林小丘长大的。《纽约邮报》的“第六版”等八卦专栏专营（粗俗中伤的）内容，而从《了不起的盖茨比》到《蒂凡尼的早餐》，无数小说的核心（构思）都是：新来者可以在这里重塑自我。"}, {"en": "Comedy is another local export. \"Saturday Night Live\" has been broadcast from Studio 8H at Rockefeller Center since 1975; a good (skit) can define a politician for a generation, and its impressions range from the (hilarious) to the merely (facetious). Stand-ups hone their sets before (rambunctious) crowds in Greenwich Village basements such as the Comedy Cellar, where the humor can be (mischievous), (bumptious) or, on a bad night, (daft). Sitcoms set in the city have long offered the rest of America the (vicarious) thrill of New York life; \"Seinfeld\", which made a virtue of (vacuous) chatter, was billed as a show about nothing. New York comedy can be cruel, but at its best it is rarely (malicious).", "zh": "喜剧是这里的另一项输出品。《周六夜现场》自1975年起就在洛克菲勒中心的8H演播室播出；一个好的（滑稽短剧）能让一位政治人物的形象定格一代人之久，而节目对政客的模仿从（令人捧腹的）到仅仅是（插科打诨的），不一而足。单口喜剧演员在格林威治村的地下室里，比如“喜剧地窖”，面对（喧闹的）观众打磨自己的段子，那里的幽默可能（顽皮捣蛋）、（自以为是），或者在状态不佳的夜晚显得（愚蠢）。以这座城市为背景的情景喜剧，长期以来为美国其他地方的人带来（间接体验的）纽约生活刺激；把（空洞无聊的）闲聊变成看点的《宋飞正传》，曾被标榜为一部“关于虚无的剧”。纽约喜剧可能很残酷，但在最好的时候，它很少是（恶意的）。"}, {"en": "The city's speech is as (distinct) as its humor. The traditional New York (dialect), which drops the \"r\" after vowels and turns \"coffee\" into \"cawfee\", is fading among the young, but the city's (multifarious) tongues are not: by one estimate as many as 700 languages are spoken here, making it perhaps the most linguistically diverse city on earth. Faith is another (facet) of that diversity. Catholics (genuflect) in St Patrick's Cathedral on Fifth Avenue; in Williamsburg, Brooklyn, the Satmar Hasidim, a deeply (pious) Hasidic (sect), maintain one of their largest communities; and the (minaret) of the Islamic Cultural Center rises over the Upper East Side. Kahlil Gibran, who lived for two decades in a Greenwich Village studio, published his parables of a (prophet) named Almustafa in New York in 1923.", "zh": "这座城市的口音和它的幽默一样（独特）。传统的纽约（方言）会省略元音后的“r”音，把“coffee”念成“cawfee”，它在年轻人中正逐渐消失，但这座城市（五花八门的）语言却没有：据一项估计，这里使用的语言多达700种，这或许使它成为地球上语言最多样的城市。信仰是这种多样性的另一个（侧面）。天主教徒在第五大道的圣帕特里克大教堂里（屈膝跪拜）；在布鲁克林的威廉斯堡，极为（虔诚的）哈西德犹太教萨特玛（教派）拥有其最大的社区之一；伊斯兰文化中心的（宣礼塔）则矗立在上东区。纪伯伦在格林威治村的一间工作室里住了二十年，1923年在纽约出版了他关于一位名叫阿尔穆斯塔法的（先知）的寓言集。"}, {"en": "Food is a civic religion. Every Fourth of July at Coney Island, Nathan's Famous holds a hot-dog-eating contest; this year Joey Chestnut won his 18th title by forcing 66 franks and buns down his (esophagus) in ten minutes, despite 90-degree heat, and Miki Sudo took her 12th women's title with 38.75. Such (gluttonous) spectacle draws large crowds. Everyday eating is more refined, though the (surfeit) of options can overwhelm: a (ravenous) New Yorker can choose between halal carts, Sichuan noodles in Flushing and a (scrumptious) slice folded in half, never cut with a knife and fork. When Bill de Blasio, then the new mayor, was photographed eating pizza with cutlery in 2014, many New Yorkers called it (sacrilegious). At Katz's Delicatessen, open since 1888, countermen still grip a long knife by its (haft) to hand-carve pastrami.", "zh": "饮食是一种市民宗教。每年7月4日，内森名店都会在科尼岛举办吃热狗比赛；今年，乔伊·切斯特纳特顶着90华氏度的高温，在十分钟内把66个热狗连面包塞进了（食道），第18次夺冠，米姬·须藤则以38.75个的成绩赢得她的第12个女子组冠军。这种（暴饮暴食的）奇观吸引了大批观众。日常饮食则更为讲究，尽管选择的（过剩）可能让人无所适从：一个（饥肠辘辘的）纽约人可以在清真餐车、法拉盛的川味面条和一片对折着吃、绝不用刀叉切的（美味可口的）披萨之间挑选。2014年，刚上任的市长比尔·白思豪被拍到用刀叉吃披萨，许多纽约人称之为（亵渎神圣的）行为。在1888年开业的卡茨熟食店，柜台师傅们至今仍握着长刀的（刀柄）手切熏牛肉。"}, {"en": "Higher up the scale, the city's restaurants cater to every whim. The Union Square Greenmarket, founded in 1976, sells spring (asparagus) and (luscious) summer peaches straight from regional farms. Delmonico's, which claims to have been America's first fine-dining restaurant, lent its name to a cut of steak; today's (gourmet) temples serve tasting menus that strike some diners as (pretentious) but delight the (fastidious), down to a perfectly seared (fillet) of fish. Simpler pleasures endure: the smell of fresh bagels at dawn is enough to (whet) anyone's appetite.", "zh": "在更高的档次上，这座城市的餐馆能满足各种口味。1976年创办的联合广场绿色市集出售春天的（芦笋）和夏天（甘美多汁的）桃子，都直接来自本地区的农场。德尔莫尼科餐厅自称是美国第一家高级餐厅，一种牛排的切法便以它命名；如今的（美食）殿堂供应品尝菜单，有些食客觉得（矫揉造作），却能让（挑剔的）人满意，细致到一块煎得恰到好处的（鱼片）。简单的乐趣依然存在：黎明时分新鲜百吉饼的香味，足以（激起）任何人的食欲。"}, {"en": "Breakfast is more democratic. Bodegas fry the city's beloved bacon, egg and cheese on a roll; brunch spots crack eggs into a cast-iron (skillet); and some chefs prize the small, richly flavored eggs of a young (pullet). Drinking has deep roots. The city has always been (bibulous), and during Prohibition a police commissioner estimated that it had 32,000 speakeasies. Young adults today are more (abstemious) than their parents were, and alcohol-free bars have opened in Brooklyn and Manhattan. It would be (remiss), though, not to add that the city's bars still do a roaring trade.", "zh": "早餐则更加平民化。街角杂货店煎制全城人钟爱的培根鸡蛋奶酪卷；早午餐店把鸡蛋打进铸铁（煎锅）；一些厨师青睐（小母鸡）下的个头小、味道浓郁的鸡蛋。饮酒在这里由来已久。这座城市向来（嗜酒），禁酒令期间，一位警察局长估计全市有3.2万家地下酒吧。如今的年轻人比他们的父母更（有节制），布鲁克林和曼哈顿也开起了无酒精酒吧。不过，如果不补充一句这座城市的酒吧生意依然兴隆，那就（失职）了。"}, {"en": "Fashion remains big business. The Garment District once stitched much of America's clothing; today design, marketing and the shows of New York Fashion Week matter more than manufacturing. On the first Monday in May the Met Gala parades (gorgeous) gowns, (curvaceous) silhouettes and (lustrous) silks up the museum's steps, and printers often (emboss) invitations to the season's parties on heavy card. Craft has made a comeback, too: young New Yorkers (knit) and (crochet) on the subway, and (deft) tailors in Midtown still cut suits by hand. Before dawn on West 28th Street, in what remains of the Flower District, florists assemble each (bouquet) from roses, peonies and sprigs of silver-leaved (eucalyptus) for the city's hotels and restaurants.", "zh": "时尚依然是一门大生意。服装区曾经缝制了美国的大量服装；如今，设计、营销和纽约时装周的发布秀比制造业更重要。每年5月的第一个星期一，大都会艺术博物馆慈善晚宴都会让（华美的）礼服、（曲线玲珑的）身姿和（光泽亮丽的）丝绸沿博物馆台阶鱼贯而上，印刷商则常在厚卡纸请柬上（压印）当季派对的名称。手工艺也重新流行起来：年轻的纽约人在地铁上（编织）和（钩织），中城（手艺娴熟的）裁缝仍在手工裁剪西装。在西28街，在花卉区仅存的地带，花商们天亮前就把玫瑰、牡丹和几枝银叶（桉树）扎成一束束（花束），供应城中的酒店和餐馆。"}, {"en": "The city's nightlife has always tested its tolerance. Victorian New York teemed with brothels and dance halls that struck Anthony Comstock, an (abstentious) crusader who founded the New York Society for the Suppression of Vice in 1873, as hopelessly (licentious). His heirs would have hated Studio 54, which opened in 1977 and offered celebrities (voluptuous) disco (bliss) until 1980, when its owners went to prison for tax evasion after being (mendacious) about the cash they skimmed. On June 28th 1969 patrons of the Stonewall Inn, a gay bar in Greenwich Village, fought back against a police raid, sparking the modern gay-rights movement. Harlem's drag balls gave the world voguing and a (fabulous) vocabulary. A taste for (lubricious) humor and a readiness to (transgress) remain part of the city's character.", "zh": "这座城市的夜生活一直在考验它的包容度。维多利亚时代的纽约遍布妓院和舞厅，在安东尼·康斯托克看来，这些地方（放荡淫乱）得无可救药；他是一位（禁欲克己的）道德斗士，于1873年创立了纽约取缔恶习协会。他的后继者们想必会痛恨54俱乐部：这家夜店1977年开业，为名流们提供（感官享受的）迪斯科（极乐），直到1980年，其老板因在私吞现金一事上（不诚实），犯下逃税罪而入狱。1969年6月28日，格林威治村同性恋酒吧石墙酒吧的顾客奋起反抗警察的突袭搜查，由此引发了现代同性恋权利运动。哈莱姆的变装舞会给世界带来了“时尚舞”和一套（绝妙的）词汇。对（猥亵）幽默的喜好和（逾越规矩）的意愿，至今仍是这座城市性格的一部分。"}, {"en": "Getting around is an adventure. The subway, opened in 1904, has 472 stations and runs around the clock. Its platforms are (cacophonous), its summer heat (horrendous) and its smells, from (noxious) brake dust to the (odoriferous) leavings of humanity, notorious; on a July afternoon barely a breath of air stirs from a ventilation (duct). Many stations built a century ago have cramped points of (ingress) and (egress), and far too few have elevators. Most riders endure the (monotonous) commute with headphones on, staring at their phones in a (distrait) trance. The Second Avenue line, first proposed in the 1920s, opened its first three new stations only in 2017.", "zh": "在城里出行是一场冒险。1904年开通的地铁有472个车站，全天候运营。站台上（嘈杂刺耳），夏天的炎热（可怕），气味更是臭名昭著，从（有毒的）刹车粉尘到人类留下的（气味浓烈的）污物，不一而足；七月的下午，通风（管道）里几乎吹不出一丝风。许多建于一个世纪前的车站，（入口）和（出口）都很狭窄，配有电梯的车站也少得可怜。大多数乘客戴着耳机熬过（单调乏味的）通勤，（心不在焉）地盯着手机发呆。第二大道线早在20世纪20年代就已提出，直到2017年才开通了首批三座新车站。"}, {"en": "The city's two great train stations offer a cautionary tale. Grand Central Terminal, opened in 1913, is the classic (rendezvous): \"meet me at the clock\" atop its information booth. Its survival owes much to Jacqueline Kennedy Onassis, who campaigned to save it, and to a 1978 Supreme Court ruling upholding the city's landmarks law. Pennsylvania Station was less lucky. Its (egregious) demolition, begun in 1963, was an (ignominious) moment for the city; the architectural historian Vincent Scully lamented that travelers who had once entered the city like gods now scuttled in like rats. The outrage led to the creation in 1965 of the Landmarks Preservation Commission, now so (punctilious) that owners in historic districts need its permission to replace a window. Efforts to rebuild Penn Station have been (maladroit) for decades. The latest federal renderings promise a (meticulous) return to classical grandeur, with a stone facade, columns and a grand concourse, and Mr Trump's name and seal on an interior wall.", "zh": "这座城市的两座大火车站讲述了一个警世故事。1913年启用的中央车站是经典的（约会地点）：“咱们在大钟下见”，指的是问讯亭顶上的那座钟。它能幸存下来，很大程度上要归功于为拯救它而奔走的杰奎琳·肯尼迪·奥纳西斯，以及1978年最高法院一项支持纽约市地标保护法的裁决。宾夕法尼亚车站就没那么幸运了。1963年开始的那场（极其恶劣的）拆除，是这座城市（耻辱的）时刻；建筑史学家文森特·斯卡利哀叹，旅客们曾经像神一样步入这座城市，如今却像老鼠一样窜进来。由此引发的愤怒促成了1965年地标保护委员会的成立，如今这个委员会（一丝不苟）到了这种程度：历史街区的业主要更换一扇窗户都得经过它的许可。几十年来，重建宾夕法尼亚车站的努力一直（笨拙无能）。联邦政府最新的效果图承诺一次（精益求精的）回归古典宏伟风格，有石材立面、立柱和宏大的中央大厅，内墙上还会有特朗普的名字和徽印。"}, {"en": "Above ground, New Yorkers walk with a brisk (gait) and an (impetuous) disregard for traffic signals; since 2024 jaywalking has been legal. Cycling, once (perilous), has boomed since Citi Bike arrived in 2013, and riders stream across the Queensboro Bridge alongside its steel (truss). Delivery workers on e-bikes cover a wide (radius) at alarming speed. In 2025 Waymo began testing (autonomous) cars in Manhattan and Downtown Brooklyn, with a safety driver required behind the wheel. For many residents a private car is (superfluous); for those who rely on buses, routes are often (circuitous) and slow.", "zh": "在地面上，纽约人走路的（步态）轻快，对交通信号灯有一种（冲动鲁莽的）漠视；自2024年起，乱穿马路已经合法。骑自行车曾经（危险重重），但自2013年花旗单车问世以来已蔚然成风，骑行者沿着皇后区大桥的钢制（桁架）川流而过。骑电动自行车的外卖员以惊人的速度覆盖很大的（半径）范围。2025年，Waymo开始在曼哈顿和布鲁克林市中心测试（自动驾驶）汽车，规定驾驶座上必须有一名安全员。对许多居民来说，私家车是（多余的）；而对依赖公交的人来说，线路往往（迂回曲折）且缓慢。"}, {"en": "For all its concrete, the city is surprisingly green. Central Park's 843 acres, laid out by Frederick Law Olmsted and Calvert Vaux from 1858, were meant to give a crowded, unhealthy city a (salubrious) escape. The High Line, an elevated rail line that reopened as a park in 2009, is planted with (herbaceous) perennials and grasses. A 2015 count found about 666,000 street trees, most of them (deciduous); the London plane is the most common. The parks department favors male ginkgos to spare pedestrians the odor of the fleshy seeds produced by female trees; botanically, the species is (acarpous), since ginkgos are gymnosperms and bear no true fruit. In the Bronx, the New York Botanical Garden preserves a 50-acre stand of old-growth forest, whose (ligneous) giants provide a (habitat) for migrating songbirds.", "zh": "尽管遍地混凝土，这座城市却出人意料地绿意盎然。中央公园占地843英亩，由弗雷德里克·劳·奥姆斯特德和卡尔弗特·沃克斯自1858年起设计建造，旨在为拥挤而不卫生的城市提供一处（有益健康的）休憩之所。高线公园由一条高架铁路改建而成，2009年作为公园重新开放，种植着（草本的）多年生植物和草类。2015年的一次统计发现，全市约有66.6万棵行道树，其中大多数是（落叶的）；最常见的是伦敦悬铃木。公园管理部门倾向栽种雄性银杏，以免行人闻到雌树肉质种子的异味；严格按植物学定义，银杏属于（不结真果的）裸子植物，雌树结出的也不是真正的果实。在布朗克斯，纽约植物园保存着一片50英亩的原始森林，其中（木本的）参天大树为迁徙的鸣禽提供了（栖息地）。"}, {"en": "Wildlife has followed. Bald eagles, absent for a century, began nesting on Staten Island in 2015, and birders now scan the treetops for each new (eaglet). Mute swans steer a (cygnet) or two around the lakes of the outer boroughs, and red-tailed hawks, (carnivorous) and unfazed by traffic, nest on Fifth Avenue ledges. Staten Island's white-tailed deer became so plentiful that the city spent several years giving bucks vasectomies to curb the (herbivorous) herd. The most notorious resident is the brown rat, of the (genus) Rattus, an (omnivorous) survivor against which the city appointed a \"rat czar\" in 2023. Flaco, a Eurasian eagle-owl who escaped from the Central Park Zoo in 2023, lived free for a year; tests after his death found rat poison in his body. Even the humble (gnat) thrives in the salt marshes of Jamaica Bay, to the delight of the birds that feed on it.", "zh": "野生动物也随之而来。消失了一个世纪的白头海雕于2015年开始在史泰登岛筑巢，观鸟者如今会在树梢上寻找每一只新出生的（小鹰）。疣鼻天鹅带着一两只（小天鹅）在外围各区的湖泊里游弋，（食肉的）红尾鹰对车流毫不在意，在第五大道的楼檐上筑巢。史泰登岛的白尾鹿数量激增，市政府花了好几年为雄鹿做结扎手术，以控制这群（食草的）鹿的数量。最臭名昭著的居民是褐家鼠，属于家鼠（属），是一种（杂食的）生存高手，市政府在2023年为对付它们专门任命了一位“灭鼠沙皇”。雕鸮“弗拉科”于2023年从中央公园动物园逃出，在外自由生活了一年；它死后的检测发现，它体内有灭鼠药。就连不起眼的（小蚊虫）也在牙买加湾的盐沼中繁衍生息，令以它为食的鸟类大快朵颐。"}, {"en": "The city's water supply is a marvel of (foresight). It flows by gravity from upstate reservoirs as far as 125 miles away and is so clean that, unlike most big American systems, it does not need filtering. Its main artery, the Delaware (aqueduct), at 85 miles the world's longest tunnel, has leaked up to 35m gallons a day, prompting a costly bypass beneath the Hudson. In late 2024 a (drought) led the city to urge residents to conserve water, and in dry spells (saliferous) tidal water pushes the Hudson's \"salt front\" upriver toward the drinking-water intakes of towns along the estuary, which is tidal as far north as Troy. Underfoot, Manhattan rests on hard, largely (nonporous) schist; across the river rise the Palisades, cliffs of (igneous) rock some 200m years old. Here and there a (rivulet) survives: Minetta Brook, which once ran through Greenwich Village, still trickles underground, and in northern Manhattan the Harlem River flows through a rocky (cleft) where a canal was cut in 1895.", "zh": "这座城市的供水系统是（远见）的奇迹。水从远至125英里外的上州水库靠重力流来，水质纯净到无需过滤，这在美国大型供水系统中实属少见。其主动脉特拉华（输水渠）长85英里，是世界上最长的隧道，每天漏水多达3500万加仑，为此不得不在哈德逊河下修建一条耗资巨大的绕行隧道。2024年底，一场（干旱）促使市政府敦促居民节约用水；干旱时，（含盐的）潮汐河水会推动哈德逊河的“咸水锋”上溯，逐渐逼近沿岸城镇的饮用水取水口；该河受潮汐影响的河段一直延伸到特洛伊。脚下，曼哈顿坐落在坚硬、基本（无孔隙的）片岩之上；河对岸则耸立着帕利塞兹悬崖，由约2亿年前形成的（火成的）岩石构成。一些（小溪）依然存在：曾流经格林威治村的米内塔溪至今仍在地下涓涓流淌；在曼哈顿北部，哈莱姆河流经一道岩石（裂口），1895年人们在那里开凿了一条运河。"}, {"en": "Climate change is bringing heavier downpours. On September 1st 2021 the remnants of Hurricane Ida dumped a record 3.15 inches of rain on Central Park in an hour; 13 people died in the city, 11 of them in basement apartments. Sewers designed for about 1.75 inches an hour cannot cope when towering (cumulus) clouds burst. So the city is installing rain gardens, (porous) asphalt and (pervious) concrete that let each (droplet) soak into the ground. To (counteract) warming, Local Law 97 of 2019 caps greenhouse-gas emissions from most buildings larger than 25,000 square feet. Those emissions include (gaseous) carbon dioxide from burning fuel; the state also hopes to (harness) offshore wind, though federal hostility has slowed it. On the hottest days a (vaporous) haze still hangs over the harbor.", "zh": "气候变化正带来更猛烈的暴雨。2021年9月1日，飓风“艾达”的残余在一小时内向中央公园倾泻了创纪录的3.15英寸雨水；全市有13人死亡，其中11人死在地下室公寓里。按每小时约1.75英寸设计的下水道，在高耸的（积云）骤然化雨时根本无法应对。因此，市政府正在建设雨水花园，铺设（多孔的）沥青和（透水的）混凝土，让每一颗（水滴）都能渗入地下。为了（对抗）变暖，2019年的《第97号地方法》限制了大多数面积超过2.5万平方英尺建筑的温室气体排放，其中包括燃烧燃料时产生的（气态的）二氧化碳；州政府还希望（利用）海上风能，尽管联邦政策的阻力拖慢了相关进程。在最热的日子里，港口上空仍笼罩着一层（雾气腾腾的）阴霾。"}, {"en": "Industrial pollution has left a long legacy. The Gowanus Canal in Brooklyn, a federal Superfund site since 2010, is lined with a (viscous) sediment of coal tar and sewage that locals call \"black mayonnaise\"; dredging began in 2020. Under Greenpoint, along Newtown Creek, an oil spill discovered in 1978 and estimated at 17m to 30m gallons, larger than the Exxon Valdez disaster, seeped from refineries over decades. Such (hazardous) waste is (insidious): it lurks unseen, and it can remain (injurious) to health long after the factories have closed.", "zh": "工业污染留下了长久的遗患。布鲁克林的戈瓦纳斯运河自2010年起被列为联邦超级基金污染场地，河底覆盖着一层由煤焦油和污水构成的（黏稠的）沉积物，当地人称之为“黑色蛋黄酱”；疏浚工程于2020年开始。在绿点地下，沿着纽敦溪，有一处1978年发现的石油泄漏，估计泄漏量达1700万至3000万加仑，超过了埃克森·瓦尔迪兹号漏油事故，这些石油数十年间从炼油厂渗出。这类（危险的）废物是（隐伏为害的）：它们潜藏于看不见的地方，在工厂关闭很久之后仍可能（有害）于健康。"}, {"en": "The city's hospitals rank among the world's best. Its public system, NYC Health + Hospitals, runs 11 of them, including Bellevue, founded in 1736 and America's oldest public hospital, and treats all comers regardless of their ability to pay. In its trauma bays surgeons reach for a (hemostat) to clamp bleeding vessels; elsewhere, nurses may use a (lancet) to obtain a drop of blood. Bystander-training courses teach ordinary people to apply a (tourniquet) to stem severe bleeding. Paramedics revive (unconscious) overdose victims with naloxone; more than 3,000 New Yorkers died of overdoses in 2023. New York legalized abortion in 1970, three years before Roe v. Wade, and its law now protects the procedure until a (fetus) is viable, and later if a patient's health is at risk. Federal cuts to Medicaid passed in 2025 could have (deleterious) effects on hospitals that depend on it.", "zh": "这座城市的医院跻身世界一流之列。其公立系统纽约市健康与医院公司下辖11家医院，其中包括1736年创办的美国最古老公立医院贝尔维尤医院，无论病人有无支付能力，一律接诊。在创伤急救室里，外科医生会用（止血钳）夹住出血的血管；在其他诊疗场景中，护士可能用（采血针）取一滴血。面向普通人的急救培训则教授如何使用（止血带）止住严重出血。急救人员用纳洛酮救治（不省人事的）吸毒过量者；2023年有超过3000名纽约人死于药物过量。纽约在1970年就将堕胎合法化，比“罗诉韦德案”早三年，如今该州法律保护堕胎直至（胎儿）具备存活能力为止，若患者健康面临风险，期限还可延后。2025年通过的联邦医疗补助削减，可能会对依赖这一补助的医院产生（有损害的）影响。"}, {"en": "Universities are another pillar of the city, and another battleground. Columbia, founded in 1754 as King's College, agreed in 2025 to pay more than $200m to the federal government to restore some $400m in grants that the Trump administration had canceled over its handling of antisemitism on campus; many of its faculty saw a deal struck under (duress). Its core curriculum, which since the 1930s has required undergraduates to (dissect) Homer and Plato, remains among the most (prestigious) in America, though detractors call its (syllabus) (tendentious) in what it leaves out. Columbia's contribution to science is vast. In 1939 physicists in the basement of its Pupin Hall carried out America's first demonstration of nuclear fission, in which a uranium (nucleus) breaks apart; the Manhattan Project took its name from the army's Manhattan Engineer District, headquartered on Broadway, and the first atomic device it tested was nicknamed \"the (gadget)\". Edwin Armstrong, a Columbia professor, invented FM radio, a clearer way to (transmit) sound. Downtown, New York University, whose (violet) banners fly around Washington Square, has become a magnet for (intellect) and ambition from around the world.", "zh": "大学是这座城市的另一根支柱，也是另一个战场。哥伦比亚大学1754年以国王学院之名创立，2025年同意向联邦政府支付超过2亿美元，以恢复特朗普政府以其处理校园反犹主义不力为由取消的约4亿美元拨款；许多教员认为，这笔交易是在（胁迫）下达成的。它的核心课程自20世纪30年代起就要求本科生（剖析）荷马和柏拉图，至今仍是美国最（负有盛名的）课程之一，尽管批评者说，从它的取舍来看，其（教学大纲）（带有倾向性）。哥大对科学的贡献巨大。1939年，物理学家在其浦品楼的地下室进行了美国首次核裂变演示，在这一过程中，铀（原子核）发生分裂；曼哈顿计划得名于陆军总部设在百老汇的曼哈顿工程区，它测试的第一个原子装置绰号叫“（小玩意儿）”。哥大教授埃德温·阿姆斯特朗发明了调频广播，一种更清晰地（传送）声音的方式。在下城，纽约大学的（紫罗兰色）旗帜飘扬在华盛顿广场四周，它已成为吸引世界各地（智识）与雄心的磁石。"}, {"en": "Power in the city is divided. In January the 51-member City Council elected Julie Menin, a moderate from the Upper East Side, as its first Jewish speaker by a (unanimous) vote, passing over the mayor's preferred candidate. The council's progressive (caucus) is his natural ally, and on many issues a working (consensus) exists. But the (locus) of real power over the city's taxes is Albany. The state legislature's (leisureliness) is notorious: this year's spending plan arrived two months late after (tortuous) negotiations, and its haggling can (protract) almost any argument. The (pact) that Ms Hochul and Mr Mamdani eventually struck, with more state aid and a tax on second homes but no income-tax rise, was a (judicious) compromise. Whether Albany will ever (enact) the bigger tax rises he still wants is another matter.", "zh": "这座城市的权力是分散的。1月，由51名议员组成的市议会以（全票一致）的结果，选举来自上东区的温和派朱莉·梅宁为首位犹太裔议长，而没有选择市长属意的人选。市议会的进步派（党团）是他天然的盟友，在许多问题上双方也存在可行的（共识）。但对本市税收拥有实权的（中心）在奥尔巴尼。州议会的（拖沓）是出了名的：今年的开支计划在经过（曲折冗长的）谈判后晚了两个月才出台，而它的讨价还价几乎能把任何争论（拖延）下去。霍楚尔和曼达尼最终达成的（协议），即更多的州援助和第二套住房税，但不提高所得税，是一个（明智的）妥协。至于奥尔巴尼是否会（通过）他仍想要的更大幅度加税，则是另一回事了。"}, {"en": "Geography adds complications. The five boroughs are (coterminous) with five counties, consolidated into one city in 1898; Staten Islanders voted to secede in 1993, but Albany never acted. The lines that (delimit) them can be odd. Marble Hill, scene of October's shooting, is legally part of Manhattan but, since the canal was cut and the old creek filled in, physically (contiguous) with the Bronx.", "zh": "地理因素让情况更加复杂。五个行政区与五个县的边界（重合），它们在1898年合并成一座城市；史泰登岛居民曾在1993年投票赞成脱离纽约市，但奥尔巴尼从未采取行动。（划定）各区的界线有时很古怪。10月枪击案发生地马布尔希尔在法律上属于曼哈顿，但自从运河开凿、旧溪道被填平以来，它在地理上与布朗克斯（毗连）。"}, {"en": "Mr Mamdani has handled Ms Hochul with (tact). She endorsed him in September 2025, after some hesitation; he has avoided public (testiness) even when she rejected his tax plans, and their dealings have been far friendlier than the (acrimonious) feud between Mr Cuomo and Mr de Blasio a decade ago. In the Marist poll 60% of New Yorkers said the two collaborate the right amount. Their (compact) will be tested after November 3rd, when Ms Hochul, who led her Republican rival, Bruce Blakeman, by 19 points in a recent Quinnipiac poll, seeks a second full term. State lawmakers have been in (recess) since June; when they return in January, the mayor will push again for higher taxes on the rich. Relations with the council are scratchier. Ms Menin's (assertiveness) over property taxes exposed a (rift) with City Hall, which the mayor closed by backing down. On the left there is (restiveness): police-reform groups called the decision to keep Ms Tisch \"a rebuff of his promises\", and some of the (fractious) progressives who helped elect him wanted a bigger shake-up at the top of the police department. His criticism of Israel's war in Gaza continues to (discomfit) many Jewish New Yorkers. So far, though, his (conduct) in office has been more pragmatic than either his fans or his foes predicted.", "zh": "曼达尼与霍楚尔打交道时颇有（分寸）。霍楚尔在犹豫一番后于2025年9月为他背书；即便她否决了他的税收计划，他也避免公开表现出（不耐烦），两人的关系远比十年前科莫和白思豪之间（尖刻激烈的）不和要友好得多。在马里斯特民调中，60%的纽约人认为两人的合作程度恰到好处。他们之间的（约定）将在11月3日之后接受考验：届时霍楚尔将寻求第二个完整任期，在最近一项昆尼皮亚克民调中，她领先共和党对手布鲁斯·布莱克曼19个百分点。州议员们自6月起一直处于（休会）状态；明年1月他们复会时，市长将再次争取对富人加税。与市议会的关系则更磨人。梅宁在房产税问题上的（强势）暴露了她与市政厅之间的（裂痕），市长以让步弥合了这一裂痕。左翼阵营中则出现了（躁动不安）：警务改革团体称留任蒂施的决定是“对他承诺的背弃”，一些帮他当选的（难以驾驭的）进步派人士希望对警察局高层进行更大规模的改组。他对以色列在加沙战争的批评，继续让许多犹太裔纽约人感到（不安）。不过到目前为止，他在任内的（行为）比他的支持者和反对者所预料的都更务实。"}, {"en": "Schools pose subtler questions. The city's public-school system, the country's largest, with around 900,000 pupils, must comply with a 2022 state law that requires smaller classes by 2028, and the mayor's spending plan included money to hire 1,000 more teachers. The fiercest argument is over the specialized high schools, such as Stuyvesant, which admit pupils solely on the results of an entrance exam. Defenders say the test recognizes (meritorious) achievement by (industrious) children, many from poor Asian immigrant families, whose (sedulous) preparation pays off. Critics call the system (invidious) because few Black and Hispanic pupils win places, and argue that test-prep culture can (inhibit) a broader education. State law, not the mayor, governs admissions to the oldest of these schools, so (conscientious) parents on both sides are watching Albany as closely as City Hall.", "zh": "学校问题则更为微妙。纽约市的公立学校系统是全美最大的，约有90万名学生，必须遵守2022年的一项州法律，在2028年前缩小班级规模；市长的开支计划中包含了再聘用1000名教师的资金。争论最激烈的是史岱文森高中等特殊高中，它们仅凭入学考试成绩录取学生。支持者说，考试认可（值得表彰的）学业成绩，这些成绩来自（勤奋的）学生；不少人出身贫困的亚裔移民家庭，他们（孜孜不倦的）备考终于得到了回报。批评者则称这一制度（有失公平），因为考上的黑人和西班牙裔学生寥寥无几，并认为应试培训文化可能会（抑制）更全面的教育。其中最老牌几所学校的招生由州法律而非市长决定，因此双方（认真负责的）家长对奥尔巴尼的关注不亚于对市政厅。"}, {"en": "The city's most (relentless) problem is homelessness. A 1981 court settlement gives anyone who needs it a legal right to shelter, a guarantee unique among big American cities. From the spring of 2022 more than 230,000 migrants, many of them bused from Texas, passed through the city's care, filling hotels and emergency tents and costing billions. That (vicissitudinous) flow has since ebbed, but tens of thousands of people still sleep in shelters each night, and (numerous) others sleep on the streets and in the subway. Advocates (entreat) the mayor to build more supportive housing; critics who cast the homeless as (shiftless) ignore the mental illness and addiction that (afflict) many of them. The sight of (listless) figures slumped across seats on some trains haunts riders. Campaigners want a more (solicitous) approach tha
