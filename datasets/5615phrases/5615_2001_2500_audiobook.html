<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cases to answer — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  .book-subtitle {
    font-size: 1.02rem;
    color: var(--muted);
    font-style: italic;
    margin: 0 0 10px;
  }
  .zh-subtitle {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 0.92rem;
    margin-top: 6px;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>Cases to answer</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "Cases to answer", "zh": "有案待答"}, {"en": "Thieves, claimants, protesters and crowds are testing the world's great museums. How they respond will decide who gets to tell the story of the past", "zh": "窃贼、文物索还者、抗议者和汹涌人潮，正在考验世界各大博物馆。它们如何应对，将决定谁有权讲述过去的故事。"}, {"en": "Shortly after 9.30 on a Sunday morning in October 2025, two men in yellow high-visibility vests rode a truck-mounted furniture lift up the Seine-side façade of the Louvre. They were not (sneaking) through a side door; they were in plain sight, with little need for (stealth): in Paris such lifts are as common as pigeons, and workmen are all but invisible. Then, (bearing) a disc cutter, they sliced through a window of the Galerie d'Apollon, broke the gallery's Sunday (hush) with an (earsplitting) alarm, threatened the guards with their power tools and set about two display cases. Within four minutes they had made off with eight pieces of France's crown jewels: tiaras and necklaces, a (brooch) or two and a sapphire (earring), their stones (glowing) beneath the gallery's gilded ceiling. Two accomplices waited below on scooters. It was an (arresting) sight and a (brash) piece of work: a daylight (snatch), lasting less than eight minutes from lift up to lift down, at the most-visited museum on Earth.", "zh": "2025年10月的一个星期日上午9点30分刚过，两名身穿黄色反光背心的男子，乘坐一台装在卡车上的家具升降机，沿卢浮宫面向塞纳河的外墙升了上去。他们并没有从侧门（偷偷潜入），而是堂而皇之地出现在众人眼前，几乎不需要（隐蔽行踪）：在巴黎，这种升降机和鸽子一样常见，工人往往根本没人注意。随后，他们（携带）一台圆盘切割机，切开阿波罗长廊的一扇窗户，打破展厅星期日的（寂静）；警报声（震耳欲聋）。他们接着拿电动工具威胁警卫，并向两个展柜下手。不到四分钟，他们就带走了八件法国王室珠宝：冠饰、项链、一两枚（胸针）和一只蓝宝石（耳环）；在镀金天花板下，宝石（闪耀）着光芒。另有两名同伙骑摩托车在楼下接应。这一幕着实（令人瞩目），行动也极其（大胆鲁莽）：在地球上参观人数最多的博物馆里，他们光天化日完成了一场（抢夺），从升降机升起到降下还不到八分钟。"}, {"en": "The raid was (slick); the getaway was more (slapdash). The gang's plan to (ditch) the lift in flames failed when an attempt to torch its basket fizzled, and in their haste they dropped a ninth piece, the crown of Empress Eugénie, which was found battered, short of a golden eagle and ten diamonds, after being dragged through a gap too small for it. The rest of the (pelf), valued by the Louvre's curators at €88m, has not been seen since. Jewels like these cannot be sold whole; no (fencing) operation could find a buyer for a (monarch)'s tiara. The (gnawing) fear is that the stones will be recut and the gold melted down, which would (vaporize) two centuries of history in an afternoon. For the French it was a (wrench): a museum born of the Revolution had let the nation's most glittering heirlooms leave through a window.", "zh": "这次突袭进行得相当（利落），逃跑却更显（草率）。团伙原打算放火后（弃置）升降机，但点燃吊篮的企图失败了；慌乱中，他们还掉落了第九件宝物——欧仁妮皇后的王冠。王冠被拖过一个过于狭窄的缺口，寻获时已严重受损，少了一只金鹰和十颗钻石。其余（赃财）据卢浮宫策展人员估值达8,800万欧元，至今未见踪影。这种珠宝不可能整件出售；没有哪条（销赃）渠道能为一顶（君主）的冠饰找到买家。人们（挥之不去）的担忧是，钻石会被重新切割，黄金会被熔化，让两个世纪的历史在一个下午（化为乌有）。对法国人而言，这是一记（沉重打击）：一座诞生于大革命的博物馆，竟让国家最璀璨的传家之宝从窗户溜走。"}, {"en": "The police, at least, were quick. Within a week two men known for earlier burglaries had been arrested, one of them at Charles de Gaulle airport as he was about to board a flight to Algeria; DNA found on a helmet left at the scene was matched to one of the pair, leaving little room for an (alibi). By the end of November five people had been charged. Investigators who (debrief) the suspects believe the crew were hired hands, each an (underling) in a network whose trail has since led to Belgium, and some of those in custody are said to be ready to (snitch) on their paymasters in return for lighter sentences. Yet progress has been (halting). Despite (unremitting) pressure on the investigators, nearly a year later the (pressing) question—where are the jewels?—still has no answer.", "zh": "至少警方反应迅速。一周内，两名曾有入室盗窃前科的男子被捕，其中一人在戴高乐机场准备登上飞往阿尔及利亚的航班时落网；现场遗留的头盔上检测出的DNA与其中一人吻合，使他的（不在场证明）难以成立。到11月底，已有五人受到起诉。（讯问）嫌疑人的调查人员认为，作案者只是受雇干活的人，每个人都是一个犯罪网络里的（底层喽啰），线索后来延伸至比利时。据称，部分在押人员愿意（供出）幕后雇主，以换取较轻刑罚。然而调查进展仍然（时断时续）。尽管调查人员承受着（持续不断）的压力，将近一年后，那个最（迫切）的问题——珠宝究竟在哪里？——依然没有答案。"}, {"en": "What came out afterwards was more embarrassing than the raid. Only 39% of the Louvre's rooms were covered by cameras, and the camera in the Apollo gallery was reportedly facing the wrong way. An audit by France's cyber-security agency had found back in 2014 that the password for the video-surveillance system was \"Louvre\", an (amateurish) lapse that was (grating) to read about a decade later. The Cour des comptes, the national audit office, had already chided the museum for favoring projects that were \"visible and attractive\" over maintenance and security; its (reproof) now read like a prophecy. Unions blamed (piddling) sums allotted to security and years of job cuts. Laurence des Cars, the director, offered to resign on the day of the (breach); the government refused, and then, after four months of (flak), accepted in February 2026. Nothing in the inquiries could (absolve) the museum of responsibility for a (telling) failure: in a building devoted to looking, security had been allowed to grow (slack) and to (lag) years behind the thieves.", "zh": "案发后揭露的问题，比盗窃本身更令人尴尬。卢浮宫只有39%的房间装有摄像头，而阿波罗长廊的一台摄像机据报还对错了方向。法国网络安全机构早在2014年的审计中就发现，视频监控系统的密码竟然是“Louvre”——也就是卢浮宫的名称。十多年后读到这样（外行）的疏漏，依然令人（恼火）。法国国家审计法院此前已经批评卢浮宫，认为它偏爱“显眼、吸引人”的项目，却忽视维修和安保；如今那番（斥责）听起来简直像预言。工会将责任归于投入安保的（少得可怜的）经费，以及多年裁员。馆长洛朗斯·德卡尔在安保（失守）当天提出辞职，政府起初拒绝，四个月的舆论（抨击）之后，终于在2026年2月接受。任何调查结论都无法（免除）博物馆对这一（发人深省的）失职所应承担的责任：在这座以观看为使命的建筑里，安保却日渐（松懈），并且（落后）于窃贼的手段许多年。"}, {"en": "The heist was the most spectacular symptom of a broader malaise. The Louvre received 8.7m visitors in 2024, more than twice the number its glass pyramid was designed to handle. Visitors (debouch) from beneath the pyramid into a (sprawling) (labyrinth) of galleries, and (winding) queues form before the doors open. In a memo leaked in January 2025 Ms des Cars described a palace in physical distress, with water leaks and wild swings of temperature: (sweltering) in summer and, in places, (sopping) when it rains. Days at the museum have become (taxing) for staff and visitors alike. In June 2025 attendants walked out in protest at the crowds, leaving thousands of tourists, some of them (blustering) with indignation, stranded in the courtyard.", "zh": "这次盗窃只是更广泛病症中最引人注目的表现。卢浮宫2024年接待870万名游客，是其玻璃金字塔设计承载量的两倍多。游客从金字塔地下入口（涌出），进入一片（广阔蔓延）、如（迷宫）般的展厅；开门之前，（曲折蜿蜒）的队伍就已排起。德卡尔女士在2025年1月泄露的一份备忘录中，将这座宫殿描述为年久失修、漏水且温差剧烈：夏天（闷热难耐），下雨时有些地方甚至（湿漉漉的）。无论对职员还是游客，逛馆的一天都愈发（令人疲惫）。2025年6月，工作人员为抗议拥挤而罢工，数千名游客被困在庭院中，其中一些人愤怒地（大声叫嚷）。"}, {"en": "Emmanuel Macron's answer, unveiled in January 2025, is an (expansive) project called the \"Louvre – New Renaissance\": a second entrance near the eastern colonnade by 2031 and a room of its own for the \"Mona Lisa\", whose admirers (monopolize) the vast Salle des États. That room is a (bottleneck) in which a (ruck) of selfie-takers jostles for a glimpse of a panel 77cm high; many seem to (idolatrize) a painting they can barely see, learning little about it in the crush. To help pay for the work the museum has chosen to (sock) foreign visitors with higher fees: since January 2026 most visitors from outside Europe have paid €32 instead of €22, a rise of 45% that should bring in €15m-20m a year. Tourists (flock) in all the same; few (balk) at the price of a pilgrimage.", "zh": "马克龙在2025年1月公布的应对方案，是名为“卢浮宫——新文艺复兴”的（规模宏大）项目：计划2031年前在东侧柱廊附近增设入口，并为《蒙娜丽莎》设置独立展厅，因为这幅画的仰慕者几乎（独占）了宽敞的国家厅。如今，那里成了一个（瓶颈）：（乱哄哄的一群）自拍游客相互推挤，只为瞥见一幅高77厘米的画板；不少人仿佛把一幅根本看不清的画（奉若神明），却在拥挤中几乎了解不到什么。为支付工程费用，博物馆决定向外国游客（狠收一笔）：自2026年1月起，多数欧洲以外游客的门票从22欧元升至32欧元，涨幅45%，预计每年增加1,500万至2,000万欧元收入。游客照样（蜂拥而至），很少有人因这场艺术朝圣的价格而（退缩）。"}, {"en": "Museums have long been easier to rob than banks. In the small hours of March 18th 1990 two men disguised as police officers talked their way into the Isabella Stewart Gardner Museum in Boston, a Venetian-style palazzo that had been its founder's (dwelling), by (bluff) alone. They tied up the two young guards and left with 13 works worth perhaps $500m, including two Rembrandt paintings, a Vermeer and a tiny Rembrandt (etching) of the artist himself, no bigger than a postage stamp. Despite a $10m reward and at least one elaborate FBI (sting), the pictures have proved (elusive) for 36 years, and every hopeful tip has proved (illusive); the (commonwealth) of Massachusetts has never seen a bigger theft. Empty frames still hang where the canvases did, a (heartrending) sight that Gardner, who decreed that nothing in her galleries should ever be moved, could hardly have imagined.", "zh": "博物馆历来比银行更容易被盗。1990年3月18日凌晨，两名假扮警察的男子来到波士顿的伊莎贝拉·斯图尔特·加德纳博物馆，这栋威尼斯式宫邸曾是创办人的（住所）；他们仅凭一番（虚张声势）的骗局便骗过警卫，进入馆内。他们捆绑了两名年轻警卫，带走13件价值可能高达5亿美元的艺术品，包括两幅伦勃朗、一幅维米尔，以及一幅不过邮票大小、描绘伦勃朗本人的（蚀刻版画）。尽管悬赏1,000万美元，联邦调查局至少还策划过一次精心设计的（诱捕行动），这些画作36年来仍然（难觅踪影），每条看似有希望的线索最终都沦为（虚幻的希望）；马萨诸塞（联邦州）从未发生过更大的艺术品盗窃案。原先悬挂画布的地方至今留下空画框，这一幕（令人心碎），恐怕连当年明令展厅内不得移动任何物品的加德纳本人也未曾想象过。"}, {"en": "Germany has suffered two of the most (cunning) raids of recent years. In 2017 thieves broke into Berlin's Bode Museum at night and used a wheelbarrow to (lug) away the \"Big Maple Leaf\", a 100kg Canadian gold coin worth €3.75m; it was never recovered and was almost certainly melted down. Two years later raiders set fire to an electrical junction box to plunge part of Dresden into darkness, smashed their way into the Green Vault and used an axe to (pulverize) a display case before fleeing with diamond-encrusted treasures of the Saxon court. Both crimes were traced to members of the Remmo family, a (clannish) dynasty of Berlin's (raffish) underworld. Most of the Dresden loot turned up in a (stash) handed back as part of a plea deal. Gangs that (hatch) such plans know that famous objects are almost impossible to sell; they (nick) them anyway, for the gold, the stones or the glory.", "zh": "德国近年经历了两起手法格外（狡猾精巧）的盗窃。2017年，窃贼夜闯柏林博德博物馆，用手推车将一枚重100公斤、价值375万欧元的加拿大“大枫叶”金币（费力运走）；金币从未追回，几乎肯定已被熔化。两年后，另一批劫匪纵火焚烧配电接线箱，使德累斯顿部分地区停电，随后闯入绿穹珍宝馆，用斧头（砸得粉碎）一个展柜，携萨克森宫廷的镶钻珍宝逃走。两起案件都追溯到雷莫家族成员——柏林（宗族抱团式）、作风（放荡不羁）的地下犯罪势力。德累斯顿的大部分赃物后来出现在一批作为认罪协议组成部分归还的（藏匿赃物）中。那些（密谋策划）盗窃的团伙明知名物几乎卖不出去，却仍要把它们（偷走），或为金银宝石，或为虚名。"}, {"en": "The bigger threat is often already inside the building. In 2023 the British Museum dismissed a senior curator and later took him to court, alleging that he had stolen some 1,800 items, many of them never properly entered in its (catalog), and sold dozens online. A Danish dealer who had spotted pieces on eBay and raised the alarm in 2021 was at first rebuffed, an (unbecoming) episode for which the museum's director apologized as he announced his resignation. Thieves come in stranger shapes, too. In 2009 an American flautist broke into the Natural History Museum's bird collection at Tring and made off with 299 skins, including birds-of-paradise gathered by Alfred Russel Wallace, to feed the (faddish) world of salmon-fly tying, a (fetish) whose devotees recreate the (foppish) splendor of Victorian patterns and will pay thousands for a few feathers. It is hard to (filch) from a bank vault; from a museum it can be done with a suitcase.", "zh": "更大的威胁往往就在博物馆内部。2023年，大英博物馆解雇一名高级策展人，随后将其告上法庭，指称他盗走约1,800件藏品，其中不少未被妥善登记进（馆藏目录），还有数十件被他放到网上出售。一名丹麦古董商2021年发现部分物品出现在eBay上并发出警告，却最初遭到驳斥；这种（有失体面）的处理方式令馆长在宣布辞职时公开道歉。窃贼也有更古怪的类型。2009年，一名美国长笛演奏者潜入自然历史博物馆在特林的鸟类收藏处，盗走299张鸟皮，其中包括阿尔弗雷德·罗素·华莱士采集的天堂鸟标本，供给（追逐一时风尚的）鲑鱼拟饵制作圈。圈内有人把这种爱好发展成一种（狂热迷恋），重现维多利亚时代装饰（浮华讲究）的拟饵图案，愿为几根羽毛支付数千美元。从银行金库（顺手盗取）东西很难；从博物馆拿走宝物，有时一只手提箱就够了。"}, {"en": "Museums have always been entangled with power. The Louvre opened to the public in 1793, a year after the revolutionaries voted to (abolish) the monarchy, turning a palace of kings into a palace of the people. Napoleon then filled it with plunder, sending his armies to (pinch) the bronze horses of St Mark's from Venice and Raphaels from the Vatican; after Waterloo the allies made France hand much of it back, an early lesson in restitution. In those (formative) decades a new ideal took hold: the (comprehensive) collection, conceived as a (nonesuch) that would bring (superlative) works from every civilization under one roof. Its (underlying) assumption, that the strong may keep what the weak cannot defend, is precisely what critics now attack.", "zh": "博物馆向来与权力纠缠不清。1793年，在革命者投票决定（废除）君主制的一年后，卢浮宫向公众开放，把国王的宫殿变成了人民的宫殿。随后拿破仑用战利品填满这里，派军队从威尼斯（顺手夺走）圣马可教堂的青铜马，又从梵蒂冈取走拉斐尔的作品；滑铁卢战役之后，盟国迫使法国归还了其中许多珍品，这成为文物返还的早期一课。在这些具有（奠基意义的）年代，一种新的理想逐渐成形：建立（无所不包的）收藏体系，打造一处（无与伦比的）珍藏，把各种文明中（最杰出的）作品汇聚在同一屋檐下。其（潜在的）假设是，强者有权留下弱者无力保护的物品，而今天批评者攻击的正是这一点。"}, {"en": "For many of them the bigger scandal is not what has been stolen from museums but what was stolen for them. The most famous case sits in the British Museum: some 75 meters of the Parthenon's (frieze), together with metopes and figures from its pediments, removed from the rocky (crag) of the Acropolis by agents of Lord Elgin between 1801 and 1812. Britain insists the (taking) was legal, permitted by the Ottoman authorities who then ruled Athens; Greece calls it looting. The British Museum Act of 1963, which bars trustees from disposing of objects in all but a handful of cases, is a (forbidding) obstacle, and for Greek governments of every stripe reunification has become an (overriding) national cause. Each passing decade seems only to (entrench) both sides.", "zh": "对许多批评者而言，更大的丑闻不是博物馆失去了什么，而是它们当年为了充实收藏偷来了什么。最著名的案例就在大英博物馆：帕特农神庙约75米长的（浮雕饰带），以及檐壁雕板和山墙雕像，都在1801年至1812年间被埃尔金勋爵的代理人从雅典卫城崎岖的（岩崖）上取走。英国坚持认为这种（取走行为）合法，得到当时统治雅典的奥斯曼当局许可；希腊则称之为掠夺。英国1963年《大英博物馆法》规定，除了极少数例外，受托人不得处置馆藏，这是一道（难以逾越的）障碍；对各派希腊政府来说，让这些雕塑重新团聚已成为（压倒一切的）国家事业。几十年过去，双方立场似乎只会愈发（根深蒂固）。"}, {"en": "Diplomacy has not helped. In 2023 Rishi Sunak, then Britain's prime minister, canceled a meeting with his Greek counterpart, Kyriakos Mitsotakis, after the latter raised the marbles on British television, a (tiff) that briefly chilled relations between two NATO allies. George Osborne, the museum's chairman, has floated a \"Parthenon partnership\" under which some sculptures might travel to Athens on long-term loan; as recently as December 2025 he called the marbles the museum's \"most intractable problem\". Greek ministers still (beseech) every visiting dignitary to back their claim, but Greece will accept no deal that implies British ownership, and Britain's government says it will not change the law. In September a British newspaper reported that the (abortive) talks had quietly collapsed without any (substantive) progress. Both sides prefer to (temporize) rather than (scotch) the matter for good; it is too (ticklish) to settle and too valuable to drop.", "zh": "外交并没有改善局面。2023年，时任英国首相里希·苏纳克取消了与希腊总理基里亚科斯·米佐塔基斯的会晤，因为后者在英国电视节目上谈到这些大理石雕塑。这场（小争执）让两个北约盟国的关系短暂降温。大英博物馆董事会主席乔治·奥斯本曾提出“帕特农伙伴关系”，让部分雕塑以长期借展形式前往雅典；直到2025年12月，他还称这批雕塑是博物馆“最棘手的问题”。希腊部长们仍会（恳求）每一位来访政要支持其主张，但希腊不会接受任何暗示英国拥有所有权的协议，英国政府则表示不会修法。9月，一家英国报纸报道，原本已（半途夭折）的谈判悄然破裂，未取得任何（实质性）进展。双方宁愿（拖延周旋），也不愿彻底（了结）这件事；问题太（棘手敏感），无法轻易解决，又太重要，不能就此放弃。"}, {"en": "The Benin Bronzes are a starker case. In 1897 a British punitive expedition, sent to avenge the killing of a British party, set out to (sack) Benin City, in what is now Nigeria. With brutal (dispatch) its troops managed to (raze) much of the city and carried off thousands of brass plaques and heads, along with the tusks on which court artists would (carve) the history of the kingdom, products of a (painstaking) tradition of lost-wax (molding) whose favorite (motif) was the Oba himself. The loot was auctioned to help pay for the expedition and scattered to museums from Berlin to Boston, where it became an (enduring) emblem of African artistry. In the past few years the flow has reversed. Germany transferred ownership of more than 1,100 bronzes to Nigeria in 2022, London's Horniman Museum handed over 72 objects, and in June 2025 the Netherlands returned 119, the largest repatriation yet.", "zh": "贝宁青铜器的案例更为直白。1897年，一支英国惩戒远征军为报复一批英国人员被杀，前往今天尼日利亚境内的贝宁城，准备（洗劫）它。军队以残酷而（迅速）的方式（夷平）了城中大片地区，掳走数千块黄铜浮雕板和头像，以及宫廷工匠用于（雕刻）王国历史的象牙。这些器物出自一套（精细严谨）的失蜡（铸造）传统，最常见的（主题形象）就是贝宁国王奥巴本人。赃物经拍卖抵付远征费用后散落到柏林至波士顿的各大博物馆，成为非洲艺术一个（经久不衰的）象征。近几年，流向开始逆转。德国2022年将1,100多件青铜器的所有权移交尼日利亚，伦敦霍尼曼博物馆交还72件物品，荷兰则于2025年6月返还119件，创下迄今最大规模的归还纪录。"}, {"en": "Returning objects has not ended the arguments; it has relocated them. In 2023 Nigeria's (outgoing) president, Muhammadu Buhari, decreed that the Oba of Benin, the city's traditional ruler, was the owner and custodian of all returned bronzes, upending plans to show them in a new Museum of West African Art, known as MOWAA, nearby. Without a (cohesive) plan agreed between the federal government, the state and an (assertive) royal court, the project faltered. When MOWAA held a soft opening in November 2025, more than a dozen young protesters chanting support for the Oba rushed the grounds and guests were hustled away. For Western curators who had imagined restitution as a tidy act of (redemptive) justice, the (skirmish) was (bewildering); for Nigerians it was a reminder that the past has many (vying) claimants.", "zh": "文物归还并没有终结争论，只是把争论转移到了别处。2023年，尼日利亚（即将卸任的）总统穆罕默杜·布哈里颁令，规定贝宁奥巴——这座城市的传统统治者——是所有归还青铜器的所有者和保管人，打乱了在附近新建的西非艺术博物馆MOWAA展出它们的计划。联邦政府、州政府和王室未能达成（协调统一的）方案，而王室的态度又相当（强势），项目因此受挫。2025年11月，MOWAA举行试开放活动时，十多名高喊支持奥巴口号的年轻抗议者冲进园区，来宾被匆忙带离。对那些原以为文物归还是一项简单明了的（纠正历史过错的）正义之举的西方策展人来说，这场（小规模冲突）令人（困惑不解）；对尼日利亚人来说，它提醒大家，对过去提出权利主张的人有许多，而且彼此（相互竞争）。"}, {"en": "Egypt makes a different argument: that it can now care for its heritage better than anyone. The Grand Egyptian Museum beside the pyramids at Giza, two decades and more than $1bn in the making, opened in full on November 1st 2025. It displays together, for the first time, all of the 5,000-odd objects that Howard Carter helped (unearth) in Tutankhamun's tomb in 1922, from the gold mask, the (zenith) of pharaonic craftsmanship, to a gilded fan that once held (ostrich) plumes and shows the boy-king hunting the birds. Its (imposing) halls are built to (dwarf) the (alluring) but cramped displays of Western rivals. Egypt's best-known archaeologist, Zahi Hawass, has gathered more than 100,000 signatures calling on the British Museum to give back the Rosetta Stone, the slab whose parallel texts helped Jean-François Champollion (crack) the Egyptian writing system in 1822, showing how an individual (hieroglyph) could represent a sound.", "zh": "埃及提出的是另一套理由：如今它比任何国家都更有能力照顾自己的遗产。吉萨金字塔旁的大埃及博物馆历时二十多年建设，投入逾10亿美元，于2025年11月1日全面开放。它首次集中展出霍华德·卡特在1922年帮助从图坦卡蒙陵墓中（发掘）的约5,000件文物，从堪称法老工艺（巅峰）的黄金面具，到一把曾装有（鸵鸟）羽毛、描绘少年国王狩猎鸵鸟场面的镀金扇子。它那（宏伟壮观）的展厅足以使西方同行的展陈（相形见绌）；后者固然（迷人），空间却十分局促。埃及最知名的考古学家扎希·哈瓦斯征集了逾10万个签名，要求大英博物馆归还罗塞塔石碑。石碑上的平行文本帮助让-弗朗索瓦·商博良在1822年（破解）古埃及文字系统，揭示单个（象形文字字符）也可以代表一个语音。"}, {"en": "Elsewhere officials have been more (accommodating), and compromises are emerging. In 2024 the V&A and the British Museum lent 32 gold and silver objects, many of them seized from the Asante kingdom in the 1870s, back to Kumasi in Ghana for three years, renewable: a (down-to-earth) fudge that let both sides claim victory, though neither side's welcome for it was entirely (ungrudging). When Queen Camilla was crowned in 2023 she wore a crown from which the Koh-i-Noor diamond, claimed by India, Pakistan and Afghanistan, had been removed, a small, (calculating) act of tact. Courts are doing some of the work. In 2023 Dutch judges sent a hoard of Scythian gold lent by Crimean museums to Kyiv rather than to Russian-occupied Crimea, and in 2024 the European Court of Human Rights, (sparing) in its sympathy, upheld Italy's claim that the Getty Museum in Los Angeles must hand back a Greek bronze fished out of the Adriatic in 1964, probably lost from the hold of some (seafaring) Roman trader.", "zh": "其他地方的官员更加（愿意通融），因而出现了折中方案。2024年，维多利亚与阿尔伯特博物馆和大英博物馆向加纳库马西出借32件金银器物，许多是在19世纪70年代从阿散蒂王国夺走的；借期三年，可以续借。这是一种（务实的）变通办法，让双方都能宣称获胜，尽管任何一方都谈不上完全（毫无怨言地）欢迎它。卡米拉王后2023年加冕时，所戴王冠已取下印度、巴基斯坦和阿富汗都声称拥有权利的“光之山”钻石，这是一项小而（精心盘算的）外交姿态。法院也在处理部分争议。2023年，荷兰法官裁定，将克里米亚博物馆借展的一批斯基泰黄金送往基辅，而非俄方占领的克里米亚；2024年，欧洲人权法院对相关主张的同情表现得相当（克制），但仍支持意大利要求洛杉矶盖蒂博物馆归还一尊希腊青铜像。该雕像1964年从亚得里亚海打捞，可能曾从某位（航海经商的）罗马商人的船舱中遗失。"}, {"en": "Art looted by the Nazis raises subtler questions. Since 1998, when 44 countries endorsed the Washington Principles, museums have been expected to research the history of works that changed hands in Europe between 1933 and 1945 and to seek \"just and fair solutions\" with the heirs of those who lost them. The research must be (exhaustive), piecing together dealers' ledgers and auction records; it also calls for (deductive) reasoning to rule out impossible ownership histories. Yet the evidence is rarely (conclusive): a missing record is not proof of theft, and eighty years on a museum can seldom offer (disproof) of a forced sale. Courts tread warily. In 2021 America's Supreme Court, the whole (bench) agreeing, threw out a suit seeking the medieval Guelph Treasure from Germany; the (plaintiff) side, comprising heirs of Jewish art dealers, had argued that a 1935 sale to the Nazi-run Prussian state was made under duress. Scores of similar claims remain (pending). Germany has agreed to replace its toothless advisory commission with binding arbitration, a partly (retroactive) remedy for wrongs that were legal at the time.", "zh": "纳粹掠夺的艺术品带来了更微妙的问题。自1998年44国认可《华盛顿原则》以来，博物馆一直被期待追查1933年至1945年在欧洲易手的艺术品来历，并与失去财产者的继承人寻求“公正、公平的解决方案”。研究必须（详尽彻底），要拼接艺术商人的账簿和拍卖记录，还需要运用（演绎推理），排除不可能成立的所有权历史。然而证据很少能（确凿无疑）：档案缺失不能证明存在盗窃，而八十多年后，博物馆通常也难以拿出证明某项交易并非强迫出售的（反证）。法院因此十分审慎。2021年，美国最高法院全体（法官）意见一致，驳回了要求德国交还中世纪韦尔夫珍宝的诉讼；由犹太艺术商人继承人组成的（原告）一方认为，1935年向纳粹控制的普鲁士政府出售珍宝，是在胁迫下完成的。数十起类似诉讼仍在（审理中）。德国已同意以具有约束力的仲裁机制取代无实权的咨询委员会，为当时法律允许的历史不公提供一种带有部分（追溯效力）的救济。"}, {"en": "Defenders of the \"universal museum\" argue that collections like the British Museum's let visitors see the world's cultures side by side, free of charge, and keep objects safe from war and neglect. Critics hear in that argument the echo of empire: institutions that helped (colonize) half the globe now claim a (prerogative) to keep its treasures. For some museums, returning a few objects has become a (salve) for uneasy consciences, a (palliative) rather than a cure; for activists, nothing short of wholesale restitution will (cauterize) the wound. Each side considers its position a moral (imperative), and each is quick to (preach). \"Decolonization\" has become a (shibboleth) that separates younger curators from older ones; \"universal\" is a (pejorative) in some seminar rooms and a battle cry in others. What is often missing is any (introspective) sense that the other camp's (perspective) might contain some truth.", "zh": "“普世博物馆”的捍卫者认为，大英博物馆之类的收藏让游客免费并排欣赏世界各地文化，也能保护文物免于战火和疏于照管之害。批评者却从中听见帝国的回声：曾经协助（殖民统治）半个地球的机构，如今声称自己享有保留其珍宝的（特权）。对某些博物馆来说，归还少数物品成了抚慰不安良心的（慰藉），只是（缓解症状的办法），而非根治；对活动人士来说，只有全面归还才能（烧灼封合）这道伤口。双方都把自己的立场视为道德（必然要求），也都急于（说教）。“去殖民化”成了区分年轻与年长策展人的（身份暗语）；“普世”一词在一些研讨室里变成了（贬义词），在另一些场合却成了战斗口号。经常缺失的，是一种（自省的）意识：对立阵营的（观点）也可能包含部分真理。"}, {"en": "The same anxieties are reshaping how museums tell the stories of what they already hold. In November 2022 the Wellcome Collection in London closed \"Medicine Man\", a permanent display of the hoard amassed by Henry Wellcome, a pharmaceutical tycoon, saying that it perpetuated a version of medical history based on \"racist, sexist and ableist theories\". Wellcome made his fortune selling compressed pills under the \"Tabloid\" trademark, a name later borrowed by Fleet Street; his firm's medicine chests went to the poles with Scott and Shackleton, stocked with everything from a (sedative) to a (purgative) and a (laxative). His collection of more than a million objects, from amputation saws to (quack) remedies and (outlandish) charms, was always more (acquisitive) than (discerning), but it was also (gripping) and (evocative). Critics called the closure (condescending), as if visitors could not be trusted to think for themselves.", "zh": "同样的焦虑正在改变博物馆讲述既有藏品的方式。2022年11月，伦敦惠康收藏馆关闭了常设展览“医药人”，其中陈列着制药业巨头亨利·惠康积攒的大批物品。馆方认为，该展览延续了建立在“种族主义、性别歧视及能力歧视理论”基础上的医学史叙事。惠康靠销售“Tabloid”商标下的压制药片发家，后来伦敦报业街还借用了这个名称；他的公司随斯科特和沙克尔顿的极地探险供应药箱，里面从（镇静剂）到（泻下剂）和（通便药），一应俱全。惠康收藏的物品超过百万件，从截肢手锯到（江湖庸医的）偏方以及（离奇古怪的）护符都有。整套收藏一向更偏向（贪多搜集），而非（精挑细选），但也确实（引人入胜），能够（唤起鲜明联想）。批评者认为关闭展览的做法（居高临下），仿佛游客没有能力独立思考。"}, {"en": "The British Museum itself was founded in 1753 on the collection of Sir Hans Sloane, a physician and (polymath) whose fortune owed much to slave plantations in Jamaica; in 2020 his bust was moved into a case that explains as much. Oxford's Pitt Rivers Museum, a gloriously cluttered (potpourri) that runs from a towering Haida totem pole to drawers of amulets, took its shrunken heads off display the same year. Curators insist that they want to (attach) context to objects, not (detach) them from history, and that no museum (narrative) is ever wholly (objective). Critics reply that the new labels are every bit as (subjective) as the old ones, and suspect that curators would rather (eulogize) the present than explain the past. The rows are (indicative) of a profession unsure of its purpose.", "zh": "大英博物馆本身于1753年建立，基础是医生兼（博学通才）汉斯·斯隆爵士的收藏；他的财富很大一部分来自牙买加的奴隶种植园。2020年，他的半身像被移进一个展柜，展柜说明了这一历史。牛津皮特·里弗斯博物馆则以琳琅满目的（大杂烩）著称，从高大的海达人图腾柱到成抽屉的护身符无所不有；同年它撤下了缩小的人头标本。策展人坚持说，他们想为物品（附加）历史背景，而不是把它们与历史（剥离），并认为任何博物馆（叙事）都不可能完全（客观）。批评者反驳说，新说明牌与旧说明牌一样（主观），还怀疑策展人宁愿（歌颂）当下，也不肯解释过去。这些争吵（表明），整个行业尚不确定自身的使命。"}, {"en": "In Canada the Royal BC Museum in Victoria closed its old galleries, among them a beloved recreation of a frontier town, in 2021-22 in the name of reconciliation with First Nations, then watched the province's government announce, and within weeks abandon, a C$789m plan to rebuild the museum amid public fury. British Columbia was built by the (lumberjack) and the salmon canner, and by gold miners who would (trek) into the Cariboo with a (pack) on their backs, pan every (creek) and (gulch) and winter in a tar-paper (shack). Many residents felt that their own history was being swept away like (chaff). The province's premier admitted that he had made a mistake. It was an (instructive) episode: museums that (antagonize) their own public may struggle to keep its support.", "zh": "在加拿大，不列颠哥伦比亚省皇家博物馆于2021至2022年间，以同原住民族和解为名关闭了旧展厅，其中包括一处深受喜爱的边疆小镇复原场景。随后，省政府提出耗资7.89亿加元重建博物馆的计划，却在公众愤怒声中几周后便将其撤销。不列颠哥伦比亚的发展离不开（伐木工）、鲑鱼罐头工，以及（长途跋涉）进入卡里布地区、背着（行囊）的淘金者；他们淘遍每条（小溪）和（冲沟），冬季栖身于铺着沥青纸的（简陋棚屋）。许多居民觉得，自己的历史正像（谷壳碎屑）一样被扫走。省长承认自己犯了错。这是一次（富有教益的）事件：博物馆若（激怒）自己的公众，就可能难以继续获得支持。"}, {"en": "In America the fights are louder. The National Memorial for Peace and Justice in Montgomery, Alabama, opened in 2018 by a legal charity, names more than 4,400 black Americans whom white mobs chose to (lynch) between 1877 and 1950, often with the connivance of the local (sheriff); its hanging steel columns, one for each county, serve as a collective (epitaph) in a (meditative) space that visitors tend to leave in silence. In Washington the Smithsonian's National Museum of African American History and Culture displays the casket of Emmett Till, a 14-year-old murdered in Mississippi in 1955, among the most (harrowing) objects in any museum anywhere. In 2025 the White House ordered a review of exhibits at Smithsonian museums ahead of the country's 250th birthday, complaining of \"woke ideology\" and of displays that dwell on how bad slavery was. Supporters of the review say taxpayers should not fund (vituperative) attacks on their own country; opponents (inveigh) against what they see as an attempt to (bowdlerize) history. Both camps (sermonize); neither seems likely to (proselytize) successfully beyond its own camp.", "zh": "在美国，争执更加激烈。阿拉巴马州蒙哥马利市的国家和平与正义纪念馆，由一家法律公益机构于2018年创办，记录了1877年至1950年间被白人暴民（私刑处死）的4,400多名非裔美国人；这些暴行往往有地方（治安官）默许。纪念馆的悬挂式钢柱按县排列，仿佛是一篇写给所有受害者的集体（墓志铭）；在这一（适合沉思的）空间中，参观者离开时通常沉默无言。华盛顿史密森学会的非裔美国人历史与文化国家博物馆展出了埃米特·蒂尔的棺材；这名14岁少年于1955年在密西西比州遇害。它是世界任何博物馆中最（令人痛心震撼）的展品之一。2025年，美国白宫在建国250周年到来前下令审查史密森学会各馆的展览，抱怨其中存在“觉醒意识形态”，以及过度强调奴隶制的罪恶。支持审查的人说，纳税人不该出资支持对自己国家的（恶毒谩骂）；反对者则（强烈斥责）这一举措，认为它试图（删改净化）历史。双方都在（训诫说教），却似乎都难以成功向本阵营以外的人（传教劝服）。"}, {"en": "Britain has tried a quieter formula. Its government told heritage bodies in 2021 to \"retain and explain\" contested statues rather than remove them. When (restive) protesters in Bristol toppled a statue of Edward Colston, a slave-trader, in 2020 and rolled it into the harbor, the city fished it out and laid it on its back, graffiti and all, in a local museum, where the result is both (unsettling) and (compelling). Museums, it turns out, are good at turning raw anger into something people can contemplate, and the most (responsive) ones invite visitors to have their say. They are less good at avoiding the charge that they (polarize) debate or (stigmatize) people with unfashionable views, and the most (demonstrative) gestures of contrition often satisfy nobody.", "zh": "英国采取了较温和的方式。政府2021年要求文化遗产机构对有争议的雕像“保留并解释”，而不是直接拆除。2020年，布里斯托尔（躁动不安的）示威者推倒奴隶贩子爱德华·科尔斯顿的雕像，并把它滚入港湾。市政府后来将雕像打捞起来，连同涂鸦一起平放在当地博物馆，使其呈现出既（令人不安）又（引人深思）的效果。事实证明，博物馆善于将原始的愤怒转化为可供公众思考的对象；最（善于回应公众的）机构还会邀请游客表达看法。它们较难摆脱的指责是，自己可能令争论（两极分化），或（污名化）持有不合时宜观点的人；而最（高调张扬的）悔过姿态往往谁也无法取悦。"}, {"en": "Much of the battle is fought in the captions. \"Object\" is a (homograph) with two pronunciations: a noun for curators, a verb for everyone else. Labels that were once handwritten in faded (cursive), or read like a (windbag)'s lecture, now strain to be (inclusive), and critics find the new tone as (mawkish) as the old one was pompous. The best curators keep it short, (waggish) without being flippant and (puckish) without being trivial, and resist the (discursive), (excursive) essay that nobody reads standing up. A (limerick) makes the point: \"A curator once captioned a vase / With a carefully neutral phrase; / It offended no one, / Which was nicely done, / But it told you no more than the glaze.\"", "zh": "相当一部分争论发生在展品说明牌上。英文的“object”是一个有两种发音的（同形异音词）：对策展人而言是名词“物品”，对其他人而言却可能是动词“反对”。过去的说明文字要么用褪色的（连笔草书）写成，要么像（夸夸其谈者）的演讲；如今它们又努力显得（包容），而批评者觉得新腔调和旧腔调的浮夸一样（矫情煽情）。最好的策展人会保持简短，做到（诙谐风趣）而不轻浮、（机灵调皮）而不琐碎，并抵制那些（漫谈式）、（旁逸斜出）的长篇大论，因为没人愿意站着读完。下面这首（五行打油诗）说得很明白：“有位馆员给花瓶写说明，／措辞中立得字字小心；／谁也没被冒犯，／这当然值得称赞，／可釉彩之外仍一无所知。”"}, {"en": "Prudery is another hazard. In 2021, tired of having images of nudes by Egon Schiele and Peter Paul Rubens taken down by social-media platforms, Vienna's tourist board opened an account on OnlyFans, a site better known for pornography, to show off its museums' (ravishing) collection of bare flesh. It was a (gimmick), but it made a serious point: the (prudish) algorithms that police the internet treat a Rubens as dangerously (suggestive) while letting scenes of slaughter pass as (nonthreatening). The art world, once the most (permissive) of places, now finds itself policed by software.", "zh": "假道学也是一种风险。2021年，维也纳旅游局受够了社交媒体平台不断下架埃贡·席勒和彼得·保罗·鲁本斯裸体画作的图片，于是在更以色情内容闻名的网站OnlyFans上开设账号，展示当地博物馆（令人倾倒的）裸体艺术收藏。这是一个（宣传噱头），却提出了严肃的问题：监管互联网的（拘谨守旧的）算法，把鲁本斯的画当成危险的（性暗示内容），却允许屠杀场景以（没有威胁的）内容身份通过。曾经最为（开放宽容）的艺术世界，如今竟然受到软件的管束。"}, {"en": "Then there are the protesters. In October 2022 two Just Stop Oil activists threw tomato soup over Van Gogh's \"Sunflowers\" at London's National Gallery and glued themselves to the wall beneath it; the picture, behind glass, was unharmed. That same month German activists hurled mashed potatoes at a Monet in Potsdam. Earlier that year a man disguised as an elderly woman in a wheelchair had smeared cake on the bulletproof glass protecting the \"Mona Lisa\", leaving a smear of white (icing) across her smile; in 2024 two women threw soup at her too. Almost any (foodstuff), it seems, will do, so long as there is a camera and a tube of (adhesive) nearby. Many visitors found the stunts (offensive); the activists retorted that the real outrage was the climate crisis.", "zh": "还有抗议者。2022年10月，两名“停止石油”组织的活动人士在伦敦国家美术馆把番茄汤泼向梵高的《向日葵》，又把自己粘在下方墙壁上；画作有玻璃保护，没有受损。同月，德国活动人士在波茨坦向一幅莫奈作品扔土豆泥。那年早些时候，一名男子假扮坐轮椅的老妇人，把蛋糕抹在保护《蒙娜丽莎》的防弹玻璃上，在她的微笑前留下一道白色（糖霜）；2024年，另有两名女子也向这幅画泼汤。看来几乎任何（食物）都能充当抗议工具，只要旁边有摄像机和一管（黏合剂）。许多游客觉得这些行动（令人反感）；活动人士则回敬说，真正令人愤怒的是气候危机。"}, {"en": "The tactic was (disruptive) by design and, many argued, (counterproductive) in effect: polls suggested it irritated far more people than it won over, and critics called it (manipulative). In 2024 a British judge handed the soup-throwers (stiff) sentences of two years and 20 months; supporters of the verdict said the law must (penalize) such stunts, while the activists said they had helped (publicize) the climate crisis and (galvanize) the young. Museums, caught in the middle, now ban bags, put more paintings behind glass and pay more for insurance, costs they can ill afford.", "zh": "这种策略本就有意制造（干扰），但许多人认为实际效果（适得其反）：民调显示，它激怒的人远比争取到的支持者多，批评者还认为它（操纵情绪）。2024年，一名英国法官分别判处两名泼汤者两年和20个月的（严厉）刑期；支持判决者说，法律必须（惩罚）此类行为，活动人士则表示，他们成功（宣传）了气候危机，并（激励动员）了年轻人。夹在中间的博物馆如今禁止携带某些包袋、给更多画作装上玻璃，并支付更高的保险费，而这些成本已令它们难以承受。"}, {"en": "Money is the other battleground. For decades museums happily put donors' names on wings and galleries. Then the Sacklers, whose family firm, Purdue Pharma, made OxyContin, an opioid painkiller blamed for fueling America's overdose crisis, became a (pariah) dynasty: protests led by Nan Goldin, a photographer, persuaded the Louvre, the Metropolitan Museum and others to take the name down. After Russia invaded Ukraine in 2022 galleries quietly dropped donors close to the Kremlin; few now want to be seen accepting an (oligarch)'s cash. Yet museums are rarely (flush) with funds, so in 2023 the British Museum signed a £50m, ten-year deal with BP to help pay for its rebuilding, and braced for activists who see an oil (rig) behind every new gallery. The (literati) who once mingled with wealthy patrons at (plush) fundraising dinners and offered (lavish) praise are now likelier to (scrutinize) where the money comes from.", "zh": "资金是另一处战场。几十年来，博物馆乐于把捐赠者姓名写在展翼和展厅上。后来，萨克勒家族成了一个被社会（唾弃）的家族：他们的家族企业普渡制药生产奥施康定，这种阿片类止痛药被指助长了美国的药物过量死亡危机。在摄影师南·戈尔丁领导的抗议推动下，卢浮宫、大都会艺术博物馆等机构撤下了萨克勒的名字。俄罗斯2022年入侵乌克兰后，各美术馆悄悄与亲克里姆林宫的捐赠者切割；现在很少有人愿意被看见接受（寡头富豪）的金钱。但博物馆本来就不太（资金充裕），所以大英博物馆2023年与英国石油公司签署十年5,000万英镑的协议，以资助重建，同时准备迎接那些觉得每间新展厅背后都有一座石油（钻井平台）的活动人士。过去与富有资助人来往的（文人知识界人士），曾在（豪华舒适的）筹款晚宴上献上（溢美）之词，如今更可能（仔细审查）这些钱的来源。"}, {"en": "Governments, too, see museums as engines of growth. Ever since Frank Gehry's Guggenheim helped (revitalize) Bilbao in 1997, mayors and emirs alike have commissioned glittering branches and new wings in the hope of doing the same; some are (speculative) bets on tourism, others merely (aggrandize) the politicians who cut the ribbons. The Louvre Abu Dhabi, which opened in 2017 under a deal worth around €1bn to France, including some €400m for the use of the name, is a project whose admirers are (vaunting) its value as an emblem of Gulf soft power; critics see in such projects an (overweening) faith that culture can be bought by the yard. Cities rush to (capitalize) on a famous brand and (maximize) visitor numbers. The cost of a new building can be spread over decades, but there is no way to (amortize) a reputation once it is lost. Nothing would (epitomize) the age better than a gleaming new museum with nothing in it to (brag) about.", "zh": "政府同样把博物馆视为经济增长引擎。自从弗兰克·盖里设计的古根海姆博物馆于1997年帮助（重振）毕尔巴鄂以来，从市长到海湾国家的酋长，都希望通过兴建闪耀夺目的分馆和新展翼复制这一成功。有些项目是押注旅游业的（投机性）投资，有些只是为了（抬高）出席剪彩政客的地位。阿布扎比卢浮宫2017年开馆，所依据的协议令法国获得约10亿欧元，其中约4亿欧元用于品牌名称授权。赞赏该项目的人不断（夸耀）它作为海湾软实力象征的价值；批评者则从这类工程中看到了以为文化可以按米购买的（傲慢过度的）信念。城市争相（利用）知名品牌，并（最大化）访客数量。新建筑的成本可以分摊到几十年，但一旦声誉丧失，就没有办法把它（分期摊销）掉。没有什么比这样一座光鲜的新博物馆更能（集中体现）这个时代：馆里却没什么值得（夸口）的东西。"}, {"en": "Commerce fills the gap. A modern museum is as much a shopping center as a temple: the gift shop sells a silk (scarf) printed with Monet's water lilies, the café a (cloying) slice of cake, and the restaurant upstairs may employ a (chef) with a Michelin star, as the Rijksmuseum's does. Visitors who joke that they will (famish) after three hours in the galleries can (gormandize) at lunch, (quench) their thirst with craft beer or, at evening galas, (quaff) champagne beneath the old masters. The menus borrow the language of the galleries: a (sprig) of thyme here, a (garnish) of edible flowers there, a dish of heritage (maize) described as an \"homage\" to a Mexican still life, its (seasoning) and (flavoring) chosen as much to look (appetizing) on Instagram as to (nourish).", "zh": "商业活动填补了资金缺口。现代博物馆既是殿堂，也是一座购物中心：礼品店出售印着莫奈睡莲图案的丝绸（围巾），咖啡馆提供一块甜得（腻人）的蛋糕，楼上餐厅甚至可能聘请拥有米其林星级的（主厨），正如荷兰国立博物馆的餐厅所做的那样。参观者逛了三个小时展厅之后，可能开玩笑说再不吃东西就要（饿死），随后可以在午餐时（大快朵颐），以精酿啤酒（解渴），或者在晚间晚宴上于名画之下（畅饮）香槟。菜单还借用了展厅的语言：这里是一（小枝）百里香，那里是可食用花朵作（点缀），一道传统品种的（玉米）菜肴被形容为“致敬”墨西哥静物画，其（调味料）和（调味方式）的选择，不仅为了（让人垂涎欲滴）地呈现在Instagram上，也为了真正（滋养）食客。"}, {"en": "Admission charges are a more delicate matter. Britain's national museums have been free since 2001, a policy introduced by a Labour government that no (conservative) successor has dared reverse. Elsewhere prices are rising. A couple from outside Europe now pays €64 to see the \"Mona Lisa\", hardly a (prohibitive) sum for tourists who have flown to Paris, and not enough to (impoverish) anyone, but enough to make culture feel (exclusive). Charging foreigners more is (remunerative) and politically easy, since they do not vote; but it gives museums an (incentive) to treat visitors as customers rather than citizens, a shift with (far-reaching) consequences.", "zh": "门票问题更为微妙。英国国家级博物馆自2001年起免费开放，这项政策由工党政府推出，此后没有哪届（保守党）政府敢于推翻。其他地方的票价却在上涨。一对来自欧洲以外的游客如今参观《蒙娜丽莎》要付64欧元；对已经飞到巴黎的旅客来说，这很难说是一笔（高得令人却步的）费用，也不至于让谁（陷入贫困），但足以让文化显得（仅供少数人享有）。向外国游客收更高的门票（有利可图），政治上也容易，因为他们没有当地选票；但这会给博物馆一种（诱因），让它们把来访者当客户而不是公民，带来（影响深远的）后果。"}, {"en": "Behind the scenes, the people who keep museums running are stretched. Curators with doctorates earn a fraction of what the bankers on their boards take home, and rich institutions (poach) the best of them from poorer ones. Guards, whose chief duties once were to stop schoolboys touching the exhibits and to slip outside for a quick (fag), as a cigarette is called in British slang, now face (grueling) shifts managing crowds, and some wear a (hangdog) look by mid-afternoon. Cuts (demoralize) staff, and smaller museums increasingly (deputize) volunteers to do skilled, (exacting) work. The (unstinting) devotion and (unfailing) courtesy of their employees, many of them too (meek) to complain about their pay, are the sector's great hidden subsidy; even the (boring) jobs, from checking humidity readings to counting visitors, are done with care.", "zh": "在幕后，维持博物馆运转的人们已经不堪重负。拥有博士学位的策展人收入远不及坐在董事会里的银行家，富裕机构还会从穷机构（挖走）最优秀的人才。过去，警卫的主要任务不过是阻止学生摸展品，以及溜到室外抽根（香烟）——英国俚语把香烟叫作fag。如今他们却要轮班管理人潮，工作（繁重而折磨人），到下午中段，一些人脸上已经露出（垂头丧气的）神情。经费削减令员工（士气低落），小型博物馆也越来越多地（委托）志愿者承担专业而（要求严苛的）工作。员工们（毫无保留的）奉献与（始终如一的）礼貌，是整个行业巨大的隐形补贴；他们中许多人过于（温顺）而不愿抱怨工资，即使是检查湿度读数、统计人流之类（枯燥乏味的）工作，也都认真完成。"}, {"en": "The crowds themselves are changing what museums are for. In the Salle des États the average visitor spends well under a minute in front of the \"Mona Lisa\", mostly photographing her over a sea of heads after a (squeeze) through doorways where the air can (reek) of sunscreen; tour groups follow a guide's raised umbrella like a (gosling) trailing its mother. Studies of museum-goers find that most glance at a painting for less than half a minute. Such (fleeting) encounters leave a (smattering) of impressions, (flagging) concentration, aching feet and a great deal of (ennui): \"museum fatigue\" was diagnosed by Benjamin Ives Gilman, an American museum official, in 1916. A lucky few still feel the (overpowering) rush that Stendhal described in Florence in 1817, a (longing) satisfied at last; others leave (agog) at the queues rather than the art, with a (hankering) for the quieter, more (enthralling) experience that the modern blockbuster rarely provides.", "zh": "人潮本身正在改变博物馆的意义。在国家厅，普通游客在《蒙娜丽莎》前停留远不足一分钟。他们从门洞中（挤过）人群，空气中可能（充斥）防晒霜的气味，随后越过一片人头拍摄照片；旅行团紧跟着导游高举的雨伞，像（小鹅）跟随母鹅一样。游客行为研究发现，大多数人看一幅画的时间不到半分钟。这样（转瞬即逝）的接触，只留下（零星少许）的印象、不断（衰退）的注意力、酸痛的双脚和无尽的（倦怠无聊）：美国博物馆工作人员本杰明·艾夫斯·吉尔曼早在1916年就指出了“博物馆疲劳”。少数幸运的人依然能体验司汤达1817年在佛罗伦萨描述过的那种（强烈得难以抵挡的）震撼，仿佛长久的（渴望）终于得到满足；但其他人离开时，对长队而非艺术感到（目瞪口呆），并（渴求）一种更宁静、更（引人入胜）的观展体验，而现代大型热门展览很少能够提供这种感受。"}, {"en": "Museums have responded with timed tickets, late openings and (festive) evenings, some of them (rollicking) affairs with DJs and rum (punch) that run on into the (gloaming) and draw a younger crowd. A well-designed gallery can still (ambush) even (gangling) teenagers who slouch in with (loutish) indifference. Small children, (coltish), (skittish) and occasionally (brattish), make better museum-goers than their parents: they are (inquisitive) and still ask questions.", "zh": "博物馆以预约分时门票、延长开放时间和（节日般热闹的）夜间活动应对。有些夜场是（喧腾欢乐的）派对，配有DJ和朗姆酒（潘趣酒），一直持续到（暮色降临），吸引更年轻的人群。设计精良的展厅仍可能（出其不意地打动）那些身材（瘦高笨拙）、带着（粗野无礼的）冷漠神情晃进来的青少年。小孩子往往比父母更适合逛博物馆：他们像小马一样（活蹦乱跳），有时（容易受惊），偶尔（任性淘气），却十分（好奇好问），仍愿意不停提问题。"}, {"en": "The most (engaging) guides (extemporize), settling a (sibling) squabble about mummies with a story while (doting) grandparents look on. Done well, a visit can be (bracing), (invigorating) and (enlightening), and at a comedy night in a natural-history museum even (sidesplitting); (jesting) in the galleries no longer counts as sacrilege. It satisfies a (craving) that no screen quite can, and a great painting can be as (entrancing) for a five-year-old as for a scholar.", "zh": "最（善于吸引观众的）讲解员会（即兴发挥），在（兄弟姐妹）为木乃伊争论时，用一个故事化解争执，旁边则有（宠爱孩子的）祖父母微笑注视。组织得当的参观既能（振奋精神）、（注入活力），又能（启迪心智）；若赶上自然历史博物馆的喜剧之夜，甚至能（令人捧腹大笑）；在展厅里（开玩笑）早已不再算亵渎艺术。这样的体验满足了一种屏幕无法完全填补的（渴望）；一幅伟大的画作对五岁孩童和学者来说，都可能同样（令人着迷）。"}, {"en": "Technology promises relief and brings new risks. In October 2023 a ransomware gang called Rhysida broke into the British Library's computer systems and, when the library refused to pay a ransom, leaked staff and user data online; the (hack) was enough to (paralyze) its online services for months and showed how (sensitive) and (interlocking) modern collection systems have become. Collections now live in a (mesh) of databases, and the more museums (enmesh) themselves with outside suppliers, the more they rely on systems whose memory is less (retentive) than it looks. Other technologies are more benign. Digitizing objects by the (batch) lets scholars examine a (holograph) manuscript by Jane Austen from the other side of the world, and 3D (rendering) lets visitors walk through rooms that no longer exist. Online audiences proved more (receptive) than many curators expected and enjoyed an (upswing) during the pandemic lockdowns. The (breadth) of what museums now (utilize) online would (bespeak) a revolution, were it not for the money: the revenue that digital projects were supposed to bring in has largely failed to (materialize), and some (innovative) experiments, such as virtual-reality headsets, already feel like a (throwback) to the 2010s.", "zh": "科技有望减轻负担，却也带来新风险。2023年10月，名为Rhysida的勒索软件团伙入侵英国图书馆计算机系统，在图书馆拒绝支付赎金后，把员工和读者资料泄露到网上。这次（黑客入侵）使在线服务（瘫痪）数月，表明现代藏品管理系统何等（敏感脆弱），又何等（相互交织）。藏品信息如今存在于由许多数据库织成的（网络）之中；博物馆越是与外部供应商（紧密纠缠），就越依赖那些实际记忆能力不如看上去那样（持久可靠）的系统。其他技术则较为有益。（成批）数字化物品，让地球另一端的学者也能研究简·奥斯汀的（亲笔）手稿；三维（渲染）则让观众走进早已不存在的房间。在线观众比许多策展人预计的更（乐于接受），在疫情封锁期间，访问量还出现了（增长）。如今博物馆线上资源的（广度）之大、所（运用）的工具之多，本应（表明）一场革命已经到来；可惜钱的问题挥之不去：数字项目原本预期创造的收入大多未能（真正实现），一些曾经（富有创新性）的实验，如虚拟现实头显，如今甚至像是（旧时代的遗物），让人想起2010年代。"}, {"en": "Artificial intelligence is being put to work, too. Algorithms can (tag) millions of photographs of objects, (track) items as they move between storerooms, (log) the condition of each one and (flag) anomalies, chores that once took decades. They can (characterize) a painting as (figurative) or abstract in an instant; with (intuitive) interfaces, such systems can also help researchers spot the kind of (distinctive) brushstroke that an (instinctive) connoisseur would recognize. But generative models tend to (generalize) where scholars (particularize); their wall texts are (derivative) and (imitative), and critics fear they will simply (plagiarize) the work of experts. An AI that can (schematize) a collection with (disjunctive) rules—classifying an object as either ritual or decorative, for instance—has no (inkling) of the oddities that make it worth visiting, and scholars who (nitpick) its output find plenty to complain about, from (niggling) misattributions to outright howlers. No machine can give a (definitive) answer to the question of what an object means.", "zh": "人工智能也开始派上用场。算法可以给数百万张藏品照片（加标签），（追踪）物品在库房之间的移动，（记录）每件物品的状况，并（标记）异常情况；这些事务过去需要几十年才能完成。它们可以立即把一幅画（归类描述）为（具象的）或抽象的；借助（直观易用的）界面，这些系统也能帮助研究者察觉那种（独特鲜明的）笔触——有（本能眼力的）鉴赏家往往也会认出它。但生成式模型倾向于（概括泛化），而学者则重视（具体细分）；它们生成的展墙文字往往（缺乏原创性）、（模仿痕迹浓重），批评者担忧它们干脆会（剽窃）专家的劳动成果。人工智能可以（图式化整理）整个收藏，运用（非此即彼的）规则把物品划分到“仪式用”或“装饰用”等类别，却对那些使文物值得一看的奇特之处没有（丝毫概念）；喜欢对输出（吹毛求疵）的学者总能找到问题，小到（细微却恼人的）作者归属错误，大到荒唐透顶的错话。没有一台机器能对一件文物究竟意味着什么给出（确定无疑的）答案。"}, {"en": "Keeping things from falling apart is the oldest museum job, and it is getting more scientific. In 1628 the Vasa, a Swedish warship, managed to (capsize) less than a mile into her maiden voyage; her hull lacked the (girth) to carry the weight of guns that her (headstrong) king had wanted. Raised in 1961, the oak hull, its seams still sealed with (caulk), was sprayed with polyethylene glycol for 17 years; she is now the most-visited museum in Scandinavia. But sulfur compounds in her timbers are slowly turning to acid, and the process is not (relenting). Nothing made of wood is (everlasting); the most curators can do is (prolong) its life and (conserve) what remains.", "zh": "防止文物散架是博物馆最古老的工作之一，而这项工作正变得更科学。1628年，瑞典战舰“瓦萨号”首航还不到一英里就（倾覆）了：船体的（宽度）不足以承受其（刚愎自用的）国王执意要求装载的大炮重量。1961年，橡木船体被打捞出水，接缝仍用（填缝密封材料）封着，此后又连续17年喷洒聚乙二醇；如今它成了斯堪的纳维亚参观人数最多的博物馆展品。但木材中的含硫化合物正在缓慢变成酸，这一过程并未（减缓）。木制品没有什么是（永恒不朽的）；策展人最多只能（延长）它的寿命，并（保护保存）剩余部分。"}, {"en": "Objects pulled from the sea must be treated for years to (desalinize) them. Iron cannonballs from the Mary Rose, Henry VIII's flagship, which sank in 1545 and was raised in 1982, were soaked in baths of (alkali) solution to draw out the (corrosive) chlorides that would otherwise make them (oxidize) from within, and a waterlogged leather (sheath) may need a (preservative) to stop it shrinking as it dries. Silver is more delicate. A tankard made by Paul Revere, Boston's patriot (silversmith), tarnishes in polluted air but cannot be scrubbed with an (abrasive) polish without losing its surface. Restorers who (furbish) metal, (refurbish) frames or (retouch) losses in a painting work to strict rules: anything they add must be reversible, and no (additive) may alter the original. Acid-free tissue and foam (padding) in the storerooms help to (stanch) the slow loss of fragile material.", "zh": "从海里捞出的文物必须经过多年处理才能（脱盐）。亨利八世旗舰“玛丽玫瑰号”于1545年沉没、1982年打捞出水，它的铁制炮弹曾浸泡在（碱性）溶液里，以去除（腐蚀性）氯化物，否则这些盐会使炮弹从内部（氧化）；一只浸透海水的皮革（护套）在干燥时，也可能需要（防腐保存剂）来避免收缩。银器更加脆弱。波士顿爱国者兼（银器匠）保罗·里维尔制作的一只大酒杯，会在受污染空气中失去光泽，但若用（研磨性的）抛光剂擦洗，就可能磨掉表面。修复师无论是（擦亮整修）金属、（翻新）画框，还是对画作缺失处（局部补绘），都必须遵守严格规定：任何添加材料都应可以去除，任何（添加剂）都不能改变原物。库房里的无酸薄纸和泡沫（衬垫）有助于（遏止）脆弱材料持续流失。"}, {"en": "Even breath can be destructive. Lascaux, the cave in south-western France whose paintings of horses, bulls and a leaping (buck) date from an (epoch) some 17,000 years ago, was closed to the public in 1963 after visitors' breath and lights encouraged algae; since 2001 outbreaks of (fungi) have repeatedly forced conservators to (sterilize) its walls, an unwelcome (outgrowth) of earlier interventions. Tourists now visit a full-scale copy. In Western Australia, Murujuga, where more than a million engravings make up one of the largest collections of rock art on Earth, was declared a World Heritage site in 2025 even as nearby gas plants were cleared to keep running; scientists argue over whether industrial emissions, which some fear will (encroach) further, are eating into each (petroglyph). A (dearth) of independent monitoring has not helped, and nor has the soot and (filth) that settles on ancient surfaces everywhere.", "zh": "连人的呼吸都可能造成破坏。法国西南部的拉斯科洞穴里，绘有马、牛和一头跃起的（雄鹿），壁画可追溯至约一万七千年前的（史前时代）。游客呼出的气体和照明设备促使藻类滋生，因此洞穴于1963年停止向公众开放；自2001年以来，反复爆发的（真菌）问题又迫使保护人员对洞壁进行（杀菌处理），这成了早期干预措施令人不快的（衍生后果）。如今游客参观的是一座等比例复制洞穴。西澳大利亚的穆鲁朱加拥有逾百万处岩画，是地球上规模最大的岩石艺术收藏之一。它在2025年被列为世界遗产，但附近天然气设施同时获准继续运行；科学家正争论工业排放是否会进一步（侵入）遗址并侵蚀每一处（岩刻）。独立监测的（严重不足）无助于解决争论，而沉积在各地古老表面上的烟灰与（污垢）也雪上加霜。"}, {"en": "Light is a slower enemy. Textiles and watercolors are kept in near-darkness, with blinds drawn, an (awning) over the odd skylight and every (sash) window shuttered, because the sun would (bleach) them within months. Science is also letting museums extract astonishing stories from (unassuming) remains. Stable, (nonradioactive) isotopes of oxygen and strontium in tooth enamel record where a person grew up; analysis of the Amesbury Archer, buried near Stonehenge around 2300BC, showed that he had spent his childhood in the Alps. Lindow Man, a body pulled from a Cheshire peat (bog) in 1984 and now in the British Museum, has proved (revealing) about his last meal and the violent manner of his death; the acidic waters of a (marsh) can preserve skin and hair for millennia. The (pith) of the matter is that old objects still have new things to say.", "zh": "光照是一种更缓慢的敌人。纺织品和水彩画通常保存在近乎黑暗的环境中：百叶窗被拉上，零星天窗加装（遮阳篷），所有（上下推拉式）窗户都关紧遮光，因为阳光可能在几个月内使它们（褪色）。科学还帮助博物馆从那些（貌不惊人的）遗存中读出惊人的故事。牙釉质中氧和锶的稳定、（非放射性）同位素，记录了一个人的童年成长地。对约公元前2300年葬于巨石阵附近的“埃姆斯伯里弓箭手”的分析显示，他童年生活在阿尔卑斯山地区。1984年，一具人体遗骸从柴郡的一片泥炭（沼泽地）中被发现，如今陈列于大英博物馆，被称为“林多男子”。研究结果对他最后一餐以及暴力死亡的经过都颇具（揭示作用）；（湿地沼泽）的酸性水质可以保存皮肤和头发达数千年。问题的（核心）在于，古老文物仍有新的故事可讲。"}, {"en": "Fakes are another hazard. Wolfgang Beltracchi, a German forger with a (streak) of genius, painted \"lost\" works by Max Ernst and others that fooled experts and fetched millions before he landed in the (dock) in 2011. In New York the venerable Knoedler gallery closed the same year amid a scandal over fake Rothkos and Pollocks that helped (bilk) collectors of some $80m. Museums are not immune. In 2020 the Museum of the Bible in Washington admitted that all 16 of its supposed Dead Sea Scroll fragments were forgeries, a modern (goldbrick) sold to (unwitting) buyers. Attribution remains a (riveting) game: the \"Salvator Mundi\", a (putative) Leonardo that sold for $450m in 2017, has not been seen in public since, and the secretive world of art (dealing) breeds rumors in which conspiracy theorists see the hand of everyone from Gulf princes to the (illuminati). A (freak) discovery in an attic can still make a fortune; more often it makes a lawsuit.", "zh": "赝品是另一种危险。德国伪造者沃尔夫冈·贝尔特拉奇带着（几分）天才气质，他画出所谓马克斯·恩斯特等大师“失传”的作品，骗过专家，卖出数百万美元，直到2011年站上法庭（被告席）。纽约历史悠久的诺德勒画廊也在同一年关闭，此前它卷入了假冒罗斯科和波洛克作品的丑闻，收藏家因此被（诈骗）约8,000万美元。博物馆也无法幸免。2020年，华盛顿的圣经博物馆承认，馆内16块所谓死海古卷残片全是伪造品，是卖给买家的现代（冒牌货），而买家对此（毫不知情）。艺术品归属鉴定仍是一场（扣人心弦的）博弈：《救世主》在2017年以4.5亿美元成交，是一件（据称出自）达·芬奇之手的作品，此后便再未公开展出。艺术品（交易）世界的神秘性滋生各种传闻；在阴谋论者眼中，从海湾王子到（光照派），似乎人人都在幕后操纵。阁楼里一次（出人意料的）发现仍可能带来巨富，但更常带来诉讼。"}, {"en": "Some of the most exciting finds now come not from professional excavations, with their neat (trench) and trowel, but from amateurs. Britain's metal detectorists, once dismissed as (uncouth) treasure-hunters, report more than 1,000 finds of potential treasure a year, among them the Staffordshire Hoard, the largest haul of Anglo-Saxon gold ever found, which turned up in a farmer's field in 2009. Most days are (unproductive). Detectorists sweep fields after farmers (thresh) the harvest and (fertilize) the soil, whose chemicals can corrode buried metal. Then comes the bleep: an axe-head whose oak (helve) has long since rotted away, a pot of Roman coins—enough, one might joke, to measure by the (peck)—or a gold ring once used to (betroth) a medieval couple. Museums that once looked down on such finders have learned to (shuck) off their snobbery and work with them.", "zh": "如今，有些最激动人心的发现并不来自专业考古队挖出的整齐（探沟）或他们手中的小铲，而是来自业余爱好者。英国金属探测爱好者过去常被斥为（粗野无礼的）寻宝人，现在每年却会报告1,000多项可能属于珍宝的发现，其中包括2009年在一块农田中出土的斯塔福德郡宝藏，那是迄今发现数量最多的盎格鲁—撒克逊金器群。大多数日子都（毫无收获）。农民给作物（脱粒）、为土地（施肥）之后，探测者就会扫描田地，尽管肥料中的化学物质可能腐蚀埋藏的金属。然后，仪器突然响起：也许是一只橡木（斧柄）早已腐朽的斧头，也许是一罐罗马钱币，多得可以开玩笑说要用一（配克容量）来量；又或者是一枚曾用于让中世纪情侣（订婚）的金戒指。过去看不起这些发现者的博物馆，已经学会（摆脱）傲慢，与他们合作。"}, {"en": "Natural-history museums face pressures of their own. The stuffed body of Dolly, the first mammal cloned from an adult cell, a (ewe) who died in 2003, stands in the National Museum of Scotland in Edinburgh, as (endearing) as she is important. London's Natural History Museum sent \"Dippy\", its cast of a diplodocus, on a tour of Britain and hung the skeleton of a blue whale in its main hall instead, a statement about extinction. Collections assembled by Victorian gentlemen who would (stalk) big game for sport, from a (cheetah) shot on safari to drawers of birds' eggs, now look less like science than trophy-hunting. Curators who once aimed to (fossilize) nature in glass cases now want to (sensitize) visitors to its loss and to (specialize) in the science of a warming world; a (mammoth) skeleton is no longer just a marvel but a warning.", "zh": "自然历史博物馆也有自己的压力。多莉羊是第一只由成年细胞克隆出的哺乳动物，这只2003年死亡的（母绵羊）制成标本后，如今站在爱丁堡的苏格兰国家博物馆里，既重要又（惹人喜爱）。伦敦自然历史博物馆让名为“迪皮”的梁龙复制骨架在英国巡展，并在主展厅改挂蓝鲸骨架，以此表达对物种灭绝的关注。维多利亚时代绅士们为了娱乐而（潜行追猎）大型动物，搜集（猎豹）狩猎标本和一抽屉又一抽屉的鸟蛋；今天看来，这些收藏与其说是科学，不如说是猎取战利品。当年想把自然界（化石化般固定）在玻璃柜里的策展人，如今更希望让游客（敏锐意识到）自然正在消失，并（专门研究）全球变暖时代的科学。一具（猛犸象）骨架已不再只是奇观，也是一种警告。"}, {"en": "Disaster is never far away. In September 2018 a fire tore through Brazil's National Museum in Rio de Janeiro, a former imperial palace, destroying most of its 20m items. Firefighters found the two nearest hydrants dry and had to draw water from a lake as they struggled to (extinguish) a blaze that consumed two centuries of scholarship in a single night. The museum had held artworks that could (ravish) the eye; most were gone. In the (aftermath) the gutted palace stood like a (wraith) above its park, and the (grief) of Brazil's scientists was palpable. Among the few survivors was \"Luzia\", an 11,000-year-old skull, pulled in fragments from the ashes. Climate change adds (scorching) summers, floods and storms, the (wrath) of an overheated planet, to the threats facing (perishing) collections, many of which already (languish) in damp basements. Insurers, once (obliging), now ask harder questions, and some museums face an (impending) choice over whether to move their holdings out of harm's way, a prospect (boding) ill for the towns they would leave behind.", "zh": "灾难从未远离博物馆。2018年9月，一场大火席卷位于里约热内卢、前身是帝国宫殿的巴西国家博物馆，毁掉馆藏2,000万件物品中的绝大部分。消防员发现最近的两处消防栓没有水，只好从湖中抽水，努力（扑灭）那场一夜吞噬两个世纪学术积累的大火。博物馆曾拥有足以让人（赏心悦目、心醉神迷）的艺术品，但大多数都不复存在。灾难的（余波）中，被烧空的宫殿像一具（幽魂）般矗立在公园上方，巴西科学家的（悲痛）令人感同身受。少数幸存者之一是约11,000年前的头骨“露西亚”，人们从灰烬中把它的碎片拾出。气候变化让威胁愈发复杂：极端（酷热的）夏季、洪水和风暴，仿佛过热星球的（怒火），都在威胁着（不断毁损的）馆藏，其中许多藏品早已在潮湿地下室里（长期蒙尘）。过去较（乐于通融）的保险公司，如今开始提出更苛刻的问题；一些博物馆面临（迫在眉睫的）抉择：是否要把藏品迁离危险地区，而这对它们将离开的城镇而言，是一种（预示不祥的）前景。"}, {"en": "Not every museum is a supertanker. Thousands of small ones—a local museum (nestling) in a market town, a house museum in a (grove) of beeches set in (lush) gardens, even a single (alcove) devoted to a forgotten poet—are each a (skiff) beside an ocean liner, able to change course quickly. Many occupy (unprepossessing) buildings, and their charm lies in eccentric collections and sometimes (offish) custodians, rather than in anything (modish). Visitors who (rove) beyond the capitals find gems: Vienna's imperial carriage museum, with its gilded coaches and a royal (sleigh), or York's National Railway Museum, where affection for the Flying Scotsman (drove) families from across Britain to see the country's most famous (locomotive).", "zh": "并非所有博物馆都是巨型油轮。数千家小型博物馆——（依偎在）集镇里的地方馆、设在（山毛榉树林）之间且被（繁茂）花园环抱的故居馆，甚至仅为一位被遗忘诗人开辟的一处（壁龛）——相对于远洋巨轮，每一家都像一艘（小艇），能够迅速转向。许多小馆的建筑物（其貌不扬），魅力在于古怪的收藏以及有时显得（不太友善的）管理员，而不在于是否（时髦新潮）。那些离开首都、四处（漫游）的游客能发现许多珍宝：比如维也纳的皇家马车博物馆，馆内收藏镀金马车和皇家（雪橇）；又如约克的国家铁路博物馆：人们对“飞翔的苏格兰人”的热爱，曾（驱使）全英国的家庭前来观看这辆最著名的（蒸汽机车）。"}, {"en": "Big institutions are trying to (decentralize) and to (devolve) both objects and money to the regions. The Louvre opened an outpost in Lens, a former mining town, in 2012, and the V&A has moved much of its (reserve) collection to a vast new storehouse in east London, where visitors can ask to see objects on demand. In Africa a crop of (fledgling) museums, from Dakar to Kumasi, are building collections of their own on their own (initiative); the (underdog) is learning to compete.", "zh": "大型博物馆则试图（实行去中心化），将藏品和资金（下放）到各地。卢浮宫2012年在昔日矿业城镇朗斯开设分馆，维多利亚与阿尔伯特博物馆也把大批（备用馆藏）移至伦敦东部一座巨型新库房，游客可以按需申请查看藏品。在非洲，从达喀尔到库马西，许多（初创的）博物馆正凭借自身的（主动努力）建立收藏；原本的（弱势竞争者）正在学会参与竞争。"}, {"en": "Running such places takes an unusual temperament. Some great directors have shown a (maverick) streak: Thomas Hoving, a (rakish) and (prepossessing) showman who ran the Metropolitan Museum in New York from 1967 to 1977, is credited with inventing the blockbuster exhibition. Others have been (retiring) scholars, happier writing a (monograph) in the storeroom than glad-handing in the boardroom. Neither type can afford to be (indecisive) or (impulsive). Trustees can be (overbearing) and donors (peevish) when their names are not big enough; a director must be (ingratiating) towards the rich without seeming (grasping), (latch) on to every opportunity and never let setbacks (faze) her.", "zh": "经营这样的地方需要不同寻常的性格。一些伟大馆长有（特立独行的）气质。1967年至1977年执掌纽约大都会艺术博物馆的托马斯·霍文，是一位（潇洒不羁）、外表（讨人喜欢）的表演型人物，通常被认为开创了大型热门特展的模式。另一些馆长则是（不爱交际的）学者，宁愿躲在库房里写（专题学术著作），也不愿在董事会议室握手寒暄。但无论哪种人，都不能（优柔寡断）或（冲动行事）。受托人可能（专横跋扈），捐赠者也可能因为自己的名字印得不够大而（烦躁易怒）。馆长既要对富人（善于讨好），又不能显得（贪得无厌）；既要（抓住）每个机会，又绝不能让挫折（吓住）自己。"}, {"en": "Critics, (pettish) about every rehang, are joined by the odd (grouch) on the staff convinced that everything was better in the old days, while ministers send a (plaintive) (missive), deliver a (hortative) speech urging reform or occasionally (admonish) a director in public. Social media adds (abusive) messages, (currish) attacks and plain (invective); the more (rebarbative) the online exchanges become, the more widely they are shared. Boards that should be (cooperative) turn (uncooperative) when money is short, and their questions take on an (interrogative) edge. The (operative) word is accountability: when anything goes wrong, as Ms des Cars discovered, the director takes the blame, and many good candidates are (loath) to take the job at all. Scholarly expertise risks becoming a (recessive) trait in museum leadership.", "zh": "评论者会对每次重新布展都（挑剔不满）；馆内偶尔也有一个认定过去一切都更好的（牢骚鬼）。与此同时，部长们会寄来语气（哀怨恳切）的（信函），发表敦促改革的（劝勉式）讲话，偶尔还会公开（训诫）馆长。社交媒体则带来（辱骂性的）留言、（卑劣恶毒的）攻击和赤裸裸的（恶言谩骂）；网上交流越是（令人反感），传播就越广。本该（通力合作）的董事会，一旦资金紧张便可能（拒不合作），提问也开始带有（审问式）的锋芒。真正（起关键作用的）词是“问责”：正如德卡尔女士所经历的，出了任何问题，馆长都要承担指责，因此许多优秀候选人都（不情愿）接下这个职位。学术专长正在面临成为博物馆领导层一种（隐性性状）的风险。"}, {"en": "The profession's rewards are a mixed blessing. Successful directors in Britain can expect a (gong) from the king, and the grandest are knighted; visitors (doff) their caps at openings, and the press likes to (lionize) a director in good times and (satirize) him in bad. A tabloid (rag) will happily (slag) off a museum for a (cringing) apology one week and for an unrepentant label the next, though when it comes to criminal charges it is a judge in a horsehair (wig), not the press, who decides. Museums, for their part, are tempted to (externalize) blame onto their (scalding) critics, to (ostracize) colleagues who dissent and to (victimize) junior staff for failings that start at the top. Every institution needs a (prig) or two to remind it of its principles.", "zh": "这个行业的奖赏有利有弊。英国成功的博物馆馆长可能从国王那里获得一枚（勋章），顶尖者还会被封为爵士；访客在开幕式上（脱帽致敬），媒体则喜欢在顺境中把馆长（捧为明星），在逆境中（讽刺挖苦）他们。一份（低俗小报）这周可能把博物馆（痛骂）一顿，因为它作出了（卑躬屈膝的）道歉，下周又因某张说明牌毫不悔改而继续批判。但遇到刑事指控，真正作出裁决的，是戴着马毛（假发）的法官，而不是媒体。博物馆自己则可能试图把责任（转嫁）给（尖酸刻薄的）批评者，（排挤孤立）持不同意见的同事，或让初级员工为高层的失败（承担不公后果）。每个机构或许都需要一两个（自命清高的道德卫士），提醒大家别忘了原则。"}, {"en": "What, then, should museums do? The (striking) thing about the past few years is how many of their troubles were self-inflicted. A sensible (approach) would start with the basics: raise security by a (notch) or two, and (retrench), if they must, anywhere but in the guards' room. Museums should resist the temptation to (overreach) with vanity buildings, and they should (slough) off reflexive defensiveness; an (arch) quip is no answer to a serious challenge. Restitution need not (hamstring) great collections; loans, partnerships and returns can (vitalize) them, much as new blood does a family. Some (sparring) with governments and activists is inevitable and even healthy, a safety (valve) for arguments that would otherwise fester.", "zh": "那么，博物馆究竟该怎么办？过去几年最（引人注意的）一点，是许多麻烦其实都由它们自己造成。合理的（做法）应该从基础开始：把安保水平提高一两个（档次），真要（削减开支），也应避开警卫部门。博物馆应抵抗借形象工程（好高骛远）的诱惑，还应（摆脱）条件反射式的防御姿态；面对严肃的挑战，一句（故作机智的）俏皮话绝不是答案。文物归还未必会（束缚）伟大的收藏；借展、合作与返还反而能为它们（注入生机），就像给家族带来新鲜血液一样。与政府和活动人士进行一定程度的（言语交锋）不可避免，甚至有益；它能成为争议的安全（泄压阀），否则那些矛盾只会持续化脓。"}, {"en": "It would (behoove) museums, too, to keep their (nerve). The pressure to (homogenize), to fill every gallery with the same blockbusters, the same (unthreatening) labels and the same tote bags, is strong; so is the urge to (pasteurize) history until nothing in it could possibly offend. Visitors deserve better. They come for the (piercing) gaze of a Rembrandt self-portrait, the (blooming) colors of a Monet garden, the strange (verve) of a Benin plaque. A (demanding) public is one to court, not to fear, and heritage should be a ladder rather than a (crutch). Museums that refuse to get stuck in a (groove), (yielding) neither to thieves nor to fashion, and that (pitch) their stories at grown-ups, will find that the crowds keep coming. The Louvre may never see its jewels again. If their loss makes museums guard what they hold more carefully, and think harder about why they hold it, it will not have been entirely in vain.", "zh": "博物馆也（理应）保持（镇定与勇气）。一种强大的压力，正在推动它们走向（千篇一律）：每个展厅都陈列同样的热门作品、使用同样（毫无冒犯性的）说明牌、售卖同样的帆布袋。另一种冲动则想把历史彻底（巴氏杀菌式地净化），直到其中再没有任何可能冒犯人的东西。游客理应得到更好的体验。他们来是为了伦勃朗自画像那（锐利穿透的）目光、莫奈花园里（繁花盛放的）色彩，以及贝宁铜牌上奇异的（生动活力）。一个（要求甚高的）公众值得争取，而不是畏惧；文化遗产应该成为帮助人向上攀登的梯子，而不是依赖的（拐杖）。那些拒绝陷入固定（套路）、既不向窃贼也不向潮流（屈服），并且以成年人能够理解与思考的方式（讲述）故事的博物馆，会发现观众依然络绎不绝。卢浮宫可能永远找不回那些珠宝。但如果失窃让博物馆更认真地守护手中之物，并更深入地思考为何收藏它们，那么这场损失便不算完全白费。"}];
const HAS_TITLE = true;
const SUBTITLE_EN = "";
const SUBTITLE_ZH = "";

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  if (typeof SUBTITLE_EN !== 'undefined' && SUBTITLE_EN) {
    const sub = document.createElement('div');
    sub.className = 'book-subtitle';
    sub.textContent = SUBTITLE_EN;
    div.appendChild(sub);
  }
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  if (typeof SUBTITLE_ZH !== 'undefined' && SUBTITLE_ZH) {
    const subZh = document.createElement('div');
    subZh.className = 'zh-subtitle';
    subZh.textContent = SUBTITLE_ZH;
    div.appendChild(subZh);
  }
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-cases-to-answer-v1';
const LS_OLD_KEY = 'audiobook-cases-to-answer-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
