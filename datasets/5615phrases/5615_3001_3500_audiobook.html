in London; Lord Rogers called it an abuse of power, and constitutional purists saw an (infraction) of the rule that royals stay out of planning disputes.", "zh": "他对建筑的看法给他招来了敌人。1984年，他对英国皇家建筑师学会说，国家美术馆的一项扩建方案看起来像“一位深受喜爱的优雅朋友脸上长出的一个巨大脓疮”，该设计随后被放弃。1987年，他说德国空军炸毁圣保罗大教堂周围的建筑时，“并没有用比瓦砾更难看的东西来取代它们”。在许多建筑师眼里，他是个（脾气古怪的老顽固），他的干预会使争论变得（粗鄙），还会吓跑开发商；然而，他所痛斥的许多战后（只讲实用的）塔楼后来都已被（拆除），这表明他并非全错。在1989年出版的书和拍摄的电视纪录片《英国愿景》中，他试图（构想）另一种选择：人性化尺度的街道、本地材料、（朴素的）立面和古典比例。自1993年起在他的土地上兴建的多切斯特扩展区庞德伯里便是成果；批评者嘲笑它是缺乏（精致）的乔治王时代风格（仿制品），尽管当地居民似乎很喜欢。他的基金会帮助有志成为（工匠）的人学习传统技艺，从抹灰、铺茅草屋顶到石作工艺；它还教一位（石匠）如何将石块表面（打毛），制成粗琢面；他的传统艺术学校以（几何学家）般的严谨教授伊斯兰及其他神圣图案。2009年，他私下写信给卡塔尔王室的一名成员，后者的房地产公司随即撤回了罗杰斯勋爵为伦敦切尔西兵营旧址设计的现代主义方案；罗杰斯勋爵称之为滥用权力，宪政纯粹主义者则认为这是对王室不介入规划纠纷这一规则的（违反）。"}, {"en": "Charles has always struggled to keep his opinions to himself. The Prince's Trust, which he founded in 1976 with his severance pay from the navy, says it has helped more than a million young people from areas of (deprivation) into work, training or business; Dickens might have described a child among the poorest as an (urchin). When he flew to the handover of Hong Kong in 1997, a colony first acquired by (cession) in 1842, he wrote in a private journal that China's leaders looked like \"appalling old waxworks\"; when the Mail on Sunday published the journal in 2005 he sued, and won the ensuing (litigation). Convention would (enjoin) any monarch to keep such thoughts private, and a (disjunction) between private opinion and public neutrality is part of the job: a head of state must be (beholden) to no party, and be seen to be so. Since his accession he has mostly managed it, although a stationery (malfunction) at Hillsborough Castle in 2022, when ink leaked over his fingers as he signed a visitors' book, produced a burst of temper caught on camera. He is famously thrifty, wearing patched suits and shoes he has owned for decades, a habit that reflects a hatred of waste rather than the indifference of a (sloven).", "zh": "查尔斯一向难以把自己的意见藏在心里。他在1976年用海军退役金创办了王子信托基金，该基金称已帮助一百多万来自（贫困）地区的年轻人实现就业、接受培训或自主创业；对于其中那些最贫困的孩子，狄更斯或许会用（流浪儿）来形容。1997年他飞赴香港出席交接仪式，香港这块殖民地最初是1842年通过（割让）取得的；他在一本私人日记中写道，中国领导人看上去像“可怕的老蜡像”；2005年《星期日邮报》刊登这本日记后，他提起诉讼，并赢得了随后的（官司）。惯例会（责成）任何君主把这类想法藏在心里，而私人意见与公开中立之间的（脱节）本就是这份工作的一部分：国家元首必须不（受制于）任何党派，而且要让人看到这一点。自继位以来，他大体上做到了，不过2022年在希尔斯伯勒城堡，他在访客簿上签名时墨水漏到了手指上，这次文具（故障）引发了一阵被镜头拍下的脾气。他以节俭著称，穿着打了补丁的西装和穿了几十年的鞋子，这一习惯反映的是对浪费的厌恶，而不是（邋遢之人）的漫不经心。"}, {"en": "Much royal pageantry is younger than it looks. Historians such as David Cannadine have argued that the British monarchy's ceremonial was largely an (elaboration) of the late 19th century, when a throne that was losing its political power became the focus of national and imperial pride; ritual grew by (accretion), each jubilee and crowning adding new flourishes to the last. Victoria was proclaimed Empress of India in 1877, and in 1911 George V and Queen Mary presided in person over a durbar in Delhi attended by princes glittering with jewels, a (projection) of imperial power over a subcontinent that would soon want none of it. It fell to Lord Mountbatten, Prince Philip's uncle and the last viceroy, to oversee the hasty (partition) of India in 1947, amid bloodshed that killed hundreds of thousands of people, perhaps a million. In 1979 he was murdered by the IRA: the (detonation) of a bomb on his fishing boat off the Irish coast also killed two boys and an elderly woman.", "zh": "许多王室盛典并不像看上去那么古老。戴维·坎纳丁等历史学家认为，英国君主制的礼仪大多是19世纪后期（精心铺陈）出来的，当时一个正在丧失政治权力的王座成了民族与帝国自豪感的焦点；仪式靠（逐渐累积）而成，每一次庆典和加冕都在前一次的基础上增添新的花样。维多利亚于1877年被宣布为印度女皇；1911年，乔治五世和玛丽王后亲临德里主持杜尔巴大典，与会的土邦王公们珠光宝气，这是对一个很快就不再需要它的次大陆的帝国权力（展示）。收拾残局的任务落在了菲利普亲王的舅舅、末代总督蒙巴顿勋爵身上，他在1947年主持了仓促的印巴（分治），随之而来的流血冲突造成数十万人死亡，也许多达一百万。1979年，他被爱尔兰共和军杀害：在爱尔兰海岸外，他的渔船上一枚炸弹（引爆），还炸死了两个男孩和一位老妇人。"}, {"en": "The king is also head of state of 14 other countries, from Canada to Tuvalu, and the arrangement occasionally bites. In 1975 Sir John Kerr, Australia's governor-general, dismissed Gough Whitlam's Labor government after the Senate blocked its budget, and gave a (commission) to the opposition leader, Malcolm Fraser, as caretaker prime minister. Whitlam responded on the steps of Parliament House in (stentorian) tones: \"Well may we say 'God save the Queen', because nothing will save the governor-general!\" Letters between Kerr and the palace, released in 2020 after a long legal fight by a historian, showed that the Queen's private secretary had discussed the reserve powers with him beforehand, though not the dismissal itself. Australia was (riven) for years. In 1999 Australians voted by 55% to 45% against becoming a republic, partly because a (coalition) of monarchists and republicans who wanted a directly elected president defeated the model on offer, and the republican movement has split into more than one (faction) ever since. When Charles visited Canberra in 2024, Lidia Thorpe, an Aboriginal senator, greeted his speech with a shouted (interjection), \"You are not my king!\", and a (denunciation) of colonial genocide.", "zh": "国王还是另外14个国家的元首，从加拿大到图瓦卢，这种安排偶尔会惹出麻烦。1975年，参议院阻挠工党政府的预算案后，澳大利亚总督约翰·克尔爵士解散了高夫·惠特拉姆的政府，并（委任）反对党领袖马尔科姆·弗雷泽为看守总理。惠特拉姆站在议会大厦的台阶上以（洪亮的）声音回应：“我们大可以说‘上帝保佑女王’，因为没有什么能拯救总督了！”克尔与王宫之间的信件在一位历史学家经过漫长的法律斗争后于2020年公开，信件显示，女王的私人秘书事先曾与他讨论过保留权力，但没有讨论解散政府本身。澳大利亚为此（四分五裂）多年。1999年，澳大利亚人以55%对45%否决了成为共和国的提议，部分原因是君主派与主张直选总统的共和派结成了（联盟），否决了提交表决的方案；此后共和运动便一直分裂成不止一个（派系）。2024年查尔斯访问堪培拉时，原住民参议员莉迪娅·索普在他讲话时大声（插话）：“你不是我的国王！”并（谴责）殖民者的种族灭绝。"}, {"en": "In the Caribbean the mood is turning. Barbados became a republic in 2021, with Charles in attendance, a (termination) of ties to the British throne that dated back to the 17th century, and its example may (embolden) others. When William and Catherine toured the region in 2022 they met protesters demanding reparatory justice for slavery, and pictures of the couple standing in an open-topped Land Rover struck many as a colonial throwback; Jamaica's prime minister told them that his country was \"moving on\". The (escalation) of such demands is likely to (harden) Caribbean opinion, and Jamaica has begun legislating to (realign) its constitutional arrangements without the king. At a Commonwealth summit in Samoa in 2024 leaders agreed that the time had come for a conversation about the legacy of slavery, and Charles conceded that \"none of us can change the past\". Royal tours remain the monarchy's chief instrument of diplomacy, scheduled around the (monsoon) in South Asia and the (typhoon) season in the western Pacific, but the warmth of a welcome is no guarantee of loyalty.", "zh": "在加勒比地区，风向正在转变。2021年巴巴多斯成为共和国，查尔斯出席了仪式，这（终结）了该国与英国王位之间可追溯至17世纪的联系，它的先例可能会（鼓舞）其他国家。2022年威廉和凯瑟琳出访该地区时，遇到了要求就奴隶制伸张补偿正义的抗议者，两人站在敞篷路虎上的照片在许多人看来是殖民时代的倒退；牙买加总理告诉他们，他的国家正在“向前看”。此类诉求的（升级）可能会使加勒比地区的舆论（强硬）起来，牙买加已开始通过立法，在没有国王的情况下（重新调整）本国的宪政安排。2024年在萨摩亚举行的英联邦峰会上，各国领导人一致认为，是时候就奴隶制的遗留问题展开对话了，查尔斯也承认“我们谁都无法改变过去”。王室出访仍是君主制最主要的外交工具，行程要避开南亚的（季风）雨季和西太平洋的（台风）季节，但热情的欢迎并不能保证忠诚。"}, {"en": "What could undo the monarchy? Scandal is the most obvious threat. The (repulsion) that many Britons felt at Andrew's friendship with Jeffrey Epstein, a convicted sex offender, left a (stain) that threatened to (distain) the whole family. By stripping his brother of his titles the king performed a painful act of (abscission), cutting away a diseased branch to protect the tree, and Andrew's move in February from a 30-room house at Windsor to the Sandringham estate, more than 100 miles away, needed rather more than one (pantechnicon). A slimmed-down monarchy has fewer hands to share the work, however. The law makes (provision) for counsellors of state to act when the king is ill or abroad, and in 2022 Parliament added Princess Anne and Prince Edward to the list, since Andrew and Harry could no longer be called upon. Few expect Harry to (rejoin) the ranks of working royals, whatever reconciliation with his father may bring.", "zh": "什么可能令君主制垮台？丑闻是最明显的威胁。许多英国人对安德鲁与已定罪性犯罪者杰弗里·爱泼斯坦交往一事深感（厌恶），这留下了一个可能（玷污）整个家族的（污点）。国王剥夺弟弟的头衔，是一次痛苦的（剪除），砍掉一根病枝以保全整棵树；而安德鲁今年2月从温莎一座有30个房间的宅子搬到100多英里外的桑德林汉姆庄园，所需要的恐怕远不止一辆（家具搬运车）。然而，精简后的君主制分担工作的人手也更少了。法律对国王患病或出国时由国事顾问代行职务作了（规定），2022年议会把安妮公主和爱德华王子增补进名单，因为安德鲁和哈里已不能再被召来履职。无论哈里与父亲达成何种和解，很少有人指望他会（重新加入）在职王室成员的行列。"}, {"en": "The succession, at least, looks secure. A law passed in 2013 ended the preference for male heirs and the bar on heirs marrying Catholics, a (relaxation) of rules that had stood for centuries, so Princess Charlotte keeps her place in the line of succession ahead of her younger brother, Louis. William, the heir, now runs the Duchy of Cornwall, an estate of some 130,000 acres that includes much of the (barren) (terrain) of Dartmoor, and has promised to use it to help tackle homelessness; he and Catherine, his (companion) since their student days at St Andrews, regularly top polls of the family's most popular members.", "zh": "至少，王位继承看来是稳固的。2013年通过的一项法律取消了男性继承人优先以及继承人不得与天主教徒结婚的规定，这是对沿用了几个世纪的规则的一次（放宽），因此夏洛特公主在王位继承顺序中排在弟弟路易之前。王储威廉如今掌管着康沃尔公爵领地，这片约13万英亩的地产包括达特穆尔大部分（贫瘠的）（地带），他已承诺利用这片地产帮助解决无家可归问题；他与自圣安德鲁斯大学求学时代起便相伴的（伴侣）凯瑟琳，在王室成员受欢迎程度的民调中经常名列前茅。"}, {"en": "The case against monarchy is easy to make by pure (ratiocination). Hereditary office is irrational and unequal, and by any democratic (criterion) indefensible. Republic, a pressure group, campaigns against hereditary rule; its critics accuse it of (detraction), while its supporters waved placards reading \"Not my king\" as Charles rode to his crowning. Yet the case for monarchy rests on experience rather than logic. In (comparison) with many elected presidents, constitutional monarchs have proved, their defenders argue, cheap, harmless and occasionally useful: a source of national (cohesion) above the fray of party politics, a check on politicians' vanity and a reminder that the highest office in the land is not up for grabs. Polls suggest that most Britons still prefer the monarchy to an elected head of state, though support among the young is far weaker, and no amount of public relations can (cozen) sceptical young voters for ever.", "zh": "反对君主制的理由，单凭纯粹的（逻辑推理）就很容易提出。世袭职位不合理、不平等，按照任何民主（标准）都站不住脚。施压团体“共和”反对世袭统治；批评者指责其言论构成（贬损），而查尔斯乘车前往加冕时，该团体支持者挥舞着写有“不是我的国王”的标语牌。然而，支持君主制的理由靠的是经验而非逻辑。拥护者认为，与许多民选总统相（比较），立宪君主一直花费不多、无害，偶尔还有用处：它是超越党派纷争的国家（凝聚力）之源，是对政客虚荣心的一种制约，也提醒人们，这个国家的最高职位不是可以争抢得来的。民调显示，多数英国人仍然更喜欢君主制，而不是民选的国家元首，尽管年轻人的支持要弱得多，而任何公关手段都无法永远（哄骗）心存怀疑的年轻选民。"}, {"en": "Royal power has been in (diminuendo) for three centuries; what is left is influence, and influence depends on goodwill. Monarchists who assume that habit alone will (sustain) the throne risk letting it (wizen) into a museum piece, and those who expect Charles or William to (attain) the wide respect that Elizabeth II enjoyed in her later years underestimate how hard she worked for it. Royal biography swings between hagiography, which treats every monarch as a sage, and satire, which paints each as a (simpleton); in truth the job demands neither genius nor folly, only stamina, tact and a willingness to be bored in public. Kings and queens survive not because they must, but because, so far, enough of their subjects would rather keep them than not. That is a precarious foundation. It is also the only one a modern monarchy has ever had.", "zh": "王室权力三个世纪以来一直在（渐弱态势）；剩下的是影响力，而影响力取决于善意。那些以为单靠习惯就能（维系）王位的君主制拥护者，可能会让它（枯萎）成一件博物馆展品；那些指望查尔斯或威廉（赢得）伊丽莎白二世晚年享有的广泛敬重的人，则低估了她为此付出的努力。王室传记总是在两极之间摇摆：一边是把每位君主都奉为圣贤的歌功颂德，一边是把每位君主都描绘成（傻瓜）的讽刺挖苦；事实上，这份工作既不需要天才，也不需要愚蠢，只需要耐力、圆通，以及甘愿当众忍受无聊的意愿。国王和女王之所以能存续，不是因为他们非存在不可，而是因为到目前为止，足够多的臣民宁愿留着他们。这是一个不稳固的基础。但这也是现代君主制唯一曾经拥有过的基础。"}];
const HAS_TITLE = true;
const SUBTITLE_EN = "";
const SUBTITLE_ZH = "";

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  if (typeof SUBTITLE_EN !== 'undefined' && SUBTITLE_EN) {
    const sub = document.createElement('div');
    sub.className = 'book-subtitle';
    sub.textContent = SUBTITLE_EN;
    div.appendChild(sub);
  }
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  if (typeof SUBTITLE_ZH !== 'undefined' && SUBTITLE_ZH) {
    const subZh = document.createElement('div');
    subZh.className = 'zh-subtitle';
    subZh.textContent = SUBTITLE_ZH;
    div.appendChild(subZh);
  }
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-uneasy-lies-the-head-v1';
const LS_OLD_KEY = 'audiobook-uneasy-lies-the-head-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
</body>
</html>
