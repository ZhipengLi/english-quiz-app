<!DOCTYPE html>

<title>Uneasy lies the head — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }

    font-size: 1.02rem;
    color: var(--muted);
    font-style: italic;
    margin: 0 0 10px;
  }
  .zh-subtitle {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 0.92rem;
    margin-top: 6px;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>

<script>
const DATA = [{"en": "Uneasy lies the head", "zh": "戴冠之首，难以安枕"}, {"en": "Monarchy ought to be an anachronism. Why do so many kings and queens survive, and what could still undo them?", "zh": "君主制本应是不合时宜的旧物。为何仍有这么多国王和女王屹立不倒？又有什么可能令他们垮台？"}, {"en": "On October 3rd 2025 Grand Duke Henri of Luxembourg signed away his throne in a (solemn) ceremony at the grand-ducal palace, and his son Guillaume became head of state of one of the richest countries on Earth. There was no anointing and no (crown): Luxembourg's monarchs swear an oath before parliament instead. Twenty-one months earlier Queen Margrethe II of Denmark, after 52 years on the throne, had signed her abdication at a council of state and left the room with a brisk (valediction): \"God save the King.\" Outside Christiansborg palace the prime minister read the (proclamation) of the new king's accession, and the crowd gave Frederik X an (ovation) when he stepped onto the balcony to acknowledge their (salutation). Both handovers were models of (continuation), smooth enough to make hereditary rule look like the most natural thing in the world.", "zh": "2025年10月3日，卢森堡大公亨利在大公宫举行的一场（庄严的）仪式上签字让位，其子纪尧姆由此成为这个全球最富裕国家之一的元首。仪式上既没有涂油礼，也没有（王冠）：卢森堡的君主改为在议会面前宣誓。约二十一个月前，丹麦女王玛格丽特二世在位52年后，于国务会议上签署退位文件，留下一句干脆的（告别辞）“上帝保佑国王”，随即离开会场。克里斯蒂安堡宫外，首相宣读了新王登基的（公告）；腓特烈十世走上阳台回应人群的（致意）时，群众报以热烈的（欢呼）。两次交接都堪称（王位延续）的典范，平稳得足以让世袭统治看起来像是世上最自然不过的事。"}, {"en": "It should not. Monarchy ought to look (antediluvian) in an (egalitarian) age. The (presumption) that one family should supply a (sovereign) for ever, by accident of birth, offends every modern (credo) of merit and equality. Yet some 43 sovereign states still have a monarch as head of state, not all of them hereditary; 15 share King Charles III, and few show any sign of cutting his (reign), or anyone else's, short. Kingship has survived because its (conception) has changed. Where monarchs once claimed to rule by divine right, the successful ones now rule by consent, trading power for popularity; the old (superstition) that a royal touch could cure disease has given way to a more modern (perception) that a royal visit can lift a flood-stricken town. Voters' (intuition) that a head of state above politics is worth having has proved stubbornly durable.", "zh": "可它本不该如此。在一个（平等主义的）时代，君主制理应显得（老掉牙的）。仅凭出生的偶然，就由某一个家族永远提供（君主），这种（假定）冒犯了关于才德与平等的每一条现代（信条）。然而，约43个主权国家仍以君主为元首，尽管并非所有君主都通过世袭产生；其中15国共同奉查尔斯三世为国王，几乎没有哪个国家显露出要提前终结他或其他君主（在位时期）的迹象。王权之所以存续，是因为人们对它的（观念）已经改变。君主们过去宣称凭君权神授进行统治，如今成功的君主则凭民意认可在位，以权力换取人气；昔日认为王室之手一触便能治病的（迷信），已让位于一种更现代的（认知）：王室成员的一次探访就能让遭受洪灾的城镇振作起来。选民们的（直觉）是，拥有一位超然于政治之上的国家元首是值得的，而事实证明这种直觉顽强而持久。"}, {"en": "Walter Bagehot, the Victorian essayist and editor of The Economist, divided the English (constitution) into \"efficient\" parts, which do the governing, and \"dignified\" parts, which command loyalty; the monarchy was the most dignified (institution) of all. Its power rested on (illusion): \"We must not let in daylight upon magic,\" he warned. Royal (legerdemain) still depends on a careful mix of ceremony and silence, and on the (circumlocution) of palace statements that confirm nothing and deny less. But television, tabloids and social media have let in floodlights. Courtiers who (spin) a story risk being caught out, and every (revelation) brings the risk of public (disillusion).", "zh": "维多利亚时代的散文家、《经济学人》主编沃尔特·白芝浩把英国（宪制）分为两部分：负责治理的“效率”部分，以及赢得忠诚的“尊严”部分；君主制是其中最具尊严的（制度）。它的力量建立在（幻象）之上。“我们绝不能让日光照进魔法，”他告诫道。王室的（精巧的政治魔术）至今仍有赖于仪式与沉默的精心搭配，也有赖于宫廷声明中那些什么都不确认、更不否认任何事的（迂回说辞）。然而电视、小报和社交媒体已经打进了探照灯。为某件事（粉饰包装）的廷臣随时可能被揭穿，而每一次（爆料）都可能带来公众的（幻灭）。"}, {"en": "Britain's monarchy remains the world's most famous. King Charles III's (coronation) in Westminster Abbey in May 2023, the first since 1953, mixed the ancient and the new: Handel's anthem \"Zadok the Priest\" and a new one by Andrew Lloyd Webber, a gospel choir, a Kyrie sung in Welsh and a rousing (hymn) for the congregation, the king's (oblation) of bread and wine at the Eucharist, a short (sermon) from the Archbishop of Canterbury and a final (benediction). Sir Antonio Pappano raised his (baton) over an orchestra whose brass and (percussion) sounded a (clarion) call across the nave. Millions watched; a few thousand republicans booed in Trafalgar Square, and some were arrested before the procession began.", "zh": "英国君主制仍是世界上最著名的君主制。2023年5月，国王查尔斯三世在威斯敏斯特教堂举行（加冕礼），这是1953年以来的第一次，典礼古今交融：既有亨德尔的颂歌《祭司撒督》，也有安德鲁·劳埃德·韦伯新作的一首；有福音合唱团，有用威尔士语演唱的《垂怜经》，还有会众齐唱的一首激昂的（圣诗）；国王在圣餐礼中（奉献）饼与葡萄酒，坎特伯雷大主教作了简短的（布道），最后是（祝祷）。安东尼奥·帕帕诺爵士举起（指挥棒），乐团的铜管和（打击乐器）在中殿里奏响（号角般嘹亮的）乐声。数以百万计的人观看了典礼；几千名共和派人士在特拉法加广场喝倒彩，其中一些人在游行开始前就遭到逮捕。"}, {"en": "The years since have tested the monarchy. In February 2024 the king announced that he had cancer of an undisclosed kind, and weeks later the Princess of Wales revealed her own diagnosis; she said in January 2025 that she was in (remission), and in December the king told a television audience that his own treatment would be reduced in the new year. A (careworn) monarch, sometimes (wan) at public engagements, has kept working. Family rows have done more damage than illness. Prince Harry's memoir, \"Spare\", aired grievances that will (sadden) and (dishearten) monarchists; father and son met in September 2025 for the first time in 19 months. In October 2025 the king began removing his brother Andrew's royal titles over his association with Jeffrey Epstein; letters patent followed in November, effecting a formal (rescission) of his princely status without modern precedent. Andrew later left his (mansion) at Windsor in what the tabloids gleefully called an (eviction). The episode ought to (chasten) a family that has often protected its (kin) at the expense of its (reputation).", "zh": "此后几年，君主制饱受考验。2024年2月，国王宣布自己罹患一种未公开类型的癌症，几周后威尔士王妃也公布了自己的诊断；她在2025年1月表示病情已经（缓解），同年12月国王在电视讲话中告诉观众，他本人的治疗将在新的一年里减少。这位（饱经忧患的）君主在公开活动中有时面色（苍白），却一直坚持工作。家族纷争造成的损害比疾病更大。哈里王子的回忆录《备胎》抖出种种怨言，足以令君主制拥护者（伤心）和（灰心）；父子二人于2025年9月见面，这是19个月来的第一次。2025年10月，国王因弟弟安德鲁与杰弗里·爱泼斯坦的交往而启动撤销其王室头衔的程序；11月签发的特许状正式（撤销）了他的王子身份，这在现代王室中几无先例。安德鲁后来搬离温莎的（宅邸），小报幸灾乐祸地称之为一次（驱逐）。这一事件理应让这个家族（有所收敛），因为它常常为了庇护（亲属）而牺牲自己的（声誉）。"}, {"en": "Japan's monarchy, the world's oldest hereditary office, faces a subtler threat: extinction. Under a law that lets only men descended in the male line take the throne, Prince Hisahito, who turned 20 in September, is the only member of his (generation) eligible to succeed, the family's last young male (scion). His cousin Princess Aiko, the emperor's 24-year-old daughter and the public's favourite, is excluded by the law's (stipulation). Princesses have long had to leave the family on marrying commoners, so its numbers have been in steady (diminution). In July 2026 parliament enacted measures for the (retention) of princesses' imperial status after marriage and for the adoption of male-line descendants from former imperial branches. Female emperors remain off the table, though polls suggest most Japanese would welcome one; Sanae Takaichi, the prime minister, opposes the (proposition), and the reform rests on the (presupposition) that a single young prince will one day marry and father a son.", "zh": "日本皇室是世界上最古老的世袭职位，面临着一种更隐蔽的威胁：断绝。按照只允许父系男性后裔继承皇位的法律，9月刚满20岁的悠仁亲王是他那一（代）人中唯一有资格继位的，也是皇室最后一位年轻的男性（后裔）。他的堂姐爱子内亲王是天皇24岁的女儿，深受公众喜爱，却因该法的（规定）而被排除在外。长期以来，皇族女子嫁给平民后必须脱离皇室，因此皇室人数一直在持续（减少）。2026年7月，日本国会通过法律，允许皇族女子婚后（保留）皇族身份，并容许从战后失去皇族身份的旧宫家父系男性后裔中收养成员。女性天皇仍不在考虑之列，尽管民调显示多数日本人乐见其成；首相高市早苗反对这一（提议），而这项改革所依赖的（前提）是：这位唯一的年轻亲王将来会结婚并生下儿子。"}, {"en": "Japan's emperors have reinvented themselves before. Until 1945 the state promoted the (exaltation) of the emperor as a living god descended from the sun goddess, and soldiers died in his name. Hirohito announced Japan's surrender on the radio in August 1945, in a courtly (lexicon) that many listeners struggled to follow, observing that the war had developed \"not necessarily to Japan's advantage\". Under the American (occupation) he was spared trial, and on New Year's Day 1946 he publicly denied that the emperor was divine, a (recantation) that cleared the way for a post-war charter defining him as \"the symbol of the State and of the unity of the People\", the (personification) of the nation rather than its ruler. Hirohito was also a serious marine biologist who studied hydrozoans, creatures related to jellyfish that drift as (plankton) at one stage of their lives; his son, Akihito, has published dozens of papers on gobies, small fish found in habitats ranging from rivers and reefs to a coastal (lagoon); their (variegation) of colour and pattern helps to tell the species apart. Naruhito, the current emperor, wrote his Oxford (dissertation) on traffic on the River Thames in the 18th century, and Prince Hisahito has co-written a scientific paper on the dragonflies in the grounds of his family's Tokyo estate.", "zh": "日本天皇此前也曾自我重塑。1945年以前，国家宣扬对天皇的（尊崇神化），奉其为天照大神后裔、活着的神，士兵们以他的名义赴死。1945年8月，裕仁通过广播宣布日本投降，所用的宫廷（辞令）让许多听众难以听懂；他在广播中说，战局的发展“未必对日本有利”。在美国（占领）期间，他免于受审；1946年元旦，他公开否认天皇是神，这一（公开放弃神性主张）为一部战后宪法铺平了道路，该宪法将他界定为“日本国的象征，日本国民统一的象征”，即国家的（化身），而非国家的统治者。裕仁还是一位严肃的海洋生物学家，研究水螅虫，这类与水母有亲缘关系的生物在生命的某个阶段会以（浮游生物）的形态漂流；他的儿子明仁发表过数十篇关于虾虎鱼的论文，这类小鱼生活在河流、珊瑚礁和沿海的（潟湖）中；它们在色彩与花纹上的（斑斓变化）有助于区分不同物种。现任天皇德仁在牛津大学的（学位论文）研究的是18世纪泰晤士河上的航运交通，悠仁亲王则与人合写过一篇关于其家族东京宅邸园内蜻蜓的科学论文。"}, {"en": "Elsewhere monarchy survives partly by (coercion). Thailand's lèse-majesté law, which punishes anyone who would (malign) or (impugn) the king and his close family with up to 15 years in prison per offence, is among the most (draconian) in the world; in 2024 one man was sentenced to 50 years for a string of social-media posts, a record. Hundreds of young people who dared to call for royal reform during protests in 2020 have faced (prosecution), some for (sedition) as well, and the authorities still (detain) critics before royal processions. Since taking the throne in 2016 King Vajiralongkorn has overseen a (centralization) of royal power and the (consolidation) of the monarchy's vast property holdings under his personal control. Human-rights groups (condemn) the law; its defenders say that it protects a revered king from insult. A (conviction) can follow a single post on Facebook.", "zh": "在其他地方，君主制的存续部分依靠（强制）。泰国的冒犯君主罪法律规定，凡（诋毁）或（质疑）国王及其近亲者，每项罪名最高可判15年监禁，是世界上最（严苛的）同类法律之一；2024年，一名男子因发布一连串社交媒体帖子被判处50年徒刑，创下纪录。2020年抗议期间敢于呼吁改革王室的数百名年轻人遭到（起诉），其中一些人还被控（煽动叛乱），当局至今仍会在王室出巡前（拘押）批评者。自2016年登基以来，玛哈·哇集拉隆功国王推动了王权的（集中），并将王室庞大的地产（整合）到自己的个人控制之下。人权组织（谴责）这项法律；其辩护者则称，它保护一位受人尊崇的国王免受侮辱。一条脸书帖子就可能招致（定罪）。"}, {"en": "Thailand's monarchy rests on more than fear. King Bhumibol, who sat on the throne for 70 years until his death in 2016, cultivated an image as a (paragon) of royal virtue, touring the countryside with a camera round his neck and launching thousands of (agrarian) development projects; his royal rainmaking scheme, which seeds clouds to induce (precipitation) over parched farmland, still operates. His (dedication) to the rural poor won genuine (approbation), and in 2019 his son conferred on him the posthumous (cognomen) \"the Great\". The palace's (gargantuan) wealth, estimated in the tens of billions of dollars, attracts less comment at home than abroad.", "zh": "泰国君主制所依靠的不只是恐惧。普密蓬国王在位70年，直至2016年去世，他着力塑造王室美德（典范）的形象，脖子上挂着相机走访乡村，发起了数以千计的（农业的）发展项目；他的皇家人工降雨计划通过播撒云种在干旱农田上空催生（降水），至今仍在运作。他对农村穷人的（奉献）赢得了由衷的（赞许），2019年其子追赠他“大帝”的（追加尊号）。王室（巨额的）财富估计达数百亿美元，在国内引起的议论却比在国外少。"}, {"en": "Nepal shows how a monarchy can die and yet refuse to stay buried. Its kings were stripped of power in 2006 and the monarchy abolished in 2008, seven years after a massacre in which the heir to the throne shot dead nine members of his family, including the king and queen, before turning his gun on himself; many Nepalis still harbour a (suspicion) that the official account conceals some palace (machination). A growing (vexation) with the republic's squabbling politicians has revived royalist nostalgia, and supporters of Gyanendra, the last king, rallied in Kathmandu before elections in March 2026. Voters instead handed a landslide to the party of Balendra Shah, a former rapper and mayor of Kathmandu, who became prime minister. The royalists' (aspiration) to restore the throne looks as remote as ever, but their rallies showed how easily frustration with democracy can curdle into (infatuation) with the past.", "zh": "尼泊尔表明，君主制可以死去却不肯安息。该国国王于2006年被剥夺权力，君主制于2008年被废除，而此前七年曾发生一场屠杀：王储枪杀了包括国王和王后在内的九名家人，随后举枪自尽；许多尼泊尔人至今仍（怀疑）官方说法掩盖了某种宫廷（阴谋）。民众对共和国政客争吵不休日益（恼火），重新唤起了保皇派的怀旧情绪，末代国王贾南德拉的支持者在2026年3月大选前于加德满都集会。然而选民却以压倒性优势把胜利交给了前说唱歌手、加德满都市长巴伦德拉·沙阿所在的政党，他随后出任总理。保皇派恢复王位的（抱负）看来一如既往地遥不可及，但他们的集会表明，对民主的失望多么容易变质为对过去的（痴迷）。"}, {"en": "In the Gulf, monarchy is not ceremonial but absolute. Muhammad ibn Salman, Saudi Arabia's de facto ruler and prime minister, has concentrated power to a degree unseen since the kingdom's founder. In 2017 he confined hundreds of princes and businessmen in Riyadh's Ritz-Carlton hotel during an anti-corruption drive that critics called a shakedown; even a prominent (tycoon) was not spared, and American intelligence concluded that he approved the operation that killed Jamal Khashoggi, a journalist, in 2018, though he denies ordering it. His (domination) of the kingdom is kingship in its most (authoritarian) form. In Eswatini, Africa's last absolute monarchy, King Mswati III lives in conspicuous (ostentation) amid widespread poverty; in 2025 his government accepted the (deportation) of several migrants from America. North Korea's Kim dynasty, now on its third ruler, runs a (totalitarian) state that behaves like a hereditary monarchy in all but name.", "zh": "在海湾地区，君主制不是礼仪性的，而是绝对的。沙特阿拉伯的实际统治者兼首相穆罕默德·本·萨勒曼集权之甚，为王国开国君主以来所未见。2017年，他在一场批评者称为敲诈勒索的反腐行动中，将数百名王子和商人关押在利雅得的丽思卡尔顿酒店；连知名商界（大亨）也未能幸免；美国情报部门断定，他批准了2018年杀害记者贾迈勒·卡舒吉的行动，尽管他否认下达过命令。他对王国的（主宰）是王权最（威权的）形态。在非洲最后一个绝对君主制国家埃斯瓦蒂尼，国王姆斯瓦蒂三世在普遍的贫困中过着招摇的（奢华炫耀）生活；2025年，他的政府接受了美国（驱逐出境）的数名移民。朝鲜金氏王朝如今已传至第三代统治者，所掌控的（极权主义的）国家除了名义之外，处处都像一个世袭君主国。"}, {"en": "Europe's monarchies have survived by shrinking. The Dutch, Belgian and Scandinavian royals are sometimes called \"bicycling monarchies\" for their (quotidian) informality. In the Netherlands, a land of canals, the occasional church (carillon) and republican instincts, King Willem-Alexander revealed in 2017 that he had spent two decades secretly co-piloting KLM airliners in his spare time. Norway's Harald V, an (octogenarian) who has been king since 1991, won admirers with a speech in 2016 declaring that \"Norwegians believe in God, Allah, the universe and nothing\"; Sweden's Carl XVI Gustaf removed five of his grandchildren from the royal house in 2019 to (loosen) the ties between the state and his growing family. Ordinariness can become an (affectation) of its own, but it has kept even (hardbitten) republicans quiet. Belgium has a darker (dimension) to confront. King Leopold II ran the Congo as a personal fief from 1885 to 1908, and under the (depredation) of his agents, who forced villagers to gather rubber, millions are thought to have died. In 2020 King Philippe expressed his \"deepest regrets\" for the wounds of the colonial era, and two years later Belgium handed back to Congo a tooth belonging to Patrice Lumumba, the independence leader murdered in 1961.", "zh": "欧洲的君主制靠收缩自身得以存续。荷兰、比利时和斯堪的纳维亚各国王室因其（日常的）随和作风，有时被称为“骑自行车的君主制”。荷兰是一个遍布运河、偶尔传来教堂（排钟）乐声、又有共和传统的国度，国王威廉-亚历山大在2017年透露，二十年来他一直利用业余时间秘密担任荷航客机的副驾驶。挪威国王哈拉尔五世是一位自1991年起在位的（八旬老人），他在2016年的一次演讲中宣称“挪威人信仰上帝、真主、宇宙，或者什么都不信”，赢得了不少赞誉；瑞典国王卡尔十六世·古斯塔夫则于2019年把五个孙辈移出王室，以（放松）国家与其日益壮大的家族之间的联系。平凡本身也可能变成一种（做作），但它连（顽固强硬的）共和派都安抚住了。比利时则有一个更黑暗的（层面）需要面对。国王利奥波德二世在1885年至1908年间把刚果当作私人领地来经营，在其代理人的（掠夺）之下，村民被迫采集橡胶，据信有数百万人因此丧生。2020年，国王菲利普对殖民时代造成的创伤表示“最深切的遗憾”，两年后比利时将独立运动领袖帕特里斯·卢蒙巴的一颗牙齿归还刚果，卢蒙巴于1961年遇害。"}, {"en": "Some very small monarchies give their rulers unusually broad formal powers. Monaco's Grimaldis seized the Rock in 1297, legend has it with soldiers disguised as friars; Prince Rainier III, who married Grace Kelly, used his business (acumen) to turn the principality into a playground and tax (haven) for the rich. In 1962 Charles de Gaulle, irked by French citizens' (evasion) of taxes there, ringed Monaco with customs posts until it agreed that most French residents would pay French tax. In Liechtenstein, Prince Hans-Adam II threatened to move to Vienna unless voters confirmed his powers to veto laws and dismiss governments; in 2003 almost two-thirds of them did so, a vote critics interpreted as (submission) to princely authority but that many Liechtensteiners regard as support for a (benign) and efficient constitutional order. Andorra is headed jointly by two co-princes, the president of France and the Bishop of Urgell in Spain, an odd (junction) of republic and church that Andorrans seem to cherish. And in the Vatican Pope Leo XIV, elected in 2025, is the world's only elected absolute monarch, without his secular peers' dynastic (pretension) to hereditary rule.", "zh": "一些面积很小的君主国，却赋予君主相当广泛的正式权力。摩纳哥的格里马尔迪家族于1297年夺取了那块岩岬，相传是让士兵乔装成修士混进去的；娶了格蕾丝·凯利的雷尼尔三世亲王凭借商业（敏锐眼光），把这个公国变成了富人的游乐场和避税（天堂）。1962年，戴高乐不满法国公民在那里（逃税），在摩纳哥周围设立海关关卡，直到摩纳哥同意让大多数法国居民向法国纳税。在列支敦士登，汉斯-亚当二世亲王扬言，除非选民确认他否决法律和解散政府的权力，否则他就搬到维也纳去；2003年，近三分之二的选民照办了，批评者把这次投票视为对王权的（屈从），不少列支敦士登人却认为，这是在支持一种（温和的）、高效的宪政安排。安道尔由两位共治大公共同担任元首，即法国总统和西班牙的乌赫尔主教，这种共和国与教会的奇特（结合）似乎深得安道尔人珍视。而在梵蒂冈，2025年当选的教宗良十四世是世上唯一经选举产生的专制君主，无须提出世俗王室那种依靠血统继位的（主张）。"}, {"en": "Kingship's history is long and bloody. The Romans expelled their last king, Tarquin the Proud, in 509BC, and for five centuries afterwards the very word \"rex\" was poison: the (abolition) of monarchy was the founding myth of a republic dominated by (patrician) families and challenged by (plebeian) assemblies. When Mark Antony offered Julius Caesar a diadem at a festival in 44BC, Caesar pointedly refused it, to the crowd's applause; a month later he was dead. His heir, Augustus, kept every (legion) loyal, paid every (centurion) handsomely and ruled as an emperor while affecting the modest (appellation) of \"first citizen\", a piece of (equivocation) that modern constitutional monarchs have imitated in reverse: Augustus hid an emperor behind republican forms, whereas they place a ceremonial sovereign before a democratic government.", "zh": "王权的历史漫长而血腥。罗马人在公元前509年驱逐了他们的末代国王“高傲者”塔克文，此后五个世纪里，“王”这个词本身就是毒药：（废除）君主制是这个共和国的立国神话，而共和国由（贵族的）世家主导，又受到（平民的）议会挑战。公元前44年，马克·安东尼在一次节庆上向尤利乌斯·恺撒献上冠冕，恺撒当众断然拒绝，赢得群众喝彩；一个月后他便遇刺身亡。他的继承人奥古斯都让每一个（军团）保持忠诚，给每一个（百夫长）丰厚的报酬，以皇帝之实进行统治，却故作谦逊地采用“第一公民”的（称号）。这种（模棱两可）的手法后来被现代立宪君主反向演绎：奥古斯都以共和形式掩盖皇帝实权，而他们则把象征性的君主置于民主政府之前。"}, {"en": "In England kings were tamed by degrees. In 1215 a rebellious (baron) and his fellow nobles forced King John to seal Magna Carta, a (concession) he promptly tried to repudiate. Charles I, who believed in the divine right of kings, was tried for (treason) against his own people and beheaded in 1649; after the restoration of 1660 many of the men who had signed his death warrant met grisly (retribution). The Glorious Revolution of 1688 settled the throne on William and Mary subject to the (obligation) to respect the Bill of Rights, and from then on royal power was worn away by (attrition) rather than by revolution, one convention at a time.", "zh": "在英格兰，国王是被逐步驯服的。1215年，一名反叛的（男爵）与其他贵族一道，迫使约翰王在《大宪章》上用印，这一（让步）他随即就企图反悔。笃信君权神授的查理一世以对本国人民犯下（叛国罪）的罪名受审，于1649年被斩首；1660年王政复辟后，许多在他的死刑令上签名的人遭到了残酷的（报复）。1688年的光荣革命将王位授予威廉和玛丽，但须履行尊重《权利法案》的（义务）；从此，王权是被一条条惯例逐步（消磨）掉的，而不是被革命推翻的。"}, {"en": "The Commonwealth era, an eleven-year (intermission) in England's history of monarchy between Charles I's execution and his son's return, is usually treated as an (aberration). Under the Puritans the theatres stayed shut and Christmas festivities were banned; Oliver Cromwell refused the throne in 1657 but ruled as Lord Protector, and when he died the following year his son Richard succeeded him, a suspiciously dynastic arrangement. Charles II, the \"Merry Monarch\", reopened the theatres in 1660 and did his best to (enliven) the court; his mistresses bore him at least a dozen children, none of whom could inherit. He was also for sale: in the secret Treaty of Dover of 1670 Louis XIV of France sought to (suborn) him with subsidies in return for a promise to convert to Catholicism. Yet he left a lasting monument in the Royal Hospital Chelsea, founded in 1682 to give old soldiers a home and a (pension); its residents still parade in scarlet coats. A century later Edmund Burke defended England's unwritten settlement on the ground of (prescription): its \"sole authority\", he said in 1782, \"is, that it has existed time out of mind\".", "zh": "从查理一世被处决到其子复位的十一年间，共和国时期成了英格兰君主制历史中的一段（中断），常被视为一种（异例）。清教徒当政期间，剧院一直关闭，圣诞庆祝活动也遭禁止；奥利弗·克伦威尔在1657年拒绝了王位，却以护国公身份进行统治，次年他去世后由其子理查德继任，这种安排的王朝色彩浓得令人起疑。“快活王”查理二世于1660年重开剧院，竭力（活跃）宫廷气氛；他的情妇们为他生下了至少十二个孩子，但没有一个能继承王位。他也是可以收买的：在1670年秘密签订的《多佛条约》中，法王路易十四试图用津贴（收买）查理二世，以换取他改宗天主教的承诺。不过他也留下了一座不朽的纪念：1682年创建的切尔西皇家医院，为老兵提供住所和（养老金）；院中的老兵至今仍身着猩红色外套列队游行。一个世纪后，埃德蒙·伯克以（历久沿袭的传统）为依据，为英格兰不成文的政治安排辩护：他在1782年说，其“唯一的权威在于，它自远古以来便已存在”。"}, {"en": "In 1714 the throne passed to George, Elector of Hanover, a German prince more at home in French and German than in English, chosen because the Act of Settlement barred Catholics; the (transplantation) of a foreign dynasty went more smoothly than many had feared. In 1717 he made a royal (excursion) up the Thames by barge while some 50 musicians played Handel's \"Water Music\" from a boat alongside, the sound of a bright (horn) and a mellow (bassoon) carrying across the water; the king liked it so much that he had it played three times. His son, George II, who led his troops at the battle of Dettingen in 1743, the last British monarch to do so, was no (poltroon). George IV, whose (compulsion) to spend on palaces, pictures and clothes ran up colossal debts, gave Brighton its oriental Pavilion. The river pageant was revived for Elizabeth II's Diamond Jubilee in 2012, when a flotilla of some 670 boats sailed down the Thames in a downpour and spectators sheltered under umbrellas or a hastily raised (tarpaulin); the 86-year-old queen stood for most of the four hours.", "zh": "1714年，王位传给了汉诺威选帝侯乔治，这位德意志王公说法语和德语比说英语自在得多，他之所以入选，是因为《王位继承法》禁止天主教徒继位；一个外国王朝的（移植）比许多人担心的要顺利。1717年，他乘御用驳船沿泰晤士河（游览），约50名乐师在旁边的一条船上演奏亨德尔的《水上音乐》，一支明亮的（圆号）和一支浑厚的（巴松管）奏出的乐声在水面上回荡；国王非常喜欢，命人演奏了三遍。他的儿子乔治二世于1743年在德廷根战役中亲率部队作战，是最后一位这样做的英国君主，绝非（懦夫）。乔治四世有一种在宫殿、画作和服饰上挥霍的（强迫性冲动），欠下了巨额债务，却给布莱顿留下了一座东方风格的皇家穹顶宫。2012年伊丽莎白二世钻禧庆典时，河上巡游得以重现：约670艘船组成的船队在倾盆大雨中沿泰晤士河顺流而下，观众撑伞避雨，或躲在临时撑起的一张（防水油布）下面；86岁的女王在长达四个小时的巡游中大部分时间都站着。"}, {"en": "France tried almost every model. The revolutionaries proclaimed a republic in 1792 and guillotined Louis XVI the following year; in 1804 Napoleon, in an extraordinary act of (self-assertion), took the diadem from the altar at Notre-Dame and, with the pope looking on, placed it on his own head. Each (reversion) to monarchy thereafter proved temporary. The July (insurrection) of 1830 brought about the (deposition) of Charles X, the revolution of 1848 toppled his successor, and the Second Empire collapsed in defeat in 1870, since when the French have contented themselves with presidents who behave like monarchs.", "zh": "法国几乎尝试过每一种模式。革命者于1792年宣布成立共和国，次年把路易十六送上断头台；1804年，拿破仑以一种非同寻常的（自我主张）之举，在巴黎圣母院从祭坛上拿起冠冕，当着教宗的面亲手戴到自己头上。此后每一次（恢复）君主制都只是昙花一现。1830年的七月（起义）导致查理十世被（废黜），1848年革命推翻了他的继任者，第二帝国则于1870年在战败中崩溃；从那以后，法国人便满足于拥有举止像君主的总统了。"}, {"en": "The first world war was a (conflagration) that consumed four empires. The Romanovs were shot in a cellar in Yekaterinburg in 1918. Their heir, Alexei, suffered from haemophilia, a disorder of blood (coagulation) inherited through his mother from her grandmother, Queen Victoria, and the empress's reliance on Rasputin, a peasant mystic whom many considered a (charlatan), helped to discredit the dynasty; Russian aristocrats who escaped fled into (destitution), and some ended up driving taxis in Paris. The Habsburgs, who had married their cousins for centuries, bequeathed to their descendants a (misshapen) jaw that court painters struggled to flatter, the visible (manifestation) of a genetic (predisposition) concentrated by generations of inbreeding.", "zh": "第一次世界大战是一场吞噬了四个帝国的（大火）。1918年，罗曼诺夫一家在叶卡捷琳堡的一处地下室被枪杀。他们的继承人阿列克谢患有血友病，这是一种血液（凝结）障碍，经由他的母亲遗传自她的外祖母维多利亚女王；皇后对拉斯普京的倚重也使王朝威信扫地，这位农民出身的神秘主义者被许多人视为（江湖骗子）；逃出来的俄国贵族陷入（赤贫），有些人最终在巴黎开起了出租车。哈布斯堡家族几个世纪以来与表亲通婚，给后代留下了一副宫廷画师都难以美化的（畸形的）下颌，这是一代代近亲繁殖所集中起来的遗传（易感性）的可见（表现）。"}, {"en": "Monarchs have often been murdered; monarchies are harder to kill. The Tudors secured their throne by the (extirpation) of rival claimants of Plantagenet blood, and Russia's Paul I died by (strangulation) at the hands of his own officers in 1801, yet both dynasties carried on. Monarchies more often end when their rulers back the wrong side, lose a war or get in the way of a more powerful neighbour. Hawaii's kingdom, created by Kamehameha I's (unification) of the islands in 1810, was overthrown in 1893 by American businessmen backed by marines, and (annexation) by America followed in 1898. In 1946 Italians voted to (jettison) the House of Savoy, which had acquiesced in Mussolini's dictatorship; in 1974 Greeks chose to (spurn) Constantine II, who had sworn in the colonels after their coup of 1967 before fleeing into exile. Iran's shah staged a festival of (wanton) extravagance at Persepolis in 1971 to celebrate 2,500 years of Persian monarchy; eight years later he was swept away by a revolutionary (convulsion).", "zh": "君主常常遭到谋杀；君主制却更难消灭。都铎王朝靠（根除）带有金雀花王朝血统的王位竞争者来巩固王位，俄国的保罗一世于1801年被自己的军官（勒死），然而两个王朝都延续了下去。君主制更常见的终结方式，是统治者站错了队、打输了战争，或者挡了某个更强大邻国的路。夏威夷王国由卡美哈梅哈一世于1810年（统一）诸岛而建立，1893年被美国商人在海军陆战队支持下推翻，1898年遭美国（吞并）。1946年，意大利人投票（抛弃）了曾默许墨索里尼独裁的萨伏依王室；1974年，希腊人选择（唾弃）康斯坦丁二世，他曾在1967年政变后为上校们主持就职宣誓，后来流亡海外。1971年，伊朗国王在波斯波利斯举办了一场（肆意挥霍的）盛典，庆祝波斯君主制2500年；八年后，他被一场革命的（剧变）扫地出门。"}, {"en": "Spain's monarchy has been restored twice and nearly lost three times. Juan Carlos, chosen by Franco as his successor, won the trust of democrats in 1981 when he went on television in uniform to face down an attempted military coup, a (vindication) of the restored throne that sustained it for decades. Then came the scandals. In 2012, with Spain mired in (recession), he was photographed on an elephant hunt in Botswana; his apology, \"I am very sorry, I made a mistake\", was a rare display of royal (contrition). He abdicated in 2014 and in 2020, amid investigations into his finances, moved to Abu Dhabi, a decision whose political (implication) was hard to miss. His son, Felipe VI, renounced his inheritance from his father in an act of (abnegation) designed to save the throne, and in 2025 Juan Carlos published a memoir that read, to many Spaniards, like a long (justification).", "zh": "西班牙君主制两度复辟，又三度险些失去。由佛朗哥选定为继承人的胡安·卡洛斯在1981年身着戎装上电视，挫败了一场未遂军事政变，赢得了民主派的信任，这是对复辟王位的一次（正名），支撑了它几十年。随后丑闻接踵而至。2012年，西班牙深陷经济（衰退）之际，他被拍到在博茨瓦纳猎象；他道歉说“我非常抱歉，我犯了错误”，这是王室罕见的（悔过）表现。他于2014年退位，2020年在其财务受到调查之际移居阿布扎比，此举的政治（含义）不言自明。他的儿子费利佩六世宣布放弃父亲的遗产，这一（自我牺牲）之举意在保住王位；2025年，胡安·卡洛斯出版了一部回忆录，在许多西班牙人读来，它就像一篇冗长的（自我辩解）。"}, {"en": "Royal bodies have always been public property. Henry VIII suffered a (concussion) in a jousting fall in 1536 and lay unconscious for two hours, an accident some historians blame for the cruelty of his later years. Louis XIV's anal fistula, a painful (lesion), was treated in 1686 by Charles-François Félix, a royal (surgeon) who is said to have practised the (incision) on peasants first; the operation went so well that courtiers queued to have it too. Edward VII's crowning in 1902 had to be postponed at two days' notice when his appendix flared up, and Frederick Treves drained an abscess caused by the (inflammation) on a table in Buckingham Palace.", "zh": "王室成员的身体向来是公共财产。1536年，亨利八世在一次马上长枪比武中坠马，造成（脑震荡），昏迷了两个小时，一些历史学家认为他晚年的残暴正是这次事故所致。1686年，路易十四患有肛瘘，这是一种疼痛的（病变），由王室（外科医生）夏尔-弗朗索瓦·费利克斯为他治疗，据说此人先在农民身上练习过这种（切开）手术；手术非常成功，以致廷臣们争相排队也要做一次。1902年，爱德华七世因阑尾突然发作，加冕礼在仅提前两天通知的情况下被迫推迟，弗雷德里克·特里夫斯在白金汉宫的一张桌子上为他引流了（炎症）引起的脓肿。"}, {"en": "Disease was the great leveller. Smallpox, a (pathogen) indifferent to rank, killed England's Queen Mary II in 1694 and France's Louis XV in 1774. Catherine the Great of Russia, braver than most, was inoculated in 1768 by an English doctor, Thomas Dimsdale, who deliberately gave her a mild (infection) and waited out the (incubation) period with horses ready in case he needed to flee; her example made the (innovation) respectable across Europe. When George V lay dying in 1936 his physician, Lord Dawson, hastened the end with an (injection) of morphine and cocaine, partly so that the king's (expiration) could be announced in the morning papers rather than, as he put it, the less appropriate evening journals.", "zh": "疾病是最大的平衡器。天花这种不分贵贱的（病原体），在1694年夺去了英格兰女王玛丽二世的生命，1774年又夺去了法王路易十五的生命。俄国的叶卡捷琳娜大帝比大多数人更有胆量，1768年由英国医生托马斯·迪姆斯代尔为她接种人痘，医生故意让她受到轻度（感染），并备好马匹熬过（潜伏）期，以防万一需要逃命；她的示范使这项（新方法）在整个欧洲变得体面。1936年乔治五世弥留之际，他的御医道森勋爵给他（注射）了吗啡和可卡因以加速其死亡，部分原因是让国王的（辞世）消息能登上晨报，而不是如他所说，登在不那么得体的晚报上。"}, {"en": "Royal medical history is a catalogue of mysteries. George III's madness has been blamed on porphyria, on arsenic, a (toxin) found in samples of his hair, and more recently on bipolar disorder. When Napoleon died on St Helena in 1821, the (dissection) of his body found a stomach cancer; theories that he was poisoned persist. Queen Victoria, who bore nine children, used chloroform for pain relief during (parturition) in 1853, and her example helped make obstetric anaesthesia more acceptable. George VI, a heavy smoker, died in 1952, aged 56, a few months after an operation for lung cancer, a victim of tobacco, a (carcinogen) whose dangers few then took seriously.", "zh": "王室医疗史就是一部疑案目录。乔治三世的疯癫曾被归咎于卟啉症，也被归咎于在他头发样本中发现的砷这种（毒素），近来又有人认为是双相情感障碍。1821年拿破仑死于圣赫勒拿岛，对其遗体的（解剖）发现了胃癌；但关于他被毒死的说法至今流传。生育过九个孩子的维多利亚女王在1853年（分娩）时使用氯仿缓解疼痛，她的示范提高了人们对产科麻醉的接受度。烟瘾很大的乔治六世于1952年去世，终年56岁，几个月前他刚做过肺癌手术；他是烟草这种（致癌物）的受害者，而当时很少有人认真看待它的危害。"}, {"en": "Food was a hazard too. Medieval kings employed tasters whose (gustation) stood between their master and the (ingestion) of poison. Modern royals face subtler perils: banquets that test the (digestion), tours that leave little room for sensible (nutrition), and a life of permanent scrutiny that would raise anyone's (hypertension). At Balmoral, their Highland estate, the royal family fishes for (salmon) on the Dee and serves venison and (mutton) to visiting prime ministers, several of whom have found the (spartan) hospitality and the parlour games something of an ordeal.", "zh": "食物也是一种危险。中世纪的国王雇用试吃者，靠他们的（味觉）挡在主人与（摄入）毒药之间。现代王室成员面临的危险则更为微妙：考验（消化）能力的宴会，几乎容不下合理（营养）的出访行程，还有那种时刻受人审视、足以加重任何人（高血压）的生活。在苏格兰高地的巴尔莫勒尔庄园，王室成员在迪河上钓（鲑鱼），用鹿肉和（羊肉）款待来访的首相们，其中好几位都觉得那种（简朴的）待客之道和客厅游戏堪称一场磨难。"}, {"en": "Heirs and their health have shaped history. Edward VI, Henry VIII's longed-for son, died in 1553 aged 15, reduced to (emaciation) by a lung disease, probably tuberculosis; his half-sister Mary I's \"phantom pregnancy\" of 1554-55, an abdominal (distention) that her doctors mistook for a child, ended hopes of a Catholic heir. George III took up sea-bathing at Weymouth in 1789 to restore his health, and a band hidden in a neighbouring bathing machine struck up \"God Save the King\" as he took the plunge; royal (natation) soon became a seaside fashion. George IV, grossly overweight, died in 1830 after years of dropsy, which caused a painful (distension) of his legs and belly. Hardened arteries narrowed the (lumen) of George VI's blood vessels, and in 1949 he had an operation on the nerves at the base of his spine to improve the (circulation) in his right leg. Such matters were long kept quiet: only in 2009 did the Queen Mother's official biography reveal that her abdominal surgery in 1966 had been for cancer of the (colon).", "zh": "王位继承人及其健康状况塑造了历史。亨利八世盼望已久的儿子爱德华六世于1553年去世，年仅15岁，此前已被一种很可能是肺结核的肺病折磨得（形销骨立）；他的同父异母姐姐玛丽一世在1554至1555年间出现“假孕”，腹部（膨隆）被御医误以为怀了孩子，结果断送了诞下天主教继承人的希望。1789年，乔治三世为恢复健康到韦茅斯开始海水浴，当他跃入水中时，藏在旁边一辆更衣车里的乐队奏起了《天佑国王》；王室的（游泳）很快成了海滨时尚。体重严重超标的乔治四世多年受水肿折磨，双腿和腹部痛苦地（肿胀），于1830年去世。动脉硬化使乔治六世血管的（管腔）变窄，1949年他接受了脊柱底部神经的手术，以改善右腿的血液（循环）。这类事情长期秘而不宣：直到2009年，王太后的官方传记才披露，她在1966年接受的腹部手术是为了治疗（结肠）癌。"}, {"en": "Royal patronage has also been a (boon) to science. Charles II granted a charter in 1662 to the Royal Society, whose members had met since its (inception) two years earlier to conduct experiments rather than argue from ancient authority. Robert Boyle used an air pump to study the (rarefaction) of air and, with Robert Hooke, showed that animals died in a vacuum, a step towards understanding (respiration); Hooke's \"Micrographia\" of 1665 dazzled readers with an engraving of a magnified flea, the most famous (specimen) in the book, and Isaac Newton, later the society's president, explained how the (refraction) of light splits it into colours. The king himself dabbled in chemistry in a laboratory at Whitehall. George III, the first British monarch to have studied science as part of his education, built an observatory at Kew to watch the transit of Venus in 1769; it later became a centre for measuring the (declination) of the magnetic compass. When William Herschel discovered a new planet in 1781 he named it Georgium Sidus, \"George's Star\", and was rewarded with a royal stipend; astronomers abroad preferred to call it Uranus.", "zh": "王室的赞助对科学也是一大（恩惠）。1662年，查理二世向皇家学会颁发特许状，该会成员自两年前（创立）以来便定期聚会，以实验而非援引古代权威来探求真理。罗伯特·玻意耳用抽气机研究空气的（稀薄化），并与罗伯特·胡克一起证明动物在真空中会死亡，这是理解（呼吸作用）的一步；胡克1665年出版的《显微图谱》以一幅放大的跳蚤版画令读者目眩，那是书中最著名的（标本），而后来出任学会会长的艾萨克·牛顿则解释了光的（折射）如何把光分解成各种颜色。国王本人也在白厅的一间实验室里涉猎化学。乔治三世是第一位在所受教育中学习过科学的英国君主，他在丘园建了一座天文台，用来观测1769年的金星凌日；该台后来成为测量磁罗盘（偏角）的中心。1781年，威廉·赫歇尔发现一颗新行星，将其命名为“乔治之星”，并获得了王室的俸禄；国外的天文学家则更愿意称之为天王星。"}, {"en": "Victoria and Albert were enthusiasts for the new. In 1842 the queen took her first railway journey, from Slough to Paddington, and declared herself \"quite charmed\" by this novel form of (locomotion); the royal train, whose (maroon) carriages have carried monarchs for more than 150 years, is to be retired before its maintenance contract expires in 2027, a (cessation) that the palace justifies on grounds of cost. In the same year a photographer made a daguerreotype of Albert, thought to be the oldest surviving photograph of a British royal; the process required the (sensitization) of a silvered copper plate with iodine fumes and the (vaporization) of mercury to bring out the image. Felix Mendelssohn, whose \"Hebrides\" overture evokes Fingal's (cavern) on the island of Staffa, played for the couple at Buckingham Palace that summer. Albert's grandest project, the Great Exhibition of 1851, was the first international (exposition) of manufactured goods; its profits bought land in South Kensington, where the museums, colleges and concert hall of \"Albertopolis\" came to (fruition) after his death, a lasting (addition) to London's cultural life.", "zh": "维多利亚和阿尔伯特热衷于新事物。1842年，女王第一次乘坐火车，从斯劳到帕丁顿，并宣称自己被这种新奇的（出行方式）“深深迷住了”；那列车厢漆成（栗色）的皇家专列载着历代君主走过了150多年，它将在2027年维护合同到期前退役，王室以成本为由解释这一（停运）。同年，一位摄影师为阿尔伯特拍了一张达盖尔银版照片，这被认为是现存最早的英国王室成员照片；这种工艺需要用碘蒸气对镀银铜板进行（感光处理），再借助汞的（汽化）使影像显现。那年夏天，菲利克斯·门德尔松在白金汉宫为夫妇俩演奏，他的《赫布里底群岛》序曲描绘的正是斯塔法岛上的芬格尔（岩洞）。阿尔伯特最宏大的计划是1851年的万国工业博览会，这是第一次展示工业制成品的国际（博览会）；其利润用于在南肯辛顿购地，“阿尔伯特城”的博物馆、学院和音乐厅在他去世后才得以（实现），为伦敦的文化生活带来了一项持久的（增添）。"}, {"en": "Elizabeth II's 70 years on the throne, the longest (span) in British history, ran from the age of steam to the age of the smartphone. In 1956 she opened Calder Hall, the world's first nuclear power station to supply electricity on an industrial scale, sending its power into the grid along lines supported by one (pylon) after another; in 1960 she launched HMS Dreadnought, Britain's first submarine with nuclear (propulsion). During her lifetime North Sea gas replaced town gas, made by the (gasification) of coal, in the nation's kitchens, and in 1984 she opened the Joint European Torus at Culham, an experiment in nuclear (fusion) that, before it closed in 2023, set a world record for the energy released in a single pulse, estimated by measuring the high-energy (neutron) output of its fusion reactions.", "zh": "伊丽莎白二世在位70年，是英国历史上最长的（时间跨度），从蒸汽时代一直延续到智能手机时代。1956年，她为卡尔德霍尔核电站揭幕，这是世界上第一座以工业规模供电的核电站，电力沿着由一座座（输电塔）支撑的线路送入电网；1960年，她为英国第一艘采用核（推进）的潜艇“无畏”号主持下水仪式。在她有生之年，北海天然气取代了由煤（气化）制成的城市煤气，进入千家万户的厨房；1984年，她为卡尔汉姆的欧洲联合环状反应堆揭幕，这是一项核（聚变）实验，在2023年关闭前创下了单次脉冲释放能量的世界纪录，而释放的能量可根据聚变反应产生的高能（中子）数量加以估算。"}, {"en": "Then there is God. The British monarch is Supreme Governor of the Church of England, a legacy of Henry VIII's (scission) from Rome in 1534, when the pope's refusal to annul his first marriage contributed to a break that eventually produced a separate Christian (denomination). Its archbishops and bishops are still appointed by the king on the prime minister's advice, after a committee of clergy and laity has chosen them. The church began to (ordain) women as priests in 1994 and consecrated its first woman (diocesan) bishop in 2015; the installation of Sarah Mullally, a former chief nursing officer, as the first female Archbishop of Canterbury in March 2026 was the (culmination) of a long struggle that tested (canon) law and the patience of traditionalists. A (layman) might wonder why a largely secular country, in which fewer than one in five people call themselves Anglican, keeps 26 bishops in the House of Lords, where each day's sitting opens with prayers read by one of them, a (benison) on the deliberations that follow. Charles has long signalled his (affection) for other faiths, saying in 1994 that he would rather be seen as a defender of faith than of a single one, and at his crowning Rishi Sunak, then prime minister and a practising Hindu, read the epistle from the (lectern). Disestablishment has been done before: the Church of Ireland lost its official status in 1871 and the Church in Wales in 1920. Secularists would (unfasten) church from state altogether and (consign) the bishops' seats in Parliament to the (bin).", "zh": "再来说说上帝。英国君主是英格兰教会的最高总督，这是亨利八世1534年与罗马（分裂）留下的遗产：当时教宗拒绝宣告他的第一次婚姻无效，最终促成教会分裂，并逐渐形成一个独立的基督教（宗派）。该教会的大主教和主教至今仍由国王根据首相的建议任命，人选则先由一个由神职人员和平信徒组成的委员会选定。教会于1994年开始（按立）女性为牧师，2015年祝圣了第一位女性（教区的）主教；2026年3月，曾任首席护理官的萨拉·穆拉利就任坎特伯雷大主教，成为首位担任此职的女性，这是一场考验（教会法规）和传统派耐心的漫长斗争的（顶点）。一个（门外汉）也许会纳闷：在一个自认为圣公会信徒者不到五分之一的高度世俗化国家，为何仍让26位主教坐在上议院里，每天的会议都以其中一位主教诵读的祷文开场，为随后的议事送上（祝福）。查尔斯长期以来一直表示对其他信仰的（好感），他在1994年说，他宁愿被视为信仰的捍卫者，而非单一信仰的捍卫者；在他的加冕典礼上，时任首相、虔诚的印度教徒里希·苏纳克在（读经台）前诵读了使徒书信。废除国教此前已有先例：爱尔兰教会于1871年失去官方地位，威尔士教会则是在1920年。世俗主义者希望把教会与国家彻底（解开），并把主教们在议会的席位（打发）进（垃圾箱）。"}, {"en": "Royal religion has always mixed pomp with penance. In 1174 Henry II, whose knights had murdered Thomas Becket in Canterbury Cathedral four years earlier, walked barefoot through the city and submitted to a flogging by the monks, accepting the (laceration) of his back as public (expiation). Gentler rituals of humility survive. On Maundy Thursday the monarch hands specially minted silver coins to as many elderly men and women as he has years; the (presentation) commemorates Christ's washing of the disciples' feet, a royal (ablution) last performed in person by James II, and the officials who attend still wear (linen) towels round their waists. At Epiphany two Gentlemen Ushers offer gold, frankincense and myrrh, the last two a fragrant (resin) apiece, at the Chapel Royal in St James's Palace on the king's behalf. Such customs (hearken) back to an age when kings were thought closer to God than other men, and they (leaven) the splendour of monarchy with a little modesty. Charles's own spirituality is more eclectic: he has made many a private (peregrination) to Mount Athos, a self-governing peninsula of Orthodox monasteries in northern Greece, for prayer and (meditation).", "zh": "王室宗教向来是排场与苦修交织。1174年，亨利二世赤脚走过坎特伯雷全城，接受修士们的鞭笞，以背上的（皮开肉绽）作为公开的（赎罪），四年前正是他的骑士在坎特伯雷大教堂杀害了托马斯·贝克特。一些较为温和的谦卑仪式延续至今。在濯足节星期四，君主向与自己年龄同数的老年男女分发特制的银币；这一（赠授）仪式纪念基督为门徒洗脚，而君主亲自施行这种王室（洗濯礼）的最后一人是詹姆斯二世，出席的官员至今仍在腰间系着（亚麻）毛巾。主显节时，两位宫廷引座官代表国王在圣詹姆斯宫的王家礼拜堂献上黄金、乳香和没药，后两者各是一种芳香的（树脂）。这些习俗（追溯）到国王被认为比常人更接近上帝的时代，它们为君主制的辉煌（掺入）了些许谦逊。查尔斯本人的灵性追求则更为兼收并蓄：他曾多次私下前往希腊北部的阿索斯山（朝圣），那是一个由东正教修道院组成的自治半岛，他在那里祈祷和（冥想）。"}, {"en": "Faith once shaded into fear. James VI of Scotland, who inherited England's throne in 1603 and spent years trying to (conjoin) his two kingdoms in a single Great Britain, believed that witches had tried to kill him. After storms battered the ship bringing him home from Denmark with his bride in 1590, dozens of people around North Berwick were accused of forming a (coven) and raising the tempests by (malediction). James took part in the interrogations himself; the (infliction) of torture produced lurid confessions of midnight meetings with the Devil and of (stygian) rites that historians now regard as the products of pain, terror or (hallucination). The king claimed to (discern) the Devil's handiwork where others saw only foul weather, and in 1597 he published \"Daemonologie\", a (disquisition) meant to (enlighten) his subjects about matters beyond their (ken). Shakespeare's \"Macbeth\", with its weird sisters and its flattering line of kings descended from Banquo, was written partly to please him.", "zh": "信仰一度滑向恐惧。苏格兰国王詹姆斯六世于1603年继承了英格兰王位，并多年致力于把他的两个王国（合并）为一个统一的大不列颠，他相信女巫曾企图害死他。1590年，载着他和新娘从丹麦回国的船只遭风暴袭击，北贝里克一带有数十人被控结成（女巫集会），用（诅咒）掀起风暴。詹姆斯亲自参与审讯；酷刑的（施加）逼出了种种骇人听闻的供词，说她们半夜与魔鬼聚会、举行（地狱般阴森的）仪式，如今的历史学家认为，这些都是痛苦、恐惧或（幻觉）的产物。别人只看到恶劣天气的地方，国王却声称能（看出）魔鬼的手笔；1597年他出版了《恶魔学》，这是一篇（专题论述），意在就臣民（知识范围）之外的事情（启发）他们。莎士比亚的《麦克白》写到了三个女巫，还颂扬了班柯后裔一脉相承的诸王，部分就是为了取悦他。"}, {"en": "In Britain the monarch's formal powers are vast and almost never used. Royal assent, the king's (sanction) for a bill passed by Parliament, is a (ratification) that has not been refused since Queen Anne vetoed a Scottish militia bill in 1708; a modern (negation) of the elected chamber's will would provoke a (full-blown) constitutional crisis. The king's (designation) of a prime minister follows the arithmetic of the House of Commons, and his (authorization) of an election is a formality. His (discretion) is confined to what Bagehot called the right to be consulted, to encourage and to warn, exercised in (conjunction) with ministers and never in public. Within these narrow bounds of (jurisdiction) a monarch must (refrain) from opinions and (retain) the confidence of politicians of every stripe, which is why Charles's old habit of firing off letters to ministers, the so-called \"black spider memos\", alarmed constitutional purists when they were published in 2015.", "zh": "在英国，君主的正式权力范围极广，却几乎从不动用。御准，即国王对议会通过的法案的（认可），是一种（批准），自1708年安妮女王否决一项苏格兰民兵法案以来从未被拒绝过；如今若（否定）民选议院的意志，将引发一场（全面的）宪政危机。国王对首相的（任命）取决于下议院的席位算术，他对举行选举的（授权）也只是走个形式。他的（自由裁量权）仅限于白芝浩所说的被咨询、鼓励和警告的权利，而且只能与大臣们（协同）行使，绝不公开。在这一狭窄的（权限）范围内，君主必须（克制）发表意见，并（保持）各派政客的信任。正因如此，查尔斯过去那种不断给大臣写信的习惯，即所谓的“黑蜘蛛备忘录”，在2015年被公开时令宪政纯粹主义者大为警觉。"}, {"en": "The State Opening of Parliament is the purest piece of political theatre. Black Rod, an official sent to summon MPs to the Lords, has the door of the Commons slammed in his face, a ritual (obstruction) commemorating Charles I's attempt to arrest five members in 1642. The king then reads, in a carefully (deadpan) voice, a speech written by the government, which may (contain) policies he privately deplores; it is a (declamation) without endorsement, an (oration) whose every word has been chosen by others, and its references to \"my government\" are a royal (locution) rather than a statement of ownership. Delivery matters all the same. George VI struggled with a stammer and took (elocution) lessons from Lionel Logue, an Australian speech therapist, a story that won Colin Firth, an English (thespian), an Oscar in 2011.", "zh": "议会开幕大典是最纯粹的政治戏剧。黑杖侍卫是被派去召集下议院议员前往上议院的官员，下议院的大门会当着他的面砰然关上，这一仪式性的（阻挠）是为了纪念1642年查理一世企图逮捕五名议员一事。随后国王用刻意（面无表情的）语调宣读一份由政府撰写的演讲稿，其中可能（包含）他私下不以为然的政策；这是一篇并不代表其本人赞同的（宣讲），一篇字字皆由他人选定的（演说），而其中“我的政府”的说法只是一种王室（措辞），并非对所有权的宣示。尽管如此，演讲本身的表现依然重要。乔治六世为口吃所苦，曾向澳大利亚语言治疗师莱昂内尔·罗格学习（演讲术），这个故事让英国（演员）科林·费尔斯在2011年赢得了奥斯卡奖。"}, {"en": "Each June a (battalion) of Foot Guards troops its colour before the monarch on Horse Guards Parade; the junior officer who carries the flag is still called an (ensign). Elizabeth II rode side-saddle to the ceremony for decades, a feat of (equestrian) stamina, and her son now reviews the troops from a carriage while (pedestrian) crowds press against the barriers. Dress uniforms (bedizen) their wearers with gold (bullion) embroidery, and the breastplates of the Household Cavalry gleam with a mirror (sheen). The royal coat of arms, described in a heraldic (blazon) that pairs England's lion with Scotland's (unicorn), hangs in courtrooms across the land, and at the crowning in 2023 the king's hereditary (champion), whose family has held the office since the 14th century, carried the royal standard into the abbey.", "zh": "每年6月，近卫步兵的一个（营）在皇家骑兵卫队阅兵场上向君主展示军旗；擎旗的低级军官至今仍被称为（旗手）。伊丽莎白二世几十年来一直侧鞍骑马出席典礼，堪称（马术）耐力的壮举；如今她的儿子乘马车检阅部队，而（徒步的）人群挤在护栏边。礼服用金色（金银线）刺绣把穿着者（装扮得华丽耀眼），王室骑兵卫队的胸甲闪耀着镜面般的（光泽）。王室徽章悬挂在全国各地的法庭里，其正式的（纹章描述）将英格兰的狮子与苏格兰的（独角兽）配在一起；在2023年的加冕典礼上，国王的世袭（御前斗士）擎着王室旗帜走进了教堂，他的家族自14世纪起就担任此职。"}, {"en": "Words matter in this business. The English \"king\" comes from the Old English cyning, a (derivation) usually traced to cynn, meaning family or tribe. When Charles succeeded, some had expected him to choose a different regnal name, since the name carried an awkward historical (connotation): one earlier Charles had been beheaded, while another was best remembered for his mistresses. His full title in Britain, \"Charles the Third, by the Grace of God, of the United Kingdom of Great Britain and Northern Ireland and of His other Realms and Territories King, Head of the Commonwealth, Defender of the Faith\", piles up titles held together by one (preposition) after another. The Court Circular, a daily record of royal engagements published since 1803, preserves a stately (fustian) all its own, and the family has long lived by the unofficial (injunction) to \"never complain, never explain\". Rank is a matter of fine (gradation): Harry's children became a prince and a princess only when their grandfather succeeded, under rules laid down by George V in 1917. Honours are another royal currency. The Order of the Garter, founded by Edward III in 1348 and limited to 24 knights besides members of the royal family, still holds an (induction) ceremony at Windsor each June, and a few honours, such as the Order of Merit, remain in the monarch's personal gift, a (distinction) that no politician can confer.", "zh": "在这一行，措辞至关重要。英语的king一词源自古英语的cyning，一般认为这一（派生）可追溯至cynn，意为家族或部落。查尔斯继位时，有人曾以为他会另选一个王号，因为这一名字带有令人尴尬的历史（联想）：此前一位查理国王被斩首，另一位则因众多情妇而闻名。他在英国的完整称号是“蒙上帝恩典，大不列颠及北爱尔兰联合王国及其他王国和领地之国王、英联邦元首、信仰捍卫者查尔斯三世”，在英文原文中，这一长串头衔全靠一个接一个的（介词）串联起来。《宫廷公报》是自1803年起每日刊发的王室活动记录，保留着一种独有的庄重（华而不实的文风），而王室长期以来奉行“从不抱怨，从不解释”这条非正式的（训诫）。等级讲究细微的（等差）：哈里的子女直到祖父继位才成为王子和公主，依据的是乔治五世在1917年定下的规矩。荣誉是另一种王室货币。嘉德勋章由爱德华三世于1348年创立，除王室成员外，骑士名额限定为24人，至今每年6月仍在温莎举行（授勋入会）仪式；还有少数荣誉，比如功绩勋章，仍由君主亲自授予，这是任何政客都无法给予的（殊荣）。"}, {"en": "A brief (digression) on birds and beasts. At the Tower of London a Yeoman Warder known as the Ravenmaster, a (warden) of birds rather than prisoners, looks after at least six ravens, fed on raw meat rather than the (carrion) their wild cousins scavenge, because legend holds that if they ever leave the Tower the kingdom will fall. The story is probably a Victorian (yarn), but nobody is keen to test it. Every night the guards (fasten) the gates in the Ceremony of the Keys, as they have for some seven centuries, although the moat that used to (environ) the fortress was drained in the 1840s. Gibraltar has a (simian) version of the legend: as long as the Barbary macaques remain on the Rock it will stay British, and in 1944 Churchill ordered their dwindling numbers to be topped up. The monarch's claims on wildlife are a tangled (skein) of medieval law. Unmarked mute swans on open water belong to the king, and every July his Swan Marker counts the cygnets on the Thames; whales and sturgeon stranded on the coast are still \"royal fish\" under a 14th-century statute, though no monarch has sent anyone after one with a (harpoon).", "zh": "说点（题外话），谈谈鸟兽。在伦敦塔，一位被称为“渡鸦大师”的皇家卫士负责照料至少六只渡鸦，他是鸟儿而非囚犯的（看守）；渡鸦吃的是生肉，而不是它们的野生同类所搜寻的（腐肉），因为传说一旦它们离开伦敦塔，王国就会覆灭。这个故事很可能是维多利亚时代编出来的（奇谈），但没人想去验证。每天夜里，卫兵们都会在钥匙仪式中（锁上）大门，大约七个世纪以来一直如此，尽管曾经（环绕）这座要塞的护城河早在19世纪40年代就已排干。直布罗陀则有一个（猿猴的）版本：只要巴巴里猕猴还留在这块巨岩上，它就会一直属于英国；1944年，丘吉尔下令补充日益减少的猕猴数量。君主对野生动物的权利是一团纠缠不清的中世纪法律（乱麻）。开阔水域上没有标记的疣鼻天鹅归国王所有，每年7月，他的天鹅标记官都会在泰晤士河上清点小天鹅；根据14世纪的一项法令，搁浅在海岸上的鲸鱼和鲟鱼至今仍是“王室之鱼”，尽管从来没有哪位君主派人带着（鱼叉）去追捕它们。"}, {"en": "The regalia kept in the Tower have a turbulent history of their own. In 1642 Queen Henrietta Maria took royal jewels to the Netherlands and pawned them, leaving the lenders a (lien) on the family's treasures, to buy (munition) supplies for her husband's war against Parliament. After Charles I's execution the republic had the ancient regalia broken up and their gold rendered (molten) at the Mint, so almost everything on display today dates from after 1660. In 1671 Colonel Thomas Blood, an Irish (desperado), recruited a (ruffian) and other accomplices to (purloin) the new regalia, flattening the king's diadem with a mallet to hide it under a cloak; caught, Blood escaped (condign) punishment and was instead pardoned by Charles II and granted Irish land, for reasons never explained. The Imperial State Crown, which the king wears at the State Opening of Parliament, is set with 2,868 diamonds, 17 sapphires, 11 emeralds, 269 pearls and four rubies. To conservators, an unwanted mineral (incrustation) on historic metalwork is a different sort of ornament altogether. The Koh-i-Noor diamond, surrendered to Queen Victoria after Britain conquered the Punjab in 1849, remains a source of (friction) with India, whose politicians periodically demand its (restitution); for her crowning in 2023 Queen Camilla prudently chose a crown without it.", "zh": "存放在伦敦塔中的王室宝器自有一段动荡的历史。1642年，亨丽埃塔·玛丽亚王后把王室珠宝带到荷兰典当，让放贷者对这些珍宝享有（留置权），以便为丈夫对议会的战争购置（军需）物资。查理一世被处决后，共和政府下令拆毁古老的王室宝器，其中的黄金在铸币厂被化为（熔融的）金液，因此如今展出的几乎所有物件都是1660年以后制作的。1671年，爱尔兰（亡命之徒）托马斯·布拉德上校招募一名（恶棍）及其他同伙，企图（盗取）新制的王室宝器，他们用木槌把国王的冠冕砸扁，好藏进斗篷里；布拉德被捕后非但没有受到（应得的）惩罚，反而得到查理二世赦免，还获赐爱尔兰的土地，个中原因始终无人知晓。国王在议会开幕大典佩戴的帝国王冠镶有2868颗钻石、17颗蓝宝石、11颗祖母绿、269颗珍珠和4颗红宝石。对文物保护人员来说，历史金属器物表面不必要的矿物（结壳）则是完全不同的一种“装饰”。1849年英国征服旁遮普后被献给维多利亚女王的光之山钻石，至今仍是与印度之间（摩擦）的一个根源，印度政界人士不时要求将其（归还）；在2023年的加冕典礼上，卡米拉王后审慎地选择了一顶没有镶这颗钻石的王冠。"}, {"en": "Then there is the money. The king's official expenses are met by an annual grant from the Treasury, set as a share of the profits of a vast state-owned property portfolio that includes most of the seabed around Britain. When leases for offshore wind farms sent those profits soaring, the grant was on course to double, so the government cut the share from 25% to 12% to avoid an embarrassing (augmentation). For 2026-27 the grant is £137.9m, or nearly £2 per UK resident. That calculation is not a (capitation) tax: monarchists hail the figure as a (bargain), while republicans call it a (misrepresentation) of the true cost, which also includes security and the income of the duchies of Lancaster and Cornwall. The monarch has paid income tax since 1993 of his own (volition) rather than by law, and the duchies' exemption from corporation tax remains a bone of (contention). Monarchists argue that the whole public (subvention) is a (fraction) of what tourism brings in; republicans retort that no independent (evaluation) has ever proved it.", "zh": "接下来是钱的问题。国王的公务开支由财政部每年拨付的一笔款项支付，其数额按一个庞大的国有地产组合的利润比例确定，这个组合包括英国周边的大部分海床。当海上风电场的租约使这些利润飙升、拨款眼看就要翻倍时，政府把比例从25%下调到12%，以避免一次令人尴尬的（增加）。2026—27财年的王室拨款为1.379亿英镑，折合英国每位居民将近2英镑。但这只是人均比较，并不是（按人头征收的税）；君主制拥护者认为这一数额很（划算），共和派则称其为对真实成本的（歪曲），因为还应计入安保费用以及兰开斯特和康沃尔两个公爵领地的收入。自1993年起，君主出于自己的（意愿）而非法律规定缴纳所得税，而公爵领地免缴公司税的问题仍是一个（争议）焦点。君主制拥护者辩称，全部公共（补贴）只是旅游业所带来收入的一个（零头）；共和派则反驳说，从来没有任何独立（评估）证明过这一点。"}, {"en": "The monarchy's assets are as much cultural as financial. The Royal (collection), held in trust for the nation, includes drawings by Leonardo, Sèvres (porcelain) and thousands of paintings. Buckingham Palace is near the end of a ten-year, £369m overhaul of its wiring and plumbing, begun after an (inspection) revealed decades of (dilapidation) and (deterioration). When fire gutted part of Windsor Castle in 1992, the cause was not (arson) but a restorer's spotlight that set a curtain ablaze; public anger over who should pay for the repairs persuaded the Queen to open Buckingham Palace to paying visitors, and (admission) fees now help fund the upkeep. Palaces, the Changing of the Guard and the jewels in the Tower of London are central to Britain's tourist (equation), though nobody can say how many visitors would stop coming if the family left.", "zh": "君主制的资产既是财务上的，也是文化上的。为国家托管的皇家（收藏）包括达·芬奇的素描、塞夫勒（瓷器）和数以千计的画作。白金汉宫一项耗资3.69亿英镑、为期十年的电线和管道翻修工程已近尾声，该工程的起因是一次（检查）发现了数十年的（年久失修）和（老化）。1992年大火烧毁温莎城堡的一部分，起因并非（纵火），而是一名修复人员的聚光灯点燃了窗帘；公众对修缮费用该由谁承担的愤怒，促使女王向付费游客开放白金汉宫，如今（门票）收入帮助支付维护费用。宫殿、卫兵换岗仪式和伦敦塔中的珠宝是英国旅游业这道（算式）的核心，尽管没人说得清，如果王室离开，会有多少游客不再前来。"}, {"en": "Royal events are also a national brand. For the Platinum Jubilee in 2022, communities across Britain and the Commonwealth lit more than 3,000 ceremonial fires, each (beacon) marking the celebration, and street parties filled (metropolitan) London and village greens alike, a moment of shared (exhilaration) in a fractious country. Foreign tourists come for the (delectation) of pageantry, visiting dignitaries for the (gratification) of a state banquet at which every guest is in white tie or at least a (tuxedo), and the media for the (sensation) of a royal row. Critics find the whole show (timeworn) and its rhetoric (shopworn), a nostalgic re-enactment of the (halcyon) days of empire; even admirers can find the coverage (saccharin) and, after a royal death, (maudlin). Above the (din), the business of monarchy carries on.", "zh": "王室活动也是一个国家品牌。2022年白金禧庆典期间，英国和英联邦各地燃起3000多处庆典火光，每一处（烽火信标）都象征着这一盛事，街头派对遍布（大都市的）伦敦和乡村绿地，让一个纷争不断的国家共享了片刻（欢欣）。外国游客为欣赏盛典的（乐趣）而来，来访政要为国宴的（满足感）而来，国宴上每位宾客都身着白领结礼服，至少也得穿（无尾礼服），媒体则为王室纷争的（轰动效应）而来。批评者认为整场表演（陈旧过时），其辞藻（陈腐），不过是对帝国（太平盛世的）怀旧重演；就连拥护者也会觉得相关报道（甜得发腻），而在王室成员去世后又显得（过分伤感）。在一片（喧嚣）之上，君主制的事务照常进行。"}, {"en": "Royal portraits have always been propaganda. Nicholas Hilliard, Elizabeth I's favourite miniaturist, could (limn) the queen as an ageless beauty long after she had ceased to be one. George III appointed John Russell his \"(crayon) painter\" in 1790, when pastel portraits were still called crayons, and in Madrid Giambattista Tiepolo covered the ceiling of the throne room of the royal palace with a (fresco) glorifying the Spanish monarchy. Modern portraits are riskier. When Jonathan Yeo's first official portrait of Charles as king was unveiled in 2024, its (coloration), a wash of fiery red from which the king's face emerges, divided critics; some chose to (pan) it, and animal-rights activists later pasted a cartoon over the face, but others admired a work that went against the (grain) of reverent royal portraiture. Charles is himself a capable watercolourist, an (avocation) he has pursued for decades; prints of his landscapes have raised millions for charity, and they leave the (impression) of a man happiest alone in a Scottish glen.", "zh": "王室肖像向来是宣传品。伊丽莎白一世宠爱的细密画家尼古拉斯·希利亚德，在女王早已不再年轻美貌之后，仍能把她（描绘）成青春永驻的美人。1790年，乔治三世任命约翰·拉塞尔为他的“（蜡笔）画师”，当时粉彩肖像仍被称为蜡笔画；在马德里，詹巴蒂斯塔·提埃坡罗在王宫王座厅的天花板上绘制了一幅颂扬西班牙君主制的（湿壁画）。现代肖像则风险更大。2024年，乔纳森·约为查尔斯创作的首幅国王官方肖像揭幕，其（色调）是一片火红，国王的面孔从中浮现，评论界意见分歧；有人选择（狠批）这幅画，后来还有动物权益活动人士在画中人脸上贴了一张卡通图，但也有人欣赏它敢于违背王室肖像画毕恭毕敬的（常理）。查尔斯本人就是一位颇有水准的水彩画家，这是他坚持了几十年的（业余爱好）；他的风景画复制品已为慈善事业筹得数百万英镑，这些画给人的（印象）是，他独自待在苏格兰幽谷时最为快乐。"}, {"en": "The family also lends its name to commerce and charity. Some 800 firms hold royal warrants, a (certification) that they supply goods or services to the royal households; an (application) can be made only after five years of regular trade, and warrants are reviewed when the monarch who granted them dies. Thomas Crapper, a Victorian plumber whose (cistern) designs were installed at Sandringham, held one, as do makers of everything from marmalade to wellington boots. Elizabeth II's (predilection) for horses made her a fixture at Royal Ascot, founded by Queen Anne in 1711, where champagne still flows by the (gallon). The family's (affiliation) with some 3,000 charities, regiments and professional bodies forms a dense (reticulation) of patronage that reaches into every corner of national life, and each reshuffle of royal patronages is watched anxiously by the organisations concerned.", "zh": "王室还把自己的名号借给商业和慈善事业。约有800家企业持有王室供货许可，这是一种（认证），证明它们为王室各宫府供应商品或服务；企业须与王室有五年的常规交易后方可提出（申请），而授予许可的君主去世后，这些许可都要重新审核。维多利亚时代的水管工托马斯·克拉珀也持有一份，他设计的（抽水马桶水箱）曾安装在桑德林汉姆府；如今的持证者从橘子酱到威灵顿雨靴的生产商无所不包。伊丽莎白二世对马匹的（偏爱）使她成为皇家阿斯科特赛马会的常客，这项赛事由安妮女王于1711年创办，至今香槟仍以（加仑）计地流淌。王室与约3000家慈善机构、军团和专业团体的（隶属关系），构成了一张触及国民生活方方面面的赞助（网状联系），每一次王室赞助职位的调整，相关机构都会紧张关注。"}, {"en": "The relationship between royals and reporters is one of mutual dependence laced with loathing. Satirists (lampoon) them: \"Spitting Image\", a puppet show of the 1980s and 1990s, turned the Queen Mother into a gin-loving (clown) and the future king into a man who talked to his plants. The tabloids trade in (innuendo) and the cheap (pun); the (doyen) of royal correspondents competes for scoops with every Instagram (maven), while an anonymous (denizen) of an online forum can (spawn) a conspiracy theory at any hour. A paparazzo could behave like a (rapscallion) in pursuit of a picture; photographers hounded Diana until her death in a car crash in Paris in 1997. The palace replies in a (jargon) all its own, of \"working royals\" and \"the Firm\", and occasionally with a (brazen) legal threat. Prince Harry's long campaign against the tabloids, which won him an apology and damages from the publisher of the Sun in January 2025, was waged with considerable (bravado); his interview with Oprah Winfrey in 2021 threatened to (torpedo) the family's standing in America and unleashed a (tornado) of publicity, much to the palace's (chagrin). \"Spare\", written with the help of a ghostwriter's (pen), sold more than a million copies on its first day.", "zh": "王室与记者之间的关系是一种夹杂着厌恶的相互依存。讽刺作家们（讽刺挖苦）王室：上世纪八九十年代的木偶剧《一模一样》把王太后塑造成一个嗜好杜松子酒的（小丑），把未来的国王塑造成一个跟植物说话的人。小报靠（含沙射影）和廉价的（双关语）做买卖；王室新闻记者中的（元老）要与每一位照片墙（达人）争抢独家新闻，而某个网络论坛的匿名（常客）随时都可能（炮制）出一套阴谋论。为了抢拍照片，狗仔摄影师有时会像个（无赖）；摄影师们不断追逐戴安娜，直至她1997年在巴黎因车祸去世。王宫则以一套自成一体的（行话）回应，诸如“在职王室成员”和“公司”之类，偶尔也会发出（厚颜无耻的）法律威胁。哈里王子长期与小报作战，2025年1月赢得了《太阳报》出版商的道歉和赔偿，他打这场仗时颇为（大胆逞强）；他在2021年接受奥普拉·温弗瑞的采访，险些（重创）王室在美国的声望，掀起了一场舆论（风暴），令王宫大为（懊恼）。《备胎》借助一位代笔人之（笔）写成，首日销量便超过一百万册。"}, {"en": "In March 2024 the Princess of Wales released a family photograph that news agencies withdrew within hours after the (detection) of clumsy editing; the (caption) said it had been taken by Prince William, but the image had plainly been altered, and she apologised for \"any confusion\". No great (deception) was intended, but the episode, to the palace's evident (irritation), fed a frenzy of online speculation, including an unwarranted (imputation) of wrongdoing; the rumours subsided only when she revealed her cancer diagnosis in a video message a fortnight later.", "zh": "2024年3月，威尔士王妃发布了一张全家福，几小时内各通讯社就在（发现）拙劣的修图痕迹后撤下了照片；（图片说明）称照片由威廉王子拍摄，但图像显然经过修改，她为造成的“任何困惑”道歉。此举并无多大（欺骗）之意，但这一事件引发网上的疯狂猜测，其中包括毫无根据的（归罪推断），令王宫显然十分（恼怒）；直到两周后她通过视频讲话公布自己的癌症诊断，传言才渐渐平息。"}, {"en": "Harry and his wife, Meghan, announced their (resignation) as working royals in January 2020 and moved to California, a step their critics called (desertion) and their supporters a necessary (dissociation) from a hostile press. Each side has since accused the other of (retaliation): interviews, a Netflix series, the memoir. The palace showed little (compunction) in stripping the couple of honorary military roles, and Harry has called the family's silence about what he regards as a serious press (transgression) a betrayal. Talk of reconciliation between father and son has grown since their meeting last year, and genuine rapprochement may require (reparation) for earlier grievances; meanwhile, each new interview is still read as a (provocation).", "zh": "2020年1月，哈里和妻子梅根宣布（辞去）在职王室成员身份，移居加利福尼亚；批评者称此举为（背弃），支持者则认为这是与充满敌意的媒体必要的（切割）。此后双方都指责对方实施（报复）：采访、网飞纪录剧、回忆录。王宫毫无（愧疚）地剥夺了这对夫妇的荣誉军职，哈里则认为，王室对他眼中媒体严重的（越轨行为）保持沉默，无异于背叛。自去年父子会面以来，外界关于和解的议论增多，真正修复关系或许还需要为以往的伤害作出（补偿）；与此同时，每一次新的采访仍会被解读为一种（挑衅）。"}, {"en": "The modern monarchy is also a show staged for the cameras. The (configuration) of the Buckingham Palace balcony after Trooping the Colour, who stands where and who is left off, is scrutinised like a Kremlin parade; in 2022 only working royals were invited onto it. As the Red Arrows roared overhead in (formation) at the Platinum Jubilee, four-year-old Prince Louis, covering his ears and pulling faces beside his great-grandmother, stole the show with a cheeky (grin). A lavish Netflix drama about the Queen's life, which ran from 2016 to 2023, shaped how millions abroad see the family, though its (characterization) of real people blended fact with invention. Social-media platforms built for the (optimization) of engagement reward outrage, and royal stories, true or false, travel fast. Like the (scorpion) in the fable, which stings the frog carrying it across a river and drowns them both, the tabloids and the royals seem unable to help themselves, though each needs the other to stay afloat.", "zh": "现代君主制也是一场为镜头上演的表演。军旗敬礼分列式之后白金汉宫阳台上的（站位布局），即谁站在哪里、谁被排除在外，像克里姆林宫阅兵一样受人细细审视；2022年，只有在职王室成员获邀登上阳台。白金禧庆典上，红箭飞行表演队以（编队）呼啸掠过上空时，四岁的路易王子站在曾祖母身旁捂着耳朵、扮着鬼脸，一个调皮的（咧嘴笑）抢尽了风头。一部讲述女王生平的网飞豪华剧集从2016年播到2023年，塑造了海外数以百万计观众对王室的看法，尽管它对真实人物的（刻画）真假掺杂。为（优化）用户参与度而打造的社交媒体平台助长了愤怒情绪，王室新闻无论真假都传播得飞快。就像寓言里那只在过河途中蜇了驮着它的青蛙、结果两者一同淹死的（蝎子），小报和王室似乎都身不由己，尽管彼此都需要对方才能浮在水面上。"}, {"en": "Fame brings danger. In 1974 a gunman tried to kidnap Princess Anne in the Mall, wounding four people; ordered out of her car, she did not (deign) to comply, replying that it was \"not bloody likely\". In 1982 Michael Fagan, an unemployed decorator, climbed into Buckingham Palace and found his way into the Queen's bedroom, an embarrassing (penetration) of its defences. Royal protection is now far more elaborate, from armed officers to teams that rely on canine (olfaction) to detect explosives before a visit. Yet a monarchy that lives in a (cocoon) of security cannot afford to (shun) the crowds. \"I have to be seen to be believed,\" Elizabeth II is supposed to have said, and being seen is the point of the job.", "zh": "名气带来危险。1974年，一名持枪歹徒企图在林荫路上绑架安妮公主，打伤了四人；歹徒命她下车，她根本不（屑于）理会，回答说“门儿都没有”。1982年，失业的装修工迈克尔·费根翻进白金汉宫，一路摸进了女王的卧室，这次对宫廷防卫的（突破）令人难堪。如今王室的安保要周密得多，既有武装警察，也有依靠犬类敏锐（嗅觉）排查爆炸物的安保小组。然而，一个生活在安保（茧房）中的君主制，承受不起（回避）人群的代价。据说伊丽莎白二世曾说：“我必须被人看见，人们才会相信。”被人看见，正是这份工作的意义所在。"}, {"en": "The kings of the 20th century were a mixed lot. George V, a gruff stickler, gave up £50,000 a year of his official income during the economic (depression) of the early 1930s, and in 1917 swapped the family's German name, Saxe-Coburg and Gotha, for Windsor. His eldest son, Edward VIII, abdicated in 1936 to marry Wallis Simpson, a twice-divorced American, a (dereliction) of duty in the eyes of his family; his visit to Hitler in 1937 and his flirtation with Nazi Germany have earned him lasting (execration). His shy, stammering brother, George VI, became a symbol of wartime defiance, refusing to leave Britain even after Buckingham Palace was bombed. He created the George Cross for civilian gallantry and in 1942 awarded it to the whole island of Malta, the (citation) honouring \"a heroism and devotion that will long be famous in history\". His worst misstep came in 1938, when he invited Neville Chamberlain onto the palace balcony to acknowledge the cheers for the Munich agreement, endorsing a policy that history would judge (craven) before Parliament had even debated it. His widow, Queen Elizabeth the Queen Mother, was nobody's idea of a (valetudinarian): she lived to 101, retaining a cheerful (disposition) and a taste for her favourite (potation), gin and Dubonnet.", "zh": "20世纪的几位国王良莠不齐。粗暴而一丝不苟的乔治五世在20世纪30年代初的经济（萧条）期间，每年放弃5万英镑的官方收入；1917年，他把王室的德国姓氏萨克森-科堡-哥达改为温莎。他的长子爱德华八世于1936年退位，以迎娶离过两次婚的美国人沃利斯·辛普森，在家人眼中这是一种（失职）；他1937年拜访希特勒、与纳粹德国眉来眼去，令他至今饱受（唾骂）。他那个腼腆、口吃的弟弟乔治六世成了战时不屈的象征，即使白金汉宫遭到轰炸，也拒绝离开英国。他设立了表彰平民英勇行为的乔治十字勋章，并于1942年将其授予整个马耳他岛，（嘉奖令）中称颂“一种必将长久名垂青史的英雄气概与献身精神”。他最大的失误发生在1938年：他邀请内维尔·张伯伦登上王宫阳台接受民众对《慕尼黑协定》的欢呼，在议会尚未辩论之前，就为一项后来被历史判定为（怯懦的）政策背书。他的遗孀伊丽莎白王太后绝不是人们心目中那种（过分担忧健康的人）：她活到101岁，依旧保持着开朗的（性情），也一直钟爱她最喜欢的（酒饮）——杜松子酒兑杜宝内酒。"}, {"en": "Elizabeth II set the template for modern monarchy. She grew up amid wartime (privation), trained as a driver and mechanic in the women's branch of the army in 1945, and bought the material for her wedding dress with ration coupons. On her 21st birthday, in a broadcast from Cape Town in 1947, she declared that her \"whole life, whether it be long or short\" would be devoted to the service of her people, a sense of (vocation) she never abandoned. She was a constitutional (greenhorn) of 25 when she succeeded her father in 1952, and Churchill, her first prime minister, was old enough to be her grandfather. Over the decades her impassive (mien) became part of the national furniture, and her (inborn) caution was matched by an (aversion) to publicity: she never gave an interview. Royals by convention practise (abstention) at the ballot box, and her political views remained unknown; the nearest thing to a (deviation) came in 2014, when she told a well-wisher outside church before Scotland's independence referendum that she hoped people would \"think very carefully about the future\". She also changed the way royals meet the public: the walkabout, introduced on a tour of Australia and New Zealand in 1970, replaced distant waves with direct (interaction).", "zh": "伊丽莎白二世为现代君主制树立了范本。她在战时的（匮乏）中长大，1945年在陆军女子部队接受了司机和机修工训练，结婚时还用配给券购买婚纱面料。1947年21岁生日那天，她在开普敦发表广播讲话，宣布她的“一生，无论长短”都将献给为人民服务的事业，这种（使命感）她从未放弃。1952年继承父亲王位时，她还是个25岁的宪政（新手），而她的第一任首相丘吉尔的年纪足以当她的祖父。几十年间，她那不动声色的（神态）成了国家固定陈设的一部分，她（天生的）谨慎与对公开曝光的（反感）相得益彰：她从未接受过采访。按照惯例，王室成员在投票时（弃权），她的政治观点始终无人知晓；最接近（偏离）中立的一次发生在2014年，苏格兰独立公投前，她在教堂外对一位祝福者说，希望人们“非常认真地思考未来”。她还改变了王室与公众见面的方式：1970年出访澳大利亚和新西兰时首创的徒步接见民众，以直接的（互动）取代了远远的挥手。"}, {"en": "Her worst decade was the 1990s. In 1992, which she called her \"annus horribilis\", the marriages of three of her four children broke down and Windsor Castle burned, and the years of (tribulation) that followed were dominated by the war of the Waleses. Diana, whose (compassion) was evident when she shook hands with an AIDS patient without gloves in 1987 and walked through an Angolan minefield ten years later, became the most photographed woman in the world and the object of a tabloid (obsession) that pursued her to her death. When she was killed in Paris in August 1997 the royal family stayed at Balmoral, and a week of furious (castigation) followed — \"Show us you care\", demanded one front page — until the Queen returned to London and, in a live broadcast, paid tribute to Diana as the nation gathered to (mourn). A carpet of perhaps a million bouquets outside Kensington Palace seemed to (betoken) a more emotional Britain, and a monarchy that would have to learn to show its feelings. When Britannia, the royal yacht, was decommissioned that December, a tear came (unbidden) to the Queen's eye, one of the few times she was seen to weep in public.", "zh": "她最糟糕的十年是20世纪90年代。1992年被她称为“可怕的一年”，她四个子女中有三个的婚姻破裂，温莎城堡失火，随后几年的（磨难）主要围绕威尔士亲王夫妇之间的战争展开。戴安娜的（同情心）显而易见：1987年她不戴手套与一名艾滋病患者握手，十年后又走过安哥拉的雷区。她成了世界上被拍照最多的女性，也成了小报（痴迷）的对象，小报一路追逐她，直到她死去。1997年8月她在巴黎遇难后，王室成员留在巴尔莫勒尔，随之而来的是一周的猛烈（抨击），一家报纸在头版上要求“让我们看到你们在乎”，直到女王返回伦敦，在直播讲话中向戴安娜致敬，与聚集起来（哀悼）的国民同悲。肯辛顿宫外铺满了也许多达百万束的鲜花，似乎（预示）着一个更加感情外露的英国，以及一个必须学会表达感情的君主制。同年12月，王室游艇“不列颠尼亚”号退役时，女王眼中（不由自主地）泛起了泪光，这是她为数不多的几次被人看到当众落泪。"}, {"en": "When the Queen died at Balmoral in September 2022, aged 96, plans drawn up over decades under the code name Operation London Bridge swung into action with remarkable (prevision). Parliament would (adjourn) its normal business for the period of national mourning; some 250,000 people queued, many of them for the best part of a day, to file past her coffin in Westminster Hall; and after her funeral in Westminster Abbey the procession moved off to the slow (pulsation) of muffled drums. It felt like the (summation) of an era. She was buried with her husband, parents and sister in a side chapel of St George's at Windsor. Spain's monarchs face a grimmer rite: their bodies are left for decades in a chamber called the pudridero, the \"rotting room\", at El Escorial, the monastery-palace that Philip II built, by tradition in the shape of a (gridiron) in honour of St Lawrence, until (decomposition) is complete; only then are the bones laid in the royal (pantheon) beneath its basilica.", "zh": "2022年9月，96岁的女王在巴尔莫勒尔去世，代号“伦敦桥行动”、筹划了数十年的方案随即启动，其（预先筹划能力）令人惊叹。议会在全国哀悼期间（暂停）日常事务；约25万人排起长队，许多人排了大半天，只为在威斯敏斯特大厅瞻仰她的灵柩；在威斯敏斯特教堂举行葬礼后，送葬队伍伴着蒙布鼓缓慢的（节拍）启程。这感觉像是一个时代的（总结）。她与丈夫、父母和妹妹一同安葬在温莎圣乔治礼拜堂的一间侧堂里。西班牙君主则要经历一种更阴森的仪式：他们的遗体要在埃斯科里亚尔一间名为“腐化室”的墓室里停放数十年，直到（腐烂分解）完毕，只有到那时，遗骨才会被安放到大教堂下方的王室（陵殿）中；埃斯科里亚尔是腓力二世修建的修道院兼王宫，相传为纪念圣劳伦斯而建成（烤架）的形状。"}, {"en": "The supporting cast has rarely been dull. Prince Philip, a (stern) father who sent Charles to Gordonstoun, a Scottish boarding school of cold showers and early-morning runs that the boy loathed, chafed at his subordinate role. When the Queen decided in 1952 that her children would bear the name Windsor, he complained that he was the only man in the country not allowed to give his name to his own children, and went on to (liken) himself to \"a bloody amoeba\". A compromise came in 1960: descendants without royal titles now bear the surname Mountbatten-Windsor, the (hyphen) a belated nod to their forebear. In 2019, aged 97, he was involved in a (collision) near Sandringham that overturned his Land Rover; he emerged without so much as an (abrasion) but gave up his driving licence weeks later. His sister-in-law, Princess Margaret, was the family's (bohemian). In 1955 she resisted the (temptation) of marriage to Peter Townsend, a divorced war hero, citing the church's teaching on marriage and her duty to the Commonwealth. Her (liaison) in the 1970s with Roddy Llewellyn, a landscape gardener 17 years her junior, conducted partly on the Caribbean island of Mustique, where she spent winters acquiring a (tan) and holding court, caused the palace acute (mortification) and hastened her divorce from Lord Snowdon in 1978. She treated protocol with (disdain) when it suited her and insisted on it when it did not.", "zh": "配角们也很少乏味。菲利普亲王是一位（严厉的）父亲，他把查尔斯送进了戈登斯顿，那是一所以冷水淋浴和清晨长跑著称、令这个男孩深恶痛绝的苏格兰寄宿学校；而他本人则对自己的从属角色愤愤不平。1952年女王决定子女沿用温莎这个姓氏时，他抱怨说自己是全国唯一一个不能让孩子随父姓的男人，还把自己（比作）“一只该死的变形虫”。1960年双方达成妥协：没有王室头衔的后代如今姓蒙巴顿-温莎，这个（连字符）是对其先人迟来的致意。2019年，97岁的他在桑德林汉姆附近卷入一起（撞车事故），所驾驶的路虎翻倒；他连一点（擦伤）都没有，但几周后交出了驾照。他的小姨子玛格丽特公主是王室中的（放荡不羁者）。1955年，她抵住了与离过婚的战斗英雄彼得·汤森结婚的（诱惑），理由是教会关于婚姻的教导以及她对英联邦的责任。上世纪70年代，她与比她小17岁的园林设计师罗迪·卢埃林发生了一段（私情），部分是在加勒比海的马斯蒂克岛上进行的，她每年冬天都在那里晒出一身（古铜色肤色）、召集宾客，这令王室极为（难堪），也加速了她在1978年与斯诺登勋爵离婚。她对礼节的态度全凭自己方便：想无视时便（不屑一顾），不想无视时又坚持要求别人遵守。"}, {"en": "Charles spent more than half a century as heir to the throne, and filled the time with causes. Many were mocked. He admitted in 1986 to talking to his plants, and for decades he was derided as a crank for warning about plastic in the oceans, the (deforestation) of the tropics and the (degradation) of soils by chemical farming; most of those warnings now look prescient. At Highgrove, his Gloucestershire home, the Duchy Home Farm went organic in the mid-1980s: crops (ripen) without synthetic pesticides, cattle (fatten) on grass and clover, a (herdsman) tends the herd, and the farm's fields and a restored (barn) have become a showcase for organic methods. He is an evangelist for compost, which turns (rotten) vegetables and garden clippings into rich soil, and he keeps bees, which pack nectar and (pollen) from his wild-flower meadows into neat waxen cells, each a near-perfect (hexagon); when his mother died, the royal beekeeper went to tell the bees, as old custom demands. He has long promoted the (propagation) of old varieties of fruit and vegetables that supermarkets neglect, and in Highgrove's woodland garden a (fern) grows among the upturned roots of a \"stumpery\". For his mother's Platinum Jubilee the Queen's Green Canopy urged Britons to plant trees, from oaks grown from the (acorn) to the quaking (aspen), and more than a million went into the ground. Even his Aston Martin, a 21st-birthday present from his mother, runs on fuel made by the (fermentation) of surplus English white wine and whey left over from cheese-making.", "zh": "查尔斯当了半个多世纪的王储，把这段时间都投入到了各项事业中。其中许多曾遭嘲笑。1986年，他承认自己会跟植物说话；几十年来，他因警告海洋中的塑料、热带地区的（森林砍伐）以及化学农业造成的土壤（退化）而被嘲为怪人，如今这些警告大多显得颇有先见之明。在他位于格洛斯特郡的海格罗夫庄园，公爵领地家庭农场于上世纪80年代中期转为有机经营：庄稼不用合成农药也能（成熟），牛群靠吃青草和三叶草（长膘），一位（牧人）照料着牛群，农场的田地和一座修复过的（谷仓）已成为展示有机耕作方法的场所。他热衷于推广堆肥，堆肥能把（腐烂的）蔬菜和园艺修剪物变成肥沃的土壤；他还养蜂，蜜蜂把从他的野花草甸采来的花蜜和（花粉）储存在整齐的蜡质巢房里，每个巢房的形状都近似一个规则（六边形）；他母亲去世时，王室养蜂人按照古老习俗去“告知蜜蜂”。他长期提倡（繁育）被超市冷落的老品种水果和蔬菜，在海格罗夫的林地花园里，一株（蕨类植物）生长在“树桩园”朝天的树根之间。为庆祝母亲的白金禧，“女王的绿色华盖”计划号召英国人植树，从由（橡子）长成的橡树到颤动的（山杨），种下了一百多万棵。就连他的阿斯顿·马丁，母亲送他的21岁生日礼物，烧的也是用多余的英国白葡萄酒和奶酪制作中剩下的乳清（发酵）制成的燃料。"}, {"en": "His views on architecture made him enemies. In 1984 he told the Royal Institute of British Architects that a proposed extension to the National Gallery looked like \"a monstrous carbuncle on the face of a much-loved and elegant friend\", and the design was dropped. In 1987 he observed that when the Luftwaffe knocked down the buildings around St Paul's Cathedral, \"it didn't replace them with anything more offensive than rubble\". To many architects he was a (curmudgeon) whose interventions would (coarsen) debate and frighten off developers; yet many of the (utilitarian) post-war tower blocks he deplored have since met with (demolition), which suggests that he was not wholly wrong. In \"A Vision of Britain\", a book and television documentary of 1989, he tried to (envision) an alternative of human-scale streets, local materials, (plain) façades and classical proportions. Poundbury, an extension of Dorchester built on his land since 1993, is the result; critics deride it as a Georgian (imitation) lacking in (sophistication), though its residents seem to like it. His foundation helps each aspiring (artisan) learn a traditional craft, from plastering and thatching to stonework; it teaches a (mason) how to (roughen) the faces of stone blocks into rustication, and his School of Traditional Arts teaches Islamic and other sacred patterns with the rigour of a (geometrician). In 2009 he wrote privately to a member of Qatar's ruling family, whose property company then withdrew a modernist scheme by Lord Rogers for the former Chelsea Barracks
