<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eternal city, mortal cares — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  .book-subtitle {
    font-size: 1.02rem;
    color: var(--muted);
    font-style: italic;
    margin: 0 0 10px;
  }
  .zh-subtitle {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 0.92rem;
    margin-top: 6px;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>Eternal city, mortal cares</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "Eternal city, mortal cares", "zh": "永恒之城，凡人之忧"}, {"en": "Rome is caught between an ailing pope, a tide of pilgrims and the weight of its own history. It is easier to admire than to run", "zh": "罗马被夹在一位抱恙的教皇、潮水般的朝圣者与自身历史的重压之间。欣赏它，比治理它容易"}, {"en": "For the second time in two years, the world's attention has turned to a hospital on Rome's Monte Mario. On October 13th Pope Leo XIV, who is 71, underwent surgery at the Gemelli to remove the lower lobe of his right lung after doctors detected a small, localised nodule at a very early stage. Vatican officials were quick to (affirm) that the operation had gone as planned, and then to (confirm) that tests identified the growth as lung adenocarcinoma. Television networks rushed to (install) cameras at the hospital gates, and pilgrims left the odd (chrysanthemum) beside them. Romans, who spent 38 days in early 2025 waiting for news of Pope Francis's double pneumonia at the same hospital, have grown used to such vigils; the (funereal) mood of that spring, which ended with Francis's death on Easter Monday and his (burial) in the basilica of Santa Maria Maggiore, still lingers. The operation, the Vatican says, was a success. But the episode has revived a (perennial) question: how should a church of 1.4bn souls be governed when its head is in a hospital bed?", "zh": "两年之内第二次，全世界的目光投向了罗马马里奥山上的一家医院。10月13日，71岁的教皇利奥十四世在杰梅利医院接受手术：医生此前在很早的阶段发现一个局限性肺结节，此次手术切除了他的右肺下叶。梵蒂冈官员迅速（郑重表示）手术按计划顺利完成，随后（证实）检查结果为肺腺癌。各电视网急忙在医院门口（架设）摄像机，朝圣者在门边留下零星的（菊花）。2025年初，罗马人曾在同一家医院外守候了38天，等待方济各教皇双侧肺炎的消息，对这样的守候早已习以为常；那年春天（如同葬礼般的）气氛——以方济各在复活节星期一辞世、（安葬）于圣母大殿而告终——至今仍未散去。梵蒂冈称手术是成功的。但这一插曲重新引出了一个（长期存在的）问题：当一个拥有14亿信众的教会的首脑躺在病床上时，教会该如何治理？"}, {"en": "Leo is an unusual pope. Born Robert Prevost in Chicago in 1955, he is the first American to hold the office, and also a naturalised Peruvian who spent two decades as a missionary and bishop in the north of that country. He studied mathematics at Villanova, a Catholic university near Philadelphia, before earning a doctorate in canon law in Rome and mastering the church's (canonical) procedures. He is (bilingual) in English and Spanish and fluent in Italian. His election on May 8th 2025, amid the (vernal) warmth of Rome, surprised almost everyone. American cardinals had long been considered too close to a superpower to be electable; Leo's (cosmopolitanism), the product of a life spent between Chicago, Lima and Rome, helped persuade enough of the 133 voting cardinals, gathered beneath Michelangelo's (mural) of the Last Judgment in the Sistine Chapel, that he was the exception. White smoke rose on the fourth ballot.", "zh": "利奥是一位不寻常的教皇。他本名罗伯特·普雷沃斯特，1955年生于芝加哥，是首位担任这一职位的美国人，同时也是入籍的秘鲁人，曾在秘鲁北部做了二十年的传教士和主教。他在费城附近的天主教大学维拉诺瓦大学学习数学，后来在罗马获得教会法博士学位，并熟悉教会的（教会法上的）程序。他具有（双语）能力，英语和西班牙语都很流利，也通晓意大利语。他于2025年5月8日当选；那时罗马正值（春季的）暖意，而结果几乎让所有人意外。美国枢机主教长期以来被认为与超级大国关系太近，不可能当选；但利奥在芝加哥、利马和罗马之间辗转一生所养成的（世界主义）气质，说服了133名有投票权的枢机主教中的足够多数。这些枢机主教聚集在西斯廷礼拜堂米开朗琪罗《最后的审判》（壁画）之下，相信他是那个例外。第四轮投票时，白烟升起。"}, {"en": "Those who had expected a (protean) improviser like Francis found instead a (methodical) administrator. Where Francis was (colloquial), impulsive and fond of giving interviews on aeroplanes, Leo is (prim) in manner, deliberate in speech and wary of the off-the-cuff remark. He has revived summer stays at Castel Gandolfo, the hill-town retreat that his predecessor ignored; some see a return to (decorum), while others worry that reviving such courtly customs may encourage (prodigal) spending. He plays tennis, follows the Chicago White Sox and, unlike his predecessor, who loved a pithy (aphorism), prefers carefully drafted texts that rarely produce a headline. To admirers he is a steady hand on the (helm) after a stormy pontificate; to critics he is a (lukewarm) reformer who will (curtail) Francis's changes by neglect rather than (repeal).", "zh": "那些原以为会迎来一位像方济各那样（变化多端的）即兴者的人，看到的却是一位（有条不紊的）管理者。方济各说话（口语化）、行事冲动，喜欢在飞机上接受采访；利奥则举止（拘谨端正），说话审慎，对脱口而出的言论保持警惕。他恢复了在冈多菲堡避暑的传统——那是他的前任冷落了的山城行宫；有人认为这是回归（礼仪规矩），另一些人则担心，恢复宫廷式习惯可能助长（挥霍无度的）开销。他打网球，追随芝加哥白袜队；不同于钟爱精辟（格言）的前任，他偏爱精心起草、很少制造头条的文本。在支持者看来，在一个动荡的教皇任期之后，他是一双稳稳握住（舵）的手；在批评者看来，他是一个（不冷不热的）改革者，会以疏忽而非（废除）的方式（削减）方济各的改革。"}, {"en": "He chose his name for a reason. Leo XIII, pope from 1878 to 1903, wrote \"Rerum Novarum\", an encyclical on the condition of workers that answered the industrial revolution and became a (seminal) text of Catholic social teaching. Leo XIV has said that artificial intelligence poses a comparable challenge to human dignity, labour and the (spiritual) life, and he has made the theme a (cardinal) concern of his papacy. His first major document, \"Dilexi te\", published in October 2025, was a plea for the poor that could have come from Francis's pen. Its message was hardly (original); its tone, measured and (impartial), was distinctly his own.", "zh": "他选这个名字是有原因的。1878年至1903年在位的利奥十三世写下了《新事》通谕，论述工人的处境，回应了工业革命，成为天主教社会训导的（开创性）文本。利奥十四世说，人工智能对人的尊严、劳动和（灵性）生活构成了类似的挑战，并把这一主题定为其任期的（首要）关切。他的第一份重要文件《我爱了你》于2025年10月发表，是一份为穷人发出的呼吁，仿佛出自方济各之手。其信息算不上（新颖独到）；但其语调审慎而（不偏不倚），带着他鲜明的个人风格。"}, {"en": "He has been bolder in (ecumenical) affairs. In November 2025 he travelled to İznik in Turkey, the ancient Nicaea, to mark the 1,700th anniversary of the council that gave Christianity its creed and branded the followers of Arius (heretical); there he prayed with Bartholomew, the Orthodox patriarch of Constantinople. A month earlier King Charles III, supreme governor of the Church of England, had prayed with him beneath Michelangelo's ceiling, the first time a pope and a British monarch had prayed together in some 500 years, since Henry VIII's (conjugal) troubles provoked a (schism) with Rome. The (reciprocal) honours exchanged that day—the king becoming a royal confrater of St Paul's Outside the Walls and the pope receiving honours from St George's Chapel at Windsor—were a small but eloquent (rebuttal) of five centuries of (antagonism).", "zh": "在（基督教合一的）事务上，他更为大胆。2025年11月，他前往土耳其的伊兹尼克——即古代的尼西亚——纪念那次大公会议召开1700周年；那次会议为基督教确立了信经，并把阿里乌的追随者定为（异端）。他在那里与君士坦丁堡东正教牧首巴尔多禄茂一同祈祷。一个月前，英国国教最高总督查尔斯三世国王曾在米开朗琪罗的天顶画下与他一同祈祷——这是约500年来教皇与英国君主首次共同祈祷；当年正是亨利八世的（婚姻）纠葛，引发了与罗马的（分裂）。那天双方（互相授予的）荣誉——国王获授城外圣保禄大殿的“皇家会友”称号，教皇则接受温莎圣乔治礼拜堂授予的荣誉——是对五个世纪（敌对）的一次小而雄辩的（反驳）。"}, {"en": "The church he inherited is fractious. Traditionalists who resented Francis's restrictions on the old Latin Mass hope Leo will relax them; progressives, especially in Germany, want a bigger role for women and a softer line on sexuality. A 2023 declaration permitting priests to bless same-sex couples, though not their unions, provoked open revolt among African bishops, a reminder that the church's centre of gravity has moved south. Leo has tried to cool the (polemical) fervour, preferring quiet consultation to (dogmatism) of either stripe. There is (pessimism) about Catholicism's prospects in Europe, where churches are emptying, and (optimism) in Africa, where congregations are growing fast. In secular Europe the enemy is less (atheism) than indifference: a soft (nihilism), a consumer (hedonism) and the (escapism) of the smartphone.", "zh": "他继承的教会四分五裂。不满方济各限制旧式拉丁弥撒的传统派希望利奥放宽限制；进步派，尤其是在德国，希望女性发挥更大作用、在性问题上的立场更加温和。2023年一份允许神父为同性伴侣祝福、但不为其结合祝福的声明，在非洲主教中引发了公开反抗，提醒人们教会的重心已经南移。利奥试图平息（充满论战火药味的）激烈情绪，宁可低调协商，也不愿接受任何一方的（教条主义）。在教堂日渐空荡的欧洲，人们对天主教的前景抱有（悲观）；而在教众快速增长的非洲，则充满（乐观）。在世俗化的欧洲，敌人与其说是（无神论），不如说是冷漠：一种温和的（虚无主义），一种消费主义的（享乐主义），以及智能手机带来的（逃避现实）。"}, {"en": "Leo's illness has also revived a (constitutional) puzzle. Canon law sets out in loving detail what happens during an (interregnum), from the sealing of the papal apartment to the breaking of the dead pope's ring, but says almost nothing about a pope who is alive yet incapacitated. Benedict XVI showed in 2013 that a pope may resign, a (unilateral) act that needs nobody's approval; Francis later revealed that he had signed a letter intended for use if illness left him unable to govern, though whether such a document could satisfy the law's requirement of a freely manifested resignation is uncertain. There is no (provisional) regent, no (interim) vice-pope, no (mechanism) for a temporary handover. The curia simply waits, and the (ritual) of papal government carries on in the sick man's name.", "zh": "利奥的病情还重新引出了一个（体制上的）难题。教会法事无巨细地规定了（教皇空位期）该如何运作，从封存教皇寓所到砸毁已故教皇的权戒，却几乎没有提及一位活着却丧失行为能力的教皇该怎么办。本笃十六世在2013年证明了教皇可以辞职——这是一种无需任何人批准的（单方面）行为；方济各后来透露，他曾签署一封拟在疾病令他无法治理教会时使用的辞职信；但这份文件能否满足教会法对辞职必须自由且明确表达的要求，尚有疑问。没有（临时）摄政，没有（代理）副教皇，也没有临时交接权力的（机制）。教廷只能等待，教皇治理的（仪式）以病人的名义照常进行。"}, {"en": "The Vatican's finances are a worry of a more (temporal) kind. For years the Holy See has struggled with structural deficits: its consolidated accounts showed a modest €1.6m surplus in 2024, but the underlying structural gap remained around €44m. That year Francis warned that its pension fund faced a \"serious imbalance\", and its (actuarial) shortfall, though hardly (monumental) by the standards of a large state, is daunting for a small institution. The (bulk) of the argument concerns reliable funding and recurring costs; the Vatican Museums belong to Vatican City State's administration, whose accounts are distinct from those of the Holy See. Francis tried to (overhaul) the system, creating a secretariat for the economy and appointing outside auditors, and to (instill) a culture of transparency in a bureaucracy long run on (cronyism) and secrecy. He even cut cardinals' salaries and made them pay market rents for their apartments, which did not endear him to the curia.", "zh": "梵蒂冈的财政则是一种更为（世俗的）忧虑。圣座多年来一直受结构性赤字困扰：2024年合并账目虽有约160万欧元盈余，但结构性缺口仍约为4400万欧元。同年，方济各警告养老基金存在“严重失衡”；其（精算上的）缺口，按大国标准算不上（极其庞大），对一家规模较小的机构却十分棘手。争论的（大部分）围绕稳定的收入来源和经常性支出；梵蒂冈博物馆隶属梵蒂冈城国的行政体系，其账目与圣座并不相同。方济各试图（彻底改革）这一体系，设立了经济秘书处，聘请外部审计师，并试图在一个长期靠（任人唯亲）和保密运转的官僚机构中（灌输）透明文化。他甚至削减了枢机主教的薪水，并让他们为所住公寓支付市场租金——这可没让他在教廷里讨人喜欢。"}, {"en": "The most notorious episode involved a building in London, the (hulk) of a former Harrods warehouse in a (swank) corner of Chelsea, into which the Secretariat of State sank a (chunk) of its reserves, some €350m in all, having first toyed with a stake in an Angolan (petroleum) venture. Prosecutors alleged that middlemen had overcharged the Holy See by tens of millions in fees and then extracted €15m to give up control of the property, an episode they likened to (blackmail). In 2023 a Vatican (tribunal) convicted Angelo Becciu, a prince of the church once among the most powerful men in the curia, of embezzlement and sentenced him to five and a half years; eight others were convicted, and some defendants won (acquittal) on particular charges. All maintained their innocence and lodged an (appeal).", "zh": "最臭名昭著的一桩事涉及伦敦的一栋楼——切尔西一个（时髦高档）街区里一座由哈罗德百货旧仓库改造的（庞然大物）。国务院把（一大块）储备金，总计约3.5亿欧元，砸进了这栋楼，此前还曾考虑入股安哥拉的一个（石油）项目。检方指控，中间人向圣座多收了数千万欧元的费用，随后又索要1500万欧元才肯交出该物业的控制权——检方把这一情节比作（敲诈勒索）。2023年，梵蒂冈的一个（法庭）以贪污罪判处昂杰洛·贝丘五年半监禁——这位教会亲王曾是教廷中最有权势的人物之一；另有八人被定罪，一些被告在个别罪名上获判（无罪）。所有人都坚称自己无辜，并提出了（上诉）。"}, {"en": "In March 2026 the appeals court found a partial procedural nullity, not a complete mistrial. It called for specified stages of the proceedings to be repeated and for the prosecution to disclose its investigative materials. The judges also questioned the effects of an unpublished papal decree, while preserving the legal effect of parts of the original judgment. For a church that lectures the world on justice, the spectacle of its own (judicial) system tripping over its sovereign's decrees was mortifying. It also exposed an old (conundrum). In an absolute monarchy, where the pope is legislator, executive and supreme judge in one, the line between energetic reform and (despotism) is thin, and every reform can be undone by the next man's (whim).", "zh": "2026年3月，上诉法院裁定一审存在部分程序无效，并非整场审判完全作废。法院要求重做部分诉讼程序，命令检方披露调查材料；法官还对一份未公开的教皇法令所产生的程序效力提出质疑，同时保留原判部分内容的法律效力。对一个向世界宣讲正义的教会来说，其自身的（司法）体系竟被自己君主的法令绊倒，实在令人难堪。这也暴露出一个由来已久的（难题）：在一个绝对君主制国家里，教皇集立法者、行政首脑和最高法官于一身，雷厉风行的改革与（专制）之间只隔着一条细线，而每一项改革都可能被下一任的（一时兴起）所推翻。"}, {"en": "Scandal is hardly new. The very word (nepotism) comes from the Renaissance popes' habit of promoting their nephews, or nipoti, to high office; for more than a century a \"cardinal-nephew\" ran much of the papal administration, until Innocent XII banned the practice in 1692. Papal Rome was a (realm) of feuding families, in which a (cabal) of courtiers could (embroil) the city in feuds and a single pontificate could (despoil) the treasury for the benefit of one clan. The Borgias, whose name became shorthand for (venal) ambition, were merely the most notorious. Modern scandals are tamer. A decree can (annul) an appointment or a privilege; it is much harder to change the habits of a small court whose members answer chiefly to the man on the throne.", "zh": "丑闻并不新鲜。（裙带关系）这个词本身，就源于文艺复兴时期教皇们提拔侄子——意大利语称nipoti——担任要职的习惯；一百多年间，“枢机侄子”掌管着教廷行政的大部分事务，直到1692年英诺森十二世禁止了这一做法。教皇统治下的罗马是一个由彼此世仇的家族构成的（王国），一个由廷臣组成的（阴谋集团）可以把整座城市（卷入）争斗，一任教皇就可能为了一个家族的利益而（掠夺一空）国库。博尔贾家族的名字成了（唯利是图）野心的代名词，而他们只是其中最臭名昭著的。现代的丑闻要温和得多。法令可以（撤销）某项任命或特权，却很难改变一个成员主要只向宝座上那个人负责的小朝廷的旧习。"}, {"en": "The church's relations with science have been less hostile than legend suggests. Galileo, tried by the Inquisition in 1633 for insisting that the Earth moves round the sun, was a victim of papal pride as much as of theology, and John Paul II acknowledged the church's error in 1992. Yet the Vatican also sponsored the (astronomical) calculations behind the Gregorian calendar of 1582, and it still runs one of the world's oldest observatories, whose Jesuit astronomers operate a telescope in Arizona and publish papers on the (elliptical) orbits of asteroids and the (spectrum) of distant stars. Theologians who once treated Aristotle's (celestial) spheres as an (axiom) learned, slowly, to defer to (empirical) evidence. A Belgian priest, Georges Lemaître, first proposed what became the Big Bang theory, and the Vatican's academy of sciences, whose (pontifical) status has not stopped it electing Nobel laureates, now holds a (symposium) on anything from climate change to the humble (microorganism).", "zh": "教会与科学的关系，并不像传说中那样敌对。伽利略在1633年因坚持地球绕太阳运转而受到宗教裁判所审判，他既是神学的牺牲品，也是教皇傲慢的牺牲品；约翰·保罗二世在1992年承认了教会的错误。然而，梵蒂冈也资助了1582年格里高利历背后的（天文）计算，至今仍运营着世界上最古老的天文台之一，其耶稣会天文学家在亚利桑那州操作一台望远镜，发表关于小行星（椭圆）轨道和遥远恒星（光谱）的论文。曾把亚里士多德的（天体）球层视为（公理）的神学家们，慢慢学会了服从（经验的）证据。一位比利时神父乔治·勒梅特首先提出了后来成为大爆炸理论的学说；梵蒂冈的科学院虽具（教廷的）身份，却不妨碍它选出诺贝尔奖得主为院士，如今它就从气候变化到卑微的（微生物）等各种议题举办（研讨会）。"}, {"en": "Latin retains a special place in the Holy See's church law, liturgy and formal documents, though Italian is central to the everyday administration of Vatican City State. Its Latinists labour to keep the ancient language current. A (compendium) of modern coinages, the \"Lexicon Recentis Latinitatis\", offers a Latin (neologism) for everything from a computer, \"instrumentum computatorium\", to the motor car. The (lexical) ingenuity is impressive; whether anyone outside the Holy See will repeat such terms (verbatim) is another matter. The pope's Latin account on X, which posts in his own name rather than under any (pseudonym), has attracted an online following, though the number of people reading the posts as Latin lessons is anybody's guess. Even an (acronym) in the curia has a Latin source, and a classical (maxim) can still settle an argument in a Vatican office.", "zh": "拉丁语在圣座的教会法、礼仪和正式文件中仍占特殊地位，不过梵蒂冈城国的日常行政主要使用意大利语。研究拉丁语的学者们则努力让这门古老语言跟上时代。一部现代新词（汇编）——《新拉丁语词汇》——为从电脑——拉丁语作“instrumentum computatorium”——到汽车的一切事物都提供了一个拉丁语（新词）。这种（词汇上的）巧思令人赞叹；但圣座之外是否会有人（一字不差地）沿用这些词，就是另一回事了。教皇的拉丁语X账号以他本人的名义而非任何（化名）发帖，吸引了一批网上关注者；至于其中有多少人把这些帖文当作拉丁语教材，就不得而知了。就连教廷里的（首字母缩略词）也有拉丁语出处，一句古典（箴言）仍能在梵蒂冈的办公室里一锤定音。"}, {"en": "Rome has had a busy two years even without papal drama. The Jubilee of 2025, a holy year of a kind first proclaimed by Boniface VIII in 1300, drew more than 33m visitors, by the Vatican's count, before the last of its holy doors was sealed on January 6th 2026. Each (pilgrim) who passed through the doors of the four great basilicas could earn an indulgence; most also earned sore feet. The (devotional) crowds, tens of thousands of them on busy days, moved (pell-mell) through streets built for chariots, creating a daily (logjam) around St Peter's. Hotels charged a (premium), restaurants put up their prices and Romans, who have endured a jubilee every quarter-century for much of the past (millennium), braced for the (pandemonium) with their usual mix of grumbling and profit.", "zh": "即便没有教皇的风波，罗马这两年也够忙的。2025年禧年——一种由卜尼法斯八世于1300年首次宣布的圣年——据梵蒂冈统计，吸引了超过3300万访客，直到2026年1月6日最后一扇圣门封闭。每一位穿过四大圣殿圣门的（朝圣者）都可获得一次大赦；大多数人还收获了酸痛的双脚。（虔诚的）人潮在繁忙的日子里多达数万人，在为战车修建的街道上（乱哄哄地）涌动，每天都在圣伯多禄大殿周围造成（交通堵塞）。酒店收取（溢价），餐馆抬高价格；在过去一个（千年）的大部分时间里，罗马人每隔四分之一个世纪就要熬过一次禧年，他们一边抱怨一边赚钱，以惯常的方式迎接这场（混乱喧嚣）。"}, {"en": "The city did at least get some new infrastructure out of it. An underpass beneath Piazza Pia now carries traffic away from the approach to St Peter's, and in December 2025 two new stations opened on Metro C, a line whose construction has dragged on since 2007 and whose budget has swollen accordingly. Digging a (subterranean) railway through Rome means cutting through every (stratum) of its past. The new station at the Colosseum, 30-odd metres deep, doubles as a museum of the finds made during its excavation; at Porta Metronia nearby, excavators uncovered a second-century barracks and a commander's house with frescoes and mosaics, prompting engineers to redesign the station to preserve the remains. Below the ancient city lies a (substratum) of volcanic tuff and river (gravel); above it, the (loam) of later centuries. Archaeologists (glean) something from every cubic metre the (drill) brings up.", "zh": "这座城市至少借此得到了一些新的基础设施。皮亚广场下方的一条地下通道如今把车流从通往圣伯多禄大殿的道路上引开；2025年12月，地铁C线开通了两座新站——这条线自2007年起一直拖拖拉拉地施工，预算也相应膨胀。在罗马修建（地下）铁路，意味着要穿过其过往的每一个（地层）。斗兽场的新站深三十余米，兼作展示施工期间出土文物的博物馆；在附近的梅特罗尼亚门，考古人员发现了二世纪的军营和饰有壁画、马赛克的指挥官宅邸，工程师因此重新设计车站，以保护这些遗迹。古城之下是一层由火山凝灰岩和河流（砾石）构成的（底层）；其上则是后来诸世纪的（壤土）。考古学家从（钻机）带上来的每一立方米土里都能（搜集）到些什么。"}, {"en": "Tourists, though, are the city's real flood. Like Venice, Florence and Barcelona, Rome has started to charge for its most crowded sights. Since 2023 visitors to the Pantheon, a temple turned church that was free for centuries, have paid €5 to enter; since February 2026 non-residents entering the area closest to the Trevi Fountain have paid €2, while local residents go in free. Officials hope the fee will raise €6.5m a year and thin the crowds, which by day form a solid (shoal) around Nicola Salvi's baroque masterpiece. The coins visitors throw over their shoulders, worth well over €1m a year, go to a Catholic charity; the money is fished out regularly, though not before the occasional thief has tried to (trawl) for it with a magnet.", "zh": "然而，游客才是这座城市真正的洪流。和威尼斯、佛罗伦萨、巴塞罗那一样，罗马已开始对最拥挤的景点收费。自2023年起，参观万神殿——一座由神庙改成的教堂，数百年来免费开放——要付5欧元；自2026年2月起，非本地居民若想进入特雷维喷泉最近的围合参观区，就须支付2欧元；当地居民免费。官员们希望这笔费用每年能带来650万欧元，并疏散人群——白天，人群像（鱼群）一样密密地围住尼古拉·萨尔维的这件巴洛克杰作。游客背身抛进去的硬币每年价值远超100万欧元，归一家天主教慈善机构所有；这些钱会被定期打捞上来，但偶尔也有窃贼抢先用磁铁去（捞）。"}, {"en": "The tourist economy has its own fauna. Street vendors (hawk) selfie sticks, umbrellas and plastic Colosseums from every (kiosk) and pavement (stall); pickpockets work the buses that run to the Vatican. For years men dressed as centurions, in tin helmets, with a leather (sandal) strapped to each foot, charged visitors for photographs outside the Colosseum, until the city banned the practice, to the relief of tourists who had learned too late that a smiling \"legionary\" could be a (mountebank) with a price list. Visitors in very short (denim) shorts may be turned away from churches, which require modest (apparel); those who sit on the Spanish Steps, banned since 2019, risk a fine. The city's (toll) on visitors' patience is high, but few seem deterred.", "zh": "旅游经济自有其“动物群”。街头小贩在每一个（售货亭）和人行道（摊位）上（叫卖）自拍杆、雨伞和塑料斗兽场模型；扒手在开往梵蒂冈的公交车上作案。多年来，一些头戴锡头盔、每只脚都绑着一只皮（凉鞋）、扮成百夫长的男子在斗兽场外向游客收取合影费，直到市政府禁止了这种做法——令那些太晚才发现笑容可掬的“军团士兵”可能是个揣着价目表的（江湖骗子）的游客松了一口气。穿着过短的（牛仔布）短裤的游客可能被教堂拒之门外，教堂要求（衣着）得体；自2019年起禁止坐在西班牙台阶上，违者可能被罚款。这座城市对游客耐心的（消耗）很大，但似乎没几个人因此却步。"}, {"en": "Beneath the bustle, the ancient city still shapes the modern one. Rome has more ancient Egyptian obelisks than any other city; the (obelisk) in St Peter's Square, brought from Egypt by the emperor Caligula, was dragged to its present spot in 1586 by 900 men and 140 horses, an engineering feat that made its architect famous. In the ancient (forum), the speakers' platform from which orators addressed the crowds took its name from the bronze prows of ships captured in battle and nailed to its front; every modern (rostrum) owes it a debt. The Colosseum, once home to (bestial) spectacles in which men fought animals and one another, was quarried for centuries as a convenient source of stone, and its (colossal) shell has stood on a (pedestal) of myth ever since.", "zh": "在喧嚣之下，古城依然塑造着现代的城市。罗马拥有的古埃及方尖碑比其他任何城市都多；圣伯多禄广场上的那座（方尖碑）由卡利古拉皇帝从埃及运来，1586年由900人和140匹马拖到现址，这一工程壮举让其建筑师声名大噪。在古代（广场）上，演说家向人群发表演说的讲台，其名称来自战斗中缴获、钉在台前的青铜船首；如今每一座（讲坛）都欠它一份情。斗兽场曾上演人兽相搏、人与人厮杀的（野蛮残忍的）表演，后来数百年间被当作方便的石料场开采；自那以后，它（巨大的）躯壳便一直矗立在神话的（基座）之上。"}, {"en": "Rome's layers are religious as well as physical. The Pantheon was a (pagan) temple to all the gods before it was consecrated as a church in 609; Christian Rome raised its churches on the bones of its temples, swapping one (idol) for another, as Protestant critics liked to (cavil). The ancient city was no stranger to excess. In 186BC the Senate, alarmed by secret rites in honour of Bacchus, suppressed the (bacchanal) cult and put many of its followers to death, and among Rome's wealthy, (epicurean) tastes in food could shade into extravagant feasting. Yet the \"vomitorium\", supposedly a room where gluttons emptied their stomachs between courses, is (apocryphal): the word referred to the passages through which crowds poured out of an amphitheatre. Gladiatorial games were (martial) entertainment of the most (visceral) kind, the (sensual) pleasures of the baths were open to all, and (convivial) dinners lubricated by (ambrosial) wines often ended in (mayhem).", "zh": "罗马的层次不仅是物质的，也是宗教的。万神殿在609年被祝圣为教堂之前，是一座供奉众神的（异教）神庙；基督教罗马在神庙的遗骨上建起教堂，以一尊（偶像）换了另一尊——新教批评者就爱拿这一点来（吹毛求疵）。古城从不陌生于放纵。公元前186年，元老院对祭祀酒神巴克斯的秘密仪式深感警惕，取缔了（酒神狂欢）教派，并处死了许多信徒；在富裕阶层中，（讲究美食享乐的）口味有时会演变为奢华的盛宴。然而，所谓“呕吐室”——据说是饕餮之徒在两道菜之间清空肠胃的房间——纯属（杜撰）：这个词指的是人群从圆形剧场涌出的通道。角斗比赛是一种最（令人血脉贲张的）（尚武的）娱乐，浴场的（感官）享乐对所有人开放，而以（芳醇如琼浆的）美酒助兴的（欢宴）晚餐，常常以一片（混乱）收场。"}, {"en": "Christian Rome has its own superlatives. Its (cathedral) is not St Peter's, as most visitors assume, but St John Lateran, \"the mother of all churches\"; St Peter's is a basilica built over the supposed tomb of the apostle, a fisherman whose (piscatorial) trade is recalled by the Fisherman's Ring that every pope wears. The pope is, in Catholic teaching, Peter's (lineal) successor. The catacombs, miles of tunnels where early Christians buried their dead, are a (memorial) to a persecuted minority, and the veneration of martyrs here dates from time (immemorial). The city has more than 900 churches, and every side street seems to hide a baroque (chapel) glittering with gilded (fretwork), (enamel) and coloured marble, its (pictorial) scheme designed to (overwhelm) the senses and lift the soul towards the (empyrean).", "zh": "基督教罗马有它自己的“之最”。它的（主教座堂）并不是大多数游客以为的圣伯多禄大殿，而是拉特朗圣若望大殿——“万堂之母”；圣伯多禄大殿是建在使徒假定墓地之上的一座宗座圣殿，这位使徒原是渔夫，他的（捕鱼的）营生，至今仍由每位教皇所戴的“渔人权戒”所铭记。按照天主教教义，教皇是伯多禄（一脉相承的）继承人。地下墓窟——早期基督徒埋葬死者的绵延数英里的隧道——是对一个受迫害少数群体的（纪念），而在这里敬礼殉道者的传统可追溯至（远古）。这座城市有900多座教堂，似乎每条小街都藏着一座巴洛克式（小礼拜堂），镀金（镂空雕饰）、（珐琅）和彩色大理石熠熠生辉，其（绘画）布局旨在（压倒）人的感官，把灵魂托举向（九霄天界）。"}, {"en": "The papacy's trappings remain (regal) and its residences (palatial). Gammarelli, a family firm of clerical tailors near the Pantheon, has dressed popes since 1798, and before every conclave it prepares white cassocks in small, (medium) and large; its (sartorial) judgment is final. The Swiss Guard has protected popes since 1506, though its striped (uniform), often credited to Michelangelo, was designed in the early 20th century. Francis tried to strip away the (imperial) pomp, refusing the red cape and the palace apartments. Leo appeared on the loggia on the night of his election in the red cape and stole, a more (conventional) wardrobe that (deferential) traditionalists read as a (providential) sign.", "zh": "教廷的排场依然（富丽堂皇如王室），居所依然（宫殿般奢华）。万神殿附近一家名叫甘马雷利的家族教士裁缝店，自1798年起就为教皇做衣服；每次秘密会议之前，它都会备好小号、（中号）和大号的白色长袍；它在（服饰）上的判断就是定论。瑞士近卫队自1506年起守护教皇，不过其条纹（制服）——常被说成出自米开朗琪罗之手——其实是20世纪初设计的。方济各试图剥去（帝王般的）排场，拒绝穿红色短披肩，也拒绝住宫中的寓所。利奥当选当晚出现在凉廊上时，披着红色短披肩和圣带，这身更为（传统的）装束，被（恭敬顺从的）传统派解读为一个（天意的）征兆。"}, {"en": "For Americans the election of one of their own was a (marvel). Chicago threw parties, the White Sox celebrated at their ballpark, and Dolton, the modest suburb where young Robert grew up and could spot a (squirrel), a (chipmunk) or the occasional (skunk), was suddenly famous. Even a media (mogul) who had scarcely followed the papacy suddenly wanted a Vatican expert. Some American Catholics hoped for a pope who would (disarm) their country's culture warriors; others hoped he would (extol) their politics. Leo has disappointed both, criticising the treatment of migrants in America while avoiding partisan rhetoric, and showing more (spunk) than his mild manner suggests. He is (genial), but hard to (corral).", "zh": "对美国人来说，一位同胞当选是一件（奇事）。芝加哥举行庆祝，白袜队在主场欢庆，而年轻的罗伯特在那里长大，偶尔还能见到一只（松鼠）、一只（花栗鼠）或一只（臭鼬）的小郊区多尔顿，一夜之间出了名。就连一位过去几乎不关注教皇事务的媒体（大亨），也会突然急着寻找梵蒂冈专家。一些美国天主教徒希望这位教皇能（化解）本国的文化斗士；另一些人则希望他（颂扬）他们的政治立场。利奥让双方都失望了：他批评美国对待移民的方式，同时避免党派言辞，并表现出比其温和举止所显示的更多的（胆气）。他（和蔼可亲），却很难被（约束住）。"}, {"en": "Rome's own wildlife is less cuddly. Wild boars wander in from the parks and nature reserves on the city's northern fringe to raid overflowing bins; mostly (nocturnal), they have grown bold enough to forage by day, and sows have been filmed shepherding striped piglets across busy roads. A big male, a (hunk) of bristling muscle armed with a curved (tusk) on either side of its snout, can (maul) a (mongrel) foolish enough to (bark) at it. When African swine fever reached the city in 2022, killing several of these (feral) beasts, the authorities fenced off parks and ordered culls, to the fury of animal-rights groups. When a large (mammal) starts scavenging beside busy roads, wildlife policy becomes municipal politics.", "zh": "罗马本地的野生动物就没那么可爱了。野猪从城市北缘的公园和自然保护区闯进来，翻抢满溢的垃圾桶；它们大多（夜间活动），如今却胆大到白天也出来觅食，还有人拍到母猪领着一身条纹的小猪穿过繁忙的马路。一头大公猪——一（大块）鬃毛竖立的肌肉，口鼻两侧各长着一根弯曲的（獠牙）——能把一只敢冲它（吠叫）的（杂种狗）（撕咬重伤）。2022年非洲猪瘟传入该市，导致数头这种（野化的）野兽死亡，当局随即封闭公园、下令扑杀，令动物权利团体大为愤怒。当一头大型（哺乳动物）开始在繁忙道路旁翻找食物时，野生动物管理就成了市政政治问题。"}, {"en": "The skies are just as busy. Every winter millions of starlings arrive from northern Europe and perform their (aerial) ballet over the Tiber at dusk, (ethereal) clouds that swirl like a (whirlpool) before descending to roost in the plane trees and the odd (elm) along the river, coating cars and pavements below in something less poetic. Yellow-legged gulls, bigger and fiercer than their seaside cousins, nest on Roman rooftops, (squall) from the chimney pots and prey on pigeons and rats; a (gull) will snatch a sandwich from a tourist's hand in broad daylight. Flocks of escaped parakeets, a screeching green (amalgam) of exotic species, have colonised the parks. The (diurnal) rhythm of the city is set as much by birds as by bells.", "zh": "天空同样热闹。每年冬天，数以百万计的椋鸟从北欧飞来，黄昏时分在台伯河上空上演（空中）芭蕾，那些（轻盈缥缈的）鸟云像（漩涡）般盘旋，然后落到河边的悬铃木和零星的（榆树）上栖息，给下面的汽车和人行道覆上一层可不那么诗意的东西。黄腿鸥比它们海边的表亲更大更凶，在罗马的屋顶上筑巢，从烟囱顶上（尖声嘶叫），捕食鸽子和老鼠；一只（海鸥）会在光天化日之下从游客手中抢走三明治。成群逃逸的鹦鹉——一群聒噪的绿色外来物种（混合体）——占领了各个公园。这座城市的（昼间）节奏，既由钟声决定，也由鸟儿决定。"}, {"en": "Governing Rome has defeated many a mayor, and its rubbish crisis seems (perpetual). Since Malagrotta, once the biggest landfill in Europe, was closed in 2013, the city has shipped much of its (residual) waste to other regions and even abroad at great cost, while overflowing (communal) bins in (peripheral) districts give off a (foul) smell every summer. Fires at waste-treatment plants, some of them suspicious, have added to the (maelstrom). Roberto Gualtieri, mayor since 2021, has pushed through a (proposal) for a giant waste-to-energy plant on the city's southern edge, which he hopes will end decades of (piecemeal) improvisation. Opponents have tried to (foil) it in the courts, arguing that it would (imperil) local residents' health; even supporters concede that it will not (fulfil) its promise before the end of the decade.", "zh": "治理罗马难倒过许多市长，而它的垃圾危机似乎（永无休止）。自从马拉格罗塔——曾经的欧洲最大垃圾填埋场——于2013年关闭以来，这座城市一直以高昂代价把大部分（残余）垃圾运往其他大区乃至国外，而（偏远）城区满溢的（公共）垃圾桶每到夏天就散发出（恶臭）。垃圾处理厂的火灾——其中一些颇为可疑——更添一片（混乱漩涡）。2021年起担任市长的罗伯托·瓜尔蒂耶里推动通过了在城市南缘兴建一座巨型垃圾焚烧发电厂的（提案），希望借此结束数十年来（零敲碎打的）临时应付。反对者试图在法庭上（阻挠）这一项目，称它会（危及）当地居民的健康；就连支持者也承认，在本十年结束之前，它无法（兑现）其承诺。"}, {"en": "Getting about is no easier. The city's transport company, chronically indebted, had to be rescued through a court-supervised restructuring; its buses suffer frequent (mechanical) breakdowns and have an alarming habit of catching fire. Taxis are scarce because licence-holders have for decades managed to (forestall) any increase in their number, so trying to (hail) a cab in the rain is an act of faith. Scooter riders, every one a (daredevil), weave between the cars; anyone who dares to (pedal) a bicycle must contend with cobbles laid for carts and with potholes, each a (pitfall) that has swallowed many a wheel. The metro has only three lines, few for a capital of nearly 3m people, and the (principal) reason is (spatial): there is barely a square metre of the centre that does not hide something ancient. Romans (rail) against the chaos, then shrug.", "zh": "出行也不轻松。该市的公交公司长期负债，不得不通过法院监督下的重组获救；其公交车频频发生（机械）故障，还有自燃的惊人习惯。出租车稀缺，因为执照持有者几十年来一直设法（阻止）出租车数量的任何增加，所以在雨中（招呼）一辆出租车无异于一种信仰行为。骑踏板摩托车的人个个都是（亡命之徒），在车流间穿梭；谁敢（骑）自行车，就得对付为马车铺设的鹅卵石路，以及那些吞没过无数车轮、每一个都是（陷阱）的坑洼。地铁只有三条线，对一个近300万人口的首都来说太少了，其（主要）原因在于（空间）：市中心几乎每一平方米地下都藏着古迹。罗马人（抱怨痛斥）这一片混乱，然后耸耸肩。"}, {"en": "The city's administration has a reputation for (lackadaisical) service. On New Year's Eve 2014 more than four-fifths of Rome's municipal police officers called in sick, a feat of collective (absenteeism) that became a national scandal and spurred the government of the day to make it easier to (expel) public employees who (shirk) their duties. Citizens still endure the (tedium) of queues at municipal offices and the (humdrum) obstacles of forms that require official stamps. A bureaucracy with weak (personnel) management and too many layers can (stonewall) a request for months, a councillor can (blackball) a (rival)'s project out of spite, and every office seems to have a (factotum) who knows how to get things done, in exchange for a favour. Skilled professionals leave; (menial) jobs are filled by migrants.", "zh": "市政管理以（懒散敷衍的）服务著称。2014年除夕，罗马超过五分之四的市政警察请了病假，这场集体（缺勤）壮举成了全国丑闻，促使当时的政府让（开除）那些（逃避）职责的公职人员变得更容易。市民们至今仍要忍受市政办公室排队的（冗长乏味），以及需要盖上官方印花的各种表格带来的（单调琐碎的）障碍。一个（人事）管理薄弱、行政层级又过多的官僚机构，可以把一项申请（拖延搪塞）数月；一名市议员可以出于恶意（否决）（对手）的项目；而每个办公室似乎都有一个知道怎么把事情办成的（杂役总管）——以换取一个人情。熟练的专业人士纷纷离开；（卑微的）工作则由移民填补。"}, {"en": "Italy's government, which pays for much of the capital, has constraints of its own. Public debt hovers around 135% of GDP, among the highest in the rich world. Giorgia Meloni, prime minister since 2022, has proved more (economical) with public money than her opponents predicted, and the bond markets that used to (spank) Italy whenever its deficits grew have been unusually calm, narrowing the spread over German bonds to levels unseen in more than a decade. But growth is (marginal), productivity has barely risen in a quarter of a century and the population has begun to (shrink), with far more funerals than births each year. A (cyclical) upturn cannot fix (fundamental) weaknesses. Ms Meloni's party has roots on the post-fascist right; she has softened its old (jingoism) while making much of (patriotism), and critics accuse her of (chauvinism) on immigration, a charge her supporters dismiss as the complaint of people who would rather not enforce the law.", "zh": "为首都支付大部分开销的意大利政府，也有自己的掣肘。公共债务徘徊在GDP的135%左右，在富裕国家中名列前茅。2022年起担任总理的乔治亚·梅洛尼，在花公共资金上比对手预料的更（节省），过去一见意大利赤字扩大就（狠狠教训）它的债券市场异常平静，意德国债利差收窄到十多年来未见的水平。但经济增长（微乎其微），生产率四分之一个世纪以来几乎没有提高，人口也已开始（萎缩），每年的葬礼远多于出生。一次（周期性）回升无法修补（根本性）的弱点。梅洛尼的政党根植于后法西斯右翼；她淡化了该党过去（好战的民族主义），同时大力宣扬（爱国主义）；批评者指责她在移民问题上搞（沙文主义），她的支持者则斥之为那些不愿执法者的抱怨。"}, {"en": "Rome's economy is oddly (unidimensional) for a capital: it runs on government, the church and, increasingly, tourism. The tourist (boom) has been (vital) for shopkeepers and restaurateurs, but its (collateral) damage is visible everywhere. Short-term rentals have hollowed out the historic centre, where long-term residents often feel reduced to a (fractional) presence amid the crowds, and the bakers and cobblers of old have given way to shops chasing (ephemeral) souvenir fashions. Whether this is the (intentional) result of policy or simply the market at work is debated; either way it has been (detrimental) to the city's character, and Romans complain that their centre has become an (insubstantial) stage set.", "zh": "作为首都，罗马的经济出奇地（单一）：它靠政府、教会，以及日益依赖的旅游业运转。旅游业的（繁荣）对店主和餐馆老板（至关重要），但其（附带）损害随处可见。短租掏空了历史中心——长期居民往往觉得，在人潮中自己只剩下（微不足道的一小部分）；昔日的面包铺和鞋匠铺，则让位给了追逐（昙花一现的）纪念品潮流的商店。这究竟是政策（有意为之）的结果，还是市场自然运作的产物，众说纷纭；无论如何，它对城市的品格造成了（损害），罗马人抱怨他们的市中心已成了一座（空洞虚浮的）布景。"}, {"en": "Romans have always mocked their rulers. Since the 16th century anonymous critics have pinned satirical verses to Pasquino, a battered ancient statue near Piazza Navona and the most famous of the city's \"talking statues\"; the word \"pasquinade\" passed into several languages. The verses ranged from an elegant (epigram) to crude (doggerel), and popes who would have liked to prosecute their authors for (libel) rarely caught them. A celebrated (witticism) aimed at the Barberini family, who stripped bronze from the Pantheon's portico to make cannon and the great canopy over the altar of St Peter's, ran: \"What the barbarians did not do, the Barberini did.\" It is a (truism) that the Roman temperament, (droll), (mercurial), (cordial) to strangers and (sceptical) of authority, has outlived every regime.", "zh": "罗马人向来嘲弄他们的统治者。自16世纪以来，匿名批评者便把讽刺诗贴在纳沃纳广场附近一尊残破的古代雕像“帕斯奎诺”上——它是这座城市“会说话的雕像”中最著名的一尊；“帕斯奎诺式讽刺文”一词由此进入了好几种语言。这些诗有时是一则优雅的（警句），有时又是粗俗的（打油诗），那些想以（诽谤）罪起诉作者的教皇们很少抓到他们。一句针对巴尔贝里尼家族的著名（妙语）——这个家族剥下万神殿门廊的青铜，用来铸造大炮和圣伯多禄大殿祭台上方的华盖——是这样说的：“蛮族没做的事，巴尔贝里尼家做了。”罗马人的性情（滑稽诙谐）、（变幻无常），对陌生人（热情友好），对权威则（满腹怀疑），它熬过了每一个政权——这已是（不言自明的道理）。"}, {"en": "Rome's (charm) has long been projected onto the screen. Cinecittà, the studio complex founded by Mussolini in 1937, became \"Hollywood on the Tiber\" after the war, when American producers came for cheap labour and stayed for the light; \"Ben-Hur\" was shot there. \"Roman Holiday\", in which Audrey Hepburn's runaway princess explores the city on a Vespa, offered an (idyll) of (whimsical) freedom. Federico Fellini's \"La Dolce Vita\" offered something darker, a portrait of a city in the (thrall) of celebrity, in which Anita Ekberg wades into the Trevi Fountain at night and a photographer called Paparazzo gave his name to a profession. Michelangelo Antonioni filmed (existential) unease among the half-built blocks of the city's suburbs. Every (reel) of these films is a (paean) to Rome, and together they spun a (spool) of myth that still draws visitors, many of whom (stroll) along the Via Veneto in search of a city that the (mesmerism) of cinema invented.", "zh": "罗马的（魅力）早已被投射到银幕上。墨索里尼于1937年创建的电影城，战后成了“台伯河上的好莱坞”——美国制片人为廉价劳动力而来，却因这里的光线而留下；《宾虚》就是在那里拍摄的。在《罗马假日》中，奥黛丽·赫本饰演的出逃公主骑着韦士柏游遍全城，呈现了一幅（异想天开的）自由（田园牧歌）。费德里科·费里尼的《甜蜜的生活》则呈现了更阴暗的东西：一幅处于名人效应（掌控）之下的城市肖像——安妮塔·艾克伯格夜里涉入特雷维喷泉，一个名叫帕帕拉佐的摄影师则把自己的名字送给了一个行当。米开朗琪罗·安东尼奥尼在城郊半完工的楼群间拍下了（存在主义的）不安。这些电影的每一（卷胶片）都是一首献给罗马的（赞歌），它们合力纺出一（卷）神话，至今仍吸引着游客，其中许多人沿着韦内托大街（漫步），寻找一座由电影的（催眠魔力）虚构出来的城市。"}, {"en": "Painters got there first. The Sistine ceiling teems with prophets and five prophetesses, each a (sibyl) of the classical world whom Michelangelo honoured alongside the Hebrew prophets. He learned his (anatomical) precision by dissecting corpses, and some scientists claim to see the outline of a human brain, complete with its (cerebral) folds, in the cloud surrounding God in \"The Creation of Adam\". Bernini's fountains and churches abound in cherubs and (buxom) allegorical figures. The city's (eclecticism), in which a Romanesque bell tower can stand beside a baroque façade and a fascist post office, is its glory. In the 20th century Giorgio de Chirico, who lived for three decades beside the Spanish Steps, painted the empty piazzas and long shadows of his \"(metaphysical)\" pictures, which fed directly into (surrealism). Artists still set up an (easel) on Via Margutta, a street of studios; the (pastel) and ochre façades of Trastevere photograph better than most paintings; and street artists (stencil) their images on the walls of working-class districts that tourists never see.", "zh": "画家们来得更早。西斯廷的天顶上满是先知和五位古典世界的女预言者，每一位都是一名（女先知），米开朗琪罗让她们与希伯来先知并列受人尊崇。他通过解剖尸体习得了（解剖学上的）精准；一些科学家声称，在《创造亚当》中环绕上帝的云团里，能看出一个人脑的轮廓，连（大脑的）褶皱都一应俱全。贝尼尼的喷泉和教堂中，既有小天使，也有（丰腴的）寓意人物。这座城市的（兼收并蓄）——一座罗马式钟楼可以矗立在巴洛克式立面和法西斯时代的邮局旁边——正是它的荣耀。20世纪，在西班牙台阶旁住了三十年的乔治·德·基里科，在他的“（形而上）”画作中描绘空旷的广场和长长的阴影，这些作品直接催生了（超现实主义）。艺术家们至今仍在马古塔街——一条满是画室的街道——支起（画架）；特拉斯提弗列那些（粉彩色）和赭色的立面，拍出来比大多数画作还美；街头艺术家们则在游客从不涉足的工人街区墙上（用模板喷绘）他们的图像。"}, {"en": "Rome's soundtrack is just as layered. Palestrina, choirmaster at St Peter's in the 16th century, wrote masses and the occasional secular (madrigal), and the papal choir still sings his setting of a (psalm) on great feasts. At Christmas bagpipers from the mountains of Abruzzo play in the piazzas and every church choir sings a (carol) or two; the Vatican even has its own (anthem), a march by Charles Gounod. Puccini set \"Tosca\" in Rome in 1800, with a (diabolical) police chief and a heroine who leaps to her death from Castel Sant'Angelo. Ennio Morricone, born in Trastevere, experimented with (atonal) improvisation before scoring the spaghetti westerns, in which every (pistol) (duel) becomes a small opera. The city's best concerts are now held in a modern (auditorium) designed by Renzo Piano, where conductors mount the (podium) after weeks of (rehearsal); outside, the (decibel) count of the traffic supplies a less harmonious Roman symphony.", "zh": "罗马的声景同样层次丰富。16世纪担任圣伯多禄大殿合唱团长的帕莱斯特里纳，写弥撒曲，偶尔也写世俗的（牧歌），教皇合唱团至今仍在重大节日演唱他为一首（圣诗）谱的曲。圣诞节时，来自阿布鲁佐山区的风笛手在各个广场演奏，每个教堂合唱团都会唱上一两首（颂歌）；梵蒂冈甚至有自己的（国歌）——夏尔·古诺写的一首进行曲。普契尼把《托斯卡》的故事设定在1800年的罗马，剧中有一个（恶魔般的）警察局长，还有一位从圣天使堡纵身跃下的女主角。生于特拉斯提弗列的埃尼奥·莫里康内，在为意大利西部片配乐之前曾尝试（无调性的）即兴演奏；在那些电影里，每一场（手枪）（决斗）都成了一出小歌剧。如今这座城市最好的音乐会，在伦佐·皮亚诺设计的一座现代（音乐厅）举行，指挥家在经过数周（排练）后登上（指挥台）；外面，车流的（分贝）读数则奏响一曲不那么和谐的罗马交响乐。"}, {"en": "Sport is tribal too. Rome hosted the Olympics in 1960, its first and so far only Games. An Ethiopian, Abebe Bikila, won the marathon barefoot, finishing by torchlight beside the Arch of Constantine, and an 18-year-old American boxer named Cassius Clay took the light-heavyweight gold (medal), the start of a career that would turn (pugilism) into a global spectacle. The football derby between Roma and Lazio is anything but (fraternal): ultras arrive with an (arsenal) of flares and (vengeful) chants, the violence is (fitful) but real, and police brace for a possible (reprisal) after every defeat. A Roman's allegiance to his club is (willful), lifelong and (exceptional) only in its intensity. Gentler games visit too: in 2023 the city hosted golf's (biennial) Ryder Cup, the first ever played in Italy.", "zh": "体育也带着部落色彩。1960年，罗马举办了奥运会——这是它第一次、也是迄今唯一一次举办奥运会。埃塞俄比亚人阿贝贝·比基拉赤脚赢得马拉松，在火炬映照下于君士坦丁凯旋门旁冲线；一位名叫卡修斯·克莱的18岁美国拳击手夺得轻重量级金（牌），由此开启了一段将（拳击运动）变成全球盛事的职业生涯。罗马队与拉齐奥队之间的足球德比绝无（兄弟情谊）可言：极端球迷带着一整（军火库）的烟火、唱着（充满复仇意味的）口号到场，暴力虽是（时断时续的），却真实存在；每次输球之后，警方都要防备可能出现的（报复行动）。罗马人对自己球队的忠诚（固执任性）、终生不渝，其（非同寻常）之处只在于它的强烈程度。也有更温和的赛事造访：2023年，这座城市举办了高尔夫球（两年一度的）莱德杯——这是该赛事首次在意大利举行。"}, {"en": "Food is a matter of doctrine. Roman cooking rests on a handful of pastas whose recipes are guarded with (procrustean) zeal: carbonara is made with cured pork cheek, pecorino, egg yolks and black pepper, and adding cream is no (venial) sin. Romans (conform) to the (norm) without question, and visitors who order a cappuccino after lunch, or ask for a breakfast of (oatmeal) or (cereal), are regarded with pity. A (clam) lends its briny flavour to spaghetti alle vongole; artichokes from which cooks (peel) away the tough outer leaves before frying them whole, Jewish-style, until each leaf crackles like a (husk); courgette flowers stuffed with mozzarella and anchovy and fried, (petal) and all: the canon is short but sublime. Americans homesick for (pecan) pie must hunt for an expatriate bakery, a (teetotal) guest at a Roman dinner is an object of curiosity, and anyone who cuts spaghetti with a knife has misunderstood what each (utensil) is for.", "zh": "食物关乎教义。罗马菜建立在少数几种意面之上，其配方被以（削足适履般）的狂热守护着：卡博纳拉要用腌猪脸肉、佩科里诺奶酪、蛋黄和黑胡椒来做，加奶油绝非（可以宽恕的）小罪。罗马人毫无异议地（遵从）这一（规范），而那些午饭后点卡布奇诺、或要一份（燕麦粥）或（麦片）当早餐的游客，会招来同情的目光。一只（蛤蜊）就能为经典的蛤蜊意面带来鲜美的海味；厨师先（剥去）外层的硬叶，再以犹太做法整颗油炸、直到每片叶子都像（谷壳）一样噼啪作响的洋蓟；塞入马苏里拉奶酪和凤尾鱼、连（花瓣）一起油炸的西葫芦花：经典菜谱虽短，却臻于至美。想念（山核桃）派的美国人得四处去找外侨开的面包店，罗马晚宴上一位（滴酒不沾的）客人会成为好奇的对象，而任何用刀切意面的人，都误解了每样（餐具）的用途。"}, {"en": "The city is fond of wordplay. ROMA, read backwards, spells AMOR, an (anagram) that has launched a thousand souvenir T-shirts. \"All roads lead to Rome\" is a (medieval) (apothegm), not an ancient one, and \"When in Rome, do as the Romans do\" is a (dictum) attributed to St Ambrose. The letters SPQR, for \"the Senate and People of Rome\", still adorn the city's manhole covers, and Romans enjoy a joke that reads them as \"these Romans are mad\", a line borrowed from the French comic \"Asterix\", whose hero's name is a pun on (asterisk). Roman dialect is (verbal) jousting raised to an art: earthy, quick and given to the (euphemism), the insult and the occasional (malapropism), its humour can sound (nonsensical) to outsiders, and almost none of its words is (univocal). Mastering its (lingual) gymnastics takes a lifetime.", "zh": "这座城市喜爱文字游戏。ROMA倒过来读就是AMOR，即拉丁语的“爱”——这个（字母重排词）催生了无数纪念T恤。“条条大路通罗马”是一句（中世纪的）（隽语），而非古代的；“在罗马，就照罗马人那样做”则是一句被归于圣安博的（名言）。SPQR这几个字母代表“元老院与罗马人民”，至今仍装点着这座城市的井盖；罗马人喜欢一个笑话，把它解读为“这些罗马人疯了”——这句台词借自法国漫画《阿斯泰利克斯》，其主人公的名字是对（星号）一词的双关。罗马方言把（言语）交锋提升为一门艺术：它粗俗、机敏，偏爱（委婉语）、骂人话和偶尔的（用词错误），其幽默在外人听来可能（荒唐无稽），而且它几乎没有一个词是（单义的）。要掌握它那（口舌上的）功夫，得花上一辈子。"}, {"en": "Rome's history records one (cataclysm) after another. The city still celebrates its (natal) day on April 21st, the date in 753BC on which Romulus is said to have founded it. In 1527 mutinous troops of the Holy Roman Emperor sacked Rome, slaughtered most of the Swiss Guard on the steps of St Peter's and forced Pope Clement VII to pay a (ransom) for his freedom. In 1870 Italian troops breached the walls at Porta Pia and seized the city, ending a temporal power (coeval) with many of Italy's medieval states, and for six decades popes called themselves \"prisoners in the Vatican\". That (upheaval) cast a (pall) over relations between church and state until 1929, when Mussolini signed the Lateran Pacts and created the Vatican City State, 44 hectares in all. Its army, the Swiss Guard apart, numbers (nil); its influence, (incorporeal) but real, reaches every continent.", "zh": "罗马的历史记录着一场又一场（大灾变）。这座城市至今仍在4月21日庆祝它的（诞生）之日——据说罗慕路斯正是在公元前753年的这一天建城。1527年，神圣罗马皇帝的哗变军队洗劫罗马，在圣伯多禄大殿的台阶上屠杀了大部分瑞士近卫兵，并迫使教皇克莱门特七世支付（赎金）以换取自由。1870年，意大利军队在庇亚门攻破城墙、夺取了这座城市，终结了一个与意大利许多中世纪政权（大致同时代的）教皇世俗政权；此后六十年间，历任教皇自称“梵蒂冈的囚徒”。这场（剧变）给政教关系投下了一层（阴影），直到1929年墨索里尼签署《拉特朗条约》，建立了总面积仅44公顷的梵蒂冈城国。除瑞士近卫队外，它的军队人数为（零）；它的影响力虽（无形），却真实存在，遍及每一个大洲。"}, {"en": "Mussolini left a deeper mark on the city than many Romans like to admit. Seeking a (parallel) between himself and the emperors, he bulldozed a warren of old streets to drive a triumphal avenue through the forums of the emperors, opened with an (inaugural) parade in 1932, and began clearing land for what would eventually become the Via della Conciliazione leading to St Peter's. His (egoism) was carved in stone: a marble monolith inscribed \"MUSSOLINI DUX\" still stands at the Foro Italico, and EUR, a district of white travertine planned for a world's fair in 1942 that never took place, is dominated by a \"Square Colosseum\" whose arches rise in a severe (vertical) grid; it is now the headquarters of Fendi, a fashion house. Opponents of the regime were punished with internal exile, a cruel form of (ostracism). Italy has never quite decided what to do with this (amoral) legacy, so most of it is simply used.", "zh": "墨索里尼在这座城市留下的印记，比许多罗马人愿意承认的更深。为了在自己与历代皇帝之间建立（类比），他推平了一片老街巷，开辟出一条穿过皇帝广场群的凯旋大道——1932年以一场（落成）游行宣告启用——并开始清理土地，为后来通往圣伯多禄大殿的协和大道铺路。他的（自我中心）被刻进了石头：一块刻着“MUSSOLINI DUX”的大理石方碑至今仍矗立在意大利广场体育中心；而为一场从未举行的1942年世界博览会规划的EUR区——一片白色石灰华建筑群——以一座“方形斗兽场”为主体，其拱门以严整的（垂直）网格层层叠起，如今是时装品牌芬迪的总部。政权的反对者被处以国内流放，这是一种残酷的（放逐排斥）。意大利从未真正决定该如何处理这份（不讲道德的）遗产，于是大部分只是照常使用。"}, {"en": "Rome's hospitals matter for more than popes. The Bambino Gesù, a children's hospital owned by the Holy See, treats patients from all over the world, many of them with (congenital) heart defects, and is a (maternal) presence in the lives of thousands of families. The city's medical history is long and sometimes grim. Santa Maria della Pietà, a vast psychiatric (asylum) once among the largest in Europe, held thousands of patients, some suffering from (delirium), others merely inconvenient, until it closed in 1999; it now houses a museum of the mind. The Forlanini, a vast (sanatorium) built in the 1930s, isolated sufferers from tuberculosis, a disease caused by a (bacterium) that thrived in damp slums, at a time when doctors could not (heal) the (infirm) but could at least keep them apart. Today the city's laboratories study every (germ) and (organism) that threatens health, a belt of (pharmaceutical) factories south of Rome is one of Italy's biggest export earners, and the city's pharmacies still sell (menthol) (balm) for every ache.", "zh": "罗马的医院不只对教皇重要。圣座拥有的儿童医院“圣婴耶稣医院”收治来自世界各地的病人，其中许多患有（先天性）心脏缺陷；对成千上万个家庭来说，它是一种（母亲般的）存在。这座城市的医疗史悠久，有时也很阴暗。圣母怜子精神病院曾是欧洲规模最大的精神病（收容院）之一，收容过数千名病人——有些人患有（谵妄），另一些人不过是碍了别人的事——直到1999年关闭；如今那里是一座心灵博物馆。福拉尼尼是一座建于1930年代的巨大（疗养院），用来隔离结核病患者；这种病由一种在潮湿贫民窟里滋生的（细菌）引起，而当时的医生虽无法（治愈）这些（体弱多病者），至少能把他们隔离开来。如今，这座城市的实验室研究每一种威胁健康的（病菌）和（生物体），罗马以南的一片（制药）工厂带是意大利最大的出口创汇来源之一，而城里的药店仍出售可治百痛的（薄荷脑）（药膏）。"}, {"en": "Rome is also a city of scholars. Sapienza, founded by Boniface VIII in 1303, is one of the oldest and largest universities in Europe, and the Vatican's universities train priests from every continent in a (curriculum) heavy on philosophy and theology. The Accademia dei Lincei, founded in 1603 and named after the sharp-eyed lynx, counted Galileo among its members, and an (academician) of the Lincei still enjoys immense prestige; its (periodical) proceedings range from (theoretical) physics to classical philology. The city's (intellectual) life swings between hard-nosed (empiricism) and the kind of scholastic (sophism) that thrives in seminaries. A (colloquium) at a church university can still turn on a (hypothetical) question that would have delighted Thomas Aquinas; the speaker's (honorarium) is modest, the (encomium) that introduces him lavish. Italian students who (flunk) an exam may retake it again and again, which helps explain why so many graduate late, and why employers are (critical) of the system.", "zh": "罗马也是一座学者之城。由卜尼法斯八世于1303年创立的罗马大学是欧洲最古老、规模最大的大学之一；梵蒂冈的各所大学则以一套偏重哲学和神学的（课程），培养来自各大洲的神父。猞猁之眼国家科学院创建于1603年，以目光敏锐的猞猁命名，伽利略曾是其成员；该院的（院士）至今仍享有极高声望，其（定期出版的）会刊内容从（理论）物理学到古典语文学无所不包。这座城市的（知识）生活，在务实的（经验主义）与神学院里盛行的那种经院式（诡辩）之间摇摆。在一所教会大学里举行的（学术讨论会），仍可能围绕一个会令托马斯·阿奎那欣喜的（假设性）问题展开；演讲者的（酬金）微薄，介绍他时的（颂词）却极尽溢美。意大利学生某门考试（不及格）可以一考再考，这有助于解释为何那么多人延迟毕业，也解释了雇主为何对这套制度颇多（批评）。"}, {"en": "In the 1930s Rome was briefly the (fulcrum) of nuclear physics. A group of young scientists led by Enrico Fermi, nicknamed the \"Via Panisperna boys\" after the street where their laboratory stood, bombarded elements with a (beam) of slowed neutrons, work that provided a (spark) for later advances in nuclear physics and was (instrumental) in Fermi's winning the Nobel prize in 1938 for his research on neutron irradiation and induced radioactivity. Then Mussolini's racial laws, which threatened Fermi's Jewish wife, Laura, acted as a (centrifugal) force on Italian science, flinging its best minds abroad, while America exerted a (gravitational) pull. Fermi went to Chicago, Leo's home town, where in 1942 he built the first nuclear reactor beneath the stands of a university football field. The (causal) chain running from a Roman laboratory to the atomic bomb is (stark); the (factual) record of who understood what, and when, remains (partial).", "zh": "20世纪30年代，罗马曾一度是核物理学的（支点）。一群由恩里科·费米领导的年轻科学家——因实验室所在街道而被称为“帕尼斯佩尔纳街男孩”——用一（束）慢化中子轰击各种元素，这项工作为核物理学后来的进展点燃了（火花）；费米因中子轰击和人工放射性方面的研究获得1938年诺贝尔物理学奖，而上述工作对此（起了关键作用）。随后，墨索里尼的种族法威胁到费米的犹太裔妻子劳拉，对意大利科学形成了一股（离心）力，把其最优秀的头脑甩向国外，而美国则产生了（引力般的）吸引。费米去了利奥的家乡芝加哥，1942年在一所大学橄榄球场的看台下建成了第一座核反应堆。从罗马一间实验室到原子弹之间的（因果）链条一目了然而（冷峻）；至于谁在何时明白了什么，（史实）记录仍然（残缺不全）。"}, {"en": "Rome remains a favourite place to marry. Foreign couples book (nuptial) masses in baroque churches and pose for photographers on the Spanish Steps, the bride's (veil) whipping in the wind and the (groom) sweating in a hired suit, and many a (parochial) priest finds the trade a welcome source of income. Italians themselves are less eager. The marriage rate has fallen sharply, couples marry later, and (marital) commitments are often deferred; (connubial) life begins later than it once did: most Italians aged 18 to 34 still live with their parents, a (filial) arrangement that foreigners mock and economists blame on scarce jobs and high rents. Many a (dutiful) son brings his laundry home; a grandmother's ring, passed down as an (heirloom), may wait years for a finger. The constitution's (espousal) of the family as the foundation of society sits oddly with a birth rate among the lowest in the world, though a (blissful) few still manage large broods.", "zh": "罗马仍是举办婚礼的热门之地。外国情侣在巴洛克教堂预订（婚礼）弥撒，在西班牙台阶上为摄影师摆姿势——新娘的（面纱）在风中飞扬，（新郎）穿着租来的西装满头大汗；不少（教区）神父觉得这门生意是一笔可观的收入。意大利人自己却没那么热衷。结婚率急剧下降，伴侣成婚越来越晚，（婚姻上的）承诺也往往被推迟；（夫妻共同的）生活比以往开始得更晚：大多数18至34岁的意大利人仍与父母同住，这种（子女侍亲式的）安排遭外国人嘲笑，经济学家则归咎于工作稀缺和房租高昂。许多（孝顺的）儿子把脏衣服带回家洗；祖母传下来的戒指作为（传家宝），可能要等上好些年才戴到某根手指上。宪法对家庭作为社会基础的（拥护），与世界上最低之列的出生率形成了奇特的反差，不过仍有少数（幸福美满的）家庭儿女成群。"}, {"en": "Rome is greener than its reputation. Its great parks, the Villa Borghese and the Villa Doria Pamphilj, cover hundreds of hectares; the botanical garden on the slopes of the Janiculum includes an (arboretum), and the (arboreal) canopy of umbrella pines defines the skyline. The city zoo houses everything from a (marsupial) to an (amphibian). Of the famous seven hills, several are little more than a (knoll). The Tiber's (fluvial) floods, which would (roil) through the low-lying centre every few years, were tamed only after 1870 by massive embankment walls. Beyond the city lies the Campagna, a (pastoral) landscape of sheep, where a (ram) still leads the flock to pasture and the milk becomes pecorino. In winter a (glacial) wind, the tramontana, blows down from the north; the maestrale, Italy's (mistral), brings clear skies. The (littoral) around Ostia, Rome's seaside district, fills with holidaymakers each summer weekend; sea breezes meet the (terrestrial) habitats of the coastal dunes there.", "zh": "罗马比它的名声要绿。博尔盖塞别墅和多利亚·潘菲利别墅这样的大公园占地数百公顷；贾尼科洛山坡上的植物园里有一座（树木园），伞松那（树木的）冠盖勾勒出天际线。市立动物园里从（有袋动物）到（两栖动物）一应俱全。著名的七丘中，有几座不过是一个（小土丘）。台伯河的（河流）洪水每隔几年就会（翻涌）冲过地势低洼的市中心，直到1870年后才被巨大的堤墙驯服。城外是坎帕尼亚——一片放羊的（田园）风光，一只（公羊）仍领着羊群去吃草，羊奶则被制成佩科里诺奶酪。冬天，一股（冰冷刺骨的）北风——特拉蒙塔纳风——从北方吹来；马埃斯特拉莱风，即意大利的（密史脱拉风），则带来晴朗的天空。罗马海滨地区奥斯蒂亚的（沿海地带），每个夏季周末都挤满了度假者；海风在那里吹拂海岸沙丘的（陆地）生态环境。"}, {"en": "Rome's water is one of its unsung glories. Eleven aqueducts supplied the ancient city, and some of their sources still feed its fountains. Around 2,500 cast-iron drinking fountains, nicknamed \"nasoni\" for their (nasal) spouts, dispense free, cold, (calcium)-rich water around the clock. When drought struck in 2017 the city shut many of them off; (rational) as the decision was, Romans took it as a betrayal of a birthright. Their indignation was a reminder that in Rome even plumbing carries history in every (seam).", "zh": "罗马的水是它不为人知的荣耀之一。古城曾由十一条渡槽供水，其中一些水源至今仍在供给城中的喷泉。约2500座铸铁饮水泉因其（鼻子状的）出水口而被昵称为“大鼻子”，昼夜不停地供应免费、清凉、富含（钙）的水。2017年遭遇干旱时，市政府关闭了其中许多；这一决定尽管（合乎理性），罗马人却视之为对一项与生俱来权利的背叛。他们的愤慨提醒人们：在罗马，连管道的每一道（接缝）里都承载着历史。"}, {"en": "For all its worldliness, Rome remains a city of (corporal) works of mercy. The Community of Sant'Egidio, founded by students in 1968 and based in Trastevere, runs soup kitchens and language schools and has even brokered peace deals, including the one that ended Mozambique's civil war in 1992. Francis had showers for the homeless installed beneath St Peter's colonnade. Such (altruism) offers the poor a (modicum) of dignity in (lean) times. Its practitioners insist that charity must never (demean) those it helps; they teach Italian to migrants to help (wean) them off reliance on interpreters, and they have little patience for donors who give merely to (redeem) a guilty conscience.", "zh": "尽管世俗气息浓厚，罗马仍是一座践行（形体）哀矜善工的城市。1968年由一群学生创立、总部设在特拉斯提弗列的圣艾智德团体，开办施粥所和语言学校，甚至促成过和平协议，其中包括1992年结束莫桑比克内战的那份协议。方济各曾在圣伯多禄大殿的柱廊下为无家可归者修建淋浴间。这种（利他精神）让穷人在（艰难）时期得到（些许）尊严。其实践者坚持认为，慈善绝不能（贬低）受助者；他们教移民学意大利语，帮助他们逐渐（摆脱）对口译人员的依赖；对于那些只为（救赎）自己愧疚良心而捐款的人，他们没什么耐心。"}, {"en": "Rome was not a medieval (nautical) republic like Venice or Genoa, but the ancient Roman state commanded mighty fleets, and the city has always depended on the sea. Ancient Ostia, now a ghost town of warehouses and mosaics, received the grain ships that fed the ancient capital. Today cruise passengers (debark) at Civitavecchia, an hour away by coach, and pour into the city for a day; a single (vessel), its white (hull) towering over the port, can unload several thousand visitors at once. Their guides recite the same (gospel) at every stop, some of it history, some of it (drivel), and the hurried tourist who is not careful will be told facts chosen at (random) by people paid to (misinform) him charmingly.", "zh": "罗马并不是威尼斯或热那亚那样的中世纪（航海）共和国；不过古罗马国家曾拥有强大的舰队，而这座城市始终依赖海洋运输。古代的奥斯蒂亚如今是一座由仓库和马赛克构成的鬼城，当年曾接收供养古都的运粮船。如今，邮轮乘客在一小时车程外的奇维塔韦基亚（下船上岸），涌入城中游览一天；一艘（船只）的白色（船体）高耸于港口之上，一次就能卸下数千名游客。他们的导游在每一站都重复同样一套（奉为权威的说辞）——其中有些是历史，有些则是（胡扯）；稍不留神，匆忙的游客就会被那些拿钱办事的人以迷人的方式（误导），听到一堆（随意）挑选的“事实”。"}, {"en": "Rome is a diplomatic capital twice over. Most countries keep two embassies there, one to Italy and one to the Holy See, a (dual) presence found nowhere else, and many add a (consul) for good measure; the city also hosts the UN's Food and Agriculture Organisation. Vatican diplomacy is (magisterial) in tone and (confidential) by habit. Its envoys report through channels older than most nation-states, and the evidence of their influence is usually (circumstantial): a prisoner released here, a child returned to her family there. Leo has offered the Vatican as a venue for talks to end the war in Ukraine, so far with (nominal) results. Critics call the Holy See's diplomacy (ineffectual); its defenders reply that its power was always moral rather than military, and that no step towards peace is (inconsequential).", "zh": "罗马是双重意义上的外交之都。大多数国家在这里设有两个大使馆，一个派驻意大利，一个派驻圣座——这种（双重）存在别处绝无仅有——许多国家还另设一位（领事）；这座城市还是联合国粮农组织的总部所在地。梵蒂冈的外交语气（权威庄重），习惯上（守口如瓶）。其使节通过比大多数民族国家还古老的渠道汇报，其影响力的证据通常只是（间接的）：这里释放了一名囚犯，那里一个孩子回到了家人身边。利奥曾提出让梵蒂冈作为结束乌克兰战争谈判的场地，迄今成果（有限）。批评者称圣座的外交（无能为力）；其辩护者则回应说，它的力量从来都是道义上的而非军事上的，而迈向和平的任何一步都不是（无足轻重的）。"}, {"en": "Private money has helped to pay for the city's upkeep. Tod's, a shoemaker, spent €25m restoring the Colosseum; Fendi paid for the cleaning of the Trevi Fountain and Bulgari for that of the Spanish Steps. The giant advertisements that hang from scaffolding during such works are hardly (subliminal). Purists may (disclaim) any enthusiasm for commercial sponsorship, but few would deny that the restorations have won wide (acclaim). Sponsorship is no (nostrum) for chronic underfunding; the (desideratum) is a stable public budget. The city has imposed a (moratorium) on new minimarkets and takeaway shops in parts of the historic centre, in an attempt to restore some (equilibrium) between residents and visitors. The (optimum) balance remains elusive, and every new rule seems to arrive with an (addendum) of exemptions.", "zh": "私人资金帮助支付了这座城市的维护费用。鞋履制造商托德斯斥资2500万欧元修复斗兽场；芬迪出资清洗特雷维喷泉，宝格丽则出资修缮西班牙台阶。修复期间挂在脚手架上的巨幅广告毫不（隐晦难察）。纯粹主义者或许会（声明自己毫不认同）商业赞助，但很少有人会否认，修复工程赢得了广泛（赞誉）。赞助并非解决长期资金不足的（灵丹妙药）；真正（迫切需要的）是稳定的公共预算。市政府已在历史中心的部分区域对新开的小超市和外卖店实行（暂停许可），试图在居民与游客之间恢复某种（平衡）。（最佳）平衡点依然难以捉摸，而每一条新规似乎都附带着一份豁免（附录）。"}, {"en": "Old Rome survives in its workshops and its characters. In the lanes around Campo de' Fiori a few artisans still work with (awl) and (anvil), mending shoes and hammering iron, and barbers practise the (tonsorial) arts in shops that have barely changed since the 1950s. Trappist monks at Tre Fontane (distill) a liqueur from eucalyptus trees planted in the 19th century to drain malarial marshland, and the floating watermills that once ground the city's flour on the Tiber appear in old prints, each (mill) tethered against the river current. Romans have always mocked the provincial (yokel), envied the (genteel) aristocrats in their crumbling palazzi and gossiped about the (wastrel) sons who squander what remains; every neighbourhood has its (churl) of a waiter and its (harridan) shouting from a window. Wit and a refusal to be hurried are the city's (hallmark). Romans (excel) at improvisation, especially when rules (trammel) their initiative; every attempt to impose a tidy system risks making old informal arrangements (ravel) at the seams.", "zh": "老罗马在它的作坊和人物中延续着。在鲜花广场周围的小巷里，仍有几位手艺人用（锥子）和（铁砧）干活，修鞋打铁；理发师在自1950年代以来几乎未变的店铺里施展（理发的）手艺。三泉修道院的特拉普派修士用19世纪为排干疟疾沼泽而栽种的桉树（蒸馏）出一种利口酒，当年漂浮在台伯河上磨面粉的水磨坊，如今只能在旧版画中见到；每座（磨坊）都系在河中，借流水推动磨轮。罗马人向来嘲笑外省的（乡巴佬），羡慕住在破败宫殿里的（文雅体面的）贵族，并对那些挥霍残余家产的（败家子）议论纷纷；每个街区都有它（粗人）般的侍者，也有它从窗口大喊大叫的（泼妇）。机智和拒绝被催促，是这座城市的（标志）。罗马人（擅长）随机应变，尤其当规定（束缚）他们的主动性时；而每一次试图建立整齐划一制度的努力，都可能让旧有的非正式安排在接缝处（散乱瓦解）。"}, {"en": "The city's statues have stories of their own. On the bronze St Peter in the basilica, the (distal) tips of the toes on his right foot have been worn smooth by centuries of pilgrims' kisses. The Capitoline Wolf, emblem of the city, suckles Romulus and Remus from her (ventral) teats, her (dorsal) fur rendered in stylised curls; the twins were added in the Renaissance, and radiocarbon tests suggest that the wolf herself was cast in the Middle Ages rather than in antiquity. Rome absorbed that blow to its civic myth with (preternatural) calm. By moonlight the (vestigial) columns around the Capitoline look (spectral), and it is easy to believe that the (phantom) of empire still walks there.", "zh": "这座城市的雕像各有各的故事。圣伯多禄大殿里的伯多禄青铜像，右脚脚趾的（远端）尖部已被历代朝圣者亲吻得光滑。这座城市的象征——卡比托利欧母狼——用（腹部的）乳头哺育着罗慕路斯和雷穆斯，它（背部的）毛发被处理成程式化的卷曲；那对双胞胎是文艺复兴时期添加的，而放射性碳检测表明，母狼本身铸造于中世纪，而非古代。罗马以（超乎寻常的）平静承受了这一对其城市神话的打击。月光下，卡比托利欧山周围（残存的）石柱显得（幽灵般）阴森，让人不难相信帝国的（幽灵）仍在那里徘徊。"}, {"en": "Back at the Gemelli, Vatican-watchers parse every bulletin. The Holy See releases medical news in (sequential) statements, terse and (unexceptional) in tone, and journalists treat every (physiological) detail as a political signal. Further (pathological) analysis, including examination of lymph nodes, will help doctors assess the extent of the cancer and whether more treatment is needed. Early surgery may offer a good prognosis, but it would be premature either to call the illness (terminal) or to rule out further treatment; talk of the next conclave is, for now, (tangential). But the episode will (compel) the curia to think about contingencies it prefers to ignore, and may (impel) Leo to settle in writing what should happen if a pope cannot govern. For a church whose government rests on one man, such questions are (integral), not (optional).", "zh": "回到杰梅利医院，梵蒂冈观察家们逐字解读每一份公报。圣座以（接续发布的）声明公布医疗消息，措辞简洁，语气（平淡无奇），记者们却把每一个（生理上的）细节都当作政治信号。进一步的（病理学）分析，包括对淋巴结的检查，将帮助医生评估癌症范围及是否需要追加治疗。早期手术可能意味着较好的预后，但现在无论断言病情已经（无法治愈、危及生命的），还是断言无需进一步治疗，都为时过早；关于下一次秘密会议的议论，目前仍属（与眼前问题关系不大的）话题。但这一插曲将（迫使）教廷思考它宁愿忽视的种种意外情况，也可能（促使）利奥以书面形式明确规定：一旦教皇无法治理，应当如何处置。对一个治理系于一人之身的教会来说，这些问题是（不可或缺的），而非（可有可无的）。"}, {"en": "City politics swings like a (pendulum). Romans elected a populist outsider from the Five Star Movement in 2016 and a centre-left technocrat, Mr Gualtieri, in 2021; each new mayor promises to (reclaim) the city from decline, and most leave office to the (odium) of voters who feel that nothing has changed. Opposition councillors (assail) every plan while a fresh (broil) erupts among rival factions in the corridors of the Campidoglio, and every opinion (poll) shows Romans despairing of their city yet unwilling to leave it. Real reform would (entail) taking on the taxi drivers, the transport unions and the city's own bureaucracy, and no mayor has yet managed to (marshal) the support required. Politicians (declaim) their plans in the grand language of the Risorgimento; voters greet the oratory with a knowing (wink). A (diagram) of who is responsible for what in Rome, from the city and the region to the national government, the heritage ministry and the Vatican, would look like a plate of spaghetti, and every new mayor's favourite (stratagem) is to blame his predecessors. Romans (overlook) a great deal, but they will not (brook) interference in their habits, and every (quirk) of the system has its defenders. Progress comes in fits and starts, each (jerk) forward followed by a long pause; nobody expects a new (paradigm).", "zh": "城市政治像（钟摆）一样来回摆动。罗马人在2016年选出了一位来自五星运动的民粹主义局外人，2021年又选出了中左翼技术官僚瓜尔蒂耶里；每位新市长都承诺要把城市从衰落中（夺回），而大多数人卸任时都背负着选民的（憎恶）——选民们觉得什么都没改变。反对派议员（猛烈抨击）每一项计划，卡比托利欧宫的走廊里又爆发了派系之间的新一场（争吵），而每一次民意（调查）都显示，罗马人对自己的城市感到绝望，却又不愿离开。真正的改革将（意味着）同出租车司机、交通工会以及市政府自己的官僚机构较量，而迄今没有哪位市长能够（集结）所需的支持。政客们用复兴运动时代的宏大语言（慷慨陈词）自己的计划；选民们则以心照不宣的一（眨眼）回应这些演说。罗马由谁负责什么——从市政府、大区到中央政府、文化遗产部和梵蒂冈——若画成一张（图表），看起来会像一盘意大利面；每位新市长最爱用的（计策），就是把责任推给前任。罗马人能（不予计较）很多事，但他们不会（容许）别人干涉他们的习惯，而这个体制的每一个（怪癖）都有其拥护者。进步时断时续，每一次向前（猛地一动）之后都跟着一段漫长的停顿；没人指望出现一种新的（范式）。"}, {"en": "Rome's old aristocracy, the \"black nobility\" that stayed loyal to the popes after 1870, is fading but not gone. Its palazzi hold frescoed ballrooms above shopfronts and, here and there, cracked (linoleum) in the old servants' quarters. Many families (bail) themselves out by letting rooms to tourists, and the most (resourceful) have turned ancestral homes into hotels and wedding venues. In 2022 the Villa Aurora, a Ludovisi family property that contains the only ceiling painting by Caravaggio, went under the (gavel) with a price of €471m and attracted not a single bid; a family feud over the estate ended with an American-born princess being evicted the following year. Inheritance disputes (spoil) many a dynasty and debts (whelm) others, and in one (fell) swoop a death can scatter a collection assembled over centuries. The estates of the Campagna were once worked by peasants under conditions close to (serfdom), so few tears are shed for the landlords' decline; but nobody is sure that their successors, investment funds and foreign billionaires, will (prevail) as better custodians.", "zh": "罗马的旧贵族——1870年后仍效忠教皇的“黑色贵族”——正在衰落，但尚未消失。他们的宫殿里，有临街店面之上绘满壁画的舞厅，也有昔日仆人住处那裂了缝的（油毡地面）。许多家族靠把房间租给游客来（纾困）自救，最（足智多谋的）则把祖宅改造成酒店和婚礼场地。2022年，路德维西家族名下的奥罗拉别墅——内有卡拉瓦乔唯一的天顶画——以4.71亿欧元的标价被送到（拍卖槌）之下，结果无人出价；围绕这份遗产的家族纷争，以次年一位美国出生的王妃被逐出别墅而告终。遗产纠纷（毁掉）了许多望族，债务又（吞没）了另一些；一次死亡就可能在（凶猛的）一击之下，把几个世纪积攒的收藏冲散。坎帕尼亚的庄园曾由处境近乎（农奴制）的农民耕种，所以很少有人为地主的衰落流泪；但谁也说不准，他们的继任者——投资基金和外国亿万富翁——能否作为更好的守护者（占上风）。"}, {"en": "In August Romans abandon their city. Around Ferragosto, the mid-August holiday, shops close, traffic vanishes and the streets are left to tourists and the heat; those who stay behind endure a (dull) heat and an almost palpable (boredom). Animal shelters fill up as some owners abandon their pets before leaving, and every (kennel) in the region overflows. Romans quit their city without a (qualm), and return in September with their usual (vim), ready for the (festal) calendar of saints' days and harvest fairs, and ready, too, to (hem) and haw over every problem they left behind.", "zh": "八月，罗马人抛下他们的城市。八月节前后，商店关门，车流消失，街道留给了游客和酷暑；留下的人忍受着（沉闷的）暑热和几乎触手可及的（无聊感）。动物收容所人满为患，因为有些主人在出门前遗弃宠物，该大区的每一个（狗舍）都装不下。罗马人离开自己的城市时毫无（不安），九月归来时又带着惯有的（活力），准备迎接圣徒节日和丰收集市组成的（节庆）日历，也准备好对离开前留下的每个问题（支吾）其词、犹豫不决。"}, {"en": "The Vatican's newspaper, L'Osservatore Romano, founded in 1861, prints papal speeches in full and treats a (typographical) error in a papal text as a small scandal; its (reportorial) style favours the long view over the scoop. Rome's own literature has a (metrical) heart. In the 1830s and 1840s Giuseppe Gioachino Belli wrote more than 2,000 sonnets in Roman dialect, earthy portraits of popes and plebeians whose slang scholars have catalogued in (alphabetical) glossaries. His verses are never (banal), and their (parallelism) of the sacred and the profane is the city's own. Romans still trade a (tautological) joke: a true Roman is one whom other true Romans recognise as such; a stricter version demands seven generations of Roman ancestry, and every trattoria accuses its neighbour of (plagiarism) whenever a dish catches on.", "zh": "梵蒂冈的报纸《罗马观察报》创办于1861年，全文刊登教皇的讲话，把教皇文本中的一个（排印）错误当作一桩小丑闻；它的（新闻报道）风格重视长远眼光而非独家新闻。罗马自己的文学有一颗（格律）之心。19世纪30至40年代，朱塞佩·焦阿基诺·贝利用罗马方言写了两千多首十四行诗，以粗犷的笔触描绘教皇和平民，学者们已把诗中的俚语编入（按字母顺序排列的）词汇表。他的诗从不（陈腐平庸），神圣与世俗之间的（对仗并置）正是这座城市自身的写照。罗马人至今仍在讲一个（同义反复的）笑话：真正的罗马人，是其他真正的罗马人承认的罗马人；更苛刻的说法则要求祖上七代都住在罗马。而每当某道菜走红，每家小馆子都会指责邻居（抄袭）。"}, {"en": "Rome has outlasted emperors, popes and dictators, and it will outlast its present troubles. Its claim to be (immortal) is a figure of speech rather than a (literal) truth, but few cities have a better case. Once the capital of the Western world and still the capital of the (occidental) church, it exerts a (centripetal) pull on pilgrims, scholars and tourists alike. The Vatican's sense of time is almost (sidereal): it counts in centuries, and its museums hold everything from Etruscan bronzes to (aboriginal) artefacts from Australia, gathered by missionaries for a great exhibition in 1925. Problems that defeat frontal assault sometimes yield to (lateral) thinking, and a political culture (inimical) to long-term planning has somehow preserved a city (congenial) to almost everyone who visits it.", "zh": "罗马比皇帝、教皇和独裁者都活得长久，它也将熬过眼下的种种麻烦。它自称（不朽），这只是一种修辞而非（字面意义上的）真理，但很少有城市比它更有资格这样说。它曾是西方世界的首都，至今仍是（西方）教会的首都，对朝圣者、学者和游客都产生着一种（向心的）吸引力。梵蒂冈的时间感几乎是（恒星般）的：它以世纪计时，其博物馆收藏着从伊特鲁里亚青铜器到1925年传教士为一场盛大展览收集的澳大利亚（原住民）器物在内的一切。那些正面强攻无法解决的问题，有时会屈服于（横向的）思维；而一种（不利于）长远规划的政治文化，不知怎么竟保存下了一座几乎让每位访客都感到（亲切宜人）的城市。"}, {"en": "On a clear evening, when the light turns an (empyreal) gold over the domes and the swifts wheel screaming above the rooftops, the city's (transcendental) claims seem almost plausible. Romans, who make no public (avowal) of piety but light a candle all the same, will wish their American pope a swift recovery. Then they will go back to complaining about the buses. Rome remains a (nonpareil): impossible to govern, impossible to leave, and impossible, for all its troubles, not to love.", "zh": "在一个晴朗的傍晚，当光线把穹顶染成一片（天界般的）金色、雨燕在屋顶上空尖叫盘旋时，这座城市那些（超越尘世的）宣称似乎也几乎可信了。罗马人不常公开（宣示）自己的虔诚信仰，却照样会点上一支蜡烛，他们会祝愿自己的美国教皇早日康复。然后，他们又会回过头去抱怨公交车。罗马依然（举世无双）：无法治理，无法离开，而且尽管麻烦重重，也无法不爱。"}];
const HAS_TITLE = true;
const SUBTITLE_EN = "";
const SUBTITLE_ZH = "";

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  if (typeof SUBTITLE_EN !== 'undefined' && SUBTITLE_EN) {
    const sub = document.createElement('div');
    sub.className = 'book-subtitle';
    sub.textContent = SUBTITLE_EN;
    div.appendChild(sub);
  }
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  if (typeof SUBTITLE_ZH !== 'undefined' && SUBTITLE_ZH) {
    const subZh = document.createElement('div');
    subZh.className = 'zh-subtitle';
    subZh.textContent = SUBTITLE_ZH;
    div.appendChild(subZh);
  }
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
