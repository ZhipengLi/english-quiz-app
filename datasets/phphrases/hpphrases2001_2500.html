<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrases 2001–2500 — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>Phrases 2001–2500</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "At Greyglass Academy, failure had a colour: pale green. Nella watched her examination stone glow while Master Orr regarded it (impassively). A (droplet) from her sleeve fell into his (inkpot), making a blue (blot) (sprout) legs and (scoot) across the desk. Orr caught it beneath a (snuffbox). “Control,” he said, (pointedly), “is everything.” Nella could repair a lock but (scarcely) raise a feather by magic. Across the room, Prentiss lounged on a (tuffet), smiling (languidly). His robe was (resplendent), his hair arranged in a perfect (ringlet), his confidence (buoyant). Apparently the universe liked him.", "zh": "在灰镜学院，失败有一种颜色：淡绿色。内拉看着自己的考试石泛起这种光，奥尔老师则（面无表情地）注视着它。她袖口的一颗（水滴）落进他的（墨水瓶），让一块蓝色（墨迹）（长出）了腿，沿桌面（飞快地跑动）。奥尔用一只（鼻烟盒）把它罩住。“控制，”他（意味深长地）说，“决定一切。”内拉能修好一把锁，却（几乎不能）用魔法托起一根羽毛。房间另一端，普伦蒂斯倚在（矮软凳）上，（懒洋洋地）微笑着。他的长袍（华丽耀眼），头发卷成完美的（鬈发），自信（昂扬）。显然，宇宙偏爱他。"}, {"en": "Nella tried to (coax) the feather (aloft). It performed a (somersault), then became a (tuft) of green smoke. Prentiss gave a (snort); someone whispered “(dolt)”. Orr's (steely) glance silenced them. He was not (malevolent), merely (supremely) certain that his teaching worked. Her failure therefore seemed an (affront). He had the (clout) to end her studies, and she had no (overt) reason to expect mercy. “A (fortnight),” he said. “Pass, or (forfeit) your scholarship.” The mark beside her name was (nought). At the (outset), she had considered her nervousness ordinary (fright). Now it felt like a (straitjacket). She stared (numbly), fighting the urge to (fidget). Above her, a painted (alchemist) appeared to (squint) with disappointment. Even portraits recognised an unsuccessful student.", "zh": "内拉试着（诱导）羽毛飞到（空中）。羽毛翻了个（筋斗），随即变成一（簇）绿烟。普伦蒂斯（哼）了一声；有人低声说“（笨蛋）”。奥尔（冷峻）的目光让他们安静下来。他并不（恶毒），只是（极其）确信自己的教学有效。因此，她的失败仿佛成了一种（冒犯）。他拥有终止她学业的（权力），而她看不出任何（明显的）理由相信他会宽容。“（两周），”他说，“通过考试，否则（失去）奖学金。”她名字旁边的分数是（零）。在（起初），她还觉得自己的紧张只是普通的（害怕），现在却像被套上了（束缚衣）。她（麻木地）盯着前方，克制着（坐立不安）的冲动。头顶的一幅（炼金术士）画像似乎失望地（眯起眼睛）。连画像都认得出不成功的学生。"}, {"en": "Tavi waited beneath the (archway), holding a (currant) (crumpet). He was (gangly), (cheeky), and perpetually (peaky) from forgetting breakfast. His (flyaway) hair escaped a (bonnet) borrowed for costume practice; his (baggy) trousers concealed a lost sock. “Walking ink!” he said (spiritedly). “That's (downright) impressive.” Nella smiled (lopsidedly). She had a (shabby) coat, a (grubby) toolbox, and a (scabby) thumb. She needed marks, not applause. Tavi divided the bread, letting crumbs (strew) the step. His methods of (uplift) were simple and worked (dependably).", "zh": "塔维在（拱门）下等着，手里拿着一块（醋栗）味的（烤饼）。他（瘦长笨拙）、（调皮大胆），又因为总忘记吃早饭而常常显得（憔悴）。他（蓬乱轻飘）的头发从一顶为戏服排练借来的（软帽）里钻出来；（宽松）的裤子里藏着一只失踪的袜子。“会走路的墨水！”他（兴致勃勃地）说，“那（简直）太厉害了。”内拉（歪着嘴）笑了笑。她有一件（破旧）的外套，一个（脏兮兮）的工具箱，还有一根（结着痂）的拇指。她需要的是分数，不是掌声。塔维把饼掰成两半，让碎屑（散落）在台阶上。他让人（振作）的办法很简单，而且（可靠地）奏效。"}, {"en": "Greyglass stood above a (murky) river, beyond the last (motorway) exit. Its (pamphlet) praised the ancient (turret), royal (consort), and gardens where students might (cavort). It omitted the (leaky) roofs and (cobwebby) stairs. A (draught) haunted every (passageway); every window had a (slant). Beneath a (gaunt) queen's portrait, the school's (basset) slept beside a (thickset) gardener with a (stubbly) chin. A school (mascot), a wooden dragon with a chipped jaw, watched over them. Outside, a (shaggy) pony waited for a visitor to (dismount). Nella preferred this imperfect corner to the (floodlit) hall where successful pupils learned to occupy the (limelight).", "zh": "灰镜学院坐落在一条（浑浊）的河流上方，要驶过（高速公路）最后一个出口才能抵达。学院的（宣传册）赞美古老的（角楼）、曾居住于此的王室（配偶），以及可供学生（嬉戏）的花园，却没有提及（漏水）的屋顶和（布满蛛网）的楼梯。每条（通道）都有（穿堂风），每扇窗都带着一点（倾斜）。一幅（瘦削）的王后画像下，学院的（巴塞特猎犬）睡在一位（敦实）的园丁身旁，园丁下巴上满是（短硬胡茬）。学院的（吉祥物）——一条下颌缺损的木龙——守望着他们。外面，一匹（毛发蓬乱）的小马等着来客（下马）。比起那座（被泛光灯照亮）、供优秀学生学习占据（聚光灯焦点）的大礼堂，内拉更喜欢这个不完美的角落。"}, {"en": "She loved the workshops. A bent hinge could be repaired without questions about one's grandfather. Her father had taught her to (hew) pegs, (affix) plates, and (readjust) catches. She could (heft) a (mallet), replace a (rivet), loosen a (thumbscrew), and set a brass (inlay). She once made a (splint) for an injured bird and sealed a kettle's (spout). Such skills were (invariably) called ordinary. The academy promised to (electrify) ambition, (gratify) curiosity, and (exemplify) excellence. It rarely taught anyone to (rectify) a fault. Nella found that omission (exceedingly) odd. A school capable of making statues sing ought to mend a (squeaky) door.", "zh": "她喜欢工坊。修理弯曲的铰链，不必先回答祖父是谁。父亲教过她（削制）木销、（固定）金属片、（重新调整）门扣。她能（举起）（木槌），更换（铆钉），松开（翼形螺钉），装好黄铜（镶嵌饰件）。她曾给受伤的小鸟做过（夹板），也修补过水壶的（壶嘴）。这些本领（总是）被称为平凡。学院承诺（激发）志向、（满足）好奇心，并（体现）卓越，却很少教人如何（纠正）故障。内拉觉得这种遗漏（极其）奇怪。一所能让雕像唱歌的学校，理应会修一扇（吱吱作响）的门。"}, {"en": "Mistress Vale, the caretaker, was trying to (repot) a (spiky) plant. Its (knobbly) roots stuck to a (gluey) pot. She had a (swarthy) face, a (scratchy) voice, and a (temperament) that improved when people helped. Nella held the stem (delicately). “Failed?” Vale asked (gruffly). Nella nodded (mutely). “Their test, perhaps.” A (tabby) gave a (mew) from the (leafy) courtyard. Vale stroked its (mangy) ear (affectionately), then dispatched Nella for a regulator in the lower storeroom. “A (jiffy), and you'll be back. Third shelf. Don't (mislay) the key.”", "zh": "管理员维尔女士正在给一株（带刺的）植物（换盆）。它（疙疙瘩瘩）的根黏在（黏糊糊）的花盆上。她肤色（黝黑），声音（沙哑），有人帮忙时，（脾气）便会好起来。内拉（小心轻柔地）扶住植物茎干。“没通过？”维尔（粗声粗气地）问。内拉（默默地）点头。“或许只是没通过他们的测试。”一只（虎斑猫）在（枝叶繁茂）的庭院里（喵叫）了一声。维尔（亲昵地）抚摸它（患着疥癣）的耳朵，随后让内拉去下层储藏室取调节器。“（一会儿）就能回来。第三层架子。别（乱放弄丢）钥匙。”"}, {"en": "An old lamp hung (askew) beside the storeroom (doorpost). Its flame seemed to (flit) without wind. Nella pushed through the (doorway) and saw a (translucent) boy on a crate. His outline was (opalescent), his face (sallow), his eyes unexpectedly merry. “You're not supposed to see me,” he said in a (reedy) (lilt). She stared (fixedly). “A (poltergeist)?” “When annoyed.” A wooden (pellet) flew past her in a (ricochet). “Tools aren't toys,” she said (stiffly). He smiled. “Neither are people. We shall get along.”", "zh": "储藏室的（门柱）旁，一盏旧灯（歪斜地）挂着。没有风，火苗却仿佛在（轻快跳动）。内拉走过（门口），看见一个（半透明）的男孩坐在木箱上。他的轮廓泛着（乳白虹彩），脸色（蜡黄），眼睛却意外地快活。“你本不该看见我。”他用（尖细）而带着（轻快抑扬）的声音说。她（目不转睛地）盯着他。“你是（吵闹鬼）？”“烦起来的时候是。”一颗木（弹丸）（弹跳反射），从她身旁飞过。“工具不是玩具。”她（生硬地）说。他笑了。“人也不是。我们会合得来。”"}, {"en": "He was Ivo, an apprentice who had died a century earlier. The school had called the accident a magical (disfigurement). Its spell had managed to (disembody) him without releasing him. Rather than let him leave, the masters had bound him to the weather machinery. His (plight) was not caused by some mysterious (malady); it was the result of choices. He could (avert) storms and (divert) lightning; an iron (amulet) kept him bound. Each renewal let another inscription (encrust) its surface. His reward was one hour nightly outside the engine. “They call it service,” he said (blandly). He refused to (lament) his fate aloud, but his silence was hardly peace. Nella felt a (disquiet) that no examination had ever produced.", "zh": "他叫伊沃，是一百年前死去的学徒。学校把那场事故称为魔法造成的（形态毁损）。那道咒语使他的灵魂（脱离肉体），却没有让他获得解脱。老师们没有放他离开，而是把他束缚在控制天气的机器上。他的（困境）并非源于什么神秘（疾病），而是人们做出选择的结果。他可以（阻止）风暴、（引开）闪电；一枚铁（护符）则将他禁锢。每次续订束缚，新的铭文就会（覆盖）护符表面。他得到的报酬，是每晚可以离开机器一个小时。“他们称之为服务。”他（平淡地）说。他不肯高声（哀叹）自己的命运，但沉默也绝不等于平静。内拉心中升起一种任何考试都未曾带来的（不安）。"}, {"en": "He showed her a (locket) containing a child's (plait), the only (remnant) of his sister. Her memory could still (haunt) him; her face had become blurred. Once he had heard her (lullaby) above the machinery. Now there was only its (discordant) hum. “They promised I'd be free when repairs were finished.” Nella asked when that would happen. He answered (evasively), then admitted nobody had begun. A century of (torment) had become an administrative (afterthought). She listened (apprehensively), unable to understand such patience, and more frightened by his acceptance than by his ghostliness.", "zh": "他给她看一枚（小盒式吊坠），里面装着一条孩子的（发辫），那是妹妹留下的唯一（遗物）。关于她的记忆仍会（萦绕）着他，她的面容却已经模糊。曾经，他还能在机器声中听见她的（摇篮曲）；现在只剩机器（刺耳不和谐）的嗡鸣。“他们答应过，修理完成后我就自由了。”内拉问什么时候能够完成。他（含糊闪烁地）回答，最后承认根本没人开始修。一百年的（折磨），竟成了行政事务里一个（事后才想起的问题）。她（忐忑地）听着，无法理解这样的忍耐；比起他的幽灵模样，他的逆来顺受更令她害怕。"}, {"en": "Upstairs, Vale examined the regulator (gravely). A tiny (slit) crossed its ring. The wards were growing (patchy), she said; every new spell placed more strain on the foundations. Nella tried to sound (unconcernedly) curious about ghosts. Vale's (beady) gaze sharpened. “You've met him.” She spoke (baldly): she had argued for repairs, received an (indulgent) hearing, and been told to await funding. Her (vehement) letters remained unanswered. “They can purchase another (extravagant) chandelier, but drains don't attract admiration.” She put down the part (resignedly). “Don't let that boy become another thing you grow used to.”", "zh": "楼上，维尔（严肃地）检查调节器。一条细小的（裂缝）横穿圆环。她说，防护结界正变得（时灵时不灵），每增加一道新咒语，地基承受的压力就更大。内拉问起幽灵，试图表现得（漫不经心）。维尔那双（小而明亮的）眼睛立刻锐利起来。“你见到他了。”她（直截了当地）解释：自己曾要求修理，得到一次（宽容却不当回事的）接见，然后被告知等待拨款。她那些措辞（激烈的）信至今无人答复。“他们能再买一盏（奢华）的吊灯，可排水沟招不来赞美。”她（无奈地）放下零件。“别让那个男孩也变成你习以为常的一件事。”"}, {"en": "The next evening Nella brought Ivo cake. He could not eat, but its scent could (waft) into the room. She apologised (lamely); he asked about rivers instead. Did fish still jump? Could children still (trot) along the bank? His curiosity was a (fount) that imprisonment had failed to dry. She returned with Tavi, who greeted him (tentatively), then (timidly) offered a school song. Ivo preferred silence. Tavi accepted this (composedly). Friendship, Nella thought, should not (foist) enjoyment on somebody else. They sat (contentedly) while Ivo described the original machinery.", "zh": "第二天晚上，内拉给伊沃带了蛋糕。他不能吃，但香味可以（飘进）房间。她（笨拙而无力地）道歉，他却转而问起河流：鱼还会跃出水面吗？孩子们还会沿河岸（小跑）吗？他的好奇心像一眼没有被囚禁耗干的（泉源）。她带着塔维再次回来。塔维先（试探着）打招呼，又（怯生生地）提出给他唱校歌。伊沃更喜欢安静。塔维（从容地）接受了。内拉想，友谊不该把快乐（强加）给别人。他们（心满意足地）坐着，听伊沃讲述机器最初的设计。"}, {"en": "Stone channels once guided weather around the fortress. Later builders, in their (complacent) ignorance, had buried them beneath floors. Roots and (silt) completed the blockage. Binding Ivo had been a (makeshift) answer to the (resultant) danger. Tavi listened with (rapt) attention, occasionally pausing to (jot) measurements. Nella felt her earlier (bewilderment) become purpose. She could not (outwit) a thunderstorm, but she understood blocked pipes. “Let us look,” she said. Ivo's expression held (wonderment), followed by (mistrust). Hope, after such treatment, was not a gift one accepted (idly).", "zh": "石渠曾经引导天气绕过堡垒。后来的建造者无知而（自满），把它们埋进地板下面。树根和（淤泥）堵住了剩余空间。束缚伊沃，不过是应对（由此产生的）危险的一种（临时凑合的）办法。塔维（全神贯注地）听着，偶尔停下来（简记）尺寸。内拉感到先前的（迷惑）逐渐变成了目标。她无法凭聪明（战胜）雷暴，却懂得堵塞的管道。“让我们去看看。”她说。伊沃脸上先是（惊奇），接着浮现（不信任）。受过那样的对待之后，希望绝不是能够（随随便便地）收下的礼物。"}, {"en": "Their first (foray) led beneath the (battlement), where roots began to (jut) from stone. A (newt) watched from a puddle; nearby, a magical lizard displayed its (scaly) tail and prepared to (molt). Tavi had to (shunt) a crate aside. Nella used a (pickax) to loosen rubble while he gathered it into an old bucket. A (wriggly) worm escaped across his boot. The work made them (soggy), cold, and hungry. Nevertheless, by midnight they had made real (headway). Ivo stepped beyond the storeroom. A faint (glint) appeared in his wristband.", "zh": "他们第一次（探索）来到（城垛）下方，树根开始从石头间（凸出）。一只（蝾螈）在水坑里望着他们；附近，一条魔法蜥蜴露出（覆着鳞片）的尾巴，准备（蜕皮）。塔维先把木箱（推到一旁）。内拉用（鹤嘴锄）松开碎石，他则将碎石装进旧水桶。一条（扭来扭去的）虫子从他的靴子上逃走。工作让他们（湿透）、寒冷又饥饿。然而到了午夜，他们确实取得了（进展）。伊沃迈出了储藏室。他的腕环上出现一丝微弱的（闪光）。"}, {"en": "They continued (doggedly). Nella learned to (burrow) beneath roots, (uproot) weeds, and (unbolt) inspection covers. Tavi drew (squiggly) arrows on (newsprint), occasionally sending them (astray) with a sneeze. Their map was (shoddy), their measurements sound. They found a (moldy) boot and a (mouldy) ledger, preserved equally badly. A bent (signpost) pointed towards a vanished garden. Under a (yew), the outlet lay behind masonry. “We need permission,” Tavi said (dispiritedly). “We need evidence,” Nella replied. She would not let another reassuring refusal (dispirit) her.", "zh": "他们（坚持不懈地）继续干。内拉学会了在树根下（挖掘通道）、（连根拔除）杂草，并（拧开螺栓）拆下检修盖。塔维在（新闻纸）上画（弯弯曲曲的）箭头，偶尔一个喷嚏就让笔迹偏向（错误方向）。地图很（粗糙），测量却可靠。他们找到一只（发霉的）靴子和一本同样（长霉的）账簿，两样东西保存得一样糟。一块弯曲的（路标）指向早已消失的花园。一棵（紫杉）下，出口藏在砌石后面。“我们需要许可。”塔维（泄气地）说。“我们需要证据。”内拉回答。她不会再让一次听起来令人安心的拒绝使自己（丧失勇气）。"}, {"en": "Evidence required the archive. During a (muggy) lunch hour, they slipped past a (paunchy) clerk whose (tweedy) jacket smelled of (detergent). He looked (grouchy), (tetchy), and (sorely) in need of sleep. Tavi asked (interrogatively) about royal plumbing. The clerk answered (snidely), calling the question (impertinent), but brought the records. A (consignment) of drawings revealed the sealed outlet. Nella read (avidly), her finger tracing dates. An annotation described Ivo as an (inbuilt) safeguard. Another recommended postponing work indefinitely. That was the (gist): convenience disguised as necessity.", "zh": "找证据就得去档案室。在一个（闷热潮湿）的午休时分，他们从一位（大腹便便）的文书身边溜过。他的（粗花呢）外套散发着（洗涤剂）的气味。他看上去（爱发牢骚）、（容易急躁），而且（非常）需要睡眠。塔维用（询问的口吻）打听王室排水设施。文书（讥讽地）回答，称这个问题（无礼），却还是拿来了记录。一（批运来的）图纸显示出了被封死的出口。内拉（如饥似渴地）阅读，用手指循着日期。一条注释将伊沃称为（内置的）安全保障，另一条建议无限期推迟施工。这就是（要点）：把图省事伪装成不得不如此。"}, {"en": "They had almost escaped when Prentiss appeared, his (ruddy) face framed by a (lacy) collar. “What are you hiding?” he asked with a (sniffy) air. Tavi made a (feint) towards the stairs. Prentiss blocked him. Nella answered (squarely): they were investigating a repair. He regarded them (perplexedly). “The caretaker's business?” “Everyone's.” He gave a (huffy) (retort) about rules, then left. Tavi called him a (popinjay), a (braggart), and a (git). Nella laughed (inwardly), but refused to (dignify) the quarrel by adding anything. They had larger problems.", "zh": "他们差一点就顺利离开，普伦蒂斯却出现了，（红润）的脸衬在（蕾丝）领口上。“你们藏着什么？”他（傲慢嫌弃地）问。塔维朝楼梯做了个（假动作），被他挡住。内拉（坦率直接地）回答，他们在调查一项修理工程。他（困惑地）看着他们。“管理员的工作？”“所有人的事。”他（气呼呼地）拿规矩（反驳）了一番，然后走了。塔维称他为（自负的花花公子）、（吹牛者）和（讨厌鬼）。内拉（暗自）发笑，却不肯再补上什么，免得让这场争吵显得（值得认真对待）。他们还有更大的麻烦。"}, {"en": "That afternoon's sports (tryout) supplied one. Prentiss wanted the (captaincy), and every (contestant) had to send a ball through a moving (goalpost). He performed (superbly), accepting praise (sedately). Then a (rowdy) (entrant) hit a (volley) that broke a window. Nella nearly pitched (headfirst) off her bench as she ducked (nimbly). Tavi cried out. Prentiss's shield caught the pieces. For a moment, nobody could (taunt) anybody. Nella thanked him. He looked almost embarrassed. It was easier to (detest) a rival when he never did anything (admirably).", "zh": "当天下午的体育（选拔赛）就带来了一个。普伦蒂斯想争取（队长职位），每位（参赛者）都要把球送进移动的（球门柱）之间。他表现得（极为出色），（沉着地）接受称赞。随后，一名（吵闹的）（报名选手）打出一记（凌空击球），砸碎了窗户。内拉（敏捷地）躲闪，差点（头朝下）栽下长凳。塔维惊叫起来，普伦蒂斯的护盾接住了碎片。那一刻，谁也没法再（嘲弄）谁。内拉向他道谢。他看起来竟有些不好意思。一个对手若从不做出（值得赞赏的）事，就更容易让人（憎恶）他。"}, {"en": "In the dormitory, a (stocky) boy practised an (uppercut) against a stuffed dummy, while his (lanky) roommate made it (contort). Someone tried to (disjoint) its wooden arm and accidentally caused a (spurt) of feathers. The (racket) attracted a teacher. Nella lay beneath a (bulky) blanket, pretending to sleep. She could hear students (bandy) rumours about a ghost. A (foolhardy) child proposed a midnight (jaunt), hoping to (accost) it. She felt (edgy). One careless (outburst) could (taint) their discovery before they understood how to help. Teachers might launch a (manhunt) on the (pretext) of protecting pupils; nobody would ask what Ivo needed.", "zh": "宿舍里，一个（结实敦壮）的男孩对着填充假人练习（上勾拳），他那（高瘦）的室友则让假人（扭曲）。有人试图把它的木胳膊（拆开关节），意外弄得羽毛（喷涌）而出。巨大的（吵闹声）引来了老师。内拉躺在（厚重）的毯子下面假装睡觉，听见学生们（传播议论）幽灵的传闻。一个（鲁莽）的孩子提议午夜出去（短途游逛），希望能主动（拦住搭话）那只幽灵。她觉得（焦躁不安）。在他们弄清如何帮助伊沃之前，一次不慎的（大声爆发）就可能（损害）这项发现。老师们也许会以保护学生为（借口），发动一场（搜捕）；却不会有人问伊沃需要什么。"}, {"en": "They made that mistake themselves. Tavi was (giddy) and (exuberant); Nella had briefly mistaken progress for safety. Elated by progress, Tavi tried to (hoist) a slab. It rose, began to (sway), and threatened to (plummet). Nella shouted; the slab fell with a (jolt) that could (petrify) the bravest sleeper. Prentiss appeared in a (paisley) robe over his (nightshirt), carrying a lamp. Its light revealed Ivo. Usually a (corpulent) boy of confident speech, Prentiss now seemed afflicted with (lockjaw). He stood (dazedly), his mouth open. “Don't stare,” Tavi said, too late. Nella could see the discovery (flabbergast) their visitor. “You'd better tell us,” Prentiss managed (hoarsely). “All of it.”", "zh": "结果，犯错的是他们自己。塔维（兴奋得晕乎乎）、（热情洋溢），内拉也曾短暂地把进展误当成安全。塔维兴冲冲地试图（吊起）一块石板。它升起来，开始（摇晃），眼看就要（骤然坠落）。内拉大喊，石板落下时产生的（震动）足以让最勇敢的熟睡者（吓得僵住）。普伦蒂斯提着灯出现了，（睡衣）外罩着（佩斯利涡纹）长袍。灯光照出了伊沃。这个通常谈吐自信的（肥胖）男孩，此刻仿佛得了（牙关紧闭症）。他张着嘴，（茫然地）站在那里。“别盯着看。”塔维说，可惜太晚了。内拉看得出，这个发现足以让来客（目瞪口呆）。“你们最好告诉我，”普伦蒂斯（沙哑地）挤出话来，“全部。”"}, {"en": "She explained. His expression passed from (astonishment) to (dismay), then to stubborn doubt. “It's (lunacy) to interfere.” Tavi called him a (spoilsport); he called Tavi a (delinquent). Ivo shifted a bucket towards Prentiss's feet. Nella stopped him (brusquely). “We won't (thwart) cruelty by practising it.” This seemed to (disconcert) Prentiss more than the ghost. “Tell Orr,” she said. “But don't (distort) what you saw.” He left without another word, looking (downcast). Tavi stared after him (disconsolately). “We could have tried to (mollify) him.” “With what? A prettier prison?”", "zh": "她解释了事情经过。他的表情从（震惊）变成（惊惧），最后又转为固执的怀疑。“插手这事简直是（疯狂）。”塔维叫他（扫兴鬼），他则称塔维为（违规少年）。伊沃悄悄把水桶移向普伦蒂斯脚边。内拉（ brusque地，毫不客气地）制止了他。“我们不能靠自己施加残忍来（阻止）残忍。”这似乎比幽灵更让普伦蒂斯（不知所措）。“去告诉奥尔吧，”她说，“但别（歪曲）你看见的事。”他没有再说什么，（垂头丧气地）离开了。塔维（伤心失落地）望着他的背影。“我们本可以试着（安抚）他。”“拿什么？一座更漂亮的监狱？”"}, {"en": "Orr summoned them at dawn. His office was (sunlit), its silver (casket) beside a ceremonial (hatchet), (doublet), and (kilt). A sword's (hilt) gleamed beneath a royal crown. “Unauthorised entry. Property damage. (concealment).” His voice was (croaky) from sleep. Nella answered with a (defiant) stare that the damage was old. Tavi tried to speak, but Orr raised a hand. He called their conduct (flagrant), their plan (arrant) nonsense. “It might kill someone.” Would Orr ever (relent)? Nella did not wait to find out. “It already has,” she said. Silence spread through the room.", "zh": "黎明时，奥尔召见了他们。办公室（洒满阳光），一只银（匣子）旁摆着仪式用的（短柄斧）、（紧身上衣）和（苏格兰短裙）。王冠下方，一柄剑的（剑柄）闪着光。“擅自进入。损坏学院财物。（隐瞒）。”他刚睡醒，嗓音（低哑）。内拉带着（不服从的）目光回答，损坏早就存在。塔维想开口，奥尔却抬手制止。他称他们的行为（公然违规），计划是（彻头彻尾的）胡闹。“这可能害死人。”奥尔究竟会不会（让步）？内拉没有等着寻找答案。“它已经害死过人了。”她说。房间陷入沉默。"}, {"en": "Orr was (adamant): removing Ivo could (disrupt) the wards. Nella asked about the channels. His reply was a (nondescript) phrase about historical complications. She challenged him (heatedly). He accused her of trying to (discredit) the school. “I'm trying to repair it.” His (bloodshot) eyes betrayed exhaustion. “You cannot (wrest) a spirit from a binding by opening a drain.” “Then inspect it.” Her demand appeared to (discomfit) him. He turned instead to punishment. Their restriction to the dormitory would begin immediately. Prentiss waited outside, less pleased than a successful (informant) ought to look.", "zh": "奥尔（坚决不改口）：释放伊沃可能（破坏）防护结界。内拉问起石渠，他用一句关于历史复杂性的（含糊平常的）话搪塞。她（激动地）质问，他指责她试图（败坏）学院声誉。“我是在修理它。”他（布满血丝的）眼睛泄露出疲惫。“你不能靠打开一条排水沟，就把灵魂从束缚里（强行夺回）。”“那就去检查。”她的要求似乎让他（窘迫）。他转而宣布处罚：他们立刻被限制在宿舍。普伦蒂斯等在外面，看起来并不像一个成功（告密者）那样满意。"}, {"en": "Nella wanted to (recount) the argument to everyone within (earshot). Instead she sat (rigidly), holding back tears. Tavi paced (dejectedly), then declared the master a (tinpot) tyrant. “Calling him names won't (oust) him,” she said. She had chosen Prentiss as the convenient (culprit), but could not honestly (acquit) herself of carelessness. Her anger was real; its aim was (haphazardly) chosen. She could (wallow) in anger or plan what to do next. The (upshot) was the same: Ivo still needed help. Through the window, a (convalescent) girl fed a (ferret). Its (snout) nudged her hand. Ordinary kindness continued beneath an extraordinary wrong. That contrast was difficult to bear.", "zh": "内拉想向每一个在（听得见的范围内）的人（讲述）这场争论。可她只是（僵直地）坐着，强忍眼泪。塔维（沮丧地）踱步，随后宣布奥尔是个（微不足道却摆架子的）暴君。“骂他并不能把他（赶下台）。”她说。她把普伦蒂斯当成了方便责怪的（罪魁祸首），却也不能诚实地（宣布自己无罪），假装自己没有疏忽。愤怒是真的，目标却选得（随意草率）。她可以继续（沉溺）于怒气，也可以计划下一步。无论如何，（最终结果）仍然一样：伊沃需要帮助。窗外，一个（康复期的）女孩在喂（雪貂），它用（口鼻部）轻碰她的手。在极不寻常的不公之下，普通的善意仍在继续。这种反差令人难以承受。"}, {"en": "A (cranky) tutor interrupted their thinking to warn that they must not (disobey). Tavi replied with a perfectly (obedient) nod, which meant precisely (naught). A (foggy) evening settled over the grounds. The gardener went to (mow) a (scrubby) strip beside a (thicket), while a delivery cart crossed the (slushy) yard. In the distance, a mechanical (plow) carved a (furrow). Nella watched a rook (alight) on a (lamppost), then depart with a harsh (caw). A (hornet) tapped the glass. The air felt (fishy)—not in smell, but in its unnatural stillness. A (dusky) cloud gathered above the hills. Tavi called it a (portent). Nella checked the map again, trying not to (fret).", "zh": "一位（脾气古怪）的导师打断他们的思绪，警告他们不得（违抗）。塔维完全（顺从地）点了点头，而那点头的实际含义恰好是（什么也没有）。一个（雾蒙蒙的）傍晚笼罩校园。园丁去（修剪）一片（矮灌木丛生的）地带，旁边是（灌木丛）；送货车驶过（满是雪泥的）院子。远处，一台机械（犁）划出一道（犁沟）。内拉看着一只秃鼻乌鸦（落在）（路灯柱）上，又发出刺耳的（鸦叫）飞走。一只（大黄蜂）轻撞窗玻璃。空气令人觉得（可疑不对劲）——不是气味，而是那种不自然的寂静。山丘上方聚起一团（昏暗的）云。塔维称它为（凶兆）。内拉又检查了一遍地图，尽量不去（焦虑）。"}, {"en": "Dinner arrived on a tray: a (pheasant) pie, a (doughy) (tart), and a (squashy) piece of (gateau). Tavi poked the (stringy) filling with a (stubby) fork. Usually his appetite was (fervent); tonight he could only complain (plaintively). “They could at least send (sherbert).” Nella offered a (marshmallow) saved in a (matchbox). He gave a small (guffaw). From the corridor came a (screechy) rehearsal, a (ventriloquist) arguing with his puppet. Someone ordered them to (desist). Even confinement, Nella discovered, could become noisy enough to (gnaw) at thought.", "zh": "晚餐装在托盘上送来：一份（野鸡）馅饼，一个（面团感很重的）（小甜挞），还有一块（软塌塌的）（奶油蛋糕）。塔维用（短粗的）叉子拨弄（纤维粗韧的）馅料。他平时对食物的热情十分（强烈），今晚却只能（哀怨地）抱怨。“他们至少可以送点（果味冰品）。”内拉拿出藏在（火柴盒）里的一颗（棉花糖）。他短促地（大笑）了一声。走廊里传来（尖厉刺耳的）排练声，一个（腹语表演者）正和自己的木偶争吵。有人命令他们（停止）。内拉发现，即使被关在宿舍，噪音也足以（啃噬）人的思绪。"}, {"en": "Then the storm struck. First came (sleet), then wind sharp enough to (flay) the exposed trees. A (thunderbolt) split the sky; the windows began to (pelt) them with fragments of ice. Tavi stared (aghast). The wards glowed (incandescent), then a (turbulent) pulse ran beneath the floor. Nella could feel the damaged system straining. “Ivo.” Her voice was an (abrupt) whisper. A bell rang (piercingly), cutting through the school's evening (lethargy). The lamps began to (spew) green sparks, the curtains to (billow). Somewhere a (distraught) teacher gave a (bellow). This was no (figment) born of an (overwrought) imagination. The storm had found the school's buried weakness.", "zh": "随后，风暴来了。先是（雨夹雪），接着是锐利得足以（剥去树皮）的狂风。一道（霹雳）劈开天空，窗口开始向他们（猛烈投来）碎冰。塔维（惊恐地）看着。防护结界亮得（白热耀眼），地板下随即传来一阵（狂暴的）脉动。内拉能感觉到受损的系统正在苦撑。“伊沃。”她（突然）低声说。钟声（刺耳地）响起，划破学院夜晚的（昏沉）。灯盏开始（喷出）绿色火花，窗帘开始（鼓荡翻卷）。某处，一个（惊慌失措的）老师发出（吼叫）。这不是（过度紧张的）想象力制造的（幻象）。风暴找到了学院埋藏起来的弱点。"}, {"en": "Tavi proposed escaping through the window. Nella pointed towards the (parapet), already splitting. “We'd fall.” It was no time to (tempt) fate with a dangerous (ascent). She knelt and removed the hinge pins instead. The locking spell remained untouched as the door tilted free. Tavi's confusion became delight. “That ought to (flummox) them.” Rules meant to restrain magic had overlooked carpentry. Nella slid the pins into her pocket. “Help me (stow) this.” They eased the door against the wall, then ran. She did not feel (triumphant). She felt (panicky), (groggy) with fear, and determined not to (wilt).", "zh": "塔维提议从窗户逃出去。内拉指向已经开裂的（女儿墙）。“我们会掉下去。”现在不是靠危险的（攀登）去（冒险试探）命运的时候。她跪下，转而拆除了铰链销。锁门咒语完好无损，门却倾斜着脱离了门框。塔维的困惑变成欣喜。“这肯定能把他们（弄糊涂）。”用于限制魔法的规则，忽略了木工。内拉把销钉放进口袋。“帮我把这个（收放好）。”他们把门轻轻靠在墙上，随后奔跑起来。她并没有（胜利得意）的感觉。她（惊慌），害怕得（头昏无力），却决心不（退缩垮掉）。"}, {"en": "A corridor portrait shouted that they were (miscreant) children. A second called them (insolent), a third demanded a (curtsey). Tavi replied with an undignified (grunt). “Don't (exert) yourself,” Nella told the paintings. An (unkempt) queen threatened to (jinx) them; a king marked by (pox) demanded obedience. They raced past, ignoring the royal (tumult). “Have you (aught) to say for yourselves?” a portrait shouted. Tavi declined. A suit of armour attempted a (gallant) salute and collapsed. Its empty sleeve continued to wave. Ordinarily this would entertain Tavi. Now he merely stepped over it, careful of the metal (underfoot).", "zh": "走廊上的一幅画像大喊，说他们是（行为不端的）孩子。第二幅骂他们（傲慢无礼），第三幅要求行（屈膝礼）。塔维很不体面地（咕哝）了一声。“别太（费力）。”内拉对画像们说。一位（衣冠不整的）王后威胁要（诅咒）他们；一个脸上留着（天花）痕迹的国王要求服从。他们奔跑而过，无视王室的（喧嚣）。“你们有（任何话）为自己辩解吗？”一幅画像喊道。塔维不予回答。一套盔甲试图（英勇潇洒地）敬礼，结果散架了，空袖子仍在挥动。平时这会让塔维觉得好笑，现在他只是跨过去，小心（脚下）的金属。"}, {"en": "At the stairwell, a (sulky) prefect tried to stop them. His (gaudy) sash and (swishy) robe seemed absurd in the green light. “You cannot (flout) instructions.” “Watch,” said Tavi, with a (matey) smile. Nella spoke more (tensely): he should evacuate the upper floor. His (brow) shone with sweat. The prefect seemed (uptight), but not stupid. He let them pass. Behind him, a (pudgy) younger boy clutched a (cuddly) rabbit, shaking (convulsively). Nella paused to (entrust) him to a senior. Being frightened did not excuse leaving somebody more frightened behind.", "zh": "楼梯口，一个（闷闷不乐的）级长试图拦住他们。他（俗艳）的绶带和（沙沙飘动的）长袍在绿光里显得荒唐。“你们不能（公然无视）指示。”“看着吧。”塔维带着（哥们儿似的）笑容说。内拉则（紧绷地）告诉他，应该疏散楼上的人。他的（额头）满是汗水。这位级长虽然（神经紧张），却并不愚蠢，最终放他们通过。他身后，一个（胖乎乎的）小男孩抱着一只（适合搂抱的）兔子，（抽搐般地）发抖。内拉停下来，把他（托付）给高年级学生。自己害怕，不是丢下更害怕的人的理由。"}, {"en": "The lower hall was (lamplit) and filling with water. A (searchlight) spell exposed Ivo beside the engine, his face drawn (grotesquely) thin. Vale stood at the wheel with a (welt) across her (knobby) knuckles. “Take that side.” Nella obeyed (instinctively). Tavi braced his shoulder, trapping his robe beneath his (armpit). Together they forced the wheel around. Light began to (spit) from a cracked valve. A burning drop struck Nella's sleeve; she smelled (soot). Ivo's outline flickered. The machinery was consuming him to preserve itself.", "zh": "下层大厅（亮着灯），水正不断涌入。一道（探照灯）咒语照出了机器旁的伊沃，他的脸消瘦得（怪异可怕）。维尔站在转轮旁，（骨节突出的）指关节上横着一道（肿起的伤痕）。“抓那边。”内拉（本能地）照做。塔维用肩膀顶住，把长袍压在（腋下）。他们合力让转轮转动起来。裂开的阀门开始（迸射）光点。一颗灼热的液滴落在内拉袖上，她闻到了（烟灰）味。伊沃的轮廓闪烁不定。机器正在吞噬他，以维持自身。"}, {"en": "Orr arrived with three teachers and Prentiss, who carried a copied map. Nella gave him an (unfriendly) look before he spread it on a crate. “I thought you were wrong,” he said. “Then I checked.” Orr ordered them upstairs. Vale refused with a decisive shake of her head. Nella pointed to the sealed outlet. “Let us open it.” His forehead creased. Her proposal seemed to (stupefy) him: no grand spell, merely stonework. But another tremor shook the chamber. At last he gave (assent). “Tell me what you need.”", "zh": "奥尔带着三位老师和普伦蒂斯赶到，后者拿着一份抄画的地图。内拉投去（不友善的）一瞥，他随后把地图铺在木箱上。“我以为你们错了，”他说，“后来我去查了。”奥尔命令他们上楼，维尔果断摇头拒绝。内拉指着封死的出口。“让我们打开它。”他皱起额头。她的提议似乎让他（惊得发愣）：不需要宏大的咒语，只需要处理石头。然而房间再次震动。他终于表示（同意）。“告诉我，你们需要什么。”"}, {"en": "They needed time, tools, and hands. Orr could reduce the load; Vale would hold the wheel with Tavi. Nella and Prentiss would enter the service tunnel. The arrangement pleased nobody's pride. It was practical. Prentiss's (fleshy) fingers trembled as he tied a (taut) rope around his waist. He seemed much younger without his swagger. “I'm not very (springy),” he admitted. “Neither is the tunnel,” Nella said. His smile was uncertain. She handed him a lamp. It took more courage to (defy) a mistake than to defend a reputation. For once, his family name could neither help nor hinder.", "zh": "他们需要时间、工具和人手。奥尔负责减轻负荷，维尔和塔维守住转轮，内拉与普伦蒂斯进入维修通道。这安排满足不了任何人的骄傲，却切实可行。普伦蒂斯把绳子（绷紧）系在腰间时，（肉乎乎的）手指在发抖。没有了趾高气扬，他看起来小了许多。“我不太（灵活有弹性）。”他承认。“通道也一样。”内拉说。他不确定地笑了笑。她递给他一盏灯。（反抗）一个错误，比捍卫名声更需要勇气。这一次，他的姓氏既帮不了忙，也碍不了事。"}, {"en": "They crawled past (straggly) roots into (earthy) darkness. A (spindly) support stood (crookedly) beneath the ceiling. Nella inspected it (furtively), unwilling to alarm Prentiss, then reconsidered and told him the risk. Trust required more than cheerful silence. They moved with care beneath it. Something brushed his cheek: a (wiggly) root enchanted to find water. He shuddered (audibly). “That's (spooky),” he said. “Useful,” she replied, following its direction. Beyond a corner they found the outlet, where old mortar bulged like a (protuberant) scar.", "zh": "他们爬过（杂乱延伸的）树根，钻进带着（泥土气息的）黑暗。一根（细弱的）支柱（歪歪斜斜地）撑在头顶。内拉（偷偷地）检查它，不想吓到普伦蒂斯，随后改了主意，把风险告诉了他。信任所需要的，不只是乐观的沉默。他们小心地从下面经过。有什么擦过他的脸颊：一条被施了寻水魔法、正在（扭动的）根。他一阵哆嗦，（清楚可闻地）吸了口气。“真（阴森吓人）。”他说。“很有用。”她回答，顺着根的方向前进。拐过弯，他们找到了出口，旧砂浆鼓起，像一道（凸出的）伤疤。"}, {"en": "Prentiss raised the lamp. The blockage could (splay) their tools apart if they pried at the wrong angle. Nella scraped away mortar, testing each stone. He watched with concentration, then helped. His first attempt was awkward, but his strength mattered. Prentiss (leant) against the wall, brushed (grit) from his sleeve, and began again. Water rose; cold made her hands ache. A (dicky) valve above them began to knock. “One more.” Her voice faltered; she coughed. Prentiss tightened his grip. Neither felt (exultant) when the first stone moved. They knew it was only the beginning, and a mistake could still send everything wrong.", "zh": "普伦蒂斯举起灯。如果撬动角度不对，堵塞物就可能让工具向两边（张开滑脱）。内拉刮掉砂浆，试探每块石头。他专心看着，然后动手帮忙。第一次尝试很笨拙，但他的力气很重要。普伦蒂斯（靠着）墙，掸掉袖上的（砂砾），又试了一次。水位上涨，寒冷让她双手疼痛。头顶一个（有毛病的）阀门开始敲响。“再来一下。”她声音发颤，咳嗽起来。普伦蒂斯握得更紧。第一块石头移动时，两个人都没有（狂喜）。他们知道，这只是开始，一个错误仍可能让一切变糟。"}, {"en": "Upstairs, teachers tried to (chant) in unison while Orr fought to prevent a magical rebound. One began (compulsively) repeating the same line. Vale stopped him; panic was not a (stimulant) for good judgement. Tavi held the wheel, his (blotchy) face wet with tears. He wanted to (vomit), but swallowed and stayed. Ivo asked them not to let the storm (overshadow) the reason for their work. “If the house survives, don't leave me here.” Vale answered with resolve. She would keep this (vow), even if it cost her position. “We won't.” It was a promise without conditions.", "zh": "楼上，老师们试图齐声（吟唱），奥尔则努力阻止魔法反冲。其中一人开始（不由自主地）重复同一句。维尔阻止了他；恐慌并不是促进良好判断的（刺激物）。塔维握着转轮，（布满红斑的）脸上全是泪。他想（呕吐），却咽了回去，留在原处。伊沃请求他们，别让风暴（掩盖）他们行动的原因。“如果房子保住了，别把我留在这里。”维尔坚定地回答。她会守住这个（誓言），哪怕失去职位。“我们不会。”这是一个没有附加条件的承诺。"}, {"en": "In the tunnel, Nella noticed a metal brace. Its catch had been set backwards. The fault was an almost comic (giveaway): somebody had repaired what they did not understand. She adjusted it (straightaway). “Move.” Prentiss obeyed, and the stone plug broke free. Water rushed past them with a (splashy) roar. A ribbon of blue light followed. They pressed into a recess while the river took the rubble. Above, the tower changed from violent white to a steady glow. For a second the garden seemed (unaccountably) silent. Then ordinary rain returned. Nella released a breath she had held far too long.", "zh": "通道里，内拉注意到一根金属支撑。它的卡扣装反了。这个几乎有些可笑的（明显破绽）说明：有人修理了自己并不理解的东西。她（立刻）调整好。“退开。”普伦蒂斯照做，石堵随即松脱。水带着（四处飞溅的）轰鸣从他们身旁冲过，一条蓝光紧随其后。他们挤进凹处，任河水带走碎石。上方，塔楼从剧烈的白光变成稳定的光芒。有那么一秒，花园（莫名其妙地）安静下来，随后普通的雨声重新出现。内拉终于吐出了憋得太久的一口气。"}, {"en": "They returned through a (dingy) service (alleyway), where a fallen branch tried to (waylay) them. Prentiss stumbled; she steadied him. Rain had left a (manky) streak across his expensive robe and a tear beginning to (fray). Neither cared. In the engine room, Ivo stood without the band. For once, Orr did not speak. His expression combined shame and (puzzlement), as though he had encountered a question his books could not answer. Ivo looked at his wrist. “I'd like to see the river.” Vale opened the garden door.", "zh": "他们沿一条（昏暗肮脏的）维修（小巷）返回，一根倒下的树枝仿佛想（拦路袭击）他们。普伦蒂斯绊了一下，她扶住了他。雨在昂贵的长袍上留下（污秽难看的）痕迹，一道裂口开始（磨损散线）。两人都不在意。机器房里，伊沃站在那里，腕上已经没有铁环。奥尔难得没有说话。他脸上混合着羞愧和（困惑），仿佛遇到了书本无法回答的问题。伊沃看着自己的手腕。“我想去看看河。”维尔打开了花园的门。"}, {"en": "The rain softened. A (spilt) jar of garden seeds lay beside the path; beyond it, (sneezewort) bowed against a wall. Ivo paused beside an (outskirt) of woodland, listening to an owl (hoot). The night's (enchantment) required no captive spirit. The night was (reminiscent) of something he could not quite remember. Then a fish jumped. He laughed (unrestrainedly). A cat answered the owl with a sleepy (meow). Nella had expected a speech, perhaps a shining staircase into eternity. Instead a boy enjoyed a fish. The moment could (transfix) her more completely than any examination spell. She felt the first quiet (contentment) of the term.", "zh": "雨渐渐柔和。一罐（洒落的）花种躺在路旁，再往前，（喷嚏草）贴墙低垂。伊沃停在树林的一处（边缘），听猫头鹰（鸣叫）。这夜晚的（迷人魔力），不需要任何被囚禁的灵魂。它让他（想起）一件已经记不清的事。随后，一条鱼跃出水面。他（毫无拘束地）笑了。一只猫用困倦的（喵叫）回应猫头鹰。内拉原以为会有一段告别词，或许还有一座通往永恒的发光阶梯。结果，只是一个男孩因为一条鱼而开心。这一刻比任何考试咒语都更能让她（看得出神）。她感到了本学期第一次安静的（满足）。"}, {"en": "Freedom did not make Ivo leave immediately. He wished to discover what he wanted. The school offered him furniture; he asked for a window and permission to depart. Orr agreed. “I will not (revert) to your old arrangement,” he promised. Ivo said trust would take longer than a sentence. This was no (jest), and Orr accepted it. He could not (repaint) the past or (assort) its failures into harmless categories. There would be an inquiry. Vale insisted that its findings be shared, not locked in another drawer.", "zh": "自由没有让伊沃立即离开。他想先弄清自己究竟想要什么。学校提出给他家具，他却只要一扇窗，以及随时离开的许可。奥尔答应了。“我不会（恢复）从前对你的安排。”他保证。伊沃说，重建信任所需的时间，比说完一句话长得多。这不是（玩笑），奥尔接受了。他无法（重新粉饰）过去，也无法把过失（分类整理）成无害的项目。学校将展开调查。维尔坚持调查结果必须公开，不能再被锁进另一个抽屉。"}, {"en": "The inquiry made certain governors (indignant). An irritable man declared that public criticism would (mortify) benefactors. Vale asked whether embarrassment outweighed imprisonment. A (flabby) official tried to (blurt) a defence, then stopped. Another, usually a (mellow) (gent), called the binding (indecent). Nobody could honestly consider it a minor error. Their first report described it as regrettable; Ivo called that an (understatement). Nella, who had once dreaded attracting attention, gave evidence (convincingly). She was no longer willing to let comfortable language hide an uncomfortable fact.", "zh": "调查让某些校董（愤愤不平）。一个急躁的男人宣称，公开批评会让捐助者（蒙羞）。维尔问，丢面子难道比囚禁一个人更严重吗？一个（松胖的）官员试图（脱口说出）辩护，随后停住。另一位平时（温和）的（绅士），则称这种束缚（有失道德）。没有人能诚实地把它当作小错误。第一份报告将此事形容为令人遗憾；伊沃说，那是（轻描淡写）。曾经害怕引人注意的内拉，如今（令人信服地）作证。她不再愿意让舒服的措辞掩盖令人不舒服的事实。"}, {"en": "Repair teams arrived. One governor's (throwaway) remark called the work unnecessary. Vale called that (idiocy), and nobody argued. A (trustworthy) engineer with a (bushy) beard inspected every channel, while his (bubbly) apprentice labelled the pipes. They found a (dodgy) seal, a heavy counterweight, and nesting insects beginning to (infest) a cover. The engineer refused to complain about apprentices asking questions. Nella learned to channel water safely and identify tiny faults. Tavi accused her of enjoying drain maintenance. She admitted it with pleasure. The work gave her something the examination never had: a clear connection between understanding and usefulness.", "zh": "维修队来了。一位校董（随口而出的）评论说，这些工程没有必要。维尔称之为（愚蠢），没人反驳。一位长着（浓密）胡须、（值得信赖的）工程师检查每条水渠，他那（活泼开朗的）学徒则给管道贴标签。他们发现了（不可靠的）密封件、沉重的配重，以及开始在盖板里（滋生）的筑巢昆虫。工程师从不抱怨学徒提问。内拉学会了安全引水，也学会了辨认细小故障。塔维说她分明是在享受排水设施维护。她高兴地承认了。这份工作给了她考试从未给过的东西：理解与实际用处之间清晰的联系。"}, {"en": "Not everyone welcomed change. A (touchy) teacher called the new practical lessons a distraction; an older master dismissed Vale as a (crackpot). Prentiss, unexpectedly, challenged him. “She was right.” The master gave a (tut), but did not answer. One examiner criticised the reform (savagely), but his speech only revealed the (disarray) of his arguments. Some students preferred (flashy) tricks and complained that work would depress them. Others found it freeing. A boy labelled a (layabout) proved excellent at measuring stone; a child dismissed as a (vagrant) scholar designed a better drain. Ability had existed before anyone agreed to notice it.", "zh": "并非所有人都欢迎改变。一位（敏感易怒的）老师说新的实践课让人分心；一位老教师把维尔斥为（怪人）。出人意料的是，普伦蒂斯反驳了他。“她是对的。”老师（啧）了一声，却没有回答。一名考官（凶狠地）批评改革，他的演说却只暴露出论点的（混乱）。一些学生更喜欢（炫目的）把戏，抱怨干活会让他们消沉。另一些人却感到了自由。一个被贴上（懒汉）标签的男孩，原来很擅长测量石材；一个被轻视为（流浪）学童的孩子，设计出了更好的排水沟。在有人愿意注意之前，能力就已经存在。"}, {"en": "Nella's second examination began with the feather. It rose badly, then settled. She watched it (serenely). “Well, (admittedly),” she told Orr, “that needs practice.” This time he also asked about the wards. She explained the blockage, the brace, and why adding power concealed the fault. A small (wart) on Orr's thumb caught her eye; how strange that an ordinary detail should calm her. He listened with attention and finally nodded. She had passed. Her relief was neither loud nor ostentatious. Orr offered an apology, then waited. Nella accepted it without pretending that their (estrangement) had disappeared. A repaired relationship, like a repaired door, needed testing.", "zh": "内拉的第二次考试仍从羽毛开始。它升得很糟，随后落下。她（平静地）看着。“嗯，（不可否认），”她对奥尔说，“这还需要练习。”这一次，他也询问了防护结界。她解释堵塞、支撑件，以及为什么增加能量反而会掩盖故障。奥尔拇指上的一颗小（疣）吸引了她的注意；一个普通细节竟能让她镇定下来，真奇怪。他认真听着，最后点了点头。她通过了。她的释然既不喧闹，也不张扬。奥尔道歉，然后等待回应。内拉接受了，却没有假装他们之间的（隔阂）已经消失。修好的关系，就像修好的门，还需要检验。"}, {"en": "Prentiss apologised too. He no longer tried to (strut), though his first sentences retained an unfortunate (piggy) pride. Nella let him finish. Tavi offered a (hanky), ostensibly for rain, and invited him to fix the greenhouse. “Don't talk down to me,” Prentiss said, almost smiling. Their former hostility began to soften. Ivo joined them, observing a seedling through the glass. They did not need to (outgrow) every fault that afternoon. They needed to begin, and to let each other try again.", "zh": "普伦蒂斯也道了歉。他不再试图（趾高气扬地走动），尽管开头几句话仍残留着一种令人不快、近乎（猪一般贪婪自满的）骄傲。内拉让他说完。塔维递上（手帕），说是让他擦雨水，又邀请他一起修温室。“别用居高临下的口气跟我说话。”普伦蒂斯说，几乎露出了笑容。他们从前的敌意开始消退。伊沃也走了过来，隔着玻璃观察一株幼苗。他们不必在那个下午就（成长到摆脱）全部缺点。他们需要的是开始，以及允许彼此再试一次。"}, {"en": "By term's end, the grounds were (aglow). No longer a secret (hideout), the lower storeroom became a workshop. Nella helped rebuild its shelves; Tavi made a crooked label. Above the entrance they placed the broken band, not as a decoration, but as a warning against forgetting. A visitor called the display gloomy. Ivo disagreed. “It's a door I came through.” Nella thought that answer better than any motto. The school would not become fair by magic. People would have to make it so, (anew), every day.", "zh": "学期结束时，校园（沐浴在柔光里）。下层储藏室不再是秘密（藏身处），而成了一间工坊。内拉帮忙重做架子，塔维做了块歪斜的标签。他们把断裂的腕环挂在入口上方，不是作为装饰，而是提醒人们不要遗忘。一位访客说这展品阴沉。伊沃不同意。“那是我走过的一扇门。”内拉觉得，这个回答胜过任何校训。学校不会凭魔法变得公平。人们必须每天（重新）努力，让它变得公平。"}, {"en": "For the first time in weeks, Nella slept (soundly). Then she wrote home, describing the storm, the repairs, and the ghost who now sometimes watched the river until dawn. She had not become the finest magician in her year. She had become harder to dismiss. Her father replied with two questions: had she kept the hinge pins, and did the door close properly afterwards? She laughed until Tavi demanded an explanation. Then she drew the repaired hinge in the margin, added an account of its adjustment, and posted the letter. Some people recognised an achievement by its glow. Her father recognised one by whether it worked.", "zh": "几个星期以来，内拉第一次睡得（香甜安稳）。随后她写信回家，描述风暴、维修，以及如今有时会望着河流直到天亮的幽灵。她没有成为年级里最出色的魔法师，却变得更难被轻视。父亲回信问了两个问题：她有没有收好铰链销？事后那扇门还能正常关上吗？她笑了很久，直到塔维要求她解释。然后，她在信纸边缘画出修好的铰链，补上调整方法，把信寄了出去。有些人根据光芒判断一项成就。她的父亲则看它究竟能不能用。"}];
const HAS_TITLE = false;

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-hpphrases2001-2500-v1';
const LS_OLD_KEY = 'audiobook-hpphrases2001-2500-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
</body>
</html>
