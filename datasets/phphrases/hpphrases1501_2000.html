<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes for an Unrehearsed Wedding — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>Notes for an Unrehearsed Wedding</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "Notes for an Unrehearsed Wedding", "zh": "一场未经排练的婚礼"}, {"en": "Clara arrived at her mother's wedding carrying an (overcoat), a camera, and an objection rehearsed for three weeks. Beatrice met her in a (poncho), holding a (kumquat) and trying to (shoo) a goose. “You're early. Good. We need somebody who can stop a cake sliding (sideways).” Clara expected tears, explanations, perhaps a dignified (frown). Instead, her mother handed her the fruit. An argument required two participants. Doubt could (creep) into a room without taking up a chair, but Beatrice knew how to (sidestep) it by assigning it work. Clara's stomach began to (churn). Looking (forlorn) would not (overturn) a wedding.", "zh": "克拉拉带着(大衣)、相机，以及排练了三周的反对意见，来到母亲的婚礼。比阿特丽丝穿着(雨披)，拿着(金橘)，正试图(赶走)一只鹅。“来得早，好。我们需要有人阻止蛋糕(向旁边)滑。”克拉拉原以为会有眼泪、解释，或一个体面的(皱眉)。母亲却把水果塞给她。争论需要两个人，怀疑虽能不占椅子地(溜进)房间，母亲却懂得用分派工作来(避开)它。克拉拉胃里开始(翻腾)。再怎么显得(凄凉)，也无法(推翻)一场婚礼。"}, {"en": "The invitation tried to (forewarn) guests: comfortable shoes, no gifts, expect (ado). Clara interpreted this parental (lingo) as chaos. Her mother once seemed to (yearn) for quiet holidays; now she intended to (adorn) a house with flowers and (emblazon) its gate with two names. Clara began to (ponder) when this change had happened. She had (hitherto) assumed a familiar version of somebody was the final one.", "zh": "请柬早已(预先提醒)：穿舒适鞋，不送礼，准备面对(忙乱)。克拉拉把这种父母的(行话)理解为混乱。母亲从前似乎(渴望)安静假期，如今却要用花(装饰)整栋房子，把两个人的名字醒目地(题在)门上。克拉拉开始(思索)改变何时发生。她(此前)总以为，熟悉的某个版本就是一个人的最终版本。"}, {"en": "The house once belonged to a touring (puppeteer). Beatrice was now its (proprietor), although (caretaker) better described the arrangement. A (creeper) covered the wall, (knotgrass) occupied the path, and an (overgrown) rose supplied a (thorn) for every sleeve. The (doorknocker) resembled a (polecat), with a wedding (streamer) hanging from its mouth. A red (bedder) stood (atop) the wall beside (madder), grown for costume dye. Beatrice could (embroider) flowers but preferred living ones. Bad dye could (discolour) a dress; weeds merely needed pulling. Clara knocked. The (clatter) competed with a river (foghorn). Someone shouted that only a (moron) used the front door during preparations.", "zh": "房子原属巡演的(木偶师)。如今母亲是(业主)，叫(看护人)却更准确。(藤蔓)覆盖墙壁，(扁蓄草)占了小径，(长得过盛的)玫瑰给每个路过的袖子贡献一根(刺)。(门环)像只(臭鼬)，嘴上挂着婚礼(飘带)。红色(花坛植物)摆在墙(顶上)，旁边是给戏服染色用的(茜草)。母亲能(刺绣)花朵，却更喜欢真的。坏染料会让衣服(变色)，杂草只需拔掉。克拉拉敲门，(哐啷声)与河上的(雾笛)争鸣。里面有人喊，只有(傻瓜)才在准备期间走正门。"}, {"en": "It was Aunt June, a (knitter) of formidable (renown) and limited patience, wearing a (choker), a (boater), and permanent (frostiness). “Don't stand there and (gawp).” Clara entered the (parlor), where three (poufs), a broken (salver), and stacked plates narrowed the route. A toy (armadillo) occupied a chair; beneath it, a (pup) tried to (chomp) the leg. June called it a (scrounger), then fed it cheese.", "zh": "说话的是琼姨妈，一位(织毛衣的人)，有令人敬畏的(声名)和有限的耐心。她戴着(颈圈)、(平顶草帽)，脸上挂着常年的(冷淡)。“别站着(傻看)。”客厅——(起居室)——里，三只(软墩)、一只坏(托盘)和叠放的碟子挤窄了通道。椅子上是玩具(犰狳)，下面一只(小狗)试图(大嚼)椅腿。姨妈叫它(讨食鬼)，又偷偷喂了奶酪。"}, {"en": "June's husband Arthur, a retired (newscaster), wore an (earflap) hat against imaginary cold. A trouser (turnup) caught the gate. He could describe war in (dulcet) tones but would (gibber) at a difficult button. Clara helped. June offered a (mirthless) smile. “Don't (pamper) the old (codger).” Arthur replied that her (lumbago) had improved enough to permit cruelty. She called this (codswallop) and ordered him to carry glasses (pronto). Their quarrels were (raucous), rarely (pitiless). Clara was learning the distinction.", "zh": "姨父阿瑟是退休(新闻播音员)，戴着有(护耳片)的帽子抵御想象中的寒冷。裤脚(翻边)挂住门。他能用(悦耳)声音播报战争，却会对难扣的纽扣(含混抱怨)。克拉拉帮忙。姨妈给个(毫无笑意的)笑：“别(宠坏)这(老家伙)。”阿瑟说，她的(腰痛)已经好到足以刻薄人。她斥为(胡扯)，叫他(马上)搬杯子。夫妻争吵(吵闹)，却少有(冷酷无情)，克拉拉还在学习区分。"}, {"en": "Beatrice was marrying Hal, a (taciturn) mechanic who could (tinker) without explaining himself. Clara had met him twice. He owned a (rundown) shop beneath the (viaduct), dressed carelessly, and answered questions with a (murmur). Beatrice called him (gracious). Clara wondered whether (unconcern) looked attractive after years of being the loudest person in a room. Perhaps a woman with a house might improve his financial (sojourn). The wedding's (runup), and a long (buildup) of worry, had made suspicion feel established.", "zh": "母亲要嫁给哈尔，一个能默默(修修补补)的(寡言)机械师。克拉拉只见过两次。他在(高架桥)下有家(破旧)车铺，穿着随便，回答常是(低语)。母亲说他(亲切有礼)。克拉拉想，长期做房里声音最大的人，是否会觉得(无忧无虑)很迷人？有房子的女人，也许能改善他在人间的财务(旅居)。婚礼的(筹备阶段)，加上忧虑的长期(积累)，让怀疑仿佛成了定论。"}, {"en": "She meant to (forgo) judgement. Instead, her thoughts could (outstrip) evidence. Was he a restoration (backer), or merely a (taker)? Why was he (stubborn) about repairing the roof himself? Was thrift a virtue or a (sop) concealing poverty? She could (amass) doubts indefinitely. She had confused (truthfulness) with the (smugness) of expecting the worst.", "zh": "她本想(放弃)评判，思想却总能(跑在)证据前面。他是修房的(支持者)，还是只知索取的(接受者)？为何如此(固执)地自己修屋顶？节俭是优点，还是遮掩贫穷的(安抚说辞)？她可以无限(积攒)疑问，把(求真诚实)错认成预期最坏结果的(自满)。"}, {"en": "That was (heartless), and she knew it. Knowledge did not (smother) the thought. Her father died seven years earlier, leaving Beatrice with a house, a (budgerigar) whose (chirrup) filled mornings, and a habit of setting two cups out. Clara lived far away but believed absence entitled her to supervise her mother's future. She would not call this (covetous). She preferred concern.", "zh": "这很(无情)，她知道，却不能因此(压下)念头。父亲七年前去世，留给母亲一栋房、一只每天(啁啾)的(虎皮鹦鹉)，以及摆两个茶杯的习惯。克拉拉住得远，却觉得缺席不妨碍监督母亲未来。她不愿称之为(贪求)，宁愿称关心。"}, {"en": "Her father had been (ingenious), (frivolous), and sometimes (thoughtless). Memory removed the inconvenient parts. A photograph became an (artefact); an argument grew (indistinct). The living had to compete with somebody who could no longer make mistakes.", "zh": "父亲曾(富有巧思)、(爱玩闹)，有时也(欠考虑)。记忆删去了不便之处。照片成为(历史物件)，争执变得(模糊)。活人必须和一个再不会犯错的人竞争。"}, {"en": "In the kitchen, a (beaker) of icing balanced beside a (saucer) of buttons. A (platter) held (nougat), another (sherbet), and a (beet) rolled beneath the table. Mags, the (vivacious) cook, asked Clara to (sear) fish, then reconsidered. “Just stir.” Outside, somebody gave a (whoop). Inside, sauce began to (simmer). A (ravenous) cousin tried to (savor) a stolen (éclair) behind a (turnip). Mags threatened to (clobber) him with a towel. He said the (haggis) needed testing too. An unexplained (kipper) lay beside pastry glaze so (glutinous) it might repair the roof. Clara found the room's (fullness) comforting. Outside, a dove began to (coo), (oblivious) to human arrangements.", "zh": "厨房里，糖霜(量杯)平衡在装纽扣的(茶碟)旁。(大盘)盛着(牛轧糖)，另一盘是(果味冰甜食)，一颗(甜菜)滚到桌下。(活泼的)厨师玛格斯请克拉拉把鱼(煎焦表面)，随即改口：“搅拌就好。”外面有人(欢呼)，里面酱汁开始(慢炖)。一个(饿极了的)表亲躲在(芜菁)后(品尝)偷拿的(闪电泡芙)。厨师威胁用毛巾(揍)他。他说(苏格兰羊杂布丁)也得试吃。无人认领的(熏鲱鱼)旁，甜点酱(黏稠)得能修屋顶。满屋的(充实感)让人安心。外面鸽子(咕咕叫)，对人类安排(毫无察觉)。"}, {"en": "The groom was missing. Ned, the village (vicar), announced this wearing one shoe and one (slipper). He was an excellent listener and a (duffer) at dressing. Beatrice said Hal had gone to collect something. The (airiness) of her response produced an (upturn) in Clara's anxiety. It might be a harmless (holdup), or a chance to reconsider. Ned took a (bun), gave a (yawn), and confessed he'd hoped for a (kip). A dental (checkup) had left (drowsiness) and a numb lip, not a (stupor). He feared he might (slur) the vows, but practice restored confidence. His attempt to (proffer) reassurance lacked dignity but possessed (lightness).", "zh": "新郎不见了。(牧师)内德宣布时，一脚皮鞋，一脚(拖鞋)。他善于倾听，却是穿衣的(笨手)。母亲说，哈尔去取东西。她回答的(轻松随意)让女儿焦虑(上升)。或许只是(耽搁)，也可能是重新考虑的机会。牧师拿个(小圆面包)，打个(哈欠)，承认本想(小睡)。牙科(检查)让他(困倦)、嘴唇发麻，而非陷入(昏沉)。他担心誓词会(含混不清)，练习后恢复信心。他试图(提供)安慰，虽少庄重，却有种(轻盈)。"}, {"en": "Clara found a (flier): “The Great Escape—Tonight.” Beneath it: “Bring the ring.” A man could be a (charmer) and a fraud; quietness could conceal a (devious) plan. She photographed it. “That's for the puppet show,” Mags said. The first (blunder) took ten minutes. A (bystander) gave her a questioning look. Things had grown (fishier) because she supplied the fish. She promised not to (eavesdrop), (slander), or turn every (glimmer) into a charge. Then she heard Hal's name through a door left (ajar) and stopped. She managed to (overhear) a (monotonous) discussion of delivery charges. It defeated her appetite for intrigue.", "zh": "克拉拉发现(传单)：“大逃亡——今晚。”下写：“带上戒指。”男人可以是(迷人者)兼骗子，安静也能藏着(狡诈)计划。她拍了照。“那是木偶戏。”厨师说。第一场(失误)只花十分钟。(旁观者)投来疑问目光。事情变得(更可疑)，只是因为她主动添了疑点。她承诺不(偷听)、不(诽谤)、不把一点(微光)都变成罪名。随后听到哈尔的名字从(半开)门里传出，又停了。结果(无意听见)的，是一场(单调)的送货费讨论，彻底打消探秘兴致。"}, {"en": "The house had been a theatre. An actor offered to (induct) children into stage etiquette; they preferred to (overrun) the stage. He called them (rebellious), their parents called him (tactless). A (cavernous) room contained a stage, a (dimmer), and a painted (grotto). Cardboard (pterodactyls) hung from a (rafter). These (extinct) creatures had a busier social life than Clara. A paper (salamander) crouched beneath a model (constrictor); a (flightless) bird with one (flipper) stood beside a (reindeer). The collection was (ludicrous). Guests would (reenact) the final production, an (onerous) way to obtain lunch.", "zh": "房子曾是剧场。演员想把孩子(引入)舞台规矩，他们宁愿(占满乱跑)。演员说他们(叛逆)，父母说演员(不得体)。一间(洞穴般宽大)的房间里有舞台、(调光器)、画出的(洞窟)。(翼龙)纸模型挂在(椽子)上。这些(灭绝)生物的社交生活比克拉拉丰富。纸(蝾螈)蹲在模型(蟒蛇)下，长着单个(鳍肢)的(不会飞的)鸟站在(驯鹿)旁。收藏(荒唐)，客人却要(重演)最后一出戏，吃午饭竟如此(费事)。"}, {"en": "A painted (gar) stared from an aquarium backdrop; a puppet (stoat) dangled nearby. Guests with matching (binocular) cases had expected birdwatching. Instead, they faced an (ominous) heap of (detritus), a broken (rowboat), and (copious) (cobwebs). “It's (wondrous),” one said. The other looked (dubious). Theatre could (nonplus) people who preferred wildlife in its usual categories.", "zh": "水族背景里的(雀鳝)瞪着眼，木偶(白鼬)悬在旁边。两位带着(双筒望远镜)盒的客人本想观鸟，却面对(不祥的)一堆(杂物)、坏(划艇)，和(大量)(蜘蛛网)。“太(奇妙)了。”一人说，另一人(怀疑)。剧场真能让喜欢动物安分守类的人(困惑)。"}, {"en": "The play involved a (sorceress), a (giantess), and a (commoner) mistaken for an (heir). An (executioner) wore a (bicorn), the king carried a (lasso), and a (leprechaun) controlled trade. A sign announced an (embargo) on dancing. June located the script's (vileness) in its rhymes. A (precocious) girl in a (waistcoat) wanted to play the (torturer); her brother preferred the (captor). Their mother requested less laundry.", "zh": "戏里有(女巫)、(女巨人)，以及被错当(继承人)的(平民)。(刽子手)戴(双角帽)，国王拿(套索)，(小妖精)掌管贸易，牌子宣布禁止跳舞的(禁令)。姨妈认为剧本的(糟糕)在于押韵。一位穿(马甲)的(早熟)女孩要演(施刑者)，弟弟想演(俘虏他人者)。母亲只求少洗衣服。"}, {"en": "The directions contained (heinous) threats, (grievous) insults, and (murderous) plans that never happened. Children wanted more (bloodiness); June wanted fewer speeches. Theatrical (pus) made Arthur (nauseous). “It's custard,” Mags explained, without helping. Ned suggested less (vindictiveness). The eight-year-old villain declared the committee (traitorous).", "zh": "舞台说明充满(骇人的)威胁、(严重的)辱骂，和不会发生的(杀人)计划。孩子要更多(血腥)，姨妈要少讲话。戏剧用(脓液)令阿瑟(反胃)。“蛋奶酱。”解释无效。牧师建议少一点(报复心)，八岁反派宣布委员会全是(叛徒般的)。"}, {"en": "Upstairs, Clara's heel caught a damaged (caster). A table began to (teeter); she steadied it against the (banister). Beneath it lay an old (comic_strip), filed under that exact underscored label in her father's archive. He drew Beatrice as a pirate, Clara as a (stargazer), himself as a hungry (boar). A (taper) of sunlight crossed the page. A bird made a (swoop) over a (derelict) lighthouse; a (pawn) escaped a chessboard. He loved to (concoct) impossible journeys. The memory could still (stun) her, catching her (unawares) with ink.", "zh": "楼上，克拉拉鞋跟碰到坏(脚轮)，桌子开始(摇摇欲坠)，她扶住(楼梯栏杆)。下面有旧( comic_strip )——父亲档案里保留着下划线的标签。他把母亲画成海盗，把她画成(观星者)，把自己画成饥饿的(野猪)。一(道渐细的)阳光横过纸。鸟(俯冲)过(废弃的)灯塔，(棋子)逃出棋盘。他喜欢(编造)不可能的旅程。普通墨线仍能(震住)她，令她(猝不及防)。"}, {"en": "Two drawers were labelled (iwo) and (vas), inherited inscriptions nobody understood. Her father refused to replace them: a house deserved mystery. Inside lay a (tweezer), a (stopper), a brass (knocker), and a (sliver) of blue glass. The other held a faded (likeness) of her parents dancing, its border marked by a (teardrop) stain. Her mother's head rested against his shoulder with an expression Clara had forgotten.", "zh": "两只抽屉标着(iwo)和(vas)，是旧主人留下、无人明白的标签。父亲不换，说房子也值得保留神秘。里面有(镊子)、(瓶塞)、黄铜(门环)和一(片)蓝玻璃。另一只藏着父母跳舞的褪色(肖像)，边缘有(泪滴)痕。母亲靠着丈夫肩膀，神情是克拉拉已经忘掉的。"}, {"en": "Beatrice entered. “He'd say you moved everything.” She sat beside Clara, and the (clamour) briefly seemed distant. Then Clara asked whether Hal understood the house belonged to her. “You came all this way to ask about property?” Her explanation sounded worse than her question.", "zh": "母亲进来：“他会说你弄乱了。”她坐下，(喧闹)暂时远去。克拉拉却问哈尔是否知道房子属于母亲。“你大老远回来，就问财产？”解释比问题更糟。"}, {"en": "“You don't have to (fawn) over him,” Beatrice said. “But meet him without (scorn).” Clara felt her (scalp) grow hot. She wanted to (interject): this wasn't (disrespect). Beatrice raised a (fingertip). “Let me finish.” Clara took a (gulp) of air. Her mother's refusal to (flounder) weakened her own certainty. The small, (efficacious) gesture could still (overpower) her.", "zh": "“你不必(奉承)他，但可以不带(轻蔑)地见他。”女儿(头皮)发热，想(插话)辩解不是(不尊重)。母亲抬起(指尖)：“让我说完。”她(大口吸气)。母亲不肯(慌乱失措)，反让她的笃定动摇。小小(有效的)动作仍能(压倒)她。"}, {"en": "“I don't want anybody to (mistreat) you.” Beatrice listened with painful (attentiveness). “You think I can't notice?” Clara wanted to (deflect) the question. She called Hal secretive, then admitted he was quiet. She called the wedding sudden; they had been together two years. Clara simply wasn't there.", "zh": "“我不想有人(亏待)你。”母亲(专注地倾听)。“你觉得我看不出来？”克拉拉想(转移)问题。说哈尔神秘，又承认只是安静；说婚礼仓促，母亲提醒已经两年了，只是她不在场。"}, {"en": "“You're looking for a (specter),” Beatrice said. Clara heard (bitterness), partly her own. She had made herself a (doubter) and her mother someone needing rescue. No (seer) could have predicted how this (thoughtfulness) would feel. Beatrice was no (pushover). She needed no daughter to (unseat) every approaching man.", "zh": "“你在找(幽灵)，”母亲说。她听到(苦涩)，部分属于自己。她把自己变成(怀疑者)，母亲变成待救者。没有(先知)能预料，这种(体贴)在接受者那里是什么感觉。母亲不是(任人摆布的人)，无需女儿把每个接近者(赶下位置)。"}, {"en": "Beatrice went to (undress) and change. Clara felt (abject). She imagined herself a (lifesaver); her mother apparently saw a (meddler). Those identities could (intersect), but intentions didn't decide which applied. Outside, banners began to (flutter). Her reflection showed a (somber) face above a formal (getup). Downstairs, guests would (bicker), children (twitter), and Arthur tried to (barter) for cake. A portrait's exposed (stretcher), a patch of (disrepair), a child's shoe could (engross) her indefinitely. She couldn't (linger) here forever. Life below sounded (breezier). Perhaps she let grief (fetter) possibility and called it loyalty.", "zh": "母亲去(脱衣)换装，克拉拉感到(卑微难堪)。自认(救星)，对方却看见(干涉者)。两种身份可能(相交)，好意不能裁定是哪种。外面旗帜(飘动)，镜中(阴沉)的脸配着正式(装束)。楼下有人(拌嘴)，孩子(叽喳)，阿瑟为蛋糕(讨价还价)。画作露出的(绷框)、一处(失修)、童鞋，都能无限(吸引)她。但她不能一直(逗留)。楼下生活比脑中(更轻快)。也许她让悲伤(束缚)可能，再称作忠诚。"}, {"en": "Kit appeared with a (plunger). He was Hal's grandson. “The downstairs (loo) is making a noise.” A (hiss) suggested something (amiss). The cistern gave a (burp), then a (judder). Kit proposed a (wallop). Clara preferred inspection. They found a loose (feeler) arm and called Mags to shut the water off. Clara forbade further attempts to (tamper). Could she (zap) it with her camera? No. “Grandad would know,” Kit said. Clara disliked wanting to (contradict) him.", "zh": "基特拿着(通厕吸盘)出现。他是哈尔的孙子。“楼下(厕所)响了。”(嘶声)说明有点(不对劲)。水箱(打嗝)，又(震动)。男孩提议(猛击)，克拉拉主张检查。发现松动的(探测臂)后，请厨师关水。她禁止继续(胡乱摆弄)。能拿相机(电击)坏处吗？不能。“爷爷会。”她讨厌自己竟想(反驳)孩子。"}, {"en": "He asked whether a green mark was a (booger). Paint, she said. Disappointed, he revealed a dinosaur (romper) beneath his costume. He possessed the (jauntiness) of someone expecting adults to fix things. He began to (bleat), then appointed himself repair assistant. Clara found him impossible to (disown), even briefly.", "zh": "他问墙上绿色是不是(鼻屎)，她说是漆，他失望了。戏服下面是恐龙(连体童装)，带着一种相信成人总会解决问题的(轻快自信)。他学羊(咩叫)，自封维修助手。她发现哪怕暂时也无法(撇清不认)这个孩子。"}, {"en": "A van tried to (veer) around a (clump) of plants and struck a (hubcap). The puppy gave a (yelp). Its owner, (boisterous) in a (tailcoat), began to (bluster). June called him a (prat); he called her a (dingbat). Forty years of marriage had survived such weather.", "zh": "送货车想(转向)避开一(丛)植物，撞上(轮毂盖)。小狗(尖叫)。穿(燕尾服)的(吵闹)主人开始(大声嚷嚷)。姨妈骂他(蠢人)，他骂她(怪人)。四十年婚姻经受过这样的天气。"}, {"en": "A (headmistress) arrived with a (stepladder). She organised helpers in (twos), including a band (marcher) and a retired (bowler) whose knees were (feebler) than his opinions. “Don't (dither). Chairs (hither), boxes (thither).” She could (drown) almost anything. Arthur called her a (steamroller). She accepted the compliment.", "zh": "一位(女校长)带着(折梯)来，把帮手分成(两人组)，包括乐队(行进者)和膝盖比意见(更无力)的退休(投球手)。“别(犹豫)。椅子(这里)，箱子(那里)。”她能(淹没)几乎所有声音。阿瑟称她(压路机)，她接受表扬。"}, {"en": "The van carried a mechanical (palomino). It could (droop) its head and (canter) in place, but wasn't supposed to (gallop). The wrong switch made it (lollop) down the drive. One guest had to (leap) over flowers, another to (clamber) onto its back. The (uproar) left the driver with a (cramp). Mags called it a (fiasco); June called it an excellent rehearsal.", "zh": "车里是机械(浅金色马)。它能(垂头)、原地(慢跑)，却不该(疾驰)。错按开关，它沿车道(笨拙跳跑)。客人(跃过)花盆，另一个试图(攀上)马背。(喧闹)让司机(抽筋)。厨师说是(惨败)，姨妈说是绝佳排练。"}, {"en": "A wheel escaped. Clara stopped Kit chasing it before he could (obstruct) traffic. Someone used blades to (scissor) fabric into ties; another strapped the horse's (hindquarter). Mud left a (smear) on its (rump). A crooked seat formed a (hump), causing riders to (slither) backwards. The driver wanted to (blubber). June told him to keep his (pecker) up.", "zh": "轮子飞了，克拉拉拦住孩子，免得(阻碍)交通。有人用刀刃(剪开)布条捆扎，另一个束住马的(后半身)。(臀部)沾上泥(污迹)，歪座形成(隆起)，让骑者往后(滑)。司机想(大哭)，姨妈让他振作(精神)。"}, {"en": "Clara helped (tether) the horse beside a (stump). It gave a metallic (purr). A guest dressed as a (prospector) suggested machinery got wedding nerves too. Clara laughed unexpectedly. The day might (outdo) her expectations. The driver said the theatrical (outfitter) meant to (launder) its costume, but offered a (duster) instead. Clara accepted without (demur). Guests began to (scamper) after ribbons. Mags put away an unused (sparkler) before further experiments occurred.", "zh": "她帮忙把马(拴在)(树桩)边，机器发出金属(呼噜)。扮(勘探者)的客人说，机械也会婚礼紧张。她意外笑了，这一天或许能(超出)期待。司机说戏服(供应商)本想(清洗)，最后只给了(掸布)。她毫不(异议)地接过。客人开始(奔跑)捡飘带，厨师收起未用的(烟花棒)，制止进一步实验。"}, {"en": "Hal returned with a wooden case. His (sneaker) was wet, his jacket torn, and a (forefinger) bandaged. Beatrice descended, simply dressed, her eyes (luminous). He stopped, unable to (muster) words. Finally: “You look like yourself.” Clara had heard more elegant compliments, perhaps none better.", "zh": "哈尔抱木盒回来。(运动鞋)湿了，夹克破了，(食指)包着。母亲下楼，衣着简单，眼睛(发亮)。他停下，无法(鼓起)话语，最后说：“你看着像你自己。”克拉拉听过更漂亮的赞美，也许没听过更好的。"}, {"en": "He immediately helped Arthur with a chair. A (callus) caught its covering, and he loosened it patiently. Clara noticed a (tatter), a (blister), and a (whisker) of thread on his sleeve: details a (closeup) could show without explaining. Her attempt to (peer) at his finger puzzled him. He didn't know he was a (contender) in a contest against memory.", "zh": "他立刻帮阿瑟搬椅。(老茧)勾住布，他耐心解开。克拉拉注意到(破口)、(水疱)、袖上像(细须)的线头——(特写)能拍，却不能解释。她想(仔细看)伤指，他有些困惑。他不知道自己是与记忆竞争的(竞争者)。"}, {"en": "The case held her father's violin, repaired. Hal found it in the attic and took it to a maker. He couldn't play; Beatrice could. Clara assumed the music ended with her father. Hal thought it might begin again. He had preserved the broken bridge in the case. A (tremulous) smile appeared on Beatrice's face. Once (desirous) of a musical career, she had stopped discussing it. Hal found somebody who could repair an instrument instead of offering praise.", "zh": "盒里是修好的父亲的小提琴。哈尔在阁楼找到，送去修理。他不会拉，母亲会。女儿以为音乐随父亲结束，哈尔却认为可以重来。他把坏琴码也保存在盒里。母亲露出(微颤的)笑，她曾(渴望)专业演奏，后来不再提。哈尔没有空口夸奖，只找到会修琴的人。"}, {"en": "“I wasn't replacing anything,” he told Clara by the gate, while guests debated whether the king needed a (pincer) or a spoon. “She said it couldn't be repaired. I asked.” Her suspicions seemed (overblown). He waited while she searched for words, without trying to (gloat).", "zh": "“我没想替代谁，”他在门边说。客人还在讨论国王该拿(钳子)还是勺子。“她说修不了，我就问了问。”怀疑显得(夸大)。他等她组织话语，没有(幸灾乐祸)。"}, {"en": "Beyond them, a neighbour hurried to (moor) his boat. The sky began to (lour). A (wader) moved along the river; a child's hat bobbed (afar). A (vociferous) guest said the rain would miss them. Arthur offered to (confer) with his knee, which disagreed. Another gave a (contemptuous) laugh. People defended predictions rather than looking at clouds.", "zh": "门外邻居忙着(系泊)小船，天开始(阴沉)。一只(涉禽)沿岸行走，童帽在(远处)晃。一名(大声嚷嚷的)客人说不会下雨，阿瑟提议与膝盖(商议)，膝盖不同意。另一人(轻蔑)地笑。人们捍卫预报，却不看云。"}, {"en": "A (thunderclap) settled matters. Rain began to (seep) through the theatre roof. A competing (sprinkler) switched on. Guests gave a (gasp). Beside a lamp, the paper king began to (smolder); Mags unplugged it and covered the tiny (ember). No spreading fire, only wet paper. The noise rose to a (crescendo). Water began to (splatter) windows and (patter) onstage. A speaker would (sputter), then (stutter), then go silent, improving matters.", "zh": "(雷声)裁定了争论。雨从剧场屋顶(渗入)，(喷淋器)也启动。客人(倒吸气)。灯旁纸国王开始(闷烧)，厨师拔电，盖住小小的(余火)。没有蔓延，只有湿纸。噪声却达到(渐强高潮)。水(飞溅)窗户，(噼啪落在)舞台。喇叭(噼啪断续)，再(结巴)，终于沉默，情况反而好转。"}, {"en": "A (gossamer) curtain sagged. Someone slipped with a (splat). The king declared himself a (goner). A (rooster) apparently agreed. A child called it a (bummer), Arthur a (ferocious) nuisance. June told him not to (inflict) commentary. Mags kept people away from paper that might still (smoulder) near the fitting. A black (cinder) fell. Crowding around could turn this into something (monstrous).", "zh": "(轻纱般的)帘子下垂，有人(啪地)滑倒。国王宣布自己是(完蛋的人)，一只(公鸡)似乎同意。孩子说这是(扫兴事)，阿瑟说是(凶猛的)麻烦。姨妈叫他别把解说(强加)大家。厨师让人远离仍可能(闷燃)的纸，一块黑(煤渣般残屑)掉下。围观可能把小事故变(巨大可怕)。"}, {"en": "Hal stopped the garden supply. Clara directed people away from props that might (concuss) someone. June organised towels, Kit a bucket. Apparently (tumultuous) confusion acquired order. Beatrice lifted her skirt. “We can move chairs. Nobody promised the roof would marry us.”", "zh": "哈尔关水，克拉拉把人引离可能砸出(脑震荡)的道具，姨妈组织毛巾，孩子拿桶。(纷乱动荡)开始有序。母亲提着裙子：“搬椅子就好，没人说屋顶要和我们结婚。”"}, {"en": "Arthur began to (splutter) about insurance. June said not to (fritter) time on a (tedious) argument. Children tried to (stomp) in water and looked (mutinous) when stopped. A ball began to (skitter) towards a drain; Kit retrieved it. Then he announced a genuine (turnup): the cake was dry.", "zh": "阿瑟(语无伦次地抱怨)保险。姨妈不许在(乏味)争论上(浪费)时间。孩子想在水里(跺脚)，被拦后(闹反抗)。球朝排水沟(飞快滑动)，基特捡回，又报告一桩真正的(意外好事)：蛋糕没湿。"}, {"en": "They cleared a smaller rehearsal room. A costume (sorter) moved boxes; a (dueler) carried flowers; the (plunderer) saved cake. A royal (patroller) guarded wet flooring. A new (comer) to the club carried a bench while a (tumbler) balanced cups. June, habitual (crosser) of boundaries, asked permission before taking coats. When Clara struggled with a chest, Hal took its other end, not the whole task. That courtesy tightened her throat.", "zh": "大家清理小排练室。(服装分类员)搬箱子，(决斗者)搬花，(掠夺者)救蛋糕。皇家(巡逻员)守湿地板，剧团新(来者)抬凳，(杂技演员)端杯。惯于(跨越)个人边界的姨妈，也先问再拿外套。克拉拉搬不动箱子时，哈尔拿另一端，而非夺走整个任务。这点礼貌让她喉咙发紧。"}, {"en": "Outside, the driver checked a damaged (blinker), and someone moved (hosepipes). A guest with (sunburn) refused shelter because he preferred weather. Arthur called him a (weirdo), then apologised. He could (outwear) patience but occasionally recovered clarity.", "zh": "外面司机检查坏(转向灯)，有人移走(水管)。一个(晒伤)客人坚持喜欢天气、不进屋。阿瑟叫他(怪咖)，又道歉。他能(耗尽)别人的耐心，却偶有清醒。"}, {"en": "Open doors prevented guests having to (swelter). A (wisp) of mist crossed the lawn. Scenery could (molder); electricians could deal with wiring later. A (glower) from June could still (deject) helpers, but softened when she noticed their effort. Clara had believed preventing enough mistakes might prevent loss. A (fruitless) ambition: love offered no contract.", "zh": "开门免得客人在戏服里(闷热难熬)，一(缕)薄雾掠过草坪。布景可以先(霉烂)，电工以后再来。姨妈的(怒目)仍能(打击)帮手，但看见努力便温和了。克拉拉一直以为防止足够多错误就能防止失去。这是(徒劳的)野心，爱没有这种合同。"}, {"en": "Beatrice lent a (nightgown) to a drenched guest; Arthur received a (muffler). The exchange had more (vigour) than elegance. Wet sleeves would (spatter) the floor. Clara felt her certainty (waver).", "zh": "母亲借(睡衣)给湿客人，阿瑟得到(围巾)。交换比优雅更有(活力)。湿袖(溅水)，克拉拉的笃定开始(动摇)。"}, {"en": "Then the ring vanished. Hal searched his pockets and case. Beatrice checked a (wineglass) and a small (ewer). June accused the puppy of trying to (pilfer) jewellery; it offered (slobber). Clara asked people to stop moving. The ring had been secured by a (clasp). Hal tried to (rasp) an explanation, then began to (stammer). Beatrice touched his wrist. No reason to (cower). “It hasn't gone (incognito). It's here.” She would not let waiting's (limbo) consume the day.", "zh": "然后戒指不见了。哈尔找口袋和盒子，母亲查(酒杯)和花用(细口水壶)。姨妈怀疑小狗(偷取)珠宝，它只贡献(口水)。克拉拉请大家停下。戒指原先用(扣子)固定。哈尔嗓子干得(沙哑说话)，又开始(结结巴巴)。母亲摸他手腕，不必(畏缩)。“它又没(隐姓埋名)，就在这儿。”她不让等待的(悬而未决)吃掉下午。"}, {"en": "An (onlooker) became a helper. The kitchen (eavesdropper) checked cushions. A guest who had tried to (flatter) Beatrice looked under the (doormat). She declined substitute rings. No magic was involved; she wanted the one they chose together.", "zh": "(围观者)变帮手，厨房(偷听者)检查坐垫，先前试图(奉承)母亲的客人查看(门垫)。母亲拒绝替代戒指，没有魔法，只是想要共同挑的那枚。"}, {"en": "Arthur recommended professional searching and sat down. June called him a (waster). A cousin began to (smatter) about fate until Mags assigned dishes. No (whiner), he accepted and soon had (soapsuds) to his elbows. Clara asked helpers to (crisscross) rooms and (scour) one area each. A (wasp) interrupted. June tried to (swat) it, nearly knocking Arthur over. He alleged attempted murder; she called his magnificent ducking (sportsmanship). Kit gave a (snigger) and searched under a (bulbous) vase. He was neither (gormless) nor systematic. A guest called him a (brat); June said discourtesy wasn't a personality. The guest apologised.", "zh": "阿瑟建议专业搜寻，自己坐下。姨妈叫他(懒散无用的人)。表亲开始(浅薄谈论)命运，厨师交给他碗碟。他并非(抱怨者)，接受工作，很快满肘(肥皂泡)。克拉拉请大家(交叉穿行)房间，分区(彻底搜查)。(黄蜂)打断行动，姨妈试图(拍打)，差点掀翻阿瑟。他控诉谋杀，她称他躲得漂亮，是(体育精神)。基特(窃笑)，查一个(球状鼓起的)花瓶。他既不(呆傻)，也不系统。客人叫他(熊孩子)，姨妈说失礼不叫个性，那人道歉。"}, {"en": "Clara remembered Hal stopping upstairs to help with the table, then finding tape in a drawer. She opened it. The ring lay by the blue glass: he had removed it from his pocket while bandaging his finger. She lifted it with a (tremor), then a (shiver). An act of help caused the disappearance she almost converted into drama.", "zh": "克拉拉想起哈尔楼上帮搬桌，随后从抽屉拿胶带。她打开，戒指就在蓝玻璃旁：他包手指时把它拿出保管。她(颤抖)着拾起，继而(打了寒战)。一个帮忙动作，造成她差点戏剧化的失踪。"}, {"en": "The hour's (furor) settled. The drawer had become a (lair) for fears of replacement and (nothingness). Yet the ring lay in an ordinary place. Her interpretation, not the house, had been (treacherous).", "zh": "一小时的(骚动)平息。抽屉成了恐惧的(巢穴)：替代、失去，以及旧生活结束后的(虚无)。但戒指就在普通地方。(不可靠而危险)的是她的理解，不是房子。"}, {"en": "Outside, Hal repaired a chair. “I owe you an apology.” He looked up. “For the chair?” She shook her head. “For thinking you wanted something from Mum.” He considered. “I do. Breakfast with her.” Clara laughed, then began to (weep). A nearby (snicker) went ignored. Hal admitted weddings made him cry too and offered a handkerchief.", "zh": "外面，哈尔修椅子。“我欠你道歉。”他抬头：“为椅子？”她摇头：“以为你想从妈妈那里得到什么。”他想了想：“是啊，和她吃早餐。”她笑，继而(哭)。旁边一声(窃笑)被忽略。哈尔说婚礼也会让他哭，递了手帕。"}, {"en": "The puppy ran past, trailing a (slop) of water. It gave a (whimper), received a towel, and recovered. Hal's (demeanour) stayed calm. He didn't (simper) or make her apology his triumph. His lack of performance began to (endear) him to her.", "zh": "小狗跑过，拖着一(滩)水，(呜咽)后得到毛巾，立刻恢复。哈尔(举止神态)不变，不(装模作样地笑)，也不把道歉变胜利。他不表演，开始让她(喜欢)。"}, {"en": "“I thought protection meant suspicion.” Hal said sometimes it did. “But ask her first.” Clara wanted a villain because villains simplified loyalty. A decent man required changing her mind. He admitted a parking (misdemeanour) and forgotten birthdays. Neither saint nor (rotter), neither hero nor (sucker): a person. Her father had been one too.", "zh": "“我以为保护就是怀疑。”他说有时是，“但先问她”。她想要反派，因为反派使忠诚简单。好人要求改主意。他承认停车(轻微违法)、忘记生日。不是圣徒，也非(坏蛋)，不是英雄，也非(容易上当的人)，只是人。父亲也曾是。"}, {"en": "She apologised to Beatrice. Her mother listened and gave her cheek a (caress). “You don't have to be your father.” Clara had inherited neither his marriage nor his place at the table. Loving Hal would not (dishonor) him, and remembering him need not (constrict) another life. “You're not a (turncoat). Nobody's betrayed.” Clara had made memory a country with guarded borders. New love needn't (sever) attachment or tear family (asunder). It allowed another chair.", "zh": "她向母亲道歉，母亲听完(轻抚)她脸。“你不用当你父亲。”她没继承他的婚姻或座位。爱哈尔不会(辱没)父亲，纪念父亲也不必(束缚)别人。“你不是(叛徒)，没人被背叛。”悲伤让记忆成为严守边界的国度。但新爱不必(切断)旧情，也不会把家撕得(四分五裂)，只多一把椅子。"}, {"en": "The wedding proceeded. Ned stood on a (dais), waiting for the (clamor) to stop. Rain obscured his words; a child chose the quietest moment to (slurp). Another began to (squat) by the flowers. Its mother tried discreetly to (stoop), struck a chair with a (thump), and abandoned discretion. Arthur coughed. June passed water without comment. Hal's voice had a (quaver) but didn't (falter). Once, accidentally, they answered in (unison).", "zh": "婚礼举行。牧师站上(小台)，等(喧哗)停。雨遮住话语，一个孩子偏在最静时(吸溜喝水)，另一个在花旁(蹲下)。母亲想悄悄(弯腰)，却(砰地)撞椅，索性不再悄悄。阿瑟咳嗽，姨妈默默递水。哈尔声音有(颤音)，却没(犹豫停顿)。两人意外(齐声)回答了一次。"}, {"en": "Their promises didn't attempt to (imprison) time. They spoke of mornings, fair arguments, helping when strength failed. Ned corrected a mistaken line without (fuss). Beatrice's (fervour) was quiet. Clara stopped trying to (obsess) over the photograph. Getting the image right nearly made her miss the experience.", "zh": "誓言不试图(囚禁)时间。他们讲早晨、公平争论、衰弱时帮忙。牧师读错后纠正，没有(大惊小怪)。母亲的(热忱)安静，克拉拉停止(执迷)拍好照片——正确影像差点让她错过体验。"}, {"en": "A (shudder) of feeling passed through her. Her favourite moment wasn't photographed: Hal moved a chair, and Beatrice touched his arm. The gesture assumed he would remain. No (supercilious) assurance, (unctuous) compliment, or (sanctimonious) lesson, simply company. Clara examined motives while her mother lived their result.", "zh": "一阵情绪(震颤)掠过。她最喜欢的时刻没拍到：哈尔移椅，母亲摸他手臂，动作预设他会留下。没有(高傲的)保证、(油滑的)赞美或(假正经的)教训，只是陪伴。她还在查动机，母亲已活在其结果里。"}, {"en": "Lunch survived. Cold fish, warm potatoes, a cake repaired with a (dollop) of icing. Guests ate with (gusto). One called it (sumptuous), another (marvellous). Kit reconsidered swallowing an entire roll after June looked at him. The puppy slept. Arthur chose to (flump) into a chair with a satisfied (slump). June warned against confusing lunch with permanent (torpor).", "zh": "午饭保住了：冷鱼、热土豆，蛋糕用一(大勺)糖霜修补。客人吃得(津津有味)，有人说(丰盛奢华)，有人说(美妙)。基特被姨妈一看，放弃整吞面包。狗睡了，阿瑟(扑通坐下)，满足地(瘫靠)。姨妈提醒午餐别变永久(昏懒)。"}, {"en": "Arthur raised (liqueur) for a toast. June asked him to (savour) the drink instead of prolonging the speech. Mags cleared a fish (carcass); someone found a forgotten (fritter). Pleasure required no polished presentation.", "zh": "阿瑟举(利口酒)祝酒，姨妈请他(品味)饮料而非拉长演讲。厨师收鱼(残躯)，有人找到遗忘的(油炸点心)。快乐不需要光鲜摆盘。"}, {"en": "The improvised play continued. The (nun) stole the crown, the witch demanded tea, and the dungeon attendant apologised for his costume. A (youngster) missed a cue. “(Blighter),” June whispered affectionately, refusing to (fluster) him. The audience was (rapturous), not for extraordinary (prowess), but because everybody helped it survive.", "zh": "即兴戏继续，(修女)偷王冠，女巫要茶，地牢人员为服装道歉。(小演员)错过提示。“(小淘气)，”姨妈亲昵低语，不愿让他(慌乱)。观众(狂喜)，不是因为了不起的(技艺)，而是都参与救了这场戏。"}, {"en": "The king tried to (swagger), the peasant to (sneer), the audience to (jeer) on cue. One villain's (leer) dissolved into laughter. A (joker) interrupted until actors forbade adult assistance. A child announced a royal-kitchen (summons). Critics might have called it (hideous). Clara found it (stupendous): adults and children agreeing on what was pretend.", "zh": "国王(大摇大摆)，平民(冷笑)，观众按提示(起哄)。反派的(斜眼邪笑)变成真笑，前排(爱开玩笑的人)插话，被演员禁止成人援助。孩子宣布皇家厨房的(传令)。评论家也许说(难看)，克拉拉却觉得(惊人精彩)：大人与孩子终于同意什么是假装。"}, {"en": "At (sundown), Beatrice tuned the violin. The first phrase was uncertain, the next less so. A (titter) at Arthur's chair faded. Years of silence became part of the sound; this music belonged to the new life. A burst of (oohs) nearly interrupted until June intervened. The room quietened enough for the bow's soft (whir) and the river beyond. Clara noticed a glass's (shimmer), candlelight's (quiver), and a (flicker) of concentration on Hal's face. He wasn't admiring his gift. He was listening.", "zh": "(日落时)，母亲调琴。第一句犹疑，第二句好些。阿瑟椅子引起的(轻笑)消失。多年沉默成了声音的一部分，这音乐属于新生活。一阵(惊叹声)差点打断，姨妈制止。房间静得能听见琴弓的轻(呼鸣)和河流。克拉拉看见杯子的(闪光)、烛火的(颤动)、哈尔脸上专注的(一闪)。他不是欣赏礼物，而是在听她。"}, {"en": "A (straggler) requested another song. Children wanted cake, June her coat. Hal walked guests out with a torch. One gave a (stagger), another tried to (totter) in borrowed shoes. Nobody drove after a (nightcap). Clara offered help tomorrow. Her mother simply accepted.", "zh": "(落后的客人)还想听，孩子要蛋糕，姨妈要外套。哈尔举手电送人，有人(踉跄)，有人穿借鞋(蹒跚)。喝过(睡前一杯酒)的都不开车。克拉拉说愿意明天帮忙，母亲平常地接受。"}, {"en": "They stayed to wash glasses. An autumn (bloomer) floated in a bowl. Beatrice rescued it before it could (wither). Why keep so much scenery? “I like making room,” she said. The answer seemed larger than the question.", "zh": "他们留下洗杯。一朵秋季(开花植物的花)漂在碗里，母亲赶在(枯萎)前救出。为何留这么多布景？“我喜欢腾出空间。”答案似乎大于问题。"}, {"en": "Later, Clara reopened the drawings. In the final panel, her family sat beneath a huge sun. No ending followed. Downstairs, somebody attempted a (quickstep) on kitchen tiles. Hal barely managed it, but his laughter carried. June began to (mutter) that they would (tramp) through the ceiling. Clara had treated the absent ending as something to defend. Perhaps it was simply space. She closed the drawer and joined them. The past could accompany her without making her (trespass) on somebody else's future.", "zh": "后来克拉拉重开画册，最后一格，一家坐在大太阳下，没有结局。楼下有人在厨房跳(快步舞)，哈尔勉强跟上，笑声却传来。姨妈开始(嘟囔)他们要把天花板(踩穿)。克拉拉曾把缺失结局当成必须捍卫的东西，也许它只是空间。她关抽屉，下楼加入。过去可以陪着她，不必使她(侵犯)别人的未来。"}];

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0)
(function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  bookEl.appendChild(div);
})();

// Paragraph rows (paragraphs 1..n)
const jumpSel = document.getElementById('jumpSel');
DATA.slice(1).forEach((d, i) => {
  const p = i + 1;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + p;
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + p + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const label = S.p === 0 ? 'Title' : ('Paragraph ' + S.p + ' of ' + (sentences.length - 1));
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-notes-for-an-unrehearsed-wedding-v1';
const LS_OLD_KEY = 'audiobook-notes-for-an-unrehearsed-wedding-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
