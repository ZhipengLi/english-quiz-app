<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What the Last Ferry Carried — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>What the Last Ferry Carried</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>

        <option value="0.75">0.75&times;</option>

  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">

  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "What the Last Ferry Carried", "zh": "最后一班渡轮载走了什么"}, {"en": "On the morning Bell Island ceased to be an official place of (habitation), its oldest resident was trying to (whisk) an egg. The (yolk) broke, a gull gave a (shriek), and Ruth Calder announced that the government's timetable was (tosh). Her granddaughter Mina stood in the kitchen wearing a (mackintosh), holding a (rucksack), and attempting to (feign) patience. Outside, water had reached the village (sundial), and (condensation) blurred the windows. They watched water (gush) through a gap in the wall. The sea did not need to (countersign) the evacuation order. It had already begun to enforce it.", "zh": "贝尔岛正式不再被视为适宜(居住)之地的那天早晨，岛上最年长的居民正在(搅打)一枚鸡蛋。(蛋黄)破了，海鸥(尖叫)了一声，露丝·考尔德宣布政府的时间表简直是(胡说八道)。孙女米娜穿着(雨衣)，拿着(背包)，站在厨房里努力(假装)耐心。外面，海水已涨到村里的(日晷)，窗上满是模糊的(冷凝水)。她们看着水从墙缝里(涌出)。大海无须在撤离令上(会签)，它已经开始执行。"}, {"en": "For three winters, engineers had measured an increasing (fluctuation) in the island's foundations. The report was (impersonal), its conclusion (bleak): another storm could (wreak) damage beyond repair. Residents had been offered mainland houses. Some regarded the offer as a (windfall); others called it an (abomination). Ruth called it organised (expulsion). Mina, whose job was to help everyone leave, knew that a fact could be correct and still fail to (quell) a person's (anguish). She put the pan down, resisting the urge to (straighten) everything within reach. “The last ferry leaves at four.”", "zh": "连续三个冬天，工程师都测到岛基越来越大的(波动)。报告(冷冰冰)，结论(黯淡)：再来一场风暴，就可能(造成)无法修复的损害。居民获配大陆住房，有人视为(意外之财)，有人称其为(令人憎恶的事)。露丝说，这是有组织的(驱逐)。负责协助撤离的米娜知道，事实即便正确，也未必能(平息)一个人的(痛苦)。她放下锅，忍住想把手边东西全部(摆正)的冲动。“最后一班渡轮四点开。”"}, {"en": "Ruth became (waspish). Beneath a (tartan) (shawl), her shoulders seemed almost (frail), but her voice retained the power to (appal) a minister. She had a (knack) for repairing nets, developed over sixty years, and no talent for learning to (grovel). No grandchild would now (banish) her from her kitchen. Mina felt a (spasm) of (exasperation). She could organise an evacuation or win an argument with Ruth. Accomplishing both appeared unlikely.", "zh": "露丝变得(尖刻)。披着(格子呢)(披肩)的肩膀显得(瘦弱)，声音却仍足以让部长(惊骇)。她修了六十年渔网，练就一身(本领)，唯独不会(卑躬屈膝)。孙女休想把她(赶出)厨房。米娜感到一阵(痉挛般的)(恼怒)。她可以组织撤离，也可以赢过祖母；同时完成两件事，似乎不大可能。"}, {"en": "The house contained seventy years of (handiwork). A (patchwork) quilt covered a (wickerwork) chair; a wooden (merman) grinned from the (lintel). On the shelf stood an (earthen) pot, a cracked (tureen), and a (cylindrical) tin of buttons. Ruth's husband had carved every (talon) of the seabird above the door, then forgotten its second eye. A (blemish) gave work character, she maintained. Mina thought it gave dust somewhere to (lurk).", "zh": "房子里积了七十年的(手工制品)。(拼布)被盖着(柳条编织的)椅子，木雕(男人鱼)在(门楣)上咧嘴笑。架子上有(陶制)罐、裂了的(汤盆)，以及装纽扣的(圆筒形)铁盒。露丝的丈夫把门上海鸟每一只(爪子)都刻得细致，却忘了第二只眼。她说，(瑕疵)使作品有个性。米娜觉得，它给灰尘提供了(藏身)之处。"}, {"en": "A carved (yak) shared another shelf with a toy (sloth) and a glass (chameleon). Their owner had never travelled farther than the capital. These objects were a (constellation) of other people's journeys. A (smitten) sailor once gave Ruth a silver (flagon); she married somebody else and kept it. A wooden (weasel) came from a cousin whose stories could (hoodwink) nobody but himself. Mina had loved these things before she had to calculate their weight.", "zh": "另一层架子放着木雕(牦牛)、玩具(树懒)和玻璃(变色龙)。主人去过最远的地方不过是首都，这些东西却组成了别人的旅程的(星座)。一个曾为她(神魂颠倒)的水手送过银(大酒壶)，她嫁给了别人，却留下它。木雕(鼬鼠)来自一个表亲，他的故事除了自己，谁也(骗不了)。在必须计算重量之前，米娜曾喜爱这一切。"}, {"en": "They agreed on three boxes. Ruth interpreted that as three per room. One held a (cauldron) from the village play, a (silken) scarf, and an (oaken) (chessman). Another contained a (phial) of perfume and a (vial) of something (whitish). A third carried a (candelabrum), a (quill), an (inkwell), and a (pincushion) shaped like a (toadstool). A dancer's costume exposing the (navel) joined them. The boxes were so (overladen) that lifting them looked like (heroism).", "zh": "她们说好三个箱子，露丝理解成每个房间三个。一箱装着村戏用的(大锅)、(丝质)围巾和(橡木)(棋子)；另一箱有香水(小瓶)，以及一只装着不明(发白)物质的(小玻璃瓶)；第三箱放着(多枝烛台)、(羽毛笔)、(墨水瓶)和(毒蘑菇)形状的(针插)。一套露出(肚脐)的舞衣也塞进去了。箱子(装得过重)，搬动它们都像是(英雄行为)。"}, {"en": "Under the table lay one (galosh), a model (toboggan), and a rusty (tenterhook) from the cloth workshop. Ruth wanted her husband's (chisel), too. He could (varnish) cupboards, (burnish) brass, and mend clocks, but paperwork defeated him. A (pinprick) of ink marked his final letter. Mina folded it carefully. The most important things were often the easiest to carry.", "zh": "桌下还有一只(橡胶套鞋)、(平底雪橇)模型，以及布坊遗留的生锈(绷布钩)。露丝也要带丈夫的(凿子)。他会给柜子(上清漆)、把黄铜(擦亮)、修钟，却拿文件没办法。他最后一封信上有个(针尖般)的墨点。米娜小心折好。最重要的东西，往往最好携带。"}, {"en": "“Choose what matters,” Mina said. Ruth gave her a (baleful) look and added a (flannel). A garden (tendril) had entered beneath the (sill). Mina reached to (pluck) it free. Ruth caught her (forearm). “Leave that.” Her voice was (reproachful). Mina understood she was not defending a weed. Calling the move sensible would not (diminish) her loss. Every removal threatened to (heighten) her fear and (deepen) the belief that a whole life could become rubbish.", "zh": "“挑重要的。”米娜说。露丝给她一个(凶狠的)眼神，又加进一块(法兰绒)。花园的(卷须)从(窗台)下钻进来，米娜伸手想(拔掉)。露丝抓住她的(前臂)。“别动。”语气满是(责备)。米娜明白，她维护的不是野草。说搬家明智，不会(减轻)损失。每移走一件东西，都可能(加剧)恐惧，(加深)她对整个人生会变成垃圾的担心。"}, {"en": "Mina went outside to (summon) help, leaving Ruth to (mull) her choices. The door gave a (creak); a frog answered with a (croak). A (lank) boy tried to (skulk) away from carrying boxes. His sister called him a (loon), then took the lighter end herself.", "zh": "米娜出去(叫人)帮忙，留祖母独自(琢磨)。门(吱呀)一声，青蛙(呱叫)回应。一个(瘦高的)男孩想(偷偷躲开)搬箱子，姐姐骂他(傻瓜)，随后自己拿起较轻的一端。"}, {"en": "The square offered no (restful) alternative. Families tried to (cram) furniture into vans while children attempted to (gambol) between them. A (mongrel) escaped and began to (prowl) around the food stall. Somebody shouted about (vermin); another called it a (wastrel). The baker, an (unshaven) man in a (smock), still wearing his summer (suntan), told both to stop being a (pillock). His wife suggested “(berk)” was more accurate. Even in (turmoil), the village retained verbal precision.", "zh": "广场也不(安宁)。人们把家具(硬塞)进货车，孩子在车间(蹦跳嬉戏)。一只(杂种狗)逃出来，在食摊边(游荡)。有人嚷着(害兽)，有人骂它(无用的家伙)。面包师(没刮胡子)，穿着(工作罩衫)，还保留着夏天的(晒黑肤色)，叫两人别当(蠢货)。妻子认为用另一个词“(笨蛋)”更准确。即使在(混乱)里，村民仍讲究用词。"}, {"en": "A (sodden) notice described summer rainfall as “(subnormal)”. Someone had added a (scrawl): “It saved the rest for winter.” A man gave a (smirk); his wife answered with a (scowl). They had been told to (ration) drinking water in August. Now it was everywhere except where useful, producing considerable (resentful) humour.", "zh": "一张(湿透的)告示说，夏季降雨“(低于正常值)”。有人(潦草添写)：“剩下的都攒到冬天了。”男人(得意地笑)，妻子回以(皱眉怒视)。八月他们还得(限量使用)饮用水，如今水无处不在，唯独不在有用的地方，由此产生不少(愤愤不平的)幽默。"}, {"en": "At the harbour, Captain Noor worked with a (brisk) efficiency that made Mina (wistful). Wearing (khaki) trousers and a blue (turban), he could (beckon) a driver forward and (restrain) three passengers with one hand. The clerk tried to (deem) a piano ordinary baggage. A chain gave a (clank), a crate a (thunk), and a van a protesting (squeak). A (plank) covered a gap beside a truck's (flank). Every (berth) was assigned. There would be no second sailing.", "zh": "码头上，努尔船长(利落)的效率让米娜(羡慕又惆怅)。他穿着(卡其色)裤子，戴着蓝(头巾)，一只手就能(招呼)司机前进、(制止)三位乘客。文员试图把钢琴(算作)普通行李。铁链(铿啷)，箱子(砰响)，货车不满地(吱叫)。(木板)盖住卡车(侧面)旁的空隙。每个(泊位)都安排好了，不会再有第二趟船。"}, {"en": "A van arrived at (breakneck) speed and received Noor's wordless attention. Its driver began to (redden). This was no place to (careen) around children. A (jovial) volunteer tried to (liven) the atmosphere until he noticed the captain wasn't smiling. Noor was not on the (warpath). He wanted confusion to remain something less than injury.", "zh": "一辆车以(危险的高速)冲来，停下后迎上船长无言的目光。司机开始(脸红)。这里不能在孩子间(横冲直撞)。一位(快活的)志愿者想讲笑话(活跃)气氛，直到发现船长没有笑。努尔不是要(大动干戈)，只是想让混乱别升级成伤害。"}, {"en": "A model (galleon) blocked the gangway. Its owner, a retired (barman), insisted it was culturally significant. Its sails could (unfurl), its cannon fired (confetti), and its paintwork would (astonish) collectors. Noor asked whether it floated. The man was taken (aback). “That's not the point.” Noor requested removal of the mast. The resulting (groan) sounded like a (sepulchral) bell. A fresh (dink) in the paint nearly caused an international incident. Nearby, a real boat tilted on its (keel), explaining why they were leaving.", "zh": "一艘(大帆船)模型堵住跳板。主人是退休(酒保)，坚持说它具有文化价值：船帆能(展开)，炮能发射(彩纸屑)，漆工足以让收藏家(惊叹)。船长问它能漂吗。对方(大吃一惊)。“重点不是这个。”船长请他拆下桅杆，那声(呻吟)像(坟墓般阴沉的)钟声。新出现的一处漆面(小凹损)几乎引发国际事件。旁边，一条真船歪在(龙骨)上，解释着他们为何必须离开。"}, {"en": "After a (perusal) of the cargo list, Mina found the teacher beside a (sackful) of drawings. Miss Penn was a (disciplinarian) whose almost (paternal) concern sometimes exceeded her patience. She carried a (ream) of forms and a (pocketful) of confiscated marbles. A boy with one long (dreadlock) wanted to bring a rusty (javelin). His friend brought a (drumstick), although nobody owned a drum. Penn ordered the weapon put down (forthwith), then told the second boy to stop tapping.", "zh": "(仔细看过)货单，米娜在一(大袋)画旁找到老师。佩恩是位(严师)，近乎(父亲般的)关怀有时超过耐心。她拿着一(令)表格，口袋有(满满一袋)没收的弹珠。一个留着长(脏辫)的男孩想带生锈的(标枪)，朋友拿着(鼓槌)，虽然没人有鼓。老师令前者(立即)放下武器，再叫后者停止敲打。"}, {"en": "He was Leo, her self-appointed (sidekick). His latest (contraption) combined a trolley and a kite. It could (propel) him downhill, though steering depended on luck. Penn repeated her (admonition) for the (umpteenth) time: no experiments near vehicles. Leo considered this an (insinuation) that his design was incomplete. It was, but that wasn't the main objection.", "zh": "他叫利奥，自封老师的(小助手)。最新(奇怪装置)结合购物车和风筝，据说能把他(推进)下坡，转向却靠运气。老师第(无数)次重复(告诫)：车旁不许实验。利奥认为这是(暗示)他的设计不完善。确实如此，但不是主要问题。"}, {"en": "The children prepared a farewell (procession), wearing paper hats, a (garish) (wreath), and enough (tinsel) to (bedeck) a shop. One played a (warlock), another a (basilisk), and another a (ghoul) capable of an excellent (mewl). Their final (recital) was supposed to (hearten) parents, although the rehearsal's (commotion) hindered thought. Mina doubted a six-year-old (hangman) would improve morale. Penn removed a line promising to (disembowel) a dragon. The morning had enough threats.", "zh": "孩子准备告别(游行)，戴纸帽、(花哨的)(花环)，以及足以(装饰)一家商店的(金银彩条)。有人扮(男巫)，有人扮(蛇怪)，还有个(食尸鬼)擅长发出(呜咽)。最后的(表演)本想(鼓舞)父母，排练的(喧闹)却妨碍思考。米娜怀疑六岁(刽子手)能否改善心情。老师删掉了要给龙(开膛破肚)的台词：今天的威胁已经够多。"}, {"en": "The school contained a (hunchback) puppet, a wooden (gibbon), and a plaster (baboon) with a broken (beak) attached. The cupboard had never respected zoology. A sea-king costume resembled an (apparition); its (swollen) eyes and (misshapen) crown once left an inspector (dumbstruck). A (loincloth), an (elfin) cap, and a (shamrock) badge lay beside a (horseman)'s costume. The inventory labelled one missing head “(nonhuman)”. Mina wondered whether it would (enthral) a historian or (frighten) a warehouse manager.", "zh": "学校有(驼背)木偶、木雕(长臂猿)，以及莫名装着断(鸟喙)的石膏(狒狒)。道具柜从不尊重动物学。海王服装像(幽灵)，(肿大的)眼睛和(畸形的)王冠曾让检查员(目瞪口呆)。(腰布)、(精灵式)帽子、(三叶草)徽章堆在(骑士)戏服旁。清单把一颗失踪的头标作“(非人类)”。米娜想，这会让历史学家(着迷)，还是让库管员(害怕)？"}, {"en": "Deputy Mayor Fenn arrived in a (mannish) coat with a (frill). Once called (fanatical) for demanding sea-wall repairs, she was now accused of enjoying the village's (downfall). She listened (noncommittal) while a fisherman delivered an (imprecation) involving “mainland (minion)”. Mina expected a (wrathful) reply. Instead, Fenn lifted his chair. Politics had taught her that (sarcasm) was lighter than furniture and less useful.", "zh": "副镇长芬恩穿着领口带(褶边)的(男式)外套到来。她曾因坚持修海堤被叫作(狂热者)，如今又被指享受村庄的(败落)。她(不置可否)地听渔民用“大陆的(走狗)”之类词语(咒骂)。米娜以为她会(暴怒)，她却帮忙抬椅子。政治教会她，(讽刺)比家具轻，也通常更没用。"}, {"en": "He insisted the mainland was a (pestilential) (pigpen). Fenn refused to (bludgeon) him with statistics. He was expressing (apprehension), not geography. His new house, she explained, had a ground-floor bedroom. That interrupted his (interrogation) long enough to move another box.", "zh": "渔民坚持说大陆是(瘟疫般恶臭的)(猪圈)。芬恩没有拿统计数字(猛砸)他。他表达的是(忧虑)，不是地理判断。她说，新家一楼就有卧室。这细节让他的(盘问)暂停，够她再搬个箱子。"}, {"en": "Ruth arrived dragging a (trowel), carrying a (pail). Mina allowed herself an (infinitesimal) hope that packing was finished. Then she saw the (shovel). Ruth intended to move her apple tree, planted by her husband on their wedding day. Its (blossom), she said, was better than any memorial (inscription). This was an unanticipated (complication). Mina stood (thunderstruck) while Ruth requested that she (kneel) and uncover the roots.", "zh": "露丝拖着(小铲)，提着(水桶)来了。米娜生出(极其微小的)希望，以为打包完了，随后看见(铁锹)。祖母打算搬走结婚那天丈夫种的苹果树。她说，它的(花朵)胜过任何纪念(铭文)。这是谁都没料到的(难题)。米娜(震惊得说不出话)，露丝则叫她(跪下)帮挖树根。"}, {"en": "The tree stood on a (hillock), surrounded by (bluebell), (daffodil), and a determined (dandelion). Beyond it, (bracken) merged into (undergrowth), where a (quail) hid. The garden held (asphodel) and labelled (savin), kept away from children. A (hornbeam) had grown around wire, forming a (gnarl). Everything seemed attached to where it belonged.", "zh": "树长在(小土丘)，周围有(蓝铃花)、(水仙)和顽强的(蒲公英)。更远处，(蕨丛)融进(灌木下层植被)，藏着(鹌鹑)。花园还有(日光兰)，以及贴标签、远离孩子的(沙地柏)。一株(鹅耳枥)绕着铁丝生长，形成(树瘤)。一切都牢牢连着自己的归处。"}, {"en": "A marker showed the next expected marine (incursion). Water would eventually (teem) with creatures needing no orchard. Mina disliked knowing that one landscape's destruction allowed another to (burgeon). The sea was neither a (crook) nor a rescuer. It favoured neither the (downtrodden) nor their (toil).", "zh": "标记显示下一次海水(侵入)的范围。那里终会(充满)不需要果园的生物。米娜不喜欢想到：一种景观的毁灭，让另一种(蓬勃发展)。大海既非(骗子)也非救星，不偏袒(受苦的人)，也不尊重他们的(劳作)。"}, {"en": "“The whole tree cannot go.” Ruth kept digging. A (torrential) shower turned the ground to (muck). Mina felt the wind (dishevel) her hair beneath her hood. Ruth's hands began to (stiffen); her (rheumatism) had worsened, though she would rather (perish) than admit it. Mina reached for the tool. Ruth gave it a (yank), striking Mina's arm and leaving a (weal). Both stopped. The possibility that a tool could (maim) had become suddenly (corporeal).", "zh": "“整棵树带不走。”露丝继续挖。(倾盆的)雨把地面变成(烂泥)，风把米娜兜帽下的头发(吹乱)。露丝的手开始(僵硬)，(风湿病)加重了，她却宁愿(死去)也不肯承认。米娜伸手拿工具，露丝猛地(一拉)，击中孙女手臂，留下(红肿条痕)。两人停住。工具可能(伤残)人的事实，忽然变得(有形可触)。"}, {"en": "A year of (unspoken) worry had become a physical (chasm). Ruth looked (stricken). “I didn't mean—” Mina nodded. A drop fell from her sleeve with a (plunk); a gull gave a (squawk). The absurdity did not (lighten) anything. “I know.” Calling it an (overreaction) would only (deaden) the apology. Neither wanted the other hurt. That fact had to survive.", "zh": "一年来(没有说出口的)忧虑变成了一道真实(鸿沟)。露丝(痛苦不堪)。“我不是想——”米娜点头。水滴从袖口(啪嗒落下)，海鸥(嘎叫)。荒唐并没有(减轻)痛苦。“我知道。”称其为(反应过度)，只会(削弱)道歉。她们都不想伤害对方，这个事实必须活过争执。"}, {"en": "They sat on a wet bench. Ruth began to (bemoan) the move without enough strength to sound angry. Her husband had (lain) beneath the tree during his final summer. When breathing troubled him, she would (croon) an old song. The tree had witnessed tenderness they rarely expressed. She could not (fathom) leaving it to salt water. Mina had known the facts, not their meaning.", "zh": "她们坐在湿凳上。露丝开始(哀叹)搬家，已无力愤怒。丈夫最后一个夏天曾(躺)在树下；他呼吸难受时，她会(轻哼)老歌。树见证了他们少说出口的温柔。她无法(理解并接受)把它留给盐水。米娜知道事实，却不知道意义。"}, {"en": "Ruth touched the handle as though it might restore his (footfall). “He never did things at the proper time.” Her voice held an unfamiliar (inflection): affection without a protective joke. The (recollection) quietened her. It wasn't theatrical (adoration), only the daily attachment whose absence she could never (accustom) herself to.", "zh": "露丝摸着锹柄，仿佛能找回丈夫的(脚步声)。“他从不在该做的时候做事。”声音里有米娜陌生的(语调变化)：没有笑话遮护的亲昵。(回忆)让她安静。这不是戏剧化的(崇拜)，只是日常依恋，而她始终无法让自己(习惯)那份缺席。"}, {"en": "Mr Ives approached with a (flask) and a (bonbon). The accepted village (oddball), he wore a (cardigan) year-round and discussed roots until listeners became (glum). He examined the tree. “We don't need all of it.” Mina expected something (fanciful). He produced a grafting knife, precise as a (scalpel). Healthy cuttings could be grafted onto new rootstock. The original would remain, but its variety could (flourish) elsewhere.", "zh": "艾夫斯先生拿着(保温瓶)和一颗(糖果)过来。他是公认的(怪人)，终年穿(开衫)，谈根系能谈得听众(闷闷不乐)。他检查树：“不用全带走。”米娜以为又是(异想天开)。他拿出几乎和(手术刀)一样精细的嫁接刀。健康枝条可以嫁接新砧木，原树留着，品种却能在别处(繁盛)。"}, {"en": "Ruth listened with (mistrustful) concentration. Would it really be the same tree? Ives refused a comforting (delusion). It would be a new tree from the old, requiring care. Cuttings might (shrivel); some might fail. Gardening wasn't (divination). But it offered a better chance than uprooting a mature tree in rain. Mina watched (realisation) replace desperate (fixation): preserving something differed from refusing to (relinquish) anything.", "zh": "露丝(怀疑地)听着：那真是同一棵吗？艾夫斯拒绝给予安慰性的(幻想)。它是来自旧树的新树，需要照顾；枝条可能(干枯)，也可能失败。园艺不是(占卜)，但胜算高于在雨里拔走成年树。米娜看见(领悟)取代绝望的(执念)：保存某种东西，不等于拒绝(放下)任何东西。"}, {"en": "They cut several shoots. Ives removed a (fleck) of bark and inspected a (pockmark). There was no serious (infestation). Healthy wood gave a pale (gleam), and rain made buds (glisten). Ruth gathered a (fistful) of paper around them and held one cutting to her (bosom). Her face showed neither (jubilation) nor defeat. “Your grandfather would call it cheating. Then he'd help.” A small (consolation) remained worth having.", "zh": "他们剪了几根枝。艾夫斯去掉一小(片)树皮，检查一个(凹点)，没有严重(虫害)。健康木质透出淡淡(光泽)，雨让芽点(闪亮)。露丝用一(把)纸包好，把一根抱在(胸前)。她脸上既没有(狂喜)也没有认输。“你祖父会说这算作弊，然后来帮忙。”微小的(慰藉)仍值得接受。"}, {"en": "At noon, the loading ramp reached a (standstill). Someone brought a stone (birdbath); another insisted a concrete (plinth) was an heirloom. A (vandal) sprayed farewell across the harbour wall. The mayor wanted it removed before reporters arrived. Noor suggested municipal (indignation) wait. A blocked ramp presented more immediate (peril).", "zh": "中午，装船坡道陷入(停顿)。有人带来石(鸟浴盆)，另一人坚持混凝土(底座)是传家宝。一名(破坏公物者)在码头墙上喷了告别语，镇长想在记者来前清除。努尔说，市政的(愤慨)可以等，堵塞坡道是更直接的(危险)。"}, {"en": "Mina called the transport office from a (nook). Records of assistance needs were (uneven). One form seemed to (pertain) to a family already gone. She corrected it and added another name. People could fall (afoul) of systems without malice. Good intentions did not carry luggage.", "zh": "米娜躲在(角落)给运输办公室打电话。协助需求记录(参差不齐)，一张表似乎(涉及)早已离开的家庭。她纠正、补名。即便没有恶意，人也可能与系统(发生冲突)。好意搬不了行李。"}, {"en": "The stone basin belonged to a butcher who considered refusal a (provocation). His breath suggested his (hipflask) was nearly empty. Weight limits became accusations of (favoritism), then threats of a (brawl). “People before stone,” Noor said. The butcher attempted a (headlock) on his laughing brother. It was (comical) and (pitiful). Mina and Fenn intervened.", "zh": "石盆属于退休屠夫，他把拒绝当成(挑衅)。呼吸说明(随身酒壶)快空了。限重演变为(偏袒)指控，再变成(斗殴)威胁。“人比石头重要。”努尔说。屠夫想给发笑的兄弟来个(锁头)，动作既(滑稽)又(可怜)。米娜和芬恩分开他们。"}, {"en": "A reporter approached, (agleam) with interest. One photograph could make this (ordeal) look like a riot. Nobody had gone (berserk), despite a broadcast calling villagers (hysterical). Fenn requested that he (abstain) from filming children. He protested that disorder was news. “Include the people preventing it.” There was (fraternisation) and help here, too. A lens could distort merely by choosing where to point.", "zh": "记者眼中(闪着光)走近。一张照片就能把这场(磨难)拍成暴乱。没人(发狂)，尽管广播已称村民(歇斯底里)。芬恩请他(避免)拍孩子。他说混乱是新闻。“那也拍阻止混乱的人。”这里同样有(友善交往)和帮助，镜头只需选择方向，就能失真。"}, {"en": "A child began to (bawl), another to (snivel), and the dog to (howl). Its owner offered a (morsel) of (salami), immediately accepted. Human negotiations were harder. A woman gave a (disdainful) (snarl) at anyone near her wardrobe. A man wanted to (ransack) every van for his (haversack). A (scrum) formed by the scales. The harbour approached (bedlam), because every object seemed to contain the life its owner feared losing.", "zh": "一个孩子(嚎哭)，一个(抽噎)，狗也(长嚎)。主人递上一(小口)(萨拉米香肠)，立刻奏效。人与人更难商量。女人对靠近衣柜的人发出(轻蔑的)(咆哮)，男人要为失踪的(帆布背包)(翻遍)所有货车。秤旁形成(争抢的人堆)。码头接近(疯人院般的混乱)，因为每件物品似乎都装着主人害怕失去的人生。"}, {"en": "A youth jokingly tried to (frisk) another, provoking an accusation of (intimidation). Someone shouted “(hoodlum)”. The rise towards (pandemonium) reflected nerves, not criminality. Mina climbed a crate. She explained what could travel, what would follow, and what must remain. Promising universal safety was (guesswork); she would not do it. A (doleful) silence followed. Then Penn helped dismantle the wardrobe. Cooperation returned. The brothers began to (slink) away to carry their mother's bags. The (lull) was temporary. Mina had to (reckon) with fatigue as carefully as cargo.", "zh": "青年开玩笑地(搜身)，引来(恐吓)指控。有人喊“(小流氓)”。越来越接近(大混乱)，反映的是紧绷而非犯罪。米娜爬上箱子，解释哪些现在走、哪些后续走、哪些必须留。保证一切安全只是(猜测)，她不作保证。(悲伤的)沉默后，佩恩开始帮拆衣柜。合作回来，兄弟俩(悄悄溜开)搬母亲的袋子。(平静间歇)只是暂时的；米娜必须像计算货物一样(考虑)疲劳。"}, {"en": "The children performed. A girl with a (pigtail) delivered an (incantation) promising the island would never vanish. A boy dressed as a (yeoman) gave a (boastful) speech. The wizard attempted a (cartwheel), hit a chair, and landed on his (buttock). His (gleeful) audience applauded. A paper (jackal) lost its jaw; a cardboard (windmill) stopped. Leo's (pyrotechnical) finale produced a (swoosh), paper stars, and a (squeal). Nothing burned. Penn looked (awestruck). She hadn't wanted to (christen) the ferry with fire.", "zh": "孩子表演了。扎(辫子)的女孩念着岛永不消失的(咒语)，扮(自耕农)的男孩发表(自夸的)演说。小巫师翻(侧手翻)，撞椅子，(屁股)落地。(欢快的)观众鼓掌。纸(胡狼)掉了下巴，纸板(风车)停转。利奥的(烟火技术)结尾发出(嗖声)，喷出纸星星和一声(尖叫)。没着火，佩恩(惊叹不已)。她不想用火给渡轮(命名洗礼)。"}, {"en": "A man called the wizard a (buffoon). His wife said everyone needed foolishness. A leaving island required more than (trepidation). Children deserved something remembered as a (lark), not merely adults packing grief. Ruth laughed. Mina had forgotten her capacity for (mirth). A boy began to (twirl) a banner; a girl produced a (tuneful) (trill). Parents who had discussed (devastation) for months watched with tired (admiration). A performance couldn't rebuild a wall. It could make leaving more than administration.", "zh": "有人叫小巫师(小丑)，妻子说大家都需要傻一会儿。离别的岛不只需要(惶恐)，孩子值得记住一次(嬉闹)，而不只是成人把悲伤装箱。露丝笑了，米娜才想起她有多少(欢乐)。男孩(旋转)旗帜，女孩吹出(悦耳的)(颤音)。讨论了数月(毁灭)的父母，疲惫地(赞赏)着。演出重建不了海墙，却能让告别不只是行政程序。"}, {"en": "Lunch included (haddock) sandwiches, boiled (whelk), (chilli), and a (muffin) for each child. One cook tried to (replenish) tea; another rescued a (saucepan) from an edge. Soap began to (froth) in a bowl. Somebody suggested seawater to (swill) plates; the cook said it would (befoul) them. Disaster still required distinguishing cleaning from worsening things.", "zh": "午餐有(黑线鳕)三明治、煮(峨螺)、(辣椒炖菜)，每个孩子一块(松饼)。厨师(补充)茶，另一人从边缘救下(平底锅)。肥皂在盆里(起泡)。有人提议用海水(涮洗)盘子，厨师说那会(弄脏)它。灾难也需要分清清洁与恶化。"}, {"en": "Beside a roast (loin), gravy began to (congeal). A gull tried to (skim) it. The cook's (dustpan) proved an effective shield. A (swarm) of flies attracted one child's (revulsion) and another's interest. A teenager offered to (siphon) remaining water into bottles. Useful work could (dampen) panic better than orders to be calm.", "zh": "烤(腰肉)旁的肉汁开始(凝结)，海鸥想(掠取)表面。厨师的(簸箕)成了盾牌。一(群)苍蝇让一个孩子(厌恶)，另一个好奇。少年提议把余水(虹吸)进瓶。有用的工作，比命令人镇静更能(减弱)恐慌。"}, {"en": "Mina ate standing. A neck (crick) had become an (affliction); her eyes felt (feverish). The morning's (whirl) made her wish time would stop or (hasten). Asked by telephone whether progress was satisfactory, she replied, “Define satisfactory,” more (snappish) than intended. An (abysmal) answer about targets followed. She watched Ruth share food with a child. Some measures of progress deserved to remain unofficial.", "zh": "米娜站着吃，脖子的(抽痛)成了持续(折磨)，眼睛(发热)。一上午的(忙乱)让她盼时间停下或(加快)。电话问进展是否满意，她比预想更(急躁)：“定义一下满意。”对方给了个关于目标的(糟糕透顶的)回答。她看见露丝给孩子分食物。有些进步指标不适合写进官方表格。"}, {"en": "Diesel fumes rose from the slipway, strong enough to (sicken). A line of (scum) marked the water. Mina pressed a (nostril) shut and breathed through her mouth. The harbour wasn't conspiring to (irk) her. Fatigue could turn any inconvenience into a personal attack, and she had seen where that led.", "zh": "柴油味浓得(令人恶心)，水面有(浮渣)。米娜压住一个(鼻孔)，用嘴呼吸。码头并非专门要(惹恼)她。疲劳能把任何不便变成人身冒犯，她已见过后果。"}, {"en": "At two, an announcement caused (consternation). The mainland road was flooded; the ferry would use another dock, followed by buses. A wave of (desperation) crossed the queue. Small on a map, the change overwhelmed people who had exhausted their tolerance for uncertainty. A fisherman called the plan a (sham); his wife began to (wail). Another (repercussion) could matter more than the original disaster. Mina's (preoccupation) with loading nearly blinded her to that. She lowered her clipboard and listened.", "zh": "两点，通知引发(惊慌)。大陆道路积水，要换码头再坐巴士。(绝望)掠过队伍。地图上小小的改变，压垮了不堪更多不确定性的人。渔民称计划为(骗局)，妻子开始(哭号)。又一个(连锁后果)可能比最初灾害更难受。米娜对装船的(专注牵挂)差点遮住这点，她放下夹板倾听。"}, {"en": "Noor drew the route. The dock had shelter, toilets, and level access. Nobody would wait on a pavement. Specific, not (sensational), the explanation helped (dispel) rumours. He confirmed wheelchair space and wrote down a passenger's name. Trust began with a particular answer. A child's scarf made a (swish) against the board. Would monsters (loom) under the new dock? Probably crabs, Noor said. The answer disappointed the boy and relieved his mother.", "zh": "努尔画路线：新码头有棚、厕所、平路，没人要站在人行道等。解释具体，而非(耸人听闻)，帮忙(驱散)谣言。他确认轮椅位，记下乘客名字。信任始于具体回答。孩子的围巾(沙沙擦过)黑板，问怪物会不会在码头下(隐隐出现)。大概有螃蟹，船长说。男孩失望，母亲放心。"}, {"en": "The mayor requested Ruth for the cameras: the oldest resident, leaving with dignity. “She isn't a (talisman),” Mina said. His (roguish) smile and talk of morale were pure (smarm). She wanted to (hurl) the clipboard into the water. Instead, her refusal was (tactful) and absolute. She needn't vent her (spleen) at someone doing his job badly. He had the (gall) to call her unhelpful. Her jaw began to (tauten); she let it (slacken). Another fight wouldn't improve the crossing.", "zh": "镇长想让露丝出镜，表现最年长者体面离开。“她不是(护身符)。”米娜说。他(狡黠的)笑和士气之谈全是(谄媚油滑)，让她想把夹板(扔进)海里。她却给了个(得体)而绝对的拒绝，没必要向办事差的人倾泻(怒气)。他竟有(厚脸皮)说她不合作。她的下巴(绷紧)，又让它(放松)。再争吵也改善不了航程。"}, {"en": "Ruth overheard and offered to speak, in her own words. The cameraman asked her to look positive. Her (jowl) tightened. “You can (zoom) out if my face bothers you.” She described the house, the tree, the ignored warnings. “This isn't magical (transfiguration). A new address doesn't turn grief into gratitude.” She would not (proclaim) victory or pretend denial could defeat the sea.", "zh": "露丝听见后同意说，但要说自己的话。摄影师请她积极一点，她的(下颌)绷紧。“嫌我的脸，你可以把镜头(拉远)。”她讲房子、树、被忽视的警告。“这不是神奇的(变形升华)。换地址不会把悲伤变感激。”她不(宣布)胜利，也不假装否认能战胜海。"}, {"en": "“We are going. That doesn't mean this was done well.” The mayor looked (crestfallen). Her words were (outspoken), angry, and accurate. They would probably (tarnish) a report. They might make the next village's experience less (woeful). The cameraman thanked her without requesting another take.", "zh": "“我们会走，但这不代表事情办得好。”镇长(垂头丧气)。她的话(直言不讳)、愤怒、准确，可能会(玷损)某份报告，也可能让下一个村庄少些(悲惨)。摄影师道谢，没有重拍。"}, {"en": "At three, people began to (embark). A (foal), travelling with a (roan) mare from the same (paddock), resisted until its handler loosened the (rein). A (fowl) escaped and gave a furious (cluck). Penn stopped two pursuing children. They didn't need poultry running (amok). Ives caught the bird beneath a coat and received a sharp (prick) for his trouble.", "zh": "三点，人们(登船)。(小马驹)与同一(围场)的(杂色)母马同行，直到牵马人放松(缰绳)才肯上坡。一只(家禽)逃出，愤怒地(咯咯叫)。佩恩制止追赶的孩子，不需要鸡再(横冲直撞)。艾夫斯用外套捉住它，挨了一下尖锐的(刺啄)。"}, {"en": "A dog gave a (growl); a cat answered with a (yowl). Their owner tried to calm both while shifting a bag. A (bloodstain) marked his collar: he had bitten his lip lifting furniture. The scene looked worse than it was, a useful reminder before another exaggerated report.", "zh": "狗(低吼)，篮中猫(厉声叫)。主人边搬袋子边安抚。衣领的(血迹)来自他搬家具时咬破嘴唇。场面比实际糟，这提醒大家别急着写夸张报道。"}, {"en": "Ruth returned home once. The kitchen was (dank), its empty walls larger. A (footstool) stood by the cold (hearth); the (bellpull) hung motionless. She found a photograph and a brass key. It no longer opened anything she needed, but she pocketed it. Mina didn't ask her to justify something weighing almost nothing.", "zh": "露丝最后回家一次。厨房(阴湿)，空墙显得更大。(脚凳)挨着冷(壁炉)，(拉铃绳)一动不动。她找到照片和黄铜钥匙。钥匙已不开任何需要的门，她还是收进口袋。米娜不要求她解释几乎无重量的东西。"}, {"en": "Ruth checked a lamp whose (wick) had been dry for weeks, then touched a pencilled height mark: Mina, aged nine. She closed the drawer. Neither spoke of (oblivion). A place could remain vivid when its rooms became unreachable.", "zh": "露丝检查了(灯芯)已干数周的灯，摸着门边铅笔身高记号：米娜，九岁。她关抽屉。两人都不谈(遗忘)。房间无法再去，地方仍能鲜明地存在。"}, {"en": "Outside, a final (peal) came from the church. Wind began to (pummel) the hedge. A gull's (shrill) call crossed the garden; the apple branches turned silver. Mina felt a (premonition) that this scene would outlast forms and arguments in memory. Ruth's coat billowed. “Come on.” Her decision was (purposeful), and Mina followed.", "zh": "外面，教堂最后一阵(钟鸣)。风(猛击)树篱，海鸥(尖锐的)叫声穿过花园，苹果枝泛银。米娜有种(预感)，这一幕会比表格争执留得更久。露丝衣服鼓起。“走吧。”决定(坚定有目的)，米娜跟上。"}, {"en": "On the slippery ramp, Ruth caught her shoe and began to (flail). Mina caught her. A (paroxysm) of fear passed. A medic checked for a (sprain): none, only a sore (toenail). Ruth called everyone dramatic. Noor looked (quizzical). “We prefer passengers attached to the ship.” A (dreadful) joke, but useful. Mina laughed with an (exhaustion) that resembled tears.", "zh": "滑坡上，露丝绊住，开始(挥动四肢失衡)。米娜接住她，一阵(剧烈发作的)恐惧过去。医护检查(扭伤)：没有，只是(脚趾甲)疼。露丝说大家小题大做。努尔(疑问般)看她：“我们比较喜欢乘客待在船上。”(糟透的)笑话，却管用。米娜(疲惫)地笑，像要哭。"}, {"en": "The engine gave a (clunk), a spoon a (clink). Water began to (slosh) against the hull. A boy tried to (dunk) a biscuit, producing a sticky (squish). A baby began to (drool) onto its father's coat. Another boy would (squirm) and (moan) about hunger. The father looked (sullen), then smiled when the baby caught his finger. Ordinary life had boarded already.", "zh": "发动机(哐当)，勺子(叮当)，水(晃荡)着拍船。男孩把饼干(浸入)茶，弄出黏黏的(挤压声)。婴儿在父亲衣上(流口水)，另一个男孩(扭来扭去)、(抱怨呻吟)着饿。父亲(阴沉)，被婴儿抓住手指后又笑了。普通生活已经上船。"}, {"en": "A deckhand began to (uncoil) rope. Another moved people clear: a tightening line could (whack) an ankle. This (precaution) needed no drama. Mina watched the last line fall, a (fateful) movement performed by someone who did it daily.", "zh": "船员开始(解开盘绕的)绳，另一人清场：绷紧的绳能(猛打)脚踝。这种(预防措施)不需要戏剧性。最后一根缆绳落下，是个(决定命运的)动作，却由每天都做的人完成。"}, {"en": "The ferry departed with a (whoosh). Its wake made a white (swirl); spray scattered in the (slipstream). Onshore, the flag began to (furl) around its pole. Mina expected a dramatic (swoon) of grief. Ruth merely asked whether the cuttings were upright. They were. Mina's eyes began to (brim). Ruth squeezed her hand without comment.", "zh": "渡轮带着(呼的一声)离开，白色尾流(旋涡)在后，水花散入(尾流气流)。岸上旗帜开始绕杆(卷起)。米娜以为会有悲伤的(昏眩)，露丝却只问枝条竖着吗。是的。米娜眼里开始(盈满)泪水，露丝默默握住她的手。"}, {"en": "A boy asked whether ghosts would remain. Ruth said even empty villages needed caretakers. Mina left this thought unchallenged: comfort wasn't policy. The boy imagined a ghost with a broom, then a (reptilian) king living in the school. Imagination helped them bear what couldn't yet be explained.", "zh": "男孩问鬼会留下吗。露丝说，空村也需要看守。米娜不反驳，安慰不是政策。男孩想象拿扫帚的鬼，又想象住进学校的(爬行动物般的)国王。想象帮他们承担还不能解释的事。"}, {"en": "The sea made passengers (recoil) from windows. A (sweetish) smell didn't help. Mina saw a woman's (complexion) turn (ashen) and offered a bag. Another passenger's (regurgitation) made everyone look away. Below, a (temperamental) pump complained. Asked what might (ail) it, the engineer declined to guess. He inspected and fixed it. The noise was mechanical, not prophetic.", "zh": "海浪让乘客从窗边(退缩)，(微甜的)气味毫无帮助。米娜看见女人的(脸色)变得(灰白)，递了袋子。另一人的(呕吐)让大家望向别处。下面，(脾气多变的)水泵开始抱怨。问它可能(有什么毛病)，工程师不猜，检查后修好。声音是机械的，不是预言。"}, {"en": "A wave gave the hull a (smack). A child began to (gawk), while his brother announced they would sink. Penn stopped him with a look. They needed no invented (infernal) voyage. Rough water didn't prove that every possible disaster would (befall) them.", "zh": "浪给船一(巴掌)，孩子(呆看)，哥哥说要沉。佩恩用眼神制止。无需编造(地狱般的)航程，浪大不意味着所有灾难都会(降临)。"}, {"en": "Ruth slept, her usually (watchful) face softening. Mina wondered what had taught her to equate surrender with death. War, poverty, a mother saving every (speck) of flour? History could (constrain) someone without announcing itself. Leaving required Ruth to argue with more than the government.", "zh": "露丝睡了，平常(警觉的)脸柔和下来。米娜想，是什么教她把让步等同死亡？战争、贫穷、连一(点)面粉都存下的母亲？历史能不声不响地(束缚)人。离岛要求露丝争论的，不只是政府。"}, {"en": "A fisherman began to (retell) a storm story involving lost trousers. A teenager gave a (catcall); Penn gave him a look. Someone sang. It was a rough (rendition), full of wrong notes, but the melody rose in an (unbroken) line. Ruth opened her eyes and supplied the forgotten words.", "zh": "渔民开始(重讲)风暴扯掉裤子的故事。少年发出(起哄声)，老师瞪他。有人唱歌，(演唱)粗糙，错音不少，旋律却连成(不断的)线。露丝睁眼，补上别人忘掉的歌词。"}, {"en": "At the dock, volunteers offered maps and dry socks without banners. The lack of ceremony felt (merciful). Families could (disembark) without performing gratitude. Practical help required no spectacle of suffering.", "zh": "码头志愿者递地图和干袜，没有横幅。没有仪式感显得(仁慈)。居民可以(下船)，不必表演感恩。实际帮助不需要痛苦的奇观。"}, {"en": "A volunteer's (drawl) made Ruth lean forward. “Tea first.” She approved. A child instantly claimed an elaborate pink (confection). Small decisions could remain (uneventful). Today, that was luxury.", "zh": "一个志愿者的(拖长语调)让露丝凑近。“先喝茶。”她赞同。孩子抢到一块精致的粉色(甜食)。小决定还能(平平无事)，今天这就是奢侈。"}, {"en": "The temporary building's (multilevel) layout confused everyone. One resident called it a (hovel), another the carpet (phenomenal). Children found a broken (carousel) toy. An old man announced he could (loll) in his chair until Christmas. Mina tried to (unravel) a surname mix-up. By (nightfall), even an (eventful) day had to yield to supper. Someone complained about the carpet's (stink), another wanted to (preen) for a photograph, and a toddler tried to (sprawl) across three seats. Manageable problems.", "zh": "临时住处的(多层)布局让人迷路。有人叫它(破屋)，有人夸地毯(好得惊人)。孩子找到坏掉的(旋转木马)玩具，老人说可以在椅子里(懒躺)到圣诞节。米娜忙着(理清)同姓混淆。到(夜幕降临)，再(多事的)一天也得让位晚餐。有人嫌地毯(臭)，有人要拍照前(梳妆打扮)，幼童想(摊开身体占住)三把椅子。这些问题，能处理。"}, {"en": "Ruth inspected her room with a (dismal) face. “No sea.” Then: “No stairs either.” A (leaden) (gloom) lifted slightly. Not acceptance, but observation. They put the cuttings by the window. Ives promised pots. Nobody guaranteed growth. Nobody pretended otherwise.", "zh": "露丝(阴郁)地看房。“没有海。”随后：“也没有楼梯。”(沉重的)(阴霾)散去一点。不是接受，是观察。枝条放窗边，艾夫斯答应找花盆。没人保证成长，没人再假装。"}, {"en": "An official message asked Mina to call the evacuation a successful transition. She deleted her first answer, containing an (allusion) to flying pigs. She couldn't (vanquish) official language with anger, but could refuse to repeat it. Her report described delays, the ramp, and useful assistance. It requested space for trees. This was not decoration, but part of continuing to live.", "zh": "官方请米娜称撤离为成功转型。她删掉第一稿，里面(暗指)了猪会飞。她无法用愤怒(战胜)官话，却能拒绝复述。报告写延误、坡道、有用援助，也要求种树空间。这不是装饰，而是继续生活的一部分。"}, {"en": "She named those who helped unasked. Reports could become weapons of (aspersion) or records of what worked. She chose the latter. The day contained failures and extraordinary effort; neither cancelled the other.", "zh": "她记下自发帮忙者。报告能成为(诋毁)武器，也能记住有效行动。她选后者。失败和非凡努力同在，不能相互抵销。"}, {"en": "Ruth produced the brass key. “Your grandfather wanted to (bequeath) you the house. I suppose this remains.” Mina held it. She wouldn't call it enough. She would keep it. The metal seemed to (reawaken) the kitchen's smell without permission.", "zh": "露丝拿出钥匙。“你祖父想把房子(遗赠)给你，看来只剩这个。”米娜握着，不会说足够，却会留着。金属仿佛不经许可地(重新唤醒)了厨房气味。"}, {"en": "Over the following weeks, residents began to (bask) in the garden or (roam) nearby streets. Ruth learned the buses, argued with a shopkeeper, and acquired a difficult reputation before anyone could pity her. She wouldn't spend retirement in a (sulk), or permit anyone to call her anger (delusional). “I can dislike it and learn the bus route.”", "zh": "几周后，居民开始在花园(晒太阳)，或在附近(漫步)。露丝学巴士路线，和店主争论，赶在人们怜悯前就有了难相处的名声。她不会一直(生闷气)，也不许人称愤怒为(妄想)。“我可以不喜欢，同时学会坐车。”"}, {"en": "After early (stagnation), Wednesday meetings considered a workshop and school garden. One man wanted to (repel) every official suggestion. Ruth said resistance wasn't a substitute for thought. They couldn't (pinion) their future to their worst day. She didn't pretend to have mastered that lesson herself.", "zh": "早期(停滞)后，周三聚会讨论工坊和学校花园。一人原则上要(抵制)所有官方建议。露丝说，抵抗不能代替思考。他们不能把未来(束缚)在最糟的一天。她没假装自己已经学会这课。"}, {"en": "The cuttings wintered in a protected bed. In spring, one bud opened. Ruth called Mina: no (bombshell) could sound more urgent. Her (exclamation) brought neighbours, one beginning to (exclaim) as though at a birth. A tiny leaf didn't repair the coast. It gave them tomorrow's task. Ruth announced that (henceforth), anyone calling it merely a stick would answer to her. Ives promised not to (deform) its growth with excessive wire or fuss.", "zh": "枝条在保护地越冬，春天一个芽开了。露丝来电，任何(爆炸性消息)都没这么急。她的(惊叹)引来邻居，有人开始(惊呼)，像迎接出生。小叶修不了海岸，却给了明天任务。露丝宣布，(从今以后)谁再说它只是棍子就要找她理论。艾夫斯保证，不会用过多铁丝或照料把它(弄畸形)。"}, {"en": "Mina brought a camera. Ruth refused to pose and requested a watering can. The new leaves trembled. Behind them, residents argued about benches. Mina listened, smiled, and went to fetch the water.", "zh": "米娜带来相机，露丝拒绝摆姿势，要浇水壶。新叶轻颤，身后居民正争论长椅。米娜听着，笑了，转身去取水。"}];

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0)
(function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  bookEl.appendChild(div);
})();

// Paragraph rows (paragraphs 1..n)
const jumpSel = document.getElementById('jumpSel');
DATA.slice(1).forEach((d, i) => {
  const p = i + 1;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + p;
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + p + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const label = S.p === 0 ? 'Title' : ('Paragraph ' + S.p + ' of ' + (sentences.length - 1));
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-what-the-last-ferry-carried-v1';
const LS_OLD_KEY = 'audiobook-what-the-last-ferry-carried-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
