<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrases 2501–2867 — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>Phrases 2501–2867</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "By the time Mara reached Bellweather Island, the afternoon had turned (squally). The ferry rolled (precariously) past a red (buoy), exposing its painted (underbelly) between waves. A (burly) deckhand caught her suitcase before it slid away. “First visit?” he asked (genially). “First return,” she answered. He regarded her (quizzically), then nodded. Above the harbour, the Gull Inn looked (startlingly) small. She had remembered it as a castle. Now she stood (queasy) and (dizzy), looking at it (wonderingly). Its (curvy) roof sagged over windows that glowed (dimly), and a (wispy) strand of smoke rose into the rain.", "zh": "玛拉抵达贝尔韦瑟岛时，午后的天气已经变得（狂风阵阵）。渡轮（摇摇欲坠地）经过一只红色（浮标），在波浪间露出涂着漆的（船腹）。一名（魁梧的）水手及时抓住了她险些滑走的箱子。“第一次来？”他（和蔼地）问。“第一次回来。”她回答。他（疑惑地）看了看她，然后点头。港口上方，海鸥旅馆小得（令人吃惊）。在她的记忆里，它曾像座城堡。现在，她（反胃）、（头晕），（惊讶地）打量着它。（弯曲）的屋顶低垂在散发着（微弱）灯光的窗户上方，一缕（轻薄的）烟升进雨里。"}, {"en": "The door opened (creakily), revealing her mother in a (tatty) cardigan over a (frilly) blouse. “You're late,” June said (briskly). “The sea apologises,” Mara replied (wryly). They embraced (clumsily), each holding an object neither thought to put down. Her mother's hands felt thin and dry; her cheek smelled (faintly) of orange peel. Mara had come for the island's autumn (festivity), expecting familiar meals and arguments. Instead, behind the desk stood a (portly) stranger with a clipboard. He greeted her (cordially) and asked June about the sale. The word landed with the (finality) of a dropped plate.", "zh": "门（吱呀作响地）打开了，母亲穿着一件（破旧的）开衫，里面是带（褶边的）衬衣。“你迟到了。”琼（干脆利落地）说。“大海向你道歉。”玛拉（苦笑着）回答。她们（笨拙地）拥抱，各自拿着东西，谁也没想到先放下。母亲的手瘦而干燥，脸颊上有（淡淡的）橘皮香。玛拉是为岛上的秋季（庆典）回来的，原以为会遇到熟悉的饭菜和争论。可柜台后站着一个拿着写字板的（发福的）陌生人。他（热情友好地）向她问好，接着询问琼出售旅馆的事。“出售”这个词落下来，如同摔碎的盘子，带着无法挽回的（终结感）。"}, {"en": "“What sale?” Mara asked (blankly). June set down her keys (gingerly). “I'm selling the inn.” The stranger smiled (placatingly), then retreated to inspect a drain. Mara looked around at the (chintz) curtains, the crooked clock, the piano beneath a lace (doily). Each object seemed to have acquired a (ghostly) outline. “You might have told me.” “I tried. You were always between rehearsals.” June spoke (wearily), not (accusingly), which somehow hurt more. Mara had imagined home waiting (obediently) for her. She had never imagined it making plans.", "zh": "“什么出售？”玛拉（茫然地）问。琼（小心翼翼地）放下钥匙。“我要卖掉旅馆。”陌生人（安抚地）笑了笑，退开去检查排水沟。玛拉环顾四周：印花（棉布）窗帘、歪斜的钟、盖着蕾丝（小垫布）的钢琴。每件东西似乎都浮现出（幽灵般的）轮廓。“你本可以告诉我。”“我试过。你总是在两场排练之间。”琼说得（疲惫），却没有（责怪），反而让玛拉更加难受。她一直以为家会（顺从地）等她，从未想过家也会制定自己的计划。"}, {"en": "She carried her case upstairs (sulkily). The stair creaked beneath her; a (splintery) rail caught her sleeve. Her old room was (drafty), the wallpaper (spotty), the bedspread (lumpy). On the shelf, a (runty) wooden horse stood beside a (sparkly) medal from her first violin contest. She lifted it (musingly). At sixteen, she had wanted (ardently) to leave. At twenty-seven, she wanted the place she had left to remain unchanged. The contradiction was (disconcertingly) obvious. The room smelled of closed windows; her hands were (clammy). She put the medal down (crossly), as though it had explained her to herself without permission.", "zh": "她（闷闷不乐地）提着箱子上楼。楼梯在脚下吱响，（满是木刺的）扶手勾住了袖子。旧房间（漏风），墙纸（斑斑点点），床罩（凹凸不平）。架子上，一匹（矮小的）木马旁放着她第一次小提琴比赛赢得的（闪亮的）奖牌。她（若有所思地）拿起来。十六岁时，她曾（热切地）渴望离开；二十七岁时，她却希望离开的地方永远不变。这个矛盾明显得（令人不安）。房间有股长久不开窗的气味，她的手（湿冷）。她（恼火地）放下奖牌，仿佛它未经许可，就替她揭穿了自己。"}, {"en": "Downstairs, the stranger introduced himself as Ellis, an (envoy) for the prospective buyers. His (sleekly) combed hair resisted the weather. “A sensitive restoration,” he said (airily). Mara asked whether that included keeping the piano. He answered (cagily): decisions would follow inspection. She called the phrase (bitingly) familiar. June intervened (sternly). “He's here to measure walls, not defend civilisation.” Ellis accepted the rebuke (sportingly). He seemed neither (sly) nor cruel, merely (abnormally) interested in damp. “The piano's older than the plumbing,” he observed (conversationally). “And more reliable,” June said. Against her will, Mara almost smiled.", "zh": "楼下，陌生人介绍自己叫埃利斯，是潜在买家的（代表）。他的头发梳得（光滑服帖），丝毫不受天气影响。“我们会谨慎修复。”他（轻描淡写地）说。玛拉问，这是否包括保留钢琴。他（谨慎含糊地）回答，要检查之后才能决定。她（尖刻地）说，这套话真耳熟。琼（严厉地）插话：“他来测量墙壁，不是来捍卫文明。”埃利斯（大度地）接受了斥责。他看起来既不（狡猾），也不残忍，只是对潮湿（异乎寻常地）感兴趣。“钢琴比水管还老。”他用（闲谈的口吻）说。“也更可靠。”琼回答。玛拉不由自主地差点笑了。"}, {"en": "The afternoon ferry was cancelled. News arrived through a (tinny) radio in a voice so (tonelessly) calm that the announcement sounded optional. Then a (convoy) of soaked passengers appeared: a (dumpy) baker, a (wiry) botanist, two theatre students, a salesman in a (jaunty) (fez), and an elderly pianist named Leon. June welcomed them (cheerily). “Rooms first, tea second, complaints after breakfast.” A (surly) passenger objected to the stairs. She explained (crisply) that the inn had never possessed a lift. Mara began carrying bags without being asked. Old habits returned with uncomfortable ease.", "zh": "下午的渡轮取消了。消息从一台声音（尖薄）的收音机传来，播报员平静得（毫无语调起伏），听上去仿佛这条通知可以选择不理。随后，一（队）浑身湿透的旅客出现了：一位（矮胖的）面包师、一位（精瘦结实的）植物学家、两个戏剧学生、一个戴着（神气的）（土耳其毡帽）的推销员，以及一位叫里昂的老钢琴家。琼（快活地）欢迎他们：“先安排房间，再喝茶，抱怨请等到早餐以后。”一位（脾气暴躁的）旅客对楼梯表示不满。她（简洁明确地）解释，旅馆从来没有电梯。没人吩咐，玛拉就开始搬行李。旧习惯回来得太容易，让她不太舒服。"}, {"en": "Leon watched her violin case (keenly). “Professional?” “Usually.” He grinned (sardonically). “A useful qualification.” His (bony) fingers rested on a walking stick; his eyebrows were (bristly), his scarf (gauzy). He had played at the festival years before, when Mara's father was alive. “Your mother accompanied me (magnificently),” he said. Mara looked up (incredulously). June, who claimed not to play? Leon glanced towards the kitchen. “Perhaps I have spoken (rashly).” Mara answered (hastily) that it did not matter. Already it mattered (tremendously). Her parents' lives, once so familiar, had become a (thundery) landscape full of unseen turns.", "zh": "里昂（敏锐地）注视着她的小提琴盒。“职业演奏家？”“通常是。”他（带着讥诮地）笑了。“这个限定很好用。”他（骨节分明的）手指搭在手杖上，眉毛（粗硬），围巾（薄如轻纱）。多年前，玛拉的父亲还在世时，他来这里参加过庆典演出。“你母亲为我伴奏，弹得（极为出色）。”他说。玛拉（难以置信地）抬起头。是那个声称自己不弹琴的琼？里昂朝厨房看了一眼。“也许我说得（太冒失）了。”玛拉（匆忙地）回答，没关系。可这件事已经（非常）重要。父母曾经那么熟悉的人生，忽然变成一片（雷雨欲来）、转弯处都看不清的风景。"}, {"en": "In the kitchen, June attacked a mountain of potatoes (assiduously). Steam clouded the windows; the floor was (greasy), the sink (soapy), the air (steamy) and warm. “You never told me about accompanying Leon.” “You never asked.” Mara reached for a knife, then set it down. June continued, describing concerts before Mara's birth. Mara had (unwittingly) reduced her mother to a role without a history. “Were you good?” she asked (enquiringly). For a moment she feared that even asking might (pry) open something painful. June gave a (wry) smile. “Good enough to know when somebody else was better.”", "zh": "厨房里，琼正（勤勉地）处理一堆山一样的土豆。蒸汽蒙住窗户，地板（油腻），水槽里满是（肥皂泡），空气（热气腾腾），十分暖和。“你从没说过给里昂伴奏的事。”“你从没问过。”玛拉伸手拿刀，又放了回去。琼继续讲起玛拉出生前的音乐会。玛拉（不知不觉地）把母亲缩减成了一个没有过往的角色。“你弹得好吗？”她用（探问的口气）问。一瞬间，她担心这个问题会（撬开）某段痛苦。琼露出一个（苦中带笑的）微笑。“好到能够分辨什么时候别人弹得更好。”"}, {"en": "A shout interrupted them. The salesman had discovered a leak above his bed. “This is an (indignity)!” he announced (pompously). Water dripped onto his (glittery) costume boxes. One student laughed (raucously); the other looked (reprovingly) at him. June offered another room (soothingly), but the man insisted (petulantly) that someone would pay. Mara fetched a bucket (grudgingly). He informed her (loftily) that he was an artist, not a tradesman. “Then consider this an installation,” she suggested (cheekily). June hid her smile behind a towel.", "zh": "一声喊叫打断了她们。推销员发现床顶上方漏水。“这简直是（侮辱）！”他（自命不凡地）宣布。水滴落在他那些（亮闪闪的）戏服箱上。一个学生（粗声大笑），另一个则（责备地）看着他。琼（温言安慰地）提出换房间，那人却（耍脾气地）坚持必须有人赔偿。玛拉（不情愿地）拿来水桶。他（高高在上地）告诉她，自己是艺术家，不是商贩。“那就把这当成装置艺术。”她（俏皮大胆地）建议。琼用毛巾挡住了笑容。"}, {"en": "The salesman, Basil, sold theatrical supplies and performed amateur magic. He could make a coin vanish (artfully), though his accounts were less convincing. His (shifty) glance followed Ellis, whom he mistook for an investor. He praised the inn (extravagantly), then whispered (confidentially) that its owner lacked commercial vision. Mara heard him (surreptitiously) propose a partnership. “You're discussing my mother,” she said (bleakly). Basil looked (shiftily) away. “A compliment.” “A (sloppy) disguise for an insult.” He bowed (haughtily), caught his sleeve on a nail, and withdrew (jerkily). A (crony) had once called him a marketing genius; he repeated that judgement (complacently) whenever sales went badly.", "zh": "推销员叫巴兹尔，既卖戏剧用品，也表演业余魔术。他能（巧妙地）让硬币消失，讲起账目却没那么令人信服。他（鬼鬼祟祟的）目光追着埃利斯，误把对方当成投资人。他（夸张地）赞美旅馆，又（秘密地）低声说店主缺乏商业眼光。玛拉听见他（偷偷摸摸地）提出合作。“你在谈论我的母亲。”她（冷冷地）说。巴兹尔（躲躲闪闪地）移开目光。“我是在夸她。”“只是给侮辱套了个（拙劣的）伪装。”他（傲慢地）鞠了一躬，袖子挂住钉子，又（动作僵硬地）退开。一位（密友）曾称他为营销天才；每次生意不好，他都会（自鸣得意地）重复这个评价。"}, {"en": "Dinner required everyone. The baker, Dot, volunteered (willingly), kneading dough with (sinewy) forearms. Her (gingery) biscuits smelled wonderful. A (mousy) student named Kit arranged plates (fussily); his partner, Nia, worked (breezily), spilling water but keeping spirits high. The botanist, Soren, contributed (nutty) mushrooms bought on the mainland. He was a (prickly) man about botanical accuracy. “Not mysterious island specimens,” he added (jovially). Leon accepted the safest job: watching the (gravy). He performed it (magisterially), declaring each bubble important. June laughed (uncharacteristically) loudly, and Mara realised how rarely she had heard that sound on the telephone.", "zh": "准备晚饭需要所有人帮忙。面包师多特（心甘情愿地）出力，用（肌肉结实的）前臂揉面。她做的（姜味）饼干闻起来棒极了。一个叫基特的（腼腆的）学生（过分讲究地）摆盘子；他的搭档妮娅则（轻松愉快地）忙碌，虽然洒了水，却让大家精神振奋。植物学家索伦贡献了从大陆买来的、带（坚果风味的）蘑菇。一涉及植物知识的准确性，他就有些（容易不悦）。“不是岛上来历不明的标本。”他（乐呵呵地）补充。里昂领了最安全的任务：看着（肉汁）。他（像权威人物般）执行任务，宣布每个气泡都很重要。琼（一反常态地）大声笑起来，玛拉才意识到，自己在电话里很少听见这样的笑声。"}, {"en": "At the long table, conversation spread (riotously). Basil described an audience that had applauded him (rapturously), omitting the part where his trousers tore. Kit supplied it (gleefully). Nia laughed (uproariously); Basil stared (balefully). Dot served a (hearty), (savory) pie beneath a (crusty) lid. The sauce was (peppery), the carrots sweet, the bread still warm. Ellis ate (deferentially), as though evaluating dinner might violate his contract. Mara found herself enjoying the company. This seemed almost an act of (treachery) against her earlier anger. She had arrived hoping for one story and found herself inside another.", "zh": "长桌旁，谈话（热闹放纵地）蔓延。巴兹尔描述观众如何（如痴如醉地）为他鼓掌，却略去了裤子撕裂的部分。基特（兴高采烈地）补上了。妮娅（哄然大笑），巴兹尔则（阴沉凶狠地）瞪着他。多特端上（丰盛）、（咸香）的馅饼，盖着一层（酥脆的）饼皮。酱汁（胡椒味浓），胡萝卜甜美，面包还温热。埃利斯（恭敬拘谨地）吃着，仿佛评价晚餐会违反合同。玛拉发现自己竟享受起这群人的陪伴。这几乎像是在（背叛）先前的怒气。她原本带着对一种故事的期待而来，却发现自己走进了另一种故事。"}, {"en": "Then the ferry agent telephoned: no boats until the following afternoon. An (outcry) filled the room. Basil protested (shrilly), a passenger swore (foully), and Kit asked (despairingly) about his audition. Nia answered (stoutly) that they would find another route. Outside, the wind struck the windows (ferociously). There was no other route. A man asked (vainly) whether money could change that. June looked at him with open (incredulity). She repeated the cancellation (emphatically), refusing to dress danger as inconvenience. The room grew (gloomy). A (pasty) traveller stared (listlessly) at his ticket, no longer hungry. Leon stirred his tea (moodily). Finally Dot asked whether anyone wanted pudding. Nobody considered that a solution, but everybody wanted some.", "zh": "随后，轮渡代理打来电话：第二天下午之前都不会有船。房间里响起一片（抗议声）。巴兹尔（尖声）反对，一个旅客（粗俗地）骂人，基特则（绝望地）问自己的试镜怎么办。妮娅（坚定地）说，他们会找到别的路线。窗外，风（猛烈地）撞击玻璃。然而并没有别的路线。一个男人（徒劳地）问，加钱是否可以改变情况。琼毫不掩饰自己的（难以置信），随后（着重明确地）重申停航决定，不肯把危险粉饰成不便。房间气氛变得（阴郁）。一个脸色（苍白的）旅客（无精打采地）看着船票，连饥饿都忘了。里昂（闷闷不乐地）搅着茶。最后，多特问有没有人想吃布丁。没人觉得这能解决问题，但人人都想吃一点。"}, {"en": "The pudding was (runny), (sugary), and (fruity). A (tipsy) guest praised it (ecstatically); Ellis smiled (benignly). Basil complained (snappishly) about the lack of cream. Dot regarded him (witheringly). She was normally (bossy) about portions, but now regarded generosity as essential. “The cows are not accepting visitors.” Even he managed a weak laugh. Mara watched June collecting dishes (laboriously), shoulders bent. Her mother had prepared for every (eventuality) except rest. “Why now?” Mara asked when they reached the (pantry). June understood immediately. “Because I'm tired of waiting until selling this place feels convenient for everybody else.”", "zh": "布丁（稀软）、（甜滋滋），带着（水果香）。一位（微醺的）客人（欣喜若狂地）赞美它，埃利斯（温和地）微笑。巴兹尔（不耐烦地）抱怨没有奶油。多特（鄙夷地）看着他。她平时对分量颇为（专横），现在却觉得必须大方些。“奶牛现在不接待访客。”连他也勉强笑了一下。玛拉看着母亲弯着肩，（费力地）收拾餐具。母亲为每一种（可能发生的情况）做好了准备，唯独没有准备休息。走进（食品储藏室）时，玛拉问：“为什么偏偏现在？”琼立刻明白了。“因为我不想再等到所有别人都觉得方便时，才能卖掉这里。”"}, {"en": "Mara answered (hotly) that the inn belonged to their family. June placed a (weighty) saucepan on the shelf. “It does. The mortgage belongs to me.” “You make it sound like a burden.” “Sometimes it is.” June's voice had an unfamiliar (asperity). Mara said (cuttingly) that her father would never have sold it. The silence afterwards was (ghastly). Mara knew she had spoken (callously), using grief as a weapon. “Your father,” June replied (huskily), “was allowed to want things. I loved him. I would like to be allowed the same courtesy.” Mara could not find a reply that was not worse than silence.", "zh": "玛拉（激动地）说，旅馆属于整个家庭。琼把一口（沉重的）锅放上架子。“没错。抵押贷款属于我。”“你说得好像它只是负担。”“有时候就是。”琼的声音带着陌生的（尖锐）。玛拉（伤人地）说，父亲永远不会卖掉这里。接下来的沉默（可怕极了）。她知道自己说得（冷酷），拿悲伤当成了武器。“你父亲，”琼（沙哑地）回答，“可以拥有自己的愿望。我爱他。我也希望得到同样的体谅。”玛拉找不到任何一个不会比沉默更糟的回答。"}, {"en": "She went outside without a coat. A (chilly) wind drove rain (diagonally) across the harbour. The water looked (leathery) beneath the lamps, then broke into (foamy) streaks. On the steps lay a (slimy) rope; beyond them, a (scummy) puddle reflected the sign. Mara stood (grimly), letting weather punish her because it required no apology. A (tawny) cat watched from a (cranny). “You're right,” she told it (bitterly). “I'm behaving badly.” The cat blinked (owlishly), conceding nothing. A (silvery) patch shone on its tail. Its (whiskery) face reminded her of her father after a sailing trip.", "zh": "她没穿外套就走了出去。（寒冷的）风裹着雨，（斜着）扫过港口。灯下的水面看起来像（皮革），随后碎成一道道（泛着泡沫的）波纹。台阶上躺着一根（黏滑的）绳子，更远处一个（浮着污沫的）水坑映着招牌。玛拉（阴沉地）站着，任天气惩罚自己，因为这种惩罚不需要她道歉。一只（黄褐色的）猫从（缝隙）里望着她。“你说得对，”她（苦涩地）告诉它，“我表现得很糟。”猫（像猫头鹰似的）眨眼，什么也不肯承认。它尾巴上一块（银色的）毛在闪光，那张（胡须浓密的）脸让她想起出海归来的父亲。"}, {"en": "As a child, she had considered him a hero. He could steer through a (blustery) squall, turn a (knotty) problem into a joke, and make a (teeny) room feel large. June had been the person who worried about towels. Now Mara remembered him sleeping while her mother cleared tables, remembered a (hasty) promise to help tomorrow. She did not want to turn love into an accusation. She had once dismissed her mother's frustration as (pointlessly) repetitive. Yet calling one person heroic could (inadvertently) make another invisible. The thought hurt (grievously). A child could be (nosy) about locked drawers and incurious about the people who owned them. She returned inside, wet, ashamed, and less certain. Her (shivery) reflection in the hallway mirror looked much younger than she felt.", "zh": "小时候，她把父亲当成英雄。他能掌舵穿过（狂风呼啸的）暴风雨，把（棘手的）问题变成笑话，让（小小的）房间显得宽敞。琼则是那个操心毛巾的人。如今，玛拉想起父亲睡觉时母亲收拾桌子的情景，也想起他（匆忙地）答应明天帮忙。她不愿把爱变成控诉。她曾觉得母亲的烦恼只是（毫无意义地）反复唠叨。然而，把一个人称作英雄，可能会（无意间）让另一个人消失。这念头让她（深深地）痛苦。孩子可以对锁着的抽屉（爱打听），却对抽屉的主人毫无好奇。她湿漉漉地回到屋里，感到羞愧，也不再那么确定自己是对的。走廊镜子里那个（瑟瑟发抖的）人，比她感觉中的自己年轻得多。"}, {"en": "Leon sat at the piano, touching one key. “It sticks,” he said (ruefully). “So do people.” Mara asked whether her mother had ever wanted a musical career. He looked at her (inquiringly), then answered (cautiously). “Ask her what she wants now.” Mara stared at the keys (glumly). “I'm afraid she'll say she wants to be away from me.” “She might want to be away from laundry.” He spoke (pityingly), but the distinction was not gentle. A (flimsy) explanation would not protect her from this. Mara had been making herself the centre of a decision that might have little to do with her.", "zh": "里昂坐在钢琴旁，轻触一个琴键。“卡住了。”他（遗憾地）说，“人也会。”玛拉问，母亲是否曾想过从事音乐事业。他（探询地）看着她，然后（谨慎地）回答：“问问她现在想要什么。”玛拉（忧郁地）盯着琴键。“我怕她会说，她想离开我。”“她可能只是想离开洗不完的衣服。”他说得（带着怜悯），这个区别却一点也不轻柔。一套（站不住脚的）解释不能保护她。她一直把自己放在一个决定的中心，而那个决定也许与她关系并不大。"}, {"en": "A crash came from the back corridor. A shelf had collapsed beneath a (musty) box of festival decorations. Kit stood amid (papery) flowers and a (feathery) hat, looking (mortally) embarrassed. “I was trying to help.” June assured him (obligingly) that the shelf was ancient. Basil appeared and commented (disparagingly) on youthful competence. Nia answered (scathingly) that some older people managed incompetence without youth as an excuse. Basil retreated in offence. Kit held a broken ornament (limply). It showed a (lowly) shepherd kneeling beside a king; the paint treated rank as destiny. Mara took it from him and began sorting what could be repaired.", "zh": "后走廊传来一声巨响。一个架子承受不住装着节庆装饰、散发着（霉味）的箱子，塌了下来。基特站在（纸做的）花和一顶（羽毛装饰的）帽子中间，尴尬得（要命）。“我只是想帮忙。”琼（体贴配合地）安慰他，说架子早就很旧了。巴兹尔出现，对年轻人的能力（贬低地）评论了一番。妮娅（尖刻地）回敬，有些年长者不靠年轻这个借口，也照样什么都干不好。巴兹尔生着气退开。基特（无力地）拿着一件破损摆饰，上面是一个（地位卑微的）牧羊人跪在国王身边，仿佛画中的等级就是命运。玛拉接过它，开始整理还能修补的东西。"}, {"en": "Inside the box they found photographs, programmes, and a (spidery) letter in Mara's father's handwriting. She recognised it (hazily): a concert invitation June had once pinned above the desk. The letter praised her playing, called the island (infernally) lucky to have her, and promised a mainland holiday. The date was two years before his death. Mara read it (intently), then folded it (reverently). He had seen more than she remembered. She heard the others (indistinctly) through the wall, calling the night (variously) an adventure, a disaster, and a holiday. A marriage could contain affection, disappointment, care, and unfinished promises without arranging them into an easy verdict.", "zh": "箱子里有照片、节目单，还有一封父亲写的、笔迹（细长潦草）的信。她（依稀）认出来，那是母亲曾钉在柜台上方的一封音乐会邀请信。父亲赞美她的演奏，说岛上能拥有她真是（极其）幸运，并答应陪她去大陆度假。日期是他去世前两年。玛拉（专注地）读完，（珍重地）折好。他看到的，比她记得的更多。隔着墙，她（隐约地）听见其他人的声音，他们（分别）把这个夜晚称为冒险、灾难和假期。一段婚姻可以同时包含爱、失望、照顾和未完成的承诺，而不必被整理成一个简单判决。"}, {"en": "The storm worsened with alarming (rapidity). Thunder shook the windowpanes; the lights flickered (fitfully), then failed. Someone screamed (tremulously). Basil announced (gloomily) that the building was unsafe. June told him (curtly) to stop guessing. Her voice, firm and (gravelly), steadied the room. She had candles for this (precautionary) purpose, a radio, blankets, and a list of guests. Mara fetched them without argument. Basil muttered (nastily) that somebody should have warned them earlier. “Someone did,” Nia replied. Outside, an (unearthly) light spread over the harbour as lightning exposed the water's (immensity).", "zh": "风暴以惊人的（速度）加剧。雷声震动窗玻璃，灯光（断断续续地）闪烁，随后熄灭。有人（颤抖着）尖叫。巴兹尔（悲观地）宣布这栋建筑不安全。琼（简短生硬地）叫他停止猜测。她坚定而（沙砾般低沉）的声音让大家稳了下来。她为这种（预防应急）用途准备了蜡烛，还有收音机、毯子和住客名单。玛拉没有争论，立刻去拿。巴兹尔（恶意地）嘟囔，说早该有人警告他们。“有人警告过。”妮娅回答。外面，一道（异乎尘世的）光铺满港口，闪电照出了海水的（浩瀚）。"}, {"en": "The candle flames were (weeny) against the darkness, but sufficient. Kit held one too close to a curtain until Nia moved it. A (drowsy) child woke with a cry; Dot spoke (cajolingly), turning shadows into imaginary animals. “A rabbit. A (spiny) dragon. A very (dozy) elephant.” The child smiled (innocently), then asked for a (teensy) dragon of her own. Ellis made one with his hands. Its (clumsy) wings delighted her. Dot smiled (slyly); the game had been a useful (diversionary) measure. Mara watched him (curiously). He had ceased being the man who measured walls. He was simply somebody making a frightened child laugh.", "zh": "烛火在黑暗里（微小），却已经够用。基特把一根蜡烛拿得离窗帘太近，妮娅赶紧挪开。一个（昏昏欲睡的）孩子哭着醒来，多特（哄劝地）说话，把影子变成想象中的动物。“一只兔子。一条（长刺的）龙。一头特别（爱打瞌睡的）大象。”孩子（天真地）笑了，又要求拥有一条（极小的）龙。埃利斯用手为她做了一个，那对（笨拙的）翅膀让她开心极了。多特（狡黠地）笑了；这个游戏成功（转移了注意力）。玛拉（好奇地）看着埃利斯。他不再只是那个测量墙壁的人，而是一个让受惊孩子笑起来的人。"}, {"en": "From the cellar came a sound like somebody dragging furniture. June went down with a torch; Mara followed (warily). Water entered through a broken vent. An old pump stood beside a (grimy) boiler, its cable hanging loose. “Don't touch that,” June said with sudden authority. They climbed back up. She called the harbour electrician, who explained the isolation switch. Ellis knew where it was from his inspection. Once the circuit was safely disconnected, they could move stored food upstairs. Basil suggested the electrician was acting (improperly) by advising over the telephone. June pointed out that he had told them how to switch the power off, not repair it. Practical knowledge proved more helpful than everybody's opinions about the sale.", "zh": "地窖传来像拖动家具的声音。琼拿着手电下去，玛拉（警惕地）跟着。水从破损的通风口灌入，一台旧水泵立在（积满污垢的）锅炉旁，电缆松垂着。“别碰。”琼突然严肃地命令。她们回到楼上。琼打电话给港口电工，对方解释了隔离开关的位置和用途。埃利斯检查时见过，知道它在哪里。安全切断电路后，他们便能把储存的食品搬到楼上。巴兹尔说，电工在电话里指导是（不合规矩地）行事。琼指出，对方是在告诉他们如何断电，不是在教他们维修。事实证明，实际知识比人人对出售旅馆的意见更有帮助。"}, {"en": "They formed a line. Dot passed tins, Soren carried boxes, and Basil tried (ostentatiously) to supervise. Nia handed him a sack. “Supervise this.” He accepted it (meekly). A (maggoty) old fishing net had to be left behind; so did a (rubbery) boot and a crate of empty bottles. Kit discovered a jar of (waxy) theatrical moustaches, which made him laugh despite the (grisly) smell below. Mara hauled a box (mightily), then admitted it was too heavy. Ellis helped without comment. Cooperation left less room for pride. A (testy) exchange over a doorway ended when Dot simply asked both men to move.", "zh": "大家排成一行。多特传罐头，索伦搬箱子，巴兹尔试图（炫耀地）指挥。妮娅递给他一个袋子。“指挥这个吧。”他（温顺地）接了。一张（长蛆的）旧渔网只能留在下面，一只（橡胶质的）靴子和一箱空瓶子也是。基特发现了一罐（涂着蜡的）舞台假胡子，尽管下面的味道（令人毛骨悚然），他还是笑了。玛拉（使尽力气）搬一个箱子，随后承认太重。埃利斯没有评论，直接帮忙。合作让骄傲少了些立足之地。两个人在门口（不耐烦地）争执，多特只叫他们都挪一步，争执便结束了。"}, {"en": "Afterwards, the kitchen resembled a (pigsty). Everyone was wet, (bleary), and hungry again. June distributed towels (unceremoniously). Basil called the evening a (travesty). “Of what?” Dot asked (testily). He could not say. Soren found a (sooty) kettle, cleaned it and made tea, pouring water (cleanly) into each cup. His usually (cheery) face looked drawn. “The garden wall has fallen,” he said. June closed her eyes for a (momentary) pause, then asked whether anyone had been outside. Nobody had. An old room once used as an (infirmary) could hold the displaced furniture. “Then we'll manage.” She spoke (soberly), with no performance of courage.", "zh": "忙完后，厨房像个（猪圈）。每个人都湿透了、（睡眼模糊），而且又饿了。琼（不拘礼节地）分发毛巾。巴兹尔说这个夜晚是一场（荒唐的歪曲）。“歪曲了什么？”多特（烦躁地）问。他答不上来。索伦找到一只（沾满烟灰的）水壶，洗净后烧水泡茶，把水（利落不洒地）倒进每个杯子。他平常（快乐的）脸此刻显得疲惫。“花园围墙倒了。”他说。琼闭上眼睛，停了（片刻），然后问有没有人在外面。没有。曾用作（医务室）的一间旧屋可以存放挪出来的家具。“那就有办法。”她（冷静认真地）说，没有刻意表现勇敢。"}, {"en": "Mara finally apologised beside the cold stove. She began (tortuously), mentioning memories, then stopped. “I said something cruel.” June nodded. “Yes.” Mara had hoped for immediate forgiveness and was ashamed of that hope. “Tell me about the flat.” June looked up. It was on the mainland, above a bookshop, with an (airy) room and no guest bedrooms. She wanted mornings that did not begin with somebody else's breakfast. “That sounds lovely,” Mara said, and this time meant it. June smiled (wistfully). “It does, doesn't it?”", "zh": "玛拉终于在冷下来的炉子旁道歉。她起初说得（曲折绕弯），提起回忆，随后停住。“我说了残忍的话。”琼点头。“是的。”玛拉原本希望立刻得到原谅，也为这种期待感到羞愧。“跟我说说那套公寓吧。”琼抬起头。它在大陆的一家书店楼上，有一间（通风敞亮的）房间，没有客房。她想要不必从别人的早餐开始的清晨。“听起来真好。”玛拉说，这次是真心的。琼（带着向往地）笑了。“是啊，对不对？”"}, {"en": "Leon proposed music. Not a concert, he said, and certainly not a fundraising appeal to save a building its owner wanted to sell. Just music. Mara brought her violin without hesitation. Kit found an old programme listing June as accompanist. Basil examined it (contemptuously), declaring the repertoire dated. “Like manners,” Nia said (tartly), “some old things remain useful.” June refused (mulishly) at first. Leon asked her (playfully) whether she was frightened of being better than him. “Of your complaints,” she replied. She sat down.", "zh": "里昂提议奏乐。他说，不是音乐会，更不是为了挽救一栋主人想卖掉的房子而募款，只是音乐。玛拉毫不犹豫地拿来小提琴。基特找出一张写着琼担任伴奏的旧节目单。巴兹尔（轻蔑地）看了看，宣布曲目已经过时。“跟礼貌一样，”妮娅（尖酸地）说，“有些旧东西仍然有用。”琼起初（固执地）拒绝。里昂（开玩笑地）问，她是不是怕自己弹得比他好。“怕你抱怨。”她回答，然后坐了下来。"}, {"en": "The first notes sounded (dully), the piano affected by damp. June tested the keys, adjusted her touch, and found a (velvety) tone beneath the uneven mechanism. Mara entered too loudly. Her mother glanced at her—an old look, suddenly welcome. They began again. Outside, the storm pressed (viciously) against the walls. Inside, the melody moved (sinuously) through the candlelight. Mara had practised this piece (feverishly) as a student, intent on showing speed. Now she listened for the spaces where another player could answer.", "zh": "最初几个音听起来（沉闷），钢琴受了潮。琼试了试琴键，调整触键方式，从不均匀的机械状态里找出一种（天鹅绒般柔滑的）音色。玛拉的小提琴进入得太响，母亲看了她一眼——一个熟悉的眼神，此刻却令人欢迎。她们重新开始。外面，风暴（凶狠地）挤压墙壁；里面，旋律（蜿蜒地）穿过烛光。学生时代，玛拉曾（狂热地）练习这首曲子，一心炫耀速度。现在，她开始倾听另一个演奏者可以回应的空隙。"}, {"en": "June was no (saintly) figure dispensing absolution through music. She played like a person with decisions to make. At one passage she leaned into the rhythm (defiantly); at another, she let it fall almost silent. Mara followed, experiencing a (receptivity) no judge had ever demanded of her. The room became unexpectedly still. Even Basil stopped arranging his expression. When the final note faded, nobody clapped immediately. Then Kit began, and the applause rose (jubilantly), warm and untidy.", "zh": "琼不是一个通过音乐赐予宽恕的（圣洁）人物。她弹得像一个有自己的决定要做的人。在一段旋律里，她（不屈地）推进节奏；另一段里，她又让声音几乎落入寂静。玛拉跟随着，体验到一种从未有评委要求过的（接纳与倾听能力）。房间出乎意料地安静下来。连巴兹尔也不再刻意摆出表情。最后一个音消失时，没有人立刻鼓掌。随后，基特率先拍起手，掌声（欢欣地）升起，温暖而不整齐。"}, {"en": "Basil recovered first. “You should tour,” he declared (imperiously). “I could manage it.” June laughed. “No.” He persisted (smugly), outlining fees. She refused without qualification. Mara felt an old instinct to argue that talent created obligation, then let it pass. Her mother might play again, or not. Enjoyment did not have to become employment to justify itself. Leon nodded. “The rarest musical skill,” he told Mara, “is knowing when to stop.” June closed the piano, then opened it again. “One dance.”", "zh": "巴兹尔最先恢复常态。“你应该巡演。”他（专横地）宣布，“我可以当经纪人。”琼笑了。“不。”他（自鸣得意地）继续介绍收费安排，她毫不含糊地拒绝。玛拉差点又本能地争辩，说有天赋就有义务，随后放下了这个念头。母亲可以再弹，也可以不弹。快乐不必变成职业，才有存在的理由。里昂点头。“最稀有的音乐本领，”他告诉玛拉，“是知道什么时候该停。”琼合上琴盖，又重新打开。“再来一支舞曲。”"}, {"en": "The students danced (exuberantly), Dot followed (jauntily), and Ellis attempted a bow so (ungainly) that everybody laughed. The little girl wore a (floaty) scarf and offered a solemn (curtsy). Basil spun (regally), nearly collided with a chair, and blamed the floor (unblushingly). Mara laughed without checking who heard. Basil offered Dot his arm and announced that (chivalry) survived. She accepted (primly), then led him faster than he expected. June played a (breezy) tune while Leon added absurd bass notes. The inn had hosted grander evenings, but Mara doubted any had contained more (hilarity).", "zh": "学生们（兴高采烈地）跳舞，多特（轻快地）加入，埃利斯尝试鞠躬，却（笨拙难看）得让所有人都笑了。小女孩披着（轻盈飘动的）围巾，认真地行了个（屈膝礼）。巴兹尔（像帝王般）旋转，险些撞上椅子，又（毫不脸红地）怪地板。玛拉笑了，不再留意谁听见。巴兹尔向多特伸出手臂，宣称（骑士风度）尚存。她（一本正经地）接受，然后带着他跳得比他预料的更快。琼弹着（轻松活泼的）曲子，里昂添上荒唐的低音。旅馆举办过更盛大的夜晚，但玛拉怀疑，没有哪次有过更多的（欢笑）。"}, {"en": "Later, as the candles shortened, the guests traded stories. Soren described plants that survived a (wintry) coast; Dot recalled a (wintery) journey in a bakery van. Kit remembered an audition ruined by a (fizzy) drink, while Nia admitted she had once answered a director (insolently) and then been hired. Basil had earlier spoken (tauntingly) of Kit's nerves; now he claimed (gloatingly) that he never suffered nerves. “Of course,” Leon said with dry amusement. “Nerves require imagination.” Mara wondered if the sharp humour concealed genuine hostility, then decided she need not solve every relationship. June looked at him, but he merely polished his glasses.", "zh": "后来，蜡烛越烧越短，客人们轮流讲故事。索伦描述能在（严冬般的）海岸生存的植物，多特回忆一次驾驶面包车的（冬日）旅程。基特想起被一杯（碳酸）饮料毁掉的试镜，妮娅则承认，自己曾（无礼地）顶撞导演，结果反而被录用。巴兹尔先前还（嘲弄地）评论基特紧张，如今又（幸灾乐祸般得意地）宣称自己从不紧张。“当然。”里昂带着冷幽默说，“紧张需要想象力。”玛拉想，这种锋利的幽默是否藏着真正的敌意，随后决定自己不必解开每一段人际关系。琼看了里昂一眼，他却只是擦眼镜。"}, {"en": "The child wanted a ghost story. Basil offered one with a (warty) witch and a (scrawny) sailor, told (venomously) enough to upset her. The child pulled away, her earlier trust going (awry). Dot interrupted (mercifully). “The witch made excellent jam.” Nia supplied a (brainy) cat; Kit added a (loopy) pirate whose greatest fear was (scurvy). The tale wandered into such cheerful nonsense that fear dissolved. Basil complained (spitefully) about artistic interference. June answered that frightening children was not evidence of artistic (superiority). He subsided, looking (shirty). Then he complained (sanctimoniously) that children ought to learn courage. “Not to entertain you,” June answered.", "zh": "孩子想听鬼故事。巴兹尔讲了一个关于（长着疣的）女巫和（瘦骨嶙峋的）水手的故事，语气（恶毒阴森）得令她难过。孩子缩开了，先前的信任开始（走样）。多特（仁慈地）打断：“女巫做的果酱特别好吃。”妮娅加上一只（聪明的）猫，基特又添了一个最怕（坏血病）的（疯疯癫癫的）海盗。故事越讲越快乐荒唐，恐惧也消失了。巴兹尔（怀恨地）抱怨别人干涉艺术。琼回答，吓唬孩子不能证明艺术上的（优越）。他安静下来，看起来（恼火）。随后又（假装正义地）抱怨，孩子应该学会勇气。“不是为了供你取乐。”琼说。"}, {"en": "Mara helped wash cups in cold water. The (sultry) warmth had gone from the kitchen; even the stove seemed tired. “I used to think leaving made me disloyal,” she confessed. For once, the question of tomorrow's rehearsal did not (preoccupy) her. June answered (absently) while drying a saucer, then caught herself and listened properly. Mara continued: perhaps she had needed her mother to stay so departure would remain reversible. June said that love did not require a fixed address. Her practical wisdom could sound (fussy), but tonight Mara heard its generosity. There was no (nobility) in remaining unhappy merely to preserve someone else's childhood, and no affection in demanding (servility).", "zh": "玛拉帮忙用冷水洗杯子。厨房里的（闷热）已经散去，连炉子都像累了。“以前我总觉得，离开就是不忠。”她坦白。难得有一次，明天的排练没有（占据）她全部心思。琼一边擦碟子，一边（心不在焉地）回答，随即意识到自己走神，开始认真听。玛拉继续说，也许她需要母亲留在原处，这样自己离开之后才总能返回。琼说，爱不需要固定地址。她实用的人生道理听起来有时会（琐碎挑剔），但今晚，玛拉听出了其中的宽厚。仅仅为了保存别人的童年而继续不快乐，并不（高尚）；要求别人永远（卑顺服从），也不是爱。"}, {"en": "By dawn, the wind had softened. A (pearly) light reached the kitchen, revealing tired faces and (watery) tea. Basil slept in a chair, his moustache (droopy), his expression (blissfully) free of importance. Ellis stood at the window, then asked June whether she still wished to proceed. She answered yes. Mara felt a pang, but not (enmity). They would need new inspections after the storm; there was a contractual (technicality) about the damaged wall. Ellis explained it plainly, and June asked sensible questions. Nobody pretended the decision was easy.", "zh": "黎明时，风势减弱了。（珍珠般的）晨光照进厨房，显出疲惫的脸和（寡淡的）茶。巴兹尔睡在椅子里，胡子（下垂），表情（幸福地）摆脱了自命不凡。埃利斯站在窗边，随后问琼是否仍想继续出售。她说是。玛拉感到一阵刺痛，却没有（敌意）。风暴之后需要重新检查，合同里有一项涉及受损围墙的（技术性细节）。埃利斯解释得清楚，琼提出合理的问题。没有人假装这个决定很容易。"}, {"en": "Breakfast was improvised. Dot made toast from (gritty) bread; Soren found honey with a (flowery) scent. The child preferred a small spoonful of jam and announced the kitchen was (barmy). Kit agreed (mischievously), naming everyone: a (batty) violinist, a (potty) pianist, a (loony) magician. Basil objected (indignantly), then realised all eyes were waiting for his reaction. He surrendered with unexpected grace and bowed. The child applauded with delight. For once, he had earned it by doing very little. Kit's theatre offered a later audition; he read the message twice before believing it.", "zh": "早餐是临时拼凑的。多特用（口感粗糙的）面包烤吐司，索伦找到了带（花香的）蜂蜜。孩子更喜欢一小勺果酱，并宣布厨房简直（疯了）。基特（淘气地）同意，挨个给大家取名：一个（古怪的）小提琴家，一个（疯乎乎的）钢琴家，一个（神经兮兮的）魔术师。巴兹尔（愤愤不平地）反对，随后发现所有人都等着他的反应。他出乎意料地大方认输，鞠了一躬。孩子高兴地鼓掌。难得有一次，他没做多少事就真正赢得了掌声。基特的剧院同意另安排一次试镜；他读了两遍消息才敢相信。"}, {"en": "Mara and June walked to the harbour after breakfast. Rain had left the (grassy) verge (dewy); a (mossy) wall leaned above a narrow (gully). The sky was (hazy), then cleared to a (dazzlingly) bright blue. In a (balmy) pocket behind a shed, they stopped. June spoke (reminiscently) of the first winter at the inn: broken pipes, (lousy) heating, her husband's terrible soup. She could remember happiness without wanting to repeat every condition that surrounded it. Mara listened, understanding that affection was not a preservation order.", "zh": "早餐后，玛拉和琼步行去港口。雨让路边（长满草的）地带挂着（露珠），一堵（覆着苔藓的）墙斜立在狭窄的（沟壑）上方。天空起初（朦胧），随后转为（耀眼地）明亮的蓝色。她们在棚屋后一个（温暖宜人的）避风角停下。琼（回忆地）说起旅馆的第一个冬天：坏掉的水管、（糟透了的）暖气、丈夫难喝的汤。她可以记得幸福，而不必想要重新经历围绕幸福的每一种条件。玛拉听着，明白了爱不是一道禁止改变的保护令。"}, {"en": "They passed the former (apothecary), now a museum. In its window, an advertisement for (palmistry) stood beside a display about sailors' ailments. Mara remembered peering through the glass as a (pimply) teenager, hoping somebody could predict her future. The woman inside had told her not to let other people's (bigotry) decide what a girl could become. June had paid for the reading, then called it nonsense. “I remember,” she said with a crooked smile. “You listened to her. You weren't listening to me.” Mara took her arm. The movement was small, but more than a social (nicety).", "zh": "她们经过从前的（药铺），现在那里已成了博物馆。橱窗里，一张（手相术）广告旁陈列着有关水手疾病的展品。玛拉记得，自己还是一个（满脸青春痘的）少女时，曾透过玻璃往里看，希望有人预测她的未来。里面的女人告诉她，别让旁人的（偏见）决定一个女孩能够成为什么。琼付了看手相的钱，随后又称那是胡说。“我记得。”她歪着嘴笑了，“你肯听她的，却不肯听我的。”玛拉挽住母亲的胳膊。动作很小，却不只是一种社交（礼节）。"}, {"en": "At the harbour, the queue formed (expectantly). A (jumpy) dog pulled at a (whippy) lead; a (doddery) man guarded a basket like a (sentry). The sea remained (glassy) only in sheltered patches. Its beauty could fool the (unwary), June warned. Mara agreed, remembering the night's (ferocity). A fisherman spoke (dismally) of cancelled deliveries, while his wife reminded him with determination that nobody had sunk. A sudden (flurry) sent everyone towards the ticket office when a rumour announced departure. The clerk denied it (grumpily). “Schedules are not wishes.” Leon praised her (punctuality) in correcting them. She gave him a (frosty) look, but eventually smiled.", "zh": "港口上，人们（满怀期待地）排起队。一只（紧张不安的）狗扯着（柔韧的）牵引绳，一个（年老颤巍巍的）男人像（哨兵）一样守着篮子。海面只有避风的局部还（平滑如镜）。琼提醒，这种美会欺骗（毫无戒心的人）。玛拉想起夜里的（凶猛），表示赞同。一个渔民（愁苦地）谈着取消的送货，他妻子则坚定地提醒，至少没人沉船。传闻说船要开了，一阵（骚动）使大家涌向售票处。售票员（没好气地）否认：“时刻表不是愿望。”里昂赞美她纠正错误的（准时及时）。她（冷冰冰地）看了他一眼，最后还是笑了。"}, {"en": "They had an hour. They chose not to (tarry) in the ticket office, where complaints were becoming competitive. Mara asked June to sit on a (rickety) bench and recorded her telling a story about the inn. June protested (wheezily) that her voice sounded rough. Mara said that was how she sounded, and that was what she wanted. No polished tribute, no demand to appear brave. June told the story of a honeymoon couple who lost their luggage and borrowed mismatched clothes. She described them (mournfully), then laughed at a detail Mara had never heard. Her voice caught on her husband's name; the (agony) was quieter now, not erased. It was a (bitty) account, wandering and incomplete, but alive.", "zh": "她们还有一个小时。售票处里的抱怨已经开始互相攀比，她们决定不在那里（逗留）。玛拉请琼坐在一张（摇摇晃晃的）长凳上，录下她讲旅馆的故事。琼（喘着粗气地）抗议，说自己的声音不好听。玛拉说，这就是她的声音，也正是自己想要的。不需要精心润饰的赞歌，也不要求她表现勇敢。琼讲起一对度蜜月的夫妻，他们丢了行李，只能借穿不配套的衣服。她先（带着伤感地）描述，随后又因一个玛拉从未听过的细节笑起来。说到丈夫的名字，她声音哽住了；（悲痛）现在安静些了，却没有消失。叙述（零零碎碎），东拉西扯，并不完整，却活生生的。"}, {"en": "The ferry arrived at last. Basil tried to (chivy) Kit forward while Dot tried to (chivvy) Basil out of everybody's way. Ellis offered June a business card with a nod. “No hurry today. And, (incidentally), the buyers asked whether you'd leave the piano.” June said she would consider it. Nia hugged her (fervently). Leon thanked her (solemnly), then added that a piano would fit above a bookshop if the stairs allowed it. “So would a comfortable chair,” June replied. Mara grinned. She remembered hiding (covertly) behind that piano during childhood games, convinced its shadow made her invisible. She no longer needed to interpret every choice as a sign. Her mother could decide what would occupy her own rooms.", "zh": "渡轮终于到了。巴兹尔试着（催促）基特向前走，多特则试着把挡住众人去路的巴兹尔（赶开）。埃利斯点头递给琼一张名片。“今天不着急。另外，（顺便说一句），买家问你是否愿意留下钢琴。”琼说会考虑。妮娅（热烈地）拥抱她。里昂（郑重地）道谢，又补充说，只要楼梯允许，书店楼上也放得下一架钢琴。“也放得下一张舒服的椅子。”琼回答。玛拉笑了。她想起小时候游戏时，自己曾（偷偷地）躲在钢琴后面，坚信阴影能让人隐形。现在，她不再需要把母亲的每个选择都解读成某种信号。母亲可以决定自己的房间里放些什么。"}, {"en": "At the gangway, Mara hesitated. June waited without rescue. “I don't know when I'll come back,” Mara said. “Then we'll arrange something else.” She had feared becoming a (nonentity) in her mother's new life, an (accusatory) thought she could now recognise as unfair. That answer contained loss, but also room to move. Mara hugged her, no suitcase between them this time. The ferry sounded its horn; passengers began to (scurry). She boarded, looking back at the inn's (lofty) chimney, the (unsightly) patch above its door, and the woman who was more than either building or memory. June waved with her whole arm. The inn's sign swung above her; Mara watched as if (magnetically) held, then turned towards the sea.", "zh": "到了舷梯旁，玛拉犹豫了。琼等着，没有替她解围。“我不知道什么时候会回来。”玛拉说。“那我们就安排别的见面方式。”她曾害怕自己在母亲的新生活中变成一个（无足轻重的人）；现在她明白，这种带着（指责意味的）想法并不公平。那个回答里包含失落，也包含活动的空间。玛拉拥抱了她，这回两人之间没有箱子。渡轮鸣笛，旅客开始（匆匆跑动）。她登船，回头望着旅馆（高耸的）烟囱、门上方（难看的）修补痕迹，以及那个不止属于建筑、也不止属于回忆的女人。琼挥动整条胳膊。招牌在她头顶摇摆；玛拉像被（磁力般）吸住似的望着，随后转向大海。"}, {"en": "On deck, Mara opened the recording. Wind made a soft (fuzz) around her mother's voice. A soda can opened with a (fizz), interrupting the story; somebody laughed off microphone. During the dance, Kit had recorded them too without anybody noticing; his message now arrived with a photograph of a (starry) paper decoration above the piano. The recordings were technically imperfect and (singularly) precious. She resisted the impulse to edit everything into tidiness. Beyond the rail, a seabird seemed to (whiz) past, followed by another that would (whizz) out of sight before she could name it. The island diminished. Her mother's voice continued, and for the first time that morning, distance did not feel like disappearance.", "zh": "甲板上，玛拉打开录音。风在母亲的声音周围形成柔软的（杂音）。一罐汽水带着（嘶嘶声）被打开，打断了故事；麦克风之外有人笑了。跳舞时，基特也悄悄录下了她们，此刻发来消息，附着一张照片：钢琴上方挂着（星星图案的）纸饰。录音在技术上并不完美，却（格外）珍贵。她克制住把一切剪辑得整整齐齐的冲动。栏杆外，一只海鸟（嗖地飞过），随后另一只也迅速（掠过），还没等她认出名字就消失了。岛越来越小，母亲的声音却继续响着。那天早晨，她第一次觉得，距离并不等于消失。"}];
const HAS_TITLE = false;

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0), only when the file provides a title paragraph
if (HAS_TITLE) (function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  bookEl.appendChild(div);
})();

// Paragraph rows. When the file has a title paragraph it is DATA[0] and rows
// start at 1; otherwise every paragraph is a content row starting at 0.
const jumpSel = document.getElementById('jumpSel');
const FIRST_P = HAS_TITLE ? 1 : 0;
const paraNum = p => HAS_TITLE ? p : p + 1;  // DATA index -> displayed paragraph number
DATA.slice(FIRST_P).forEach((d, i) => {
  const p = FIRST_P + i;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + paraNum(p);
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + paraNum(p) + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const totalParas = HAS_TITLE ? sentences.length - 1 : sentences.length;
  const label = (HAS_TITLE && S.p === 0) ? 'Title' : ('Paragraph ' + paraNum(S.p) + ' of ' + totalParas);
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (!HAS_TITLE || S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-hpphrases2501-2867-v1';
const LS_OLD_KEY = 'audiobook-hpphrases2501-2867-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
</body>
</html>
