<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Museum of Tomorrow — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>The Museum of Tomorrow</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "The Museum of Tomorrow", "zh": "明日博物馆"}, {"en": "On the night the Museum of Tomorrow predicted its own destruction, Ada Vale arrived with a borrowed (suitcase), a broken (wristwatch), and an invitation she suspected was a mistake. Across the entrance, electric letters promised to (revolutionise) the future. Below them, a stone (gargoyle) appeared to mock the queue. Ada had once helped build the museum’s mechanical Oracle, a project intended to (nurture) curiosity rather than (deceive) customers. Now its owner called her a (nutcase), and her father’s name had fallen into (disrepute). She had come to collect his tools. She had no intention of saving anybody.", "zh": "就在明日博物馆预言自己将遭毁灭的那个夜晚，艾达·韦尔带着一只借来的(行李箱)、一块坏掉的(腕表)，以及一封她怀疑寄错了的请柬，来到了馆门前。入口上方的电子字样承诺要(彻底改变)未来。下面，一尊石雕(滴水兽)仿佛正在嘲笑排队的人群。艾达曾参与建造馆里的机械“神谕机”，原本是为了(培养)好奇心，而不是(欺骗)顾客。如今，馆主称她为(疯子)，她父亲的名声也已陷入(败坏)。她只是来取回他的工具，没打算拯救任何人。"}, {"en": "Getting there had been a warning in itself. The station (hove) into view beyond the (oncoming) traffic. Her taxi had to (swerve) around a fallen (twig), then inch along a road overlooking a (ravine). The driver supplied a (scathing) account of the owner’s success, calling him a (leech), a (knave), and a prosperous (scalawag). Ada disliked being invited to (relish) another person’s hatred. She paid, stepped into the evening (bustle), and watched a (throng) of guests make a (beeline) for the entrance.", "zh": "来时的路已经像一种警告。车站越过(迎面而来的)车流，渐渐(映入眼帘)。出租车不得不(急转方向)，避开一根落下的(细树枝)，再沿俯瞰(峡谷)的道路缓缓前行。司机对馆主的成功作了一番(尖刻的)评论，骂他是(吸血虫)、(无赖)，也是个发了财的(恶棍)。艾达不喜欢被邀请去(品味)别人的仇恨。她付钱下车，走进晚间的(喧闹忙碌)，看着一(大群人)朝入口(径直奔去)。"}, {"en": "The owner, Silas Voss, waited beneath a portrait of himself in an (immaculate) (pinstripe) suit. His painted (physique) exceeded the original by several heroic inches. In person, he was smaller, (smug), and accompanied by a (pug) whose silver (leash) cost more than Ada’s coat. “No hard feelings,” he said, offering a hand still pink from a (manicure). Ada gave it a (sidelong) look. There were considerable hard feelings. He had dismissed her father after an accident and allowed a newspaper to (besmirch) his reputation.", "zh": "馆主赛拉斯·沃斯站在自己的画像下面。画中的他穿着(一尘不染的)(细条纹)西装，(体格)比本人雄伟了好几英寸。现实中的他更矮小，神情(自鸣得意)，身旁跟着一只(巴哥犬)，银色的(牵引绳)比艾达的外套还贵。“别记仇，”他说，伸出刚做过(美甲)、仍泛着粉红的手。艾达(斜着眼)看了一下。她有充分理由记仇。一次事故后，他解雇了她父亲，还纵容报纸(玷污)他的名誉。"}, {"en": "“Your father’s things are upstairs,” Voss said. “After the demonstration.” Ada began to (bristle). Her invitation had said eight; it was almost nine. A clock’s (chime) supplied evidence. Voss pretended not to hear. His talent was knowing how long embarrassment could (immobilise) a guest. Ada, who used to (idolize) him, now found that talent (repulsive). She accepted water from a waiter whose (shirtsleeve) was damp.", "zh": "“你父亲的东西在楼上，”沃斯说，“演示结束后再拿。”艾达开始(怒气上涌)。请柬写的是八点，现在快九点了。时钟的(报时声)提供了证据，沃斯装没听见。他的本领是知道尴尬能让客人(僵在原地)多久。艾达从前曾(把他当偶像崇拜)，如今只觉得这种本领(令人厌恶)。她从一名(衬衫袖子)潮湿的侍者那里接过水。"}, {"en": "A (whiff) of perfume mingled with the (sizzle) of cooking. Somewhere a violin gave an unhappy (twang). A performer balancing on a (trapeze) appeared to (nestle) comfortably in empty air. An elderly donor in a (crinoline) skirt paused to (socialize) with a judge. Voss liked to (fraternize) with people who could call criticism bad manners. Those unable to afford admission were, in his vocabulary, (riffraff). Ada had heard him (snipe) at them from behind this (selfsame) desk.", "zh": "一(缕)香水味混着烹饪的(滋滋声)。某处的小提琴发出不悦的(铮鸣)。一位演员在(空中吊架)上保持平衡，仿佛舒舒服服地(依偎)在空气中。一位穿着(裙撑长裙)的年长捐助者停下来与法官(交际)。沃斯喜欢和那些能把批评称作失礼的人(亲密往来)。买不起门票的人，在他的词汇里就是(乌合之众)。艾达曾听见他坐在这张(正是同一张)桌子后，(出言讥讽)他们。"}, {"en": "The museum occupied a former railway station, its galleries (wending) through a (labyrinthine) network of platforms and storerooms. In the main (thoroughfare), visitors would (jostle) one another to photograph a mechanical (manticore). Children preferred a model (wolverine), while an elderly man seemed determined to (hypnotise) a stuffed (porcupine) by staring at it. A (tortoise) slept under a lamp. A nearby sign explained why a (mite) counted as an (invertebrate). Ada liked that cabinet. It made a modest claim and could support it.", "zh": "博物馆设在旧火车站里，展厅(蜿蜒穿行)于(迷宫般的)站台和储藏室网络。主要(通道)上，游客们相互(推挤)，争着拍摄一只机械(蝎尾狮)。孩子们更喜欢(狼獾)模型，而一位老人似乎想靠凝视来(催眠)一只填充标本(豪猪)。一只(陆龟)在灯下睡觉。旁边的说明介绍，一只(螨虫)为什么属于(无脊椎动物)。艾达喜欢那个展柜：它的主张不大，也拿得出依据。"}, {"en": "The next room offered no such restraint. A (nymph) in a glass pool would (undulate) under green light; a stuffed (vulture) hovered over a fake (headstone). Visitors could (drape) themselves in black fabric and pose as a (hag), or try a helmet designed to (hypnotize) its wearer. A plaque described how to (situate) a lucky (horseshoe), while artificial (mistletoe) promised romance. Two teenagers used the dim corner for a (snog). That was the first advertised result Ada could (vouch) for.", "zh": "隔壁却毫不克制。玻璃水池中的(水泽仙女)在绿光下(起伏摆动)，一只(秃鹫)标本悬在假(墓碑)上方。游客可以用黑布(披裹)自己，扮成(老巫婆)，或试戴一顶据说能(催眠)佩戴者的头盔。牌子介绍如何(摆放)幸运(马蹄铁)，人造(槲寄生)则许诺爱情。两个少年躲在暗处(亲吻)。艾达想，这是她第一个能(担保属实)的宣传效果。"}, {"en": "An (ornate) chamber promised to (conjure) the dead, another to (levitate) the living. A glass tunnel contained an artificial (stalactite) above a matching (stalagmite), both washed in (aquamarine) light. Visitors were encouraged to (gape), (fantasise), and buy spoons. A machine could (engrave) your name beside a protective (rune). Ada remembered fitting its motor. It jammed whenever customers chose more than twelve letters. Its power to (bewitch) depended on a spelling limit.", "zh": "一间(装饰华丽的)房间承诺(召唤)死者，另一间承诺让活人(悬浮)。玻璃隧道里，一根人工(钟乳石)悬在对应的(石笋)上方，两者都浸在(海蓝色)灯光中。游客被鼓励(张口惊叹)、(幻想)，然后买纪念勺。一台机器能把名字(刻在)所谓具有保护作用的(古代符文)旁。艾达记得自己安装过它的马达：名字超过十二个字母就会卡住。它的(施魔法)能力，取决于拼写长度。"}, {"en": "Voss could (embellish) any failure. A stalled motor became spiritual resistance; a broken bulb became a (startling) absence of earthly energy. To (miff) him, Ada once described the machine as expensive (guff). He called her (churlish), then threatened to (demote) her. Her father advised her not to (agitate) an employer unnecessarily. Later, he regretted helping to (dilute) her objections. Nobody meant to (destine) the place for dishonesty. They had merely let small evasions accumulate.", "zh": "沃斯能给任何失败(添油加醋)。马达停转成了灵力抵抗，灯泡损坏成了(惊人的)尘世能量消失。艾达有次为(惹恼)他，称机器是昂贵的(胡扯)。他骂她(粗鲁无礼)，威胁要将她(降职)。父亲劝她不要无谓地(刺激)雇主。后来，他后悔曾帮助(削弱)她的反对声。没有人本想让这里(注定走向)欺骗，只是任由小小的搪塞不断积累。"}, {"en": "Beneath a ceiling painted (mauve), the Oracle stood (ablaze) with lamps. Its brass face was designed to (dazzle); its eyes could (dilate), its shoulders (heave), and its mouth release artificial smoke. A concealed (bagpipe) supplied its voice. Ada’s father had made the face almost expressive. Voss supplied the claims. The machine would predict your greatest (misfortune), identify a hidden (foe), and recommend the purchase most likely to (stave) off disaster.", "zh": "在(淡紫色)天花板下，神谕机的灯光(亮得耀眼)。黄铜脸孔专为(令人眼花缭乱)而造；眼睛能够(扩张)，肩膀能够(起伏)，嘴里能够吐出人造烟雾。隐藏的(风笛)提供声音。艾达的父亲让这张脸几乎有了表情，沃斯则负责那些宣传：机器可以预测你最大的(不幸)，识别隐藏的(敌人)，并推荐最能(挡住)灾祸的商品。"}, {"en": "Ada heard a familiar (gruff) voice. “It still sounds like a duck choking on a (sardine).” Tomas Reed stood beside her, carrying a (carpetbag) of newspapers. Once a reporter of some (repute), he now reviewed restaurants after an unsuccessful investigation. He offered her a (loaf). “Payment for an honest conversation. The crust is (brittle), but the middle’s good.” Tomas had never learned to (ingratiate) himself. It was a weakness she respected.", "zh": "艾达听见一个熟悉的(粗哑)声音。“它还是像只被(沙丁鱼)卡住喉咙的鸭子。”托马斯·里德站在旁边，提着装满报纸的(毯布旅行袋)。他曾是颇有(声望)的记者，一次调查失败后，如今改写餐馆评论。他递给她一(条面包)。“换一次诚实的谈话。外皮(脆)，里面不错。”托马斯从未学会(讨好)别人。艾达尊重这个弱点。"}, {"en": "He had received his invitation with (misgiving). Voss’s secretary called him (disobliging), then offered privileged access if he would (devote) a favourable column to the launch. He declined to (regurgitate) publicity. “They want me to (commentate), not investigate. Apparently the truth is an (unwelcome) complication.” Ada asked whether he still wanted to (delve) into Voss’s business. “Yes. Though I’d rather (doze) somewhere warm and review a decent (goulash).”", "zh": "他收到请柬时就心存(疑虑)。沃斯的秘书先说他(不肯帮忙)，接着又提出，只要他(专门写)一篇正面专栏，就给他特别采访权。他拒绝(照搬复述)宣传材料。“他们想让我(解说)，不想让我调查。真相显然是个(不受欢迎的)麻烦。”艾达问他是否仍想(深入调查)沃斯的生意。“想。不过我更愿意找个暖和地方(打盹)，再评论一份像样的(匈牙利炖牛肉)。”"}, {"en": "They found a (snug) corner behind a (bookcase). Several wealthy visitors had received predictions which later came true. One lost a shop to fire; another suffered a mysterious (puncture) on a lonely road. Each first rejected Voss’s protection service. A third, now (disconsolate), sold a company cheaply after the Oracle announced its imminent (demise). The buyer was Voss’s cousin. The land bordered a proposed road: acquire it, (pave) the route, and sell at a profit. A survey showed a wet (bog) which brochures called a scenic garden. “Coincidence?” Ada asked. Tomas gave a (shrug). “Perhaps. But coincidence has a consistent (payoff).”", "zh": "两人在(书柜)后找到一个(舒适隐蔽的)角落。几位富有游客得到的预言后来都应验了：一人的店铺遭火灾，另一人在偏僻公路上莫名其妙地(爆胎)。他们此前都拒绝购买沃斯的保护服务。第三人如今(悲伤失落)，在神谕机预告公司即将(灭亡)后，低价卖掉了企业。买家是沃斯的表亲。土地紧邻规划道路：买下它，(铺好)道路，再转卖获利。勘察图上的湿(沼泽)，在宣传册里成了景观花园。“巧合？”艾达问。托马斯(耸耸肩)。“也许。但这种巧合的(收益)可真稳定。”"}, {"en": "He unfolded a (sheaf) of notes. Dates and payments formed a (serpentine) pattern across the page. Ada began to (pore) over them. Her father had accused Voss of altering the machine, but nobody asked what the alterations did. Newspapers called him a (vindictive) employee. “They preferred to (ridicule) him rather than inspect a cable,” she said. Tomas nodded. “The most (wearisome) part of reporting is explaining that something can be both (mundane) and important.”", "zh": "他展开一(沓)笔记。日期和付款记录在纸上连成(蛇形蜿蜒的)图案。艾达开始(细读)。父亲指控沃斯改动了机器，却没人问那些改动有什么用途。报纸只说他是个(怀恨报复的)员工。“他们宁可(嘲笑)他，也不肯检查一根电线。”托马斯点头：“报道最(令人厌倦的)部分，就是解释一件事可以既(平凡)，又重要。”"}, {"en": "A girl appeared at Ada’s elbow, wearing a (pinafore), a red (rosette), and an (apprehensive) expression. “Are you the clock lady?” Her name was Elsie; her mother operated the puppet stage. The Oracle had predicted that someone she loved would disappear before midnight. Her mother laughed, but Elsie had seen a man carry fuel cans behind the scenery. “He said not to (prattle).” She rubbed a (bruise) on her wrist. This was no longer a piece of (intrigue) for adults to enjoy. “Show me where,” Ada said.", "zh": "一个女孩出现在艾达身边，穿着(围裙式连衣裙)，戴着红色(玫瑰结饰)，神情(忐忑不安)。“你是修钟的女士吗？”她叫埃尔西，母亲负责木偶舞台。神谕机预言，她所爱的人会在午夜前消失。母亲笑了，她却看见有人把燃料罐搬到布景后面。“他叫我别(喋喋不休)。”她揉着手腕上的(淤青)。这不再是供大人消遣的(阴谋故事)。“带我去看看，”艾达说。"}, {"en": "Elsie led them past a (secretive) couple speaking in an (undertone). The man seemed to (fume); the woman kept smoothing a (crease) in her (blouse). A (pomegranate) cocktail glowed beside them. Polished surfaces seemed to (radiate) confidence. Ada wondered how much (woe) could fit beneath so much (gilding). The thought did not (discompose) Voss, who was explaining that doubt could (indispose) the spirit.", "zh": "埃尔西领着他们经过一对(神神秘秘的)男女，两人(低声)说话。男人似乎在(生闷气)，女人不断抚平(女衬衫)上的一道(褶皱)。旁边的(石榴)鸡尾酒泛着光。抛光的表面仿佛都在(散发)自信。艾达不禁想，这么多(镀金装饰)下面藏得下多少(悲苦)。这个念头丝毫没有(扰乱)沃斯，他正解释怀疑会使精神(不适)。"}, {"en": "They crossed a gallery of remedies. Beside a mortar and (pestle), jars displayed (wolfsbane), (hellebore), and (aconite), each labelled poisonous. A wax patient lay (supine), a painted (pustule) on his neck. Another model showed a blocked (windpipe). Voss’s commentary encouraged visitors to (scoff) at earlier ignorance, then directed them towards his own untested cures. Tomas called it “a medicinal dose of historical (humbug)”.", "zh": "他们穿过旧疗法展厅。(研杵)与研钵旁，罐子里陈列着(狼毒乌头)、(铁筷子)和(乌头)，都标有毒性警告。一个蜡制病人(仰卧着)，脖子上画着(脓疱)；另一个模型展示堵塞的(气管)。沃斯的解说鼓励游客(讥笑)古人的无知，然后把他们引向自己未经检验的疗法。托马斯称其为“一剂药用的历史(骗局)”。"}, {"en": "Elsie pointed to a service door. Its (fastening) was new, its paint already (chipping). Ada noticed a (minuscule) (hairline) gap beside the hinge and a dark (splotch) on the floor. She bent to (sniff). Oil, not petrol: some (reassurance), though not enough. Through the door came a metallic (clang), then a motor’s (drone). Someone began (whistling). Ada told Elsie to return to her mother and wait.", "zh": "埃尔西指向一扇维修门。(锁扣)是新的，油漆却已经(剥落)。艾达注意到铰链旁一条(极微小的)(发丝般裂缝)，以及地板上的黑色(污斑)。她弯腰(嗅了嗅)：是润滑油，不是汽油，多少令人(安心)，但还不够。门后传来金属(铿锵声)，随后是马达的(嗡鸣)。有人开始(吹口哨)。艾达叫埃尔西回母亲身边等着。"}, {"en": "She watched the child (tiptoe) away, then tried to (jog) her memory. Behind the door lay an (incline) leading to the engine room. Neglect could (dilapidate) any building, but this lock was new. Someone had chosen to (sideline) maintenance. Tomas suggested finding the plans. Ada hesitated. Being right did not erase the habit of expecting rejection.", "zh": "她看着孩子(踮脚)离开，试着(唤起)记忆。门后有一道通往机房的(斜坡)。失修能让任何建筑(破败)，可锁是新的。有人是有意把维护工作(搁置一边)。托马斯建议找图纸。艾达犹豫了：即使自己有理，也很难摆脱预期遭拒的习惯。"}, {"en": "A guard appeared before they could (prise) the door open. He was an (outsize) man with a (wolfish) smile and a scar across one (cheekbone). “Private.” Tomas attempted to (broach) the matter politely. The guard offered a (rebuff) consisting chiefly of his chest. Ada wanted to (interrogate) him, but an argument would (aggravate) Elsie’s fear. She allowed him to (shove) them towards the gallery. His shoe left a (scuff) on the marble.", "zh": "还没等他们(撬开)门，保安就出现了。他是个(体型庞大)的男人，笑容像(狼一般)，一道伤疤横过(颧骨)。“闲人免进。”托马斯试着礼貌地(提出)问题，保安主要用胸膛作出了(生硬拒绝)。艾达想(盘问)他，但争吵只会(加重)埃尔西的恐惧。她任由他把他们(推回)展厅。他的鞋在大理石上留下了一道(擦痕)。"}, {"en": "Voss stood on a (trestle) platform and began to (intone) his welcome. Guests could (congregate) around him or watch through a (periscope) display. He promised to (mesmerise) doubters and (enrapture) believers. Waiters tried to (sate) the audience with (bouillabaisse), (meringue), and chocolate (mousse). A woman busy (dieting) refused everything, then stole a spoonful from her husband. A chef used a (superfine) sieve to turn (tripe) into something fashionable. Even (mash) acquired prestige if its sauce contained enough syllables. Ada refused to (despise) people for enjoying dinner. Tomas took a (swig) of water. “Nothing helps deception like good catering.”", "zh": "沃斯站上(支架式)平台，开始(拖长声调宣布)欢迎词。客人可以(聚集)到他周围，也可以通过(潜望镜)装置观看。他保证让怀疑者(着迷)、让信徒(心醉)。侍者们试图用(法式海鲜汤)、(蛋白霜甜点)和巧克力(慕斯)(满足)观众的食欲。一位正在(节食)的女士拒绝所有食物，却偷吃丈夫盘里的一勺。厨师用(极细的)筛子把(牛肚)做得时髦。只要酱汁名字够长，连(土豆泥)都能身价倍增。艾达不愿因为人们喜欢晚餐就(鄙视)他们。托马斯喝了一(大口)水：“没有什么比好吃好喝更能帮骗局的忙。”"}, {"en": "The show opened with a puppet (troupe). A (marionette) in a feathered (ruff) attempted a (pirouette), lost its hat, and accused a wooden (crone) of theft. The witch threatened to (accurse) the kingdom “(evermore)”; the king intended to reign “(forevermore)”. Someone gave a delighted (chortle). Elsie’s mother, Mara, supplied both voices. Her hands could (weave) six strings into a convincing argument.", "zh": "开场的是木偶(剧团)。一个戴着羽毛(皱领)的(提线木偶)尝试(脚尖旋转)，帽子掉了，便指控一位木制(老太婆)偷窃。女巫威胁要“(永远)”(诅咒)王国，国王则打算“(直到永远)”统治。有人发出愉快的(咯咯笑声)。埃尔西的母亲玛拉同时配两种声音，她的双手能把六根线(编织)成一场可信的争执。"}, {"en": "The king’s bald (pate) bore a purple (blotch). His horse would (galumph), his minister would (slouch), and his queen threatened to (elope) with the musician holding a (lute). A little dog could (wag) its tail by means of a spring. The plot was (grotesque), but its makers never pretended otherwise. Mara could (intersperse) a (jig) with a political joke and still let children see the strings. That honesty was more (subversive) than anything the Oracle said.", "zh": "国王秃秃的(脑袋)上有块紫色(斑痕)。他的马会(笨重地蹦跳)，大臣会(懒散地坐着)，王后则威胁和拿着(鲁特琴)的乐师(私奔)。一只小狗靠弹簧(摇摆)尾巴。剧情(荒诞怪异)，但创作者从不假装不是。玛拉能在政治笑话中(穿插)一段(吉格舞)，同时让孩子看见操纵线。这种诚实，比神谕机说过的任何话都更具(颠覆性)。"}, {"en": "Voss followed with a (spoof) about science. A (snobbish) professor tried to (recite) equations, interrupted by an (oaf) carrying a (jug). The jokes were (derisive), the message simple: experts complicated what instinct understood. Tomas found that (troubling). Ada watched the stage. A new trapdoor crossed its centre; fresh (scraping) marked the floor. Her father’s service lift was underneath. It was built for scenery, never people. Its lower (railing) had been removed. A replacement cord began to (sag) when touched. Ada felt (foreboding). A (snag) in machinery did not become safer because raising objections was called (mulish).", "zh": "沃斯接着上演科学(讽刺模仿剧)。一个(势利的)教授试图(背诵)公式，却被提着(水罐)的(笨汉)打断。笑话充满(嘲弄)，主旨很简单：专家把直觉能理解的事情弄复杂了。托马斯觉得这(令人不安)。艾达却看着舞台：一道新活板门横穿中央，地板有新鲜的(刮擦痕迹)。下面是父亲造的货梯，只能运布景，不能载人。下层(栏杆)被拆了，替代绳索一碰就(下垂)。艾达有种(不祥预感)。把提出意见称为(顽固)，不会让机械(故障)变安全。"}, {"en": "Voss invited an (unsuspecting) woman to name a fear. She admitted fearing illness. The Oracle’s eyes began to (revolve); smoke rose in a (plume). A mechanical (wheeze) preceded its answer: “Beware the red door.” The woman began to (blanch). Her surgery had a red entrance. Applause would (punctuate) every revelation, leaving no room for questions. Ada noticed an attendant’s (furtive) hand. He had collected information cards earlier. An (inattentive) guest might miss his movement; an (attentive) one might mistake it for adjusting a chair. Voss could (imbue) an ordinary gesture with mystery, then offer a (surrogate) explanation. The attendant’s fingers moved over an (unobtrusive) keyboard.", "zh": "沃斯邀请一位(毫无戒心的)女士说出恐惧。她怕生病。神谕机的眼睛开始(转动)，烟雾升成一股(羽状烟柱)。一声机械(喘鸣)后，它回答：“小心红门。”女士开始(脸色发白)：她的诊所有扇红门。掌声给每次揭秘(加上停顿)，不给问题留位置。艾达注意到侍从一只(鬼祟的)手。他早先收过信息卡。(不留心的)游客可能忽略他的动作，(专注的)游客则可能误以为他在调椅子。沃斯能为普通动作(赋予)神秘感，再提供一个(替代的)解释。那人的手指正在一块(不起眼的)键盘上移动。"}, {"en": "“The answers are supplied,” Ada whispered. Tomas looked (pensive). “Can you prove it?” She could (surmise) where the wires ran, but a guess would not (outweigh) a roomful of astonishment. She needed to (devise) a test. “Ask something nobody here knows.” Tomas approached the stage. Voss’s smile grew (gruesome). “A journalist! How (instructive). Shall we predict whether his readers will return?” Laughter helped (subdue) the room’s brief (unease).", "zh": "“答案是有人输入的，”艾达低声说。托马斯神情(沉思)：“能证明吗？”她能(猜测)电线走向，但猜测不足以(压过)满屋惊叹。她需要(设计)一个测试：“问一件这里没人知道的事。”托马斯走向舞台，沃斯的笑容变得(阴森)。“记者！多么(有教育意义)。要预测读者还会不会回来吗？”笑声帮助(压下)了房间里短暂的(不安)。"}, {"en": "Tomas asked what was inside his bag. “Books and regret,” answered the Oracle. More laughter. A general answer could (tantalise) without risking accuracy. Tomas demanded a number. Voss became (dismissive). “This isn’t a counting toy.” Ada said even a counting toy should withstand testing. Voss could no longer (confine) the exchange to mockery. He looked towards the guard.", "zh": "托马斯问包里有什么。“书和遗憾。”人群又笑了。泛泛的回答能(吊人胃口)，又不冒准确性的风险。托马斯要求说出数量。沃斯变得(不屑)：“这不是计数玩具。”艾达说，计数玩具也应该经得住检验。沃斯无法再把交锋(限制)在嘲讽上，便望向保安。"}, {"en": "Ada saw him (clench) his jaw. A little (spittle) shone beside his mouth. It was easy to (nettle) him, harder to make him answer. He interrupted Tomas with a (brute) burst of sound. Speakers would (blare), lamps would (scintillate), and the next effect would supposedly (culminate) in a glimpse of tomorrow. “Pure (balderdash),” Tomas whispered.", "zh": "艾达看见他(咬紧)下巴，嘴角闪着一点(唾沫)。要(惹恼)他很容易，要他回答却很难。他用一阵(蛮横的)扩音声打断托马斯。扬声器开始(轰鸣)，灯光开始(闪耀)，下一个效果据说将以窥见明日作为(高潮)。“纯粹的(胡说八道)，”托马斯低语。"}, {"en": "The Oracle turned towards the balcony, where Mara and Elsie stood. “Before midnight, the faithless shall lose what they love.” A speaker made the words (reverberate). The lights went out. Ada heard feet (scurrying), a chair (lurch), and a (screech) beneath the stage. When the lights returned, Mara was alone. Whatever might (transpire) now, Voss had lost control.", "zh": "神谕机转向玛拉和埃尔西所在的阳台：“午夜之前，不信者将失去所爱。”扬声器让话语(回荡)。灯光熄灭。艾达听见脚步(急窜)、椅子(猛然移动)，以及舞台下的(尖叫)。灯亮时，玛拉身边已没有孩子。不管接下来会(发生)什么，沃斯都已失控。"}, {"en": "Ada remained briefly in a (daze). The noise was designed to (disorientate); darkness invited a (headlong) rush. She resisted both. A (sighting) of red fabric near the stage gave her direction. There was no (brainwave), only a (hunch): a frightened child might seek the thing she believed caused the threat. “The controls,” she told Tomas.", "zh": "艾达短暂地陷入(恍惚)。噪声意在(扰乱方向感)，黑暗诱使人(不顾一切地冲撞)，她强迫自己抵抗两者。舞台附近红布的(出现)给了她方向。这不是(灵光一现)，只是(直觉)：受惊的孩子可能去寻找她认为造成威胁的东西。“控制器，”她对托马斯说。"}, {"en": "First came a (rustle), then a rising (whine) of speculation. A woman began to (gesticulate). Voss raised a (megaphone). “The child is part of the demonstration. The answer is (nigh).” Mara’s face made that impossible to believe. She tried to (implore) him, then grabbed his arm. The guard moved to (extricate) his employer. Ada intervened. “Where is she?” Her quiet voice seemed to (startle) Voss.", "zh": "先是一阵(窸窣声)，然后是越来越高的猜疑(哀鸣)。一位女士开始(激动地比画)。沃斯举起(扩音器)：“孩子是演示的一部分。答案(即将到来)。”玛拉的表情让这话无法令人信服。她试图(恳求)，继而抓住他的手臂。保安上前替雇主(解围)。艾达插进来：“她在哪儿？”她平静的声音反倒(惊住)了沃斯。"}, {"en": "“I (presume) backstage.” Beneath his (poise), Ada saw uncertainty. Perhaps he had planned a disappearance, but not this one. Machinery could go (haywire); children could take the wrong stairs. He ordered the guard to (confiscate) Tomas’s camera and (disperse) the audience. Ada refused to move. Voss tried to (overrule) her. Mara answered with a word that would (scandalise) donors for years.", "zh": "“我(想)在后台。”他的(镇定)下面，艾达看见了不确定。也许他计划过失踪，但不是这一次。机器会(失灵)，孩子会走错楼梯。他命令保安(没收)相机、(疏散)观众。艾达不动。沃斯试图(推翻)她的决定。玛拉用一个足以让捐助者们多年后仍(震惊)的词回答。"}, {"en": "Behind the puppet curtain, Ada found a ribbon beside the trapdoor. She had to (crouch) to inspect a fresh (gash) in the wood. The lift gave a slow (chuff). Somebody had released it. Elsie answered from below, her voice (hoarse) but clear. “I thought I could turn it off.” She had climbed down during the blackout. Then the platform moved.", "zh": "木偶帘后，艾达在活板门旁找到丝带。她(蹲下)检查木头上一道新的(裂口)。货梯发出低低的(噗噗声)，有人释放了它。埃尔西从下面应声，声音(沙哑)但清晰：“我以为能把它关掉。”她在断电时爬了下去，然后平台动了。"}, {"en": "Ada wanted to (gnash) her teeth. Instead, she told Elsie not to (thrash) around or (tug) anything. There came a soft (scrunch), then tearing fabric. She asked Mara to prepare a rescue strap as a (sling). Fear could (parch) her mouth without changing what she needed to do.", "zh": "艾达真想(咬牙切齿)，却只是叫埃尔西别(乱扑腾)，也别(拉扯)任何东西。下面传来轻轻的(挤压声)，接着是布料撕裂声。她让玛拉把救援带准备成(吊带)。恐惧可以让嘴巴(干透)，却不能改变必须做的事。"}, {"en": "Mara went (prostrate) beside the opening. Ada asked her to move back. Below lay a coal (chute), a ladder, and a maintenance platform above a drain. The lift could (mutilate) anyone beneath it; a damaged pipe could (rupture). Her father had warned Voss in writing. Voss had called the warning disloyalty. Ada sent Tomas to the control room. “Don’t let anybody (flog) you another explanation.”", "zh": "玛拉(俯伏)在洞口旁。艾达请她退后。下面有运煤(滑槽)、梯子和排水道上的维修平台。货梯可能(压残)被困者，受损水管也可能(破裂)。父亲早就写信警告过，沃斯却称其为不忠。艾达让托马斯去控制室：“别再让谁向你(兜售)另一套解释。”"}, {"en": "Mara insisted on helping. Holding the torch stopped her hands (fidgeting). Tomas went to (procure) a key from the guard, who seemed ready to (lash) out until visitors surrounded him. “Don’t (botch) this any further,” Tomas said. The man moved. A crowd could become an (underdog)’s unexpected protection.", "zh": "玛拉坚持帮忙。握住手电，让她的双手不再(不安乱动)。托马斯去向保安(取得)钥匙。那人似乎准备(动手攻击)，直到游客围住他。“别再把事情(搞砸)，”托马斯说。保安让开了。人群有时也能成为(弱者)意外的保护。"}, {"en": "Tomas followed a diagram through a (threadbare) corridor. Ada descended, testing every (rung). The shaft smelled of (grime). A (stench) of oil seemed to (emanate) from the walls; the noise began to (grate) on her concentration. A bolt would (rattle) whenever the motor began to (pulsate). Elsie’s ribbon was caught in a wheel. A (fluttering) end was all Ada could see. “We’ll cut it.” She felt a (pang) of anger at herself for letting Elsie leave alone.", "zh": "托马斯沿图纸穿过一条(破旧的)走廊。艾达向下爬，检查每一级(梯档)。井道有(积垢)的味道。油的(恶臭)仿佛从墙里(散发)，噪声开始(折磨)她的注意力。马达每次(有节奏地震动)，螺栓便(咔嗒作响)。埃尔西的丝带卡在轮子里，艾达最初只看见(飘动的)末端。“我们把它剪断。”想到自己让女孩独自离开，她感到一阵自责的(刺痛)。"}, {"en": "The control room contained a sleeping technician. Tomas had to (rouse) Oren from a (snooze). He woke with a (snore), then a (hiccough). He had been told the mechanism was locked and had taken his break. Seeing the monitor, he pressed the emergency stop. Nothing happened. It had been bypassed. “That (swine). He wanted the Oracle moving during the blackout.”", "zh": "控制室里，一名技术员在睡觉。托马斯不得不把奥伦从(小睡)中(唤醒)。他先打了声(鼾)，又打了个(嗝)。有人告诉他机械已锁定，他才去休息。看见监视器后，他按紧急停止，毫无反应：开关被绕过了。“那个(混蛋)。他想让神谕机在熄灯时继续动。”"}, {"en": "Below, the lift began to (hurtle) through its upper section. Its brake was slipping. Ada needed to get Elsie into a recess, but a rusty (cog) blocked the panel. Her hands began to (perspire). She tried to (cleave) the rotten trim; the blade bent. Her father’s advice returned: find something solid, then find what supports it. She struck a support pin sideways and pulled the panel free.", "zh": "下面，货梯开始从上段(猛冲)下来，制动器正在打滑。艾达必须把埃尔西带进凹处，可一个生锈的(齿轮)挡着面板。她的手开始(出汗)。她试图(劈开)腐朽边框，刀片却弯了。父亲的建议浮上来：找到坚固的东西，再看是什么支撑它。她横向击打支撑销，把面板拉开。"}, {"en": "Elsie squeezed through. Ada followed as a (fearsome) grinding noise passed overhead. The lift stopped with a (convulsive) shudder. Dust threatened to (suffocate) them. Elsie began to (retch). Ada covered the girl’s mouth and nose with her scarf without obstructing her breathing. A smell of something beginning to (scorch) was (alarming), but no flame followed. Oren had cut power at the main board.", "zh": "埃尔西钻进去，艾达紧跟着。一阵(可怕的)研磨声掠过头顶，货梯(痉挛般)震动后停下。灰尘几乎让人(窒息)，埃尔西开始(干呕)。艾达用围巾遮住她口鼻，又不妨碍呼吸。有东西开始(焦灼)的气味(令人警觉)，但没有火焰。奥伦已切断总电源。"}, {"en": "Voss demanded that he restore the show. Oren refused to (bate) his opposition. “You can (nag) me tomorrow.” The (obstinate) owner shouted, but the technician remained (resolute). Habit urged obedience; the monitor showed why that would be wrong. This time he chose the image.", "zh": "沃斯要求恢复演出。奥伦不肯(减弱)反对：“明天你再(唠叨)我。”(固执的)馆主大喊，技术员仍然(坚定)。习惯催促他服从，屏幕却显示服从为何危险。这次他选择相信画面。"}, {"en": "Water began to (ooze) through a wall’s (fissure). The drainage channel was backing up. It could (contaminate) electrical equipment and make rescue harder. Elsie spotted a ladder beyond a narrow opening. Ada had forgotten it. Her father insisted on a second exit; Voss complained it would (disfigure) the set. For once, a complaint had failed.", "zh": "水从墙壁(裂缝)里(渗出)，排水道正在倒灌。它可能(污染)电气设备，让救援更难。埃尔西发现窄口后还有梯子。艾达已经忘记了。父亲坚持设置第二出口，沃斯曾抱怨它会(破坏)布景外观。这一次，抱怨没有得逞。"}, {"en": "Ada asked Elsie to (grope) for a handhold beneath (peeling) paint. A loose cable gave a (twitch). Water would (squelch) beneath their feet. “Just the next step,” Ada said, (steadying) herself as much as the child.", "zh": "艾达让埃尔西在(剥落的)油漆下小心(摸索)抓手。一根松电缆偶尔(抽动)，脚下的水(扑哧作响)。“只管下一步，”艾达说，同时也在让自己(稳定下来)。"}, {"en": "It was a (slog). Ada had to (wrestle) a bent cover free and (manoeuvre) Elsie around a bracket that scraped her (midriff). A rat tried to (scuttle) past, making them (flinch). Water began to (drench) Ada’s shoes. She resisted (haste). Above them appeared Mara’s torch. A (jarring), almost (excruciating) pain crossed Ada’s shoulder as she reached up, but the remaining distance was short.", "zh": "这是一场(苦干)。艾达必须(用力扳开)弯曲的盖板，再(巧妙引导)埃尔西绕过支架，支架擦伤了她的(腹部)。一只老鼠试图(窜过去)，吓得两人(一缩)。水开始(浸透)艾达的鞋，她克制(急躁)。玛拉的手电出现在上方。伸手时，一阵(猛烈的)、几乎(难以忍受的)肩痛袭来，好在距离已经不远。"}, {"en": "They emerged beside a model (stagecoach) and a mechanical (carthorse), its artificial (mane) hanging over one painted eye. Elsie collapsed onto a (hearthrug). Mara held her tightly. Someone attempted a photograph; her (glare) stopped him. Elsie could (cling) to her mother. Rescue was not an opportunity to (recapture) public attention. The child began to (grizzle) with exhaustion. Ada sat beside the horse’s oversized (hoof) and discovered her knees were shaking.", "zh": "她们从(驿站马车)模型和机械(拉车马)旁出来，假(鬃毛)盖着马的一只眼睛。埃尔西倒在(炉前地毯)上，玛拉紧紧抱住她。有人想拍照，被她的(怒视)制止。孩子可以(依偎紧抱)母亲。救援不是(重新夺取)公众注意力的机会。埃尔西累得(哭哭啼啼)，艾达坐在硕大的(马蹄)旁，发现自己双膝发抖。"}, {"en": "A sudden (jag) of nausea bent her forward. She was not normally (squeamish), but exhaustion had different rules. She began to (wring) water from her coat while Mara found Elsie a dry place to (perch).", "zh": "一阵突如其来的恶心(发作)让她弯下腰。她平常并不(容易反胃)，但疲惫有自己的规则。她开始(拧出)外套里的水，玛拉则给埃尔西找个干燥地方(坐下)。"}, {"en": "While an ambulance was called, Ada took a (respite) beside a window. Outside, (drizzle) began to (mottle) the pavement; a wet (sycamore) (bough) brushed the glass. A weather (vane) turned above the roof. The ordinary world continued without any machine’s permission. The thought was (restorative). She wanted to (laze) and let responsibility belong to somebody else.", "zh": "等待救护车时，艾达在窗边获得片刻(喘息)。外面，(毛毛雨)给路面(染上斑点)，湿漉漉的(槭树)(大树枝)擦着玻璃。屋顶上的风向(标)转动着。普通世界继续运转，无须机器许可。这个念头令人(恢复精神)。她只想(懒懒休息)，把责任交给别人。"}, {"en": "Below, a (hedgehog) moved beneath a (sapling), and a (lacewing) rested on the (windowpane). Rain would (douse) the evening’s remaining heat. Ada watched a leaf (swing) and let her fear (abate). A (hosepipe) crossed a model cottage with a roof of (thatch); its path led towards a miniature (quagmire). The designers understood natural hazards better than the owner understood artificial ones.", "zh": "下面，一只(刺猬)从(幼树)下经过，(草蛉)停在(窗玻璃)上。雨会(浇灭)傍晚残余的热气。艾达看着叶子(摇摆)，让恐惧(减退)。一根(浇水软管)横在(茅草)屋顶的模型小屋旁，小径通向微型(泥潭)。设计师对自然危险的理解，比馆主对人造危险的理解更好。"}, {"en": "Tomas returned with a box of scripts, payment records, and maps. One instruction described how to (clog) a fuel line. Another recorded payments to someone who could (intimidate) reluctant customers. A third priced the work to (demolish) a damaged shop. It was a (trove) of ordinary invoices. Fraud, like honest business, needed somebody to arrange delivery.", "zh": "托马斯带回一箱脚本、付款记录和地图。一份指示描述如何(堵塞)燃料管线，另一份记录付钱给能够(恐吓)不情愿客户的人，还有一份标明(拆毁)受损商铺的费用。这是一座普通发票组成的(宝库)。欺诈和正当生意一样，也需要安排送货的人。"}, {"en": "After careful (prompting), Oren explained the cans: oil and liquid for the smoke system. No fire was planned tonight, as far as he knew. The earlier shop fire required investigation. Ada would not add to evidence merely because the truth already looked (appalling). Some questions needed time.", "zh": "经过仔细(提示询问)，奥伦解释了罐子：里面是润滑油和烟雾系统液体。据他所知，今晚没安排火灾，先前商店的火则需要调查。艾达不会因为真相已足够(骇人)，就擅自增添证据。有些问题需要时间。"}, {"en": "Voss appeared, looking (woebegone). “An employee exceeded instructions.” Asked which employee, he became (obtuse). He tried to (disguise) panic as injured dignity. He offered to (reinstate) Ada’s father, repair the machinery, and (formalise) compensation. They need only return the box. “You could (revive) his career tonight.” Ada answered, “You could have avoided destroying it.”", "zh": "沃斯出现了，神情(愁苦)。“员工超出了指示。”被问是哪位，他便变得(迟钝含糊)。他试图把慌张(伪装)成受辱的尊严，提出让艾达父亲(复职)、修理机器、(正式确定)赔偿，只要他们归还箱子。“你今晚就能(重振)他的事业。”艾达回答：“你原本可以不毁掉它。”"}, {"en": "The proposal might once have been able to (ensnare) her. “You don’t get to (deprive) him of his name and sell it back.” Voss accused resentment of helping (inflame) her judgement and asked Tomas not to (perpetrate) reputational murder. Oren blocked the approaching guard. He had seen the bypassed circuit. Voss’s habit of (nipping) criticism in the bud could not erase it. Another lecture might (exasperate) him, but could no longer purchase obedience.", "zh": "这提议从前也许能(诱捕)她。“你不能先(剥夺)他的名誉，再卖还给他。”沃斯指责怨恨正在(激化)她的判断，又求托马斯不要(实施)名誉谋杀。奥伦挡住上前的保安。他看见了被绕过的安全电路。沃斯把批评(扼杀在萌芽中)的习惯，也抹不掉事实。再训话或许能(激怒)他，却不能再买到服从。"}, {"en": "Voss said journalists would (assassinate) his character and (persecute) employees. Tomas replied that questions were not punishment. An honest explanation should not (aggrieve) an honest businessman. Voss called him a rival’s (lapdog). “Then you shouldn’t have made the paperwork so (astounding). It almost investigates itself.” The joke failed to (abash) Voss but made two frightened employees laugh.", "zh": "沃斯说记者会(毁灭性攻击)他的人格、(迫害)员工。托马斯回答，提问不是惩罚，诚实解释不该让诚实商人(受委屈)。沃斯骂他是对手的(走狗)。“那你就不该把文件做得这么(惊人)。它几乎会自己调查自己。”笑话没让沃斯(羞惭)，却让两个害怕的员工笑了。"}, {"en": "He began to (berate) Ada for trespassing, Oren for sleeping, and Mara for inadequate supervision. Each sentence cost him allies. The woman with the red surgery door demanded an explanation. Tomas showed her information card. Her private fear had become entertainment. Silence did more to (deflate) Voss than any accusation.", "zh": "他开始(痛斥)艾达擅闯、奥伦睡觉、玛拉看管不力。每句话都让他失去盟友。那位诊所有红门的女士要求解释，托马斯展示了她的信息卡。她私人的恐惧变成了娱乐。沉默比指控更能让沃斯(泄气)。"}, {"en": "He warned that employees would (starve) if publicity closed the museum. It was an attempt to (entwine) their livelihoods with his innocence. Ada refused to (squash) evidence to preserve work that deceived the next family. Trust might (wane), but concealment would eventually (devastate) it.", "zh": "他警告，负面报道关掉博物馆，员工就会(挨饿)。他试图把他们的生计与自己的清白(缠绕在一起)。艾达拒绝为保住欺骗下一家人的工作而(压下)证据。信任可能(衰减)，但隐瞒终会把它(彻底毁掉)。"}, {"en": "Ada returned to the stage. She would not (rhapsodise) about reason or (patronize) believers; she had believed too. She opened the Oracle’s back. A keyboard selected phrases, bellows made smoke, and an operator combined personal information with broad claims. It did not (conceive) predictions. It rearranged information.", "zh": "艾达回到台上。她不会(热情高谈)理性，也不会(居高临下对待)信徒，她也曾相信。她打开神谕机后盖：键盘选句子，风箱造烟，操作员把个人资料和宽泛说法拼在一起。机器并不(构想)预言，只是在重排信息。"}, {"en": "She removed (fluff) from a filter and displayed a valve. Run too long, the smoke effect would (fizzle); its liquid would (evaporate). Nothing supernatural prevented either. “This is not an (antidote) to uncertainty.” She invited visitors to (contemplate) the difference between an impressive claim and one that survived testing.", "zh": "她取下过滤器上的(绒屑)，展示一个阀门。运行太久，烟雾效果就会(渐渐失效)，液体就会(蒸发)。“它不是消除不确定性的(解药)。”她邀请游客(思考)：令人印象深刻的说法，与经得住检验的说法，有何区别。"}, {"en": "The (morose) man who sold his company volunteered for another demonstration. Without his card, the Oracle warned him about “a familiar face”. “My dentist? Or the mirror?” Laughter returned, no longer protecting Voss. Ada then read a specific fact from the card to show how easily the machine could (bamboozle) them. Explaining the trick did not make its victims foolish. It made the trick visible.", "zh": "卖掉公司的(郁郁不乐的)男人自愿再试一次。不用他的卡，神谕机警告“小心熟悉的面孔”。“牙医？还是镜子？”笑声回来了，不再保护沃斯。艾达随后读出卡上的具体事实，展示机器多么容易(蒙骗)他们。揭露戏法不会让受害者显得愚蠢，只会让戏法变得可见。"}, {"en": "Some looked (appreciative); others showed (distaste). Ada understood why people might (crave) certainty, but no one could (dispense) it from a brass mouth. The Oracle could not remain permission to (skive) the work of judgement. Visitors could disagree. That was a freedom the machine never offered.", "zh": "有人(表示赞赏)，有人流露(反感)。艾达理解人们为何(渴望)确定性，但没有人能从黄铜嘴里(发放)它。神谕机不能继续成为人们(逃避)判断工作的许可证。游客可以不同意，这正是机器从未提供的自由。"}, {"en": "The financial backer, a woman Voss dismissed as (meddlesome), requested the accounts. She would (liaise) with investigators, (appraise) the damage, and suspend the show. She would neither (quash) complaints nor let Voss (shelve) safety reports. Deciding whom to (prosecute) belonged to the authorities, but the evidence could reach them.", "zh": "出资人是位被沃斯称为(爱管闲事)的女士。她索要账目，表示会与调查者(联络)、(评估)损失、暂停演出。她既不会(压制)投诉，也不会让沃斯继续(搁置)安全报告。该(起诉)谁由当局决定，但证据可以交到他们手里。"}, {"en": "Voss called the evening an artistic experiment intended to (scandalize) conventional thinking. Tomas asked whether the invoices were art too. Words could not (transfigure) fraud into performance. “Consider it (checkmate),” the backer said. Ada disliked the comparison. This had not been a game, and Elsie was not a piece.", "zh": "沃斯称今晚是旨在(震撼冒犯)传统思维的艺术实验。托马斯问发票是否也是艺术。言辞无法把欺诈(变形升华)成表演。“算你被(将死)了，”出资人说。艾达不喜欢这比喻：这不是棋局，埃尔西也不是棋子。"}, {"en": "One visitor began to (brandish) his ticket and demand a refund. Another suggested smashing the Oracle. Ada refused to (obliterate) the mechanism explaining the deception. Her father’s craftsmanship remained. It was neither prophet nor (ogre), only parts. That distinction would not (amuse) everybody, but it mattered.", "zh": "一位游客开始(挥舞)门票要求退款，另一位建议砸机器。艾达拒绝(抹除)解释骗局的机制，父亲的手艺还在。它既非先知，也非(食人魔)，只是零件。这一区别未必让所有人(愉快)，却很重要。"}, {"en": "Elsie asked if she had ruined everything. Ada did not want to (reprove) her, but climbing into machinery had been dangerous. “You wanted to protect somebody. Next time, let somebody protect you too.” Elsie nodded and began to (munch) Tomas’s bread. She was suddenly (peckish), an excellent sign.", "zh": "埃尔西问是不是自己毁了一切。艾达不想(责备)她，但钻进机械确实危险。“你想保护别人。下次也让别人保护你。”孩子点头，开始(咀嚼)托马斯的面包，忽然觉得(有点饿)。这是个好迹象。"}, {"en": "A paramedic examined her scratch and helped (decontaminate) skin touched by dirty water. Somebody found her missing (earmuff) in a puppet crown. Mara brushed dust from the (scruff) of her daughter’s neck. They could let ten more minutes (elapse). Rescue was over; responsibility was not.", "zh": "急救人员检查擦伤，帮助(清除污染)，洗净接触过污水的皮肤。有人在木偶王冠里找到她失踪的(耳罩)。玛拉拂掉女儿(后颈)的灰尘。他们可以再让十分钟(过去)。救援结束了，责任没有。"}, {"en": "When police arrived, Voss became (impassive). His guard no longer tried to (muzzle) questions. Outside, photographers were (scuffling) for a view. Tomas asked them not to (fling) accusations at employees merely (blundering) through a crisis. Suspicion could (engulf) innocent people too. Voss’s power had depended on everyone expecting obedience. Without that belief, his orders were only sentences.", "zh": "警察到来时，沃斯变得(面无表情)。保安不再试图让问题(噤声)。外面，摄影师们为机位(推搡争抢)。托马斯请他们别把指控(乱抛)向只是(笨拙应对)危机的员工，怀疑也能(吞没)无辜者。沃斯的权力依靠大家预期别人会服从；失去这种信念，命令便只是句子。"}, {"en": "Ada collected her father’s tools beneath a (tangerine) cloth, beside a (grindstone). There was the blade he used to (whittle) prototypes, and files to (hone) their edges. She paused to (peruse) his handwritten note: “Leave room for the hand that repairs it.” The second exit was not a grand act of heroism, merely a craftsman’s refusal to assume nothing would go wrong.", "zh": "艾达取回父亲的工具，它们盖着(橘红色)布，放在(磨石)旁。有他用来(削刻)模型的刀，也有(磨利)边缘的锉。她停下来(细读)便条：“给修理它的那只手留下空间。”第二出口不是伟大的英雄行为，只是一个工匠拒绝假定一切永不出错。"}, {"en": "At dawn, she and Tomas sat outside. A driver led a horse to a (trough); it gave a (neigh) and began to (graze). Ada expected triumph to (exhilarate) her. Instead, she felt empty. Tomas offered the last bread. “No predictions. Breakfast first.”", "zh": "黎明时，她和托马斯坐在外面。车夫牵马走向(水槽)，马(嘶鸣)一声，开始(吃草)。艾达原以为胜利会让她(振奋)，实际却只感到空。托马斯递过最后的面包：“不作预言，先吃早饭。”"}, {"en": "A cat was (nosing) around a cup for the last (dreg) of milk. Ada allowed herself (repose). She did not need to (traipse) through the galleries checking everything again. Somebody else had locked the doors. Somebody else was watching.", "zh": "一只猫正在杯边(用鼻子探寻)最后一点牛奶(残渣)。艾达允许自己(休息)。她不必再(拖着脚步走遍)展厅检查一切。别人已锁好门，别人正在看守。"}, {"en": "Six months later, the museum reopened with fewer promises. Its sign read: “Come and see how it works.” Ada helped redesign two galleries. She would not pretend it was a (cinch), nor spend her evenings (musing) about betrayal. Her father returned as a consultant, free to reject unsafe requests. Repairs came before decoration.", "zh": "六个月后，博物馆重新开放，承诺少了。招牌写着：“来看看它怎样运作。”艾达参与重设两个展厅，既不假装这是件(轻而易举的事)，也不把夜晚都花在(反复思索)背叛上。父亲以顾问身份回来，有权拒绝不安全的要求。维修优先于装饰。"}, {"en": "In the old (amphitheatre), children could (immerse) themselves in a sound demonstration. Vibrating strings disturbed water; lamps projected (crystalline) patterns. Explanations did not (snuff) out wonder. They gave it somewhere to go. Visitors could (etch) designs into soft plates or watch a ceramic (glaze) change under heat. Beauty required no claim to control destiny.", "zh": "旧(阶梯剧场)里，孩子可以(沉浸)于声音演示：振弦扰动水面，灯光投射出(水晶般的)图案。解释不会(熄灭)惊奇，反而给它方向。游客可以在软板上(蚀刻)花纹，也可以观看陶瓷(釉面)受热变化。美无需声称能支配命运。"}, {"en": "Outside, volunteers began to (prune) shrubs and plant a (seedling). A farmer demonstrated how to (plough), while children examined insects in (dung). That might (bemuse) the old donors. Ada no longer cared. An (austere) museum of correct answers would be another failure. People needed room for curiosity and (freakish) questions, and to discover that disgust sometimes revealed more about the observer than the object.", "zh": "外面，志愿者开始(修剪)灌木、种下(幼苗)。农夫示范如何(犁地)，孩子观察(粪便)里的昆虫。这可能让旧捐助者(困惑)，艾达却不在乎。一个只有正确答案、(严肃朴素)的博物馆，也会是失败。人们需要好奇心和(稀奇古怪的)问题，还要发现：厌恶有时揭示的更多是观察者，而非对象。"}, {"en": "The puppet stage survived. Mara’s horse could still (belch), her king could (sneeze), and her villain could try bribing the audience. The show could be a (pastime); joy was sufficient justification. Ada sometimes watched from the back, letting a quiet warmth (suffuse) her without feeling obliged to analyse it.", "zh": "木偶舞台保留了。玛拉的马仍会(打嗝)，国王仍会(打喷嚏)，坏人仍会试图贿赂观众。演出可以只是(消遣)，快乐本身足以成为理由。艾达有时坐在后排，让安静的暖意(弥漫全身)，不再觉得必须分析它。"}, {"en": "Tomas reported the reopening without predicting success. A (spate) of visitors encouraged everyone, but financial difficulties could (arise). Ada would not let hope (dissolve) the need for accounts, nor turn one error into a reason to (mope). A (lapse) needed correction, not a curse.", "zh": "托马斯报道重新开馆，却不预测成功。最初一(波)游客鼓舞了所有人，但财务困难仍可能(出现)。艾达不会让希望(消解)记账的必要，也不会让一次失误成为长期(闷闷不乐)的理由。一场(疏失)需要纠正，不需要诅咒。"}, {"en": "On the first Saturday, Elsie brought a drawing of the Oracle climbing out of its own head. Above it she wrote, “Let questions (uprise).” The wording was old-fashioned and strange; Ada kept it. A broad (expanse) of blank paper surrounded the figure. Tomorrow had room again. Not because anybody owned the answer, but because they could begin (afresh).", "zh": "第一个星期六，埃尔西带来一幅画：神谕机正从自己的脑袋里爬出来。上面写着：“让问题(升起)。”措辞古老而奇怪，艾达却留着。画中身影四周是一大片(空阔)的白纸。明天重新有了空间，不是因为谁拥有答案，而是因为他们能够(重新开始)。"}];

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0)
(function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  bookEl.appendChild(div);
})();

// Paragraph rows (paragraphs 1..n)
const jumpSel = document.getElementById('jumpSel');
DATA.slice(1).forEach((d, i) => {
  const p = i + 1;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + p;
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + p + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const label = S.p === 0 ? 'Title' : ('Paragraph ' + S.p + ' of ' + (sentences.length - 1));
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'audiobook-the-museum-of-tomorrow-v1';
const LS_OLD_KEY = 'audiobook-the-museum-of-tomorrow-v0';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
</body>
</html>
