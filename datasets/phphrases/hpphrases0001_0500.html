<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Village That Refused to Be Sold — Audiobook</title>
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b26;
    --muted: #6b665a;
    --line: #e3dccb;
    --accent: #b45309;
    --karaoke-sent: rgba(251, 191, 36, 0.28);
    --karaoke-word: #fbbf24;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Header / controls ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247, 244, 236, 0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 10px;
  }
  .bar {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
  }
  .book-title { margin-right: auto; min-width: 200px; }
  .book-title h1 {
    margin: 0;
    font-size: 1.15rem;
    letter-spacing: 0.02em;
  }
  .book-title .sub {
    font-size: 0.8rem;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    margin-top: 2px;
  }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button, select {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.88rem;
    border: 1px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: #c9bfa8; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #playBtn {
    background: #1f2937;
    color: #fdfbf5;
    border-color: #1f2937;
    font-weight: 600;
    min-width: 118px;
  }
  #playBtn:hover { background: #111827; }
  #playBtn.paused { background: #b45309; border-color: #b45309; }
  select { max-width: 190px; }
  .hint {
    max-width: 1180px;
    margin: 8px auto 0;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .hint b { color: var(--accent); }
  .progress-track {
    max-width: 1180px;
    margin: 10px auto 2px;
    height: 5px;
    background: #e9e2d0;
    border-radius: 3px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #d97706, #b45309);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .progress-meta {
    max-width: 1180px;
    margin: 6px auto 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #jumpSel { font-size: 0.8rem; padding: 5px 8px; max-width: 320px; }

  /* ---------- Book body ---------- */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 120px;
  }
  .title-block { text-align: center; padding: 34px 10px 10px; }
  .title-block h2 { font-size: 1.9rem; margin: 0 0 8px; letter-spacing: 0.01em; }
  .title-block .zh-title {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    color: var(--muted);
    font-size: 1.05rem;
  }
  body.hide-zh .zh-title { display: none; }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.6rem;
    padding: 26px 6px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: none; }
  .row > div { min-width: 0; }
  .en, .zh { overflow-wrap: break-word; }
  .para-no {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 0.72rem;
    color: #a39c88;
    letter-spacing: 0.12em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .en {
    font-size: 1.12rem;
    line-height: 1.95;
  }
  .zh {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 1.02rem;
    line-height: 1.95;
    color: #57534a;
  }
  body.hide-zh .row { grid-template-columns: minmax(0, 780px); justify-content: start; }
  body.hide-zh .zh { display: none; }

  /* ---------- Karaoke ---------- */
  .sent {
    cursor: pointer;
    border-radius: 8px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background-color 0.25s ease;
  }
  .sent:hover { background: rgba(0, 0, 0, 0.045); }
  .sent.active { background: var(--karaoke-sent); }
  .sent.active:hover { background: var(--karaoke-sent); }
  .w { border-radius: 4px; transition: background-color 0.12s ease; }
  .w.on {
    background: var(--karaoke-word);
    color: #1f2937;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .vocab { font-weight: 700; color: var(--accent); }

  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 1.2rem; }
    body.hide-zh .row { grid-template-columns: 1fr; }
    .zh { border-top: 1px dashed var(--line); padding-top: 1.2rem; }
    .en { font-size: 1.06rem; }
    .book-title h1 { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="book-title">
      <h1>The Village That Refused to Be Sold</h1>
      <div class="sub">English audiobook &middot; 中英双语</div>
    </div>
    <div class="controls">
      <button id="playBtn" title="Start / pause reading (Space)">&#9654; Start</button>
      <button id="restartBtn" title="Back to the beginning">&#9198; Restart</button>
      <select id="rateSel" title="Reading speed">
        <option value="0.75">0.75&times;</option>
        <option value="0.85">0.85&times;</option>
        <option value="1" selected>1&times; speed</option>
        <option value="1.15">1.15&times;</option>
        <option value="1.3">1.3&times;</option>
        <option value="1.5">1.5&times;</option>
      </select>
      <select id="voiceSel" title="Reading voice"></select>
      <button id="zhToggle" title="Show or hide the Chinese translation">&#30446; Hide translation</button>
    </div>
  </div>
  <div class="hint">Click any English sentence to start reading from there &middot; <b>Space</b> = play / pause &middot; <b>&larr;</b> / <b>&rarr;</b> = previous / next sentence &middot; <b class="vocab">Bold amber words</b> are the vocabulary words from the story.</div>
  <div class="progress-track"><div id="progressFill"></div></div>
  <div class="progress-meta">
    <span id="posLabel">Ready</span>
    <select id="jumpSel" title="Jump to a paragraph"></select>
  </div>
</header>

<main id="book"></main>

<script>
const DATA = [{"en": "The Village That Refused to Be Sold", "zh": "拒绝被出售的村庄"}, {"en": "By noon, the mayor had threatened to close the (fairground), a (tarantula) had escaped from the school’s animal tent, and Nora Bell had discovered that somebody intended to (entomb) her grandmother’s letters beneath a supermarket car park. Only the first two events had attracted public attention. Bellweather possessed an impressive (aptitude) for (hysteria), but its response to paperwork was usually (torpid). Nora, who had returned to sell her grandmother’s house, had expected a quiet weekend. Instead, she stood beside a (hydrangea), holding an (embossed) envelope and wondering whether to (buttonhole) the mayor before or after his speech.", "zh": "还没到中午，镇长就已威胁要关闭(游乐场)，一只(捕鸟蛛)从学校的动物展棚里逃了出来，而诺拉·贝尔则发现，有人打算把她祖母的信件(埋葬)在一家超市的停车场下面。只有前两件事引起了公众注意。贝尔韦瑟的居民在陷入(歇斯底里)这件事上有着惊人的(天赋)，但面对书面文件时，反应通常十分(迟钝)。诺拉这次回来是为了卖掉祖母的房子，原以为会度过一个安静的周末。没想到，她竟站在一株(绣球花)旁，手里拿着一封带有(压纹)的信，琢磨究竟该在镇长演讲前还是演讲后把他(拦住问个究竟)。"}, {"en": "The (addressee) was Eleanor Marsh, (née) Bell. Inside, a solicitor referred to the market hall as property held for the village “in (permanence)”. This was difficult to reconcile with the mayor’s proposal to (dismantle) it on Monday. Nora’s grandmother had spent forty years there, teaching children to (knead) bread and adults to (haggle) over heating bills. She had considered (servitude) to a committee an honour, provided one could occasionally (offend) its chairman. Nora had inherited her (rosewood) sewing box, a silver (bangle), and a letter instructing her not to let “that (shrewd) little man” sell the hall. She had assumed this was a final expression of an old (vendetta).", "zh": "信上的(收件人)是埃莉诺·马什，(娘家姓)贝尔。信中，一位律师说市场礼堂是为村民“(永久)”持有的财产。这与镇长提议周一就将它(拆除)的计划很难相容。诺拉的祖母在这里度过了四十年，教孩子们(揉)面包面团，也教大人们如何为暖气费(讨价还价)。她认为，给委员会(当牛做马)是一种荣誉，前提是偶尔可以(得罪)一下主席。诺拉继承了她的(花梨木)针线盒、一只银(手镯)，以及一封叮嘱她别让“那个(精明的)小个子男人”卖掉礼堂的信。她原以为，这不过是一场陈年(宿怨)最后的余音。"}, {"en": "Mayor Pike was already onstage. An (unremarkable) man with a carefully trimmed (goatee), he became (formidable) when equipped with a microphone. His opening (preamble) concerned efficiency; the next ten minutes were (soporific) enough to (addle) a caffeinated horse. The hall, he explained, was a (relic), its plumbing (substandard), its restoration practically (undoable). Demolition would provide a (springboard) for prosperity. From a (cluttered) table nearby, the custodian watched with a (sardonic) expression. “He can (expound) till Christmas,” he told Nora. “Still doesn’t explain why he’s selling a building he doesn’t own.”", "zh": "派克镇长已经站在台上。他本来是个(不起眼的)男人，留着精心修剪的(山羊胡)，可只要配上一支麦克风，就变得(令人招架不住)。他的开场(引言)谈的是效率；接下来的十分钟则(催眠)得足以让一匹喝过咖啡的马也(脑子发蒙)。他解释说，这座礼堂是个(旧时代的遗物)，管道设施(不合标准)，修复几乎是(不可能完成的)。拆除将为繁荣提供一块(跳板)。附近一张(杂乱的)桌子旁，管理员带着(讥讽的)神情看着他。“他可以一直(高谈阔论)到圣诞节，”他对诺拉说，“可还是解释不了，为什么他要卖一栋根本不属于他的房子。”"}, {"en": "The custodian was called Kit. His (stubble), patched (tunic), and permanent (grimace) made him resemble an unemployed sorcerer. He was (irascible), frequently (irritable), and not especially (lovable), although he had once spent a night repairing the nursery’s heating for nothing. People dismissed him as an (eccentric). Pike preferred “(lunatic)”. Kit called Pike a (dunderhead), then apologised to an actual schoolboy who had overheard him. “I knew your grandmother (firsthand),” he said. “She wasn’t always right. But she could (deduce) a dishonest arrangement from the way a man folded his invoices.” He examined the letter. For the first time, his expression (clouded).", "zh": "管理员叫基特。他的(胡茬)、打着补丁的(长上衣)，以及那副常年(龇牙咧嘴的表情)，使他看上去像个失业的巫师。他(脾气暴躁)，常常(烦躁易怒)，也算不上多么(讨人喜欢)，不过他曾经通宵为幼儿园免费修好暖气。人们把他当成一个(怪人)，不太拿他当回事。派克更喜欢叫他“(疯子)”。基特则称派克为(大笨蛋)，随后又向一名碰巧听见的真正的小学生道了歉。“我和你祖母是(亲自打过交道)的，”他说，“她并不总是对的。但她能从一个男人折发票的方式，(推断出)他在做什么不诚实的勾当。”他仔细看了看信。头一次，他的神情(阴沉下来)。"}, {"en": "Usually, nothing could (perturb) Kit. A burst pipe earned a casual wave; a complaint earned an (unruffled) invitation to fix it yourself. But this letter could (topple) the entire redevelopment scheme. “You’d better (heed) this,” he said. Nora asked whether he knew a lawyer. “Several. Most won’t (oblige) me any more.” He searched his pockets and produced a (wad) of old receipts. Among them was a telephone number. It was the first (vestige) of a plan.", "zh": "通常，没有什么能让基特(心神不宁)。水管爆了，他随意挥挥手；有人投诉，他就(不慌不忙地)请对方自己去修。但这封信可能(推翻)整个重建计划。“你最好(重视)这件事，”他说。诺拉问他是否认识律师。“好几个。大多数已经不肯再(帮我忙)了。”他翻了翻口袋，掏出一(沓)旧收据。其中夹着一个电话号码。这是一个计划最初的(雏形)。"}, {"en": "Around them, Bellweather pursued its (innumerable) small pleasures. Children could (frolic) beside a (collapsible) castle while adults queued for a (chipolata), a spoonful of (custard), or a jar of (marmalade). The gardening society displayed a (begonia), a (periwinkle), and some unusually vigorous (lovage). Beyond a (shrub), a youth orchestra attempted a (serenade), its (rhythmic) confidence considerably stronger than its tuning. A baker used a (ladle) to pour batter while her husband tried to (mince) onions and (shoo) a dog simultaneously. The smell of hot sugar was a welcome (tonic). Nora had intended to buy lunch, take a (siesta), and leave. Now she could barely (nibble) a biscuit.", "zh": "他们周围，贝尔韦瑟的居民正享受着(数不清的)小小乐趣。孩子们可以在一座(可折叠的)城堡旁(嬉戏)，大人们则排队买一根(小香肠)、一勺(蛋奶酱)，或者一罐(柑橘果酱)。园艺协会展出了一盆(秋海棠)、一盆(蔓长春花)，还有几株长势格外旺盛的(欧当归)。一丛(灌木)后面，青少年乐团正在尝试演奏一首(小夜曲)，他们对(节奏)的把握显然比音准更有信心。一位面包师用(长柄勺)倒面糊，她的丈夫则试图一边(切碎)洋葱，一边(赶走)一条狗。热糖的香气是一剂令人愉快的(强心剂)。诺拉本来打算买份午餐，(午睡)一会儿，然后离开。现在，她连一块饼干都几乎(啃不下)。"}, {"en": "From the stage, Pike’s promises continued. Kit regarded them as expensive (waffle). A shopkeeper beside him preferred “(bilge)”. Neither man would (applaud), though the mayor’s supporters responded with conspicuous (glee). A boy began to (mimic) Pike’s gestures until his mother stopped him. “He’s not a (hysteric),” she said, “and neither are you.” The boy adopted an expression of wounded dignity. Ordinarily, the scene would have amused Nora. Today, she could only (brood) over the envelope.", "zh": "台上，派克还在继续许诺。基特认为那都是代价高昂的(空话)。他旁边的一位店主更愿意称之为“(胡说八道)”。两个人都不肯(鼓掌)，尽管镇长的支持者表现出了显而易见的(欢喜)。一个男孩开始(模仿)派克的手势，直到母亲制止了他。“他又不是个(歇斯底里的人)，”她说，“你也不是。”男孩摆出一副尊严受损的表情。平时，这一幕会逗乐诺拉。可今天，她只能对着那只信封(忧心忡忡)。"}, {"en": "Kit led her through the hall’s side entrance. A (bramble) had claimed the drain, and (honeysuckle) pressed against the glass. Inside, the air smelled (stale), with a (tinge) of something (acrid). A (puddle) reflected a plaster (cherub) whose (resemblance) to the mayor was unfortunate. Paint had begun to (flake); one wall was (riddled) with holes. A cupboard contained (rancid) polish, a (blob) of hardened glue, and a single petrified (crumb). “There’s neglect,” Nora said. “Certainly,” Kit replied. “But being a (slob) isn’t the same as owning the place.” From behind a panel came a soft (throb), as though the building had a nervous heart.", "zh": "基特带她从侧门走进礼堂。一丛(荆棘)霸占了排水沟，(金银花)紧贴着窗玻璃。里面的空气有股(陈腐的)味道，还夹着(一丝)(刺鼻的)气息。一汪(积水)映出一个石膏(小天使)，不巧的是，它和镇长颇为(相像)。油漆开始(剥落)，一面墙被孔洞(蛀得千疮百孔)。一个柜子里放着(变质的)抛光剂、一(团)凝固的胶，以及一粒已经石化的面包(碎屑)。“这里确实疏于照料，”诺拉说。“当然，”基特答道，“但当个(邋遢鬼)，不等于你就拥有这个地方。”一块护墙板后面传来轻轻的(搏动声)，仿佛这栋楼有一颗紧张的心。"}, {"en": "Kit stopped. The noise stopped too. The upper floor was supposed to be (uninhabited). Nora felt a (prickle) beneath her collar. Kit picked up a (spade), then reconsidered and put it down. “No (bloodshed),” he said. “Bad for the insurance.” They began to (ascend). On the landing, Nora had to (disentangle) her sleeve from a nail that continued to (protrude) through the rail. A door stood open. Beyond it, an (unaccompanied) boy wearing a (balaclava) was trying to (manhandle) an old trunk onto a wheeled (bogie). He looked (cornered). Then his foot slipped, and the trunk landed with a (thud).", "zh": "基特停下了脚步。声音也停了。楼上本该(无人居住)。诺拉觉得衣领下面泛起一阵(刺痒)。基特拿起一把(铁锹)，想了想，又放下了。“不要(流血)，”他说，“对保险不好。”他们开始(上楼)。在楼梯平台上，诺拉不得不把袖子从一根仍(突出)栏杆的钉子上(解脱出来)。一扇门敞开着。门后，一个(独自一人)的男孩戴着(头套)，正试图把一只旧箱子(吃力地搬到)一辆带轮子的(平板小车)上。他看起来像是(被逼到了死角)。随后他脚下一滑，箱子(砰的一声)落了地。"}, {"en": "The boy was Milo, Pike’s nephew, a (timid) sixteen-year-old with a (freckle) on his nose and a spectacular (pimple) on his chin. He removed the mask, revealing a (pallid), thoroughly (anguished) face. “Dust,” he explained, waving at the fabric. “I couldn’t find anything else.” He had expected to move rubbish, not meet witnesses. Kit began to (goad) him, but Nora intervened. She would not have a frightened child (frogmarched) out of the room before anyone had heard his account. She asked Milo to sit down. An (unprovoked) attack would merely (enrage) his uncle and (discourage) the one person who might (divulge) what was happening.", "zh": "男孩是派克的侄子迈洛，一个(胆小的)十六岁少年，鼻子上有颗(雀斑)，下巴上有一颗格外醒目的(青春痘)。他摘下面罩，露出一张(苍白)、满是(痛苦不安)的脸。“灰尘，”他指着那块布解释道，“我找不到别的东西。”他原以为只是来搬垃圾，没想到会遇见目击者。基特开始(刺激)他，诺拉却出面制止了。她不愿让一个受惊的孩子在还没有人听过他的解释之前，就被(架着赶出)房间。她让迈洛坐下。一场(无端的)攻击只会(激怒)他的叔叔，也会让唯一可能(透露)实情的人(不敢再开口)。"}, {"en": "“I was told to clear it (beforehand),” Milo said. “Before Monday. That (bloke) from the buyers said nobody would mind.” Nora asked him not to (fib). He stared at his shoes. “I’m not.” Kit found a (penknife) and (unscrewed) a loose brass plate on the trunk. Its lid would not (budge), so Nora gave the corner a careful (nudge). There was a metallic (crackle). An internal catch had jammed; a small (gib) in the fitting had slipped. Together they managed to (dislodge) it. “Don’t (mangle) the documents,” Kit warned. “They’re worth more than the box.” Milo tried to (exhale) without sounding frightened.", "zh": "“他们让我(提前)清理干净，”迈洛说，“周一之前。买方那边的那个(家伙)说，不会有人介意。”诺拉叫他不要(撒谎)。他盯着自己的鞋。“我没有。”基特找到一把(折叠小刀)，把箱子上一块松动的黄铜片(拧了下来)。箱盖纹丝不(动)，于是诺拉小心地在角上(推了一下)。里面传来金属的(咔嚓声)。内部的搭扣卡住了，配件里的一小块(楔形固定片)滑了位。两人一起设法把它(弄了出来)。“别把文件(弄坏了)，”基特提醒道，“它们比箱子值钱。”迈洛试着(呼出一口气)，尽量不让自己听上去像是吓坏了。"}, {"en": "Inside lay a (jumble) of accounts, photographs, and theatrical costumes. A (puce) folder was tied with (braid). Beneath a moth-eaten (bedspread), Nora found a ledger recording payments in (specie), rent for an (orphanage) benefit, and the postal (poundage) charged on relief parcels. One invoice concerned a donated (bedstead), its matching (headboard), and transport by (barge). A photograph showed her grandmother standing (astride) a broken bicycle, laughing. Nora had come prepared to (renounce) her attachment to Bellweather. Instead, the sight made her (wince). She sat on the trunk, suddenly unable to perform the (businesslike) indifference she had practised all week.", "zh": "里面(乱七八糟地堆着)账目、照片和戏服。一个(紫褐色的)文件夹用(编织带)绑着。在一条虫蛀的(床罩)下面，诺拉发现一本账簿，记着用(金属货币)支付的款项、一场为(孤儿院)募款的活动所交的租金，以及救济包裹按重量收取的(邮费)。一张发票涉及一张捐赠的(床架)、配套的(床头板)，以及用(驳船)运输的费用。一张照片里，祖母(跨在)一辆坏自行车上，笑得很开心。诺拉本来已经做好准备，要(割舍)自己对贝尔韦瑟的感情。可看到这一幕，她却(心里一痛)。她坐在箱子上，忽然无法再演出自己练习了一整周的那种(公事公办的)冷淡。"}, {"en": "The costumes belonged to an amateur production about a fraudulent emperor. There was a (toga), a battered (monocle), a rubber (tentacle), and an empty (scabbard). Two envelopes contained false facial hair: “(mustache)” on one, “(moustache)” on the other. Even the props committee had managed to (quibble). A sketch showed a mechanical monster, part (cockatrice), part (kelpie), intended to (disgorge) paper scraps. Its jaws had been carved with such care that someone had labelled a (ruga) on the palate. “Your grandmother did that,” Kit said. “Dental nurse before she retired.” A (scarab) brooch fell from the costume pile. Nora remembered it immediately. She had been allowed to wear it when she played a (pixie).", "zh": "这些戏服属于一出讲述骗子皇帝的业余戏剧。其中有一件(古罗马长袍)、一副破旧的(单片眼镜)、一条橡胶(触手)，以及一个空(剑鞘)。两个信封里装着假胡子：一个写着“(小胡子，美式拼法)”，另一个写着“(小胡子，英式拼法)”。就连道具委员会也能为这类细节(争论不休)。一张草图画着一个机械怪物，一半是(鸡蛇怪)，一半是(水马妖)，原本是用来(喷出)碎纸的。它的嘴雕刻得极其仔细，甚至有人在上腭的一条(皱襞)旁作了标注。“这是你祖母做的，”基特说，“她退休前是牙科护士。”一枚(圣甲虫)胸针从戏服堆里掉了出来。诺拉立刻认出了它。她扮演(小精灵)时，祖母曾允许她戴上这枚胸针。"}, {"en": "Memory began to (overtake) her. She recalled an (eerie) blue light, the audience’s (hubbub), and her own (frantic) effort not to (stumble). Her grandmother had whispered, “Whatever may (betide), keep going.” A wooden (cupid) had fallen from the scenery; a stage (grenade) had proved a (dud). The emperor had improvised an (antic) bow and turned disaster into comedy. Now, tucked into the ledger, lay a programme with a (legible) note: all proceeds would protect the hall from private sale. The promise was neither (vapid) nor vague. Nora felt the first (tingle) of anger. “Where’s the actual deed?”", "zh": "回忆开始(涌上心头，将她淹没)。她想起那道(诡异的)蓝光、观众的(喧闹)，以及自己为避免(绊倒)而作出的(慌乱的)努力。祖母曾轻声说：“不管(发生什么)，都要继续。”一个木制的(丘比特)从布景上掉了下来，一枚舞台(手榴弹)则成了(哑弹)。皇帝即兴来了一个(滑稽的)鞠躬，把事故变成了喜剧。如今，账簿里夹着一张节目单，上面有一行(清晰可辨的)说明：全部收入都将用于保护礼堂，使其免遭私人出售。这个承诺既不(空洞)，也不含糊。诺拉第一次感到怒意(隐隐涌起)。“真正的契约在哪里？”"}, {"en": "The question broke Kit’s own (reverie). He remembered a midsummer (solstice) meeting, an argument about a proposed sale, and the documents being locked away afterwards. Years of (strife) had followed, then everyone involved had grown old. It seemed absurd that a promise could (elude) a village simply because nobody remembered its filing system. “Unless,” Kit said, “it’s still here, (perchance).” His hopeful formality almost made Nora smile. She began checking every pocket and sleeve, waiting for the missing paper to (resurface).", "zh": "这个问题打断了基特自己的(遐想)。他记得有一场在夏至这一(至日)举行的会议，有人争论过出售计划，之后文件便被锁了起来。随之而来的是多年的(纷争)，再后来，当事人都老了。仅仅因为没有人记得归档方式，一个承诺竟然就能从整个村庄的记忆中(消失)，这实在荒唐。“除非，”基特说，“它(或许)还在这里。”他满怀希望又一本正经的措辞，差点让诺拉笑出来。她开始检查每一个口袋和袖子，盼着那份失踪的文件(重新出现)。"}, {"en": "Milo began to (fumble) through the papers. “There was another box.” His voice fell to a (mumble). It had been taken to the waste container that morning. Kit uttered a (swearword) of considerable force. Nora was briefly too (unnerved) to move. Then her grandmother’s instructions seemed almost (prophetic). They must (retrace) the boy’s route, (rummage) through the container, and hope rain had not reduced the contents to pulp. Kit wanted to (allege) a deliberate attempt to destroy evidence. Nora insisted they establish the facts first. A (shred) of suspicion would not (suffice), however satisfying the anticipated (comeuppance).", "zh": "迈洛开始(笨手笨脚地翻找)那些纸张。“还有一个箱子。”他的声音低成了(咕哝)。那个箱子早上已经被搬进了垃圾箱。基特骂了一句颇有分量的(脏话)。诺拉一时(惊慌得)动弹不得。随后，祖母的嘱托显得几乎像是(预言)。他们必须沿着男孩走过的路线(原路返回)，到垃圾箱里(翻找)，并祈祷雨水还没有把里面的东西泡成纸浆。基特想要(指控)有人蓄意销毁证据。诺拉坚持先查清事实。只有(一丝)怀疑是不(够的)，无论想象中的(报应)会多么令人痛快。"}, {"en": "Outside, the mayor’s speech had given way to a pet parade. A (wolfhound) with abundant (saliva) investigated a (boarhound), while a woman tried to (soothe) a baby beginning to (teethe). In the animal tent, an (iguana) rested beside a model (loggerhead) turtle. The escaped spider had been found in a box of (seaweed) behind the aquarium. Its owner complained about the (stigma) attached to harmless hobbies. A blue (budgie), restored to its (birdcage), supplied a piercing commentary. Nora attempted to (wend) through the crowd. Kit followed, having to (fend) off a determined organiser who wanted him to judge the (plumage) competition.", "zh": "外面，镇长的演讲已经让位于宠物巡游。一只流着大量(口水)的(猎狼犬)正在打量一只(猎野猪犬)，旁边一位女士试图(安抚)一个开始(长牙)的婴儿。动物展棚里，一只(鬣蜥)趴在一个(蠵龟)模型旁。逃走的蜘蛛已在水族箱后的一箱(海藻)里找到了。它的主人抱怨，人们总给无害的爱好贴上(污名)。一只蓝色的(虎皮鹦鹉)被放回(鸟笼)后，发出了尖锐的现场评论。诺拉试着在人群中(穿行)。基特跟在后面，还得(挡开)一名执意想让他担任鸟类(羽毛)比赛评委的组织者。"}, {"en": "The waste container stood beyond the (churchyard), where an old (stile) opened onto the delivery yard. Nora’s shoe caught a (pebble), and she nearly suffered an (overbalance) as she climbed across. Milo offered a (supple) branch for support. On the ground, (woodlice) scattered beside a nest that Kit thought belonged to (dormice). A (vole) vanished before anyone could (trample) it. Above them, birds were almost ready to (fledge) on a stone (ledge). Everything seemed determined to carry on with its ordinary business. Nora envied that certainty. Her own plans had fallen by the (wayside) in less than an hour.", "zh": "垃圾箱在(教堂墓地)外面，一道老旧的(越栏梯)通向卸货场。诺拉的鞋被一颗(小石子)绊住，翻过去时险些(失去平衡)。迈洛递来一根(柔韧的)树枝让她扶着。地上，一群(潮虫)在一个基特认为属于(睡鼠)的窝旁四散而逃。一只(田鼠)在被人(踩到)之前消失了。他们头顶的石头(凸台)上，幼鸟已经快要(羽翼丰满)。一切似乎都执意照常过自己的日子。诺拉羡慕这种笃定。她自己的计划，不到一个小时就已被扔在了(半路上)。"}, {"en": "Someone had thrown kitchen waste over the box. The smell was (putrid). A discarded (artichoke), a strip of orange (rind), and an entire ruined (blancmange) lay across the papers. Kit tried to (dredge) them out with a stick. Milo had to (writhe) between two bags to reach the bottom, muttering that he might (puke). “Don’t,” said Kit. “We have enough material.” Nora held open a sack while a persistent (midge) made her (jiggle) her shoulder. At last a water-stained packet emerged. A (telltale) blue seal remained (discernible) beneath a (smudge). She felt almost (ecstatic), until a familiar voice said, “Put that down.”", "zh": "有人把厨余垃圾倒在了箱子上。气味(腐臭难闻)。一只被扔掉的(朝鲜蓟)、一条橙子(皮)，以及一整份毁掉的(牛奶冻)，都压在文件上。基特试着用棍子把它们(捞出来)。迈洛不得不在两个垃圾袋之间(扭动身体)，才能够到底部，嘴里嘟囔着自己可能会(吐)。“别吐，”基特说，“我们这里的材料已经够多了。”诺拉撑着袋口，一只纠缠不休的(小飞虫)让她不断(抖动)肩膀。终于，一包带着水渍的东西露了出来。隔着一块(污迹)，仍能(辨认出)那枚(泄露线索的)蓝色印章。她几乎(欣喜若狂)，直到一个熟悉的声音说道：“把那个放下。”"}, {"en": "Milo made a startled (lunge) away from the container. His elbow struck its rim, sending a sheet of paper sailing. Nora managed to catch it on the (verge) of the drain. Pike’s arrival had been almost too well timed, but this was a (fluke), not evidence of surveillance. Beyond the fence, a volunteer was complaining about a dog’s (turd); another was attempting to (dole) out rain covers. The contrast between their ordinary troubles and Nora’s sudden predicament was enough to (dumbfound) her.", "zh": "迈洛吓得猛然向远离垃圾箱的方向(一冲)。他的手肘撞到了箱沿，一张纸飞了出去。诺拉在排水沟的(边缘)及时接住了它。派克来得几乎过于巧合，但这只是一次(偶然)，不能证明他们受到了监视。篱笆外，一名志愿者正在抱怨一条狗留下的(粪便)，另一名则忙着(分发)防雨罩。他们那些平常的烦恼，与诺拉突如其来的困境形成的反差，足以让她(目瞪口呆)。"}, {"en": "Pike stood at the gate. He looked (livid). His (offhand) manner had vanished, replaced by the (palpable) fury of a man losing control of his afternoon. “This is (despicable),” he said. Kit started to answer, but Nora raised a hand before the argument could become a (scuffle). She would not let a quarrel about manners (override) the evidence. Pike accused them of (sabotage), described the expedition as a (rampage), and said they had no right to (meddle). The last word was a mistake. Nora had spent twenty years being told not to interfere. She discovered she no longer cared.", "zh": "派克站在门口，看上去(气得脸色铁青)。他那种(漫不经心的)态度消失了，取而代之的是一个发现下午的局面已失去控制的人身上，那种(清晰可感的)愤怒。“这简直(卑鄙)，”他说。基特刚要回答，诺拉便抬起手，免得争吵演变成(扭打)。她不会让一场关于礼貌的争执(压过)证据。派克指责他们搞(破坏)，把这次寻找说成一场(胡闹横行)，还说他们无权(插手)。最后这个词说错了。过去二十年里，诺拉不断被人告诫不要多管闲事。此刻她发现，自己已经不在乎了。"}, {"en": "“Did you tell Milo to remove these?” she asked. Pike tried to (evade) the question with an account of insurance. Kit gave a (snide) laugh. Milo stared at the grass. “You can (chide) me later,” Nora said. “Answer him now.” Pike’s silence seemed to (derange) the boy more than anger would have. Finally Milo spoke. The mayor had asked for the rooms to be emptied, but the buyer’s representative had specifically ordered the old documents discarded. Pike had never inspected them. The admission seemed to (befuddle) him. He began to (gabble) about deadlines until Nora asked him to repeat the instruction, every (syllable). His wrongdoing might be less dramatic than a conspiracy, but its consequences were no less (lamentable). He had allowed ignorance to become a (stranglehold).", "zh": "“是你让迈洛把这些东西搬走的吗？”她问。派克试图用一番关于保险的解释(回避)问题。基特发出一声(讥诮的)笑。迈洛盯着草地。“你可以等会儿再(责备)我，”诺拉说，“现在先回答他。”派克的沉默似乎比愤怒更让男孩(心神大乱)。终于，迈洛开口了。镇长要求清空房间，但具体下令扔掉旧文件的，是买方代表。派克从未查看过那些文件。这个事实似乎把他(弄糊涂了)。他开始(急促而含混地说着)截止日期，直到诺拉要求他把指示逐字逐句、每一个(音节)都重复清楚。他的过错也许不如阴谋那样戏剧化，但后果同样(可悲)。他任由无知变成了一种(牢牢的控制)。"}, {"en": "Kit was nearly (apoplectic). “I’d (swinge) the lot of them,” he said, borrowing a threat from the emperor’s script. Nora regarded him (askance). “You can argue about penalties later.” She understood his (outrage), but it was already acquiring a (manic) energy that made thought difficult. Destroyed papers, misunderstood instructions, and an embarrassed mayor were serious enough. They did not need imagined (carnage) to make them matter.", "zh": "基特几乎(暴跳如雷)。“我非得把他们全都(狠狠惩治)一顿，”他说，借用了皇帝剧本里的一句威胁。诺拉(不以为然地斜看)了他一眼。“处罚的事可以以后再争。”她理解他的(义愤)，但那股情绪已经带上了令人难以思考的(狂躁)劲头。被毁的文件、被误解的指示，以及一个难堪的镇长，本身就已经足够严重。没必要再想象一场(大屠杀)，才能显得它们重要。"}, {"en": "The discovery did not make Nora’s legal position (unassailable). A copy might be incomplete; another agreement might (precede) it. Nor could they infer intent from negligence alone. Kit, however, wanted to (pounce). “You let them (collude) behind our backs!” he said. Pike’s response became a (diatribe), rich in (bile) and poor in explanation. Nora asked both men to (disengage). Turning uncertainty into a public (spectacle) would (impede) the investigation. She would find someone qualified to read the deed. Until then, they could (bide) their time without attempting to (strangle) one another.", "zh": "这个发现并没有让诺拉在法律上变得(无懈可击)。副本可能不完整，也可能另有一份协议(早于)它存在。他们也不能仅凭疏忽就推断动机。然而基特已经想要(扑上去发难)。“你让他们背着我们(串通)！”他说。派克的回应变成了一场(长篇痛骂)，充满(怨毒)，却没多少解释。诺拉请两个人先(停止纠缠)。把尚未确定的事情变成一场公开的(闹剧)，只会(妨碍)调查。她会找个有资格的人来解读契约。在那之前，他们完全可以(耐心等待)，不必试图把对方(掐死)。"}, {"en": "Unfortunately, a reporter had arrived. Her professional (antennae) were visibly alert. “Anything you’d like to (confide)?” she asked. Pike attempted to (dissuade) her from taking photographs. Kit was ready to (blab) about forty years of administrative failure. Nora handed over only the relevant page. “Please don’t (garble) this into a story about a stolen inheritance. My (parentage) is beside the point.” The hall belonged to a trust, if the document remained valid. Her grandmother’s family had no special claim. The reporter seemed disappointed, then interested. A village losing its own building through an (unchecked) assumption was, on reflection, quite a story.", "zh": "不巧的是，一名记者已经到了。她那职业性的(触角)显然十分敏锐。“有什么愿意(私下告诉)我的吗？”她问。派克试图(劝阻)她拍照。基特则已经准备好，把四十年来的管理失误统统(抖露出来)。诺拉只交给她相关的那一页。“请不要把这件事(歪曲)成一篇遗产被偷的故事。我的(家世)与此无关。”如果这份文件依然有效，礼堂就属于一个信托。她祖母的家人没有任何特殊权利。记者似乎有些失望，随后又来了兴趣。一个村庄竟因一项(未经核查的)假定而失去自己的建筑，仔细想想，这还真是个故事。"}, {"en": "They found the solicitor beside the cake stall, preparing to (amble) home. He was a (respectable) man whose vest buttons appeared ready to (bulge) outwards after a third helping of (trifle). Kit tried to (wheedle) free advice; Nora offered payment. The solicitor examined the seal, then the signatures. His face became (inscrutable). “A room,” he said. “And no speeches.” Pike began a (remonstrance). “Especially yours.” This was enough to (astound) Kit. They returned to the hall, where the solicitor could read without interruption. Outside, the first heavy drops began to fall.", "zh": "他们在蛋糕摊旁找到了律师，他正准备(慢悠悠地走)回家。这是一位(体面的)先生，吃完第三份(英式奶油水果蛋糕)后，背心上的纽扣看起来已经快要向外(鼓出来)。基特试图(哄着)他免费提供意见，诺拉则提出付费。律师查看了印章，又查看签名，脸上变得(高深莫测)。“给我一个房间，”他说，“不要演讲。”派克开始(提出抗议)。“尤其不要你的。”这足以让基特(大吃一惊)。他们回到礼堂，让律师能够不受打扰地阅读。外面，第一批大雨点落了下来。"}, {"en": "Rain changed the fair’s mood in a (trice). Clouds that had seemed content to (scud) now delivered a (deluge). Families began to (converge) on the hall. Water threatened to (bedraggle) the dancers and ruin their costumes, so the organisers hurried them inside. Kit opened the main doors, then stopped people entering the damaged wing. A temporary (barricade) made from tables created a safe route. “Don’t (stampede),” he shouted. “There’s space.” Children who had been inclined to (straggle) suddenly found speed. A pony began to (prance); its rider slid from her (sidesaddle) seat into a helper’s arms. Nobody was hurt.", "zh": "雨水在(转眼之间)改变了集市的气氛。刚才似乎还只满足于(飞快掠过)的云层，如今降下了(倾盆大雨)。一家家人开始向礼堂(汇集)。雨水眼看就要把舞者(淋得狼狈不堪)，毁掉他们的服装，组织者赶紧把他们带进屋。基特打开大门，又拦住人们，不让他们进入损坏的侧翼。用桌子搭起的临时(路障)划出了一条安全通道。“不要(惊慌拥挤)！”他喊道，“有地方！”原先总爱(掉队)的孩子们忽然跑得飞快。一匹小马开始(腾跃)，骑在(侧鞍)上的女孩滑了下来，被一位帮忙的人接进怀里。没有人受伤。"}, {"en": "The storm’s violence made (drastic) changes to the programme unavoidable. “We must (hie) ourselves indoors!” the emperor shouted, helping a singer (scramble) off the platform. A violin case nearly opened, but Milo caught it. The youngest performers were too (excitable) to follow instructions until Nora asked them to (encircle) their teacher. They could carry on inside once the adults moved the equipment. The promise provided enough (reassurance) to keep them together.", "zh": "暴风雨如此猛烈，节目安排不得不作出(大幅)调整。“我们必须(速速赶往)室内！”皇帝喊着，扶一名歌手(手忙脚乱地爬下)台子。一个小提琴盒差点打开，好在迈洛接住了。年纪最小的演员们太(容易激动)，根本不听指挥，直到诺拉请他们(围住)老师。等大人把设备搬好，他们就可以在室内继续演出。这个承诺给了他们足够的(安心感)，让他们聚在一起不再乱跑。"}, {"en": "The building filled with the (babble) of wet families. A (gaggle) of singers tried to (huddle) beside the stove while volunteers used towels to (swathe) valuable costumes. A duck escaped its handler and began to (waddle) towards the kitchen. Someone tried to (cadge) tea. Someone else wanted to (scrounge) a chair. The conductor attempted to (recommence) the concert, only for a microphone to (muffle) every second note. Nora watched a small boy with a (sniffle) begin to (toddle) towards the stage. His mother caught him. For all its faults, the supposedly useless building had become indispensable in fifteen minutes.", "zh": "礼堂里充满了浑身湿透的一家家人的(嘈杂交谈声)。一(群吵闹的)歌手试图在炉子旁(挤作一团)，志愿者则用毛巾把贵重的戏服(包裹起来)。一只鸭子从饲养员手里逃脱，开始向厨房(摇摇摆摆地走)。有人想(讨)杯茶，另一个人则想(找来)一把椅子。指挥试图让音乐会(重新开始)，可麦克风偏偏把隔一个音符的声音就(压得含混不清)。诺拉看见一个(抽着鼻子)的小男孩开始朝舞台(蹒跚走去)。他的母亲抓住了他。尽管这栋楼毛病不少，这个据说毫无用处的地方，却在十五分钟里变得不可或缺。"}, {"en": "Then water appeared beneath the store-room door. At first it was a (trickle). Soon it began to (gurgle) around the threshold. Kit knew the blocked drain outside was responsible. If the water continued to rise, it would (choke) the old heating system. He asked Milo to fetch tools. Pike objected: volunteers must not attempt repairs. “Then help me find someone who can (plumb),” Kit snapped. He pulled a hose from the wall and (uncoiled) it across the floor. Nora used an empty (tankard) to scoop water away from a socket. The solicitor moved the documents onto the (mantelpiece), well clear of the spreading pool.", "zh": "随后，储藏室门下出现了水。起先只是一股(细流)，很快便开始在门槛周围(咕噜作响)。基特知道，这是外面的排水沟堵住了。如果水位继续上涨，就会(堵塞并损坏)旧供暖系统。他叫迈洛去拿工具。派克反对，说志愿者不许擅自维修。“那你就帮我找一个会(修水管)的人，”基特厉声回答。他从墙边拉出一根软管，把它在地板上(展开)。诺拉用一个空(大啤酒杯)把插座附近的水舀走。律师把文件移到(壁炉架)上，远离不断扩大的水洼。"}, {"en": "The yard had become a brown lake. Milo had to (trudge) through it, then (dodge) a floating (bale) of straw. Kit showed him where to (poke) the rod into the drain. At the third attempt, something shifted. A deep (gouge) in the paving channel revealed where a delivery vehicle had crushed its cover. Beyond it, roots formed a dense (tangle). Water pressed through with enough force to (entangle) the loose hose around Milo’s legs. He began to (wobble). Nora grabbed his (waistband) before he could (skid) backwards and (impale) himself on a broken fence post. For a moment all three could do nothing but (grapple) with the hose.", "zh": "院子已经变成了一片棕色的湖。迈洛不得不(艰难跋涉)过去，再(躲开)一(捆)漂浮的稻草。基特告诉他，该从哪里把杆子(捅进)排水沟。试到第三次时，有东西松动了。铺砌排水槽里一道很深的(凹痕)，暴露出送货车辆压坏盖板的位置。再往里，树根密密麻麻地(缠成一团)。水流挤出来的力量很大，使松散的软管(缠住)了迈洛的双腿。他开始(摇晃)。诺拉抓住他的(裤腰)，才没让他向后(滑倒)，被一根断裂的篱笆柱(刺穿)。有那么一会儿，三个人除了和软管(搏斗)，什么也做不了。"}, {"en": "Pike appeared carrying a rope. He did not announce himself. He looped it around Milo and pulled with Nora until the boy was safe. The drain finally opened with a sound like an enormous animal clearing its throat. Water began to (recede). Milo stood shaking, physically (unscathed) but unable to (stifle) his tears. His uncle put a hand on his shoulder. Whatever else could be said of Pike, the gesture was not (melodramatic). Nora noticed his hand (tremble). “Good work, (laddie),” Kit said, abandoning hostility long enough to sound almost kind.", "zh": "派克拿着一根绳子出现了。他没有出声张扬，只把绳子套在迈洛身上，和诺拉一起拉，直到男孩脱离危险。排水沟终于通了，声音像一头巨兽在清嗓子。水开始(退去)。迈洛站在那里发抖，身体虽然(毫发无损)，却再也(忍不住)眼泪。他的叔叔把一只手放在他肩上。不管人们还能怎样评价派克，这个举动都不是(故作煽情的)。诺拉注意到他的手在(颤抖)。“干得好，(小伙子)，”基特说，暂时放下敌意，听上去几乎称得上和蔼。"}, {"en": "Inside, a cook produced a (bandage) for a scrape on Nora’s (knuckle). Another warned that a cooking pot might (scald) the children and moved it behind a screen. Damp clothes hung from every hook. A volunteer had to (ruffle) a dog’s fur dry before its owner would stop fussing. Nearby, a schoolgirl turned a broken umbrella into a dancing bird, with ribbon wings. Nora watched its bright feathers (waggle), then allowed herself a (giggle). The shock was beginning to (subside). Rain tapped against a circular (porthole) in the kitchen door. For the first time that day, she felt (solace) without needing to look backwards.", "zh": "屋里，一位厨师拿出(绷带)，包扎诺拉(指关节)上的擦伤。另一位提醒大家，锅可能会(烫伤)孩子，于是把它挪到隔板后面。每个挂钩上都挂着潮湿的衣服。一名志愿者不得不把一条狗的毛(揉乱擦干)，它的主人才终于停止大惊小怪。旁边，一个女学生把一把坏伞变成了一只跳舞的小鸟，用丝带做翅膀。诺拉看着那些鲜艳的羽毛(摇来摆去)，终于让自己(咯咯笑)了一声。惊吓开始(平息)。雨点敲打着厨房门上的圆形(舷窗式小窗)。这是她当天第一次不必回望过去，也能感到(慰藉)。"}, {"en": "The solicitor emerged before anyone could (dawdle) over another argument. The trust was still active. Selling the hall required procedures that had not been followed. Neglect did not (entitle) the council to dispose of it as though it were an unwanted shed. He could not promise an (impregnable) case without further checks, but postponement was plainly (advisable). Pike would have to (concede) that much. Nora felt (elated), yet the solicitor’s next sentence stopped her. The building still needed a (sizable) sum. Discovering a right did not make the cost disappear. That truth was (inescapable), whatever the sentimental value of old letters.", "zh": "还没等大家在另一场争论上(磨蹭)，律师就走了出来。信托依然有效。出售礼堂需要履行的程序并没有被履行。疏于管理，并不能(赋予)议会把它当成无用棚屋随意处置的权利。没有进一步核查，他不能保证这宗案子(牢不可破)，但延期显然是(明智的)。至少这一点，派克必须(承认)。诺拉(兴高采烈)，可律师的下一句话让她停住了。这栋楼依然需要一笔(相当可观的)钱。发现一项权利，并不会让成本消失。无论旧信件承载着多么深厚的感情，这个事实都(无法回避)。"}, {"en": "Pike looked towards the crowded room. “We couldn’t maintain it,” he said. “Every repair cost (treble) what we’d planned.” For once he sounded (devoid) of performance. Nora believed him. The budget problem was real; so was his decision not to ask for help. His (erstwhile) certainty had protected him from admitting failure. Kit began to (grumble), then stopped. There was a difference between wanting a man’s defeat and wanting a building saved. “It doesn’t have to be (unmanageable),” Nora said. “But we need actual figures.” The mayor nodded. His expression was awkwardly (apologetic). It was not forgiveness, but it might be a beginning.", "zh": "派克望向挤满人的房间。“我们养护不起它，”他说，“每次修理都要花计划的(三倍)。”这一次，他的话里(没有)表演成分。诺拉相信他。预算问题是真的，他选择不求助也是真的。他(从前的)笃定让他得以逃避承认失败。基特开始(抱怨)，随即又停住了。想让一个人败下阵来，与想救下一栋建筑，并不是同一件事。“事情未必就(无法处理)，”诺拉说，“但我们需要真实的数字。”镇长点点头，脸上带着别扭的(歉意)。这还算不上原谅，却也许是一个开端。"}, {"en": "The reporter suggested an announcement. Nora refused a victory speech. Such a speech would only (rile) Pike’s supporters and turn caution into (cowardice) in the eyes of her own. She would neither (commend) neglect nor pretend (malice) had been proved. Instead, she asked everyone to listen. A child gave the bell a (jangle), and the room quietened. “The sale is paused,” she said. “That does not mean the roof repairs are free.” A (chuckle) travelled through the audience. “We need skills, money, and people willing to do ordinary jobs.” A carpenter put up his hand. Then a bookkeeper. Then the woman who cleaned the school.", "zh": "记者建议发表一个声明。诺拉拒绝作胜利演说。那样的演说只会(激怒)派克的支持者，也会使她今后的谨慎在自己支持者眼中变成(怯懦)。她既不会(赞许)失职，也不会假装已经证实了(恶意)。她只是请大家听一听。一个孩子把铃铛摇得(叮当直响)，房间安静下来。“出售暂停了，”她说，“但这不意味着修屋顶不要钱。”人群中传来一阵(轻笑)。“我们需要手艺、资金，还有愿意做普通工作的人。”一位木匠举起了手，随后是一位记账员，再随后是给学校做清洁的女士。"}, {"en": "Enthusiasm began to (pervade) the hall. A teacher who had (refereed) the morning’s games offered to organise next year’s tournament. A retired decorator could (gild) the damaged lettering; a gardener would tackle the (mould) only after a professional assessed its cause. Two teenagers volunteered to (daub) test colours on scrap wood. The kitchen team promised a (hygienic) reopening. A musician proposed lessons; a seamstress would teach children to work on an (inkle) weaving frame. Kit warned against trying to (cobble) everything together in a weekend. Good intentions deserved proper planning.", "zh": "热情开始(弥漫)整个礼堂。一位早上曾为比赛(担任裁判)的老师提出，可以组织明年的赛事。一位退休装饰工可以给受损的字样(重新镀金)；一位园丁愿意处理(霉菌)，但要先让专业人士查明成因。两个少年自愿在废木料上(涂抹)试验颜色。厨房团队保证重新开放时符合(卫生)要求。一位音乐家提议开课，一位裁缝则愿意教孩子们用织架编织(窄幅饰带)。基特提醒大家，不要指望用一个周末就把一切(仓促拼凑)起来。好心也值得配上周全的计划。"}, {"en": "To buy time, the fair continued indoors. The theatre company offered an improvised show about a (maniac) emperor whose accountants had turned (demonic). The plot was (lurid), the acting (erratic), and the jokes largely concerned tax. An (overage) prince attempted to (unsheathe) a wooden sword; a (banshee) replied with a (cackle). The emperor’s feathered (hackle) caught in a curtain. “This is a (veritable) disaster!” he declared, while the audience watched (spellbound). A small child pointed out that this was precisely the story. The resulting laughter seemed to (resound) through rooms that had been silent for months.", "zh": "为了争取时间，集市在室内继续。剧团献上一出即兴戏剧，讲一个(疯子)皇帝和他那些变得(如恶魔般的)会计。情节(耸人听闻)，表演(时好时坏)，笑话大多与税收有关。一个(超龄的)王子试图把木剑(拔出鞘)，一个(报丧女妖)则用一声(尖利怪笑)回应。皇帝带羽毛的(颈饰)挂在了帘子上。“这真是场(名副其实的)灾难！”他宣布，观众看得(入了迷)。一个小孩子指出，这不正是剧情吗？随之而来的笑声，仿佛在那些沉寂了数月的房间里不断(回响)。"}, {"en": "Kit worried that one old script used the offensive word “(paleface)”. Nora removed that scene; preserving a place did not require preserving every lazy insult ever spoken in it. Elsewhere, a magician tried to (juggle) a (satsuma), a (bauble), and a knitted (bobble). Children would (goggle) when he let one (dangle) from his ear. He managed to (bungle) the finale, but a helpful (tyke) supplied the missing fruit. Another performer proposed to (spreadeagle) himself between chairs until the solicitor offered a single raised eyebrow. Sometimes (vigilance) worked better than a page of rules.", "zh": "基特担心，一份旧剧本里用了带有冒犯意味的“(白脸人)”一词。诺拉删掉了那场戏；保存一个地方，并不需要保存曾在其中说过的每一句懒惰而无礼的话。另一边，一个魔术师试图把一只(蜜柑)、一个(小饰物)和一只毛线(绒球)(抛接耍弄)起来。当他把其中一样东西(悬挂)在耳朵上时，孩子们便(瞪大眼睛)。最后的压轴戏被他(搞砸)了，好在一个热心的(小家伙)补上了失踪的水果。另一名演员提议在两把椅子之间(四肢伸展地撑开身体)，直到律师挑起了一边眉毛。有时候，(警觉)比整页的规章都管用。"}, {"en": "The cooks assembled a supper from whatever remained: (rhubarb) pudding, bread with (treacle), and cheese with (pickle). “A culinary (miscarriage),” declared the emperor, helping himself twice. One woman rescued a (breakable) dish from the edge of a table. Another found a glass (shard) and swept it away before anyone could (tread) on it. A boy tried to (dribble) a football under the chairs until Kit sent him (upfield), towards an empty corridor. Outside, a delivery (sledge) served as a temporary bridge over the worst (pothole). Repairs were already beginning, in the modest form of people noticing what needed doing.", "zh": "厨师们用剩下的食物拼出一顿晚餐：(大黄)布丁、涂着(糖蜜)的面包，以及配(腌菜)的奶酪。“一场烹饪上的(失败)，”皇帝如此评价，却连吃了两份。一位女士从桌沿救下一只(易碎的)盘子。另一位发现了一块玻璃(碎片)，赶在人们(踩)上去之前把它扫走。一个男孩试着在椅子下面(带球)，直到基特让他朝(前场)去，指向一条空走廊。外面，一辆运货(雪橇)成了临时小桥，跨在最严重的(坑洞)上。修缮其实已经开始，只不过表现为人们留意到有哪些事情需要去做。"}, {"en": "At a quiet table, Nora found Milo trying to (scribble) an apology. He would (crumple) each sheet almost immediately. “You don’t need to (plead),” she told him. He said he felt like a (dunce). She disagreed. He had obeyed an adult and then told the truth when doing so became difficult. That was a (creditable) recovery. His actions at the drain had been (admirable), too. He began to (twiddle) his pen, trying not to smile. A (dimple) appeared. Nora resisted the urge to (mollycoddle) him. “Next time, ask what’s in the boxes.” He nodded. That, at least, was a lesson he could use.", "zh": "在一张安静的桌旁，诺拉发现迈洛正试着(潦草地写)一封道歉信。几乎每写一张，他马上就把它(揉成一团)。“你不需要(苦苦恳求)，”她告诉他。他说自己感觉像个(笨学生)。她并不同意。他听从了大人的话，然后在说真话变得困难时，仍然说出了真相。这是一次(值得肯定的)补救。他在排水沟那里的表现也(令人钦佩)。他开始(转弄)手中的笔，努力忍住笑，脸上浮现出一个(酒窝)。诺拉克制住了(过分呵护)他的冲动。“下次先问问箱子里是什么。”他点点头。至少，这是一个他能用得上的教训。"}, {"en": "Pike joined them with three cups of tea. Kit followed, plainly expecting a (tussle). Instead, the mayor admitted he had found it easier to sell a problem than to explain it. He was not (invincible), he said, and never had been. Kit considered an insulting reply, then settled for silence. “A (feeble) excuse,” Pike added. “But the real one.” Nora asked him to (uphold) the postponement in writing. He agreed. They would (prearrange) a survey, publish the accounts, and let qualified people identify the next (hurdle). If costs proved impossible, the village would at least face them with its eyes open.", "zh": "派克端着三杯茶过来。基特跟在后面，显然预期会有一场(争执)。然而，镇长承认，对他而言，把一个问题卖掉，比解释它要容易。他说自己并非(不可战胜)，从来都不是。基特想了一句挖苦的话，最终却选择沉默。“一个(无力的)借口，”派克补充道，“但这是真实的那个。”诺拉请他以书面形式(确认并坚持)延期决定。他答应了。他们将(预先安排)勘察，公开账目，让有资质的人确定下一道(难关)。如果成本确实无法承担，至少整个村庄会清醒地面对它。"}, {"en": "Not everyone welcomed the compromise. One woman threatened to (flounce) out because she wanted Pike removed immediately. Another began to (seethe) over the cost. The reporter received a (jab) of criticism for failing to expose a grand plot. Nora knew no agreement could avoid every (annoyance), every (squabble), or every attempt to (wangle) an advantage. Someone would always (peddle) a (tarradiddle). But she refused to let the desire for a perfect ending (upend) a useful one. The choice was between working together and watching the walls (crumble). Bellweather had done quite enough of the latter.", "zh": "并非所有人都欢迎这项妥协。一位女士威胁要(气冲冲地离开)，因为她希望派克立刻下台。另一位则开始为费用(怒火中烧)。记者也因为没有揭露一场大阴谋而挨了一记言语上的(刺击)。诺拉知道，没有任何协议能避免所有(烦恼)、所有(口角)，或者所有试图(耍手段)占便宜的行为。总会有人(兜售)一套(胡编乱造的话)。但她拒绝让对完美结局的渴望，(颠覆)一个有用的结局。要么一起做事，要么眼看墙壁(坍塌)。贝尔韦瑟对后一种做法，已经实践得够久了。"}, {"en": "By evening, donations and volunteer names began to (abound). A (raffle) brought an unexpected (upsurge) in cash. Visitors paid two pounds (apiece) to guess the weight of an enormous marrow, then stayed to (mingle). Children helped (spangle) the backdrop with paper stars. Old friends began to (reminisce); newcomers could (intermingle) without needing a family connection. The hall’s value was becoming (recognisable) in the simplest possible way: people were using it. Nora watched a grandmother try to (tickle) a laughing baby while a teenager helped an older neighbour (hobble) to a chair. No brochure could have explained the argument better.", "zh": "到了傍晚，捐款和志愿者名字开始(大量涌现)。一次(抽奖义卖)带来了一波意想不到的现金(增长)。游客们(每人)付两英镑，猜一只巨大西葫芦的重量，然后留下来(交往闲谈)。孩子们帮忙用纸星星把背景板(装点得闪闪发亮)。老朋友们开始(回忆往事)，新来的人也无需依靠亲戚关系，就能(融入人群)。礼堂的价值，正以最简单的方式变得(清晰可见)：人们正在使用它。诺拉看见一位祖母试图给一个笑着的婴儿(挠痒痒)，旁边一个少年则扶着年长的邻居(一瘸一拐地走)到椅子边。没有哪本宣传册能把道理说明得更好。"}, {"en": "The children’s painting stall reopened with water beginning to (speckle) the paper from someone’s wet hair. A toddler wanted to (dabble) both hands in blue paint; her sister preferred to (doodle) an elaborate crown. A mother tried to smooth a (wrinkle) from a costume only for its owner to (wriggle) away. Paper hats would (crinkle) whenever their wearers moved. One little dancer insisted that she needed room to (wiggle), and the bookkeeper readily shifted his chair.", "zh": "儿童绘画摊重新开张了，有人湿头发上的水开始把画纸(溅得斑斑点点)。一个幼童想把双手伸进蓝色颜料里(玩水般地蘸弄)，她的姐姐则更愿意(随手画)一顶精致的王冠。一位母亲试图抚平戏服上的一道(褶皱)，穿着戏服的孩子却(扭动着溜走)了。戴纸帽的人每动一下，帽子就会(皱得沙沙响)。一个小舞者坚持说，她需要地方(扭来扭去)，记账员便痛快地挪开了椅子。"}, {"en": "Kit found Nora by the stage. “Didn’t think you’d stay,” he said. She admitted she had intended to (forsake) the village as efficiently as possible. He showed no (reverence) for her change of heart. “Don’t make a religion of the place. Half of us are impossible.” She laughed. She had no desire to (seclude) herself here, nor to (delude) herself about what restoring it would demand. Still, she could come back for meetings. The prospect no longer made her (cringe).", "zh": "基特在舞台边找到诺拉。“没想到你会留下，”他说。她承认，自己原本打算尽快(抛下)这个村庄。他并没有因为她改变心意就表现出什么(崇敬)。“别把这个地方当成信仰。我们有一半人根本没法相处。”她笑了。她并不想把自己(隐居)在这里，也不想对修复这里所需付出的代价(自欺欺人)。不过，她可以回来参加会议。这个念头已经不再让她(畏缩)。"}, {"en": "Behind them, someone (uncorked) the last bottle of lemonade. Bells from the costumes gave a faint (tinkle), and the dog returned for a hopeful (snuffle) beneath the food table. Kit began to (ramble) about the building’s former (prominence) until Nora gently interrupted. They would have to (contend) with the present first. He nodded, then tried to (sidle) away before she could give him another job. She handed him a broom. She picked up her grandmother’s brooch. It was tarnished and missing a stone, but it was enough.", "zh": "他们身后，有人(拔开了)最后一瓶柠檬汽水的瓶塞。戏服上的铃铛发出轻轻的(叮铃声)，那条狗又回到餐桌下面，满怀希望地(嗅来嗅去)。基特开始(絮絮叨叨地讲)这栋楼从前的(重要地位)，直到诺拉温和地打断了他。他们得先(应付)眼前的事情。他点点头，随即想在她给自己安排新工作之前(侧着身子溜走)。她递给他一把扫帚。她拿起祖母的胸针。它已经失去光泽，还缺了一颗石头，但这就够了。"}, {"en": "After the storm, sunlight began to (dapple) the courtyard. A cart horse lifted a (hind) leg while its owner adjusted the harness. An actor called it his noble (steed), climbed aboard with a grand (stride), and immediately complained about his (backside). A loose (protuberance) on the seat had caught him; Kit inspected its (underside) and removed a nail. Children began to (ogle) the horse until its owner asked them to stand back. From the garden stall came a warning that (belladonna), (monkshood), and (wormwood) were display plants, not ingredients. Their labels had survived the rain better than most of the publicity.", "zh": "暴风雨过后，阳光开始在院子里(洒下斑驳光影)。主人调整挽具时，一匹拉车马抬起一条(后)腿。一个演员称它为自己的高贵(骏马)，豪迈地(跨步)骑上去，随即就抱怨自己的(屁股)。座位上一个松动的(凸起物)硌到了他；基特查看了座位的(底面)，拔掉一根钉子。孩子们开始(目不转睛地盯着)那匹马，直到马主人请他们退后。园艺摊上传来提醒：(颠茄)、(乌头)和(苦艾)是展示植物，不是食材。它们的标签比大多数宣传品更经得住雨水。"}, {"en": "The last visitors helped to (trundle) tables into storage. Somebody found the missing microscope (eyepiece) from the school display; somebody else retrieved a toy (manacle) from the stage. Two children tried to (scavenge) leftover sweets, while a dog continued to (forage) beneath the benches. Kit caught a boy about to (unhinge) a cupboard door and redirected his energy. “You don’t have to (maraud) through the place to help.” A volunteer had nearly managed to (singe) a cloth against a heater, so Nora moved it. Affection alone did not make a building safe. Attention did.", "zh": "最后几位游客帮忙把桌子(用小车推入)储藏室。有人找到了学校展品里失踪的显微镜(目镜)，另一个人从舞台上捡回一副玩具(手铐)。两个孩子试着(翻找)剩下的糖果，一条狗则继续在长凳下面(觅食)。基特逮住一个正要把柜门(卸下铰链)的男孩，把他的精力引向别处。“你不用在这里(到处洗劫)，也能帮上忙。”一名志愿者差点让一块布靠着暖气(烧焦)，诺拉于是把它挪走。光有感情并不能使一栋建筑安全。留心照看才能。"}, {"en": "At the entrance, Pike hesitated. “Your grandmother would have enjoyed this,” he said. Nora looked at his tired (visage). Perhaps she would. Or perhaps she would have delivered a twenty-minute account of everything they had overlooked. The thought brought a (twinge), but not the familiar urge to escape it.", "zh": "门口，派克犹豫了一下。“你祖母会喜欢今天这样的场面，”他说。诺拉望着他疲倦的(面容)。也许她会。也许她会花二十分钟，把他们忽略的每一件事都数落一遍。这个念头带来一阵(隐痛)，却没有带来那种熟悉的、想逃避它的冲动。"}, {"en": "Milo arrived with a box of salvaged photographs. “Found these in the (wreckage),” he (piped), then blushed at the exaggeration. Pike helped him stack them flat so the damp would not (rumple) the prints. “We’ll need to (redouble) our efforts tomorrow,” the mayor said. For once, Nora heard no election slogan in it. The afternoon’s (kerfuffle) had left a small (ripple) of change in the way they spoke to one another. They could go (onward) from there.", "zh": "迈洛抱着一箱抢救出来的照片走来。“在(残骸)里找到的，”他(尖声说道)，随即又因自己的夸张而脸红。派克帮他把照片平整地叠好，免得潮气把它们(弄皱)。“明天我们得(加倍)努力，”镇长说。这一次，诺拉没有从中听出竞选口号。下午那场(纷乱)让他们彼此说话的方式泛起了一点改变的(涟漪)。他们可以从这里继续(向前)。"}, {"en": "She could allow (reminiscence) without making the past a (shroud). Behind her, the orchestra tried one final piece. The sound was irregular, yet there was a (brilliance) in hearing it here at all. She felt briefly (awed), then reached for a broom.", "zh": "她可以允许自己(追忆往事)，而不把过去变成一块(裹尸布)。她身后，乐团试着演奏最后一首曲子。声音并不整齐，但能够在这里听见它，本身就有一种(光彩)。她短暂地感到(震撼)，随后伸手拿起扫帚。"}, {"en": "The building would not survive on one afternoon’s (defiance). Its problems were (interlocked), and money remained scarce. A fresh (resurgence) of goodwill might fade; public affection was (fickle). Nora knew enthusiasm could (ebb) as quickly as it arrived. But the day had exposed what ought to (underlie) any decision about the hall: knowledge of what people stood to lose. Tomorrow there would be estimates, objections, and more (discord). Tonight, a repaired lamp gave a small (twinkle) above the stairs. Saving the place might (disgruntle) almost everyone at some point. It would also give them somewhere to meet.", "zh": "这栋建筑不会仅凭一个下午的(抗争)就生存下去。它的问题(环环相扣)，资金依然紧张。新一轮善意的(复苏)可能会消退，公众的喜爱也(变化无常)。诺拉知道，热情可以来得快，(退得)也快。但这一天揭示了关于礼堂的任何决定都应以什么为(根基)：真正明白人们可能失去什么。明天会有估价、反对意见，以及更多(分歧)。今晚，楼梯上方一盏修好的灯正微微(闪烁)。拯救这个地方，可能会在某个时刻让几乎每个人都(心生不满)。但它也会给他们留下一个可以相聚的地方。"}];

/* ================= Reading state ================= */
const S = {
  p: 0, s: 0,            // paragraph / sentence position
  playing: false,
  gen: 0,                // generation counter guards stale utterance callbacks
  rate: 1,
  voice: null,
  showZh: true,
  activeEl: null,
  activeWordEl: null
};

/* ================= Text processing ================= */
function stripParens(t) { return t.replace(/\(([^)]*)\)/g, '$1'); }

function splitSentences(text) {
  const parts = text.match(/[^.!?]+[.!?]["\u201d']?|[^.!?]+$/g);
  return (parts || [text]).map(s => s.trim()).filter(Boolean);
}

// sentences[paraIdx] = [{ raw, plain }]
const sentences = DATA.map(d => {
  const out = [];
  for (const raw of splitSentences(d.en)) {
    out.push({ raw, plain: stripParens(raw) });
  }
  return out;
});
const TOTAL_SENTS = sentences.reduce((a, b) => a + b.length, 0);

/* ================= Rendering ================= */
const bookEl = document.getElementById('book');
const sentEls = [];   // sentEls[p][s] = { el, words:[{el,start,end}] }

function buildWords(sentSpan, raw) {
  // Builds karaoke word spans from the raw sentence, keeping the (vocab)
  // parentheses visible. `spoken` tracks character offsets in the
  // parenthesis-free text that is actually sent to speech synthesis, so
  // boundary-event charIndex values keep mapping to the right word.
  const words = [];
  let spoken = '';
  const emitPlain = text => {
    const parts = text.split(/(\s+)/);
    for (const part of parts) {
      if (part === '') continue;
      if (/^\s+$/.test(part)) {
        sentSpan.appendChild(document.createTextNode(part));
        spoken += part;
        continue;
      }
      const w = document.createElement('span');
      w.className = 'w';
      w.textContent = part;
      sentSpan.appendChild(w);
      words.push({ el: w, start: spoken.length, end: spoken.length + part.length });
      spoken += part;
    }
  };
  const re = /\([^)]*\)/g;
  let last = 0, m;
  while ((m = re.exec(raw)) !== null) {
    emitPlain(raw.slice(last, m.index));
    const inner = m[0].slice(1, -1);
    sentSpan.appendChild(document.createTextNode('('));
    const w = document.createElement('span');
    w.className = 'w vocab';
    w.textContent = inner;
    sentSpan.appendChild(w);
    words.push({ el: w, start: spoken.length, end: spoken.length + inner.length });
    spoken += inner;
    sentSpan.appendChild(document.createTextNode(')'));
    last = m.index + m[0].length;
  }
  emitPlain(raw.slice(last));
  return words;
}

function makeSentSpan(p, s, obj) {
  const sp = document.createElement('span');
  sp.className = 'sent';
  const words = buildWords(sp, obj.raw);
  sp.appendChild(document.createTextNode(' '));
  sp.addEventListener('click', () => jumpTo(p, s));
  return { el: sp, words };
}

// Title block (paragraph 0)
(function renderTitle() {
  const t = DATA[0];
  const div = document.createElement('div');
  div.className = 'title-block';
  const h2 = document.createElement('h2');
  sentEls[0] = [];
  sentences[0].forEach((obj, s) => {
    const r = makeSentSpan(0, s, obj);
    sentEls[0].push(r);
    h2.appendChild(r.el);
  });
  div.appendChild(h2);
  const zh = document.createElement('div');
  zh.className = 'zh-title';
  zh.textContent = t.zh;
  div.appendChild(zh);
  bookEl.appendChild(div);
})();

// Paragraph rows (paragraphs 1..n)
const jumpSel = document.getElementById('jumpSel');
DATA.slice(1).forEach((d, i) => {
  const p = i + 1;
  const row = document.createElement('div');
  row.className = 'row';

  const enCol = document.createElement('div');
  const no = document.createElement('div');
  no.className = 'para-no';
  no.textContent = 'Paragraph ' + p;
  enCol.appendChild(no);
  const enDiv = document.createElement('div');
  enDiv.className = 'en';
  sentEls[p] = [];
  sentences[p].forEach((obj, s) => {
    const r = makeSentSpan(p, s, obj);
    sentEls[p].push(r);
    enDiv.appendChild(r.el);
  });
  enCol.appendChild(enDiv);

  const zhCol = document.createElement('div');
  const zhDiv = document.createElement('div');
  zhDiv.className = 'zh';
  zhDiv.textContent = d.zh;
  zhCol.appendChild(zhDiv);

  row.appendChild(enCol);
  row.appendChild(zhCol);
  bookEl.appendChild(row);

  const opt = document.createElement('option');
  opt.value = p;
  opt.textContent = '¶' + p + ' — ' + stripParens(sentences[p][0].plain).slice(0, 42) + '…';
  jumpSel.appendChild(opt);
});

/* ================= Speech engine ================= */
function pickVoice() {
  const sel = document.getElementById('voiceSel');
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  sel.innerHTML = '';
  // Prefer en-US, then other en voices
  all.sort((a, b) => {
    const au = a.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    const bu = b.lang.toLowerCase().startsWith('en-us') ? 0 : 1;
    return au - bu;
  });
  const seen = new Set();
  for (const v of all) {
    if (seen.has(v.voiceURI)) continue;
    seen.add(v.voiceURI);
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(o);
  }
  const saved = S.voiceURI;
  let chosen = all.find(v => v.voiceURI === saved)
    || all.find(v => /microsoft/i.test(v.name) && /en[-_]us/i.test(v.lang))
    || all.find(v => /microsoft/i.test(v.name))
    || all.find(v => /google us english/i.test(v.name))
    || all[0] || null;
  if (chosen) {
    sel.value = chosen.voiceURI;
    S.voice = chosen;
    S.voiceURI = chosen.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = pickVoice;
  document.getElementById('voiceSel').addEventListener('change', e => {
    const v = speechSynthesis.getVoices().find(x => x.voiceURI === e.target.value) || null;
    S.voice = v; S.voiceURI = v ? v.voiceURI : null;
    saveState();
    if (S.playing) restartSentence();
  });
}

function setActiveSentence(p, s, scroll) {
  if (S.activeEl) S.activeEl.classList.remove('active');
  if (S.activeWordEl) { S.activeWordEl.classList.remove('on'); S.activeWordEl = null; }
  const r = sentEls[p][s];
  S.activeEl = r.el;
  r.el.classList.add('active');
  if (scroll !== false) r.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  updateProgress();
  saveState();
}

function highlightWord(p, s, charIndex) {
  const words = sentEls[p][s].words;
  let best = null;
  for (const w of words) {
    if (w.start <= charIndex) best = w;
    else break;
  }
  if (best && best.el !== S.activeWordEl) {
    if (S.activeWordEl) S.activeWordEl.classList.remove('on');
    best.el.classList.add('on');
    S.activeWordEl = best.el;
  }
}

function advance() {
  S.s++;
  if (S.s >= sentences[S.p].length) { S.p++; S.s = 0; }
  if (S.p >= sentences.length) { finishReading(); return false; }
  return true;
}

function speakSentence() {
  if (!S.playing) return;
  const gen = S.gen, p = S.p, s = S.s;
  const text = sentences[p][s].plain;
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = S.rate;
  if (S.voice) utt.voice = S.voice;
  utt.lang = (S.voice && S.voice.lang) || 'en-US';
  utt.onstart = () => { if (gen === S.gen && S.playing) setActiveSentence(p, s); };
  utt.onboundary = e => {
    if (gen === S.gen && S.playing && e.name === 'word') highlightWord(p, s, e.charIndex);
  };
  utt.onend = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();
  };
  utt.onerror = () => {
    if (gen !== S.gen || !S.playing) return;
    if (advance()) speakSentence();  // skip a sentence that failed
  };
  speechSynthesis.speak(utt);
}

function restartSentence() {
  S.gen++;
  speechSynthesis.cancel();
  // cancel() is async; give it a tick before speaking
  setTimeout(() => { if (S.playing) speakSentence(); }, 60);
}

function updatePlayBtn() {
  const b = document.getElementById('playBtn');
  if (S.playing) { b.innerHTML = '&#10074;&#10074; Pause'; b.classList.remove('paused'); }
  else { b.innerHTML = '&#9654; ' + (S.p === 0 && S.s === 0 && !S.activeEl ? 'Start' : 'Resume'); b.classList.add('paused'); }
}

function play() {
  if (!('speechSynthesis' in window)) { alert('Sorry, this browser does not support speech synthesis.'); return; }
  if (S.playing) { pause(); return; }
  S.playing = true;
  S.gen++;
  updatePlayBtn();
  const start = () => speakSentence();
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => { if (S.playing) start(); }, 80);
  } else {
    start();
  }
}

function pause() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  updatePlayBtn();
  saveState();
}

function finishReading() {
  S.playing = false;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  if (S.activeEl) { S.activeEl.classList.remove('active'); S.activeEl = null; }
  updatePlayBtn();
  updateProgress();
  saveState();
}

function jumpTo(p, s) {
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

function stepSentence(dir) {
  // dir: -1 = back one sentence, +1 = forward one sentence
  let p = S.p, s = S.s + dir;
  if (s < 0) {
    p--;
    if (p < 0) return;
    s = sentences[p].length - 1;
  } else if (s >= sentences[p].length) {
    p++;
    if (p >= sentences.length) return;
    s = 0;
  }
  S.p = p; S.s = s;
  setActiveSentence(p, s);
  if (S.playing) restartSentence();
}

/* ================= Progress & persistence ================= */
function updateProgress() {
  let done = 0;
  for (let p = 0; p < S.p; p++) done += sentences[p].length;
  done += S.s;
  const pct = TOTAL_SENTS ? (done / TOTAL_SENTS) * 100 : 0;
  document.getElementById('progressFill').style.width = pct.toFixed(1) + '%';
  const label = S.p === 0 ? 'Title' : ('Paragraph ' + S.p + ' of ' + (sentences.length - 1));
  document.getElementById('posLabel').textContent =
    label + ' · sentence ' + (S.s + 1) + ' of ' + sentences[S.p].length +
    ' · ' + Math.round(pct) + '%';
  const js = document.getElementById('jumpSel');
  if (S.p > 0) js.value = String(S.p);
}

const LS_KEY = 'village-audiobook-v2';
const LS_OLD_KEY = 'village-audiobook-v1';
function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      p: S.p, s: S.s, rate: S.rate, voiceURI: S.voiceURI, showZh: S.showZh
    }));
  } catch (e) {}
}
function loadState() {
  try {
    let d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!d) {
      // Migrate from v1: keep position and settings, but drop the saved voice
      // so the new Microsoft-first default applies.
      const old = JSON.parse(localStorage.getItem(LS_OLD_KEY) || 'null');
      if (old) {
        d = { p: old.p, s: old.s, rate: old.rate, showZh: old.showZh };
        localStorage.removeItem(LS_OLD_KEY);
      }
    }
    d = d || {};
    if (typeof d.p === 'number' && d.p < sentences.length) { S.p = d.p; S.s = Math.min(d.s || 0, sentences[d.p].length - 1); }
    if (d.rate) { S.rate = d.rate; document.getElementById('rateSel').value = String(d.rate); }
    if (d.voiceURI) S.voiceURI = d.voiceURI;
    if (d.showZh === false) toggleZh(false);
  } catch (e) {}
}

/* ================= UI wiring ================= */
function toggleZh(show) {
  S.showZh = show;
  document.body.classList.toggle('hide-zh', !show);
  document.getElementById('zhToggle').innerHTML = show ? '&#30446; Hide translation' : '&#30446; Show translation';
  saveState();
}
document.getElementById('zhToggle').addEventListener('click', () => toggleZh(!S.showZh));
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('restartBtn').addEventListener('click', () => {
  const wasPlaying = S.playing;
  S.gen++;
  speechSynthesis.cancel();
  S.p = 0; S.s = 0;
  setActiveSentence(0, 0);
  if (wasPlaying) setTimeout(() => { if (S.playing) speakSentence(); }, 60);
  else { pause(); }
});
document.getElementById('rateSel').addEventListener('change', e => {
  S.rate = parseFloat(e.target.value);
  saveState();
  if (S.playing) restartSentence();
});
jumpSel.addEventListener('change', e => {
  const p = parseInt(e.target.value, 10);
  if (!isNaN(p)) jumpTo(p, 0);
});
document.addEventListener('keydown', e => {
  const tag = document.activeElement ? document.activeElement.tagName : '';
  const inField = /INPUT|SELECT|TEXTAREA/.test(tag);
  if (e.code === 'Space' && !inField && tag !== 'BUTTON') {
    e.preventDefault();
    play();
  } else if ((e.code === 'ArrowLeft' || e.code === 'ArrowRight') && !inField) {
    // Arrow keys are safe to handle even with a focused button (they don't activate it)
    e.preventDefault();
    stepSentence(e.code === 'ArrowLeft' ? -1 : 1);
  }
});
window.addEventListener('beforeunload', saveState);

/* ================= Init ================= */
loadState();
if ('speechSynthesis' in window) pickVoice();
updatePlayBtn();
updateProgress();
if (S.p > 0 || S.s > 0) setActiveSentence(S.p, S.s, false);
</script>
