<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felt &amp; Odds Hold'em</title>
<meta name="description" content="No-limit Texas Hold'em against five computer opponents, with a coach that grades every decision.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Libre+Caslon+Text:wght@700&family=Limelight&display=swap">
<style>
/* Layout: a card room seen from your chair. The table owns the left, the coach's scorecard sits at your elbow. */
:root {
  --bg: #e3e9e7;
  --surface: #f5f8f7;
  --surface-2: #e9efed;
  --ink: #13211f;
  --muted: #566a66;
  --line: #c8d3d0;
  --brand: #7a2228;
  --brass: #94681d;
  --brass-soft: #f0e2c0;
  --focus: #1f6f8b;
  --good: #217449; --okay: #2f7869; --close: #9a630b; --loose: #b4531c; --bad: #b02f2a;
  --good-bg: #dcefe4; --okay-bg: #dbece8; --close-bg: #f4e7cc; --loose-bg: #f6e0d2; --bad-bg: #f5dcda;

  /* the table is an object: same materials in both themes */
  --felt-1: #1f6e66; --felt-2: #0f433e; --felt-3: #0a2f2c;
  --inlay: rgba(231, 205, 140, 0.42);
  --rail-1: #5d2428; --rail-2: #2c0f12;
  --card: #fbf8f0; --card-edge: #d9d2c1; --card-ink: #1a1a1a;
  --suit-s: #1a1a1a; --suit-h: #c21d36; --suit-d: #1d5bbf; --suit-c: #1b7a3b;
  --back-1: #6b1f25; --back-2: #8f2f35; --back-line: rgba(240, 214, 160, 0.55);
  --plaque: rgba(9, 20, 19, 0.86); --plaque-ink: #eef4f2; --plaque-muted: #9fb4af; --plaque-line: rgba(231, 205, 140, 0.25);
  --chip-1: #e9e4d6; --chip-2: #b0353b; --gold: #e2bd6a;

  --font-display: 'Limelight', 'Didot', 'Bodoni 72', Georgia, serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --font-card: 'Libre Caslon Text', 'Baskerville', Georgia, serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1312; --surface: #131d1b; --surface-2: #192624; --ink: #e2ebe8; --muted: #8ea29d; --line: #26352f;
    --brand: #dcae5c; --brass: #d6aa58; --brass-soft: #3a301c; --focus: #6cc3e0;
    --good: #52b884; --okay: #6db5a5; --close: #dca84a; --loose: #e58a52; --bad: #ec6b63;
    --good-bg: #173326; --okay-bg: #163230; --close-bg: #33290f; --loose-bg: #3a2414; --bad-bg: #3a1a18;
    --felt-1: #1a5f58; --felt-2: #0d3a36; --felt-3: #082624;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1312; --surface: #131d1b; --surface-2: #192624; --ink: #e2ebe8; --muted: #8ea29d; --line: #26352f;
  --brand: #dcae5c; --brass: #d6aa58; --brass-soft: #3a301c; --focus: #6cc3e0;
  --good: #52b884; --okay: #6db5a5; --close: #dca84a; --loose: #e58a52; --bad: #ec6b63;
  --good-bg: #173326; --okay-bg: #163230; --close-bg: #33290f; --loose-bg: #3a2414; --bad-bg: #3a1a18;
  --felt-1: #1a5f58; --felt-2: #0d3a36; --felt-3: #082624;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.45 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.app { max-width: 1320px; margin: 0 auto; padding-inline: 16px; padding-block: 10px 24px; display: flex; flex-direction: column; gap: 12px; }

/* ---------- header ---------- */
.bar { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand .mark { font: 400 26px/1 var(--font-display); color: var(--brand); letter-spacing: 0.01em; }
.brand .sub { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.meta { display: flex; gap: 6px 16px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.meta b { color: var(--ink); font-weight: 600; }
.meta .pos { color: var(--good); } .meta .neg { color: var(--bad); }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 500; }
.btn-ghost:hover { border-color: var(--brass); }

/* ---------- main layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 16px; align-items: start; }
.play { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
@media (max-width: 1020px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* ---------- table ---------- */
.table-wrap { position: relative; container-type: inline-size; aspect-ratio: 16 / 10; width: 100%; user-select: none; -webkit-user-select: none; }
@media (max-width: 640px) { .table-wrap { aspect-ratio: 4 / 5; } }
.rail { position: absolute; inset: 9% 6.5%; border-radius: 999px;
  background: radial-gradient(120% 100% at 50% 0%, var(--rail-1), var(--rail-2));
  box-shadow: 0 18px 40px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.12), inset 0 -3px 6px rgba(0,0,0,.5); }
@media (max-width: 640px) { .rail { inset: 8% 7%; } }
.felt { position: absolute; inset: clamp(10px, 2.6cqw, 22px); border-radius: 999px;
  background:
    radial-gradient(70% 60% at 50% 42%, var(--felt-1) 0%, var(--felt-2) 70%, var(--felt-3) 100%);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 10px 30px rgba(0,0,0,.45); overflow: hidden; }
.felt::before { content: ''; position: absolute; inset: 7% 5%; border-radius: 999px; border: 1.5px solid var(--inlay); }
.felt::after { content: ''; position: absolute; inset: 0; opacity: .18; mix-blend-mode: overlay;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.08) 0 1px, transparent 1px 3px); }
.felt-mark { position: absolute; left: 50%; top: 73%; transform: translateX(-50%); font: 400 clamp(12px, 2.2cqw, 20px)/1 var(--font-display); color: rgba(231,205,140,.18); letter-spacing: .12em; white-space: nowrap; }
@media (max-width: 640px) { .felt-mark { top: 68%; } }

.center { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.2cqw, 10px); width: 64%; z-index: 2; }
@media (max-width: 640px) { .center { top: 47%; width: 76%; } }
.pot { display: flex; align-items: center; gap: 8px; color: var(--plaque-ink); min-height: 26px; }
.pot .lbl { font: 400 clamp(14px, 2.4cqw, 20px)/1 var(--font-display); letter-spacing: .04em; }
.pot .amt { font: 500 clamp(13px, 2.1cqw, 17px)/1 var(--font-mono); }
.pot .side { font: 500 11px/1 var(--font-mono); color: var(--gold); opacity: .9; }
.board { display: flex; gap: clamp(4px, .9cqw, 8px); justify-content: center; min-height: calc(var(--cw-board) * 1.4); --cw: var(--cw-board); }
.table-wrap { --cw-board: clamp(38px, 8.6cqw, 70px); --cw-hero: clamp(46px, 9.4cqw, 76px); --cw-bot: clamp(26px, 4.6cqw, 40px); }
@media (max-width: 640px) { .table-wrap { --cw-board: clamp(36px, 12.4cqw, 56px); --cw-hero: clamp(44px, 13.6cqw, 60px); --cw-bot: clamp(24px, 7.2cqw, 32px); } }
.slot { width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1); border: 1.5px dashed rgba(231,205,140,.18); }
.note { min-height: 20px; color: var(--plaque-ink); font-size: clamp(12px, 1.8cqw, 14px); text-align: center; text-wrap: balance; }
.note b { color: var(--gold); font-weight: 600; }
.note.show { animation: rise .35s ease-out; }

/* ---------- cards ---------- */
.card { --cw: 48px; width: var(--cw); height: calc(var(--cw) * 1.4); border-radius: calc(var(--cw) * .1); background: var(--card); color: var(--card-ink);
  position: relative; flex: none; box-shadow: 0 0 0 1px var(--card-edge) inset, 0 1px 0 rgba(0,0,0,.3), 0 4px 10px rgba(0,0,0,.3); transition: transform .25s, opacity .25s, filter .25s; }
.card .ix { position: absolute; left: 7%; top: 5%; display: flex; flex-direction: column; align-items: center; width: 42%; }
.card .ix b { font: 700 calc(var(--cw) * .42)/1 var(--font-card); letter-spacing: -0.06em; }
.card .ix b.ten { letter-spacing: -0.12em; font-size: calc(var(--cw) * .36); margin-left: -0.06em; }
.card .ix svg { width: calc(var(--cw) * .27); height: calc(var(--cw) * .27); margin-top: calc(var(--cw) * .04); }
.card .pip { position: absolute; right: 7%; bottom: 6%; width: calc(var(--cw) * .52); height: calc(var(--cw) * .52); }
.card svg { fill: currentColor; display: block; }
.card[data-suit="s"] { color: var(--suit-s); } .card[data-suit="h"] { color: var(--suit-h); }
.card[data-suit="d"] { color: var(--suit-d); } .card[data-suit="c"] { color: var(--suit-c); }
.two-color .card[data-suit="d"] { color: var(--suit-h); } .two-color .card[data-suit="c"] { color: var(--suit-s); }
.card.back { background:
  repeating-linear-gradient(45deg, transparent 0 5px, var(--back-line) 5px 6px),
  repeating-linear-gradient(-45deg, transparent 0 5px, var(--back-line) 5px 6px),
  linear-gradient(160deg, var(--back-2), var(--back-1));
  box-shadow: 0 0 0 calc(var(--cw) * .06) var(--card) inset, 0 0 0 calc(var(--cw) * .075) var(--card-edge) inset, 0 1px 0 rgba(0,0,0,.3), 0 4px 10px rgba(0,0,0,.3); }
.card.dim { filter: brightness(.55) saturate(.6); }
.card.win { transform: translateY(-8%); box-shadow: 0 0 0 2px var(--gold), 0 6px 16px rgba(0,0,0,.4); }
.card.folded { opacity: .55; filter: grayscale(.4); }
.card.deal { animation: deal .32s cubic-bezier(.2,.8,.3,1) both; }
.card.flip { animation: flip .38s ease-out both; }
@keyframes deal { from { transform: translate(var(--dx, 0), var(--dy, -40px)) rotate(-8deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes flip { 0% { transform: rotateY(90deg) scale(.96); } 100% { transform: none; } }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- seats ---------- */
.seat { position: absolute; left: 0; top: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; width: clamp(80px, 17cqw, 136px); }
.seat .hole { display: flex; justify-content: center; position: relative; z-index: 1; margin-bottom: calc(var(--cw) * -.42); --cw: var(--cw-bot); min-height: calc(var(--cw) * 1.4); }
.seat .hole .card + .card { margin-left: calc(var(--cw) * -.38); transform: rotate(6deg) translateY(4%); }
.seat .hole .card:first-child { transform: rotate(-4deg); }
.seat .hole .card.win { transform: translateY(-14%); }
.seat.hero .hole { --cw: var(--cw-hero); margin-bottom: calc(var(--cw) * -.22); }
.seat.hero .hole .card + .card { margin-left: calc(var(--cw) * .08); transform: none; }
.seat.hero .hole .card:first-child { transform: none; }
.seat.hero .hole .card.win { transform: translateY(-8%); }
.plaque { position: relative; z-index: 2; width: 100%; background: var(--plaque); color: var(--plaque-ink); border-radius: 10px; padding: 5px 8px 6px; border: 1px solid var(--plaque-line);
  box-shadow: 0 6px 14px rgba(0,0,0,.3); transition: box-shadow .2s, border-color .2s; }
.plaque .nm { display: flex; align-items: center; gap: 5px; min-width: 0; }
.plaque .name { font-weight: 600; font-size: clamp(11px, 1.7cqw, 13px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.plaque .tag { font-size: 9px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,.08); color: var(--plaque-muted); white-space: nowrap; }
.tag[data-style="rock"] { color: #b9c4d0; } .tag[data-style="shark"] { color: #8fd3c4; } .tag[data-style="hustler"] { color: #f1b26b; }
.tag[data-style="station"] { color: #c7b4f0; } .tag[data-style="maniac"] { color: #ff8f86; }
.plaque .row2 { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.plaque .stk { font: 500 clamp(11px, 1.7cqw, 13px)/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.plaque .posl { font-size: 9.5px; font-weight: 600; letter-spacing: .1em; color: var(--gold); }
.plaque .hud { font: 500 9.5px/1.2 var(--font-mono); color: var(--plaque-muted); margin-top: 1px; }
.seat.acting .plaque { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(226,189,106,.35), 0 6px 18px rgba(0,0,0,.4); }
.seat.acting .plaque::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--gold); border-radius: 2px; animation: think 1s ease-in-out infinite alternate; }
@keyframes think { from { opacity: .3; } to { opacity: 1; } }
.seat.out .plaque { opacity: .5; }
.seat.folded .plaque { opacity: .62; }
.seat.winner .plaque { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(226,189,106,.45), 0 0 26px rgba(226,189,106,.35); }
.bubble { position: absolute; z-index: 4; top: -12px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  background: var(--card); color: var(--card-ink); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.bubble[data-kind="fold"] { background: #3a4644; color: #cfd8d5; }
.bubble[data-kind="raise"], .bubble[data-kind="allin"] { background: var(--gold); color: #2a1a05; }
.bubble.pop { animation: rise .25s ease-out; }
.seat.hero .bubble { top: 50%; left: calc(100% + 6px); transform: translateY(-50%); }
.eqb { position: absolute; z-index: 5; top: -6px; right: -8px; font: 600 11px/1 var(--font-mono); background: var(--gold); color: #2a1a05; padding: 4px 6px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.seat.hero .eqb { top: 0; right: -12px; }

.bet { position: absolute; left: 0; top: 0; z-index: 2; display: flex; align-items: center; gap: 4px; transform: translate(-50%, -50%); font: 500 clamp(10px, 1.6cqw, 12px)/1 var(--font-mono); color: var(--plaque-ink);
  background: rgba(0,0,0,.32); padding: 3px 7px 3px 3px; border-radius: 999px; transition: transform .35s ease-in, opacity .35s; }
.chip { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, var(--chip-2) 0 38%, var(--chip-1) 40% 52%, var(--chip-2) 54%); box-shadow: 0 0 0 1.5px var(--chip-1) inset, 0 1px 2px rgba(0,0,0,.5); flex: none; }
.chip.big { width: 18px; height: 18px; }
.dealer { position: absolute; left: 0; top: 0; z-index: 3; width: clamp(18px, 3cqw, 24px); height: clamp(18px, 3cqw, 24px); border-radius: 50%; background: var(--card); color: #222;
  display: grid; place-items: center; font: 700 clamp(9px, 1.5cqw, 12px)/1 var(--font-card); box-shadow: 0 2px 4px rgba(0,0,0,.45), inset 0 0 0 2px #d9d2c1; transform: translate(-50%, -50%); transition: left .5s, top .5s; }
.flychip { position: absolute; z-index: 6; pointer-events: none; transition: transform .6s cubic-bezier(.3,.7,.3,1), opacity .6s; }

/* ---------- controls ---------- */
.controls { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.status { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); min-height: 20px; }
.status b { color: var(--ink); font-weight: 600; }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.act { position: relative; border: 1px solid var(--line); border-radius: 10px; padding: 11px 8px; font-weight: 600; font-size: 15px; background: var(--surface-2); display: flex; justify-content: center; align-items: center; gap: 8px; min-height: 48px; }
.act .amt { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.act kbd { font: 500 10px/1 var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 4px; }
.act:disabled { opacity: .45; cursor: default; }
.act.fold:not(:disabled):hover { border-color: var(--muted); }
.act.call { background: color-mix(in srgb, var(--okay) 14%, var(--surface)); border-color: color-mix(in srgb, var(--okay) 45%, var(--line)); }
.act.raise { background: var(--brand); border-color: var(--brand); color: var(--surface); }
.act.raise kbd { color: inherit; border-color: color-mix(in srgb, var(--surface) 50%, transparent); opacity: .75; }
.act.pick::before { content: 'Coach'; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--brass); color: var(--surface); padding: 2px 6px; border-radius: 999px; }
.sizing { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; font-weight: 500; }
.presets button:hover { border-color: var(--brass); }
.presets button.on { border-color: var(--brand); color: var(--brand); }
.slider { flex: 1 1 160px; display: flex; gap: 8px; align-items: center; min-width: 0; }
.slider input[type=range] { flex: 1; min-width: 0; accent-color: var(--brand); }
.slider input[type=number] { width: 86px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-family: var(--font-mono); font-size: 13px; }
.slider .bbv { font: 500 11px/1 var(--font-mono); color: var(--muted); width: 52px; }
.next { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-primary { border: 1px solid var(--brand); background: var(--brand); color: var(--surface); border-radius: 10px; padding: 11px 18px; font-weight: 600; font-size: 15px; display: inline-flex; gap: 8px; align-items: center; }
.btn-primary kbd { font: 500 10px/1 var(--font-mono); border: 1px solid color-mix(in srgb, var(--surface) 50%, transparent); border-radius: 4px; padding: 2px 4px; opacity: .8; }
.btn-line { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 14px; font-weight: 500; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.check input { accent-color: var(--brand); }

/* ---------- coach panel ---------- */
.coach { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 6px; }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 11px 4px 9px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
.tabs .count { font: 500 10px/1 var(--font-mono); background: var(--surface-2); padding: 2px 5px; border-radius: 999px; margin-left: 4px; color: var(--muted); }
.panel { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 6px 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.modehelp { font-size: 12px; color: var(--muted); margin-top: -4px; }
.c-head { display: flex; gap: 12px; align-items: center; }
.c-head .mini { display: flex; gap: 3px; --cw: 34px; }
.c-head .mini .card { --cw: 34px; }
.c-head h3 { margin: 0; font-size: 16px; font-weight: 700; text-wrap: balance; }
.c-head .sub { font-size: 12.5px; color: var(--muted); }
.chipline { display: flex; flex-wrap: wrap; gap: 5px; }
.pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }

<script>
"use strict";
/* ===== Cards & hand evaluation ===== */
const RANKS = '23456789TJQKA';
const SUIT_CH = 'shdc';
const SUIT_SYM = ['♠', '♥', '♦', '♣'];
const RANK_NAME = ['Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Jack','Queen','King','Ace'];
const RANK_PLURAL = ['Twos','Threes','Fours','Fives','Sixes','Sevens','Eights','Nines','Tens','Jacks','Queens','Kings','Aces'];
const CAT_NAME = ['High Card','One Pair','Two Pair','Three of a Kind','Straight','Flush','Full House','Four of a Kind','Straight Flush'];

const POP = new Uint8Array(8192);
for (let i = 1; i < 8192; i++) POP[i] = POP[i >> 1] + (i & 1);
const _cnt = new Int8Array(13);
const _sm = new Int32Array(4);

function cardStr(c) { return RANKS[c >> 2] + SUIT_CH[c & 3]; }
function parseCard(s) { return RANKS.indexOf(s[0]) * 4 + SUIT_CH.indexOf(s[1]); }

function straightHigh(mask) {
  const m = (mask << 1) | ((mask >> 12) & 1);
  for (let i = 13; i >= 4; i--) if (((m >> (i - 4)) & 31) === 31) return i - 1;
  return -1;
}
function packTop(mask, n, shift) {
  let v = 0;
  for (let r = 12; r >= 0 && n > 0; r--) if (mask & (1 << r)) { v |= r << shift; shift -= 4; n--; }
  return v;
}

/* Score: category << 20 | ranks in 4-bit slots. Higher is better. Works for 5-7 cards. */
function evalCards(cards, len) {
  if (len === undefined) len = cards.length;
  _cnt.fill(0); _sm[0] = _sm[1] = _sm[2] = _sm[3] = 0;
  let rm = 0;
  for (let i = 0; i < len; i++) {
    const c = cards[i], r = c >> 2;
    _cnt[r]++; _sm[c & 3] |= 1 << r; rm |= 1 << r;
  }
  let fm = 0;
  for (let s = 0; s < 4; s++) if (POP[_sm[s]] >= 5) { fm = _sm[s]; break; }
  if (fm) { const sh = straightHigh(fm); if (sh >= 0) return (8 << 20) | (sh << 16); }
  let quad = -1, t1 = -1, t2 = -1, p1 = -1, p2 = -1;
  for (let r = 12; r >= 0; r--) {
    const k = _cnt[r];
    if (k === 4) quad = r;
    else if (k === 3) { if (t1 < 0) t1 = r; else if (t2 < 0) t2 = r; }

  if (sh >= 0) return (4 << 20) | (sh << 16);

function bestFive(cards) {

function handCode(c1, c2) {

    else if (i > j) out.push(RANKS[i] + RANKS[j] + 's');

}

  else { for (let s = 0; s < 4; s++) for (let t = 0; t < 4; t++) if (s !== t) out.push([r1 * 4 + s, r2 * 4 + t]); }
  return out;
}

/* ===== Equity ===== */
const _w7 = new Int8Array(7);

// How plausible is a holding, given the opponent kept betting (a) or calling (c) after the flop?
function postWeight(h1, h2, board, o) {
  if (!o.a && !o.c) return 1;
  _w7[0] = h1; _w7[1] = h2;
  for (let i = 0; i < board.length; i++) _w7[2 + i] = board[i];
  const s = evalCards(_w7, 2 + board.length), cat = s >> 20;
  const r1 = h1 >> 2, r2 = h2 >> 2;
  let topB = 0;
  for (let i = 0; i < board.length; i++) topB = Math.max(topB, board[i] >> 2);
  let tier;
  if (cat >= 3) tier = 3;
  else if (cat === 2) tier = (r1 === ((s >> 16) & 15) || r2 === ((s >> 16) & 15) || r1 === ((s >> 12) & 15) || r2 === ((s >> 12) & 15)) ? 3 : 1;
  else if (cat === 1) {
    const pr = (s >> 16) & 15;
    if (r1 === r2 && pr === r1) tier = pr > topB ? 2.6 : 1;
    else if (pr === r1 || pr === r2) tier = pr === topB ? 2.2 : 1;
    else tier = 0;
  } else tier = 0;
  if (tier < 2 && board.length < 5) {
    // draws
    const sc = [0, 0, 0, 0];
    for (let i = 0; i < 2 + board.length; i++) sc[_w7[i] & 3]++;
    if ((sc[h1 & 3] >= 4) || (sc[h2 & 3] >= 4)) tier = Math.max(tier, 1.5);
    let rm = 0; for (let i = 0; i < 2 + board.length; i++) rm |= 1 << (_w7[i] >> 2);
    let outs = 0;
    if (straightHigh(rm) < 0) for (let x = 0; x < 13; x++) if (!(rm & (1 << x)) && straightHigh(rm | (1 << x)) >= 0) outs++;
    if (outs >= 2) tier = Math.max(tier, 1.5);
  }
  const loose = o.loose || 1;
  if (tier >= 3) return 1;
  if (tier >= 2.5) return o.a >= 2 ? 0.8 : 0.95;
  if (tier >= 2) return o.a >= 2 ? 0.55 : 0.85;
  if (tier >= 1.5) return Math.min(1, 0.6 * loose);
  if (tier >= 1) return Math.min(1, Math.pow(0.45, o.a) * Math.pow(0.75, o.c) * loose);
  return Math.min(1, Math.pow(0.22, o.a) * Math.pow(0.45, o.c) * loose);
}

function sampleCombo(pct, used) {
  const K = Math.max(6, Math.min(1326, Math.round(pct / 100 * 1326)));
  for (let t = 0; t < 40; t++) {
    const i = (Math.random() * K) | 0;
    if (!used[COMBO_A[i]] && !used[COMBO_B[i]]) return i;
  }
  for (;;) { const i = (Math.random() * 1326) | 0; if (!used[COMBO_A[i]] && !used[COMBO_B[i]]) return i; }
}

// opps: [{pct, a, c, loose}]
function equityMC(hero, board, opps, iters) {
  const base = new Uint8Array(52), used = new Uint8Array(52);
  base[hero[0]] = base[hero[1]] = 1;
  for (const c of board) base[c] = 1;
  const nB = board.length;
  const hc = new Int8Array(7), oc = new Int8Array(7);
  const oh = new Int8Array(opps.length * 2);
  hc[0] = hero[0]; hc[1] = hero[1];
  for (let i = 0; i < nB; i++) { hc[2 + i] = board[i]; oc[2 + i] = board[i]; }
  let win = 0;
  for (let it = 0; it < iters; it++) {
    used.set(base);
    for (let j = 0; j < opps.length; j++) {
      const o = opps[j];
      let idx, tries = 0;
      for (;;) {
        idx = sampleCombo(o.pct, used);
        if (nB < 3 || (!o.a && !o.c)) break;
        if (Math.random() < postWeight(COMBO_A[idx], COMBO_B[idx], board, o) || ++tries > 24) break;
      }
      oh[j * 2] = COMBO_A[idx]; oh[j * 2 + 1] = COMBO_B[idx];
      used[COMBO_A[idx]] = used[COMBO_B[idx]] = 1;
    }
    for (let k = nB; k < 5; k++) {
      let c; do { c = (Math.random() * 52) | 0; } while (used[c]);
      used[c] = 1; hc[2 + k] = c; oc[2 + k] = c;
    }
    const h = evalCards(hc, 7);
    let lost = false, ties = 1;
    for (let j = 0; j < opps.length; j++) {
      oc[0] = oh[j * 2]; oc[1] = oh[j * 2 + 1];
      const s = evalCards(oc, 7);
      if (s > h) { lost = true; break; }
      if (s === h) ties++;
    }
    if (!lost) win += 1 / ties;
  }
  return win / iters;
}

// Exact (or large-sample) equity for fully known hands — used for all-in displays.
function equityKnown(hands, board) {
  const used = new Uint8Array(52);
  for (const h of hands) { used[h[0]] = used[h[1]] = 1; }
  for (const c of board) used[c] = 1;
  const rest = []; for (let c = 0; c < 52; c++) if (!used[c]) rest.push(c);
  const need = 5 - board.length;
  const eq = new Float64Array(hands.length);
  const cards = hands.map(h => { const a = new Int8Array(7); a[0] = h[0]; a[1] = h[1]; board.forEach((c, i) => a[2 + i] = c); return a; });
  const scores = new Int32Array(hands.length);
  let total = 0;
  const score = (fill) => {
    let best = -1, cnt = 0;
    for (let i = 0; i < hands.length; i++) {
      for (let k = 0; k < need; k++) cards[i][2 + board.length + k] = fill[k];
      scores[i] = evalCards(cards[i], 7);
      if (scores[i] > best) { best = scores[i]; cnt = 1; } else if (scores[i] === best) cnt++;
    }
    for (let i = 0; i < hands.length; i++) if (scores[i] === best) eq[i] += 1 / cnt;
    total++;
  };
  if (need === 0) score([]);
  else if (need === 1) for (const a of rest) score([a]);
  else if (need === 2) { for (let i = 0; i < rest.length; i++) for (let j = i + 1; j < rest.length; j++) score([rest[i], rest[j]]); }
  else {
    for (let it = 0; it < 6000; it++) {
      const f = [];
      while (f.length < need) { const c = rest[(Math.random() * rest.length) | 0]; if (!f.includes(c)) f.push(c); }
      score(f);
    }
  }
  return Array.from(eq, v => v / total);
}

/* ===== Hand analysis for the coach ===== */
function analyzeHand(hole, board) {
  const code = handCode(hole[0], hole[1]);
  const info = { code, pf: PF[code], label: classLabel(code), outs: 0, outCards: [], draws: [], rel: '' };
  if (board.length === 0) return info;
  const all = hole.concat(board);
  const s = evalCards(all);
  info.score = s; info.cat = s >> 20; info.name = describeScore(s);
  const r1 = hole[0] >> 2, r2 = hole[1] >> 2;
  const bRanks = board.map(c => c >> 2).sort((a, b) => b - a);
  const uniq = [...new Set(bRanks)];
  const topB = bRanks[0];
  const kick = Math.max(r1, r2) === ((s >> 16) & 15) ? Math.min(r1, r2) : Math.max(r1, r2);
  if (board.length === 5 && evalCards(board) === s) info.rel = 'Playing the board';
  else if (info.cat === 1) {
    const pr = (s >> 16) & 15;
    if (r1 === r2 && pr === r1) info.rel = pr > topB ? 'Overpair' : pr < bRanks[bRanks.length - 1] ? 'Underpair' : 'Pocket pair below the top card';
    else if (pr === r1 || pr === r2) {
      if (pr === topB) info.rel = `Top pair, ${kick >= 10 ? 'strong' : kick >= 7 ? 'medium' : 'weak'} kicker`;
      else if (pr === uniq[1]) info.rel = 'Second pair';
      else info.rel = 'Low pair';
    } else info.rel = 'The pair is on the board';
  } else if (info.cat === 2) {
    const bp = bRanks.some((r, i) => bRanks.indexOf(r) !== i);
    info.rel = bp ? 'Two pair, one pair on the board' : (r1 === r2 ? 'Pocket pair plus board pair' : 'Two pair using both cards');
  } else if (info.cat === 3) {
    const tr = (s >> 16) & 15;
    info.rel = (r1 === r2 && r1 === tr) ? 'Set (pocket pair + one on board)' : (r1 === tr || r2 === tr) ? 'Trips (one card in hand)' : 'Trips on the board';
  } else if (info.cat === 0) {
    const overs = [r1, r2].filter(r => r > topB).length;
    info.rel = overs === 2 ? 'Two overcards, no pair' : overs === 1 ? 'One overcard, no pair' : 'No pair';
  }

  if (board.length < 5 && info.cat < 5) {
    const seen = new Uint8Array(52); for (const c of all) seen[c] = 1;
    const outSet = new Set();
    const sc = [0, 0, 0, 0]; for (const c of all) sc[c & 3]++;
    const hs = [0, 0, 0, 0]; for (const c of hole) hs[c & 3]++;
    for (let st = 0; st < 4; st++) {
      if (sc[st] === 4 && hs[st] >= 1) {
        info.draws.push(hs[st] === 2 ? 'Flush draw' : 'Flush draw (one card)');
        for (let r = 0; r < 13; r++) { const c = r * 4 + st; if (!seen[c]) outSet.add(c); }
      } else if (board.length === 3 && sc[st] === 3 && hs[st] === 2) info.draws.push('Backdoor flush draw');
    }
    let rm = 0; for (const c of all) rm |= 1 << (c >> 2);
    let brm = 0; for (const c of board) brm |= 1 << (c >> 2);
    if (info.cat < 4) {
      const outRanks = [];
      for (let x = 0; x < 13; x++) {
        if (rm & (1 << x)) continue;
        const h = straightHigh(rm | (1 << x));
        if (h < 0) continue;
        if (straightHigh(brm | (1 << x)) === h) continue; // the board alone would make it
        outRanks.push(x);
      }
      if (outRanks.length >= 2) info.draws.push('Open-ended straight draw');
      else if (outRanks.length === 1) info.draws.push('Gutshot straight draw');
      for (const x of outRanks) for (let st = 0; st < 4; st++) { const c = x * 4 + st; if (!seen[c]) outSet.add(c); }
    }
    info.outs = outSet.size;
    info.outCards = [...outSet];
    if (info.cat === 0) {
      let ov = 0;
      for (const r of new Set([r1, r2])) if (r > topB) for (let st = 0; st < 4; st++) { const c = r * 4 + st; if (!seen[c] && !outSet.has(c)) ov++; }
      info.overOuts = ov;
    }
    const unseen = 52 - all.length;
    if (info.outs) {
      info.hitNext = info.outs / unseen;
      info.hitRiver = board.length === 3 ? 1 - ((unseen - info.outs) * (unseen - info.outs - 1)) / (unseen * (unseen - 1)) : info.hitNext;
      info.ruleOf = board.length === 3 ? info.outs * 4 : info.outs * 2;
    }
  }
  return info;
}

/* Estimated preflop range (top-% of hands) for an opponent, from their actions and HUD stats */
function estRange(q) {
  const h = q.stats.hands;
  const v = (q.stats.vpip + 0.28 * 10) / (h + 10) * 100;
  const pr = (q.stats.pfr + 0.18 * 10) / (h + 10) * 100;
  switch (q.pre) {
    case 'raise': return clamp(pr * 1.05, 5, 100);
    case '3bet': return clamp(pr * 0.32, 2.5, 45);
    case '4bet': return clamp(pr * 0.14, 2, 20);
    case 'call': return clamp(v * 0.62, 6, 100);
    case 'call3b': return clamp(pr * 0.4, 4, 35);
    case 'limp': return clamp(v, 15, 100);
    case 'complete': return clamp(v * 1.2, 25, 100);
    default: return 100;
  }
}
function rangeReason(q) {

  }
}

/* ===== Situation ===== */
function situation(g, seat) {
  const p = g.players[seat];
  const L = g.legal(seat);
  const live = g.players.filter(q => q.inHand && !q.folded);
  const opps = live.filter(q => q !== p);
  const n = g.players.length;
  const offset = (s) => (s - g.button - 1 + n) % n;
  const ip = opps.every(q => offset(q.seat) < offset(seat));
  const pot = g.potTotal();
  const maxOther = Math.max(0, ...opps.map(q => q.stack + q.betStreet));
  const eff = Math.min(p.stack + p.betStreet, maxOther);
  const callers = g.street === 'preflop' ? g.players.filter(q => q.inHand && !q.folded && (q.pre === 'call')).length : 0;
  return {
    seat, street: g.street, hole: p.hole, board: g.board, pot, toCall: L.toCall, stack: p.stack, bet: p.betStreet,
    currentBet: g.currentBet, L, bb: g.bb, pos: g.pos[seat], nDealt: g.nDealt,
    opps: opps.map(q => ({ seat: q.seat, name: q.name, pre: q.pre, pct: estRange(q), a: q.aggr, c: q.calls, loose: clamp(((q.stats.vpip + 2.8) / (q.stats.hands + 10)) / 0.28, 0.7, 1.7), why: rangeReason(q) })),
    raises: g.raisesThisStreet, limpers: g.limpers, callers, isPFR: g.preflopRaiser === seat, ip, eff, spr: pot > 0 ? eff / pot : 99,
    lastRaiser: g.lastRaiser,
  };
}

/* ===== Decision making (shared by coach and bots) ===== */
function makeRaise(s, to, reasons, kind) {
  const L = s.L;
  if (!L.canRaise) return null;
  to = clamp(roundChips(to), L.minTo, L.maxTo);
  if (to >= L.maxTo * 0.55 + s.bet * 0.45 || L.maxTo - to < s.bb * 2) to = L.maxTo; // commit: just shove
  return { action: 'raise', to, reasons, kind };
}

function decidePreflop(s, st, rnd, eqFn) {
  const code = handCode(s.hole[0], s.hole[1]);
  const pf = PF[code];
  const jit = st.mix ? (1 - st.mix + 2 * st.mix * rnd()) : 1;
  const p = pf.pct;
  const bb = s.bb, stackBB = (s.stack + s.bet) / bb, effBB = s.eff / bb;
  const R = [];
  const label = classLabel(code);
  const ctx = { p, label, pos: s.pos };
  let best, scores;
  const allinCall = s.toCall > 0 && (s.toCall >= s.stack || s.toCall >= s.stack * 0.4);

  if (s.raises === 0) {
    const openT = openRangeFor(s.pos, s.nDealt) * st.loose * jit;
    ctx.openT = openRangeFor(s.pos, s.nDealt);
    if (s.pos === 'BB' && s.toCall === 0) {
      const isoT = 9 * st.aggr * jit;
      if (s.limpers > 0 && p <= isoT) {
        best = makeRaise(s, bb * (3.5 + s.limpers), [`${label} is in the top ${p.toFixed(0)}% of hands. Raise the limpers and play a bigger pot with the best hand.`], 'value');
      }
      if (!best) best = { action: 'check', reasons: [`You're in the big blind and nobody raised. Checking sees a free flop.`] };
      scores = best.action === 'raise' ? { raise: 1, check: 0.6 } : { check: 1, raise: p <= 20 ? 0.6 : 0.3 };
    } else if (effBB <= 13) {
      const pushT = openT * (1 + (13 - effBB) / 13);
      if (p <= pushT) best = { action: 'raise', to: s.L.maxTo, reasons: [`With only ${effBB.toFixed(0)} big blinds, raise all-in or fold. ${label} (top ${p.toFixed(0)}%) is strong enough to shove.`], kind: 'shove' };
      else best = s.toCall === 0 ? { action: 'check', reasons: ['Short stack: check and take a free card.'] } : { action: 'fold', reasons: [`With ${effBB.toFixed(0)} big blinds you're in push-or-fold mode, and ${label} is too weak to shove from ${s.pos}.`] };
      scores = best.action === 'raise' ? { raise: 1, call: 0.3, fold: p <= pushT * 0.7 ? 0 : 0.5, check: 0.4 } : { fold: 1, check: 1, call: 0.2, raise: p <= pushT * 1.3 ? 0.5 : 0.1 };
    } else if (s.limpers === 0) {
      if (p <= openT) {
        const size = s.nDealt === 2 ? 2.5 : s.pos === 'SB' ? 3 : 2.5;
        if (st.limp && rnd() < st.limp) best = { action: 'call', reasons: ['Limp in.'] };
        else best = makeRaise(s, bb * size, [`${label} is in the top ${p.toFixed(0)}% of hands, inside the ${s.pos} opening range (top ${ctx.openT}%).`, `Open-raise to ${size} big blinds. Raising first in wins the blinds often and builds a pot with the initiative.`], 'open');
        if (!best) best = { action: 'call', reasons: ['Call.'] };
      } else {
        best = { action: 'fold', reasons: [`${label} is a top-${p.toFixed(0)}% hand. From ${s.pos} the opening range is about the top ${ctx.openT}%, so this one goes in the muck.`] };
        if (s.pos === 'SB' && st.limp && p <= openT * 1.6 && rnd() < st.limp) best = { action: 'call', reasons: ['Complete the small blind.'] };
      }
      const o = ctx.openT;
      scores = p <= o
        ? { raise: 1, call: 0.4, fold: p <= o * 0.65 ? 0 : 0.5 }
        : { fold: 1, call: p <= o * 1.3 ? 0.4 : 0.1, raise: p <= o * 1.3 ? 0.5 : p <= o * 1.8 ? 0.25 : 0 };
    } else {
      const isoT = openT * 0.6, limpT = openT * 1.25;
      ctx.openT = openRangeFor(s.pos, s.nDealt);
      if (p <= isoT) best = makeRaise(s, bb * (3.5 + s.limpers), [`${s.limpers} player${s.limpers > 1 ? 's' : ''} limped. ${label} (top ${p.toFixed(0)}%) is strong enough to raise and isolate them.`, `Raise to about ${3.5 + s.limpers} big blinds: one extra big blind per limper.`], 'iso');
      if (!best && p <= limpT && (code.length === 2 || code[2] === 's')) best = { action: 'call', reasons: [`Limpers ahead and a cheap price. ${label} plays well in multiway pots, so overlimping is fine.`] };
      if (!best) best = { action: 'fold', reasons: [`Even against limpers, ${label} (top ${p.toFixed(0)}%) is too weak from ${s.pos}.`] };
      const o = ctx.openT;
      scores = best.action === 'raise' ? { raise: 1, call: 0.6, fold: 0.2 } : best.action === 'call' ? { call: 1, raise: 0.6, fold: 0.6 } : { fold: 1, call: p <= o * 1.5 ? 0.5 : 0.2, raise: 0.3 };
    }
  } else if (s.raises === 1) {
    const raiser = s.opps.find(o => o.seat === s.lastRaiser) || s.opps[0];
    const Rr = raiser ? raiser.pct : 20;
    ctx.raiserRange = Rr; ctx.raiser = raiser && raiser.name;
    const threeT = Math.max(2.6, Rr * 0.2) * st.aggr * jit;
    let callT = (s.pos === 'BB' ? Rr * 0.85 : s.pos === 'SB' ? Rr * 0.38 : Rr * 0.5) * st.callLoose * jit;
    if (s.callers > 0) callT *= 0.85;
    ctx.threeT = Math.max(2.6, Rr * 0.2); ctx.callT = (s.pos === 'BB' ? Rr * 0.85 : s.pos === 'SB' ? Rr * 0.38 : Rr * 0.5);
    const rName = raiser ? raiser.name : 'The raiser';
    if (allinCall || effBB <= 20) {
      const eq = eqFn([{ pct: Rr }]);
      const need = s.toCall / (s.pot + s.toCall);
      ctx.eq = eq; ctx.need = need;
      if (effBB <= 20 && !allinCall && p <= threeT * 1.7) best = { action: 'raise', to: s.L.maxTo, reasons: [`${rName} opened and you have about ${effBB.toFixed(0)} big blinds. ${label} is strong enough to re-raise all-in.`], kind: 'shove' };
      else if (eq >= need * st.callAdj) best = { action: 'call', reasons: [`${rName}'s range is about the top ${Rr.toFixed(0)}%. Against it ${label} has ${pctStr(eq)} equity and you need ${pctStr(need)} to call.`] };
      else best = { action: 'fold', reasons: [`Against ${rName}'s range (top ${Rr.toFixed(0)}%) ${label} has ${pctStr(eq)} equity, short of the ${pctStr(need)} the price requires.`] };
      const m = eq - need;
      scores = best.action === 'raise' ? { raise: 1, call: 0.6, fold: 0.2 } : best.action === 'call' ? { call: 1, raise: 0.7, fold: m > 0.06 ? 0 : 0.5 } : { fold: 1, call: m > -0.05 ? 0.5 : 0, raise: 0.1 };
    } else if (p <= threeT) {
      const mult = s.ip ? 3 : 3.6;
      best = makeRaise(s, s.currentBet * mult + s.callers * s.currentBet, [`${rName} opened (range about the top ${Rr.toFixed(0)}%). ${label} is ahead of that range, so re-raise (3-bet) for value.`, `${s.ip ? 'In position' : 'Out of position'} the 3-bet is about ${mult}× the open.`], '3bet');
      if (!best) best = { action: 'call', reasons: ['Call.'] };
      scores = { raise: 1, call: 0.6, fold: 0 };
    } else if (p <= callT) {
      best = { action: 'call', reasons: [s.pos === 'BB' ? `You already have a big blind in, so the price is good. ${label} defends against an open from a top-${Rr.toFixed(0)}% range.` : `${label} is strong enough to call ${rName}'s open (range about the top ${Rr.toFixed(0)}%), but not to re-raise.`] };
      if (st.aggr > 1 && rnd() < (st.aggr - 1) * 0.3) best = makeRaise(s, s.currentBet * 3.2, ['Light 3-bet.'], '3bet') || best;
      scores = { call: 1, raise: p <= callT * 0.6 ? 0.6 : 0.35, fold: p <= callT * 0.6 ? 0.1 : 0.5 };
    } else {
      best = { action: 'fold', reasons: [`${rName} opened with a range of about the top ${Rr.toFixed(0)}%. ${label} (top ${p.toFixed(0)}%) is behind that range and too weak to continue from ${s.pos}.`] };
      scores = { fold: 1, call: p <= ctx.callT * 1.35 ? 0.5 : 0.1, raise: 0.15 };
    }
  } else {
    const raiser = s.opps.find(o => o.seat === s.lastRaiser) || s.opps[0];
    const Rr = raiser ? raiser.pct : 5;
    ctx.raiserRange = Rr; ctx.raiser = raiser && raiser.name;
    const rName = raiser ? raiser.name : 'Your opponent';
    const fourT = Math.max(2.3, Rr * 0.4) * st.aggr * jit;
    const callT = Math.max(4.5, Rr * 0.9) * st.callLoose * jit;
    const eq = eqFn([{ pct: Rr }]);
    const need = s.toCall / (s.pot + s.toCall);
    ctx.eq = eq; ctx.need = need;
    if (allinCall) {
      if (eq >= need * st.callAdj) best = { action: 'call', reasons: [`${rName} has re-raised with a range of about the top ${Rr.toFixed(1)}%. ${label} has ${pctStr(eq)} equity against it; the price needs ${pctStr(need)}.`] };
      else best = { action: 'fold', reasons: [`${rName}'s re-raise shows a strong range (top ${Rr.toFixed(1)}%). ${label} has ${pctStr(eq)} equity but needs ${pctStr(need)}.`] };
      const m = eq - need;
      scores = best.action === 'call' ? { call: 1, raise: 0.9, fold: m > 0.06 ? 0 : 0.5 } : { fold: 1, call: m > -0.05 ? 0.5 : 0, raise: 0.1 };
    } else if (p <= fourT) {
      best = makeRaise(s, s.currentBet * 2.3, [`${rName}'s re-raise range is about the top ${Rr.toFixed(1)}%. ${label} is at the very top of it, so raise again.`], '4bet');
      if (!best) best = { action: 'call', reasons: ['Call.'] };
      scores = { raise: 1, call: 0.6, fold: 0 };
    } else if (p <= callT && s.toCall <= s.stack * 0.3) {
      best = { action: 'call', reasons: [`${label} has ${pctStr(eq)} equity against ${rName}'s top-${Rr.toFixed(1)}% range and stacks are deep enough to call and play the flop.`] };
      scores = { call: 1, raise: 0.4, fold: 0.5 };
    } else {
      best = { action: 'fold', reasons: [`Facing a re-raise, ${rName}'s range is narrow (about the top ${Rr.toFixed(1)}%). ${label} has ${pctStr(eq)} equity and you'd need ${pctStr(need)}: fold.`] };
      scores = { fold: 1, call: eq >= need ? 0.5 : 0.15, raise: 0.1 };
    }
  }
  if (!best) best = s.toCall === 0 ? { action: 'check', reasons: [] } : { action: 'fold', reasons: [] };
  best.scores = scores || {}; best.ctx = ctx; best.street = 'preflop';
  return best;
}

function valueEqFor(opps) { return opps === 1 ? 0.6 : Math.min(0.6, 1.3 / (opps + 1) + 0.05); }

function decidePostflop(s, st, rnd, eq, an) {
  const nO = s.opps.length;
  const need = s.toCall > 0 ? s.toCall / (s.pot + s.toCall) : 0;
  const drawy = an.outs >= 8 && s.street !== 'river';
  const valueEq = valueEqFor(nO) * st.valueMult;
  const ctx = { eq, need, valueEq, nO, drawy };
  const potBB = s.pot;
  let best, scores;
  const mix = st.mix ? rnd() : 0.5;
  const bluffOK = nO === 1 ? 1 : nO === 2 ? 0.45 : 0.15;
  if (s.toCall === 0) {
    if (eq >= valueEq) {
      const f = s.street === 'river' ? 0.7 : eq > 0.82 ? 0.75 : 0.6;
      best = makeRaise(s, potBB * f, [`You have ${pctStr(eq)} equity against ${nO === 1 ? 'your opponent\'s' : `${nO} opponents'`} likely hands, above the ~${pctStr(valueEqFor(nO))} needed to bet for value${nO > 1 ? ' in a multiway pot' : ''}.`, `Bet about ${Math.round(f * 100)}% of the pot so worse hands pay you.`], 'value');
      if (best && st.aggr < 1 && rnd() > 0.55 + 0.45 * st.aggr) best = null;
      if (best && st.key !== 'coach' && eq > 0.85 && rnd() < 0.12) best = null; // occasional slowplay
    } else if (drawy && nO <= 2 && (st.key === 'coach' ? an.outs >= 9 || nO === 1 : rnd() < st.semi)) {
      best = makeRaise(s, potBB * 0.55, [`You have ${an.outs} outs (${an.draws.join(', ').toLowerCase()}). A semi-bluff can win the pot now, and you still improve often when called.`], 'semi');
    } else if (s.isPFR && s.street === 'flop' && nO === 1 && eq >= 0.38 && (st.key === 'coach' || rnd() < 0.65 * st.aggr)) {
      best = makeRaise(s, potBB * 0.33, [`You raised before the flop, so your opponent expects strength. A small continuation bet (a third of the pot) wins often heads-up.`], 'cbet');
    } else if (st.key !== 'coach' && rnd() < st.bluff * bluffOK) {
      best = makeRaise(s, potBB * (st.key === 'maniac' && rnd() < 0.3 ? 1.1 : 0.6), ['Bluff.'], 'bluff');
    }
    if (!best) best = { action: 'check', reasons: [eq >= 0.4 * (2 / (nO + 1)) ? `You have showdown value (${pctStr(eq)} equity) but betting mostly gets called by better hands. Check and keep the pot small.` : `With ${pctStr(eq)} equity and no strong draw, there's nothing to bet for. Check.`] };
    const k = best.kind;
    scores = best.action === 'raise'
      ? (k === 'value' ? { raise: 1, check: eq > 0.8 ? 0.6 : 0.4 } : { raise: 1, check: 0.75 })
      : { check: 1, raise: drawy ? 0.75 : eq >= valueEq * 0.85 ? 0.6 : 0.3 };
  } else {
    let needAdj = need * (drawy ? (s.street === 'flop' ? 0.82 : 0.92) : 1);
    ctx.needAdj = needAdj;
    const botNeed = needAdj * st.callAdj;
    const raiseEq = Math.max(0.62, valueEq + 0.12) * st.valueMult;
    const callAmt = Math.min(s.toCall, s.stack);
    if (eq >= botNeed) {
      if (s.L.canRaise && eq >= raiseEq && (st.aggr >= 1 || rnd() < st.aggr)) {
        best = makeRaise(s, s.currentBet + (s.pot + s.toCall) * 0.8, [`Even against a betting range you have ${pctStr(eq)} equity. Raise for value instead of just calling.`], 'value');
      }
      if (!best && st.key !== 'coach' && st.aggr > 1 && s.L.canRaise && (drawy || eq > 0.5) && rnd() < (st.aggr - 1) * 0.3) best = makeRaise(s, s.currentBet * 2.8, ['Raise.'], 'semi');
      if (!best) best = { action: 'call', reasons: [`Calling ${callAmt.toLocaleString()} to win ${s.pot.toLocaleString()} means you need ${pctStr(need)} equity. You have about ${pctStr(eq)}${drawy ? `, and your draw can win more on later streets (implied odds)` : ''}. Call.`] };
    } else {
      if (st.key !== 'coach' && nO === 1 && s.L.canRaise && rnd() < st.bluff * 0.25 * (drawy ? 2 : 1)) best = makeRaise(s, s.currentBet * 2.6, ['Bluff raise.'], 'bluff');
      if (!best) best = { action: 'fold', reasons: [`You need ${pctStr(needAdj)} equity to call ${callAmt.toLocaleString()}${drawy ? ' (implied odds included)' : ''}, but you only have about ${pctStr(eq)} against hands that bet like this. Fold.`] };
    }
    const m = eq - needAdj;
    if (best.action === 'fold') scores = { fold: 1, call: m > -0.04 ? 0.6 : m > -0.1 ? 0.25 : 0, raise: drawy ? 0.25 : 0.05 };
    else if (best.action === 'call') scores = { call: 1, fold: m < 0.04 ? 0.6 : m < 0.12 ? 0.25 : 0, raise: eq >= raiseEq * 0.85 ? 0.75 : drawy ? 0.5 : 0.25 };
    else scores = { raise: 1, call: 0.75, fold: 0 };
  }
  best.scores = scores; best.ctx = ctx; best.street = s.street;
  return best;
}

function decide(g, seat, st, opts = {}) {
  const s = situation(g, seat);
  const rnd = Math.random;
  const iters = opts.iters || 300;
  let res;
  if (s.street === 'preflop') {
    res = decidePreflop(s, st, rnd, (opps) => equityMC(s.hole, [], opps, iters));
  } else {
    const an = analyzeHand(s.hole, s.board);
    const eq = equityMC(s.hole, s.board, s.opps, iters);
    res = decidePostflop(s, st, rnd, eq, an);
    res.an = an; res.eq = eq;
  }
  res.s = s;
  // legalize
  const L = s.L;
  if (res.action === 'fold' && L.toCall === 0) res.action = 'check';
  if (res.action === 'call' && L.toCall === 0) res.action = 'check';
  if (res.action === 'check' && L.toCall > 0) res.action = 'fold';
  if (res.action === 'raise' && !L.canRaise) res.action = L.toCall > 0 ? 'call' : 'check';
  if (res.action === 'raise') res.to = clamp(res.to, L.minTo, L.maxTo);
  return res;
}

// Coach view: richer numbers for the hero's decision
function coachView(g, seat) {
  const s = situation(g, seat);
  const st = STYLES.coach;
  const an = analyzeHand(s.hole, s.board);
  const out = { s, an };
  const activeOpps = s.opps;
  const eqRandom = s.board.length === 0 && activeOpps.length <= 3
    ? (activeOpps.length === 1 ? an.pf.hu : activeOpps.length === 3 ? an.pf.m : equityMC(s.hole, s.board, activeOpps.map(() => ({ pct: 100 })), 1200))
    : equityMC(s.hole, s.board, activeOpps.map(() => ({ pct: 100 })), 1500);
  out.eqRandom = eqRandom;
  const entered = activeOpps.filter(o => o.pre !== 'none' || s.street !== 'preflop');
  out.eqRange = s.street === 'preflop' && entered.length === 0 ? null : equityMC(s.hole, s.board, s.street === 'preflop' ? entered : activeOpps, 2500);
  if (s.street === 'preflop') {
    out.advice = decidePreflop(s, st, Math.random, (opps) => equityMC(s.hole, [], opps, 1500));
  } else {
    out.advice = decidePostflop(s, st, Math.random, out.eqRange, an);
  }
  out.advice.s = s;
  out.need = s.toCall > 0 ? s.toCall / (s.pot + s.toCall) : 0;
  return out;
}

function gradeOf(score) {
  if (score >= 0.95) return { key: 'good', label: 'Good' };
  if (score >= 0.7) return { key: 'okay', label: 'Okay' };
  if (score >= 0.45) return { key: 'close', label: 'Close call' };
  if (score >= 0.2) return { key: 'loose', label: 'Questionable' };
  return { key: 'bad', label: 'Mistake' };
}

function gradeNote(adv, act, eq) {
  const a = adv.action, c = adv.ctx || {};
  if (act === a) return adv.reasons[0] || '';
  const verb = { fold: 'folding', call: 'calling', check: 'checking', raise: adv.s && adv.s.toCall > 0 ? 'raising' : 'betting' };
  const coachVerb = { fold: 'fold', call: 'call', check: 'check', raise: adv.s && adv.s.toCall > 0 ? 'raise' : 'bet' }[a];
  if (adv.street === 'preflop') {
    if (act === 'fold' && (a === 'raise' || a === 'call')) return `${c.label} is a top-${c.p.toFixed(0)}% hand: playable here. The coach would ${coachVerb}.`;
    if (act !== 'fold' && a === 'fold') return `${c.label} (top ${c.p.toFixed(0)}%) is weaker than this spot calls for${c.openT && !c.raiserRange ? ` (the ${c.pos} opening range is about the top ${c.openT}%)` : c.raiserRange ? ` against a range of about the top ${c.raiserRange.toFixed(0)}%` : ''}. Folding saves chips.`;
    if (act === 'call' && a === 'raise') return c.raiserRange ? `${c.label} is strong enough to re-raise for value, not just call.` : `Limping gives up the initiative. Raise or fold when you're first in.`;
    if (act === 'raise' && a === 'call') return `Raising works, but ${c.label} plays better as a call here; re-raising mostly folds out weaker hands and gets called by better ones.`;
    if (act === 'check' && a === 'raise') return `With ${c.label} and limpers in the pot, a raise builds a bigger pot while you're ahead.`;
    if (act === 'raise' && a === 'check') return `A raise from the big blind is fine with a strong hand; ${c.label} plays fine as a check.`;
    return `The coach would ${coachVerb} instead.`;
  }
  const need = c.needAdj !== undefined ? c.needAdj : c.need;
  if (act === 'fold' && a !== 'fold') return `You folded with ${pctStr(eq)} equity when the price only needed ${pctStr(need)}. That's a profitable ${a === 'raise' ? 'raise' : 'call'} thrown away.`;
  if (act === 'call' && a === 'fold') return `You needed ${pctStr(need)} equity to call and had about ${pctStr(eq)}. Over many hands this call loses chips.`;
  if (act === 'call' && a === 'raise') return `Calling is fine, but with ${pctStr(eq)} equity a raise wins more from worse hands.`;
  if (act === 'raise' && a === 'call') return `Raising with ${pctStr(eq)} equity mostly gets action from better hands. Calling keeps their bluffs in.`;
  if (act === 'raise' && a === 'fold') return `This raise is a bluff with ${pctStr(eq)} equity. It can work against a cautious player, but the coach would fold.`;
  if (act === 'check' && a === 'raise') return adv.kind === 'value' ? `You checked with ${pctStr(eq)} equity. Betting would get value from worse hands.` : `Checking is fine. The coach would ${adv.kind === 'cbet' ? 'continuation-bet' : 'semi-bluff'} here, but it's optional.`;
  if (act === 'raise' && a === 'check') return eq >= (c.valueEq || 0.6) * 0.85 ? `A thin value bet. Reasonable, but checking controls the pot.` : `Betting with ${pctStr(eq)} equity is a bluff; it gets called mostly by better hands.`;
  return `The coach would ${coachVerb}.`;
}

/* ===== Game engine ===== */
class Game {
  constructor({ players, sb, bb }) {
    this.players = players.map((p, i) => Object.assign({
      seat: i, stack: 0, hole: [], folded: false, allIn: false, inHand: false, betStreet: 0, committed: 0,
      hasActed: false, canRaise: true, lastAction: null, pre: 'none', aggr: 0, calls: 0,

/* ---------- game flow ---------- */
function botDelay() {
  const hero = S.game.players[0];
  let d = SPEED[S.settings.speed] || 760;
  if (!hero.inHand || hero.folded) d *= 0.55;
  return d * (0.75 + Math.random() * 0.5);
}
function startNextHand() {
  clearTimeout(S.timer);
  const g = S.game, start = S.settings.stackBB * BB;
  for (const p of g.players) if (!p.isHuman && p.stack === 0) { p.stack = start; p.rebuys = (p.rebuys || 0) + 1; }
  if (g.players[0].stack === 0) { renderControls(); return; }
  S.handDecisions = []; S.runoutShown = false; S.coach = null;
  if (!g.startHand()) return;
  S.seatEls.forEach(e => { e.eqb.hidden = true; e.bubble.hidden = true; });
  $('#board').innerHTML = '';
  renderBoard(false);
  setNote('');
  renderAll(); placeDealer();
  renderAllHoles(true);
  g.players.forEach((p, i) => { if (p.lastAction && p.lastAction.type === 'post') { S.seatEls[i].bubble.hidden = true; } });
  renderControls(); renderCoach(); renderLog();
  S.timer = setTimeout(proceed, 520);
}
function proceed() {
  const g = S.game; clearTimeout(S.timer);
  if (g.handOver) { onHandOver(); return; }
  if (g.toAct < 0 || g.roundComplete()) {
    if (g.allInRunout() && !S.runoutShown) {
      S.runoutShown = true;
      collectBets(() => { revealLive(); showEquities(); setNote('All-in. <b>Running it out.</b>'); renderAll(); });
      S.timer = setTimeout(proceed, 1500);
      return;
    }
    renderSeats(); renderControls();
    S.timer = setTimeout(() => collectBets(() => {
      g.nextStreet();
      if (g.handOver) { renderBoard(true); onHandOver(); return; }
      clearBubbles(true);
      renderBoard(true); renderAll();
      if (S.runoutShown) showEquities();
      renderLog();
      S.timer = setTimeout(proceed, S.runoutShown ? 1300 : 480);
    }), 380);
    return;
  }
  const p = g.players[g.toAct];
  renderSeats(); renderPot();
  if (p.isHuman) {
    renderControls();
    S.coach = null; renderCoach(true);
    setTimeout(() => {
      if (!heroTurn()) return;
      S.coach = coachView(g, 0);
      renderCoach(); renderControls();
    }, 30);
    return;
  }
  renderControls(); renderCoach();
  S.timer = setTimeout(() => {
    const d = decide(g, p.seat, STYLES[p.style], { iters: 320 });
    g.act(p.seat, d.action, d.to);
    showBubble(p.seat);
    if (p.folded) renderHole(p.seat, null, false);
    renderAll(); renderLog();
    proceed();
  }, botDelay());
}
function heroAct(type) {
  if (!heroTurn()) return;
  const g = S.game, L = g.legal(0), hero = g.players[0];
  if (type === 'fold' && L.toCall === 0) return;
  if (type === 'raise' && !L.canRaise) return;

  const gr = gradeOf(score);

  const boardBefore = g.board.slice(), street = g.street;
  g.act(0, type, type === 'raise' ? S.size : undefined);
  const dec = { hand: g.handNo, street, pos: g.pos[0], hole: hero.hole.slice(), board: boardBefore, you: hero.lastAction.text, coach: adviceText(adv), score, grade: gr.key, label: gr.label, note, eq: cv.eqRange, need: cv.need };

/* ---------- coach panel ---------- */
const MODE_HELP = {

}

    } else {

}

function sparkSVG(vals) {
  const W = 340, H = 96, pl = 30, pr = 8, pt = 8, pb = 16;

  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi - lo < 10) { const m = (hi + lo) / 2; lo = m - 5; hi = m + 5; }
  const x = i => pl + (W - pl - pr) * i / (vals.length - 1);
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const last = vals[vals.length - 1];
  const col = last >= 0 ? 'var(--good)' : 'var(--bad)';
  const area = `${x(0).toFixed(1)},${y(0).toFixed(1)} ${pts} ${x(vals.length - 1).toFixed(1)},${y(0).toFixed(1)}`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Session result over ${vals.length - 1} hands, now ${last.toFixed(1)} big blinds">
    <line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${pl - 4}" y="${y(hi) + 4}" text-anchor="end">${Math.round(hi)}</text><text x="${pl - 4}" y="${y(0) + 3}" text-anchor="end">0</text><text x="${pl - 4}" y="${y(lo) + 2}" text-anchor="end">${Math.round(lo)}</text>
    <polygon points="${area}" fill="${col}" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${x(vals.length - 1)}" cy="${y(last)}" r="3" fill="${col}"/>
    <text x="${W - pr}" y="${H - 3}" text-anchor="end">${vals.length - 1} hands</text>
  </svg>`;
}

  B.querySelector('#sFour').onchange = e => { st.fourColor = e.target.checked; applyDeck(); save(); };
  B.querySelector('#sAuto').onchange = e => { st.autoDeal = e.target.checked; renderControls(); save(); };
  B.querySelector('#sApply').onclick = () => {
    const row = $('#resetRow');
    if (!S.confirmReset) {
      S.confirmReset = true;
      row.innerHTML = `<span class="confirm">This clears your stacks, stats and review history.</span><button class="btn-primary" type="button" id="sConfirm">Reset and deal</button><button class="btn-line" type="button" id="sCancel">Keep playing</button>`;
      $('#sConfirm').onclick = () => {
        st.opponents = +B.querySelector('#sOpp').value; st.lineup = B.querySelector('#sLine').value; st.stackBB = +B.querySelector('#sStack').value;
        S.confirmReset = false; closeModals(); clearTimeout(S.timer);
        newSession(); buildSeats(); layoutTable(); save(); startNextHand(); setTab(S.tab);
      };
      $('#sCancel').onclick = () => { S.confirmReset = false; buildSettings(); };
    }
  };
}
function applyDeck() { document.body.classList.toggle('two-color', !S.settings.fourColor); }

/* ---------- events ---------- */
function bindEvents() {
  $('#bFold').onclick = () => heroAct('fold');
  $('#bCall').onclick = () => heroAct('call');
  $('#bRaise').onclick = () => heroAct('raise');
  $('#bNext').onclick = () => startNextHand();
  $('#bRebuy').onclick = () => {
    const g = S.game, add = S.settings.stackBB * BB;
    g.players[0].stack += add; S.heroBuyins += add; save();
    startNextHand();
  };
  $('#autoDeal').onchange = e => { S.settings.autoDeal = e.target.checked; save(); if (S.game.handOver && e.target.checked && S.game.players[0].stack > 0) { clearTimeout(S.timer); S.timer = setTimeout(startNextHand, 1500); } else if (!e.target.checked && S.game.handOver) clearTimeout(S.timer); renderControls(); };
  $('#sizeRange').oninput = e => setSize(e.target.value);
  $('#sizeInput').onchange = e => setSize(e.target.value);
  $('#presets').onclick = e => { const b = e.target.closest('button'); if (b) setSize(b.dataset.to); };
  document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => {
    S.settings.coachMode = b.dataset.mode; save();
    if (heroTurn() && !S.coach) S.coach = coachView(S.game, 0);
    renderCoach(); if (heroTurn()) renderControls();
  });
  ['coach', 'review', 'log', 'stats'].forEach(k => $('#tab-' + k).onclick = () => setTab(k));
  $('#openRanks').onclick = () => { buildRanks(); openModal('ranks'); };
  $('#openChart').onclick = () => { if (S.game && S.game.pos && S.game.pos[0] && OPEN_RANGE[S.game.pos[0]]) S.chartPos = S.game.pos[0]; buildChart(); openModal('chart'); };
  $('#openSettings').onclick = () => { S.confirmReset = false; buildSettings(); openModal('settings'); };
  document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) closeModals(); }));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModals(); return; }
    if (document.querySelector('.overlay:not([hidden])')) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (heroTurn()) {
      if (k === 'f' && !$('#bFold').disabled) heroAct('fold');
      else if (k === 'c' || k === 'k') heroAct('call');
      else if (k === 'r' || k === 'b') { if (!$('#bRaise').disabled) heroAct('raise'); }
    } else if (S.game.handOver && (k === ' ' || k === 'n' || k === 'enter') && tag !== 'button') {
      e.preventDefault();
      if (S.game.players[0].stack > 0) startNextHand();
    }
  });
  const ro = new ResizeObserver(() => layoutTable());
  ro.observe($('#table'));
}

/* ---------- boot ---------- */
function start(hotData) {
  const saved = (hotData && hotData.session ? hotData : null) || loadSaved();
  if (saved && saved.settings) S.settings = Object.assign({ ...DEFAULTS }, saved.settings);
  if (!(saved && restoreSession(saved))) newSession();
  applyDeck();
  buildSeats();
  bindEvents();
  layoutTable();
  renderReviewCount();
  startNextHand();
  requestAnimationFrame(layoutTable);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutTable);
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => serialize()); } catch (e) { /* no hot reload */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start(window.claude && window.claude.hot ? window.claude.hot.data : null);

</script>
</body>
